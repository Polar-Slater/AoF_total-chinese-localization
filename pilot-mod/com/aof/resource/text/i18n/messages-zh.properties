SOUL_TROPHY_HINT=<html><body>\u4f60\u7684\u6b7b\u7075\u6cd5\u5e08\u82f1\u96c4\u6355\u83b7\u4e86<u>\u7075\u9b42</u>\u6218\u5229\u54c1\uff01<br><br>\u7075\u9b42\u6218\u5229\u54c1\u53ef\u63d0\u4f9b\u5404\u79cd\u6548\u679c\u548c\u52a0\u6210\u3002<br>\u5b83\u4eec\u5fc5\u987b\u5728\u6218\u6597\u524d\u88c5\u5907\uff0c\u5e76\u4f1a\u5728\u6218\u6597\u7ed3\u675f\u540e\u6d88\u5931\u3002<br><br>\u51fb\u6740\u654c\u65b9\u5355\u4f4d\u65f6\uff0c\u5076\u5c14\u80fd\u591f\u6355\u83b7\u7075\u9b42\u3002<br>\u6218\u5229\u54c1\u7684\u7c7b\u578b\u53d6\u51b3\u4e8e\u88ab\u51fb\u6740\u7684\u654c\u4eba\u3002<br><br><i>\u6355\u83b7\u7684\u7075\u9b42\u5217\u4e8e\u7269\u54c1\u680f\u7684\u201c\u5176\u4ed6\u201d\u9009\u9879\u5361\u4e2d\u3002</i></body></html>
HERO_ITEMS_HINT=<html><body>Age of Fear \u7684\u4e16\u754c\u4e2d\u6709\u8bb8\u591a\u5f3a\u5927\u7684\u5b9d\u7269\uff0c\u53ea\u6709\u82f1\u96c4\u624d\u80fd\u4f7f\u7528\u3002<br><br>\u5b9d\u7269\u53ef\u63d0\u5347\u5355\u4f4d\u7684\u5c5e\u6027\uff0c\u4e5f\u53ef\u80fd\u8d4b\u4e88\u65b0\u7684\u6280\u80fd\u548c\u80fd\u529b\u3002<br><br>\u6e38\u620f\u4e2d\u7684\u5927\u90e8\u5206\u7269\u54c1\u4e3a\u968f\u673a\u6389\u843d\uff0c\u56e0\u6b64\u6bcf\u6b21\u6218\u5f79\u7684\u6536\u83b7\u90fd\u4f1a\u5927\u4e0d\u76f8\u540c\u3002<br><br>{0}<br>\u6700\u5f3a\u5927\u7684\u7269\u54c1\u88ab\u79f0\u4e3a\u5723\u7269\uff0c\u5f80\u5f80\u80fd\u8d4b\u4e88\u72ec\u4e00\u65e0\u4e8c\u7684\u6cd5\u672f\u548c\u80fd\u529b\u3002<br>{1}<br><i>\u8981\u88c5\u5907\u7269\u54c1\uff0c\u8bf7\u70b9\u51fb\u53f3\u4fa7\u7684\u201c\u88c5\u5907\u201d\u6309\u94ae\u3002</i></body></html>
POTIONS_TUTORIAL_HINT=<html><body>\u82f1\u96c4\u53ef\u4ee5\u4f7f\u7528\u4efb\u4f55\u7269\u54c1\u6216\u5b9d\u7269\uff0c\u666e\u901a\u5355\u4f4d\u5219\u53ea\u80fd\u4f7f\u7528\u836f\u5242\u3002<br>\uff08\u53ef\u5728\u201c\u5176\u4ed6\u201d\u9009\u9879\u4e2d\u66f4\u6539\u6b64\u8bbe\u7f6e\u3002\uff09<br><br>{0}<br>\u836f\u5242\u4ef7\u683c\u4e0d\u83f2\uff0c\u4f46\u5728\u6218\u6597\u4e2d\u80fd\u53d1\u6325\u5f88\u5927\u7684\u4f5c\u7528\u3002<br><br>{1}<br><br>\u6bcf\u4e2a\u5355\u4f4d\u6700\u591a\u53ef\u643a\u5e26\u4e24\u74f6\u836f\u5242\u3002<br></body></html>
PERMENENT_WOUNDS_TUTORIAL_HINT=<html><body>\u5355\u4f4d\u53ef\u80fd\u5728\u6218\u6597\u4e2d\u53d7\u4f24\u3002\u6709\u4e9b\u4f24\u52bf\u96be\u4ee5\u75ca\u6108\uff0c\u9700\u8981\u7ecf\u9a8c\u4e30\u5bcc\u7684\u6cbb\u7597\u8005\u6216\u4fee\u7406\u5e08\u534f\u52a9\u3002\u91cd\u4f24\u4f1a\u964d\u4f4e\u5355\u4f4d\u7684\u5c5e\u6027\uff0c\u76f4\u5230\u6cbb\u6108\u4e3a\u6b62\u3002<br><br>{0}<br>\u6cbb\u7597\u91cd\u4f24\u9700\u8981\u82b1\u8d39\u5c11\u91cf\u91d1\u5e01\uff0c\u4e14\u8be5\u5355\u4f4d\u65e0\u6cd5\u53c2\u52a0\u4e0b\u4e00\u573a\u6218\u6597\u3002<br>\uff08\u62e5\u6709\u201c\u575a\u6bc5\u201d\u5c5e\u6027\u7684\u5355\u4f4d\u65e0\u9700\u4f11\u517b\u3002\uff09<br><br>\u67d0\u4e9b\u6280\u80fd\u548c\u7269\u54c1\u53ef\u964d\u4f4e\u53d7\u5230\u91cd\u4f24\u7684\u6982\u7387\u3002<br><br>\u8981\u6cbb\u7597\u91cd\u4f24\uff0c\u8bf7\u6253\u5f00\u8be5\u5355\u4f4d\u7684\u201c\u6280\u80fd\u201d\u9009\u9879\u3002<br><br></body></html>
SHOP_TUTORIAL_RECRUITMENT_HINT=<html><body>\u8fd9\u91cc\u662f\u62db\u52df\u754c\u9762\uff0c\u6240\u6709\u519b\u961f\u7ba1\u7406\u64cd\u4f5c\u90fd\u53ef\u5728\u6b64\u8fdb\u884c\u3002<br><br>\u62db\u52df\u754c\u9762\u5206\u4e3a\u4e09\u4e2a\u533a\u57df\uff1a<br><br>- <b>\u62db\u52df\u9762\u677f</b>\uff08\u5de6\u4e0a\u65b9\uff09\uff1a\u53ef\u62db\u52df\u6216\u67e5\u770b\u90e8\u961f\u3002<br>\u9876\u90e8\u663e\u793a\u53ef\u7528\u8d44\u6e90\uff08\u8d44\u91d1\uff09\u548c\u5f53\u524d\u961f\u4f0d\u4eba\u6570\u4e0a\u9650\u3002<br>\u62db\u52df\u5355\u4f4d\u9700\u8981\u91d1\u5e01\uff0c\u800c\u6e38\u620f\u4e2d\u7684\u91d1\u5e01\u6570\u91cf\u6709\u9650\uff0c<br>\u56e0\u6b64\u8bf7\u5408\u7406\u89c4\u5212\u5f00\u652f\u3002<br><br>- <b>\u5355\u4f4d\u9762\u677f</b>\uff08\u53f3\u4e0a\u65b9\uff09\uff1a\u663e\u793a\u5355\u4f4d\u8be6\u60c5\u3002<br>\u70b9\u51fb\u5c5e\u6027\u53ef\u67e5\u770b\u66f4\u591a\u63d0\u793a\u3002<br><br>- <b>\u73a9\u5bb6\u519b\u961f\u9762\u677f</b>\uff08\u4e0b\u65b9\uff09\uff1a\u70b9\u51fb\u5355\u4f4d\u56fe\u6807\u4ee5\u9009\u4e2d\uff0c<br>\u518d\u6b21\u70b9\u51fb\u53ef\u53d6\u6d88\u9009\u62e9\u3002<br><br>\u9009\u4e2d\u7684\u5355\u4f4d\u53ef\u4ee5\u89e3\u6563\uff08\u201c\u89e3\u6563\u201d\u6309\u94ae\uff09\u6216\u5347\u7ea7\uff08\u201c\u6280\u80fd\u201d\u6309\u94ae\uff09\u3002<br>\u8bf7\u6ce8\u610f\uff1a\u89e3\u6563\u7684\u5355\u4f4d\u4f1a\u6c38\u4e45\u79bb\u5f00\uff0c\u5176\u6218\u6597\u7ecf\u9a8c\u4e0e\u62db\u52df\u82b1\u8d39<br>\u4e5f\u65e0\u6cd5\u6536\u56de\u3002<br></body></html>
