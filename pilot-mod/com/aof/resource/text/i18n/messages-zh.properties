GATHERING_RESOURCES_HINT=<html><body>\u6bcf\u573a\u6218\u6597\u7ed3\u675f\u540e\uff0c\u90e8\u961f\u90fd\u4f1a\u641c\u5bfb\u53ef\u7528\u7684\u7269\u54c1\u548c\u6750\u6599\u3002<br>\u83b7\u5f97\u7684\u6750\u6599\u79cd\u7c7b\u53d6\u51b3\u4e8e\u5730\u5f62\u548c\u654c\u4eba\u7c7b\u578b\u3002<br><br>- \u8611\u83c7\u3001\u6839\u830e\u7b49\u690d\u7269\u6750\u6599\u53ef\u5728\u6d1e\u7a74\u3001\u6cbc\u6cfd\u548c\u68ee\u6797\u4e2d\u627e\u5230\u3002<br>\u68ee\u6797\u751f\u7269\u603b\u4f1a\u643a\u5e26\u4e00\u4e9b\u6b64\u7c7b\u6750\u6599\u3002<br><br>- \u77ee\u4eba\u7684\u80cc\u5305\u4e2d\u901a\u5e38\u88c5\u6709\u91d1\u5c5e\u952d\u548c\u5b9d\u77f3\u3002<br>\u88ab\u6467\u6bc1\u7684\u6784\u88c5\u4f53\u4e5f\u80fd\u63d0\u4f9b\u91d1\u5c5e\u3002<br><br>- \u60f3\u83b7\u5f97\u4f18\u8d28\u5200\u5251\u53ca\u5176\u4ed6\u6b66\u5668\uff0c\u53ef\u4ee5\u5411\u4eba\u7c7b\u90e8\u961f\u4e0b\u624b\u3002<br>\u51fb\u8d25\u9a91\u58eb\u540e\uff0c\u8fd8\u80fd\u4ece\u5176\u8eab\u4e0a\u53d6\u4e0b\u62a4\u7532\u3002<br><br>- \u4ea1\u7075\u9057\u9ab8\u53ef\u63d0\u4f9b\u591a\u79cd\u72ec\u7279\u6750\u6599\uff0c\u4f8b\u5982\u5438\u8840\u9b3c\u7070\u70ec\u3001\u9aa8\u7c89\uff0c<br>\u4ee5\u53ca\u6781\u4e3a\u73cd\u8d35\u7684\u5deb\u5996\u9885\u9aa8\u3002<br><br>- \u7194\u5ca9\u6e56\u7b49\u708e\u70ed\u5730\u533a\u8574\u85cf\u7740\u706b\u5c71\u6c34\u6676\u4e4b\u7c7b\u7684\u706b\u5c5e\u6027\u77ff\u7269\uff0c<br>\u5bd2\u51b7\u5730\u533a\u5219\u53ef\u63d0\u4f9b\u9ed1\u51b0\u7b49\u51b0\u5c5e\u6027\u77ff\u7269\u3002<br><br>- \u88ab\u51fb\u8d25\u7684\u6cd5\u5e08\uff0c\u6df1\u6df1\u7684\u53e3\u888b\u91cc\u5f80\u5f80\u88c5\u7740\u836f\u5242\u548c\u5176\u4ed6\u9b54\u6cd5\u7269\u54c1\u3002<br></body></html>
