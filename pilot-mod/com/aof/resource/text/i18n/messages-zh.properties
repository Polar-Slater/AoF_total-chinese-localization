MERCENARIES_HINT=<html><body>\u6b64\u5546\u5e97\u53ef\u96c7\u7528<u>\u96c7\u4f63\u5175</u>\u3002<br>\uff08\u5355\u4f4d\u4ee5 * \u6807\u8bb0\u3002\uff09<br><br><i>\u96c7\u4f63\u5175\u7ecf\u9a8c\u66f4\u4e30\u5bcc\uff0c\u4f46\u96c7\u7528\u8d39\u7528\u4e5f\u66f4\u9ad8\u3002</i><br><i>\u6b64\u5916\uff0c\u961f\u4f0d\u4e2d\u7684\u67d0\u4e9b\u5355\u4f4d\u53ef\u80fd\u4e0d\u559c\u6b22\u4ed6\u4eec\u3002</i></body></html>
CRAFTING_ITEM_HINT=<html><body>\u5927\u591a\u6570\u7269\u54c1\u90fd\u53ef\u4ee5\u5236\u4f5c\uff08\u70b9\u51fb\u7269\u54c1\u53ef\u67e5\u770b\u914d\u65b9\uff09\u3002<br>\u5236\u4f5c\u53ea\u80fd\u5728\u5546\u5e97\u4e2d\u8fdb\u884c\uff0c\u4e14\u5fc5\u987b\u6ee1\u8db3\u4ee5\u4e0b\u6761\u4ef6\uff1a<br><br>- \u5df2\u77e5\u8be5\u7269\u54c1\u7684\u914d\u65b9\u3002\u9996\u6b21\u5236\u4f5c\u67d0\u4ef6\u7269\u54c1\u65f6\uff0c<br>\u53ef\u5b66\u4f1a\u540c\u4e00\u4e3b\u9898\u5957\u88c5\u4e2d\u5176\u4ed6\u7269\u54c1\u7684\u914d\u65b9\u3002<br><br>- \u961f\u4f0d\u4e2d\u7684\u5355\u4f4d\u5177\u5907\u6240\u9700\u7684\u5c5e\u6027\u3001\u6280\u80fd\u548c\u7279\u6027\u3002<br>\u4f8b\u5982\uff0c\u201c\u94c1\u5320\u201d\u7279\u6027\u53ef\u4ee5\u7528\u4e8e\u5236\u4f5c\u6b66\u5668\u548c\u62a4\u7532\u3002<br><br>- \u7269\u54c1\u4ed3\u5e93\u4e2d\u6709\u8db3\u591f\u7684\u6240\u9700\u6750\u6599\u3002<br>\u6bcf\u573a\u6218\u6597\u7ed3\u675f\u540e\u90fd\u4f1a\u81ea\u52a8\u6536\u96c6\u6750\u6599\u3002<br><br>- \u6750\u6599\u8bf4\u660e\u4f1a\u63d0\u793a\u5176\u4ea7\u5730\uff0c\u6216\u54ea\u4e9b\u751f\u7269\u6b7b\u4ea1\u540e\u4f1a\u6389\u843d\u8be5\u6750\u6599\u3002<br>\u4f8b\u5982\uff0c\u6708\u5149\u8349\u53ef\u5728\u68ee\u6797\u548c\u6cbc\u6cfd\u91c7\u96c6\uff0c<br>\u4e5f\u53ef\u5728\u4e0e\u72ec\u89d2\u517d\u7684\u6218\u6597\u7ed3\u675f\u540e\u83b7\u5f97\u3002<br></body></html>
