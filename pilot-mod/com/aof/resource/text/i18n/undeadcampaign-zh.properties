Level01b.text=<html><body>\u514b\u91cc\u5c14\u80f8\u6709\u6210\u7af9\u5730\u7a7f\u884c\u5728\u6cbc\u6cfd\u4e2d\uff0c\u8d76\u8def\u5341\u5206\u987a\u5229\uff0c\u5374\u88ab\u4e00\u5c0f\u7fa4\u6cbc\u6cfd\u5730\u7cbe\u53d1\u73b0\u4e86\u3002\u5730\u7cbe\u6b63\u671d\u4ed6\u903c\u8fd1\uff0c\u800c\u5b83\u4eec\u5bf9\u6cbc\u6cfd\u7684\u719f\u6089\u7a0b\u5ea6\u8fdc\u975e\u514b\u91cc\u5c14\u53ef\u6bd4\uff0c\u4ed6\u6839\u672c\u65e0\u8def\u53ef\u9003\u3002<br><br>\u5730\u7cbe\u5f88\u5feb\u8ffd\u4e0a\u4e86\u514b\u91cc\u5c14\u3002\u79bb\u4ed6\u6700\u8fd1\u7684\u90a3\u53ea\u5f00\u53e3\u9053\uff1a\u201c\u6cbc\u6cfd\u91cc\uff0c\u6d88\u606f\u4f20\u5f97\u5feb\uff0c\u5c0f\u5b50\u3002\u6211\u4eec\u7b49\u7740\u4f60\u5462\u3002\u201d<br><br>\u201c\u4f60\u60f3\u5e72\u4ec0\u4e48\uff0c\u5730\u7cbe\uff1f\u201d<br><br>\u201c\u4f60\u6740\u4e86\u8001\u5934\u3002\u90a3\u662f\u4f60\u7684\u4e8b\u3002\u53ef\u4e1c\u897f\u5f52\u6211\u3002\u201d<br><br>\u201c\u4f60\u4ec0\u4e48\u4e5f\u5f97\u4e0d\u5230\u3002\u8d81\u73b0\u5728\u8fd8\u80fd\u8dd1\uff0c\u8d76\u7d27\u6eda\uff01\u201d<br><br>\u201c\u4e0d\uff0c\u6211\u6740\u4e86\u4f60\uff01\u201d\u5730\u7cbe\u543c\u9053\uff0c\u5e26\u7740\u540c\u4f19\u6b65\u6b65\u903c\u8fd1\u2026\u2026</body></html>
