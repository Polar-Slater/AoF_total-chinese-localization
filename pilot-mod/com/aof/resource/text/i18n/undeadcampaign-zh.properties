Level03a.text=<html><body>\u8fd9\u4e9b\u53ef\u601c\u7684\u5bb6\u4f19\u6beb\u65e0\u80dc\u7b97\u3002\u5b83\u4eec\u4ee5\u4e3a\u514b\u91cc\u5c14\u4e0d\u8fc7\u662f\u53c8\u4e00\u4e2a\u8fc7\u8def\u4eba\u3002\u53ef\u514b\u91cc\u5c14\u5e76\u975e\u51e1\u592b\u4fd7\u5b50\u2014\u2014\u4ed6\u662f\u4e00\u540d\u6b7b\u7075\u6cd5\u5e08\u3002<br><br>\u6700\u540e\u4e00\u53ea\u5730\u7cbe\u8bd5\u56fe\u9003\u79bb\u514b\u91cc\u5c14\u7684\u9ed1\u6697\u9b54\u6cd5\uff0c\u5374\u88ab\u4ed6\u968f\u624b\u4e00\u6325\uff0c\u62bd\u8d70\u4e86\u7075\u9b42\u3002\u90a3\u5177\u7eff\u76ae\u8eaf\u58f3\u5931\u53bb\u751f\u673a\uff0c\u762b\u5012\u5728\u5730\u3002<br><br>\u867d\u7136\u8f7b\u6613\u51fb\u8d25\u4e86\u8fd9\u7fa4\u7eff\u76ae\uff0c\u514b\u91cc\u5c14\u5374\u77e5\u9053\uff0c\u4e0b\u4e00\u6279\u654c\u4eba\u53ef\u80fd\u66f4\u52a0\u5371\u9669\u3002\u4ed6\u4ece\u5e08\u7236\u90a3\u91cc\u5b66\u5230\u4e86\u4e0d\u5c11\u672c\u4e8b\uff0c\u4e5f\u77e5\u9053\u8be5\u5982\u4f55\u5e94\u5bf9\u3002\u4ed6\u9700\u8981\u4e00\u652f\u542c\u547d\u4e8e\u81ea\u5df1\u7684\u961f\u4f0d\u3002<br><br>\u6697\u5f71\u6cbc\u6cfd (Shadowmarshes) \u904d\u5730\u6b7b\u4ea1\u3002\u8bb8\u591a\u6751\u6c11\u548c\u8d35\u65cf\u8d70\u8fdb\u6cbc\u6cfd\u540e\u4fbf\u6773\u65e0\u97f3\u4fe1\u3002\u4ed6\u4eec\u4e0d\u662f\u6eba\u6c34\u800c\u4ea1\uff0c\u5c31\u662f\u6b7b\u5728\u6e38\u8361\u4e8e\u6b64\u7684\u5730\u7cbe\u624b\u4e2d\u3002<br><br>\u514b\u91cc\u5c14\u77e5\u9053\u8be5\u53bb\u54ea\u91cc\u5bfb\u627e\u5c38\u4f53\u3002\u5e08\u7236\u6559\u8fc7\u4ed6\u5982\u4f55\u627e\u5230\u6b7b\u8005\uff0c\u518d\u5c06\u5176\u5524\u8d77\u4e3a\u4ea1\u7075\u4ec6\u4ece\u3002\u4e00\u4e2a\u5c0f\u65f6\u540e\uff0c\u4ed6\u627e\u5230\u4e86\u51e0\u5177\u6eba\u6c34\u8005\u7684\u9057\u9ab8\u3002\u4ed6\u5f00\u59cb\u65bd\u5c55\u4eea\u5f0f\uff0c\u7ec4\u5efa\u81ea\u5df1\u7684\u4ea1\u7075\u961f\u4f0d\u3002</body></html>
Level05.text=<html><body>\u514b\u91cc\u5c14\u60f3\u4e0d\u901a\uff0c\u4eba\u7c7b\u4e3a\u4f55\u8981\u4f4f\u5728\u6697\u5f71\u6cbc\u6cfd (Shadowmarshes)\u3002\u53ef\u96fe\u78e8\u9547 (Mistmill) \u504f\u504f\u5c31\u662f\u4e00\u5ea7\u6df1\u85cf\u5728\u6cbc\u6cfd\u4e2d\u7684\u4eba\u7c7b\u805a\u843d\u3002\u90a3\u91cc\u7684\u4eba\u4e00\u5e74\u5230\u5934\u65e2\u8981\u62b5\u5fa1\u5730\u7cbe\u7684\u88ad\u51fb\uff0c\u53c8\u8981\u5fcd\u53d7\u6076\u52a3\u5f97\u96be\u4ee5\u751f\u5b58\u7684\u73af\u5883\u3002<br><br>\u96fe\u78e8\u9547 (Mistmill) \u5efa\u5728\u9aa8\u6cb3 (Bone River) \u9644\u8fd1\uff0c\u51e0\u5ea7\u6865\u6a2a\u8de8\u6d51\u6d4a\u7684\u6cb3\u6c34\u3002\u8981\u8fdb\u57ce\uff0c\u5c31\u53ea\u80fd\u4ece\u8fd9\u4e9b\u6865\u4e0a\u7ecf\u8fc7\uff1b\u800c\u7a7f\u8fc7\u96fe\u78e8\u9547 (Mistmill)\uff0c\u53c8\u662f\u79bb\u5f00\u6697\u5f71\u6cbc\u6cfd (Shadowmarshes) \u6700\u5feb\u7684\u8def\u3002<br><br>\u514b\u91cc\u5c14\u77e5\u9053\uff0c\u81ea\u5df1\u7684\u4ea1\u7075\u961f\u4f0d\u7edd\u4e0d\u53ef\u80fd\u83b7\u51c6\u5165\u57ce\u3002\u4e0d\u8fc7\uff0c\u4ed6\u7684\u529b\u91cf\u8fd8\u5728\u4e0d\u65ad\u589e\u957f\uff0c\u8981\u518d\u627e\u4e00\u6279\u4ec6\u4ece\u5e76\u4e0d\u96be\u3002\u4ed6\u6253\u7b97\u8d70\u8fd1\u5176\u4e2d\u4e00\u5ea7\u6865\uff0c\u8499\u6df7\u8fdb\u57ce\u3002\u9ec4\u660f\u65f6\uff0c\u4ed6\u5148\u5c06\u624b\u4e0b\u85cf\u5728\u6697\u5904\uff0c\u4ee5\u5907\u4e0d\u65f6\u4e4b\u9700\u3002<br><br>\u514b\u91cc\u5c14\u521a\u4e00\u8d70\u8fd1\uff0c\u4e00\u540d\u5b88\u6865\u536b\u5175\u4fbf\u671d\u4ed6\u558a\u9053\uff1a\u201c\u7ad9\u4f4f\uff01\u4f60\u662f\u4ec0\u4e48\u4eba\uff1f\u201d<br><br>\u201c\u5411\u5404\u4f4d\u5c0a\u8d35\u7684\u536b\u5175\u95ee\u597d\uff01\u6211\u53ea\u662f\u4e2a\u56db\u5904\u884c\u5546\u7684\u5c0f\u5546\u4eba\u3002\u201d<br><br>\u201c\u5c31\u7ad9\u5728\u90a3\u513f\u522b\u52a8\uff01\u4e00\u4e2a\u5546\u4eba\u4e3a\u4ec0\u4e48\u72ec\u81ea\u7a7f\u8fc7\u8fd9\u7247\u8be5\u6b7b\u7684\u6cbc\u6cfd\uff1f\u4f60\u7684\u4ec6\u4eba\u5462\uff1f\u201d<br><br>\u201c\u6211\u7684\u8d27\u8f66\u9677\u8fdb\u4e86\u8def\u4e0a\u7684\u6ce5\u5751\uff0c\u4ed6\u4eec\u5c31\u4e22\u4e0b\u6211\u8d70\u4e86\u3002\u4e0d\u8fc7\u8bf7\u76f8\u4fe1\u6211\uff0c\u6211\u5728\u96fe\u78e8\u9547 (Mistmill) \u6709\u670b\u53cb\uff0c\u4ed6\u4eec\u4e00\u5b9a\u5f88\u4e50\u610f\u5e2e\u5fd9\u3002\u201d<br><br>\u201c\u6211\u6ca1\u89c1\u8fc7\u4f60\u3002\u4f60\u5356\u4ec0\u4e48\uff1f\u201d<br><br>\u201c\u9999\u6599\u548c\u8863\u670d\uff0c\u957f\u5b98\u3002\u201d<br><br>\u201c\u54fc\uff0c\u4f60\u6d51\u8eab\u90fd\u662f\u6cbc\u6cfd\u7684\u81ed\u5473\uff0c\u8fd8\u8bf4\u81ea\u5df1\u6709\u8fc7\u4e00\u8f66\u8863\u670d\u548c\u9999\u6599\uff1f\u6211\u770b\u4f60\u5728\u6492\u8c0e\u3002\u201d<br><br>\u201c\u4e0d\u6562\uff0c\u5c0a\u8d35\u7684\u536b\u5175\u3002\u6211\u8bf4\u7684\u53e5\u53e5\u5c5e\u5b9e\u3002\u201d<br><br>\u201c\u90a3\u5c31\u5f97\u8ba9\u4f60\u7684\u670b\u53cb\u6765\u8bc1\u5b9e\u4e86\u3002\u536b\u5175\uff0c\u62ff\u4e0b\u4ed6\u3002\u201d</body></html>
