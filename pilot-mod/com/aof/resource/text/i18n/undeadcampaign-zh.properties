Level07.text=<html><body>\u514b\u91cc\u5c14\u7684\u4ea1\u7075\u4ece\u6697\u5904\u6d8c\u51fa\uff0c\u8fc5\u901f\u5c60\u6740\u4e86\u5b88\u6865\u7684\u536b\u5175\u3002\u5269\u4e0b\u7684\u51e0\u4e2a\u4eba\u82e6\u82e6\u6c42\u9976\uff0c\u53ef\u514b\u91cc\u5c14\u5fc3\u4e2d\u65e2\u6ca1\u6709\u601c\u60af\uff0c\u4e5f\u6ca1\u6709\u5bbd\u6055\u3002<br><br>\u96fe\u78e8\u9547 (Mistmill) \u54cd\u8d77\u4e86\u6218\u6597\u7684\u53f7\u89d2\uff0c\u63f4\u519b\u6b63\u5728\u8d76\u6765\u3002\u514b\u91cc\u5c14\u80fd\u542c\u89c1\u58eb\u5175\u4ece\u6865\u7684\u53e6\u4e00\u7aef\u903c\u8fd1\u3002<br><br>\u514b\u91cc\u5c14\u77e5\u9053\uff0c\u81ea\u5df1\u65e0\u6cd5\u4e0e\u6574\u5ea7\u57ce\u4e3a\u654c\u3002\u4ed6\u522b\u65e0\u9009\u62e9\uff0c\u53ea\u5f97\u9000\u56de\u6cbc\u6cfd\u3002<br><br>\u4ed6\u521a\u8eb2\u8fdb\u6811\u6797\uff0c\u738b\u56fd\u7684\u519b\u961f\u4fbf\u8d76\u5230\u4e86\u6865\u5934\u3002\u58eb\u5175\u4eec\u5faa\u7740\u8840\u8ff9\u548c\u6218\u6597\u7559\u4e0b\u7684\u75d5\u8ff9\uff0c\u6563\u5165\u6cbc\u6cfd\u641c\u5bfb\u3002<br><br>\u51ed\u7740\u5bf9\u6cbc\u6cfd\u7684\u719f\u6089\uff0c\u514b\u91cc\u5c14\u71ac\u8fc7\u4e86\u63a5\u4e0b\u6765\u7684\u51e0\u4e2a\u5c0f\u65f6\u3002\u58eb\u5175\u56db\u5904\u641c\u67e5\uff0c\u53ef\u4e0d\u77e5\u662f\u547d\u8fd0\u4f7f\u7136\uff0c\u8fd8\u662f\u7eaf\u7cb9\u7684\u4fa5\u5e78\uff0c\u4ed6\u4eec\u59cb\u7ec8\u6ca1\u80fd\u627e\u5230\u8fd9\u540d\u6b7b\u7075\u6cd5\u5e08\u7684\u85cf\u8eab\u4e4b\u5904\u3002<br><br>\u514b\u91cc\u5c14\u4e00\u76f4\u7b49\u5230\u9ece\u660e\uff0c\u624d\u9003\u5230\u5b89\u5168\u7684\u5730\u65b9\u3002\u4ed6\u660e\u767d\uff0c\u5982\u4eca\u5df2\u4e0d\u53ef\u80fd\u7a7f\u8fc7\u96fe\u78e8\u9547 (Mistmill)\uff0c\u5fc5\u987b\u53e6\u4f5c\u6253\u7b97\u4e86\u2026\u2026</body></html>
Level09.text=<html><body>\u63a5\u4e0b\u6765\u7684\u51e0\u5929\uff0c\u514b\u91cc\u5c14\u4e00\u76f4\u5728\u6cbc\u6cfd\u4e2d\u6e38\u8361\u3002<br><br>\u4ed6\u524d\u5f80\u4eba\u7c7b\u738b\u56fd\u9886\u5730\u7684\u8ba1\u5212\u5931\u8d25\u4e86\u3002\u96fe\u78e8\u9547 (Mistmill) \u7684\u536b\u5175\u6b64\u523b\u60f3\u5fc5\u5df2\u4e25\u9635\u4ee5\u5f85\uff0c\u52a0\u56fa\u4e86\u5404\u4e2a\u5165\u53e3\u7684\u54e8\u6240\u3002\u7a7f\u57ce\u800c\u8fc7\u5df2\u7ecf\u4e0d\u53ef\u80fd\u4e86\u3002<br><br>\u6bcf\u5230\u591c\u91cc\uff0c\u514b\u91cc\u5c14\u90fd\u4f1a\u68a6\u89c1\u529b\u91cf\u4e0e\u6740\u622e\u3002\u4ed6\u68a6\u89c1\u81ea\u5df1\u7edf\u7387\u7740\u4e00\u652f\u5f3a\u5927\u7684\u5927\u519b\uff0c\u738b\u56fd\u7684\u519b\u961f\u5728\u4ed6\u9a87\u4eba\u7684\u529b\u91cf\u9762\u524d\u7eb7\u7eb7\u5012\u4e0b\u3002\u4ed6\u8bf4\u4e0d\u6e05\u7f18\u7531\uff0c\u5374\u9690\u9690\u89c9\u5f97\uff0c\u81ea\u5df1\u7684\u672a\u6765\u5c31\u5728\u5317\u65b9\u3002<br><br>\u6cbc\u6cfd\u4e2d\u7684\u65e5\u5b50\u8270\u96be\u56f0\u82e6\uff0c\u4f46\u514b\u91cc\u5c14\u603b\u80fd\u627e\u5230\u98df\u7269\u548c\u6816\u8eab\u4e4b\u6240\u3002\u8eab\u8fb9\u7684\u4ea1\u7075\u66ff\u4ed6\u6321\u4f4f\u4e86\u6cbc\u6cfd\u4e2d\u7684\u5927\u591a\u6570\u751f\u7269\uff0c\u53ef\u6697\u5904\u4ecd\u6f5c\u4f0f\u7740\u8bb8\u591a\u55dc\u8840\u7684\u654c\u4eba\u3002<br><br>\u6cbc\u6cfd\u91cc\u65f6\u5e38\u4f20\u6765\u53e4\u602a\u7684\u58f0\u54cd\uff0c\u6240\u4ee5\u6700\u521d\u542c\u89c1\u6811\u679d\u65ad\u88c2\u65f6\uff0c\u514b\u91cc\u5c14\u5e76\u6ca1\u6709\u653e\u5728\u5fc3\u4e0a\u3002\u7136\u800c\u6b64\u523b\uff0c\u8fdc\u5904\u5df2\u9690\u7ea6\u4f20\u6765\u8bdd\u8bed\u58f0\uff0c\u800c\u4e14\u6b63\u8fc5\u901f\u903c\u8fd1\u4ed6\u7684\u8425\u5730\u3002<br><br>\u514b\u91cc\u5c14\u521a\u6765\u5f97\u53ca\u53ec\u96c6\u4ec6\u4ece\uff0c\u5c06\u81ea\u5df1\u56f4\u5728\u4e2d\u592e\uff0c\u7eff\u76ae\u4fbf\u4ece\u591c\u8272\u4e2d\u73b0\u8eab\uff0c\u4ece\u56db\u9762\u516b\u65b9\u56f4\u4e86\u4e0a\u6765\uff01</body></html>
