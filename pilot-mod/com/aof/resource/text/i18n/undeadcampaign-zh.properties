Level16.triggers.on-battle-task-1.text=\u7075\u9b42\u4e4b\u94c3\uff1a\u5728\u7b2c\u5341\u4e8c\u56de\u5408\u7ed3\u675f\u524d\u6d88\u706d\u6240\u6709\u58eb\u5175
Level17.text=<html><body>\u6218\u6597\u5341\u5206\u8270\u82e6\uff0c\u58eb\u5175\u4eec\u4e5f\u82f1\u52c7\u594b\u6218\u3002\u4f46\u5728\u8702\u62e5\u800c\u81f3\u7684\u4ea1\u7075\u538b\u5012\u6027\u7684\u529b\u91cf\u9762\u524d\uff0c\u4ed6\u4eec\u4ecd\u4e00\u4e2a\u63a5\u4e00\u4e2a\u5730\u5012\u4e0b\u3002<br><br>\u4e00\u540d\u9a91\u58eb\u575a\u6301\u4e86\u51fa\u4eba\u610f\u6599\u7684\u957f\u65f6\u95f4\uff0c\u4f46\u6700\u7ec8\u4e5f\u62b5\u6321\u4e0d\u4f4f\u514b\u91cc\u5c14\u4ec6\u4ece\u63a5\u8fde\u4e0d\u65ad\u7684\u731b\u653b\u3002<br><br>\u6218\u6597\u7ed3\u675f\u540e\uff0c\u514b\u91cc\u5c14\u547d\u4ee4\u624b\u4e0b\u5c06\u6b7b\u8005\u7684\u5c38\u4f53\u5806\u5728\u4e00\u8d77\uff0c\u5f00\u59cb\u65bd\u5c55\u5524\u8d77\u4ea1\u8005\u7684\u4eea\u5f0f\u3002\u4eea\u5f0f\u521a\u4e00\u5f00\u59cb\uff0c\u4ed6\u4fbf\u6ce8\u610f\u5230\u5c38\u5806\u4e2d\u6709\u4e00\u540d\u50e7\u4fa3\u8fd8\u6d3b\u7740\u3002<br><br>\u201c\u796d\u53f8\uff0c\u4f60\u8fd8\u6ca1\u6b7b\uff1f\u201d<br><br>\u201c\u73b0\u5728\u5c31\u6295\u964d\u5427\uff0c\u6211\u7684\u5144\u5f1f\uff01\u5723\u6559\u4f1a\u6216\u8bb8\u8fd8\u4f1a\u5bbd\u6055\u4f60\u2014\u2014\u4ed6\u4eec\u662f\u4ec1\u6148\u7684\u3002\u201d<br><br>\u201c\u6211\u9886\u6559\u8fc7\u4f60\u4eec\u7684\u4ec1\u6148\u3002\u6b63\u662f\u56e0\u4e3a\u4f60\u4eec\u7684\u5723\u6559\u4f1a\uff0c\u6211\u624d\u4e0d\u5f97\u4e0d\u4f4f\u8fdb\u90a3\u7247\u6cbc\u6cfd\u3002\u6211\u618e\u6068\u5b83\uff01\u201d<br><br>\u201c\u795e\u77e5\u9053\u6211\u4eec\u90fd\u4f1a\u72af\u9519\uff0c\u4f46\u4f60\u82e5\u4e0d\u6094\u6539\uff0c\u7942\u5c31\u4f1a\u6bc1\u706d\u4f60\u7684\u7075\u9b42\uff01\u201d<br><br>\u201c\u8fd9\u6211\u4e5f\u77e5\u9053\uff0c\u6240\u4ee5\u6211\u624d\u60f3\u7559\u5728\u8fd9\u4e2a\u4e16\u754c\u4e0a\u3002\u201d<br><br>\u8bf4\u7f62\uff0c\u514b\u91cc\u5c14\u5c06\u5315\u9996\u523a\u5165\u796d\u53f8\u7684\u5fc3\u810f\uff0c\u7ee7\u7eed\u5b8c\u6210\u4eea\u5f0f\u3002\u65b0\u5524\u8d77\u7684\u58eb\u5175\u518d\u6b21\u58ee\u5927\u4e86\u4ed6\u7684\u961f\u4f0d\u3002<br><br>\u514b\u91cc\u5c14\u610f\u8bc6\u5230\uff0c\u81ea\u5df1\u4e0d\u80fd\u518d\u6cbf\u7740\u8fd9\u6761\u8def\u8d70\u4e0b\u53bb\u4e86\u3002\u201c\u8fd9\u4e00\u8def\u4e0a\uff0c\u8fd8\u4f1a\u6709\u66f4\u591a\u50cf\u8fd9\u4e9b\u9a91\u58eb\u4e00\u6837\u7684\u86c6\u866b\u3002\u201d\u4ed6\u6697\u81ea\u601d\u5fd6\uff0c\u201c\u6211\u5fc5\u987b\u5b8c\u6210\u6211\u7684\u4f7f\u547d\u3002\u6211\u8981\u7a7f\u8fc7\u517d\u4eba\u4e18\u9675 (Orcs' Hills)\u3002\u5728\u90a3\u91cc\uff0c\u6211\u624d\u80fd\u8fce\u6765\u81ea\u5df1\u7684\u547d\u8fd0\uff01\u201d</body></html>
LevelSecret01b.text=<html><body>\u514b\u91cc\u5c14\u52c9\u5f3a\u6321\u5f00\u4e86\u6700\u521d\u7684\u51e0\u6b21\u653b\u51fb\uff0c\u4f46\u5f88\u5feb\u4fbf\u62db\u67b6\u4e0d\u4f4f\uff0c\u518d\u4e5f\u65e0\u529b\u62b5\u6297\u3002\u4ed6\u7684\u4ea1\u7075\u5f88\u5feb\u5c31\u88ab\u738b\u56fd\u58eb\u5175\u5c3d\u6570\u6d88\u706d\u3002\u4ed6\u6700\u540e\u8bb0\u5f97\u7684\uff0c\u662f\u4e00\u9053\u5251\u5149\uff0c\u4ee5\u53ca\u80f8\u53e3\u4f20\u6765\u7684\u5267\u75db\u3002\u968f\u540e\uff0c\u4e00\u5207\u5f52\u4e8e\u5bc2\u9759\u3002<br><br>\u58eb\u5175\u4eec\u8349\u8349\u5904\u7406\u4e86\u514b\u91cc\u5c14\u7684\u5c38\u4f53\u3002\u4ed6\u4eec\u5c06\u4ea1\u7075\u7684\u5c38\u9ab8\u5806\u8d77\u6765\u711a\u70e7\uff0c\u5374\u6ca1\u6709\u628a\u514b\u91cc\u5c14\u6254\u8fdb\u706b\u91cc\uff0c\u800c\u662f\u7528\u7834\u5e03\u88f9\u4f4f\u8fd9\u540d\u6b7b\u7075\u6cd5\u5e08\u7684\u5c38\u4f53\uff0c\u4e22\u8fdb\u4e86\u9644\u8fd1\u7684\u5e9f\u589f\u3002<br><br>\u514b\u91cc\u5c14\u6b7b\u4e86\uff0c\u7075\u9b42\u5374\u59cb\u7ec8\u6ca1\u6709\u79bb\u5f00\u4eba\u4e16\u3002\u51e0\u5468\u540e\uff0c\u4ed6\u5316\u4f5c\u4e00\u53ea\u81f4\u547d\u7684\u5c38\u5996\uff0c\u518d\u6b21\u7ad9\u4e86\u8d77\u6765\u3002\u4ed6\u7684\u795e\u5fd7\u5c1a\u672a\u5b8c\u5168\u6d88\u6563\uff0c\u56e0\u4e3a\u4ec7\u6068\u4e0e\u75db\u82e6\u5c06\u4ed6\u6c38\u8fdc\u675f\u7f1a\u4e8e\u6b64\u3002<br><br>\u4ed6\u77e5\u9053\u81ea\u5df1\u5931\u8d25\u4e86\uff0c\u518d\u4e5f\u65e0\u6cd5\u6210\u4e3a\u771f\u6b63\u7684\u4ea1\u7075\u4e4b\u4e3b\uff0c\u4f46\u4ed6\u4ece\u6765\u5c31\u6ca1\u6709\u771f\u6b63\u7684\u9009\u62e9\u3002\u514b\u91cc\u5c14\u53ea\u80fd\u8ffd\u968f\u81ea\u5df1\u7684\u547d\u8fd0\uff0c\u8d70\u5411\u90a3\u82e6\u6da9\u7684\u7ec8\u70b9\u3002<br><br>\u4ed6\u53ec\u96c6\u4e86\u51e0\u4e2a\u4ea1\u7075\u4ec6\u4ece\uff0c\u6bcf\u591c\u5728\u68ee\u6797\u4e2d\u5bfb\u89c5\u6e29\u70ed\u7684\u9c9c\u8840\u3002\u4e00\u5929\u591c\u91cc\uff0c\u4ed6\u53d1\u73b0\u4e86\u4e00\u5806\u8425\u706b\u2026\u2026</body></html>
