LevelPirates15.text=<html><body>\u6700\u540e\u4e00\u5c0a\u6d3b\u5316\u77f3\u50cf\u8f70\u7136\u5012\u4e0b\uff0c\u788e\u6210\u4e00\u5730\u77f3\u5757\uff0c\u6b8b\u7834\u7684\u95e8\u5eca\u524d\u518d\u65e0\u963b\u788d\u3002<br><br>\u5c18\u57c3\u6e10\u6e10\u843d\u5b9a\uff0c\u961f\u4f0d\u8e0f\u8fc7\u65b0\u6dfb\u7684\u788e\u77f3\uff0c\u8d70\u8fdb\u655e\u5f00\u7684\u901a\u9053\u3002<br><br>\u624d\u8d70\u51e0\u6b65\uff0c\u5eca\u9053\u4fbf\u8c41\u7136\u5f00\u6717\uff0c\u663e\u9732\u51fa\u4e00\u5ea7\u53e4\u8001\u795e\u5e99\u6447\u6447\u6b32\u5760\u7684\u5185\u90e8\u3002<br><br>\u82e5\u4e0d\u662f\u65e0\u6570\u85e4\u8513\u7a7f\u8fc7\u5899\u58c1\u548c\u7a79\u9876\u7684\u88c2\u7f1d\uff0c\u5c06\u7ed3\u6784\u52c9\u5f3a\u7275\u4f4f\uff0c\u8fd9\u5ea7\u5efa\u7b51\u6050\u6015\u65e9\u5df2\u574d\u584c\u3002<br><br>\u7f15\u7f15\u9633\u5149\u4ece\u4e0a\u65b9\u6d12\u8fdb\u5927\u5385\uff0c\u4f17\u4eba\u7684\u76ee\u5149\u7acb\u523b\u88ab\u4e2d\u592e\u4e00\u53e3\u6c14\u6d3e\u7684\u5b9d\u7bb1\u5438\u5f15\u2014\u2014\u5b83\u6b63\u95ea\u8000\u7740\u707f\u707f\u91d1\u5149\uff01</body></html>
