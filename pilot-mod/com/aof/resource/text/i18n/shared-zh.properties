LevelCrystalMine03.text=<html><body>\u76d8\u8e1e\u6df1\u5904\u7684\u90aa\u6076\u751f\u7269\u5df2\u88ab\u51fb\u6e83\uff0c\u6c34\u6676\u77ff\u573a (Crystal Mine) \u7ec8\u4e8e\u53ef\u4ee5\u91cd\u65b0\u5f00\u91c7\u4e86\uff01<br><br>\u4e00\u961f\u77ff\u5de5\u5df2\u7ecf\u6295\u5165\u5de5\u4f5c\u3002\u91d1\u5c5e\u6572\u51fb\u4e0e\u5ca9\u77f3\u788e\u88c2\u7684\u58f0\u97f3\u4ece\u77ff\u4e95\u4e2d\u56de\u8361\u800c\u51fa\uff0c\u5de5\u5934\u6b63\u68c0\u67e5\u7740\u521a\u63a8\u5230\u9633\u5149\u4e0b\u7684\u4e00\u8f66\u5b9d\u77f3\u3002<br><br>\u4e0d\u4e45\u4e4b\u540e\uff0c\u5f00\u91c7\u6240\u5f97\u7684\u6536\u76ca\u5c31\u4f1a\u6e90\u6e90\u4e0d\u65ad\u5730\u6d41\u5165\u961f\u4f0d\u7684\u94b1\u888b\uff01<br><br>\uff08\u6c34\u6676\u77ff\u573a (Crystal Mine) \u6bcf\u5929\u90fd\u4f1a\u4e0a\u7f34\u6536\u76ca\u3002\uff09</body></html>
