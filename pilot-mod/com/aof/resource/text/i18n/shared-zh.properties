LevelPirates10a.text=<html><body>\u8d8a\u72f1\u6210\u529f\u540e\uff0c\u961f\u4f0d\u6084\u6084\u722c\u51fa\u57ce\u5821\u5730\u4e0b\uff0c\u6f5c\u5411\u6e2f\u53e3\uff0c\u9669\u9669\u907f\u5f00\u4e00\u961f\u8d76\u53bb\u67e5\u770b\u5730\u7262\u8b66\u62a5\u7684\u957f\u67aa\u5175\u3002<br><br>\u5148\u524d\u7684\u6674\u5929\u5df2\u88ab\u72c2\u98ce\u66b4\u96e8\u53d6\u4ee3\uff0c\u9ed1\u536b\u58eb\u54e8\u5175\u5168\u8eb2\u8fdb\u4e86\u5c4b\u5185\uff0c\u901a\u5f80\u7801\u5934\u7684\u8def\u4e0a\u7a7a\u65e0\u4e00\u4eba\u3002<br><br>\u7ea2\u80e1\u5b50\u8239\u957f\u7684\u8239\u4e0d\u89c1\u8e2a\u5f71\uff0c\u5cb8\u8fb9\u5012\u662f\u6cca\u7740\u4e00\u8258\u9ed1\u536b\u58eb\u5feb\u8239\uff0c\u6b63\u968f\u6d6a\u8d77\u4f0f\u3002<br><br>\u961f\u4f0d\u722c\u4e0a\u8239\uff0c\u9a76\u5411\u5927\u6d77\u3002</body></html>
LevelPirates10b.text=<html><body>\u8fd4\u822a\u7684\u65f6\u95f4\u6f2b\u957f\u5f97\u4eff\u4f5b\u6ca1\u6709\u5c3d\u5934\uff0c\u4f46\u719f\u6089\u7684\u5df4\u7279\u6e2f (Butterport) \u7ec8\u4e8e\u51fa\u73b0\u5728\u5730\u5e73\u7ebf\u4e0a\u3002<br><br>\u9ed1\u536b\u58eb\u57ce\u5821 (Black Guard Castle) \u7684\u6050\u6016\u7ecf\u5386\u5df2\u88ab\u8fdc\u8fdc\u7529\u5728\u8eab\u540e\uff0c\u82f1\u96c4\u4eec\u548c\u6d77\u76d7\u8239\u5458\u90fd\u677e\u4e86\u53e3\u6c14\u3002<br><br>\u961f\u4f0d\u8d70\u4e0b\u593a\u6765\u7684\u9ed1\u536b\u58eb\u5feb\u8239\u3002\u7ea2\u80e1\u5b50\u8239\u957f\u9ed8\u9ed8\u54c0\u60bc\u7740\u81ea\u5df1\u5931\u53bb\u7684\u8239\uff0c\u968f\u540e\u8d70\u5230\u5e78\u5b58\u8239\u5458\u9762\u524d\uff0c\u9010\u4e2a\u7528\u529b\u63e1\u624b\uff0c\u70b9\u5934\u81f4\u610f\u3002<br><br>\u7ea2\u80e1\u5b50\u8239\u957f\u607c\u706b\u5230\u4e86\u6781\u70b9\uff0c\u975e\u8981\u8ba8\u4e2a\u8bf4\u6cd5\uff1a\u7a76\u7adf\u4e3a\u4ec0\u4e48\uff0c\u4ed6\u7684\u8239\u5458\u7adf\u88ab\u76f4\u63a5\u9001\u8fdb\u4e86\u864e\u53e3\u2026\u2026</body></html>
LevelPirates11.text=<html><body>\u9ed1\u536b\u58eb\u57ce\u5821 (Black Guard Castle) \u6c14\u52bf\u6151\u4eba\u3002\u8fd9\u5ea7\u6d77\u4e0a\u5821\u5792\u663e\u7136\u662f\u4e3a\u62b5\u5fa1\u5404\u79cd\u8fdb\u653b\u800c\u5efa\u3002<br><br>\u4e00\u961f\u961f\u54e8\u5175\u5b88\u5728\u57ce\u579b\u4e0a\uff0c\u626b\u89c6\u6d77\u9762\uff0c\u63d0\u9632\u5a01\u80c1\u3002\u60f3\u4e0d\u88ab\u53d1\u73b0\u662f\u4e0d\u53ef\u80fd\u7684\u3002<br><br>\u60f3\u8d77\u4e0a\u6b21\u5230\u8bbf\u7684\u60ca\u9669\u7ecf\u5386\uff0c\u961f\u4f0d\u4e0d\u6562\u518d\u5f80\u8fd9\u5ea7\u9632\u5b88\u4e25\u5bc6\u7684\u5c9b\u4e0a\u8981\u585e\u9760\u8fd1\u3002<br><br>\u2026\u2026\u4e0d\u8fc7\uff0c\u82e5\u6709\u671d\u4e00\u65e5\u98ce\u6ce2\u5e73\u606f\uff0c\u9ed1\u536b\u58eb\u57ce\u5821 (Black Guard Castle) \u5012\u4f1a\u6210\u4e3a\u8fdc\u6d77\u822a\u884c\u4e2d\u5b9d\u8d35\u7684\u8865\u7ed9\u6e2f\u3002<br><br>\u5728\u90a3\u4e4b\u524d\uff0c\u4f4f\u5728\u5730\u7262\u91cc\u7684\u523d\u5b50\u624b\u51c6\u8fd8\u5728\u78e8\u7740\u65a7\u5934\uff0c\u7fd8\u9996\u4ee5\u5f85\u5462\uff01</body></html>
LevelPirates11.location.name=\u9ed1\u536b\u58eb (Black Guard)
LevelPirates12.text=<html><body>\u5982\u4eca\u5df2\u77e5\u6653\u79d8\u5b9d\u7684\u6b63\u786e\u4f4d\u7f6e\uff0c\u961f\u4f0d\u518d\u5ea6\u626c\u5e06\u3002<br><br>\u593a\u6765\u7684\u9ed1\u536b\u58eb\u5feb\u8239\u8ba9\u63a2\u7d22\u672a\u77e5\u6d77\u57df\u7684\u65c5\u7a0b\u8212\u9002\u4e86\u8bb8\u591a\u3002\u5929\u6c14\u6674\u597d\uff0c\u53c8\u6709\u5f3a\u52b2\u987a\u98ce\u76f8\u52a9\uff0c\u4e00\u884c\u4eba\u5f88\u5feb\u4fbf\u63a5\u8fd1\u4e86\u76ee\u7684\u5730\u3002<br><br>\u5728\u56fd\u738b\u6d77 (King's Sea) \u5357\u90e8\u6d69\u701a\u7684\u851a\u84dd\u4e2d\uff0c\u8471\u90c1\u7684\u5c0f\u5c9b\u5b9b\u5982\u4e00\u5904\u5b64\u60ac\u6d77\u4e0a\u7684\u4e50\u571f\u3002<br><br>\u961f\u4f0d\u767b\u4e0a\u5c0f\u8247\uff0c\u5212\u5411\u5cb8\u8fb9\u3002\u8d8a\u8fc7\u6c99\u6ee9\uff0c\u4e24\u6761\u660e\u663e\u7684\u9053\u8def\u51fa\u73b0\u5728\u773c\u524d\uff0c\u4e00\u6761\u901a\u5f80\u795e\u5e99\u5e9f\u589f\uff0c\u53e6\u4e00\u6761\u6df1\u5165\u4e1b\u6797\u8179\u5730\u3002<br><br>\u4f17\u4eba\u51c6\u5907\u7ee7\u7eed\u63a2\u7d22\uff0c\u7ea2\u80e1\u5b50\u8239\u957f\u6325\u8d77\u5f2f\u5200\uff0c\u968f\u65f6\u51c6\u5907\u4e00\u9a6c\u5f53\u5148\u3002<br><br>\u82e5\u8fd9\u91cc\u771f\u6709\u5b9d\u85cf\uff0c\u53ea\u6709\u4eb2\u81ea\u5bfb\u627e\u624d\u80fd\u77e5\u9053\u3002\u82f1\u96c4\u4eec\u8981\u63a2\u7d22\u8fd9\u5ea7\u5c9b\u5417\uff1f</body></html>
