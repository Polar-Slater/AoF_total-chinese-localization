LevelWerewolf08.text=<html><body>\u4e00\u540d\u5012\u4e0b\u7684\u730e\u624b\u80f8\u524d\u53e3\u888b\u91cc\u9732\u51fa\u4e00\u5c01\u76b1\u5df4\u5df4\u7684\u4fe1\uff0c\u5f15\u8d77\u4e86\u5192\u9669\u8005\u4eec\u7684\u6ce8\u610f\u3002<br><br>\u4ed6\u4eec\u4ed4\u7ec6\u67e5\u770b\u8fd9\u5f20\u67d3\u8840\u7684\u7f8a\u76ae\u7eb8\uff0c\u53d1\u73b0\u4e0a\u9762\u7684\u5b57\u5199\u5f97\u6b6a\u6b6a\u626d\u626d\uff0c\u51e0\u4e4e\u65e0\u6cd5\u8fa8\u8ba4\u3002\u5185\u5bb9\u4f3c\u4e4e\u662f\uff1a<br><br>\u201c\u628a\u90a3\u91ce\u517d\u5e26\u5230\u5de8\u9b54\u5c16\u5cf0 (troll spire)\u3002\u6211\u8ba4\u8bc6\u4e2a\u597d\u4eba\uff0c\u4ed6\u80af\u5b9a\u60f3\u89c1\u3002\u201d<br><br>\u82f1\u96c4\u4eec\u653e\u4e0b\u4fe1\uff0c\u5546\u91cf\u4e86\u7247\u523b\u3002\u8fd9\u5c01\u4fe1\u662f\u8c01\u5199\u7684\uff1f\u5188\u745f\u7684\u5973\u513f\u4f1a\u4e0d\u4f1a\u5c31\u88ab\u90a3\u4eba\u5173\u7740\uff1f<br><br>\u5c3d\u7ba1\u5188\u745f\u5df2\u7ecf\u544a\u8beb\u8fc7\u4ed6\u4eec\u5176\u4e2d\u7684\u5371\u9669\uff0c\u5192\u9669\u8005\u4eec\u8fd8\u662f\u51b3\u5b9a\u5e2e\u4ed6\u67e5\u6e05\u8fd9\u573a\u9634\u8c0b\uff0c\u52a8\u8eab\u524d\u5f80\u5de8\u9b54\u5c16\u5cf0 (Trollspire)\u3002</body></html>
