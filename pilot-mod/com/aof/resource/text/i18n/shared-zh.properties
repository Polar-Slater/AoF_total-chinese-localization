LevelWorldKnot01.text=<html><body>\u5728\u738b\u56fd\u4e00\u5904\u504f\u8fdc\u89d2\u843d\u7684\u6df1\u8c37\u4e2d\uff0c\u4e00\u5ea7\u6765\u81ea\u4e45\u8fdc\u5e74\u4ee3\u3001\u65e9\u5df2\u88ab\u4eba\u9057\u5fd8\u7684\u88c5\u7f6e\u9759\u9759\u77d7\u7acb\uff0c\u80cc\u9634\u5904\u722c\u6ee1\u4e86\u9752\u82d4\u3002<br><br>\u5c3d\u7ba1\u8fd9\u5ea7\u5efa\u7b51\u663e\u7136\u5e74\u4ee3\u4e45\u8fdc\uff0c\u523b\u5728\u5206\u6210\u4e24\u534a\u7684\u5b8f\u4f1f\u62f1\u95e8\u4e0a\u7684\u795e\u79d8\u7b26\u6587\u4ecd\u5728\u5fae\u5fae\u95ea\u70c1\uff0c\u4eff\u4f5b\u968f\u7740\u67d0\u79cd\u542c\u4e0d\u89c1\u7684\u8282\u594f\u8d77\u4f0f\u3002<br><br>\u5192\u9669\u8005\u4eec\u8ba4\u51fa\uff0c\u8fd9\u5c31\u662f\u4e16\u754c\u4e4b\u7ed3 (World Knot)\u2014\u2014\u4f20\u8bf4\u5f88\u4e45\u4ee5\u524d\uff0c\u6cd5\u5e08\u4eec\u66fe\u7528\u8fd9\u4ef6\u9b54\u6cd5\u88c5\u7f6e\u7814\u7a76\u65f6\u95f4\u9b54\u6cd5\u3002<br><br>\u636e\u8bf4\uff0c\u8fd9\u4ef6\u9644\u6709\u9b54\u6cd5\u7684\u5947\u5de7\u88c5\u7f6e\u80fd\u5c06\u751f\u7075\u4f20\u9001\u5230\u4e0d\u540c\u7684\u65f6\u95f4\u7ebf\u3002<br><br>\u8c01\u4e5f\u8bf4\u4e0d\u6e05\u5b83\u4e0a\u4e00\u6b21\u542f\u7528\u662f\u5728\u4f55\u65f6\uff0c\u4f46\u5b83\u4f3c\u4e4e\u4ecd\u6709\u8db3\u591f\u7684\u80fd\u91cf\uff0c\u53ea\u8981\u6536\u5230\u6b63\u786e\u7684\u6307\u4ee4\uff0c\u4e16\u754c\u4e4b\u7ed3 (World Knot) \u5c31\u80fd\u518d\u6b21\u8fd0\u4f5c\u3002<br><br>\u53ea\u6709\u6700\u52c7\u6562\u7684\u5192\u9669\u8005\uff0c\u624d\u6562\u5c1d\u8bd5\u9a7e\u9a6d\u8fd9\u9879\u53e4\u8001\u6280\u672f\u3002</body></html>
