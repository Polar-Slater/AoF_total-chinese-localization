LevelHumanPlayerBase01.text=<html><body>\u4e3a\u4e86\u5609\u5956\u4f60\u5bf9\u4eba\u7c7b\u738b\u56fd (Human Kingdom) \u7684\u5fe0\u8bda\u4e0e\u5353\u8d8a\u8d21\u732e\uff0c\u5a01\u5ec9\u56fd\u738b\u8d50\u7ed9\u4f60\u4e00\u5c0f\u5757\u571f\u5730\uff0c\u8ba9\u4f60\u6709\u673a\u4f1a\u5728\u6545\u571f\u5f00\u521b\u65b0\u751f\u6d3b\u3002<br><br>\u6751\u6c11\u867d\u7136\u4e0d\u591a\uff0c\u4f46\u6765\u8bbf\u8005\u90fd\u770b\u5f97\u51fa\uff0c\u4ed6\u4eec\u5403\u7a7f\u4e0d\u6101\uff0c\u751f\u6d3b\u5b89\u4e50\u3002<br><br>\u9886\u5730\u4ecd\u7136\u7b80\u964b\uff0c\u524d\u65b9\u8fd8\u6709\u8bb8\u591a\u8270\u82e6\u5de5\u4f5c\uff0c\u4e0d\u8fc7\uff0c\u5bf9\u4e00\u4e2a\u5c0f\u9886\u4e3b\u6765\u8bf4\uff0c\u8fd9\u5df2\u662f\u4e0d\u9519\u7684\u5f00\u7aef\u3002<br><br>\u4e00\u4e2a\u63a8\u7740\u6ee1\u8f66\u8349\u76ae\u7684\u519c\u5de5\u53d1\u73b0\u961f\u4f0d\u5230\u6765\uff0c\u6df1\u6df1\u97a0\u4e86\u4e00\u8eac\u3002\u53ea\u8981\u6295\u8d44\u5f97\u5f53\uff0c\u4f60\u7684\u9886\u6c11\u4fbf\u80fd\u62e5\u6709\u8fdc\u4e0d\u6b62\u8015\u7530\u79cd\u5730\u7684\u672a\u6765\uff01</body></html>
