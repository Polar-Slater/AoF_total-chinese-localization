LevelSeaPeoplePlayerBase02.text=<html><body>\u8fd9\u5ea7\u5c0f\u5c0f\u7684\u6d77\u65cf\u6751\u843d\u51e0\u4e4e\u4e00\u591c\u4e4b\u95f4\u6269\u5927\u4e86\u4e00\u500d\uff0c\u4e5f\u66f4\u52a0\u5f15\u4eba\u6ce8\u76ee\u3002\u6cbf\u6d77\u5404\u5730\u6765\u5f80\u7684\u5c45\u6c11\uff0c\u65e0\u4e0d\u5bf9\u6d77\u65cf\u7684\u751f\u6d3b\u65b9\u5f0f\u611f\u5230\u597d\u5947\u3002<br><br>\u6d77\u65cf\u89c9\u5f97\u81ea\u5df1\u7684\u65e5\u5e38\u751f\u6d3b\u7a00\u677e\u5e73\u5e38\uff0c\u4f46\u4ed6\u4eec\u5904\u7406\u5bfb\u5e38\u4e8b\u52a1\u7684\u65b0\u5947\u65b9\u6cd5\uff0c\u5374\u8ba9\u8bb8\u591a\u4eba\u7740\u8ff7\u3002<br><br>\u4e8b\u5b9e\u4e0a\uff0c\u4ed6\u4eec\u72ec\u7279\u7684\u8d27\u7269\u3001\u521b\u65b0\u7684\u6355\u9c7c\u6280\u672f\u548c\u964c\u751f\u7684\u6587\u5316\uff0c\u5df2\u7ecf\u5f15\u8d77\u6574\u4e2a\u738b\u56fd\u7684\u5174\u8da3\u3002<br><br>\u8c01\u80fd\u60f3\u8c61\uff0c\u8fd9\u5ea7\u6751\u843d\u5c06\u6765\u4f1a\u53d1\u5c55\u6210\u4ec0\u4e48\u6a21\u6837\uff01<br><br>\uff08\u5347\u7ea7\u636e\u70b9\u5e76\u63a8\u8fdb\u6e38\u620f\u8fdb\u5ea6\uff0c\u53ef\u89e3\u9501\u66f4\u591a\u5175\u79cd\u3002\uff09</body></html>
