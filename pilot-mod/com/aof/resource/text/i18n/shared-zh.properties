LevelRatmenPlayerBase01.text=<html><body>\u7d22\u7f57\u987f (Sorodon) \u7e41\u5fd9\u8857\u9053\u7684\u6df1\u5904\uff0c\u9f20\u4eba\u5728\u9634\u6697\u6f6e\u6e7f\u7684\u5730\u4e0b\u5efa\u7acb\u4e86\u5bb6\u56ed\u3002\u5730\u4e0a\u7684\u5c45\u6c11\u51e0\u4e4e\u65e0\u4eba\u6562\u8e0f\u5165\u57ce\u4e2d\u873f\u8712\u7684\u4e0b\u6c34\u9053\uff0c\u751f\u6015\u8bef\u95ef\u9f20\u4eba\u6c0f\u65cf\u7684\u5de2\u7a74\u3002<br><br>\u8fd9\u91cc\u867d\u80fd\u8eb2\u907f\u4eba\u7c7b\u7684\u5e72\u6d89\uff0c\u4f46\u8fd9\u5ea7\u5927\u591a\u7528\u738b\u56fd\u5e9f\u5f03\u7269\u642d\u5efa\u7684\u5730\u4e0b\u6751\u843d\uff0c\u5b9e\u5728\u6ca1\u6709\u591a\u5c11\u53ef\u4f9b\u7cca\u53e3\u7684\u4e1c\u897f\u3002<br><br>\u82e5\u975e\u6c0f\u65cf\u91cc\u6709\u8bb8\u591a\u8eab\u624b\u9ad8\u660e\u7684\u7a83\u8d3c\u548c\u6252\u624b\uff0c\u4e0d\u5c11\u9f20\u4eba\u6050\u6015\u8fde\u996d\u90fd\u5403\u4e0d\u9971\u3002\u9f20\u4eba\u5404\u81ea\u4e3a\u751f\uff0c\u800c\u6c0f\u65cf\u7684\u9ed1\u5e2e\u7262\u7262\u63a7\u5236\u7740\u8fd9\u4e2a\u5730\u4e0b\u793e\u4f1a\u3002<br><br>\u5c3d\u7ba1\u5341\u5206\u52e4\u52b3\uff0c\u9f20\u4eba\u6c0f\u65cf\u4ecd\u8feb\u5207\u9700\u8981\u5916\u6765\u8d44\u52a9\u3002\u4ed6\u4eec\u4e0e\u4e16\u9694\u7edd\u592a\u4e45\u4e86\u3002<br><br>\u8fd9\u7247\u5bbd\u5e7f\u7684\u5730\u7a74\uff0c\u8db3\u4ee5\u8ba9\u9f20\u4eba\u7684\u5de2\u7a74\u7ee7\u7eed\u53d1\u5c55\uff01</body></html>
