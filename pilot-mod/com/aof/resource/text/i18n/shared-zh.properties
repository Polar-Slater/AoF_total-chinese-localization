LevelVampireMonastery06.text=<html><body>\u5438\u8840\u9b3c\u4eec\u62fc\u6b7b\u62b5\u6297\uff0c\u5374\u4ecd\u88ab\u9010\u4e00\u65a9\u6740\u3002<br><br>\u6700\u540e\u4e00\u540d\u5973\u5438\u8840\u9b3c\u4e5f\u762b\u5012\u6210\u4e00\u5177\u82cd\u767d\u7684\u5c38\u4f53\uff0c\u6574\u5ea7\u4fee\u9053\u9662\u9677\u5165\u5bc2\u9759\u3002<br><br>\u6218\u6597\u7ed3\u675f\uff0c\u5192\u9669\u8005\u4eec\u6cbf\u7740\u6765\u8def\u9003\u4e86\u51fa\u53bb\u3002<br><br>\u8fd9\u5730\u65b9\u53ea\u6709\u6b7b\u4ea1\uff0c\u5fc5\u987b\u6c38\u8fdc\u5c01\u95ed\u3002\u82f1\u96c4\u4eec\u5907\u597d\u706b\u628a\uff0c\u63b7\u5411\u8fd9\u5ea7\u53d7\u8bc5\u5492\u7684\u4fee\u9053\u9662\u3002\u4e0d\u4e45\uff0c\u6574\u5ea7\u5efa\u7b51\u4fbf\u88ab\u70c8\u706b\u711a\u6bc1\u3002</body></html>
