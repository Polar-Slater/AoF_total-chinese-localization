LevelManaObelisks01.text=<html><body>\u5192\u9669\u8005\u4eec\u9762\u524d\uff0c\u6f06\u9ed1\u5ca9\u77f3\u96d5\u6210\u7684\u9b54\u6cd5\u65b9\u5c16\u7891\u5982\u5229\u5203\u822c\u523a\u51fa\u51b0\u5ddd\uff0c\u5728\u547c\u5578\u7684\u66b4\u98ce\u96ea\u4e2d\u9ad8\u9ad8\u8038\u7acb\u3002<br><br>\u82f1\u96c4\u4eec\u8d70\u8fd1\u65f6\uff0c\u611f\u5230\u811a\u4e0b\u79ef\u96ea\u4f20\u6765\u7684\u9707\u52a8\u8d8a\u6765\u8d8a\u5f3a\u3002\u8fd9\u4e9b\u65b9\u5c16\u7891\u60f3\u5fc5\u6df1\u6df1\u624e\u5165\u5730\u4e0b\uff0c\u5176\u4e2d\u663e\u7136\u8fd8\u8574\u85cf\u7740\u5c1a\u672a\u91ca\u653e\u7684\u529b\u91cf\u3002<br><br>\u961f\u4f0d\u8d8a\u9760\u8fd1\u65b9\u5c16\u7891\uff0c\u8eab\u4e0a\u7684\u9b54\u6cd5\u7269\u54c1\u5c31\u8d8a\u662f\u55e1\u55e1\u4f5c\u54cd\u3002\u770b\u6765\uff0c\u5bcc\u542b\u9b54\u529b\u7684\u7269\u54c1\u6216\u8bb8\u6b63\u662f\u89e3\u5f00\u6b64\u5730\u79d8\u5bc6\u7684\u5173\u952e\u3002<br><br>\u5192\u9669\u8005\u4eec\u80fd\u63ed\u5f00\u8fd9\u4e9b\u5947\u5f02\u65b9\u5c16\u7891\u7684\u8c1c\u56e2\u5417\uff1f</body></html>
