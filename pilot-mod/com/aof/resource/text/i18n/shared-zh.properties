LevelSoulsWell01.text=<html><body>\u8fd9\u5ea7\u9634\u68ee\u7684\u57ce\u5821\u66fe\u662f\u5f3a\u5927\u800c\u53ef\u6016\u7684\u4ea1\u7075\u4e4b\u738b\u7684\u5c45\u6240\u3002\u6614\u65e5\uff0c\u5b83\u662f\u90aa\u6076\u7684\u8c61\u5f81\uff0c\u4ee4\u4e00\u5207\u751f\u7075\u80c6\u5bd2\u3002\u76f4\u5230\u7231\u5fb7\u534e\u7235\u58eb\u7387\u9886\u6b63\u4e49\u4e4b\u5e08\u6df1\u5165\u5de2\u7a74\u8179\u5730\uff0c\u4ea1\u7075\u4e4b\u738b\u6b8b\u9177\u7684\u7edf\u6cbb\u624d\u7ec8\u4e8e\u7ec8\u7ed3\u3002<br><br>\u8bb8\u591a\u4eba\u76f8\u4fe1\uff0c\u4ea1\u7075\u4e4b\u738b\u529b\u91cf\u7684\u5965\u79d8\uff0c\u5728\u4e8e\u4ed6\u80fd\u591f\u6c72\u53d6\u8fd9\u5ea7\u5de2\u7a74\u4e0b\u65b9\u9ed1\u8272\u571f\u5730\u4e2d\u5c01\u5b58\u7684\u9ed1\u6697\u80fd\u91cf\u3002<br><br>\u901a\u5f80\u51a5\u754c (underworld) \u7684\u5927\u95e8\u6216\u8bb8\u5df2\u7ecf\u5173\u95ed\uff0c\u53ef\u65e0\u6570\u65e0\u8f9c\u8005\u66fe\u5728\u8fd9\u5ea7\u6c61\u79fd\u7684\u5bab\u6bbf\u4e2d\u60e8\u906d\u6740\u5bb3\uff0c\u4ed6\u4eec\u9971\u53d7\u6298\u78e8\u7684\u7075\u9b42\u4e5f\u8bb8\u6c38\u8fdc\u65e0\u6cd5\u5b89\u606f\u3002<br><br>\u76d8\u8e1e\u4e8e\u6b64\u7684\u90aa\u6076\u751f\u7269\u65e9\u5df2\u88ab\u51fb\u6e83\uff0c\u4f46\u6325\u4e4b\u4e0d\u53bb\u7684\u6050\u60e7\u4ecd\u7b3c\u7f69\u7740\u8fd9\u5ea7\u8352\u51c9\u7684\u5821\u5792\u3002\u53ea\u6709\u6700\u52c7\u6562\u7684\u82f1\u96c4\u624d\u6562\u8e0f\u8db3\u5176\u4e2d\u3002</body></html>
