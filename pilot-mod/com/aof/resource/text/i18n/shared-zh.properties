LevelTransmuterLab01.text=<html><body>\u4e00\u7247\u5b9e\u9a8c\u5ba4\u5e9f\u589f\u8fd8\u5728\u5192\u7740\u70df\u3002\u4e2d\u592e\u6b8b\u7834\u7684\u5e73\u53f0\u4e0a\uff0c\u4e00\u4e2a\u6ee1\u8138\u80e1\u987b\u7684\u7537\u4eba\u53cc\u624b\u62b1\u5934\uff0c\u795e\u60c5\u604d\u60da\u3002<br><br>\u82f1\u96c4\u4eec\u8d70\u8fd1\u65f6\uff0c\u542c\u89c1\u4ed6\u5583\u5583\u81ea\u8bed\uff1a\u201c\u600e\u4e48\u53c8\u8fd9\u6837\uff0c\u600e\u4e48\u53c8\u8fd9\u6837\u2026\u2026\u201d<br><br>\u770b\u6765\uff0c\u4e3a\u4e86\u63a8\u8fdb\u81ea\u5df1\u7684\u7814\u7a76\uff0c\u8fd9\u4f4d\u8f6c\u5316\u5e08\u613f\u610f\u4e0d\u60dc\u4e00\u5207\u4ee3\u4ef7\uff01<br><br>\u8981\u4e0d\u662f\u53d1\u751f\u4e86\u7206\u70b8\uff0c\u8c01\u77e5\u9053\u8fd9\u95f4\u5b9e\u9a8c\u5ba4\u80fd\u521b\u9020\u51fa\u600e\u6837\u7684\u5947\u8ff9\u3002<br><br>\u5192\u9669\u8005\u4eec\u613f\u610f\u8d44\u52a9\u79d1\u5b66\uff0c\u91cd\u5efa\u8f6c\u5316\u5b9e\u9a8c\u5ba4 (Transmuter's Laboratory) \u5417\uff1f</body></html>
