LevelElementalist01.text=<html><body>\u7070\u9876\u5c71 (Grey Top Mountain)\uff0c\u53ea\u6709\u6700\u52c7\u6562\u7684\u5192\u9669\u8005\u624d\u6562\u8e0f\u8db3\u7684\u5730\u65b9\u3002\u873f\u8712\u7684\u5c71\u9053\u3001\u6eda\u843d\u7684\u5de8\u77f3\u548c\u9669\u5cfb\u7684\u60ac\u5d16\uff0c\u8ba9\u8fd9\u6bb5\u4ee4\u4eba\u76ee\u7729\u7684\u6500\u767b\u7edd\u975e\u95f2\u5ead\u4fe1\u6b65\u3002\u4e0d\u8fc7\uff0c\u503c\u5f97\u5192\u7684\u9669\uff0c\u603b\u4f34\u968f\u7740\u4e30\u539a\u56de\u62a5\u7684\u8bf1\u60d1\u2026\u2026<br><br>\u5018\u82e5\u6709\u5192\u9669\u8005\u767b\u4e0a\u7070\u9876\u5c71 (Grey Top Mountain) \u7684\u5c71\u5dc5\uff0c\u4fbf\u4f1a\u6765\u5230\u4e00\u5ea7\u5e9f\u5f03\u5df2\u4e45\u7684\u6cd5\u5e08\u5854\u524d\uff0c\u9762\u5bf9\u90a3\u6247\u65bd\u6709\u9b54\u6cd5\u7684\u53cc\u5f00\u5927\u95e8\u3002\u4f20\u8bf4\u5854\u4e2d\u85cf\u7740\u4e00\u4ef6\u4f20\u5947\u5b9d\u7269\uff0c\u90a3\u662f\u6614\u65e5\u4ee5\u6b64\u5854\u4e3a\u5bb6\u7684\u5143\u7d20\u4f7f\u6700\u73cd\u89c6\u7684\u6536\u85cf\u3002<br><br>\u8bb8\u591a\u5bfb\u5b9d\u8005\u90fd\u6765\u78b0\u8fc7\u8fd0\u6c14\uff0c\u5374\u6ca1\u6709\u4e00\u4e2a\u4eba\u6d3b\u7740\u4e0b\u5c71\uff0c\u66f4\u522b\u8bf4\u5e26\u8d70\u90a3\u4ef6\u51f6\u540d\u5728\u5916\u7684\u5b9d\u7269\u4e86\u3002<br><br>\u4f60\u613f\u610f\u63a5\u53d7\u6311\u6218\uff0c\u6210\u4e3a\u7b2c\u4e00\u6279\u53d6\u56de\u5143\u7d20\u4f7f\u79d8\u5b9d\u7684\u82f1\u96c4\u5417\uff1f</body></html>
