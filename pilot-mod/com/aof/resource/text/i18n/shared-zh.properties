LevelPirates02.text=<html><body>\u961f\u4f0d\u9c7c\u8d2f\u8d70\u8fdb\u54b8\u72d7\u9152\u9986 (Salty Dog)\uff0c\u53ea\u89c1\u91cc\u9762\u6324\u6ee1\u4e86\u9971\u7ecf\u98ce\u971c\u7684\u6c34\u624b\uff0c\u4e2a\u4e2a\u90fd\u559d\u4e86\u4e0d\u5c11\uff0c\u6709\u4e9b\u66f4\u662f\u9189\u5f97\u4e0d\u7701\u4eba\u4e8b\u3002<br><br>\u5192\u9669\u8005\u4eec\u51e0\u6b21\u60f3\u62db\u547c\u9152\u4fdd\uff0c\u5374\u59cb\u7ec8\u6ca1\u4eba\u642d\u7406\u3002\u4ed6\u4eec\u6e05\u695a\u5730\u611f\u89c9\u5230\uff0c\u8fd9\u91cc\u5e76\u4e0d\u6b22\u8fce\u81ea\u5df1\u3002<br><br>\u6b63\u8981\u79bb\u5f00\u65f6\uff0c\u4e00\u4e2a\u4e50\u5475\u5475\u7684\u9189\u6c49\u6643\u6643\u60a0\u60a0\u5730\u6321\u4f4f\u4e86\u53bb\u8def\u3002<br><br>\u4ed6\u5634\u91cc\u8bf4\u4e0d\u51fa\u4e00\u53e5\u542c\u5f97\u61c2\u7684\u8bdd\uff0c\u53ea\u597d\u624b\u821e\u8db3\u8e48\u5730\u6bd4\u753b\uff0c\u5174\u594b\u5730\u62db\u547c\u82f1\u96c4\u4eec\u5230\u4ed6\u90a3\u684c\u5750\u4e0b\u3002</body></html>
