LevelShamanHut01.text=<html><body>\u5728\u9065\u8fdc\u7684\u5e73\u539f\u4e0a\uff0c\u4e00\u4f4d\u777f\u667a\u7684\u8428\u6ee1\u72ec\u5c45\u4e8e\u7834\u65e7\u7684\u5c0f\u5c4b\u4e2d\u3002\u867d\u5df2\u5e74\u8fc8\uff0c\u4ed6\u4ecd\u4e0d\u65ad\u7814\u4e60\u81ea\u5df1\u7684\u6cd5\u672f\u3002<br><br>\u5c0f\u5c4b\u5916\u8868\u9971\u7ecf\u98ce\u971c\uff0c\u4efb\u8c01\u4e5f\u96be\u4ee5\u60f3\u5230\uff0c\u5176\u4e2d\u7adf\u4f1a\u4e3e\u884c\u5982\u6b64\u7cbe\u5999\u7684\u4eea\u5f0f\u3002<br><br>\u8fd9\u4f4d\u8428\u6ee1\u662f\u8fdc\u8fd1\u95fb\u540d\u7684\u90e8\u843d\u5deb\u672f\u5927\u5e08\u3002\u636e\u8bf4\uff0c\u4ed6\u80fd\u4e0e\u7075\u4f53\u6c9f\u901a\uff0c\u501f\u6b64\u9a71\u9664\u8bc5\u5492\u3002<br><br>\u5192\u9669\u8005\u4eec\u8d70\u8fd1\u65f6\uff0c\u4ed6\u6253\u5f00\u5c4b\u95e8\uff0c\u6325\u4e86\u6325\u6728\u6756\uff0c\u793a\u610f\u4ed6\u4eec\u8fdb\u53bb\u3002<br><br>\uff08\u8428\u6ee1\u53ef\u4ee5\u5378\u4e0b\u82f1\u96c4\u88c5\u5907\u7684\u8bc5\u5492\u7269\u54c1\uff0c\u4f46\u4efb\u52a1\u7269\u54c1\u9664\u5916\u3002\uff09</body></html>
