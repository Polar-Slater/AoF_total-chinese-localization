LevelPearlMermaid01.text=<html><body>\u4e00\u4f4d\u5149\u5f69\u7167\u4eba\u7684\u5e74\u8f7b\u7f8e\u4eba\u9c7c\u6175\u61d2\u5730\u501a\u5728\u5cb8\u8fb9\uff0c\u5c3e\u5df4\u6d78\u5728\u6d45\u6c34\u4e2d\uff0c\u6f2b\u4e0d\u7ecf\u5fc3\u5730\u671b\u7740\u5927\u6d77\u3002<br><br>\u5192\u9669\u8005\u4eec\u8d70\u8fd1\u65f6\uff0c\u7f8e\u4eba\u9c7c\u8f6c\u8fc7\u76ee\u5149\uff0c\u671d\u4ed6\u4eec\u9732\u9f7f\u4e00\u7b11\u3002<br><br>\u5979\u8c03\u76ae\u5730\u7528\u5c3e\u5df4\u62cd\u4e86\u62cd\u6c34\u9762\uff0c\u968f\u540e\u7ffb\u8eab\u8db4\u4e0b\uff0c\u53cc\u624b\u6258\u7740\u4e0b\u5df4\u3002\u82f1\u96c4\u4eec\u8d8a\u8d70\u8d8a\u8fd1\uff0c\u5979\u7684\u7b11\u610f\u4e5f\u8d8a\u6765\u8d8a\u6d53\u3002<br><br>\u5979\u5f00\u53e3\u8bf4\u9053\uff1a\u201c\u4f60\u4eec\u597d\uff0c\u65c5\u884c\u8005\uff01\u54ce\u5440\uff0c\u4f60\u4eec\u8fd9\u7fa4\u4eba\u53ef\u771f\u6709\u610f\u601d\u3002\u8fd9\u6837\u5427\uff0c\u8981\u662f\u8c01\u6709\u4e00\u9897\u73cd\u73e0\uff0c\u613f\u610f\u5272\u7231\uff0c\u6211\u5c31\u62ff\u6df1\u6d77\u91cc\u7684\u4e1c\u897f\u6765\u4ea4\u6362\u3002\u6210\u4ea4\u5417\uff1f\u201d</body></html>
