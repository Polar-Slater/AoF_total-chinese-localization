LevelWerewolf01.text=<html><body>\u5bc2\u9759\u68ee\u6797 (Silent Forest) \u4e2d\u6816\u606f\u7740\u8bb8\u591a\u751f\u7075\uff0c\u4f46\u6ca1\u6709\u4ec0\u4e48\u6bd4\u72fc\u7fa4\u66f4\u52a0\u51f6\u731b\u3002<br><br>\u4e0d\u77e5\u662f\u56e0\u4e3a\u65e0\u4e91\u7684\u591c\u7a7a\u4e2d\u9ad8\u60ac\u7740\u4e00\u8f6e\u6ee1\u6708\uff0c\u8fd8\u662f\u6709\u522b\u7684\u8d85\u81ea\u7136\u529b\u91cf\u5728\u4f5c\u795f\uff0c\u5373\u5c06\u5230\u6765\u7684\u8fd9\u4e00\u591c\uff0c\u7b3c\u7f69\u7740\u4e0d\u7965\u3001\u6050\u60e7\u4e0e\u795e\u79d8\u7684\u6c14\u606f\u3002<br><br>\u4f60\u6562\u5192\u9669\u8e0f\u5165\u5bc2\u9759\u68ee\u6797 (Silent Forest)\uff0c\u5e76\u6709\u5e78\u5168\u8eab\u800c\u9000\u5417\uff1f<br><br>\u8fd8\u662f\u4f1a\u50cf\u5148\u524d\u65e0\u6570\u4eba\u90a3\u6837\uff0c\u547d\u4e27\u4e8e\u6b64\uff1f</body></html>
