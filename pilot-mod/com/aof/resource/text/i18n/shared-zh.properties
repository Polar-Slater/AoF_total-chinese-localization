LevelTranquilGrove01.text=<html><body>\u82f1\u96c4\u4eec\u6df1\u5165\u68a6\u5883\u68ee\u6797 (Dream Forest)\uff0c\u6765\u5230\u4e00\u7247\u8471\u90c1\u7684\u6797\u5730\u524d\u3002\u9633\u5149\u7a7f\u8fc7\u968f\u98ce\u6447\u66f3\u7684\u6811\u51a0\uff0c\u7167\u4eae\u4e86\u6ee1\u773c\u82cd\u7fe0\u3002<br><br>\u4e00\u53ea\u6bdb\u8338\u8338\u7684\u5c0f\u52a8\u7269\u6b63\u5728\u5934\u9876\u7684\u6811\u95f4\u7ffb\u627e\u4e1c\u897f\uff0c\u65e0\u610f\u95f4\u78b0\u843d\u4e86\u4e00\u9897\u679c\u5b9e\u3002\u679c\u5b9e\u76f4\u5760\u800c\u4e0b\uff0c\u9669\u4e9b\u7838\u4e2d\u4e00\u4f4d\u82f1\u96c4\u7684\u8111\u888b\u3002<br><br>\u5192\u9669\u8005\u4eec\u811a\u4e0b\u7684\u5927\u5730\u5ffd\u7136\u9686\u9686\u9707\u52a8\u3002\u4ed6\u4eec\u521a\u5411\u540e\u4e00\u8dc3\uff0c\u4e00\u682a\u6811\u82d7\u4fbf\u4ece\u679c\u5b9e\u843d\u5730\u7684\u5730\u65b9\u7834\u571f\u800c\u51fa\u3002<br><br>\u82f1\u96c4\u4eec\u60ca\u53f9\u5730\u770b\u7740\u6811\u82d7\u8d8a\u957f\u8d8a\u9ad8\uff0c\u8f6c\u773c\u95f4\u4fbf\u4e0e\u6797\u4e2d\u56db\u5468\u7684\u5927\u6811\u4e00\u822c\u65e0\u4e8c\u3002<br><br>\u770b\u6765\uff0c\u8fd9\u7247\u6797\u5730\u8574\u85cf\u7740\u67d0\u79cd\u9b54\u529b\uff0c\u80fd\u8ba9\u79cd\u4e0b\u7684\u690d\u7269\u98de\u901f\u751f\u957f\u3002\u6216\u8bb8\u82f1\u96c4\u4eec\u4e5f\u53ef\u4ee5\u8bd5\u7740\u79cd\u4e0b\u627e\u5230\u7684\u5e7c\u82d7\uff1f</body></html>
