LevelElementalist07.text=<html><body>\u82f1\u96c4\u4eec\u8fc7\u4e86\u9b54\u50cf\u8fd9\u4e00\u5173\uff0c\u9ad8\u5854\u7684\u5927\u95e8\u968f\u4e4b\u655e\u5f00\uff0c\u4eff\u4f5b\u5728\u62db\u547c\u961f\u4f0d\u5165\u5185\u3002\u660f\u6697\u7684\u5854\u5185\u9690\u7ea6\u53ef\u89c1\u87ba\u65cb\u697c\u68af\u6700\u5e95\u4e0b\u7684\u51e0\u7ea7\u53f0\u9636\u3002<br><br>\u4e0d\u77e5\u722c\u4e86\u591a\u4e45\uff0c\u82f1\u96c4\u4eec\u7ec8\u4e8e\u6765\u5230\u5854\u9876\u3002\u4ed6\u4eec\u8d70\u4e0a\u5bbd\u9614\u7684\u9732\u53f0\uff0c\u72c2\u98ce\u6251\u9762\u800c\u6765\uff0c\u52bf\u5934\u731b\u70c8\u5f97\u4eff\u4f5b\u8fde\u8eab\u62ab\u6700\u539a\u91cd\u94e0\u7532\u7684\u5192\u9669\u8005\u90fd\u80fd\u6380\u7ffb\u3002<br><br>\u82f1\u96c4\u4eec\u7a0d\u4f5c\u505c\u7559\uff0c\u9971\u89c8\u8fd9\u4e91\u7aef\u7684\u666f\u81f4\u3002\u811a\u4e0b\u7684\u4e16\u754c\u6e3a\u5c0f\u5f97\u5982\u540c\u4e00\u5ea7\u7f29\u5c3a\u6a21\u578b\u3002<br><br>\u8fdc\u5904\uff0c\u66fe\u4ee4\u4eba\u671b\u800c\u751f\u754f\u7684\u7ea2\u5821 (Red Castle)\uff0c\u5982\u4eca\u4e5f\u4e0d\u8fc7\u662f\u73a9\u5177\u666f\u89c2\u91cc\u7684\u4e00\u4ef6\u6446\u8bbe\u3002</body></html>
LevelElementalist08.text=<html><body>\u4e00\u8def\u594b\u6218\uff0c\u767b\u4e0a\u7070\u9876\u5c71 (Grey Top Mountain)\uff0c\u53c8\u722c\u5230\u6cd5\u5e08\u5854\u7684\u9ad8\u5904\uff0c\u75b2\u60eb\u4e0d\u582a\u7684\u82f1\u96c4\u4eec\u4e0d\u7981\u89c9\u5f97\uff0c\u5143\u7d20\u4f7f\u7684\u79d8\u5b9d\u4e00\u5b9a\u5c31\u5728\u9644\u8fd1\u3002<br><br>\u72c2\u98ce\u7684\u5c16\u5578\u4e2d\u5939\u6742\u7740\u5fae\u5f31\u7684\u80fd\u91cf\u7206\u54cd\u3002\u961f\u4f0d\u5faa\u58f0\u7ed5\u8fc7\u9732\u53f0\uff0c\u53d1\u73b0\u4e86\u4e00\u95f4\u5730\u7262\u5bc6\u5ba4\u7684\u5165\u53e3\u3002\u521a\u8e0f\u8fdb\u53bb\uff0c\u82f1\u96c4\u4eec\u4fbf\u4e0e\u4e00\u7fa4\u5b88\u7740\u53e6\u4e00\u5ea7\u4f20\u9001\u95e8\u7684\u673a\u68b0\u5de8\u517d\u6253\u4e86\u4e2a\u7167\u9762\u3002<br><br>\u53d1\u6761\u591a\u5934\u86c7\u7684\u91d1\u5c5e\u989a\u5494\u54d2\u4f5c\u54cd\uff0c\u8eab\u540e\u7684\u9b54\u6cd5\u95e8\u95ea\u52a8\u7740\u72c2\u4e71\u7684\u84dd\u5149\u3002<br><br>\u65e0\u8bba\u4f20\u9001\u95e8\u7684\u53e6\u4e00\u7aef\u901a\u5f80\u4f55\u65b9\uff0c\u90fd\u5f97\u5148\u89e3\u51b3\u8fd9\u4e9b\u673a\u68b0\u5b88\u536b\uff01</body></html>
