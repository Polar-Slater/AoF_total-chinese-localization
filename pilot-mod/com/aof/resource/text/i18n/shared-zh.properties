LevelPirates16.text=<html><body>\u7ea2\u80e1\u5b50\u8239\u957f\u9a7e\u9a76\u7740\u593a\u6765\u7684\u8239\uff0c\u671d\u6700\u8fd1\u7684\u6e2f\u53e3\u9a76\u53bb\uff0c\u90a3\u5ea7\u4f20\u8bf4\u4e2d\u7684\u5c9b\u5c7f\u6e10\u6e10\u6d88\u5931\u5728\u8fdc\u65b9\u3002<br><br>\u5bfb\u5b9d\u4e4b\u65c5\u5927\u83b7\u6210\u529f\uff0c\u6b22\u6b23\u9f13\u821e\u7684\u8239\u5458\u4eec\u5750\u62e5\u4e00\u5806\u95ea\u4eae\u7684\u6218\u5229\u54c1\uff0c\u5f00\u6000\u7545\u996e\uff0c\u5c3d\u60c5\u5e86\u795d\u3002<br><br>\u72c2\u6b22\u6301\u7eed\u7740\uff0c\u6d77\u76d7\u4eec\u4e00\u4e2a\u63a5\u4e00\u4e2a\u5730\u5012\u4e0b\uff0c\u5e26\u7740\u75b2\u60eb\u4e0e\u9189\u610f\u6c89\u6c89\u7761\u53bb\uff0c\u6700\u540e\u53ea\u5269\u6845\u9876\u77ad\u671b\u53f0\u4e0a\u7684\u5b88\u591c\u4eba\u8fd8\u7ad9\u7740\u3002\u6ca1\u8fc7\u591a\u4e45\uff0c\u5c31\u8fde\u4ed6\u4e5f\u62b5\u6321\u4e0d\u4f4f\u56f0\u610f\uff0c\u95ed\u4e0a\u4e86\u773c\u775b\u3002<br><br>\u6708\u5149\u7167\u8000\u7684\u6ce2\u6d6a\u95f4\uff0c\u51e0\u4e2a\u8fdf\u6765\u7684\u5bbe\u5ba2\u873f\u8712\u6e38\u8fd1\uff0c\u6253\u7b97\u6765\u51d1\u51d1\u70ed\u95f9\u2026\u2026</body></html>
