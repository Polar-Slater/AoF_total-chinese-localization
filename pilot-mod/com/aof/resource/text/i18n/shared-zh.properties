LevelCrystalMine01.text=<html><body>\u82f1\u96c4\u4eec\u5faa\u7740\u4f20\u95fb\uff0c\u6765\u5230\u5e9f\u5f03\u77ff\u573a\u7684\u5165\u53e3\u3002\u8fd9\u91cc\u7a76\u7adf\u8352\u5e9f\u4e86\u591a\u4e45\uff0c\u5df2\u7ecf\u65e0\u4eba\u77e5\u6653\u3002<br><br>\u77ff\u4e95\u58c1\u4e0a\uff0c\u4e00\u7c07\u7c07\u7480\u74a8\u7684\u6c34\u6676\u4ece\u5ca9\u77f3\u4e2d\u63a2\u51fa\uff0c\u53ea\u9700\u4e00\u70b9\u5149\u4eae\uff0c\u4fbf\u4f1a\u95ea\u70c1\u751f\u8f89\u3002\u4ef7\u503c\u8fde\u57ce\u7684\u5b9d\u77f3\uff0c\u6b63\u7b49\u5f85\u7740\u4e0b\u4e00\u6279\u65e0\u754f\u7684\u77ff\u5de5\u524d\u6765\u5f00\u91c7\uff01<br><br>\u9664\u4e86\u593a\u76ee\u7684\u6c34\u6676\uff0c\u961f\u4f0d\u8fd8\u6ce8\u610f\u5230\u96a7\u9053\u6df1\u5904\u98d8\u6765\u4e00\u80a1\u660e\u663e\u7684\u8150\u81ed\u3002\u8fd9\u53ea\u80fd\u8bf4\u660e\u4e00\u4ef6\u4e8b\uff1a\u4e0b\u9762\u6709\u4ea1\u7075\u3002<br><br>\u4efb\u4f55\u80c6\u6562\u8fdb\u5165\u77ff\u573a\u7684\u4eba\uff0c\u90fd\u5c06\u9762\u5bf9\u5f62\u5f62\u8272\u8272\u7684\u53ef\u6015\u654c\u4eba\uff0c\u7ecf\u5386\u4e00\u573a\u82e6\u6218\uff01</body></html>
