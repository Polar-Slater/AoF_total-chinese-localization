LevelWerewolf09.text=<html><body>\u900f\u8fc7\u5bc2\u9759\u68ee\u6797 (Silent Forest) \u9ad8\u5927\u7684\u6811\u6728\uff0c\u53ef\u4ee5\u770b\u89c1\u5de8\u9b54\u5c16\u5cf0 (Trollspire) \u76f4\u63d2\u4e91\u9704\u7684\u5cf0\u9876\uff0c\u5728\u6708\u5149\u4e0b\u95ea\u8000\u3002<br><br>\u5316\u4f5c\u72fc\u4eba\u7684\u5188\u745f\u5728\u524d\u65b9\u98de\u5954\uff0c\u961f\u4f0d\u7d27\u968f\u5176\u540e\uff0c\u51b2\u51fa\u6811\u6797\uff0c\u76f4\u5954\u4e0b\u4e00\u4e2a\u76ee\u7684\u5730\u3002<br><br>\u5de8\u9b54\u5c16\u5cf0 (Trollspire) \u7684\u5c71\u811a\u6e10\u6e10\u6620\u5165\u773c\u5e18\uff0c\u5192\u9669\u8005\u4eec\u53d1\u73b0\u4e00\u7fa4\u8eab\u5f62\u5de8\u5927\u7684\u7c7b\u4eba\u751f\u7269\u65e9\u5df2\u5728\u90a3\u91cc\u4e25\u9635\u4ee5\u5f85\u3002<br><br>\u5176\u4e2d\u4e00\u540d\u5f3a\u58ee\u7684\u72ec\u773c\u5de8\u4eba\u8d70\u4e0a\u524d\uff0c\u671d\u8d76\u6765\u7684\u82f1\u96c4\u4eec\u6bd4\u753b\u7740\u4ec0\u4e48\u3002\u4ed6\u7684\u540c\u4f19\u5219\u7206\u53d1\u51fa\u4e00\u9635\u4ee4\u4eba\u80c6\u5bd2\u7684\u5927\u7b11\u3002</body></html>
