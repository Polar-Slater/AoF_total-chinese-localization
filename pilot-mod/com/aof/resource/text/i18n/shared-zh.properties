LevelDefeatDjin.text=<html><body>\u201c\u4f60\u7684\u613f\u671b\u5b9e\u73b0\u4e86\uff01\u201d\u706f\u795e\u7b11\u7740\u8bf4\u3002\u4ed6\u90a3\u72e1\u9ee0\u7684\u795e\u60c5\u8ba9\u5192\u9669\u8005\u4eec\u9690\u9690\u4e0d\u5b89\u3002\u4ed6\u4eec\u89c9\u5f97\u8fd9\u4e2a\u613f\u671b\u4f3c\u4e4e\u51fa\u4e86\u4ec0\u4e48\u5c94\u5b50\uff0c\u53ef\u73b0\u5728\u5df2\u7ecf\u65e0\u6cd5\u53cd\u6094\u4e86\u3002<br><br>\u706f\u795e\u7528\u65e9\u5df2\u88ab\u9057\u5fd8\u7684\u8bed\u8a00\u4f4e\u58f0\u5ff5\u51fa\u51e0\u53e5\u5492\u8bed\uff0c\u4e00\u9635\u9ebb\u6728\u611f\u987f\u65f6\u5e2d\u5377\u5168\u961f\u3002\u82f1\u96c4\u4eec\u7684\u8eab\u4f53\u8fc5\u901f\u50f5\u786c\uff0c\u6e10\u6e10\u52a8\u5f39\u4e0d\u5f97\u3002\u4ed6\u4eec\u60f3\u60ca\u547c\u3001\u60f3\u9003\u8d70\uff0c\u8eab\u4f53\u5374\u5df2\u4e0d\u542c\u4f7f\u5524\u3002<br><br>\u8f6c\u773c\u95f4\uff0c\u6574\u652f\u961f\u4f0d\u90fd\u5316\u4f5c\u4e86\u575a\u786c\u7684\u5ca9\u77f3\u3002\u66f4\u53ef\u6015\u7684\u662f\uff0c\u706f\u795e\u8ba9\u4ed6\u4eec\u5728\u77f3\u5316\u4e4b\u540e\u4ecd\u7136\u4fdd\u6301\u7740\u6e05\u9192\u7684\u610f\u8bc6\u3002<br><br>\u5982\u4eca\uff0c\u82f1\u96c4\u4eec\u6210\u4e86\u6d3b\u751f\u751f\u7684\u77f3\u50cf\uff0c\u575a\u4e0d\u53ef\u6467\uff0c\u5c06\u5c79\u7acb\u6570\u5343\u5e74\uff01</body></html>
LevelRuneSmith01.text=<html><body>\u5e74\u8fc8\u7684\u77ee\u4eba\u7b26\u6587\u953b\u9020\u5e08\u4e00\u9524\u63a5\u7740\u4e00\u9524\uff0c\u6572\u6253\u7740\u94c1\u7827\u4e0a\u70e7\u5f97\u901a\u7ea2\u7684\u94a2\u94c1\uff0c\u706b\u82b1\u56db\u5904\u98de\u6e85\u3002<br><br>\u5de5\u574a\u7684\u5899\u4e0a\u6302\u6ee1\u4e86\u5404\u5f0f\u5175\u7532\uff0c\u6bcf\u4e00\u4ef6\u90fd\u5c55\u73b0\u51fa\u975e\u51e1\u7684\u6280\u827a\u3002<br><br>\u8fd9\u4f4d\u77ee\u4eba\u53ef\u771f\u662f\u953b\u9020\u884c\u5bb6\uff01<br><br>\u82f1\u96c4\u4eec\u8fdb\u95e8\u65f6\uff0c\u4ed6\u653e\u4e0b\u94c1\u9524\uff0c\u987a\u624b\u634b\u4e86\u634b\u957f\u957f\u7684\u767d\u80e1\u987b\uff0c\u772f\u8d77\u773c\u6253\u91cf\u7740\u6765\u5ba2\u3002<br><br>\u53ea\u8981\u4ef7\u94b1\u5408\u9002\uff0c\u4ed6\u5f88\u4e50\u610f\u4e3a\u961f\u4f0d\u5347\u7ea7\u57fa\u7840\u6b66\u5668\u3001\u62a4\u7532\u548c\u76fe\u724c\u3002</body></html>
