LevelManaSource01.text=<html><body>\u5192\u9669\u8005\u4eec\u773c\u524d\uff0c\u4e00\u7c07\u5de8\u5927\u7684\u6676\u4f53\u7834\u571f\u800c\u51fa\uff0c\u95ea\u95ea\u53d1\u5149\u3002\u6d53\u70c8\u7684\u9b54\u6cd5\u6c14\u606f\u4ece\u4e2d\u6563\u53d1\u51fa\u6765\uff0c\u4e00\u80a1\u80fd\u91cf\u4ee4\u5468\u56f4\u7684\u7a7a\u6c14\u55e1\u55e1\u9707\u54cd\u3002\u4ed6\u4eec\u77e5\u9053\uff0c\u90a3\u6b63\u662f\u7eaf\u7cb9\u7684\u9b54\u529b\u3002<br><br>\u8fd9\u6837\u66b4\u9732\u5728\u5916\u7684\u9b54\u529b\u6e90\u6cc9\u6781\u4e3a\u5371\u9669\uff0c\u51dd\u805a\u5728\u7480\u74a8\u6676\u77f3\u4e2d\u7684\u529b\u91cf\u968f\u65f6\u53ef\u80fd\u7206\u53d1\uff0c\u593a\u4eba\u6027\u547d\u3002<br><br>\u5373\u4fbf\u5192\u9669\u8005\u4eec\u9f13\u8d77\u52c7\u6c14\u9760\u8fd1\uff0c\u4e5f\u4f1a\u611f\u5230\u4e00\u9053\u65e0\u6cd5\u7a7f\u8d8a\u7684\u7535\u5149\u5c4f\u969c\u5c06\u4ed6\u4eec\u63a8\u5f00\uff0c\u4eff\u4f5b\u9b54\u529b\u6e90\u6cc9\u672c\u8eab\u5728\u7aed\u529b\u544a\u8beb\u4ed6\u4eec\u4e0d\u8981\u63a5\u8fd1\u3002<br><br>\u4e0d\u8fc7\uff0c\u4f4e\u5934\u671b\u53bb\uff0c\u4ed6\u4eec\u53d1\u73b0\u5730\u4e0a\u6563\u843d\u7740\u4e00\u4e9b\u6676\u4f53\u788e\u7247\uff0c\u60f3\u5fc5\u662f\u4e0a\u6b21\u80fd\u91cf\u7206\u53d1\u65f6\u5d29\u843d\u7684\u3002\u788e\u7247\u4f3c\u4e4e\u89e6\u624b\u53ef\u53ca\uff0c\u4e5f\u8bb8\u82f1\u96c4\u4eec\u80fd\u8d76\u5728\u9b54\u529b\u6e90\u6cc9\u518d\u6b21\u53d1\u4f5c\u3001\u628a\u4ed6\u4eec\u6d3b\u6d3b\u70e7\u7126\u4e4b\u524d\uff0c\u53d6\u8d70\u4e00\u4e9b\uff1f</body></html>
