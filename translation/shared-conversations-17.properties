# 通用对话第17批：水晶矿场与受诅咒的尸妖。
SXX_CrystalMine_dwarves_gold.conversations.1.name=提示
SXX_CrystalMine_dwarves_gold.conversations.1.text=矮人矿工果然是采矿的行家，水晶矿场 (Crystal Mine) 如今正全力开采！经纪人递给你一只装着750金币的钱袋。（矿场每天都会上缴收益。）
SXX_CrystalMine_miners_gold.conversations.1.name=提示
SXX_CrystalMine_miners_gold.conversations.1.text=水晶矿场 (Crystal Mines) 派来的信使带来了500金币。英雄们不禁琢磨，若是雇用矮人矿工，收益会不会更高？（矿场每天都会上缴收益。）
SXX_CrystalMine_unlocked.conversations.1.name=提示
SXX_CrystalMine_unlocked.conversations.1.text=英雄们听到传闻，矮人的领地上有一座废弃已久的矿场。究竟是什么赶走了矿工？难道矿场里闹鬼？
SXX_CursedWights_unlocked.conversations.0.name=尸妖
SXX_CursedWights_unlocked.conversations.0.text=<html><body>剑——剑……<br>把剑交给我们。</body></html>
SXX_CursedWights_unlocked.conversations.1.name=尸妖
SXX_CursedWights_unlocked.conversations.1.text=<html><body>它找到了我们，束缚着我们，它不属于你们……<br>把剑交给我们，凡人。</body></html>
SXX_CursedWights_unlocked.conversations.2.name=尸妖
SXX_CursedWights_unlocked.conversations.2.text=<html><body>它的光芒穿透黑夜，我们无法视而不见……<br>我们光辉的诅咒。把剑交给我们……</body></html>
SXX_CursedWights_unlocked.conversations.3.name=尸妖
SXX_CursedWights_unlocked.conversations.3.text=<html><body>……否则，我们别无选择……<br>……只能动手夺过来了！</body></html>
