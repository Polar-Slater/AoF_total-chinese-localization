# 通用事件第17批：闹鬼矿场、水晶矿场及受诅咒的尸妖。
LevelCrystalMine01.text=<html><body>英雄们循着传闻，来到废弃矿场的入口。这里究竟荒废了多久，已经无人知晓。<br><br>矿井壁上，一簇簇璀璨的水晶从岩石中探出，只需一点光亮，便会闪烁生辉。价值连城的宝石，正等待着下一批无畏的矿工前来开采！<br><br>除了夺目的水晶，队伍还注意到隧道深处飘来一股明显的腐臭。这只能说明一件事：下面有亡灵。<br><br>任何胆敢进入矿场的人，都将面对形形色色的可怕敌人，经历一场苦战！</body></html>
LevelCrystalMine01.selection-text=要探索矿场吗？
LevelCrystalMine01.location.name=闹鬼矿场 (Haunted Mine)
LevelCrystalMine01.triggers.on-select-1.text=暂时不了，我们回去吧。
LevelCrystalMine01.triggers.on-select-1.description=返回世界地图。
LevelCrystalMine01.triggers.on-select-2.text=探索矿场！
LevelCrystalMine01.triggers.on-select-2.description=与亡灵战斗！
LevelCrystalMine03.text=<html><body>盘踞深处的邪恶生物已被击溃，水晶矿场 (Crystal Mine) 终于可以重新开采了！<br><br>一队矿工已经投入工作。金属敲击与岩石碎裂的声音从矿井中回荡而出，工头正检查着刚推到阳光下的一车宝石。<br><br>不久之后，开采所得的收益就会源源不断地流入队伍的钱袋！<br><br>（水晶矿场 (Crystal Mine) 每天都会上缴收益。）</body></html>
LevelCrystalMine03.location.name=水晶矿场 (Crystal Mine)
LevelCursedWights02.location.name=受诅咒的尸妖 (Cursed Wights)
