# 血与月独立对白第1批：完整覆盖21组、130条内容。
CONVERSATIONS=werewolfdlc
LOCALE=zh
W01_Footman_death.conversations.0.name=步兵
W01_Footman_death.conversations.0.text=啊——！
W01_Knight_damage.conversations.0.name=骑士
W01_Knight_damage.conversations.0.text=弟兄们，小心。这头野兽很凶！
W01_Knight_damage.conversations.1.name=冈瑟
W01_Knight_damage.conversations.1.text=<html><body>我早就警告过你，愚蠢的骑士。现在太迟了。<br>你们都得死！</body></html>
W02_Dwarves_battle_intro.conversations.0.name=吉尔洛克
W02_Dwarves_battle_intro.conversations.0.text=瞧，那头狼正跟那么多人打呢！伙计们，要不要帮帮这只小狗？
W02_Dwarves_battle_intro.conversations.1.name=芬
W02_Dwarves_battle_intro.conversations.1.text=别冲动，吉尔！这事跟咱们可没关系，别往里掺和。
W02_Dwarves_battle_intro.conversations.2.name=芬
W02_Dwarves_battle_intro.conversations.2.text=让他们自己解决，咱们在旁边看着。你要乐意，就在场边当个裁判。
W02_Dwarves_battle_intro.conversations.3.name=吉尔洛克
W02_Dwarves_battle_intro.conversations.3.text=矮人的荣誉可不容许我袖手旁观。揍他们，跟我来！
W02_Dwarves_battle_intro.conversations.4.name=芬
W02_Dwarves_battle_intro.conversations.4.text=得，真倒霉。我妈总叮嘱我，别跟着矮人到处跑……
W02_Dwarves_battle_intro.conversations.5.name=吉尔洛克
W02_Dwarves_battle_intro.conversations.5.text=<html><body>呃……我刚才是不是听见你在抱怨咱们这份矮人情谊？<br>你也想挨揍，是吧？</body></html>
W02_Dwarves_battle_intro.conversations.6.name=芬
W02_Dwarves_battle_intro.conversations.6.text=……
W02_Forest_battle_intro.conversations.0.name=奈丽
W02_Forest_battle_intro.conversations.0.text=哦，不！那么漂亮的野兽！那些可恶的猎人。巴尔瓦，他需要我们帮忙！
W02_Forest_battle_intro.conversations.1.name=巴尔瓦
W02_Forest_battle_intro.conversations.1.text=嘁，先等等吧。寒夜里能有张好皮毛暖身，倒也不错。
W02_Forest_battle_intro.conversations.2.name=奈丽
W02_Forest_battle_intro.conversations.2.text=<html><body>巴尔瓦！你怎么能这么狠心？！<br>我们必须帮忙。不然我再也不理你了！</body></html>
W02_Forest_battle_intro.conversations.3.name=巴尔瓦
W02_Forest_battle_intro.conversations.3.text=好吧，我们去救你的新宠物。
W02_Forest_battle_intro.conversations.4.name=巴尔瓦
W02_Forest_battle_intro.conversations.4.text=<html><body>那些小喽啰交给你。<br>我来对付那个铠甲亮闪闪的大块头骑士。</body></html>
W02_Knight_death.conversations.0.name=骑士
W02_Knight_death.conversations.0.text=<html><body>呃……<br>卑鄙的野兽……</body></html>
W02_Monk_damage.conversations.0.name=僧侣
W02_Monk_damage.conversations.0.text=<html><body>啊！<br>杀了那头邪恶的野兽！</body></html>
W02_Monk_damage.conversations.1.name=冈瑟
W02_Monk_damage.conversations.1.text=<html><body>神父，我不是邪恶的野兽。<br>请让你的士兵停手，否则还会有更多人流血！</body></html>
W02_RoyalGuard_damage.conversations.0.name=皇家卫士
W02_RoyalGuard_damage.conversations.0.text=<html><body>啊……<br>快去叫援军！</body></html>
W02_RoyalGuard_damage.conversations.1.name=冈瑟
W02_RoyalGuard_damage.conversations.1.text=<html><body>对，援军，来吧！<br>我会把他们全杀光。吼——！</body></html>
W03_Arges_death.conversations.0.name=阿尔戈斯
W03_Arges_death.conversations.0.text=<html><body>老大，我来了！等一……<br>啊！</body></html>
W03_Brontes_damage.conversations.0.name=布隆忒斯
W03_Brontes_damage.conversations.0.text=<html><body>呃……<br>我的肚子！早饭全出来了！</body></html>
W03_Gats_death.conversations.0.name=加茨
W03_Gats_death.conversations.0.text=<html><body>哎哟！<br>坏狗狗……</body></html>
W04_NagaWarrior_damage.conversations.0.name=娜迦战士
W04_NagaWarrior_damage.conversations.0.text=<html><body>呃，好痛……嘶！<br>姐妹们，击退入侵者！</body></html>
W04_Octopod_death.conversations.0.name=冈瑟
W04_Octopod_death.conversations.0.text=看来今晚有寿司吃了。
W05_Necromancer_death.conversations.0.name=冈瑟
W05_Necromancer_death.conversations.0.text=我要把你撕开，你这恶毒的混蛋！
W05_Necromancer_death.conversations.1.name=古尔卡尔
W05_Necromancer_death.conversations.1.text=<html><body>不……不！<br>不——！</body></html>
W05_Necromancer_death.conversations.2.name=冈瑟
W05_Necromancer_death.conversations.2.text=<html><body>为了我的家人！<br>吼——！</body></html>
W05_Shella_control.conversations.0.name=谢拉
W05_Shella_control.conversations.0.text=亲爱的……？
W05_Shella_control.conversations.1.name=冈瑟
W05_Shella_control.conversations.1.text=<html><body>会没事的，亲爱的。<br>冷静些。现在你和我们在一起了。</body></html>
W05_Shella_control.conversations.2.name=谢拉
W05_Shella_control.conversations.2.text=我……我做不到……亲爱的，我觉得这样不行。
W05_Shella_control.conversations.3.name=冈瑟
W05_Shella_control.conversations.3.text=吼——！
W05_Shella_damage.conversations.0.name=谢拉
W05_Shella_damage.conversations.0.text=哎哟！
W05_Shella_damage.conversations.1.name=冈瑟
W05_Shella_damage.conversations.1.text=谢拉，停下！我们能破除这个法术！
W05_Shella_damage.conversations.2.name=谢拉
W05_Shella_damage.conversations.2.text=<html><body>我……我做不到，亲爱的！<br>啊……</body></html>
W05_Shella_damage.conversations.3.name=冈瑟
W05_Shella_damage.conversations.3.text=你这邪恶的死灵法师，不得好死！
W05_Shella_death.conversations.0.name=谢拉
W05_Shella_death.conversations.0.text=啊……
W05_Shella_death.conversations.1.name=冈瑟
W05_Shella_death.conversations.1.text=谢拉！！
W05_Shella_death.conversations.2.name=谢拉
W05_Shella_death.conversations.2.text=<html><body>别担心我，亲爱的！<br>救救我们的女……啊——！</body></html>
WXX_Dwarves_Gats_death_hint.conversations.0.name=芬
WXX_Dwarves_Gats_death_hint.conversations.0.text=<html><body>今天可真是……多姿多彩。主要是血红色。<br>咱们这位毛茸茸的朋友，脾气可不太好。</body></html>
WXX_Dwarves_Gats_death_hint.conversations.1.name=吉尔洛克
WXX_Dwarves_Gats_death_hint.conversations.1.text=<html><body>这有什么奇怪的。先是妻子，又是女儿。<br>矮人的荣誉……</body></html>
WXX_Dwarves_Gats_death_hint.conversations.2.name=芬
WXX_Dwarves_Gats_death_hint.conversations.2.text=明白。咱们帮帮这只狗狗。
WXX_Dwarves_Gats_death_hint.conversations.3.name=吉尔洛克
WXX_Dwarves_Gats_death_hint.conversations.3.text=芬，你学得真快。
WXX_Dwarves_necromancers_hint.conversations.0.name=芬
WXX_Dwarves_necromancers_hint.conversations.0.text=那些娜迦没撒谎，她们那地方满是死灵法术的臭味。
WXX_Dwarves_necromancers_hint.conversations.1.name=吉尔洛克
WXX_Dwarves_necromancers_hint.conversations.1.text=这也没什么好奇怪的。几乎天天都有哪个蠢法师给咱们惹麻烦。
WXX_Dwarves_necromancers_hint.conversations.2.name=芬
WXX_Dwarves_necromancers_hint.conversations.2.text=你说咱们要不要查一查？去沼泽转一趟，兴许能给咱们的狗狗朋友找点答案。
WXX_Dwarves_necromancers_hint.conversations.3.name=吉尔洛克
WXX_Dwarves_necromancers_hint.conversations.3.text=好，小伙子。接下来，去狠揍那个死灵法师一顿！
WXX_Forest_Gats_death_hint.conversations.0.name=巴尔瓦
WXX_Forest_Gats_death_hint.conversations.0.text=<html><body>嚯，真够血腥的！<br>这狼人有点风格……我喜欢他。</body></html>
WXX_Forest_Gats_death_hint.conversations.1.name=奈丽
WXX_Forest_Gats_death_hint.conversations.1.text=因为他跟你一样，是个杀人狂，巴尔瓦。
WXX_Forest_Gats_death_hint.conversations.2.name=巴尔瓦
WXX_Forest_Gats_death_hint.conversations.2.text=我才不是杀人狂。
WXX_Forest_Gats_death_hint.conversations.3.name=奈丽
WXX_Forest_Gats_death_hint.conversations.3.text=不是吗？
WXX_Forest_Gats_death_hint.conversations.4.name=巴尔瓦
WXX_Forest_Gats_death_hint.conversations.4.text=好吧。也许有那么一点？
WXX_Forest_Gats_death_hint.conversations.5.name=奈丽
WXX_Forest_Gats_death_hint.conversations.5.text=“也许”？“一点”？
WXX_Forest_Gats_death_hint.conversations.6.name=巴尔瓦
WXX_Forest_Gats_death_hint.conversations.6.text=行吧。我是杀人狂。
WXX_Forest_necromancers_hint.conversations.0.name=奈丽
WXX_Forest_necromancers_hint.conversations.0.text=可怜的小冈瑟。我们现在该怎么办？
WXX_Forest_necromancers_hint.conversations.1.name=巴尔瓦
WXX_Forest_necromancers_hint.conversations.1.text=“可怜”？“小”？那个凶狠的混蛋把半数蛇女都撕出了窟窿！
WXX_Forest_necromancers_hint.conversations.2.name=奈丽
WXX_Forest_necromancers_hint.conversations.2.text=巴尔瓦，你真是一点同情心都没有！
WXX_Forest_necromancers_hint.conversations.3.name=巴尔瓦
WXX_Forest_necromancers_hint.conversations.3.text=<html><body>我？没有？！简直不可理喻……<br>我倒想知道，她们为什么放我们活着出来？</body></html>
WXX_Forest_necromancers_hint.conversations.4.name=奈丽
WXX_Forest_necromancers_hint.conversations.4.text=<html><body>也许是想让我们帮冈瑟找到答案？<br>我们去帮他，好吗，巴尔瓦？</body></html>
WXX_Forest_necromancers_hint.conversations.5.name=巴尔瓦
WXX_Forest_necromancers_hint.conversations.5.text=我觉得我们做得够多了……
WXX_Forest_necromancers_hint.conversations.6.name=奈丽
WXX_Forest_necromancers_hint.conversations.6.text=巴尔瓦！！
WXX_Forest_necromancers_hint.conversations.7.name=巴尔瓦
WXX_Forest_necromancers_hint.conversations.7.text=好吧！早点跟咱们这位毛茸茸的朋友撇清关系，越早越好。
WXX_Forest_necromancers_hint.conversations.8.name=巴尔瓦
WXX_Forest_necromancers_hint.conversations.8.text=<html><body>去那个迷恋骨头的家伙新找的鬼地方看看吧。他只可能在一个地方。<br>跟我来。</body></html>
