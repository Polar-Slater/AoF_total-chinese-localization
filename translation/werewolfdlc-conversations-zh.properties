WXX_Welcome.conversations.0.text=<html><body>欢迎体验《血与月》（The Blood and Moon）扩展！<br>这些关卡均为可选内容，可在战役期间随时游玩。</body></html>
WXX_Welcome.conversations.1.name=提示
WXX_Welcome.conversations.1.text=建议队伍中的所有单位都达到老兵资历后，再开始《血与月》（The Blood and Moon）扩展。感谢你支持独立游戏！
