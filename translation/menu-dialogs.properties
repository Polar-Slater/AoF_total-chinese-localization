BATTLEBOARD_STEAMDECKLAYOUT_HINT=<html><body>触屏操作<br><br>触摸屏支持多种手势。通常可以通过长按查看提示。<br><br>- 所有列表（如队伍单位、可招募单位、物品与属性）均可上下或左右拖动，也可使用滚动条。<br><br>- 战场与世界地图可向任意方向拖动。拖动时会暂停动画。<br><br>- 点击己方或敌方单位可选中它。长按单位可打开操作菜单或详情窗口。<br><br>- 可在设置的操作选项卡中调整长按延迟与拖动灵敏度。<br><br>- 在商店界面中，先选中一个非英雄单位，再长按另一个，即可交换位置。<br><br>- 点击可选区域之外的位置，即可取消已选移动或单位行动。<br><br></body></html>
