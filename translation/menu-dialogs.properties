DEATHSEEKER_IMPOSSIBLE_DESCRIPTION=<html><body><b>难度：<u>寻死者</u>（不可能）</b><br><br>AI 将获得不公平的优势，并运用所有技巧与战术。<br>你的单位会遭受重伤，能力因此下降。<br><br><i>仅在开始新战役时可以选择“寻死者”难度。</i><br><i>战役中一旦降低难度，就无法再调回“寻死者”。</i><br><br><b>战斗中无法保存游戏</b><br><br><i>此难度可能让你倍感挫折！</i><br></body></html>
MASTER_HARD_DESCRIPTION=<html><body><b>难度：<u>大师</u>（困难）</b><br><br>AI 将拥有更强的单位，你无法再依赖单兵优势。<br>团队协作与合理战术至关重要。<br><br><b>你的单位会获得更多经验，</b><br><b>在战役中能够得到更充分的成长。</b><br><br><i>此难度并不公平，仅建议硬核玩家尝试！</i><br><i>这是俄罗斯玩家的默认难度，因为你们就是喜欢受虐。</i></body></html>
EXPERIENCED_NORMAL_DESCRIPTION=<html><body><b>难度：<u>老手</u>（普通）</b><br><br>玩家不会获得额外优势，也不会受到额外限制。<br><br><b>这是推荐给所有玩家的默认难度。</b><br><br><i>此难度适合有经验的玩家。</i><br></body></html>
NOVICE_EASY_DESCRIPTION=<html><body><b>难度：<u>新手</u>（简单）</b><br><br>招募单位享有折扣，且招募数量<br>不受限制。<br>单位极少遭受重伤。<br><br><b>AI 只会使用基础战术与技能。</b><br><br><i>推荐休闲玩家选择此难度。</i><br></body></html>
