# Shared events batch 3: travel encounters, recruitment and party interactions.
SGE_Dryad_friend.conversations.1.name=恐熊
SGE_Dryad_friend.conversations.1.text=吼！
SGE_Dryad_friend.conversations.2.name=林妖
SGE_Dryad_friend.conversations.2.text=你好呀，毛茸茸的朋友。今天怎么到这儿来了？
SGE_Dryad_friend.conversations.3.name=恐熊
SGE_Dryad_friend.conversations.3.text=呜嗷……？
SGE_Dryad_friend.conversations.4.name=林妖
SGE_Dryad_friend.conversations.4.text=<html><body>哎呀，你真有心！嗯，我妈妈挺好的。<br>你家那几只小熊怎么样了？</body></html>
SGE_Dryad_friend.conversations.5.name=提示
SGE_Dryad_friend.conversations.5.text=<html><body>这位野兽朋友向林妖低下头，表示愿意随你们一同旅行！<br>（一头熊加入了你的队伍！）</body></html>
SGE_Dryad_gain.conversations.1.name=提示
SGE_Dryad_gain.conversations.1.text=一位林妖走进森林，不见了踪影。不一会儿，她便带着一把幼苗回来了！
SGE_DwarfBeggar_pay.conversations.0.name=矮人乞丐
SGE_DwarfBeggar_pay.conversations.0.text=嘿，有眼光！准备好，今儿可让你们大开眼界。
SGE_DwarfBeggar_pay.conversations.1.name=矮人乞丐
SGE_DwarfBeggar_pay.conversations.1.text=有人嫌这些剑都是断的，可正因为要修修补补，我才给你们算便宜嘛……一整批，100金币，怎么样？
SGE_DwarfBeggar_pay.conversations.2.name=矮人乞丐
SGE_DwarfBeggar_pay.conversations.2.text=看不上？那这件结实耐用的披风如何？独一无二，只要300金币！什么？！不，这可不是马毯！好吧，往下看。
SGE_DwarfBeggar_pay.conversations.3.name=矮人乞丐
SGE_DwarfBeggar_pay.conversations.3.text=真正压箱底的宝贝，是这口漂亮的大锅！别在意那一丁点裂缝……还有那一小块锈斑、那个断掉的把手，还有那——
SGE_DwarfBeggar_pay.conversations.4.name=矮人乞丐
SGE_DwarfBeggar_pay.conversations.4.text=喂！你们上哪儿去？！回来，还没看完呢！唉，真扫兴……
SGE_DwarfBeggar_select.conversations.0.selection-text=<html><body>路边传来一个沙哑的声音，叫住了队伍。<br>原来是个老矮人，正招手让你们靠近。<br><br>“冒险者们！今儿你们走运啦。<br>跟我来，带你们看看我的独家珍宝展。<br>门票只收区区5金币！”<br><br>你打算怎么做？<br>（你拥有 ${gold} 金币）</body></html>
SGE_ForestElf_gain.conversations.0.name=提示
SGE_ForestElf_gain.conversations.0.text=狼群很快便追上了逃跑者，转眼间就将他撕碎。
SGE_ForestElf_gain.conversations.1.name=提示
SGE_ForestElf_gain.conversations.1.text=英雄们在血淋淋的残骸中找到了几件值钱的小饰物！
SGE_ForestElf_pursue.conversations.0.name=提示
SGE_ForestElf_pursue.conversations.0.text=你的队伍拔腿追赶，一路冲进树林深处。正当线索似乎断了的时候，你们发现一个瘦高的身影正悠闲地靠在一棵老橡树旁。
SGE_ForestElf_pursue.conversations.1.name=提示
SGE_ForestElf_pursue.conversations.1.text=原来是一位大名鼎鼎的精灵神射手！队伍走近时，他站起身，主动提出教你们一招高深的瞄准技巧。
SGE_ForestElf_pursue.conversations.2.name=提示
SGE_ForestElf_pursue.conversations.2.text=如今，你的弓箭手信心十足，觉得自己蒙着眼也能在200码外一箭射中敌人的脾脏！（你的两名弓箭手进阶为游侠。）
SGE_ForestElf_select.conversations.0.selection-text=<html><body>穿过一片茂密的森林时，一个瘦高的<br>身影从队伍旁掠过，消失在树丛中。<br>谁也没来得及看清，那究竟是什么人，<br>又或是什么东西。<br><br>要追上去看看吗？</body></html>
SGE_GoblinTreasure_handsoff.conversations.0.name=提示
SGE_GoblinTreasure_handsoff.conversations.0.text=<html><body>争吵很快变成斗殴，两只地精挥起绿色的小拳头，打作一团。<br>（两只地精都受到了永久创伤。）</body></html>
SGE_GoblinTreasure_handsoff.conversations.1.name=提示
SGE_GoblinTreasure_handsoff.conversations.1.text=那件亮闪闪的小饰物被抛到半空，落地时摔得粉碎。
SGE_GoblinTreasure_select.conversations.0.selection-text=<html><body>你的地精在林中觅食时，发现了一袋财宝！<br>他们立刻吵了起来，争着要把其中<br>最闪亮的那件小饰物据为己有。<br><br>你打算怎么做？</body></html>
SGE_Insectoids_fail.conversations.0.name=提示
SGE_Insectoids_fail.conversations.0.text=你的英雄向虫人冲去。出乎意料的是，它们竟惊恐地退缩，随后消失在漆黑的地道里。也许这些虫子本来就没想打架？
SGE_Insectoids_gain.conversations.0.name=提示
SGE_Insectoids_gain.conversations.0.text=你的林妖尝试交涉，成功与虫人沟通。
SGE_Insectoids_gain.conversations.1.name=提示
SGE_Insectoids_gain.conversations.1.text=经过几轮商谈，你们用几件不值钱的小玩意儿，换到了珍贵的宝石！
SGE_Insectoids_select.conversations.0.selection-text=<html><body>穿行地下隧道时，你的队伍遇到了一群<br>在黑暗中徘徊的虫人。它们的巢穴<br>想必就在附近。气氛十分危险，<br>但它们暂时还没有发动攻击的意思。<br><br>你打算如何应对？</body></html>
SGE_MageTrickster_gain.conversations.0.name=提示
SGE_MageTrickster_gain.conversations.0.text=你一直看到魔术表演结束。魔术师精彩的技艺令观众看得津津有味，他鞠躬谢幕时，大家纷纷鼓掌。
SGE_MageTrickster_gain.conversations.1.name=提示
SGE_MageTrickster_gain.conversations.1.text=表演结束后，魔术师向你走来。他对你的队伍颇为赞赏，决定加入你们！
SGE_MageTrickster_select.conversations.0.selection-text=<html><body>正准备离开一座古朴村庄时，你看见<br>一群孩子围着一个戴兜帽的男人看魔术。<br>五颜六色的火花从魔术师手中流淌而出，<br>逗得孩子们欢呼雀跃。<br><br>要留下来看魔术表演吗？<br>（你拥有 ${gold} 金币）</body></html>
SGE_ManaShard_lost.conversations.1.name=提示
SGE_ManaShard_lost.conversations.1.text=轰！某种力量扰动了队伍携带的魔力碎片，使它们产生失控的共鸣，随后轰然炸裂。
SGE_ManaShard_lost.conversations.2.name=提示
SGE_ManaShard_lost.conversations.2.text=（你失去了所有魔力碎片。）
SGE_Monk_gain.conversations.0.name=僧侣
SGE_Monk_gain.conversations.0.text=<html><body>你们好，朋友们。<br>请到这边来，我有些东西想交给你们。</body></html>
SGE_Monk_gain.conversations.1.name=僧侣
SGE_Monk_gain.conversations.1.text=附近农庄的村民为了答谢我的祝福，坚持送给我一袋金币。
SGE_Monk_gain.conversations.2.name=僧侣
SGE_Monk_gain.conversations.2.text=我已立下安贫之誓，恪守至今，实在无须这份厚礼。不过，若能将它用于你们的高尚事业，我心中也会倍感欣慰。
SGE_Monk_gain.conversations.3.name=提示
SGE_Monk_gain.conversations.3.text=僧侣将钱袋交给了你。（你获得200金币。）
SGE_OldMonastery_select.conversations.0.selection-text=<html><body>穿行林间时，队伍发现了一座破败的<br>修道院，院墙上爬满了苔藓和藤蔓。<br>曾经居住于此的修会，<br>似乎早已离开多年。<br><br>要进去调查一番吗？</body></html>
SGE_OldMonastery_success.conversations.0.name=提示
SGE_OldMonastery_success.conversations.0.text=队伍小心翼翼地走进摇摇欲坠的修道院。一番搜寻后，你们发现一道门，通往一处隐蔽的庭院。
SGE_OldMonastery_success.conversations.1.name=提示
SGE_OldMonastery_success.conversations.1.text=走到阳光下，你们眼前出现一座郁郁葱葱的花园，几位僧侣正在采摘草药。原来这里还有人居住！
SGE_OldMonastery_success.conversations.2.name=提示
SGE_OldMonastery_success.conversations.2.text=僧侣们说，修会中的大多数人都在近日的一场亡灵伏击中丧生。这些虔诚之人希望加入你的军队。（几位僧侣加入了你的队伍！）
SGE_OutpostRuins_enter.conversations.0.name=提示
SGE_OutpostRuins_enter.conversations.0.text=队伍鱼贯走进废弃的哨所。值钱的东西似乎早已被搜刮一空，不过，你们还是找到了一间落满灰尘的铁匠工坊。
SGE_OutpostRuins_enter.conversations.1.name=提示
SGE_OutpostRuins_enter.conversations.1.text=工坊里留下了先进武器的详细图纸，其中一张记载着火焰箭矢的制作方法。
SGE_OutpostRuins_enter.conversations.2.name=提示
SGE_OutpostRuins_enter.conversations.2.text=（你的弓箭手现在可以进阶为烈焰弓箭手了！）
SGE_OutpostRuins_select.conversations.0.selection-text=<html><body>行路途中，队伍偶然发现了一座<br>废弃已久的哨所。它似乎是某场<br>古老战争的遗迹，如今早已破败不堪。<br><br>要探索这片哨所废墟吗？</body></html>
SGE_PrimeSource_fail.conversations.0.name=提示
SGE_PrimeSource_fail.conversations.0.text=一声巨响回荡四周，法师随着一团五彩烟雾消失了。原初之源的狂暴能量，可不是闹着玩的！（你失去了一名法师！）
SGE_PrimeSource_gain.conversations.0.name=提示
SGE_PrimeSource_gain.conversations.0.text=你的元素使成功引出了原初之源的力量，随即召唤出几个听命于他的元素生物！（元素生物加入了你的队伍！）
SGE_PrimeSource_select.conversations.0.selection-text=<html><body>你的队伍找到了一处原初之源！<br>原初之源极不稳定，必须谨慎对待。<br>只有经验丰富的大法师才敢靠近，<br>即便如此，也仍要冒极大的风险！<br><br>要让法师触碰原初之源吗？</body></html>
SGE_RadiatingTunnel_gain.conversations.0.name=提示
SGE_RadiatingTunnel_gain.conversations.0.text=矮人战士走进洞穴。岩壁上脉动的绿光照亮了前路，他很快便走到了隧道另一端。
SGE_RadiatingTunnel_gain.conversations.1.name=提示
SGE_RadiatingTunnel_gain.conversations.1.text=他高声喊道，自己这就原路返回……
SGE_RadiatingTunnel_gain.conversations.2.name=提示
SGE_RadiatingTunnel_gain.conversations.2.text=矮人战士走出洞口时，大家惊愕地发现，他竟然长出了第二颗脑袋！（你的一名矮人战士变成了变异矮人。）
SGE_RadiatingTunnel_select.conversations.0.selection-text=<html><body>队伍发现一处洞口，里面的岩壁泛着光。<br>这里曾是侏儒商贩常走的捷径。<br>后来人们发现，凡是从另一端走出来的，<br>都会染上重病。<br><br>要派人进入洞穴吗？</body></html>
SGE_SnakeStaff_approach.conversations.0.name=提示
SGE_SnakeStaff_approach.conversations.0.text=好奇心驱使你探究巴托洛梅的传说。你走到老人面前，询问他的姓名。他站起身，用一种陌生的语言絮叨起来。
SGE_SnakeStaff_approach.conversations.1.name=提示
SGE_SnakeStaff_approach.conversations.1.text=突然，他手中的蛇杖活了过来，扑向队伍，狠狠咬下一口，注入毒液！（你的一名单位受伤了。）
SGE_SnakeStaff_select.conversations.0.selection-text=<html><body>队伍发现一个老人坐在枯树下，<br>手中握着一根雕成蛇形的法杖。<br>你想起巴托洛梅的传说：这位四处<br>漂泊的圣者，据说有一条魔蛇作使魔。<br><br>要上前询问老人的身份吗？</body></html>
SGE_StolenGold_battle.conversations.0.name=提示
SGE_StolenGold_battle.conversations.0.text=你的队伍追上了窃贼。然而，他们无意投降，非要拼个你死我活！
SGE_StolenGold_battle.conversations.1.name=提示
SGE_StolenGold_battle.conversations.1.text=（战斗结束后，你将取回被盗的金币。）
SGE_StolenGold_select.conversations.0.selection-text=<html><body>趁所有人熟睡之际，一伙窃贼潜入了营地。<br>英雄们醒来后才发现，一小袋金币<br>已被偷走，共计500金币。<br><br>英雄们打算怎么办？<br>（你拥有 ${gold} 金币）</body></html>
SGE_StolenGold_send.conversations.0.name=提示
SGE_StolenGold_send.conversations.0.text=<html><body>你的窃贼追上了那帮家伙，反过来把他们洗劫一空！<br>（你获得1,000金币。）</body></html>
SGE_SuccubusLost_fail.conversations.0.name=提示
SGE_SuccubusLost_fail.conversations.0.text=女恶魔加入了队伍，显得格外欢快！然而，清晨醒来时，你发现她已经离开了。
SGE_SuccubusLost_fail.conversations.1.name=提示
SGE_SuccubusLost_fail.conversations.1.text=和她一起消失的，还有一袋金币。（你失去200金币。）
SGE_SuccubusLost_select.conversations.0.selection-text=<html><body>队伍遇见一个四处游荡、衣不蔽体的少女。<br>英雄们立刻认出，她是一只魅魔，<br>也就是女性恶魔。不过，她似乎彻底<br>迷了路，看起来并没有什么威胁。<br><br>女恶魔问道：<br>“求求你们，能让我加入队伍吗？”</body></html>
SGE_TargetPractice_fail.conversations.0.name=提示
SGE_TargetPractice_fail.conversations.0.text=“好，就这么定了！”射手说道，随后双方各自搭箭瞄准。
SGE_TargetPractice_fail.conversations.1.name=提示
SGE_TargetPractice_fail.conversations.1.text=可惜，对方箭术精湛，一箭正中靶心。你输了赌局，只好掏钱认输。
SGE_TargetPractice_select.conversations.0.selection-text=<html><body>一名射手向你发起挑战，双方各向<br>箭靶射出一箭，比比谁的箭术更好。<br>他想赌上100金币，赢家通吃。<br><br>你的英雄要接受挑战吗？<br>（你拥有 ${gold} 金币）</body></html>
SGE_TargetPractice_win.conversations.0.name=提示
SGE_TargetPractice_win.conversations.0.text=“好，就这么定了！”射手说道，随后双方各自搭箭瞄准。
SGE_TargetPractice_win.conversations.1.name=提示
SGE_TargetPractice_win.conversations.1.text=幸好，你的英雄箭术更胜一筹，一箭精准地射中了靶心。你赢得了赌局！
SGE_UndeadAltar_gain.conversations.0.name=提示
SGE_UndeadAltar_gain.conversations.0.text=队伍试着靠近祭坛，却被一股无形的黑暗力量推了回来。
SGE_UndeadAltar_gain.conversations.1.name=提示
SGE_UndeadAltar_gain.conversations.1.text=费了一番力气后，你们终于突破了魔法屏障。
SGE_UndeadAltar_gain.conversations.2.name=提示
SGE_UndeadAltar_gain.conversations.2.text=祭坛顿时燃起熊熊黑焰，一股亡灵之力席卷了整支军队！（所有亡灵单位获得100点经验值。）
SGE_UndeadAltar_select.conversations.0.selection-text=<html><body>一队骷髅斥候巡逻归来，你察觉他们<br>身上缠绕着一股诡异的黑暗能量。<br>你命他们原路返回，结果在路旁发现了<br>一座可怕巫妖留下的诅咒祭坛。<br><br>你打算怎么做？</body></html>
SGE_Unicorn_fight.conversations.0.name=僵尸
SGE_Unicorn_fight.conversations.0.text=脑子……
SGE_Unicorn_fight.conversations.1.name=僵尸
SGE_Unicorn_fight.conversations.1.text=脑子……好……吃……
SGE_Unicorn_fight.conversations.2.name=僵尸
SGE_Unicorn_fight.conversations.2.text=<html><body>新……鲜的脑子……<br>脑子……</body></html>
SGE_Unicorn_fight.conversations.3.name=独角兽
SGE_Unicorn_fight.conversations.3.text=咿——！
SGE_Unicorn_fight.conversations.4.name=提示
SGE_Unicorn_fight.conversations.4.text=独角兽勃然大怒，将这些蹒跚的尸体踩翻在地！（你的几个亡灵单位受了重伤。）
SGE_WargsHowl_select.conversations.0.selection-text=<html><body>满月下扎营时，一阵远处传来的<br>骇人嚎叫惊醒了队伍。四下游荡的，<br>不知会是什么可怕的怪物！<br><br>要调查嚎叫声的来源吗？</body></html>
SGE_WargsHowl_success.conversations.0.name=提示
SGE_WargsHowl_success.conversations.0.text=队伍趁着夜色，朝嚎叫声传来的方向走去。不久，你们找到一片静谧的空地，一头迷路的座狼正在漫无目的地打转。
SGE_WargsHowl_success.conversations.1.name=提示
SGE_WargsHowl_success.conversations.1.text=这头野兽一反常态地友善，摇着尾巴向你靠近。（一头座狼加入了你的队伍！）
SGE_WillOWisp_battle.conversations.1.name=提示
SGE_WillOWisp_battle.conversations.1.text=队伍跟着鬼火走进沼泽深处。你们突然发现，这是个陷阱——四周已经被亡灵包围了！
SGE_WillOWisp_gain.conversations.1.name=提示
SGE_WillOWisp_gain.conversations.1.text=传说是真的！鬼火将你们引到了一处早被遗忘的藏宝地。你们拿走值钱的东西，随后原路返回。
SGE_WillOWisp_select.conversations.0.selection-text=<html><body>穿行沼泽时，你的队伍遇到了一群鬼火！<br>这些幽灵素来以将冒险者引入陷阱闻名，<br>但也有传说，说它们会指引人找到宝藏。<br><br>要跟随这些鬼火吗？</body></html>
