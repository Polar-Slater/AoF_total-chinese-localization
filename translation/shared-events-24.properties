# 通用事件第24批：死灵法师公会与隐世修道院
LevelUndeadGuild01.text=<html><body>冒险者们走进城郊一片废弃的街区，目光穿过月光下的薄雾，被一座阴森的宅邸吸引。<br><br>四周一片死寂。没有人，也没有动物。<br><br>这里找不到半点生活的迹象，甚至连“禁止入内”或“当心恶犬”这样的告示牌都没有。在如此拒人于千里之外的街道上，本该随处可见这些牌子，可这里什么也没有。<br><br>随着队伍逐渐靠近宅邸，空气中那股若有若无的腐臭似乎越来越浓了。<br><br>英雄们还要继续靠近吗？</body></html>
LevelUndeadGuild01.selection-text=队伍要再靠近一些吗？
LevelUndeadGuild01.location.name=死灵法师公会 (Necromancer's Guild)
LevelUndeadGuild01.triggers.on-select-1.text=暂时不了，回去吧。
LevelUndeadGuild01.triggers.on-select-1.description=返回世界地图。
LevelUndeadGuild01.triggers.on-select-2.text=好，进去吧！
LevelUndeadGuild01.triggers.on-select-2.description=进入阴森的宅邸。
LevelUndeadGuild02a.conversations.0.name=吉尔洛克
LevelUndeadGuild02a.conversations.0.text=哟，瞧瞧这有钱人的宅子，破是破了点，不过正好没人住。咱们进去瞅一眼怎么样？
LevelUndeadGuild02a.conversations.1.name=芬
LevelUndeadGuild02a.conversations.1.text=你疯了吧，吉尔！这地方一股死人味，咱们还是赶紧走吧。
LevelUndeadGuild02a.conversations.2.name=吉尔洛克
LevelUndeadGuild02a.conversations.2.text=得了吧。八成是厨房台子上忘了收的炖肉，搁那儿招苍蝇呢。跟我来。
LevelUndeadGuild02a.conversations.3.name=芬
LevelUndeadGuild02a.conversations.3.text=总觉得这事儿不太对劲……
LevelUndeadGuild02a.conversations.4.name=门
LevelUndeadGuild02a.conversations.4.text=（咚咚，敲门声）
LevelUndeadGuild02a.conversations.5.name=鲁罗克
LevelUndeadGuild02a.conversations.5.text=嗯，谁在外面？有客人？
LevelUndeadGuild02a.conversations.6.name=鲁罗克
LevelUndeadGuild02a.conversations.6.text=哦，真不敢相信！芬，我的老朋友，你近来可好？
LevelUndeadGuild02a.conversations.7.name=芬
LevelUndeadGuild02a.conversations.7.text=什么……？这位神秘的先生，咱俩认识吗？
LevelUndeadGuild02a.conversations.8.name=鲁罗克
LevelUndeadGuild02a.conversations.8.text=当然认识，芬，当然！你一定记得，咱们那时几乎每晚都溜去占卜师的宿舍。
LevelUndeadGuild02a.conversations.9.name=鲁罗克
LevelUndeadGuild02a.conversations.9.text=别告诉我你忘了那个可爱的占卜师学徒米丝蒂，她当时可迷你了！
LevelUndeadGuild02a.conversations.10.name=芬
LevelUndeadGuild02a.conversations.10.text=啊！鲁罗克，你这坏家伙，好多年没见了！那种日子我怎么忘得了，魔法学院里的好时光啊。
LevelUndeadGuild02a.conversations.11.name=鲁罗克
LevelUndeadGuild02a.conversations.11.text=你最近在忙什么，芬？这些都是你的朋友？
LevelUndeadGuild02a.conversations.12.name=芬
LevelUndeadGuild02a.conversations.12.text=嗯，算是吧，这是吉尔洛克带的矮人队伍。吉尔，这位是鲁罗克。鲁罗克，这位是吉尔。
LevelUndeadGuild02a.conversations.13.name=吉尔洛克
LevelUndeadGuild02a.conversations.13.text=幸会，鲁罗克先生。您这宅子可真漂亮，一点也不破。
LevelUndeadGuild02a.conversations.14.name=芬
LevelUndeadGuild02a.conversations.14.text=咱们搭伙做了几个任务，你也知道是怎么回事。接接零活，乐子从来不断。
LevelUndeadGuild02a.conversations.15.name=鲁罗克
LevelUndeadGuild02a.conversations.15.text=想象得出来！冒险的日子可不轻松。
LevelUndeadGuild02a.conversations.16.name=鲁罗克
LevelUndeadGuild02a.conversations.16.text=自从和克里尔那个新手闹出那场不幸的事，这几年我一直在努力重新振作。
LevelUndeadGuild02a.conversations.17.name=芬
LevelUndeadGuild02a.conversations.17.text=对了，你该不会还在养那些，呃，“宠物”吧？能不能借一只给咱们遛遛？
LevelUndeadGuild02a.conversations.18.name=鲁罗克
LevelUndeadGuild02a.conversations.18.text=当然，芬！新朋友也好，老朋友也好，我都乐意效劳。欢迎进来。
LevelUndeadGuild02b.conversations.0.name=巴尔瓦
LevelUndeadGuild02b.conversations.0.text=莱克莎，你确定我们没找错地方？
LevelUndeadGuild02b.conversations.1.name=莱克莎
LevelUndeadGuild02b.conversations.1.text=没错，肯定是这里。这很符合我那位朋友的风格，他一直就喜欢住这种地方。
LevelUndeadGuild02b.conversations.2.name=巴尔瓦
LevelUndeadGuild02b.conversations.2.text=他是在墓穴里长大的吗？我真怀疑你交朋友的眼光……不过嘛，白送的马就别挑它的牙口了。
LevelUndeadGuild02b.conversations.3.name=莱克莎
LevelUndeadGuild02b.conversations.3.text=不如说别看巴尔瓦的牙口。你那张嘴臭得让人受不了。
LevelUndeadGuild02b.conversations.4.name=巴尔瓦
LevelUndeadGuild02b.conversations.4.text=这话居然出自一个一年才洗一次澡、今年还没洗的女巫。就算洗了，那股鹰身女妖味也洗不掉。
LevelUndeadGuild02b.conversations.5.name=巴尔瓦
LevelUndeadGuild02b.conversations.5.text=你没发现周围的人都尽量往上风处站吗？
LevelUndeadGuild02b.conversations.6.name=莱克莎
LevelUndeadGuild02b.conversations.6.text=你这个丑陋、无知、无礼、粗野的……
LevelUndeadGuild02b.conversations.7.name=门
LevelUndeadGuild02b.conversations.7.text=（门开了）
LevelUndeadGuild02b.conversations.8.name=鲁罗克
LevelUndeadGuild02b.conversations.8.text=什么人？！
LevelUndeadGuild02b.conversations.9.name=莱克莎
LevelUndeadGuild02b.conversations.9.text=哦，你好！抱歉打扰了，我们来找一位朋友。他叫鲁罗克，你知道他还住这里吗？
LevelUndeadGuild02b.conversations.10.name=鲁罗克
LevelUndeadGuild02b.conversations.10.text=<html><body>等等，莱克莎？莱克莎，真的是你？<br>诸神在上，你变化可真大……</body></html>
LevelUndeadGuild02b.conversations.11.name=巴尔瓦
LevelUndeadGuild02b.conversations.11.text=她年纪越来越大，却还当自己是什么选美冠军呢。
LevelUndeadGuild02b.conversations.12.name=莱克莎
LevelUndeadGuild02b.conversations.12.text=<html><body>好多年了，鲁罗克！<br>你……你还记得我们偷偷溜出宿舍，一起看星星的日子吗？</body></html>
LevelUndeadGuild02b.conversations.13.name=莱克莎
LevelUndeadGuild02b.conversations.13.text=<html><body>我们一看就是好几个小时。<br>你那么温柔地握着我的手……</body></html>
LevelUndeadGuild02b.conversations.14.name=巴尔瓦
LevelUndeadGuild02b.conversations.14.text=……我要吐了。
LevelUndeadGuild02b.conversations.15.name=鲁罗克
LevelUndeadGuild02b.conversations.15.text=呃，那是很久以前的事了，莱克莎。我们都不是当年的自己了。你已经……我是说，我们……我们都成熟了。
LevelUndeadGuild02b.conversations.16.name=巴尔瓦
LevelUndeadGuild02b.conversations.16.text=<html><body>听见了吗，莱克莎？<br>他嫌你恶心！</body></html>
LevelUndeadGuild02b.conversations.17.name=莱克莎
LevelUndeadGuild02b.conversations.17.text=什么？！我心里这把火为你燃了几十年，你就只会说这些？！
LevelUndeadGuild02b.conversations.18.name=巴尔瓦
LevelUndeadGuild02b.conversations.18.text=<html><body>说不定问题就出在火光上。<br>要是没照见你这张脸，你也许还有点机会。</body></html>
LevelUndeadGuild02b.conversations.19.name=莱克莎
LevelUndeadGuild02b.conversations.19.text=<html><body>哼，你们两个我都讨厌！<br>那就直接谈正事吧。鲁罗克，我们想借用一些你的……造物。</body></html>
LevelUndeadGuild02b.conversations.20.name=鲁罗克
LevelUndeadGuild02b.conversations.20.text=价钱合适，当然没问题。跟我来，小心脚下。
LevelUndeadGuild03.location.name=死灵法师公会 (Necromancer's Guild)
LevelVampireMonastery01.text=<html><body>山顶的林木边缘，一座朴素的修道院掩映其间，与山下的世界隔绝。<br><br>修女们日复一日地采集疗伤草药，用来调制疗效强劲的恢复药剂。<br><br>无论种族、宗教或信条，只要有体力徒步登山抵达这里，所有访客都可以选购修道院的商品。</body></html>
LevelVampireMonastery01.selection-text=队伍该怎么做？
LevelVampireMonastery01.location.name=隐世修道院 (Secluded Monastery)
LevelVampireMonastery01.triggers.on-select-1.text=回去吧。
LevelVampireMonastery01.triggers.on-select-1.description=返回世界地图。
LevelVampireMonastery01.triggers.on-select-2.text=到礼拜堂祈祷
LevelVampireMonastery01.triggers.on-select-2.description=到礼拜堂祈祷。
LevelVampireMonastery01.triggers.on-select-3.text=拜访草药师的店铺
LevelVampireMonastery01.triggers.on-select-3.description=拜访草药师的店铺。
LevelVampireMonastery01.triggers.on-select-20.text=调试：进入战斗。
LevelVampireMonastery02.text=<html><body>英雄们走进礼拜堂，发现修女们正在祈祷。<br><br>她们并排坐着，低垂着头，反复吟诵着宁静、专注的祷词。每天，她们都会一直祈祷到午夜。<br><br>山间修道院的生活，似乎与外面世界变幻莫测的纷扰截然不同。<br><br>在这里每多待一刻，英雄们的心就更安宁一分。</body></html>
LevelVampireMonastery03b.text=<html><body>英雄们急于尝试修道院的药膏与药剂，走向草药师的店铺。然而，刚跨进门，他们便猛地停住了脚步。<br><br>地上一片狼藉，散落着叶片，涂抹着烟灰，还留有格外醒目的鲜红血迹。<br><br>墙上满是淌着血的手印，以及用鲜血画出的诡异符号。<br><br>无论他们撞见了怎样的黑暗仪式，都已经来不及细想——几个黑影从房间阴暗的角落里猛然现身。<br><br>英雄们拔出武器，准备自卫！</body></html>
LevelVampireMonastery05.conversations.0.name=吸血鬼
LevelVampireMonastery05.conversations.0.text=我闻到了新鲜血液的味道……
LevelVampireMonastery05.conversations.1.name=女吸血鬼
LevelVampireMonastery05.conversations.1.text=<html><body>哦，有客人来了！<br>姐妹们，好好“招待”他们吧。</body></html>
LevelVampireMonastery05.conversations.2.name=女吸血鬼
LevelVampireMonastery05.conversations.2.text=<html><body>他们把自己的鲜血当礼物送来了！<br>吸干他们，唤醒我们的主人！</body></html>
LevelVampireMonastery06.text=<html><body>吸血鬼们拼死抵抗，却仍被逐一斩杀。<br><br>最后一名女吸血鬼也瘫倒成一具苍白的尸体，整座修道院陷入寂静。<br><br>战斗结束，冒险者们沿着来路逃了出去。<br><br>这地方只有死亡，必须永远封闭。英雄们备好火把，掷向这座受诅咒的修道院。不久，整座建筑便被烈火焚毁。</body></html>
