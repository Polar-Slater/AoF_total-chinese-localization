# 海盗！独立对白第1–2批：完整覆盖18组、239条内容。
CONVERSATIONS=piratesdlc
LOCALE=zh
P02_Pikeman_death.conversations.0.name=长枪兵
P02_Pikeman_death.conversations.0.text=<html><body>天哪，又有囚犯越狱了。<br>就算没死在他们手里，老大也会杀了我们！</body></html>
P03_Gargoyle_damage.conversations.0.name=石像鬼长老
P03_Gargoyle_damage.conversations.0.text=你自己才丑呢！
P04_Executioner_damage.conversations.0.name=赛拉斯
P04_Executioner_damage.conversations.0.text=呼！呼！呼！
P04_Executioner_damage.conversations.1.name=赛拉斯
P04_Executioner_damage.conversations.1.text=<html><body>跟挠痒痒似的！<br>哈哈哈</body></html>
P05_NagaWarrior_damage.conversations.0.name=娜迦战士
P05_NagaWarrior_damage.conversations.0.text=<html><body>嘶！<br>陆地上的家伙，还挺能打。</body></html>
PXX_Congratulations.conversations.0.name=红胡子船长
PXX_Congratulations.conversations.0.text=照约定，人人有份。你们这份是凭本事挣来的！现在，我们该启航回大陆了。
PXX_Congratulations.conversations.1.name=红胡子船长
PXX_Congratulations.conversations.1.text=要是还在这岛上晃悠，谁知道还有多少石头守卫，正等着把人打翻在地呢。
PXX_Congratulations.conversations.2.name=红胡子船长
PXX_Congratulations.conversations.2.text=说实话，我越来越喜欢这条新船了。等她挨过几场风暴，再把骷髅旗高高挂起，我看用不了多久，就会像家一样亲切。哈哈！
PXX_Congratulations.conversations.3.name=提示
PXX_Congratulations.conversations.3.text=<html><body>你已完成 Age of Fear: The Undead King GOLD 的《海盗！》（Pirates!）扩展！<br>恭喜！请继续你的战役。</body></html>
PXX_Executioner_select.conversations.0.name=刽子手
PXX_Executioner_select.conversations.0.text=哟，哟，看看这是谁！
PXX_Executioner_select.conversations.1.name=刽子手
PXX_Executioner_select.conversations.1.text=原来你们一直是要去找秘密财宝啊。要是一开始就对我说实话，我本来还能下手轻些……
PXX_Executioner_select.conversations.2.name=刽子手
PXX_Executioner_select.conversations.2.text=哦，骗谁呢——我照样会给你们开膛破肚！我就喜欢猎物挣扎吵闹，把气氛一点点推上去。等斧头终于落下，哦……那简直就是一首活生生的诗！
PXX_Executioner_select.conversations.3.name=刽子手
PXX_Executioner_select.conversations.3.text=对了，多谢你们这么好心，把海岛逍遥之旅的收获都送来了。临死前还这么无私，哈哈哈……
PXX_Executioner_select.conversations.4.name=刽子手
PXX_Executioner_select.conversations.4.text=受死吧！
PXX_Executioner_select.conversations.5.selection-text=<html><body>黑卫士城堡 (Black Guard Castle) 的刽子手追上了你们。<br>他要取你们的性命！<br><br>不过，他行动缓慢，队伍仍能逃走。<br><br>是迎战，还是逃跑？</body></html>
PXX_Human_intro.conversations.0.name=醉酒水手
PXX_Human_intro.conversations.0.text=哦，你好啊，骑士老爷！坐下来，陪我喝两口，怎么样？
PXX_Human_intro.conversations.1.name=${hero-1-name}
PXX_Human_intro.conversations.1.text=老水手，你真客气。看起来，这家酒馆有不少忠实的常客。
PXX_Human_intro.conversations.2.name=醉酒水手
PXX_Human_intro.conversations.2.text=可不是嘛，可不是嘛！
PXX_Human_intro.conversations.3.name=醉酒水手
PXX_Human_intro.conversations.3.text=这帮酒鬼只会干一件事，那就是喝酒。不过你，对，就是你，我看你可不一样！
PXX_Human_intro.conversations.4.name=${hero-1-name}
PXX_Human_intro.conversations.4.text=是吗？是好事，还是坏事呢……？
PXX_Human_intro.conversations.5.name=醉酒水手
PXX_Human_intro.conversations.5.text=当然是好事！胆子大，又有干劲，正是我一直想找的人。
PXX_Human_intro.conversations.6.name=${hero-1-name}
PXX_Human_intro.conversations.6.text=<html><body>那我这不是来了嘛。这地方看着挺舒服，正好让我这双无所畏惧、干劲十足的脚歇上一会儿。<br>说吧，你究竟有什么打算？</body></html>
PXX_Human_intro.conversations.7.name=醉酒水手
PXX_Human_intro.conversations.7.text=嘿，这可太好了！行，那我就直说了。
PXX_Human_intro.conversations.8.name=醉酒水手
PXX_Human_intro.conversations.8.text=你瞧，这是我老爹传给我的地图。我把它忘了好些年，不过这不，又找着了。据说顺着它，就能找到一大笔了不得的财宝。
PXX_Human_intro.conversations.9.name=醉酒水手
PXX_Human_intro.conversations.9.text=我们在……这儿，那座堆满财宝的岛就在……这儿！
PXX_Human_intro.conversations.10.name=醉酒水手
PXX_Human_intro.conversations.10.text=只要天气帮忙，路上也没碰到比你更凶的家伙，出海两天左右就到了。
PXX_Human_intro.conversations.11.name=醉酒水手
PXX_Human_intro.conversations.11.text=地方倒是不远，可我一直凑不齐人手去碰碰运气。
PXX_Human_intro.conversations.12.name=醉酒水手
PXX_Human_intro.conversations.12.text=我自己什么也不要，只盼着你们回来以后，把这一路的故事讲给我听。
PXX_Human_intro.conversations.13.name=醉酒水手
PXX_Human_intro.conversations.13.text=怎么样？这绝对会是一场痛快淋漓的大冒险，嘿嘿！
PXX_Human_intro.conversations.14.name=${hero-1-name}
PXX_Human_intro.conversations.14.text=朋友，这个请求可真不寻常。你既不求回报，也不打算同行？
PXX_Human_intro.conversations.15.name=醉酒水手
PXX_Human_intro.conversations.15.text=都不！我还得守着这把椅子呢。我要是起身走了，整间酒馆还不得翻了天。
PXX_Human_intro.conversations.16.name=醉酒水手
PXX_Human_intro.conversations.16.text=总之，别耽搁了。去码头找红胡子船长，他会等着你的！
PXX_Human_intro.conversations.17.name=${hero-1-name}
PXX_Human_intro.conversations.17.text=我还是有些怀疑，不过换个心情，出海散散心也不错。难就难在，怎么说服路西法留下来照看后方……
PXX_Human_postgame.conversations.0.name=守卫
PXX_Human_postgame.conversations.0.text=喂，冒险者们！
PXX_Human_postgame.conversations.1.name=${hero-1-name}
PXX_Human_postgame.conversations.1.text=你好，士兵！
PXX_Human_postgame.conversations.2.name=守卫
PXX_Human_postgame.conversations.2.text=……
PXX_Human_postgame.conversations.3.name=守卫
PXX_Human_postgame.conversations.3.text=骑士老爷，我们见过吗？你让我想起前不久见过的一个人……
PXX_Human_postgame.conversations.4.name=${hero-1-name}
PXX_Human_postgame.conversations.4.text=哦，那绝不可能。这是我第一次出海，我是奉国王之命来的。
PXX_Human_postgame.conversations.5.name=守卫
PXX_Human_postgame.conversations.5.text=原来如此。准是酒喝多了，脑子不清醒。困在这块石头上，我们也没多少别的事可做。
PXX_Human_postgame.conversations.6.name=${hero-1-name}
PXX_Human_postgame.conversations.6.text=嗯，守城堡想必很容易口渴吧。但愿我没耽误你把杯里的酒喝干。
PXX_Human_postgame.conversations.7.name=守卫
PXX_Human_postgame.conversations.7.text=哈哈！待会儿有的是工夫喝。
PXX_Human_postgame.conversations.8.name=守卫
PXX_Human_postgame.conversations.8.text=对了，你听说了吗？我们那个可怕的刽子手一命呜呼了。
PXX_Human_postgame.conversations.9.name=${hero-1-name}
PXX_Human_postgame.conversations.9.text=是吗？我还是头一回听说。说来听听。
PXX_Human_postgame.conversations.10.name=守卫
PXX_Human_postgame.conversations.10.text=是啊，他和他的兄弟去追一伙该死的海盗，那伙人偷走了我们一艘战船。结果，他们全都送了命。
PXX_Human_postgame.conversations.11.name=守卫
PXX_Human_postgame.conversations.11.text=再也不用听他那地狱般的地牢里传出惨叫了，我可一点也不会怀念……真的，一点也不会。
PXX_Human_postgame.conversations.12.name=${hero-1-name}
PXX_Human_postgame.conversations.12.text=这么说，倒是件好事。
PXX_Human_postgame.conversations.13.name=守卫
PXX_Human_postgame.conversations.13.text=你跟威廉国王很熟，对吧？如今那个挥斧头的疯子没了，黑卫士城堡 (Black Guard Castle) 简直是王室度假的绝佳去处。你说呢？是不是？
PXX_Human_postgame.conversations.14.name=${hero-1-name}
PXX_Human_postgame.conversations.14.text=啊，嗯。等我回到陆上，我会尽量记着跟他提一提。不过，我可不保证。
PXX_Human_postgame.conversations.15.name=守卫
PXX_Human_postgame.conversations.15.text=总之，那个恶棍一死，这地方都明朗多了。今天天气真好，祝你待得愉快。
PXX_Human_postgame.conversations.16.name=守卫
PXX_Human_postgame.conversations.16.text=别忘了在国王面前替我们美言几句！
PXX_Human_treasure.conversations.0.name=${hero-1-name}
PXX_Human_treasure.conversations.0.text=你！我们得谈谈。现在就谈。
PXX_Human_treasure.conversations.1.name=醉酒水手
PXX_Human_treasure.conversations.1.text=哦，我们以前见过？瞧你这年轻力壮的样子，准是准备去大冒险吧！让我给你讲讲我老爹的地图，上头藏着一笔秘密财宝，还有——
PXX_Human_treasure.conversations.2.name=${hero-1-name}
PXX_Human_treasure.conversations.2.text=我受够了！不能再听这酒鬼胡吹了，我得亲自看看那张地图。拿来！
PXX_Human_treasure.conversations.3.name=${hero-1-name}
PXX_Human_treasure.conversations.3.text=什么！你这蠢货，看看角落里的指北针——你一直把地图拿反了！
PXX_Human_treasure.conversations.4.name=${hero-1-name}
PXX_Human_treasure.conversations.4.text=我们根本就没靠近过那座传说中的岛，难怪会落到那种地方！
PXX_Human_treasure.conversations.5.name=醉酒水手
PXX_Human_treasure.conversations.5.text=什么，呃……你们找到什么了？但愿是个刺激的惊喜！
PXX_Human_treasure.conversations.6.name=${hero-1-name}
PXX_Human_treasure.conversations.6.text=一场海战、一座满是恶棍的堡垒，还有个挥着斧头、一心要把我们的脑袋收进藏品的刽子手！就是这些！
PXX_Human_treasure.conversations.7.name=红胡子船长
PXX_Human_treasure.conversations.7.text=老家伙，你把我们直接引进了黑卫士城堡 (Black Guard Castle) 的海域。我折了不少好弟兄，更别提那条船了——我的命根子，我最心爱的宝贝！
PXX_Human_treasure.conversations.8.name=醉酒水手
PXX_Human_treasure.conversations.8.text=哎，唔，这可真是……要不，给逝去的伙计们敬一杯？干杯！
PXX_Human_treasure.conversations.9.name=红胡子船长
PXX_Human_treasure.conversations.9.text=看来我们打扰这旱鸭子拿酒当午饭了。我跟这醉鬼没什么好说的了，地图在手，航向我也清楚了。
PXX_Human_treasure.conversations.10.name=红胡子船长
PXX_Human_treasure.conversations.10.text=要是重新出海，一两天就能到那座神秘小岛。骑士老爷，还要不要继续，你拿主意吧。
PXX_IslandSearch_failure.conversations.0.name=提示
PXX_IslandSearch_failure.conversations.0.text=队伍跋涉进入丛林，一路劈开浓密的草木，清出一条好走些的路。
PXX_IslandSearch_failure.conversations.1.name=提示
PXX_IslandSearch_failure.conversations.1.text=尽管有这么多双眼睛搜寻，英雄们和海盗船员仍没在茂密的荒林中找到任何值钱或有趣的东西。
PXX_IslandSearch_success.conversations.0.name=提示
PXX_IslandSearch_success.conversations.0.text=队伍跋涉进入丛林，一路劈开浓密的草木，清出一条好走些的路。
PXX_IslandSearch_success.conversations.1.name=提示
PXX_IslandSearch_success.conversations.1.text=仔细搜索灌木丛后，英雄们和海盗船员发现了一批藏起来的装备，想必是先前某支探险队留下的！
PXX_MerchantShip_enter.conversations.0.name=海盗
PXX_MerchantShip_enter.conversations.0.text=<html><body>嘿，尊贵的客人！<br>我们刚开张……</body></html>
PXX_MerchantShip_enter.conversations.1.name=海盗
PXX_MerchantShip_enter.conversations.1.text=<html><body>哦，是你啊！多谢你那晚出手相助。<br>最近过得怎么样？</body></html>
PXX_MerchantShip_enter.conversations.2.name=海盗
PXX_MerchantShip_enter.conversations.2.text=<html><body>分完财宝以后，我想了想，海盗这行不适合我。<br>红胡子船长也同意。</body></html>
PXX_MerchantShip_enter.conversations.3.name=海盗
PXX_MerchantShip_enter.conversations.3.text=<html><body>我们做了笔交易。他把双桅横帆船借给我，还答应不抢我。<br>……而我负责卖掉所有……呃……弄来的货。</body></html>
PXX_MerchantShip_enter.conversations.4.name=海盗
PXX_MerchantShip_enter.conversations.4.text=随便看看吧，兴许能找到你感兴趣的东西。
PXX_Tavern_drunkard.conversations.0.name=醉汉
PXX_Tavern_drunkard.conversations.0.text=嘿，旱地老鼠们！
PXX_Tavern_drunkard.conversations.1.name=醉汉
PXX_Tavern_drunkard.conversations.1.text=<html><body>你们的海盗冒险怎么样了？<br>找到不少财宝了吧？</body></html>
PXX_Tavern_drunkard.conversations.2.name=醉汉
PXX_Tavern_drunkard.conversations.2.text=<html><body>哦，连颗珍珠都没有？真遗憾！<br>接着当海盗吧，我敢说你们总能找到点什么。</body></html>
PXX_Tavern_drunkard.conversations.3.name=醉汉
PXX_Tavern_drunkard.conversations.3.text=对了，我的酒杯跑哪儿去了……
PXX_Tavern_round.conversations.0.name=提示
PXX_Tavern_round.conversations.0.text=英雄们请酒馆里的所有人喝了一轮。客人们纷纷举杯，欢呼着祝队伍众人身体健康。
PXX_Undead_intro.conversations.0.name=醉酒水手
PXX_Undead_intro.conversations.0.text=<html><body>哦，你好啊！坐，快坐。<br>骨头先生，说实话，这儿可不常见你这样的客人。你是做什么的？</body></html>
PXX_Undead_intro.conversations.1.name=克里尔
PXX_Undead_intro.conversations.1.text=什么？这个醉醺醺的无赖，竟敢盘问我。等这东西喝完杯里的麦酒，也许还想再续一杯……灰飞烟灭。
PXX_Undead_intro.conversations.2.name=醉酒水手
PXX_Undead_intro.conversations.2.text=哈哈！你可真逗，活像那些路过这里、拿腔拿调的戏子。
PXX_Undead_intro.conversations.3.name=克里尔
PXX_Undead_intro.conversations.3.text=戏子？！我是死灵法师，你这红鼻子的乡巴佬！
PXX_Undead_intro.conversations.4.name=醉酒水手
PXX_Undead_intro.conversations.4.text=噢！难怪外头有那么多咯咯响的骷髅。呼，我还以为自己眼花了。
PXX_Undead_intro.conversations.5.name=醉酒水手
PXX_Undead_intro.conversations.5.text=不过，我就知道没找错人！胆子大，有狠劲，浑身都是使不完的劲儿。
PXX_Undead_intro.conversations.6.name=克里尔
PXX_Undead_intro.conversations.6.text=哦？什么叫没找错“人”？我倒要听听。
PXX_Undead_intro.conversations.7.name=醉酒水手
PXX_Undead_intro.conversations.7.text=你瞧，这是我老爹传给我的地图。我把它忘了好些年，不过这不，又找着了。据说顺着它，就能找到一大笔了不得的财宝。
PXX_Undead_intro.conversations.8.name=醉酒水手
PXX_Undead_intro.conversations.8.text=我们在……这儿，那座堆满财宝的岛就在……这儿！只要天气帮忙，出海两天左右就到了。
PXX_Undead_intro.conversations.9.name=醉酒水手
PXX_Undead_intro.conversations.9.text=怎么样？这绝对会是一场痛快淋漓的大冒险，嘿嘿！
PXX_Undead_intro.conversations.10.name=克里尔
PXX_Undead_intro.conversations.10.text=“痛快淋漓的大冒险”，我可从来不缺。不过，你接着说……
PXX_Undead_intro.conversations.11.name=醉酒水手
PXX_Undead_intro.conversations.11.text=地方倒是不远，可我一直凑不齐人手去碰碰运气。
PXX_Undead_intro.conversations.12.name=醉酒水手
PXX_Undead_intro.conversations.12.text=我自己什么也不要，只盼着你们回来以后，把这一路的故事讲给我听。
PXX_Undead_intro.conversations.13.name=克里尔
PXX_Undead_intro.conversations.13.text=（这蠢酒鬼故事里的财宝对我毫无用处。不过，若能把一船海盗编入我的亡灵军团，倒是一股可观的战力。）
PXX_Undead_intro.conversations.14.name=醉酒水手
PXX_Undead_intro.conversations.14.text=去码头找红胡子船长吧，他会等着你的。干杯！
PXX_Undead_intro.conversations.15.name=克里尔
PXX_Undead_intro.conversations.15.text=（海难夺走的性命那么多，这种无赖就算一去不回，也不会有人多想。至少，他们不会带着出发时那副血肉之躯回来。哈哈哈……）
PXX_Undead_postgame.conversations.0.name=守卫
PXX_Undead_postgame.conversations.0.text=喂，冒险者们！
PXX_Undead_postgame.conversations.1.name=克里尔
PXX_Undead_postgame.conversations.1.text=守卫，有事？你想干什么？
PXX_Undead_postgame.conversations.2.name=守卫
PXX_Undead_postgame.conversations.2.text=只是打个招呼。看你的穿着，我猜你一定是个……是个……
PXX_Undead_postgame.conversations.3.name=克里尔
PXX_Undead_postgame.conversations.3.text=香料商人，没错。现在，恕我失陪，我要——
PXX_Undead_postgame.conversations.4.name=守卫
PXX_Undead_postgame.conversations.4.text=你在这片海域可得小心，有些该死的海盗四处游荡！不过，看你的气派，似乎也不怕他们。
PXX_Undead_postgame.conversations.5.name=克里尔
PXX_Undead_postgame.conversations.5.text=没错。说完了吗？还是你那张喋喋不休的嘴里，还有话急着往外蹦？
PXX_Undead_postgame.conversations.6.name=守卫
PXX_Undead_postgame.conversations.6.text=呃，这个……还真有！你听说我们那个可怕的刽子手一命呜呼了吗？
PXX_Undead_postgame.conversations.7.name=克里尔
PXX_Undead_postgame.conversations.7.text=……
PXX_Undead_postgame.conversations.8.name=守卫
PXX_Undead_postgame.conversations.8.text=他和他那几个同样凶恶的兄弟追一伙海盗去了。据说最后狠狠打了一场。
PXX_Undead_postgame.conversations.9.name=守卫
PXX_Undead_postgame.conversations.9.text=不过，你一个香料商人，想来也没什么理由关心这事。
PXX_Undead_postgame.conversations.10.name=克里尔
PXX_Undead_postgame.conversations.10.text=没错。
PXX_Undead_postgame.conversations.11.name=守卫
PXX_Undead_postgame.conversations.11.text=总之，那个恶棍一死，这地方都明朗多了，你不觉得吗？用不了多久，这里准会成个游览胜地！
PXX_Undead_postgame.conversations.12.name=克里尔
PXX_Undead_postgame.conversations.12.text=……
PXX_Undead_postgame.conversations.13.name=守卫
PXX_Undead_postgame.conversations.13.text=不过，我耽误你够久了。祝你待得愉快！
PXX_Undead_postgame.conversations.14.name=克里尔
PXX_Undead_postgame.conversations.14.text=（烦人的蠢货。）
PXX_Undead_treasure.conversations.0.name=克里尔
PXX_Undead_treasure.conversations.0.text=你……
PXX_Undead_treasure.conversations.1.name=醉酒水手
PXX_Undead_treasure.conversations.1.text=哦，你好啊！嚯，你看着可真吓人，要不要陪我喝杯麦酒，讲个故事？
PXX_Undead_treasure.conversations.2.name=克里尔
PXX_Undead_treasure.conversations.2.text=就凭你这场骗局，我就该先杀了你，再把你唤起来，再杀一次！
PXX_Undead_treasure.conversations.3.name=醉酒水手
PXX_Undead_treasure.conversations.3.text=呃……这可真是，嗯……好吧，为这个喝一杯。干杯！
PXX_Undead_treasure.conversations.4.name=克里尔
PXX_Undead_treasure.conversations.4.text=干杯？！你就只会说这个？！
PXX_Undead_treasure.conversations.5.name=醉酒水手
PXX_Undead_treasure.conversations.5.text=嗯，我跟你说过我老爹的地图吗？据说照着它，就能找到一座小岛，上头有大把的财宝！
PXX_Undead_treasure.conversations.6.name=克里尔
PXX_Undead_treasure.conversations.6.text=你看这张大名鼎鼎的“地图”，差点把我们领进了鬼门关！让我亲眼看看你“老爹”留下的究竟是什么……
PXX_Undead_treasure.conversations.7.name=克里尔
PXX_Undead_treasure.conversations.7.text=蠢货！你把这东西拿反了！南就是南，北就是北，能随便颠倒吗？！啊！！
PXX_Undead_treasure.conversations.8.name=红胡子船长
PXX_Undead_treasure.conversations.8.text=老家伙，你把我们直接引进了黑卫士城堡 (Black Guard Castle) 的海域。我折了不少好弟兄，更别提那条船了——我的命根子，我最心爱的宝贝！
PXX_Undead_treasure.conversations.9.name=醉酒水手
PXX_Undead_treasure.conversations.9.text=哎呀，这可不好。嗯，那……不如陪我借酒消愁？这么一想，是不是好多了！
PXX_Undead_treasure.conversations.10.name=红胡子船长
PXX_Undead_treasure.conversations.10.text=看来我们打扰这旱鸭子拿酒当午饭了。我跟这醉鬼没什么好说的了，地图在手，航向我也清楚了。
PXX_Undead_treasure.conversations.11.name=红胡子船长
PXX_Undead_treasure.conversations.11.text=要是重新出海，一两天就能到那座神秘小岛。骨头老兄，还要不要继续，你拿主意吧。
PXX_Welcome.conversations.0.name=提示
PXX_Welcome.conversations.0.text=<html><body>欢迎体验《海盗！》（Pirates!）扩展。<br>这些关卡均为可选内容，可在战役期间随时游玩。</body></html>
PXX_Welcome.conversations.1.name=提示
PXX_Welcome.conversations.1.text=建议队伍中的所有单位都达到老兵资历后，再开始本扩展。感谢你支持独立游戏！
