# 通用对话第8批：驯兽师泰娅与灯神许愿。
SXX_Beastmaster_select.conversations.0.name=泰娅
SXX_Beastmaster_select.conversations.0.text=你好，旅人！
SXX_Beastmaster_select.conversations.1.name=泰娅
SXX_Beastmaster_select.conversations.1.text=我叫泰娅，家乡离这里很远。
SXX_Beastmaster_select.conversations.2.name=泰娅
SXX_Beastmaster_select.conversations.2.text=<html><body>看来你也喜欢野兽。<br>太好了！</body></html>
SXX_Beastmaster_select.conversations.3.name=泰娅
SXX_Beastmaster_select.conversations.3.text=我一路来到这里，就是想找个战士较量一下。你看起来是个不错的对手，可别让我失望！
SXX_Beastmaster_select.conversations.4.selection-text=<html><body>驯兽师泰娅向你发起挑战。<br>她看起来实力不俗，这一战可不会轻松！<br><br>你要接受挑战，还是退缩？</body></html>
SXX_Beastmaster_won_select.conversations.0.name=泰娅
SXX_Beastmaster_won_select.conversations.0.text=哎哟！你下手可真重。旅人，这一仗打得真痛快。
SXX_Beastmaster_won_select.conversations.1.name=泰娅
SXX_Beastmaster_won_select.conversations.1.text=我想找的就是这样的较量。谢谢你给我这个机会！
SXX_Beastmaster_won_select.conversations.2.name=泰娅
SXX_Beastmaster_won_select.conversations.2.text=<html><body>你的实力让我备受鼓舞。能与你并肩作战，是我的荣幸！<br>你意下如何？</body></html>
SXX_Beastmaster_won_select.conversations.3.selection-text=<html><body>驯兽师泰娅认可了你的斗志，<br>希望加入你的队伍。<br><br>你意下如何？</body></html>
SXX_DjinLamp_fail.conversations.0.name=灯神
SXX_DjinLamp_fail.conversations.0.text=<html><body>啊，原来是个自作聪明的家伙！<br>好吧，愿望就是愿望。</body></html>
SXX_DjinLamp_fail.conversations.1.name=灯神
SXX_DjinLamp_fail.conversations.1.text=不过，在开始之前，你们得先了解一下用愿望换取愿望的规则。来，读读这个。
SXX_DjinLamp_fail.conversations.2.name=提示
SXX_DjinLamp_fail.conversations.2.text=灯神递来一本厚厚的手册，书名是《灯神法则与追加许愿规则》。其中的理论错综复杂，行文更是绕得人晕头转向。
SXX_DjinLamp_fail.conversations.3.name=提示
SXX_DjinLamp_fail.conversations.3.text=英雄们不耐烦地翻着书页，可直到翻到封底，也没读懂几个字。
SXX_DjinLamp_fail.conversations.4.name=灯神
SXX_DjinLamp_fail.conversations.4.text=<html><body>哦，读完了！有什么问题吗？没有？<br>太好了，那就继续处理你们这个聪明的请求吧。</body></html>
SXX_DjinLamp_fail.conversations.5.name=灯神
SXX_DjinLamp_fail.conversations.5.text=你们听过那句谚语吧？授人以鱼，只够吃上一天；授人以渔，却能受用一生。我们只要把其中一个词换掉，那么……
SXX_DjinLamp_fail.conversations.6.name=灯神
SXX_DjinLamp_fail.conversations.6.text=<html><body>……你们的愿望实现了！<br>哈哈哈！</body></html>
SXX_DjinLamp_fail.conversations.7.name=提示
SXX_DjinLamp_fail.conversations.7.text=英雄们顿时觉得脑袋沉得难以承受。灯神数千年来积累的诡计和法条，转瞬间全塞进了他们的脑海，其中还包括那条“自作聪明”条款。
SXX_DjinLamp_fail.conversations.8.name=提示
SXX_DjinLamp_fail.conversations.8.text=灯神把实现愿望的全部学问传给了他们，尽管这些知识对凡人毫无用处，却让他钻了法律的空子，成功脱身！
SXX_DjinLamp_gain.conversations.0.name=灯神
SXX_DjinLamp_gain.conversations.0.text=<html><body>你的愿望实现了！<br>（呼，这个倒是简单！）</body></html>
SXX_DjinLamp_join.conversations.0.name=灯神
SXX_DjinLamp_join.conversations.0.text=什……？凡人，《灯神法典》明文规定，三个愿望全部实现后，灯神不得再与委托人有任何瓜葛！
SXX_DjinLamp_join.conversations.1.name=灯神
SXX_DjinLamp_join.conversations.1.text=根据第3.6款和第3.8款，以及第17条新增的规定，受契约约束的灯神，一律不得……
SXX_DjinLamp_join.conversations.2.name=灯神
SXX_DjinLamp_join.conversations.2.text=……在全部义务已履行、超额履行……
SXX_DjinLamp_join.conversations.3.name=灯神
SXX_DjinLamp_join.conversations.3.text=……或以其他方式终结后，无论结果是否有利，继续干涉物质世界生灵的事务。凡与上述规定相抵触的请求，均须经见证、公证……
SXX_DjinLamp_join.conversations.4.name=灯神
SXX_DjinLamp_join.conversations.4.text=……并一式三份，最迟于下一个至日呈交神意与命运变更委员会的在任官员，而且……
SXX_DjinLamp_join.conversations.5.name=灯神
SXX_DjinLamp_join.conversations.5.text=……
SXX_DjinLamp_join.conversations.6.name=灯神
SXX_DjinLamp_join.conversations.6.text=……
SXX_DjinLamp_join.conversations.7.name=灯神
SXX_DjinLamp_join.conversations.7.text=你们还没走？好吧，我跟你们去就是了。
SXX_DjinLamp_join.conversations.8.name=灯神
SXX_DjinLamp_join.conversations.8.text=但不许再许愿了！还有，把我的灯还给我。我受够了那些所谓的“英雄”，一拿到灯就对我呼来喝去。你们也不例外。
SXX_DjinLamp_join.conversations.9.name=灯神
SXX_DjinLamp_join.conversations.9.text=我的名字？嗯，我已经很久没有名字了。就叫我灯神吧。
SXX_DjinLamp_select.conversations.1.name=灯神
SXX_DjinLamp_select.conversations.1.text=啊——！是谁把我从沉睡中唤醒？
SXX_DjinLamp_select.conversations.2.name=灯神
SXX_DjinLamp_select.conversations.2.text=凡人，是你们中的谁擦了我的灯？
SXX_DjinLamp_select.conversations.3.name=灯神
SXX_DjinLamp_select.conversations.3.text=<html><body>好吧，我可以实现你一个愿望……<br>你想要什么？</body></html>
SXX_DjinLamp_select.conversations.4.selection-text=<html><body>灯神能实现愿望的传说广为人知，<br>但他们爱耍花招的天性也同样出名。许愿时务必谨慎，<br>愿望与诅咒之间，往往只有一线之隔。</body></html>
