# Shared events batch 5: remaining SGE travel-event families.
SGE_BoneCatapult_select.conversations.0.selection-text=<html><body>途经一处古战场时，你发现了一架<br>损坏的投石车。它已无法修复，但研究<br>其中的机关后，你有了一个主意：<br>用几具骷髅的骨骸，造一架自己的投石车。<br><br>要制造骸骨投石车吗？</body></html>
SGE_CityGuards_nobribe.conversations.0.name=提示
SGE_CityGuards_nobribe.conversations.0.text=守卫恶狠狠地威胁辱骂了几句，却没能吓退英雄们。队伍笑着走进了城门。
SGE_CityGuards_select.conversations.0.selection-text=<html><body>城市守卫拒绝让你的队伍通过城门。<br>不过，他们暗示，只要给点钱，<br>他们也许就会改变主意。<br><br>英雄们打算怎么办？<br>（你拥有 ${gold} 金币）</body></html>
SGE_DarkCastle.conversations.1.name=提示
SGE_DarkCastle.conversations.1.text=地平线上耸立着一座阴森的城堡，令你的士兵心生恐惧。究竟谁会住在那种可怕的地方？
SGE_DemonArmy_battle.conversations.1.name=提示
SGE_DemonArmy_battle.conversations.1.text=“你竟敢欺骗我们，凡人！”恶魔首领怒吼着，整支恶魔大军随即转向你们。这将是一场苦战！
SGE_DemonArmy_select.conversations.0.selection-text=<html><body>队伍遇见一支可怕的恶魔大军，<br>正焦急地在王国各地搜寻某样东西，<br>或是某个人。<br><br>恶魔首领问道：<br>“凡人，你见过逃跑的魅魔吗？<br>如果你能指明方向，我们愿意付钱。”</body></html>
SGE_DrunkenDwarf_battle.conversations.0.name=提示
SGE_DrunkenDwarf_battle.conversations.0.text=你正偷拿矮人的东西，他的伙伴却回来了。你们别无选择，只能迎战！
SGE_DrunkenDwarf_select.conversations.0.selection-text=<html><body>这一带常能见到喝醉的矮人四处踉跄。<br>眼前这位独自一人，喝了麦酒后<br>睡得正香。他打着呼噜，<br>手里还紧紧攥着什么东西……<br><br>英雄们要试着“借来用用”吗？</body></html>
SGE_DwarfMerchant_select.conversations.0.selection-text=<html><body>队伍看见一群全副武装的矮人聚在路旁。<br>他们似乎是一位知名矮人商人雇来的护卫，<br>正随商人一同赶路。<br><br>你打算怎么做？</body></html>
SGE_DwarfSmith_select.conversations.0.selection-text=<html><body>在一座小村庄外，你遇到一位矮人铁匠，<br>正在打造活化铠甲。他说这是定制品，<br>可买家已经离开了。他问你是否有意购买。<br><br>要买下这具活化铠甲吗？<br>（你拥有 ${gold} 金币）</body></html>
SGE_DwarvesGang_negotiate_select.conversations.0.selection-text=<html><body>“好吧，伙计！矮人不打自己人。<br>你们就交那笔退休金，怎么样？”<br>匪帮首领说道。<br><br>价钱已经降了，英雄们要付钱吗？<br>（你拥有 ${gold} 金币）</body></html>
SGE_DwarvesGang_select.conversations.0.selection-text=<html><body>一群强壮的矮人挡住了去路。你们刚靠近，<br>更多矮人便从后方围上来，将队伍团团包围。<br>匪帮首领索要1,000金币的“通行费”，<br>还要另收250金币，充作“退休金”。<br><br>英雄们打算怎么办？<br>（你拥有 ${gold} 金币）</body></html>
SGE_DwarvesTavern_leave.conversations.1.name=提示
SGE_DwarvesTavern_leave.conversations.1.text=“吝啬鬼！”一名矮人喊道，随后收拾东西，独自离开了。（连续拒绝的次数越多，矮人离队的可能性就越高！）
SGE_DwarvesTavern_select.conversations.0.selection-text=<html><body>昨晚，你麾下的矮人跑到附近酒馆<br>尽情玩乐了一番。虽然享乐的是他们，<br>他们却想让你来结账。<br><br>英雄们打算怎么办？<br>（你拥有 ${gold} 金币）</body></html>
SGE_EmptyVillage_select.conversations.0.selection-text=<html><body>英雄们发现了一座荒废的村庄。<br>究竟发生了什么神秘事件，让所有村民<br>抛下一切离开，你们恐怕永远无从知晓。<br><br>英雄们打算怎么做？</body></html>
SGE_GoblinSlaves_select.conversations.0.selection-text=<html><body>队伍追上一支徒步行进的商队。<br>武装的人类押送着一长串戴着镣铐的地精。<br>地精一看见你们，便高声呼救，<br>请求你们将他们从人类手中解救出来。<br><br>要解救这些地精奴隶吗？</body></html>
SGE_GoblinsGambling_select.conversations.0.selection-text=<html><body>队伍里的一只地精在掷骰子时作弊，<br>被当场抓住！其他地精已经将他围住，<br>眼看就要动手揍他了。<br><br>英雄们打算怎么办？<br>（你拥有 ${gold} 金币）</body></html>
SGE_Graveyard_battle.conversations.0.name=提示
SGE_Graveyard_battle.conversations.0.text=不该打扰死者的安眠！你们在第一座坟墓中找到了一把强大的匕首——吸血鬼之吻，却也惊醒了亡灵！
SGE_Graveyard_select.conversations.0.selection-text=<html><body>队伍在林中发现了一片早被遗忘的墓地。<br>这里多年来无人打扰，你猜想地下<br>也许埋藏着值钱的东西。<br><br>要挖掘这片墓地吗？</body></html>
SGE_GreenskinsGang_select.conversations.0.selection-text=<html><body>一群面相凶恶的兽人和地精挡住了去路。<br>其中最凶悍的家伙走上前来，<br>开口索要“保护费”。拒绝他们，<br>就免不了一场战斗！<br><br>英雄们打算怎么办？<br>（你拥有 ${gold} 金币）</body></html>
SGE_Harpies_select.conversations.0.selection-text=<html><body>一群鹰身女妖整夜在营地上空盘旋，<br>尖叫不止！要是能让这些吵闹的家伙<br>彻底安静下来就好了……<br><br>英雄们要寻找鹰身女妖的巢穴吗？</body></html>
SGE_HumansVsOrcs_gain.conversations.0.name=提示
SGE_HumansVsOrcs_gain.conversations.0.text=你们一直等到双方拼得只剩几个受伤的残兵，才上前搜寻战场，找到了一些有用的物品！
SGE_HumansVsOrcs_select.conversations.0.selection-text=<html><body>队伍听见激烈的厮杀声，急忙赶去查看。<br>在一片林间空地上，<br>人类与绿皮正打得不可开交。<br><br>英雄们要加入战斗吗？</body></html>
SGE_IkeaWarehouse_select.conversations.0.selection-text=<html><body>城外一座巨大的仓库引起了你的兴趣。<br>简单查看后，你发现它似乎只有一个入口。<br><br>门上的招牌写着：<br>“伊凯乌斯家具 (IKEUS FURNITURE)”。<br><br>你刚靠近门，里面便有人喊道：<br>“还没开门营业，晚点再来！”<br><br>你仍要试着进入仓库吗？</body></html>
SGE_KingAndQueen_gain.conversations.1.name=提示
SGE_KingAndQueen_gain.conversations.1.text=“感谢你一直以来的支持！”信中写道。令你十分惊喜的是，国王与王后竟也送来了一份回礼！
SGE_KingAndQueen_select.conversations.0.selection-text=<html><body>今天是伟大的威廉国王的生日！<br>王国上下齐聚欢庆。按照习俗，<br>大家会给国王送上一份小礼物，以表心意。<br><br>你也想送份礼物吗？<br>（你拥有 ${gold} 金币）</body></html>
SGE_KingSuccessor.conversations.1.name=提示
SGE_KingSuccessor.conversations.1.text=王位继承人诞生了！王国上下欢欣鼓舞！
SGE_LordsFight_select.conversations.0.selection-text=<html><body>几位封建领主决定用战争解决土地归属<br>的争端。这显然毫无必要，但领主们<br>为了小事大动干戈，早已屡见不鲜。<br><br>你的队伍要加入战斗吗？</body></html>
SGE_MercenariesCamp_select.conversations.0.selection-text=<html><body>斥候回来报告，前方有一处人类营地。<br>那里聚集着许多全副武装的人，<br>看起来是一群身经百战的雇佣兵。<br><br>你打算怎么做？</body></html>
SGE_MushroomsCircle_select.conversations.0.selection-text=<html><body>在一片宁静的林间空地中央，队伍发现<br>一圈长着斑点的蘑菇，围成了一个仙女环。<br>它们看起来能吃，但野蘑菇可不能乱尝。<br><br>你打算怎么做？</body></html>
SGE_NecromancerBoneGolem_select.conversations.0.selection-text=<html><body>你的死灵法师发现了一卷古老卷轴，<br>其中记载着唤起可怕骸骨魔像的仪式！<br>要举行仪式，他必须从你麾下的<br>三具骷髅身上取得骨骸。<br><br>要召来一具骸骨魔像吗？</body></html>
SGE_OldChurch_select.conversations.0.selection-text=<html><body>斥候带回了令人振奋的消息！<br>他们发现一处废弃已久的教堂墓园，<br>就在不远处，很适合搜刮一番。<br><br>要搜刮这片教堂墓园吗？</body></html>
SGE_OldFort_select.conversations.0.selection-text=<html><body>队伍发现一座废弃已久的堡垒，<br>里面堆满了锈蚀的武器。几乎所有东西<br>都已年久失修，但厚重篷布下的一架弩炮，<br>似乎还有修复的价值。<br><br>要修复这架弩炮吗？<br>（你拥有 ${gold} 金币）</body></html>
SGE_OldTemple_select.conversations.0.selection-text=<html><body>队伍发现一座神殿，曾有一位强大的<br>死灵法师住在这里。进入其中后，<br>你们看到一座精巧的祭坛。地上摊开的<br>法术书，记载着创造复生亡灵的献祭仪式。<br><br>你打算怎么做？</body></html>
SGE_OrcsSneaking_battle.conversations.0.name=提示
SGE_OrcsSneaking_battle.conversations.0.text=“吼！”一名兽人大叫起来，所有绿皮都转身望向你的队伍。你们被发现了，除了战斗，别无选择！
SGE_OrcsSneaking_select.conversations.0.selection-text=<html><body>你们悄悄来到了大群兽人的身后。<br>他们似乎还没有察觉你们的存在。<br><br>要跟踪这些兽人吗？</body></html>
SGE_PeasantPotions_select.conversations.0.selection-text=<html><body>队伍经过一座小村庄时，几名农民<br>带着各色药剂迎了上来，<br>热情地向你们兜售自家调制的药水。<br><br>要买些农民的药剂吗？<br>（你拥有 ${gold} 金币）</body></html>
SGE_PlagueCemetery_gain.conversations.1.name=提示
SGE_PlagueCemetery_gain.conversations.1.text=穿行沼泽时，队伍发现了一处古老的墓地。这里安葬着一场大瘟疫的死难者。
SGE_PlagueCemetery_gain.conversations.2.name=提示
SGE_PlagueCemetery_gain.conversations.2.text=这么特别的尸体，怎能不唤起来！（瘟疫僵尸加入了你的队伍。）
SGE_ShamanWolves_select.conversations.0.selection-text=<html><body>你们来到一位老地精萨满的小屋前。<br>他正带着一群凶猛的狼四处走动，<br>这些狼却出奇地温顺。萨满邀请你上前，<br>摸摸其中一头大狼的脑袋。<br><br>你打算怎么做？<br>（你拥有 ${gold} 金币）</body></html>
SGE_SkeletonRider_select.conversations.0.selection-text=<html><body>行路途中，你忽然有了个邪恶的主意。<br>理论上，只要将几具普通骷髅融合，<br>就能创造出一名骷髅骑兵。<br>虽有牺牲，代价倒也不算大。<br><br>你打算怎么做？</body></html>
SGE_SkeletonRider_success.conversations.0.name=提示
SGE_SkeletonRider_success.conversations.0.text=试验性的仪式成功了！虽然损失了三具骷髅，却换来了一名更强大的亡灵。（一名骷髅骑兵加入了你的军队。）
SGE_SpiderCave_select.conversations.0.selection-text=<html><body>英雄们来到一个神秘的洞口前。<br>层层蛛网如帘幕般遮住入口，<br>洞穴深处透出诡异的光芒，忽明忽暗。<br><br>英雄们要探索这条隧道吗？</body></html>
SGE_TeslaDwarf_select.conversations.0.selection-text=<html><body>一名工程师迫不及待地向你介绍新成果：<br>他发现了一种驾驭闪电力量的新方法！<br>你已找到愿意试用这件武器的人，<br>不过，他要收取报酬。<br><br>要出钱进行试验吗？<br>（你拥有 ${gold} 金币）</body></html>
SGE_ThievesGuild_select.conversations.0.selection-text=<html><body>经过一座贫困矮人堡垒的贫民区时，<br>你发现了一处热闹的盗贼公会。<br>游荡者和其他罪犯在外面徘徊，<br>看来这里对当地居民可没什么好处。<br><br>你打算怎么做？<br>（你拥有 ${gold} 金币）</body></html>
SGE_ThreeWitches_select.conversations.0.selection-text=<html><body>队伍意外绕进一片泥泞的沼泽，<br>在暮色中遇见三位四处游荡的女巫。<br>看到你们满身污泥，她们顿时大笑起来。<br><br>“欢迎来到天堂，冒险者！等泥浴晾干了，<br>要不要再体验一下我们的沼泽水疗？<br>哇哈哈哈！”<br><br>你打算怎么做？</body></html>
SGE_TrainKnight_select.conversations.0.selection-text=<html><body>队伍里的一名步兵常吹嘘自己从小<br>就很擅长骑马。你想知道他如今的<br>骑术如何，也许值得给他添置装备，<br>将他培养成一名骑士。<br><br>你打算怎么做？<br>（你拥有 ${gold} 金币）</body></html>
SGE_VampireSisters_select.conversations.0.selection-text=<html><body>两位面色苍白的女士走近队伍，<br>自称鲜血姐妹。<br><br>她们举止阴沉，令人不安。<br>她们愿意加入队伍，但要求先献上祭品！<br><br>要让鲜血姐妹加入吗？<br>（选中的活体单位将被杀死。）</body></html>
SGE_VillageFire_help.conversations.1.name=提示
SGE_VillageFire_help.conversations.1.text=尽管你们竭尽全力，村庄还是被烧成了灰烬。不过，英雄们成功救出了一些村民！（你的几个单位受了伤。）
SGE_VillageFire_select.conversations.0.selection-text=<html><body>斥候发现附近的聚落升起浓烟。<br>队伍赶到时，大火正肆虐蔓延。<br>村民们奋力扑救，但显然没有外人帮助，<br>他们是无法控制火势的！<br><br>队伍要帮助村民吗？</body></html>
SGE_Warlock_join.conversations.1.name=提示
SGE_Warlock_join.conversations.1.text=一位四处流浪的萨满跟了你们一整天。夜幕降临时，他来到营地，表示愿意与你们一同冒险。
SGE_Warlock_join.conversations.2.name=提示
SGE_Warlock_join.conversations.2.text=（一名术士加入了你的队伍！）
SGE_WindmillAttack_fail.conversations.0.name=提示
SGE_WindmillAttack_fail.conversations.0.text=绿皮洗劫了你的产业，随即离去。风车磨坊 (Windmill)已被摧毁。
SGE_WindmillAttack_select.conversations.0.selection-text=<html><body>一伙绿皮袭击了你的风车磨坊 (Windmill)！<br>队伍及时赶到，还来得及组织防御。<br>不过，绿皮人数众多，这将是一场苦战！<br><br>要保卫你的风车磨坊 (Windmill)吗？</body></html>
SXX_Gambler_fail.conversations.0.name=提示
SXX_Gambler_fail.conversations.0.text=可怜的赌徒被打手带走，从此再也没有出现。
SXX_Gambler_oracle.conversations.0.name=提示
SXX_Gambler_oracle.conversations.0.text=<html><body>神谕者赢下了每一局，打手们只好离开。<br>倒霉的赌徒安全了！</body></html>
SXX_Gambler_select.conversations.0.selection-text=<html><body>${selected-unit-name} (${selected-unit-original-name})来到你面前：<br>“我赌钱惹上麻烦了……”<br><br>英雄注意到，这个愁眉苦脸的赌徒身后<br>跟着几个打手。<br>“要是不还钱，他们就会把我带走！”<br>赌徒苦苦哀求。<br><br>你要救这个走投无路的赌徒吗？<br>（你拥有 ${gold} 金币）</body></html>
