# 永生之旅独立对白第1–3批：完整覆盖本文件275条内容。
CONVERSATIONS=alchemistdlc
LOCALE=zh

# Return-to-game greetings: 7 complete groups, 66 content entries.
AOF1_Long_time_no_see.conversations.0.name=报丧女妖
AOF1_Long_time_no_see.conversations.0.text=<html><body>主人？主人！<br>您终于回来了，主人！</body></html>
AOF1_Long_time_no_see.conversations.1.name=骷髅
AOF1_Long_time_no_see.conversations.1.text=<html><body>主人醒了！他醒了！<br>我们是您忠诚的仆人。</body></html>
AOF1_Long_time_no_see.conversations.2.name=骷髅
AOF1_Long_time_no_see.conversations.2.text=<html><body>别再离开我们了，主人。<br>黑暗会吞噬我们的！</body></html>
AOF1_Long_time_no_see.conversations.3.name=僵尸
AOF1_Long_time_no_see.conversations.3.text=<html><body>主……人！主……人！<br>饿……饿！脑子！</body></html>
AOF2_Long_time_no_see.conversations.0.name=贝尔卡拉
AOF2_Long_time_no_see.conversations.0.text=<html><body>你可真行！<br>你倒是一点也不着急，是吧？</body></html>
AOF2_Long_time_no_see.conversations.1.name=珀西瓦尔爵士
AOF2_Long_time_no_see.conversations.1.text=卡拉……请冷静一点。
AOF2_Long_time_no_see.conversations.2.name=贝尔卡拉
AOF2_Long_time_no_see.conversations.2.text=<html><body>别叫我冷静！<br>他让我等了……好几个星期！</body></html>
AOF2_Long_time_no_see.conversations.3.name=珀西瓦尔爵士
AOF2_Long_time_no_see.conversations.3.text=<html><body>他现在不是回来了吗。<br>人家也有工作、家庭、爱好……</body></html>
AOF2_Long_time_no_see.conversations.4.name=贝尔卡拉
AOF2_Long_time_no_see.conversations.4.text=<html><body>那也不能把我们晾在一边。<br>凡人，现在就给我继续玩！</body></html>
AOF3_Long_time_no_see.conversations.0.name=吉姆利
AOF3_Long_time_no_see.conversations.0.text=<html><body>呃——唔！哎哟……<br>我……我的脑袋！</body></html>
AOF3_Long_time_no_see.conversations.1.name=吉姆利
AOF3_Long_time_no_see.conversations.1.text=我们……嗝……可想你了！
AOF3_Long_time_no_see.conversations.2.name=多林
AOF3_Long_time_no_see.conversations.2.text=<html><body>闭嘴吧，酒鬼！<br>吉姆利是说，我们一直在等你。</body></html>
AOF3_Long_time_no_see.conversations.3.name=埃林
AOF3_Long_time_no_see.conversations.3.text=<html><body>而且等得可有耐心了！不过，麦酒只剩最后一桶啦。<br>那么，你会继续咱们的正义之旅，对吧？！</body></html>
AOF4_Long_time_no_see.conversations.0.name=美人鱼
AOF4_Long_time_no_see.conversations.0.text=嘿，你回来了！我们可一直惦记着你呢。
AOF4_Long_time_no_see.conversations.1.name=娜迦战士
AOF4_Long_time_no_see.conversations.1.text=嘶……看吧？我就说，只要等着就行。
AOF4_Long_time_no_see.conversations.2.name=潜海者
AOF4_Long_time_no_see.conversations.2.text=有好多事要告诉你！我们看见了一头鲸鱼，还有一只巨型乌贼，还有一——
AOF4_Long_time_no_see.conversations.3.name=美人鱼
AOF4_Long_time_no_see.conversations.3.text=哎呀，你可真无聊！那些捕鱼见闻留着以后再说吧。算了，还是留给你自己听吧。
AOF4_Long_time_no_see.conversations.4.name=娜迦战士
AOF4_Long_time_no_see.conversations.4.text=嘶……那么，你准备好继续我们的冒险了吗？
AOF4_Long_time_no_see.conversations.5.name=章鱼
AOF4_Long_time_no_see.conversations.5.text=咕噜咕噜！咕噜！
AOF5_Long_time_no_see.conversations.0.name=鼠人刺客
AOF5_Long_time_no_see.conversations.0.text=因杜尔夫！警戒，警戒！
AOF5_Long_time_no_see.conversations.1.name=因杜尔夫
AOF5_Long_time_no_see.conversations.1.text=怎么了？哦，是你啊！这么久没见，我都快认不出你了。
AOF5_Long_time_no_see.conversations.2.name=鼠人刺客
AOF5_Long_time_no_see.conversations.2.text=你们这些人类玩意儿，在我眼里都长一个样……你们怎么知道这家伙不是坏蛋？
AOF5_Long_time_no_see.conversations.3.name=莱克莎
AOF5_Long_time_no_see.conversations.3.text=怎么知道？得了吧，臭老鼠，你以为咱们这犯罪生意越做越大，靠的是谁？
AOF5_Long_time_no_see.conversations.4.name=因杜尔夫
AOF5_Long_time_no_see.conversations.4.text=当然是我，不过眼前这位朋友也是不可或缺的一环！
AOF5_Long_time_no_see.conversations.5.name=因杜尔夫
AOF5_Long_time_no_see.conversations.5.text=朋友，我们的冒险可不能一直等下去。还有要紧的买卖等着我们呢！
AOF5_Long_time_no_see.conversations.6.name=因杜尔夫
AOF5_Long_time_no_see.conversations.6.text=我的犯罪帝国需要打理。我的雄心壮志都快饿死了！
AOF5_Long_time_no_see.conversations.7.name=莱克莎
AOF5_Long_time_no_see.conversations.7.text=是我们的帝国，我们的雄心壮志！
AOF5_Long_time_no_see.conversations.8.name=因杜尔夫
AOF5_Long_time_no_see.conversations.8.text=对，对。我们都等不及要继续干了。英雄，你说呢？
AOFFREE_Long_time_no_see.conversations.0.name=提示
AOFFREE_Long_time_no_see.conversations.0.text=Age of Fear: The Free World 旨在带你领略 Age of Fear 的回合制战术玩法与奇幻世界。
AOFFREE_Long_time_no_see.conversations.1.name=提示
AOFFREE_Long_time_no_see.conversations.1.text=如果你喜欢这款游戏，我们诚挚推荐你体验 Age of Fear 系列的其他作品！
AOFFREE_Long_time_no_see.conversations.2.name=提示
AOFFREE_Long_time_no_see.conversations.2.text=这些作品拥有篇幅充实、以故事为核心的战役，还有多种阵营可供选择，每个阵营都有独特的单位与法术。
AOFFREE_Long_time_no_see.conversations.3.name=提示
AOFFREE_Long_time_no_see.conversations.3.text=感谢你支持独立游戏开发者！
AOFTOTAL_Long_time_no_see.conversations.0.name=提示
AOFTOTAL_Long_time_no_see.conversations.0.text=感谢你的支持，希望你在 Age of Fear: Total 中玩得开心。

# Battle reactions: 9 complete groups, 34 content entries.
A01_ChaosSpawn_damage.conversations.0.name=塔尔尼斯
A01_ChaosSpawn_damage.conversations.0.text=<html><body>老天爷！这丑得他妈……<br>我爷爷都死了三十年了，也比这家伙好看！</body></html>
A01_Fiend_death.conversations.0.name=塔尔尼斯
A01_Fiend_death.conversations.0.text=这下他该知道，塔尔尼斯可不是好惹的！
A02_Lich_damage.conversations.0.name=玛尔斯
A02_Lich_damage.conversations.0.text=啊！凡人，你会为此付出代价。
A02_Lich_damage.conversations.1.name=塔尔尼斯
A02_Lich_damage.conversations.1.text=是，是。上次这么说的还是个酒馆老板。他可比你吓人多了，我照样活着走了出来，一个子儿都没付！
A02_Lich_damage.conversations.2.name=塔尔尼斯
A02_Lich_damage.conversations.2.text=……
A02_Lich_damage.conversations.3.name=塔尔尼斯
A02_Lich_damage.conversations.3.text=干吗这么看着我？他店里的麦酒贵得离谱。
A02_Lich_damage.conversations.4.name=塔尔尼斯
A02_Lich_damage.conversations.4.text=……店里的姑娘们也是，不过这不是重点！
A02_Skeleton_death.conversations.0.name=塔尔尼斯
A02_Skeleton_death.conversations.0.text=<html><body>啊，终于清静了！<br>那枯骨咯咯作响，吵得我都快疯了。</body></html>
A02_Spider_damage.conversations.0.name=塔尔尼斯
A02_Spider_damage.conversations.0.text=就是这样，继续砍！把它的腿砍下来。
A02_Spider_damage.conversations.1.name=塔尔尼斯
A02_Spider_damage.conversations.1.text=我知道它们在这世上也有存在的道理，可是……呃，我实在不喜欢蜘蛛！
A02_WaterElemental_activation.conversations.0.name=塔尔尼斯
A02_WaterElemental_activation.conversations.0.text=<html><body>哎哟！怎么有这么多。<br>亲爱的英雄，请大显身手吧。</body></html>
A02_WaterElemental_death.conversations.0.name=水元素
A02_WaterElemental_death.conversations.0.text=咕噜。咕噜……
A02_WaterElemental_death.conversations.1.name=塔尔尼斯
A02_WaterElemental_death.conversations.1.text=到别处“咕噜咕噜”去！
A03_RedCrab_damage.conversations.0.name=蟹神
A03_RedCrab_damage.conversations.0.text=咔哒！咔哒！
A03_RedCrab_damage.conversations.1.name=塔尔尼斯
A03_RedCrab_damage.conversations.1.text=<html><body>当心！离那对大钳子远点。<br>倒霉挨上一下，你可就要矮一个脑袋了！</body></html>
A03_RedCrab_death.conversations.0.name=蟹神
A03_RedCrab_death.conversations.0.text=嘶嘶嘶……
A03_RedCrab_death.conversations.1.name=塔尔尼斯
A03_RedCrab_death.conversations.1.text=不论大小，万物终有一死。这只巨大的甲壳怪物也不例外！

AXX_DragonStatueSeal_whole.conversations.0.name=塔尔尼斯
AXX_DragonStatueSeal_whole.conversations.0.text=哦！快看，这条边上的凹槽似乎正好能和先前那块碎片对上。难道这两件东西本来就该拼在一起？
AXX_DragonStatueSeal_whole.conversations.2.name=塔尔尼斯
AXX_DragonStatueSeal_whole.conversations.2.text=瞧瞧，还真是严丝合缝！真叫人舒心。太奇妙了，这原来是一枚完整封印的两半！
AXX_DragonStatueSeal_whole.conversations.3.name=塔尔尼斯
AXX_DragonStatueSeal_whole.conversations.3.text=多么精湛的工艺。分离了这么多年，这件宝物竟然毫无磨损。
AXX_DragonStatueSeal_whole.conversations.4.name=塔尔尼斯
AXX_DragonStatueSeal_whole.conversations.4.text=朋友们，我有预感，我们离揭开永生的秘密又迈进了一大步！
AXX_DragonStatueSeal_whole.conversations.5.name=提示
AXX_DragonStatueSeal_whole.conversations.5.text=恭喜你拼好了黑龙封印！请慎重对待接下来的选择，生死或许就在一念之间……

AXX_DragonStatueVsTalnes_select.conversations.0.name=塔尔尼斯
AXX_DragonStatueVsTalnes_select.conversations.0.text=维尼雷，文图斯，塞尼雷，索卢斯……
AXX_DragonStatueVsTalnes_select.conversations.1.name=巨龙雕像
AXX_DragonStatueVsTalnes_select.conversations.1.text=（低吼）
AXX_DragonStatueVsTalnes_select.conversations.2.name=塔尔尼斯
AXX_DragonStatueVsTalnes_select.conversations.2.text=<html><body>嗯……你们听见什么声音了吗？<br>算了，继续吧。我们离成功就差一点了！</body></html>
AXX_DragonStatueVsTalnes_select.conversations.3.name=塔尔尼斯
AXX_DragonStatueVsTalnes_select.conversations.3.text=卢克斯，佩尔佩图阿……埃莱门图姆，雷科利戈！
AXX_DragonStatueVsTalnes_select.conversations.4.name=巨龙雕像
AXX_DragonStatueVsTalnes_select.conversations.4.text=凡人！
AXX_DragonStatueVsTalnes_select.conversations.5.name=塔尔尼斯
AXX_DragonStatueVsTalnes_select.conversations.5.text=哇！雕像活过来了！
AXX_DragonStatueVsTalnes_select.conversations.6.name=巨龙雕像
AXX_DragonStatueVsTalnes_select.conversations.6.text=你为何唤醒我？
AXX_DragonStatueVsTalnes_select.conversations.7.name=塔尔尼斯
AXX_DragonStatueVsTalnes_select.conversations.7.text=成功了，成功了！那么，现在我命令你——
AXX_DragonStatueVsTalnes_select.conversations.8.name=巨龙雕像
AXX_DragonStatueVsTalnes_select.conversations.8.text=<html><body>哈！你命令我？！<br>凡人，我不侍奉任何主人，更不会侍奉你这种可悲又渺小的人类！</body></html>
AXX_DragonStatueVsTalnes_select.conversations.9.name=巨龙雕像
AXX_DragonStatueVsTalnes_select.conversations.9.text=放弃抵抗，让我吞噬你！
AXX_DragonStatueVsTalnes_select.conversations.10.name=塔尔尼斯
AXX_DragonStatueVsTalnes_select.conversations.10.text=<html><body>什么？！啊，啊啊啊！我动不了了！<br>这尊邪恶的雕像想把我吞下去！朋友们，救我，快救我！！</body></html>
AXX_DragonStatueVsTalnes_select.conversations.11.selection-text=<html><body>你可以出手救下塔尔尼斯，<br>也可以任由巨龙雕像吞噬<br>这位炼金术士。<br><br>若救下塔尔尼斯，他定会心怀感激，<br>与你并肩作战。然而，这场仪式似乎<br>另有目的，或许还会带来<br>另一种奖励……<br><br>快做决定！你的英雄们将如何行动？</body></html>

AXX_DragonStatue_base.conversations.1.name=提示
AXX_DragonStatue_base.conversations.1.text=雕像底座上有一个圆形凹槽，但队伍携带的物品没有一样能嵌进去。
AXX_DragonStatue_base.conversations.2.name=提示
AXX_DragonStatue_base.conversations.2.text=英雄们纷纷耸肩，退后一步，琢磨着眼前这尊一动不动的黑龙究竟有何用途。
AXX_DragonStatue_fail.conversations.0.name=提示
AXX_DragonStatue_fail.conversations.0.text=英雄们散开，围着雕像上下打量，寻找任何可能是暗格或机关的地方。
AXX_DragonStatue_fail.conversations.1.name=提示
AXX_DragonStatue_fail.conversations.1.text=尽管一无所获，他们仍觉得这间密室里藏着某种神秘而重要的事物，等待着被发现。
AXX_DragonStatue_intro.conversations.0.name=塔尔尼斯
AXX_DragonStatue_intro.conversations.0.text=这间密室位于地下要塞的中心。按照导师典籍中的记载，我们找对地方了。
AXX_DragonStatue_intro.conversations.1.name=塔尔尼斯
AXX_DragonStatue_intro.conversations.1.text=书上写得清清楚楚：这里封存着一股强大的力量，会与施行仪式的人融为一体，赋予其永生。
AXX_DragonStatue_intro.conversations.2.name=塔尔尼斯
AXX_DragonStatue_intro.conversations.2.text=你们有没有觉得脊背发麻？有任何感觉吗？
AXX_DragonStatue_intro.conversations.3.name=塔尔尼斯
AXX_DragonStatue_intro.conversations.3.text=没有，什么都没有。没有力量，也没有别的动静。除了这尊雕像透着股诡异劲儿。
AXX_DragonStatue_intro.conversations.4.name=塔尔尼斯
AXX_DragonStatue_intro.conversations.4.text=事情不太对劲。我们该怎么办？答案会不会就在这尊雕像上？

AXX_ForgottenMine_intro.conversations.0.name=塔尔尼斯
AXX_ForgottenMine_intro.conversations.0.text=女士们、先生们，以及其他诸位，我们到了。很快，我们就能进入地下要塞。
AXX_ForgottenMine_intro.conversations.1.name=塔尔尼斯
AXX_ForgottenMine_intro.conversations.1.text=恐怕导师的典籍没怎么提到下头有什么。除了含糊地说了句“有危险”……
AXX_ForgottenMine_intro.conversations.2.name=塔尔尼斯
AXX_ForgottenMine_intro.conversations.2.text=所以，我决定乐观一点，把这理解为没什么可担心的！
AXX_ForgottenMine_intro.conversations.3.name=塔尔尼斯
AXX_ForgottenMine_intro.conversations.3.text=（不过，以防万一，进去前还是检查一下装备，免得应付不了那一两种危险。）

AXX_Human_intro.conversations.0.name=塔尔尼斯
AXX_Human_intro.conversations.0.text=<html><body>哦，早安，勇敢的骑士！<br>能否耽搁您片刻，让我这个卑微的学者和您说几句话？</body></html>
AXX_Human_intro.conversations.1.name=${hero-1-name}
AXX_Human_intro.conversations.1.text=早安。一个学者出现在这种地方，倒是稀奇，你说呢？
AXX_Human_intro.conversations.2.name=塔尔尼斯
AXX_Human_intro.conversations.2.text=我承认，这里确实不是我熟悉的天地。不过我已经完成了炼金术的学徒修业，正盼着出去冒险。
AXX_Human_intro.conversations.3.name=${hero-1-name}
AXX_Human_intro.conversations.3.text=这当然不错，炼金术士。但我事务繁忙，没时间——
AXX_Human_intro.conversations.4.name=塔尔尼斯
AXX_Human_intro.conversations.4.text=<html><body>请听我说完！有一件极为重要的事，我希望能得到您的帮助。<br>这件事关系到……永生！</body></html>
AXX_Human_intro.conversations.5.name=${hero-1-name}
AXX_Human_intro.conversations.5.text=<html><body>什么？！“永生”？我没听错吧？<br>我可没想到你会说出这种话。好吧，说来听听。</body></html>
AXX_Human_intro.conversations.6.name=塔尔尼斯
AXX_Human_intro.conversations.6.text=哦！请原谅，骑士阁下，我只是……太激动了。
AXX_Human_intro.conversations.7.name=塔尔尼斯
AXX_Human_intro.conversations.7.text=您一定听说过那个传说吧？关于古代永生恩赐的传说。
AXX_Human_intro.conversations.8.name=塔尔尼斯
AXX_Human_intro.conversations.8.text=那是我儿时最喜欢的故事之一。虽然听着像天方夜谭，但我向您保证，这绝非无稽之谈！
AXX_Human_intro.conversations.9.name=${hero-1-name}
AXX_Human_intro.conversations.9.text=<html><body>听起来会是一场精彩的冒险，倒也配得上无畏的骑士！<br>继续说，炼金术士，我听着。</body></html>
AXX_Human_intro.conversations.10.name=塔尔尼斯
AXX_Human_intro.conversations.10.text=太好了！我在打扫导师的工坊时，偶然发现了一部古老的典籍，里面夹着一张地图。我相信，沿着它就能揭开这个秘密。
AXX_Human_intro.conversations.11.name=塔尔尼斯
AXX_Human_intro.conversations.11.text=可惜地图并不完整，只标出了线索所在。不过，看您的样子，想必不会拒绝一场史诗般的冒险。
AXX_Human_intro.conversations.12.name=塔尔尼斯
AXX_Human_intro.conversations.12.text=沿途得去好几个地方，这趟旅程一定精彩极了。若有您这样的英雄同行，那就再理想不过了！
AXX_Human_intro.conversations.13.name=${hero-1-name}
AXX_Human_intro.conversations.13.text=<html><body>你倒会奉承，炼金术士。光靠这个可说服不了我，不过这张巧嘴值得给你加半分。<br>我得仔细考虑一下。</body></html>
AXX_Human_intro.conversations.15.name=塔尔尼斯
AXX_Human_intro.conversations.15.text=如果您决定帮我解开这个古老的谜团，我会在岔路口等您。就此告辞！

AXX_RedCrab_exit.conversations.0.name=塔尔尼斯
AXX_RedCrab_exit.conversations.0.text=呼，这只硬壳怪物真够人记一辈子的！朋友们，我想今天的寻宝到此为止就好。
AXX_RedCrab_exit.conversations.1.name=塔尔尼斯
AXX_RedCrab_exit.conversations.1.text=我们走吧。这大家伙尸体的臭味说不定会引来更多同类。我可不觉得它们会忌讳同类相食！
AXX_RedCrab_exit.conversations.2.name=塔尔尼斯
AXX_RedCrab_exit.conversations.2.text=不过，收获真不小！虽然没找到长生不老药之类的东西，我们总算不用两手空空地离开这个螃蟹窝。
AXX_RedCrab_exit.conversations.3.name=塔尔尼斯
AXX_RedCrab_exit.conversations.3.text=理应由你们先挑。这些小玩意儿里，有看得上眼的吗？

AXX_SeaPortal_intro.conversations.0.name=塔尔尼斯
AXX_SeaPortal_intro.conversations.0.text=我……我真不敢相信。明明全都对得上，我们按地图走，也找对了地方。
AXX_SeaPortal_intro.conversations.1.name=塔尔尼斯
AXX_SeaPortal_intro.conversations.1.text=究竟哪里出了错？总不能找到这尊阴森的雕像，故事就结束了吧……
AXX_SeaPortal_intro.conversations.2.name=塔尔尼斯
AXX_SeaPortal_intro.conversations.2.text=真是彻头彻尾的失望。亏我们还以为，自己正在亲历一个伟大的传说，揭开当世罕见的秘密。
AXX_SeaPortal_intro.conversations.3.name=塔尔尼斯
AXX_SeaPortal_intro.conversations.3.text=哦，等等！还有一件事，我差点忘了！
AXX_SeaPortal_intro.conversations.4.name=塔尔尼斯
AXX_SeaPortal_intro.conversations.4.text=导师的典籍里写着，这里往南的海边有一道传送门，里面藏着一批宝藏。
AXX_SeaPortal_intro.conversations.5.name=塔尔尼斯
AXX_SeaPortal_intro.conversations.5.text=这段记载简略得叫人头疼，不过传送门的位置倒是写得很清楚。
AXX_SeaPortal_intro.conversations.6.name=塔尔尼斯
AXX_SeaPortal_intro.conversations.6.text=朋友们，你们可有兴趣？诸位一路相助，我实在感激，真想连本带利地报答你们！
AXX_SeaPortal_intro.conversations.7.name=塔尔尼斯
AXX_SeaPortal_intro.conversations.7.text=<html><body>直线算来，不过一箭之遥，根本算不上远行。<br>来吧，我带路！</body></html>

AXX_Undead_intro.conversations.0.name=塔尔尼斯
AXX_Undead_intro.conversations.0.text=早安，强大的死灵法师！能否耽搁您片刻，容我这个卑微的学者说上一句话？
AXX_Undead_intro.conversations.1.name=克里尔
AXX_Undead_intro.conversations.1.text=什么，一句话？你说的早就不止一句了。滚开。
AXX_Undead_intro.conversations.2.name=塔尔尼斯
AXX_Undead_intro.conversations.2.text=求您了，我只占用一点时间！我这就直奔主题。
AXX_Undead_intro.conversations.3.name=塔尔尼斯
AXX_Undead_intro.conversations.3.text=我已经完成了炼金术的学徒修业，正盼着出去冒险。希望您能帮帮我！
AXX_Undead_intro.conversations.4.name=克里尔
AXX_Undead_intro.conversations.4.text=我？帮你？倒是给我说说……凭什么？
AXX_Undead_intro.conversations.5.name=塔尔尼斯
AXX_Undead_intro.conversations.5.text=<html><body>哦，那个……怎么说呢……<br>永生！</body></html>
AXX_Undead_intro.conversations.6.name=克里尔
AXX_Undead_intro.conversations.6.text=啊哈。有这种念头，果然是个炼金术士。
AXX_Undead_intro.conversations.7.name=克里尔
AXX_Undead_intro.conversations.7.text=要是你想活得比常理所容许的更久，我倒有不少办法可以教你。哈哈哈……
AXX_Undead_intro.conversations.8.name=塔尔尼斯
AXX_Undead_intro.conversations.8.text=哦，呃，不是那一种。我想要的是那种能让人……呃，至少把皮肉之类的东西留住的永生！
AXX_Undead_intro.conversations.9.name=克里尔
AXX_Undead_intro.conversations.9.text=<html><body>皮肉不过是累赘，炼金术士。不过随你的便。<br>我的耐心快耗尽了，接着说。</body></html>
AXX_Undead_intro.conversations.10.name=塔尔尼斯
AXX_Undead_intro.conversations.10.text=啊，我尽量说快些！您一定听说过那个传说吧？关于古代永生恩赐的传说。
AXX_Undead_intro.conversations.11.name=塔尔尼斯
AXX_Undead_intro.conversations.11.text=那是我儿时最喜欢的故事之一。虽然听着像天方夜谭，但这绝非无稽之谈！
AXX_Undead_intro.conversations.12.name=克里尔
AXX_Undead_intro.conversations.12.text=那就快说。可要是你在浪费我的时间……
AXX_Undead_intro.conversations.13.name=塔尔尼斯
AXX_Undead_intro.conversations.13.text=绝对没有！我在打扫导师的工坊时，偶然发现了一部古老的典籍，里面夹着一张地图。
AXX_Undead_intro.conversations.14.name=塔尔尼斯
AXX_Undead_intro.conversations.14.text=可惜地图并不完整，只标出了线索所在。不过，看您的样子，想必早已见惯了史诗般的冒险！
AXX_Undead_intro.conversations.15.name=克里尔
AXX_Undead_intro.conversations.15.text=<html><body>嗯……我需要考虑一下。<br>你说的这些，或许是真的。</body></html>
AXX_Undead_intro.conversations.17.name=塔尔尼斯
AXX_Undead_intro.conversations.17.text=如果您决定帮我解开这个古老的谜团，我会在岔路口等您。就此告辞！

AXX_Welcome.conversations.0.name=提示
AXX_Welcome.conversations.0.text=<html><body>欢迎来到《永生之旅》扩展！<br>这些关卡均为可选内容，可在战役期间随时游玩。</body></html>
AXX_Welcome.conversations.1.name=提示
AXX_Welcome.conversations.1.text=建议队伍中的所有单位都达到老兵资历后，再开始《永生之旅》扩展。感谢您支持独立游戏！
AXX_WellOfWishes_intro.conversations.0.name=塔尔尼斯
AXX_WellOfWishes_intro.conversations.0.text=你们来了，真叫我高兴得不知说什么好！我刚才还在想，是不是那番解释把你们吓跑了。
AXX_WellOfWishes_intro.conversations.1.name=塔尔尼斯
AXX_WellOfWishes_intro.conversations.1.text=幸好是我多虑了，真让人松了口气！诸位果然是值得写进故事里的冒险者。
AXX_WellOfWishes_intro.conversations.3.name=塔尔尼斯
AXX_WellOfWishes_intro.conversations.3.text=许愿井 (Well of Wishes) 正等着我们！运气好的话，回来时我们就能掌握永生的奥秘。出发吧，朋友们，去赴命运之约……
AXX_Well_intro.conversations.0.name=塔尔尼斯
AXX_Well_intro.conversations.0.text=就在这里，找到了！这座被人遗忘已久的许愿井 (Well of Wishes)，不知在众人眼皮底下藏了多少年。
AXX_Well_intro.conversations.1.name=塔尔尼斯
AXX_Well_intro.conversations.1.text=多么精美的工艺！看看底座上那些雕像，细节简直不可思议。而且刻的全是海怪和人鱼！
AXX_Well_intro.conversations.2.name=塔尔尼斯
AXX_Well_intro.conversations.2.text=果然不出所料，雕刻讲述的是一个诞生于海洋的古老文明。据说，早在人类崭露头角之前，这些生灵就统治着大地。
AXX_Well_intro.conversations.3.name=塔尔尼斯
AXX_Well_intro.conversations.3.text=光是理清这里错综复杂的历史，就够我忙上一年。不过，我们还有更要紧的事。
AXX_Well_intro.conversations.4.name=塔尔尼斯
AXX_Well_intro.conversations.4.text=看，那道凸棱上的符文和导师典籍里的这些一模一样。给我一点时间解读……
AXX_Well_intro.conversations.5.name=塔尔尼斯
AXX_Well_intro.conversations.5.text=啊！末尾这一段提到了供奉。我想，我们得献上某件有价值的东西，可究竟是什么，我也拿不准……
AXX_Well_lost.conversations.0.name=提示
AXX_Well_lost.conversations.0.text=伴着一声清脆的扑通声，供品沉入许愿井 (Well of Wishes) 漆黑的深处，很快便消失在水面之下。
AXX_Well_lost.conversations.1.name=塔尔尼斯
AXX_Well_lost.conversations.1.text=<html><body>没动静……唉，看来这样不行，真可惜。<br>还能试试什么呢？</body></html>
AXX_Well_lost.conversations.2.name=塔尔尼斯
AXX_Well_lost.conversations.2.text=<html><body>啊，又找到能献上去的东西了？<br>值得一试，扔进去吧！</body></html>
