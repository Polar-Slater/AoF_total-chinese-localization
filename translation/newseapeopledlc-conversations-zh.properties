# The Storm Mountain — 简体中文
CONVERSATIONS=newseapeopledlc
LOCALE=zh
N01_AirElemental_death.conversations.0.name=风元素
N01_AirElemental_death.conversations.0.text=呼——呜——……
N01_AirElemental_death.conversations.1.name=安吉拉
N01_AirElemental_death.conversations.1.text=<html><body>好清爽的一阵风。<br>各位，以后该多约我来海边玩！</body></html>
N01_WaterElemental_death.conversations.0.name=水元素
N01_WaterElemental_death.conversations.0.text=咕、咕噜……咕噜……
N01_WaterElemental_death.conversations.1.name=安吉拉
N01_WaterElemental_death.conversations.1.text=<html><body>就像戳破水球一样！<br>打爆你们简直就是游园会的小游戏。</body></html>
N02_FireElemental_damage.conversations.0.name=火元素
N02_FireElemental_damage.conversations.0.text=轰！
N02_FireElemental_damage.conversations.1.name=安吉拉
N02_FireElemental_damage.conversations.1.text=<html><body>熄火啦！<br>呼，刚才那一下过后，我的眉毛还在吗？</body></html>
N02_GiantScorpion_death.conversations.0.name=安吉拉
N02_GiantScorpion_death.conversations.0.text=怎么说呢，我要是还想自称吸血鬼猎人，跑来沙漠除虫是不是有点太不务正业了。
N03_Cactus_damage.conversations.0.name=伊弗利特
N03_Cactus_damage.conversations.0.text=<html><body>喂，对仙人掌温柔点！<br>你们知道在这里长出点东西要花多久吗？</body></html>
N03_Cactus_damage.conversations.1.name=安吉拉
N03_Cactus_damage.conversations.1.text=哈！你还好意思自称无所不能的灯神。
N03_Cactus_damage.conversations.2.name=安吉拉
N03_Cactus_damage.conversations.2.text=念句咒语，把整个沙丘变成一片绿油油、扎死人的地狱，对你来说有什么难的？
N03_Cactus_damage.conversations.3.name=伊弗利特
N03_Cactus_damage.conversations.3.text=<html><body>哦，那可不一样。<br>别碰仙人掌，没有它们，我这绿洲就没那个味了！</body></html>
N03_EarthElemental_death.conversations.0.name=土元素
N03_EarthElemental_death.conversations.0.text=（碎裂声）
N03_EarthElemental_death.conversations.1.name=伊弗利特
N03_EarthElemental_death.conversations.1.text=<html><body>看来你很擅长劈石头。<br>那又怎样，我可没觉得有什么了不起。</body></html>
N03_EarthElemental_death.conversations.2.name=安吉拉
N03_EarthElemental_death.conversations.2.text=站稳别动，灯神。接下来，我要一枪打灭你头顶那根蜡烛！
N03_EarthElemental_death.conversations.3.name=伊弗利特
N03_EarthElemental_death.conversations.3.text=你敢！
N03_Ifrit_damage.conversations.0.name=伊弗利特
N03_Ifrit_damage.conversations.0.text=哎哟！
N03_Ifrit_damage.conversations.1.name=安吉拉
N03_Ifrit_damage.conversations.1.text=<html><body>我们就此收手吧，火气这么大的家伙！<br>别逼我踩灭你那堆篝火，我可穿着厚底靴呢。</body></html>
N03_Ifrit_damage.conversations.2.name=伊弗利特
N03_Ifrit_damage.conversations.2.text=哈！太阳也许快把你的脑子煮熟了，不过我马上就要把你活活烧死！
N04_Fury_death.conversations.0.name=狂怒鹰身女妖
N04_Fury_death.conversations.0.text=唳——呀——……
N04_Fury_death.conversations.1.name=安吉拉
N04_Fury_death.conversations.1.text=总算安静了！现在，该让你们这支跑调合唱团的其余成员也闭嘴了……
N04_Harpy_death.conversations.0.name=鹰身女妖
N04_Harpy_death.conversations.0.text=嘎、嘎——啊……
N04_Harpy_death.conversations.1.name=安吉拉
N04_Harpy_death.conversations.1.text=往好处想，各位，这几撮鹰身女妖羽毛可是做鱼饵的好材料！
N05_Helna_damage.conversations.0.name=赫尔娜
N05_Helna_damage.conversations.0.text=哎哟！
N05_Helna_damage.conversations.1.name=赫尔娜
N05_Helna_damage.conversations.1.text=露萝拉，你就不能合群一点吗？！
N05_Helna_damage.conversations.2.name=露萝拉
N05_Helna_damage.conversations.2.text=<html><body>说得倒轻巧！<br>赫尔娜，你就不能喜欢我一点吗？</body></html>
N05_Helna_damage.conversations.3.name=赫尔娜
N05_Helna_damage.conversations.3.text=哦，这可难说——也许是你扎进我肋骨的那根长矛碍事了！
N05_Rurora_damage.conversations.0.name=露萝拉
N05_Rurora_damage.conversations.0.text=啊！这一下算你走运，贱人……
N05_Rurora_damage.conversations.1.name=希德拉
N05_Rurora_damage.conversations.1.text=<html><body>哈哈哈！听着，是谁炸毛了？<br>叫一声来听听啊，鹰身女妖的小崽子！</body></html>
N05_Rurora_damage.conversations.2.name=露萝拉
N05_Rurora_damage.conversations.2.text=我要剪了你的翅膀，希德拉！
N05_Sidra_damage.conversations.0.name=希德拉
N05_Sidra_damage.conversations.0.text=喂！我基本就是个看热闹的，这是你们两个的事！
N05_Sidra_damage.conversations.1.name=露萝拉
N05_Sidra_damage.conversations.1.text=晚了，希德拉，你现在也脱不了干系了！
N05_Valkyrie_turn.conversations.0.name=安吉拉
N05_Valkyrie_turn.conversations.0.text=<html><body>天哪，这群女人可真够凶的！<br>她们怕是能打满整整九个回合……</body></html>
N06_Angela_damage.conversations.0.name=安吉拉
N06_Angela_damage.conversations.0.text=<html><body>哎哟！轻点，小个子幽灵。<br>咱们讲点道理吧！</body></html>
N06_Angela_damage.conversations.1.name=矮人幽灵
N06_Angela_damage.conversations.1.text=<html><body>没门！<br>道理是活人讲的，死人可不讲！</body></html>
N07_Harpy_death.conversations.0.name=鹰身女妖
N07_Harpy_death.conversations.0.text=啾、啾、嘎……
N07_Harpy_death.conversations.1.name=露萝拉
N07_Harpy_death.conversations.1.text=<html><body>认出我了吗，姐妹们？<br>小露萝拉已经长大，准备把欠你们的全还回去了！</body></html>
N07_Rurora_damage.conversations.0.name=露萝拉
N07_Rurora_damage.conversations.0.text=啊！这一下可把糟糕的回忆都勾起来了。
N07_Rurora_damage.conversations.1.name=露萝拉
N07_Rurora_damage.conversations.1.text=真谢谢你们给我留下的阴影啊，姐妹们！
N08_Fury_death.conversations.0.name=狂怒鹰身女妖
N08_Fury_death.conversations.0.text=嘎、嘎——……
N08_Fury_death.conversations.1.name=拉梅菲森特
N08_Fury_death.conversations.1.text=唳——呀——！！！
N08_Fury_death.conversations.2.name=安吉拉
N08_Fury_death.conversations.2.text=啊啊啊！每死一个，她都打算拉响那防空警报吗？！
N08_Fury_death.conversations.3.name=安吉拉
N08_Fury_death.conversations.3.text=我还一直以为鹰身女妖最厉害的武器是爪子呢。
N08_Lameficent_damage.conversations.0.name=拉梅菲森特
N08_Lameficent_damage.conversations.0.text=嘎——！！嘎嘎嘎——！！！
N08_Lameficent_damage.conversations.1.name=安吉拉
N08_Lameficent_damage.conversations.1.text=啊！！这声音要刺穿我的脑子了！
N08_Lameficent_damage.conversations.2.name=安吉拉
N08_Lameficent_damage.conversations.2.text=<html><body>那个沙漠灯神的灯到底在哪儿？<br>求求了，谁来许个愿，给我们弄点护耳的东西吧！</body></html>
NXX_Intro.conversations.0.name=潜海者信使
NXX_Intro.conversations.0.text=安吉拉女士！村里的长老有话让我带给你，很重要！
NXX_Intro.conversations.1.name=安吉拉
NXX_Intro.conversations.1.text=哦？那位老海民有什么话要说？
NXX_Intro.conversations.2.name=潜海者信使
NXX_Intro.conversations.2.text=需要你快来帮忙，出了急事！
NXX_Intro.conversations.3.name=安吉拉
NXX_Intro.conversations.3.text=好好好，是件很重要的急事。是不是还算一场危机、一个大难题啊？
NXX_Intro.conversations.4.name=安吉拉
NXX_Intro.conversations.4.text=最好别是鸡毛蒜皮的小事，我手头已经够忙了。
NXX_Intro.conversations.5.name=潜海者信使
NXX_Intro.conversations.5.text=不是！很严重。渔民们遇到麻烦，我们自己应付不了……
NXX_Intro.conversations.6.name=安吉拉
NXX_Intro.conversations.6.text=什么麻烦？鱼线缠成一团，非得找个大人来解开吗？
NXX_Intro.conversations.7.name=潜海者信使
NXX_Intro.conversations.7.text=不是，不是！没开玩笑！安吉拉女士，求你帮帮我们好吗？
NXX_Intro.conversations.8.name=安吉拉
NXX_Intro.conversations.8.text=行啊，为什么不呢。我正好想歇口气，这可是去海边玩的绝佳借口。
NXX_Intro.conversations.9.name=潜海者信使
NXX_Intro.conversations.9.text=谢谢！跟我来，村子就在附近。得快点！
NXX_Intro.conversations.10.name=安吉拉
NXX_Intro.conversations.10.text=就当是边工作边度假吧。
NXX_Valkyrie_recruit.conversations.0.name=提示
NXX_Valkyrie_recruit.conversations.0.text=女武神聚落把你的队伍视为朋友，随时欢迎你回来招募这些长着翅膀的女战士！
NXX_Welcome.conversations.0.name=提示
NXX_Welcome.conversations.0.text=<html><body>欢迎游玩《风暴山》（The Storm Mountain）扩展！<br>这些关卡为可选内容，可以在战役期间随时游玩。</body></html>
NXX_Welcome.conversations.1.name=提示
NXX_Welcome.conversations.1.text=建议在开始海族扩展前，让队伍中所有单位都达到老兵资历。感谢你支持独立游戏！
