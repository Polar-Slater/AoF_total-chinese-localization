# Simplified Chinese local pilot; untranslated keys fall back to English.
LOCALE=zh
CONVERSATIONS=undeadcampaign
U00_Krill_turn.conversations.0.name=克里尔
U00_Krill_turn.conversations.0.text=别来烦我！
U01_Goblin_panic.conversations.0.name=地精
U01_Goblin_panic.conversations.0.text=快跑！快跑！
U01_Goblin_panic.conversations.1.name=克里尔
U01_Goblin_panic.conversations.1.text=<html><body>陪我玩玩如何？<br>哈哈哈！</body></html>

U01_Goblin_raise.conversations.0.name=克里尔
U01_Goblin_raise.conversations.0.text=<html><body>地精的骨头真脆弱。<br>罢了，暂且凑合着用吧。</body></html>
U01_TreasureChest_death.conversations.0.name=提示
U01_TreasureChest_death.conversations.0.text=克里尔收拾好行囊，最后回望了一眼这片沼泽——他生活了多年的家……

# Bone River battle, shop dialogue and linked campaign conversations.
U02_Abomination_raise.conversations.0.name=憎恶
U02_Abomination_raise.conversations.0.text=<html><body>啊……我又能走了……<br>主人，您有何吩咐？</body></html>
U02_Abomination_raise.conversations.1.name=克里尔
U02_Abomination_raise.conversations.1.text=<html><body>把那些害虫撕成碎片！<br>哈哈哈！</body></html>
U02_Abomination_raise.conversations.2.name=憎恶
U02_Abomination_raise.conversations.2.text=遵命，主人。撕成碎片！
U02_Footman_death.conversations.0.name=步兵
U02_Footman_death.conversations.0.text=呃啊！
U02_Footman_death.conversations.1.name=步兵
U02_Footman_death.conversations.1.text=<html><body>快派人去向治安官报信！<br>告诉他，我们需——</body></html>
U02_Footman_death.conversations.2.name=克里尔
U02_Footman_death.conversations.2.text=赶紧去死吧！
U02_Footman_raise.conversations.0.name=克里尔
U02_Footman_raise.conversations.0.text=<html><body>又一个香料商人的帮手准备加入我们了。<br>哈哈哈！</body></html>
U02_Shop_enter.conversations.0.name=克里尔
U02_Shop_enter.conversations.0.text=只有这么几只僵尸……太少了。我的魔力还太弱，无法驱使更多。
U02_Shop_enter.conversations.1.name=克里尔
U02_Shop_enter.conversations.1.text=<html><body>不过，我的力量很快就会增强。<br>我要建立自己的亡灵军团！哈哈哈！</body></html>
U02_Zombie_impatient.conversations.0.name=克里尔
U02_Zombie_impatient.conversations.0.text=快点！再快点，你们这些懒骨头！
U02_Zombie_impatient.conversations.1.name=僵尸
U02_Zombie_impatient.conversations.1.text=……呜……
U02_Zombie_impatient.conversations.2.name=克里尔
U02_Zombie_impatient.conversations.2.text=<html><body>不！你敢现在倒下试试！<br>没用的尸体……</body></html>
U02_Zombie_raise.conversations.0.name=步兵
U02_Zombie_raise.conversations.0.text=<html><body>天哪！他从坟墓里爬回来了，又能走了！<br>快跑！</body></html>
UXX_Krill_impatient.conversations.0.name=克里尔
UXX_Krill_impatient.conversations.0.text=得快点解决这些蛆虫。
UXX_Krill_impatient.conversations.1.name=克里尔
UXX_Krill_impatient.conversations.1.text=已经在这里浪费太多时间了。
UXX_PlayerUnit_death.conversations.0.name=克里尔
UXX_PlayerUnit_death.conversations.0.text=<html><body>我的仆从还很弱小。<br>他们会随着我一同变强。</body></html>
UXX_Vision_1.conversations.1.name=克里尔
UXX_Vision_1.conversations.1.text=<html><body>啊……不！！<br>师父！饶了我，我……我会去的……</body></html>
UXX_Vision_1.conversations.2.name=克里尔
UXX_Vision_1.conversations.2.text=又是幻象，直刺进我的脑海。它们出现得越来越频繁了。我刚才看到了什么？一片废墟，也许是座教堂……

# Night Assault battle conversations.
U03_Goblin_raise.conversations.0.name=克里尔
U03_Goblin_raise.conversations.0.text=没用的地精。也许这些小东西死了以后，反倒能多派上些用场……
U03_Orc_death.conversations.0.name=克里尔
U03_Orc_death.conversations.0.text=<html><body>所有人都将在我的力量面前俯首！<br>你的死，不过是个开始。</body></html>

# Haunted Church batch: U04 dialogue and linked campaign reactions.
U04_Banshee_damage.conversations.0.name=诺娅
U04_Banshee_damage.conversations.0.text=加入我们吧，姐妹。生前我们是朋友，死后也可以继续做朋友。
U04_Banshee_damage.conversations.1.name=报丧女妖
U04_Banshee_damage.conversations.1.text=<html><body>你抢走了他！<br>你从我身边抢走了加雷思爵士！</body></html>
U04_Banshee_damage.conversations.2.name=诺娅
U04_Banshee_damage.conversations.2.text=什……？！哎呀，那都是多久以前的事了！
U04_Banshee_damage.conversations.3.name=诺娅
U04_Banshee_damage.conversations.3.text=……再说，他也不怎么英俊嘛。
U04_Banshee_damage.conversations.4.name=报丧女妖
U04_Banshee_damage.conversations.4.text=我要杀了你，诺娅！
U04_Banshee_damage.conversations.5.name=诺娅
U04_Banshee_damage.conversations.5.text=……而且，我们早就死了呀。
U04_BoneDragon_raise.conversations.0.name=骨龙
U04_BoneDragon_raise.conversations.0.text=吼！
U04_BoneDragon_raise.conversations.1.name=克里尔
U04_BoneDragon_raise.conversations.1.text=<html><body>起来吧，邪秽的生物！<br>如此强大的力量……如今全归我了！哈哈哈！</body></html>
U04_BoneDragon_raise.conversations.2.name=诺娅
U04_BoneDragon_raise.conversations.2.text=哦，我认识这条龙！
U04_BoneDragon_raise.conversations.3.name=诺娅
U04_BoneDragon_raise.conversations.3.text=<html><body>在一场大战中，是我的兄弟给了它致命一击。<br>真高兴它现在站在我们这边了。</body></html>
U04_BoneDragon_raise.conversations.4.name=提示
U04_BoneDragon_raise.conversations.4.text=<html><body>骨龙是极为强大的生物。<br>不过，克里尔无法长久控制它。趁它还在，好好利用这股力量吧！</body></html>
UXX_Base_unlocked.conversations.0.name=诺娅
UXX_Base_unlocked.conversations.0.text=我曾是这片土地上的一位贵族小姐。那是很久以前的事了……
UXX_Base_unlocked.conversations.1.name=克里尔
UXX_Base_unlocked.conversations.1.text=是吗，幽灵？
UXX_Base_unlocked.conversations.2.name=诺娅
UXX_Base_unlocked.conversations.2.text=这里曾有一座美丽的城堡……还有一个可爱的村庄。如今全成了废墟。
UXX_Base_unlocked.conversations.3.name=克里尔
UXX_Base_unlocked.conversations.3.text=的确是废墟，而且还闹鬼。这倒让我有了个主意……
UXX_Base_unlocked.conversations.5.name=提示
UXX_Base_unlocked.conversations.5.text=亡灵据点——废墟 (Ruins) 已开放！你的英雄可以随时前往，招募新单位，并进一步建设据点。
UXX_BoneDragon_remove.conversations.0.name=骨龙
UXX_BoneDragon_remove.conversations.0.text=吼！吼！
UXX_BoneDragon_remove.conversations.1.name=克里尔
UXX_BoneDragon_remove.conversations.1.text=<html><body>等等……等等！<br>该死的东西，你要去哪儿？！</body></html>
UXX_BoneDragon_remove.conversations.2.name=诺娅
UXX_BoneDragon_remove.conversations.2.text=<html><body>克里尔主人。<br>您的力量还不足以控制这样的灵体……</body></html>
UXX_BoneDragon_remove.conversations.3.name=克里尔
UXX_BoneDragon_remove.conversations.3.text=<html><body>该死的幽灵！你们都该死。<br>我身边全是叛徒……</body></html>
UXX_Krill_damage.conversations.0.name=克里尔
UXX_Krill_damage.conversations.0.text=<html><body>啊！<br>你竟敢伤我？</body></html>
UXX_Krill_damage.conversations.1.name=诺娅
UXX_Krill_damage.conversations.1.text=克里尔主人！小心啊，主人。
UXX_Krill_damage.conversations.2.name=克里尔
UXX_Krill_damage.conversations.2.text=<html><body>只有弱者才会在乎疼痛。<br>我不需要你的怜悯，幽灵。</body></html>
UXX_Noea_damage.conversations.0.name=诺娅
UXX_Noea_damage.conversations.0.text=哎哟……克里尔主人！
UXX_Noea_damage.conversations.1.name=克里尔
UXX_Noea_damage.conversations.1.text=<html><body>别傻站在那里！<br>马上到这儿来。</body></html>
UXX_Noea_damage.conversations.2.name=诺娅
UXX_Noea_damage.conversations.2.text=<html><body>是，克里尔主人。<br>我会更加小心的。</body></html>
UXX_Noea_damage.conversations.3.name=克里尔
UXX_Noea_damage.conversations.3.text=你们这些幽灵真脆弱，连挥剑带起的风都能伤到你们。
UXX_PlagueZombie_detonate.conversations.0.name=瘟疫僵尸
UXX_PlagueZombie_detonate.conversations.0.text=<html><body>呜呜呜……<br>（噗叽！）</body></html>
UXX_PlagueZombie_detonate.conversations.1.name=克里尔
UXX_PlagueZombie_detonate.conversations.1.text=<html><body>哈哈哈！我的杰作，成功了！<br>去吧，把疾病散播给那些弱者！</body></html>
UXX_PlagueZombie_detonate.conversations.2.name=诺娅
UXX_PlagueZombie_detonate.conversations.2.text=干得漂亮，主人！
UXX_PlagueZombie_detonate.conversations.3.name=提示
UXX_PlagueZombie_detonate.conversations.3.text=瘟疫僵尸会自爆，感染附近所有单位，同时毁掉自身。不过，你可以一次又一次地唤起它们！

# Kingdom Patrol batch: U05 dialogue, victory vision and defeat-route notice.
U05_Bowman_death.conversations.0.name=克里尔
U05_Bowman_death.conversations.0.text=加雷思爵士是谁？
U05_Bowman_death.conversations.1.name=诺娅
U05_Bowman_death.conversations.1.text=<html><body>哦，没什么特别的……<br>我的一位老朋友。</body></html>
U05_Bowman_death.conversations.2.name=克里尔
U05_Bowman_death.conversations.2.text=只是朋友？
U05_Bowman_death.conversations.3.name=诺娅
U05_Bowman_death.conversations.3.text=哦，还要更亲近一点。那可真是太失礼了！
U05_Bowman_death.conversations.4.name=克里尔
U05_Bowman_death.conversations.4.text=发生了什么？
U05_Bowman_death.conversations.5.name=诺娅
U05_Bowman_death.conversations.5.text=<html><body>他曾经看见过我的脚踝。<br>就算死了，我也该为此羞愧！</body></html>
U05_Knight_raise.conversations.0.name=克里尔
U05_Knight_raise.conversations.0.text=看来你今天运气不太好啊，骑士。
U05_Knight_raise.conversations.1.name=骑士
U05_Knight_raise.conversations.1.text=<html><body>啊！我这是怎么了？<br>回答我，死灵法师！</body></html>
U05_Knight_raise.conversations.2.name=克里尔
U05_Knight_raise.conversations.2.text=<html><body>闭嘴，骑士！<br>欢迎加入我的亡灵军团。</body></html>
U05_Knight_raise.conversations.3.name=骑士
U05_Knight_raise.conversations.3.text=啊！我的灵魂……
U05_Knight_raise.conversations.4.name=克里尔
U05_Knight_raise.conversations.4.text=<html><body>……归我了！<br>哈哈哈！</body></html>
U05_Monk_death.conversations.0.name=僧侣
U05_Monk_death.conversations.0.text=你的灵魂会永远在地狱里燃烧！
U05_Monk_death.conversations.1.name=克里尔
U05_Monk_death.conversations.1.text=<html><body>我还不急着去那儿，祭司。<br>你先走一步，替我带路吧。</body></html>
UXX_Vision_1a.conversations.1.name=克里尔
UXX_Vision_1a.conversations.1.text=<html><body>啊——！鲜血与死亡……到处都是。<br>那是……警告吗？</body></html>
UXX_Krill_wight.conversations.0.name=提示
UXX_Krill_wight.conversations.0.text=恭喜！你发现了让英雄转化为尸妖的隐藏路线。不过，从现在起，游戏将变得非常困难。请考虑是否要继续。
