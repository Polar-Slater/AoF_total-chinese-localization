# Main-text batch 5: battle and world-map tutorial pages.
WORLDMAP_TUTORIAL_CAMPAIGN_LEVELS_HINT=战役地点<br><br>这里是地图界面。随着游戏推进，各种任务会逐步解锁并显示在地图上。<br><br>- 剧情关卡（蓝色宝石）用于推进战役。挑战前请做好充分准备，并培养好你的部队！剧情关卡能为英雄和部队提供最多的经验，但最好的装备还需从其他地方寻找。<br><br>- 基地（石塔）会在战役的特定阶段解锁，具体时机因阵营和战役而异。你可以升级基地，并使用特殊功能，例如每天一次为全体单位施加祝福。<br><br>- 支线关卡（书本）会随游戏进度解锁。这些任务并非必做，但完成后能为单位提供额外经验。<br><br>
WORLDMAP_TUTORIAL_OPENWORLD_LEVELS_HINT=开放世界<br><br>游戏会不断生成新的地点。开放世界中的地点偶尔会重置，因此建议你不时查看新出现的地点。<br><br>- 商店（金币）出售物品，也提供新兵。有时还能遇到愿意加入你的珍贵雇佣兵，他们可能来自其他阵营。战役进度越深入，开放的商店就越好。<br><br>- 战斗（武器）能为英雄和部队提供丰富经验。骷髅数量代表战斗难度：一个骷髅较为轻松，五个骷髅则极具挑战！战斗也会受到所在环境的影响，改变战场条件。看到单位在冰上打滑时，可别吃惊！<br><br>
WORLDMAP_TUTORIAL_GLOBALEVENTS_HINT=全局事件<br><br>英雄查看世界地图时，可能触发某些半随机事件。<br><br>这些事件多种多样：可能只是彗星经过的消息，也可能是行商前来兜售货物，或是愤怒的矮人雇佣兵上门讨钱。<br><br>部分事件仅提供消息，但大多数需要你作出选择，而你的决定会影响后续发展。有些事件还属于任务链的一环，让一连串抉择彼此相连。<br><br>欢迎在 Age of Fear 系列中探索这些遭遇！<br><br>
BATTLE_TUTORIAL_MELEE_ATTACKS_TEXT=近战攻击、阻挡与背刺<br><br>敌方单位进入攻击范围后，会被标记为可攻击的目标。<br><br>大多数单位擅长近战，需要靠近敌人才能发动攻击。<br><br>点击敌方目标，即可命令单位靠近并攻击。此次攻击会消耗步兵本回合的行动机会。<br><br>你可以巧妙利用强壮单位阻挡敌人的移动，以此保护较弱的单位。<br><br>从敌人背后发动近战攻击可造成背刺。判定依据是攻击者本回合移动前的位置。受到背刺的单位在此次攻击中的防御降低（防御{0}），并有{1}的概率受到重伤。<br><br>构装体、元素生物，以及拥有魔法护盾或物理抗性的单位不会受到背刺。
BATTLE_TUTORIAL_COMBATLOG_TEXT=战斗日志<br><br>大多数战斗行动都会记录在日志中，你可以在离开战斗前查看详情。此功能也方便你追踪电脑回合中敌人的行动。<br><br>大部分消息一目了然；当攻击、技能或法术包含随机判定时，游戏还会记录掷骰结果。<br><br>例如，“1d10 > 5-3 : 7 > 2 : Hit”可作如下理解：<br><br>- 投掷一枚十面战斗骰，结果为7。攻击者拥有+3攻击加成，具体加成根据抗性和弱点计算。<br><br>- 将掷骰结果与“5（骰子面数的一半）减去攻击加成”的数值比较。若掷骰结果更大，攻击便会命中。<br><br>- 在此例中，1d10的结果为7，判定门槛为5 - (+3) = 2。由于7大于2，攻击成功，因此结果显示为“Hit”（命中）。<br><br>- 暴击掷骰结果以感叹号标记，并且必定命中。这项关键机制让弱小的地精也有机会伤到身披重甲的骑士，尽管这种情况并不常见。
BATTLE_TUTORIAL_BURROW_AND_TUNNEL_TEXT=潜地单位<br><br>潜地是鼠人阵营的独特技能，可让隐形单位钻入地下，在保持隐藏的同时躲避敌人。<br><br>潜地单位处于隐形状态，无法被直接选为目标，并对所有范围攻击获得额外防御。它们只能被灵视术、探测者、敏锐感官等特殊能力侦测到。此外，所有光源都会暴露潜地单位。<br><br>潜地单位还能缓慢地从毫无防备的敌人脚下穿行，随后一同钻出地面，发动背刺。这也是电脑常用的战术。多个潜地单位可以重叠在同一位置，但钻出地面后会散开。<br><br>选中潜地单位会开启特殊视图：敌人的形象会隐藏，只留下地面上的彩色圆圈，同时高亮显示侦测范围。取消选中潜地单位即可退出潜地视图。也可在设置中始终关闭此视图。<br><br>潜地有回合数限制；获得稀有特性“钢铁之肺”后，可以延长潜地时间。
BATTLE_TUTORIAL_MORALE_TEXT=士气与恐慌<br><br>士气是战斗中的重要因素，以单位生命条和魔法条下方的灰色条显示。<br><br>某些生物（如地精）胆小，容易逃跑；另一些（如骑士）则会奋战至死。<br><br>英雄的神圣或邪恶阵营倾向不会给其他队员带来负面影响。英雄自身也免受负面士气惩罚。<br><br>附近友军或敌人的死亡，以及自身受到的伤害，都会影响单位的士气。治疗则会恢复士气。<br><br>若单位未受牵制且未采取行动，每回合恢复1点士气。移动不影响此恢复，但其他行动会。<br><br>一个单位在近战中面对三个或更多敌人，且附近没有友军时，会被视为遭到包围。被包围的单位在每回合结束时损失{0}点士气。<br><br>士气降至零时，单位会陷入恐慌，并立即尝试逃离战场。恐慌中的单位防御降低。<br><br>高昂士气会提供战斗加成。<br><br>
BATTLE_TUTORIAL_GENERAL_HINTS_TEXT=实用建议<br><br>- 随机战斗可提供物品、材料，甚至独特的圣物！<br><br>- 每个单位都很重要；你的资源有限，能够招募的单位数量也有限。<br><br>- 请保护较弱的单位，直到它们成长得足以自保。<br><br>- 稀有药剂“诱变剂”可移除单位不想保留的特性。<br><br>- 某些敌人存在弱点。找到并加以利用，就能更轻松地击败它们。<br><br>- 远程和施法单位通常不擅长近战。<br><br>- 经验值可用于升级、强化单位或解锁新技能。培养成熟的单位在战场上威力惊人！<br><br>- 集中火力，逐个消灭敌人。远程单位尤其适合这种战术。<br><br>- 面对多支敌方队伍时，不妨等待它们互相消耗，再伺机行动。<br><br>- 玩得开心，记得经常存档！
BATTLE_TUTORIAL_TURNS_LOG_TEXT=战斗日志<br><br>在菜单中选择“战斗日志”，即可查看之前各回合的完整行动记录。所有行动及其结果，包括掷骰结果，都会记录在内。<br><br>此外，战斗画面左上角也会显示简短的回合日志。<br><br>例如：<br>“骑士击杀了地精”<br>“步兵未命中兽人”<br>“法师投出火球”<br><br>可在“选项”的“其他”页面启用详细行动记录，显示掷骰结果。
BATTLE_TUTORIAL_PLAYERS_MENU_TEXT=玩家菜单<br><br>点击右下角的“菜单”按钮即可打开玩家菜单。<br><br>其中包含以下重要选项：<br><br>- 结束回合：结束当前回合，将控制权交给下一位玩家。<br><br>- 帮助：显示本教程。<br><br>- 选项：打开选项窗口。<br><br>- 保存游戏：保存当前游戏。<br><br>- 结束战斗：结束当前战斗并返回主菜单。
BATTLE_TUTORIAL_UNIT_RESISTANCES_TEXT=抗性与弱点<br><br>部分能力和法术会造成额外效果或状态：<br><br>- 火焰能力和攻击可造成额外伤害，但往往不够精准！熟练的施法者可以引发强烈爆炸，将敌人彻底消灭。<br><br>- 寒冷法术和行动可将敌人冻结在原地，使其成为其他单位的活靶子。任何火焰伤害都会解除冻结。<br><br>- 闪电具有高攻击、双倍暴击概率和可命中多个敌人的特点。构装体尤其容易受到闪电伤害。<br><br>- 毒素／酸液攻击会随时间逐渐造成大量伤害，但中毒容易治愈。注意：免疫毒素的单位、亡灵、元素生物和构装体会直接受到酸液伤害。酸液还会造成腐蚀，降低防御。<br><br>- 魔法伤害来自某些法术和能力。它往往无视目标防御，但法术仍可能被抵抗。<br><br>- 神圣伤害只对亡灵和恶魔有效。<br><br>某些单位对特定攻击类型较为脆弱。例如，恶魔对火焰攻击的抗性很高，却容易受到寒冷攻击的伤害。尽量使用针对敌人弱点的伤害类型，以取得更好的效果。<br><br>
BATTLE_TUTORIAL_UNIT_UPGRADES_TEXT=单位升级<br><br>游戏过程中，单位可获得特殊加成和能力：<br><br>正规军／老兵／精英：单位可消耗经验值提升资历。这些升级也会增强某些法术的威力。<br><br>杀手：对敌人造成致命一击的单位可能获得此加成，提升其对特定类型敌人的攻击。<br><br>紫心勋章：受伤的单位可能获得一次性经验奖励。<br><br>幸存者：濒死幸存的单位可能在战斗结束时获得一次性经验奖励。<br><br>其他特殊技能和能力：各类单位都有多种技能和升级可供选择。
BATTLE_TUTORIAL_UNIT_DIALOG_TEXT=单位详情<br><br>单位详情窗口提供所选单位的详细信息和属性，无论该单位属于你还是敌方。可从技能菜单打开此窗口，也可点击敌方单位查看。<br><br>窗口分为三个主要部分：<br><br>单位头像和属性：名称、种族、生命值、魔法值、士气、攻击、防御、速度、经验值、击杀数等。这些属性的含义可在相应提示中查看。单位的阵营倾向标注在种族之后，例如“骑士／神圣”。如果没有标注神圣或邪恶，则该单位为中立。<br><br>文字区域：简要介绍此单位。<br><br>属性列表：列出当前影响该单位的所有永久和临时属性。<br><br>单位的特点是游戏的重要组成部分，建议你熟悉各类单位。
BATTLE_TUTORIAL_AREA_OF_EFFECT_TEXT=范围效果<br><br>大多数能力一次只能作用于一个目标，但少数稀有法术可以同时影响多个单位。<br><br>法师可施放火球术，对范围内的任何单位造成伤害。<br>施放火球术分为三步：<br><br>- 在法师的技能菜单中选择“火球术”。<br><br>- 激活法术后会显示施法范围。在范围内点击，选择攻击位置。<br><br>- 随后会显示作用范围，再次点击目标区域即可确认施放。<br><br>- 点击其他位置可重新选择目标区域。<br><br>少数范围法术会持续若干回合。例如，毒云会在每回合结束时触发，使范围内所有单位中毒，直到持续回合数耗尽。<br><br>某些稀有效果还会延迟生效。例如，“陨石天降”只会在下一回合结束时触发一次。
BATTLE_TUTORIAL_SPELLS_AND_ABILITIES_TEXT=法术与能力<br><br>许多单位拥有独特的特殊属性和可主动使用的技能。<br><br>选中单位后，可用技能会以图标形式显示在屏幕左侧。<br><br>再次点击已选中的单位可打开技能菜单，然后选择相应选项以激活技能。<br><br>某些能力需要消耗魔法值；只有魔法值足够时，才能施放这些法术。<br><br>单位若未采取行动，每回合恢复1点魔法值。移动不影响此恢复，但其他行动会。<br><br>部分能力还存在冷却时间：施放后，需要等待一定回合数才能再次使用。施法失败不会进入冷却。<br><br>可用技能种类繁多，请仔细阅读各项技能说明。
BATTLE_TUTORIAL_RANGED_ATTACKS_TEXT=远程攻击<br><br>远程单位可以从远处打击敌人。操作远程单位时，红色圆圈会标示其射程。<br><br>点击射程内可选的单位，即可将其选为攻击目标。此时仍会显示己方单位的可移动范围。<br><br>远程单位能够在不直接暴露于攻击之下的情况下击倒敌人，因此十分重要。各单位的射程不同；若本回合已移动，就无法进行远程攻击。<br><br>点击屏幕左下方的剑形图标，或点击单位打开技能菜单，可以命令远程单位改用近战攻击。
BATTLE_TUTORIAL_HEALTH_AND_MAGIC_BARS_TEXT=生命条与魔法条<br><br>每个单位上方都有一条红色生命条。生命值降至零时，该单位死亡。<br><br>施法单位的生命条下方还有一条黄色魔法条。<br><br>受士气影响的单位下方还会显示灰色士气条。士气降至零时，单位会陷入恐慌。<br><br>能够采取行动的单位，其底座外围会额外显示一个圆圈，此处以步兵为例。<br><br>单位可以获得影响战斗表现的临时状态或效果。这些状态以小图标显示在生命条和魔法条下方。<br><br>中毒期间，单位的生命条会变为绿色。麻痹单位则会显示为灰色。<br><br>
BATTLE_TUTORIAL_MOVEMENT_TEXT=移动<br><br>战场上的单位属于不同阵营，以颜色区分。本教程假设玩家控制蓝色队伍。<br><br>每个单位每回合只能移动一次。<br>当前回合能够采取行动的单位会以浅蓝色圆圈标记。<br><br>点击己方单位以选中。如果该单位尚未移动，高亮区域会显示其可移动范围。<br><br>点击目的地即可移动。点击可选区域之外，即可取消当前选择的移动或单位行动。<br><br>如果单位尚未移动，再次点击已选中的单位会进入转向模式。在此模式下，单位可自由转向任意方向。
BATTLE_TUTORIAL_BATTLE_BOARD_TEXT=战场<br><br>Age of Fear 是一个回合制策略游戏系列，包含剧情与战斗两种模式。本教程专门介绍战斗。<br><br>所有战斗都发生在战场上，两支或更多队伍在此交锋，争夺最终胜利。<br><br>按住战场上的位置并拖动，即可移动视野。<br><br>每位玩家使用已选定的单位进入战斗。<br>在自己的回合中，玩家向单位下达命令，目标是消灭敌人。<br><br>存活的单位会保留至下一场战斗，因此应尽量减少伤亡。
BATTLE_TUTORIAL_WELCOME_TEXT=欢迎来到 Age of Fear 系列！<br><br>本教程将帮助你熟悉游戏操作。<br><br>若想跳过教程，请选择“继续”；若想翻到下一页，请点击“下一页”。<br><br>你随时可以在玩家菜单中选择“帮助”，再次查看本教程。<br><br>感谢你支持独立游戏开发者！
