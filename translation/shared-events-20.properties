LevelWorldKnot03a.conversations.0.text=<html><body>你的英雄们被夹在两支来自过去的强大军队之间。<br>你们的首要任务是活下去！</body></html>
LevelWorldKnot03a.conversations.1.name=提示
LevelWorldKnot03a.conversations.1.text=如果任何一位英雄阵亡，世界之结 (World's Knot) 都会将你们安然无恙地传送回来。不过，每项挑战只能尝试一次！
