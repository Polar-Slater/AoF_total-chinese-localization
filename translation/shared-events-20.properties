# 通用事件第20批：世界之结
LevelWorldKnot01.text=<html><body>在王国一处偏远角落的深谷中，一座来自久远年代、早已被人遗忘的装置静静矗立，背阴处爬满了青苔。<br><br>尽管这座建筑显然年代久远，刻在分成两半的宏伟拱门上的神秘符文仍在微微闪烁，仿佛随着某种听不见的节奏起伏。<br><br>冒险者们认出，这就是世界之结 (World Knot)——传说很久以前，法师们曾用这件魔法装置研究时间魔法。<br><br>据说，这件附有魔法的奇巧装置能将生灵传送到不同的时间线。<br><br>谁也说不清它上一次启用是在何时，但它似乎仍有足够的能量，只要收到正确的指令，世界之结 (World Knot) 就能再次运作。<br><br>只有最勇敢的冒险者，才敢尝试驾驭这项古老技术。</body></html>
LevelWorldKnot01.selection-text=装置不停地嗡嗡作响，仿佛在等待着什么。
LevelWorldKnot01.location.name=世界之结 (World's Knot)
LevelWorldKnot01.conversations.0.name=提示
LevelWorldKnot01.conversations.0.text=世界之结 (World Knot) 的挑战是对冒险者们的终极考验。尝试任何一项挑战之前，请确保你的英雄足够强大！
LevelWorldKnot01.triggers.on-select-1.text=回去吧。
LevelWorldKnot01.triggers.on-select-1.description=返回世界地图。
LevelWorldKnot01.triggers.on-select-2.text=使用亡灵之冠。
LevelWorldKnot01.triggers.on-select-2.description=你的英雄将进入这条时间线。
LevelWorldKnot01.triggers.on-select-3.text=使用恶魔之心。
LevelWorldKnot01.triggers.on-select-3.description=你的英雄将进入这条时间线。
LevelWorldKnot01.triggers.on-select-4.text=使用染血战斧。
LevelWorldKnot01.triggers.on-select-4.description=你的英雄将进入这条时间线。
LevelWorldKnot01.triggers.on-select-20.text=调试：获得物品。
