# 通用对话第15批：宁静林地与灵魂之井。
SXX_SoulsWell_sacrifice.conversations.0.name=提示
SXX_SoulsWell_sacrifice.conversations.0.text=祭品被英雄们死死按住，惊恐地尖叫着，拼命挣扎，利刃却仍刺入了身体。滚烫的鲜血流进灵魂之井 (Well of Souls)。
SXX_SoulsWell_sacrifice.conversations.1.name=提示
SXX_SoulsWell_sacrifice.conversations.1.text=那具流淌着鲜血、已失去生息的躯体被一脚踢入井中，坠向深处。
SXX_SoulsWell_sacrifice.conversations.2.name=提示
SXX_SoulsWell_sacrifice.conversations.2.text=英雄们回头一看，发现脚边的雾气已凝聚成一份赏赐。
SXX_TranquilGrove_gain.conversations.0.name=提示
SXX_TranquilGrove_gain.conversations.0.text=英雄们将几株幼苗种进土里。片刻之间，幼苗便在魔法的作用下迅速长大，一株成熟的植物已准备好加入你的队伍！
