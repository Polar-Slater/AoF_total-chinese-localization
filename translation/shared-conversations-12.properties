# 通用对话第12批：符文锻造师与转化实验室。
SXX_RuneSmith_enter.conversations.0.name=符文锻造师
SXX_RuneSmith_enter.conversations.0.text=<html><body>旅人们，你们好！<br>欢迎来到我的锻造坊。</body></html>
SXX_RuneSmith_enter.conversations.1.name=符文锻造师
SXX_RuneSmith_enter.conversations.1.text=诸位来得正好！像你们这样英勇的冒险者，今天我可要给个特别优惠的价钱！
SXX_RuneSmith_enter.conversations.2.name=符文锻造师
SXX_RuneSmith_enter.conversations.2.text=<html><body>哦，看上这把剑了？<br>这可是阿齐尔领主亲自定做的！不是我自夸，这手艺真是漂亮。</body></html>
SXX_RuneSmith_enter.conversations.3.name=符文锻造师
SXX_RuneSmith_enter.conversations.3.text=<html><body>还是说，你中意的是那副护甲？<br>我敢说，爱德华爵士要是穿上它，同时对付两个亡灵之王都能活下来！</body></html>
SXX_RuneSmith_enter.conversations.4.name=符文锻造师
SXX_RuneSmith_enter.conversations.4.text=想必诸位也看出来了，我这儿只做定制。价钱合适，我就是你们的铁匠！
SXX_RuneSmith_gain.conversations.0.name=提示
SXX_RuneSmith_gain.conversations.0.text=<html><body>矮人符文锻造师开始干活。<br>他只在铁砧上敲了几下，就递给你一件工艺精湛的成品！</body></html>
SXX_TransmuterLab_Diamond_gain.conversations.0.name=提示
SXX_TransmuterLab_Diamond_gain.conversations.0.text=转化师将你的红宝石放进他那台神奇的机器。一颗钻石落入你面前的盘子里！（明天可以再次进行转化。）
SXX_TransmuterLab_GoldBar_gain.conversations.0.name=提示
SXX_TransmuterLab_GoldBar_gain.conversations.0.text=转化师将你的银锭放进他那台神奇的机器。蒸汽喷涌而出，紧接着，一块金锭弹了出来！（明天可以再次进行转化。）
SXX_TransmuterLab_Pearl_gain.conversations.0.name=提示
SXX_TransmuterLab_Pearl_gain.conversations.0.text=转化师将你的贝壳放进他那台神奇的机器。一颗珍珠落入你面前的盘子里！（明天可以再次进行转化。）
SXX_TransmuterLab_Talnes_leave.conversations.0.name=塔尔尼斯
SXX_TransmuterLab_Talnes_leave.conversations.0.text=哦，你想让我留在这里？我可想不出比这更好的地方了！
SXX_TransmuterLab_Talnes_leave.conversations.1.name=塔尔尼斯
SXX_TransmuterLab_Talnes_leave.conversations.1.text=我本来就是个做研究的人，实验室就是我的第二个家。
SXX_TransmuterLab_Talnes_leave.conversations.2.name=塔尔尼斯
SXX_TransmuterLab_Talnes_leave.conversations.2.text=当然，我会留下来，在这里为你们的冒险出一份力。
SXX_TransmuterLab_Talnes_leave.conversations.3.name=提示
SXX_TransmuterLab_Talnes_leave.conversations.3.text=<html><body>塔尔尼斯决定留在实验室工作，从这里为你提供支持。<br>（塔尔尼斯每天会制作几瓶药剂。）</body></html>
SXX_TransmuterLab_Talnes_potions.conversations.0.name=塔尔尼斯
SXX_TransmuterLab_Talnes_potions.conversations.0.text=你好，亲爱的朋友！我忙了一整晚，为你做好了这些药剂。请收下这份礼物，祝你一路冒险顺利。
