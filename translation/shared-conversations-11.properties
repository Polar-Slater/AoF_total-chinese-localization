# 通用对话第11批：恶魔城入城、契约邀约与签约后招募。
SXX_DemonCity_enter.conversations.0.name=凶魔
SXX_DemonCity_enter.conversations.0.text=<html><body>你！对，就是你！！<br>擅闯我们的城市，你想干什么？！</body></html>
SXX_DemonCity_enter.conversations.1.name=凶魔
SXX_DemonCity_enter.conversations.1.text=你是怎么进来的？快说！
SXX_DemonCity_enter.conversations.2.name=凶魔
SXX_DemonCity_enter.conversations.2.text=<html><body>哦，你想看看我们卖的东西？<br>这个嘛，嗯……生意归生意，倒也不是不行。</body></html>
SXX_DemonCity_enter.conversations.3.name=凶魔
SXX_DemonCity_enter.conversations.3.text=不过别磨蹭，赶紧回上面的世界去。要是被秘会的执法者发现，你就等着被撕成碎片吧！
SXX_DemonCity_pact_enter.conversations.0.name=梅菲斯托费勒
SXX_DemonCity_pact_enter.conversations.0.text=欢迎！
SXX_DemonCity_pact_enter.conversations.1.name=梅菲斯托费勒
SXX_DemonCity_pact_enter.conversations.1.text=我还担心你把我们那份小小的契约给忘了呢。
SXX_DemonCity_pact_enter.conversations.2.name=梅菲斯托费勒
SXX_DemonCity_pact_enter.conversations.2.text=（当然，就算你忘了，也不影响我收取约定的报酬。）
SXX_DemonCity_pact_enter.conversations.3.name=梅菲斯托费勒
SXX_DemonCity_pact_enter.conversations.3.text=按照约定，你可以从这些新兵中挑选人手，助你成就大业。
SXX_DemonCity_pact_enter.conversations.4.name=梅菲斯托费勒
SXX_DemonCity_pact_enter.conversations.4.text=死掉几个，或是折损了几个，都不必担心，后面还有的是。你们的世界正等着被征服，玩得开心！哈哈哈！
SXX_DemonCity_pact_select.conversations.0.name=梅菲斯托费勒
SXX_DemonCity_pact_select.conversations.0.text=嘘，凡人。
SXX_DemonCity_pact_select.conversations.1.name=梅菲斯托费勒
SXX_DemonCity_pact_select.conversations.1.text=没错，就是你，凡人。我远道而来，专程与你相见。
SXX_DemonCity_pact_select.conversations.2.name=梅菲斯托费勒
SXX_DemonCity_pact_select.conversations.2.text=你身上的一件物品引起了我们的注意。我们相信，双方可以做成一笔互惠互利的交易。
SXX_DemonCity_pact_select.conversations.3.name=梅菲斯托费勒
SXX_DemonCity_pact_select.conversations.3.text=容我解释一下，凡人。我们可以让手下的奴隶——呃，心甘情愿效劳的部下，为你的事业出一份力。
SXX_DemonCity_pact_select.conversations.4.name=梅菲斯托费勒
SXX_DemonCity_pact_select.conversations.4.text=<html><body>作为回报，我们要的不多——你的一滴血而已。<br>……再加上一点灵魂，不过那个可以等你死后再取。</body></html>
SXX_DemonCity_pact_select.conversations.5.name=梅菲斯托费勒
SXX_DemonCity_pact_select.conversations.5.text=反正到那时，你也不会在意了。再说，那肯定是很多年以后的事，实在不值一提。
SXX_DemonCity_pact_select.conversations.6.selection-text=<html><body>你身上的一件恶魔物品引起了冥界秘会的注意。<br>恶魔使者提出签订一份契约：用你的一滴血，<br>换取使用他们服务的资格。<br><br>附带的小字条款还提到，你死后将失去自己的灵魂，<br>不过谁有空操心这种无关紧要的小麻烦呢。<br><br>怎么样，凡人？你觉得这笔交易如何？</body></html>
