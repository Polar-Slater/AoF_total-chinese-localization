# 通用事件第10批：黑暗城堡地点叙述、委托与进度提示。
LevelDarkCastleVladamirQuest01.text=<html><body>深山高处，一座黑暗城堡 (Dark Castle) 隐藏其间，与阴沉的天空浑然一体。冒险者们眼前的这座城堡，透着一股邪恶的气息。<br><br>传说这里住着一位强大而富有的吸血鬼领主，因其骇人的食欲而遭世人驱逐。<br><br>若有冒险者能讨得此地主人的欢心，或许就能获得礼物与财富。<br><br>然而，至今没有访客能活着回来讲述城堡中的见闻。看来，想在这里讨得欢心，光有魅力还不够，还得拿出些更有嚼头的东西……<br><br>英雄们要敲响城堡的大门吗？</body></html>
