# War Machine — 简体中文
CAMPAIGN=ratmencampaign
LOCALE=zh
LevelMachineWar01.text=<html><body>因杜尔夫和莱克莎走出鼠人巢穴时，已是晚饭时分。昨夜他们接到紧急求援，今天便在洞穴里与黏糊糊的敌人缠斗了一整天，总算伴着一阵黏浆飞溅的响动，消灭了鼠人饮水处附近失控的史莱姆群。<br><br>两位英雄拖着脚步走向最近的酒馆，想吃点东西、喝上一杯，把这一天忘掉。<br><br>酒馆里座无虚席，只有吧台前一个胖矮人两侧还空着两张凳子。因杜尔夫拍了拍矮人的肩膀，指了指空位。<br><br>矮人兴奋地点头，邀请两人坐下。他喝干最后一点麦酒，响亮地打了个嗝，这才准备开口。</body></html>
LevelMachineWar01.location.name=战争机器 (War Machine)
LevelMachineWar01.conversations.0.name=矮人工程师
LevelMachineWar01.conversations.0.text=哦，你们好！瞧这模样，两位是真正的冒险者啊，我见得多，认得出来。
LevelMachineWar01.conversations.1.name=矮人工程师
LevelMachineWar01.conversations.1.text=什么风把你们吹到索罗顿 (Sorodon) 来了？
LevelMachineWar01.conversations.2.name=莱克莎
LevelMachineWar01.conversations.2.text=呃……我不想谈这个。
LevelMachineWar01.conversations.3.name=因杜尔夫
LevelMachineWar01.conversations.3.text=这么说吧，今天这番折腾过后，我们在城里的朋友可欠下了一个天大的人情。
LevelMachineWar01.conversations.4.name=矮人工程师
LevelMachineWar01.conversations.4.text=对，这滋味我懂！我们总是付出付出再付出，却从没回报，是不是？
LevelMachineWar01.conversations.5.name=矮人工程师
LevelMachineWar01.conversations.5.text=说起来，这倒让我想起一件事……
LevelMachineWar01.conversations.6.name=因杜尔夫
LevelMachineWar01.conversations.6.text=矮人……今天已经够漫长了。你能不能闭——
LevelMachineWar01.conversations.7.name=矮人工程师
LevelMachineWar01.conversations.7.text=……可不能再把它忘了！这念头在我脑子里搁了好多年，不，几十年了。矮人有史以来最伟大的发明！
LevelMachineWar01.conversations.8.name=莱克莎
LevelMachineWar01.conversations.8.text=等等，你是个工匠？
LevelMachineWar01.conversations.9.name=矮人工程师
LevelMachineWar01.conversations.9.text=没错，姑娘，空前绝后的好工匠！可惜我一直没机会完成那件杰作。那台机器会令人惊叹，会把人吓破胆，我以前堡垒里的那些混蛋嘛……他们不许我造。
LevelMachineWar01.conversations.10.name=因杜尔夫
LevelMachineWar01.conversations.10.text=接着说，矮人——你这发明究竟是什么？
LevelMachineWar01.conversations.11.name=矮人工程师
LevelMachineWar01.conversations.11.text=嗯，我想可以叫它……战争机器。
LevelMachineWar01.conversations.12.name=莱克莎
LevelMachineWar01.conversations.12.text=所以，是个什么……武器？
LevelMachineWar01.conversations.13.name=矮人工程师
LevelMachineWar01.conversations.13.text=可不只是一件武器，女士！斧头是武器，剑也是武器——而我的杰作，是战争艺术中的艺术品！
LevelMachineWar01.conversations.14.name=因杜尔夫
LevelMachineWar01.conversations.14.text=有意思……
LevelMachineWar01.conversations.15.name=矮人工程师
LevelMachineWar01.conversations.15.text=两位肯为索罗顿 (Sorodon) 的朋友花这么多工夫，那是不是也能，嗯……
LevelMachineWar01.conversations.16.name=矮人工程师
LevelMachineWar01.conversations.16.text=怎么样，朋友们？愿不愿帮帮一个时运不济的矮人？
LevelMachineWar01.conversations.17.name=莱克莎
LevelMachineWar01.conversations.17.text=我看不靠谱，因杜尔夫……他的本事要是有吹嘘的一半，也不至于沦落成个泡酒馆的废人！
LevelMachineWar01.conversations.18.name=因杜尔夫
LevelMachineWar01.conversations.18.text=谁都有落难的时候，莱克莎。我对这台神秘机器倒很感兴趣……
LevelMachineWar01.conversations.19.name=矮人工程师
LevelMachineWar01.conversations.19.text=这就对了！哦，相信我，那会是个漂亮得不得了的东西。
LevelMachineWar01.conversations.20.name=布林
LevelMachineWar01.conversations.20.text=对了，我叫布林——布林·铜鬃！容我再润润嗓子，就把来龙去脉告诉两位。
LevelMachineWar01.conversations.21.name=因杜尔夫
LevelMachineWar01.conversations.21.text=没胡子，哪算矮人……
LevelMachineWar01.conversations.22.name=莱克莎
LevelMachineWar01.conversations.22.text=……还得有啤酒。
LevelMachineWar02.conversations.0.name=布林
LevelMachineWar02.conversations.0.text=喂，酒保！再给我一杯麦酒，行不？
LevelMachineWar02.conversations.1.name=酒保
LevelMachineWar02.conversations.1.text=嘿！馋酒的矮子，我警告过你了。先结账，才有下一杯。
LevelMachineWar02.conversations.2.name=布林
LevelMachineWar02.conversations.2.text=哦，别这样，你知道我付得起！
LevelMachineWar02.conversations.3.name=酒保
LevelMachineWar02.conversations.3.text=你屁都付不起，矮子。掏钱，现在！
LevelMachineWar02.conversations.4.name=布林
LevelMachineWar02.conversations.4.text=……
LevelMachineWar02.conversations.5.name=酒保
LevelMachineWar02.conversations.5.text=底下听得见吗，矮子？我说付钱！100金币，再加小费！
LevelMachineWar02.conversations.6.name=布林
LevelMachineWar02.conversations.6.text=这个，呃……你报的那个数，我可能有那么点小问题……
LevelMachineWar02.conversations.7.name=酒保
LevelMachineWar02.conversations.7.text=啊？问题？这倒没错，不过可不小，你摊上大问题了。
LevelMachineWar02.conversations.8.name=酒保
LevelMachineWar02.conversations.8.text=矮子，这笔钱我们怎么都得从你身上弄回来。先把那大胡子卖给做假发的，也能凑点！
LevelMachineWar02.conversations.9.name=布林
LevelMachineWar02.conversations.9.text=你敢！
LevelMachineWar02.conversations.10.name=酒保
LevelMachineWar02.conversations.10.text=不敢？弟兄们，抓住他！
LevelMachineWar02.conversations.11.name=布林
LevelMachineWar02.conversations.11.text=朋友们，我可能比自己想的还要倒霉点！能不能，呃，怎么说呢……救救我？！
LevelMachineWar03.conversations.0.name=莱克莎
LevelMachineWar03.conversations.0.text=为什么要帮这个酒鬼？说不定他从头到尾都在撒谎！
LevelMachineWar03.conversations.1.name=因杜尔夫
LevelMachineWar03.conversations.1.text=没错……可想想，要是我们手里真有一台传奇战争机器，会是什么光景！
LevelMachineWar03.conversations.2.name=因杜尔夫
LevelMachineWar03.conversations.2.text=再说，我们的武器也该去去史莱姆污渍了。拿这些绿皮开刀，正好省了去水盆前擦洗的工夫，亲爱的莱克莎！
LevelMachineWar03.conversations.3.name=兽人
LevelMachineWar03.conversations.3.text=小矮子，准备好修胡子了吗？先把脑袋砍下来，可就好办多了！
LevelMachineWar03.triggers.on-battle-task-1.text=银锭×2：在第5回合结束前击败绿皮
LevelMachineWar03.triggers.on-battle-task-2.text=獠牙钉锤：无单位阵亡地赢得战斗
LevelMachineWar04a.text=<html><body>布林得意地站在昏倒的酒保身旁，对着绿皮的背晃动胡子，尽情嘲弄。<br><br>他顺手拿起吧台上一杯没人看着的麦酒喝了，随后将杯子往肩后一扔，恰好砸在那昏迷酒保的脑袋上，碎得毫不客气。<br><br>布林拍了拍因杜尔夫的背，又向莱克莎点头欠身。两位英雄察觉城卫兵就要赶来，急忙冲向已被砸得稀烂的酒馆后门。<br><br>带着新交的朋友，因杜尔夫与莱克莎奔入后巷。酒馆里传来一阵激动的喊声，宣告索罗顿 (Sorodon) 的夜间巡逻队已经赶到。</body></html>
LevelMachineWar04b.text=<html><body>两位英雄在索罗顿 (Sorodon) 后街的杂物间左躲右闪，终于找到一处清静地方，继续与布林交谈。<br><br>他们在一家早已打烊的咖啡馆后面，找了张无人照看的桌子坐下。<br><br>莱克莎惆怅地望着咖啡馆前窗，恨不得立刻给自己变出一杯新煮的咖啡。<br><br>布林跳上最矮的椅子，兴奋得藏不住，迫不及待想给两位英雄讲完他的故事。</body></html>
LevelMachineWar05.selection-text=你的英雄要询问什么？
LevelMachineWar05.location.name=布林·铜鬃 (Brin Brass-mane)
LevelMachineWar05.triggers.on-select-1.text=询问布林的工具。
LevelMachineWar05.triggers.on-select-1.description=问问他是否需要什么专用工具。
LevelMachineWar05.triggers.on-select-2.text=询问制作材料。
LevelMachineWar05.triggers.on-select-2.description=问问他是否需要制作所用的原料。
LevelMachineWar05.triggers.on-select-3.text=询问其他材料。
LevelMachineWar05.triggers.on-select-3.description=问问他是否需要什么特殊材料。
LevelMachineWar05.triggers.on-select-10.text=该了解的都了解了。
LevelMachineWar05.triggers.on-select-10.description=返回世界地图。
LevelMachineWarBrinWorkshop01.text=<html><body>因杜尔夫与莱克莎沿布满巨石的小路向上攀登，布林旧堡垒的正门赫然出现在眼前。奇怪的是，一个守卫也看不见。<br><br>记起布林说过，进堡垒的路不止一条，因杜尔夫与莱克莎分头绕着外墙迅速查探。<br><br>两位英雄找到了一扇侧门和一个后门，与正门一样，都无人看守。<br><br>因杜尔夫捋平胡须，眯起眼睛，认真盘算眼前的局面。该怎么选，一点也不明朗。</body></html>
LevelMachineWarBrinWorkshop01.location.name=布林的工坊 (Brin's Workshop)
LevelMachineWarBrinWorkshop01.conversations.0.name=因杜尔夫
LevelMachineWarBrinWorkshop01.conversations.0.text=咱们走堡垒侧门吧……
LevelMachineWarBrinWorkshop01.conversations.1.name=莱克莎
LevelMachineWarBrinWorkshop01.conversations.1.text=你确定？
LevelMachineWarBrinWorkshop01.conversations.2.name=因杜尔夫
LevelMachineWarBrinWorkshop01.conversations.2.text=不确定……那后门呢？
LevelMachineWarBrinWorkshop01.conversations.3.name=莱克莎
LevelMachineWarBrinWorkshop01.conversations.3.text=<html><body>我不知道，因杜尔夫。<br>你确定？</body></html>
LevelMachineWarBrinWorkshop01.conversations.4.name=因杜尔夫
LevelMachineWarBrinWorkshop01.conversations.4.text=<html><body>该死！别给我添压力，女巫。<br>我说了，走正门！</body></html>
LevelMachineWarBrinWorkshop01.conversations.5.name=莱克莎
LevelMachineWarBrinWorkshop01.conversations.5.text=你说了算。回头可别说我没提醒你。
LevelMachineWarBrinWorkshop01.conversations.6.name=因杜尔夫
LevelMachineWarBrinWorkshop01.conversations.6.text=<html><body>……<br>我讨厌你。</body></html>
LevelMachineWarBrinWorkshop01.conversations.8.name=守护者
LevelMachineWarBrinWorkshop01.conversations.8.text=<html><body>滋滋！滋滋！<br>滋滋！</body></html>
LevelMachineWarBrinWorkshop01.conversations.9.name=因杜尔夫
LevelMachineWarBrinWorkshop01.conversations.9.text=该死！布林就该提醒我们别走这扇门！
LevelMachineWarBrinWorkshop01.conversations.10.name=莱克莎
LevelMachineWarBrinWorkshop01.conversations.10.text=我早就说过了！
LevelMachineWarBrinWorkshop02.conversations.0.name=守护者
LevelMachineWarBrinWorkshop02.conversations.0.text=滋滋！滋滋！
LevelMachineWarBrinWorkshop02.conversations.1.name=守护者
LevelMachineWarBrinWorkshop02.conversations.1.text=滋滋！
LevelMachineWarBrinWorkshop02.conversations.2.name=莱克莎
LevelMachineWarBrinWorkshop02.conversations.2.text=我早就说过了。
LevelMachineWarBrinWorkshop02.conversations.3.name=因杜尔夫
LevelMachineWarBrinWorkshop02.conversations.3.text=闭嘴，莱克莎。
LevelMachineWarBrinWorkshop02.conversations.4.name=莱克莎
LevelMachineWarBrinWorkshop02.conversations.4.text=就算找到了工具，我们真能指望那个酒鬼抡得动锤子吗？
LevelMachineWarBrinWorkshop02.conversations.5.name=因杜尔夫
LevelMachineWarBrinWorkshop02.conversations.5.text=相信我，莱克莎。等我们有了自己的战争机器，这些飘在空中的桶就再也不值一提了！
LevelMachineWarBrinWorkshop02.triggers.on-battle-task-1.text=暗夜护符：在第8回合结束前摧毁钢铁魔像
LevelMachineWarBrinWorkshop02.triggers.on-battle-task-2.text=迅捷灵药×2：阵亡单位不超过2个并赢得战斗
LevelMachineWarBrinWorkshop03.text=<html><body>进入堡垒后，两位英雄悄悄穿过回声阵阵的石厅，寻找布林旧时的工坊。空气冷得刺骨，堡垒里却异常空旷。<br><br>没找多久，因杜尔夫便透过一扇半开的门，看见屋里有张工作台。两人溜进去，发现这是一间布满灰尘的工坊，各式拆到一半的机械装置扔在地上，任其生锈。<br><br>莱克莎在长桌一端的下方发现了一个卷起的皮包，用一条闪亮的链子扎着。包底工整地缀着“BB”两个姓名首字母。<br><br>因杜尔夫与莱克莎拖着沉甸甸的工具包，沿原路往外走。</body></html>
LevelMachineWarBrinWorkshop03.conversations.0.name=莱克莎
LevelMachineWarBrinWorkshop03.conversations.0.text=因杜尔夫，这地方怎么这么……安静？我一个矮人都没碰到……
LevelMachineWarBrinWorkshop03.conversations.1.name=因杜尔夫
LevelMachineWarBrinWorkshop03.conversations.1.text=我也只能猜猜，莱克莎，不过那是以后才要操心的事。
LevelMachineWarBrinWorkshop03.conversations.2.name=因杜尔夫
LevelMachineWarBrinWorkshop03.conversations.2.text=布林的工具拿到了，我们走吧！
LevelMachineWarBrinWorkshop03.conversations.3.name=莱克莎
LevelMachineWarBrinWorkshop03.conversations.3.text=关于这座旧堡垒，他肯定还有事瞒着我们……
LevelMachineWarBrinWorkshop03.conversations.4.name=布林
LevelMachineWarBrinWorkshop03.conversations.4.text=哦，朋友们好啊！
LevelMachineWarBrinWorkshop03.conversations.5.name=因杜尔夫
LevelMachineWarBrinWorkshop03.conversations.5.text=什——？你怎么在这里？！
LevelMachineWarBrinWorkshop03.conversations.6.name=布林
LevelMachineWarBrinWorkshop03.conversations.6.text=我？来看看我的两位朋友怎么样了。
LevelMachineWarBrinWorkshop03.conversations.7.name=莱克莎
LevelMachineWarBrinWorkshop03.conversations.7.text=因杜尔夫，我看这位矮人朋友是拿我们给他收拾烂摊子了……
LevelMachineWarBrinWorkshop03.conversations.8.name=因杜尔夫
LevelMachineWarBrinWorkshop03.conversations.8.text=布林，解释一下。快点，不然我的大剑可要开口了。
LevelMachineWarBrinWorkshop03.conversations.9.name=布林
LevelMachineWarBrinWorkshop03.conversations.9.text=<html><body>你们两个这么紧张干吗？我又没把你们怎么样。<br>不就是忘了那些守卫机器的口令嘛。</body></html>
LevelMachineWarBrinWorkshop03.conversations.10.name=莱克莎
LevelMachineWarBrinWorkshop03.conversations.10.text=因杜尔夫，我对这位矮人本来就没多少信任，现在更是一落千丈。谁能保证他的机器不会把我们全碾扁？
LevelMachineWarBrinWorkshop03.conversations.11.name=布林
LevelMachineWarBrinWorkshop03.conversations.11.text=<html><body>这猜疑既荒唐，又是对矮人的偏见！<br>我干活一向尽心尽力，造的机器运转顺畅。（大多数时候。）</body></html>
LevelMachineWarBrinWorkshop03.conversations.12.name=因杜尔夫
LevelMachineWarBrinWorkshop03.conversations.12.text=……
LevelMachineWarBrinWorkshop03.conversations.13.name=因杜尔夫
LevelMachineWarBrinWorkshop03.conversations.13.text=莱克莎，再给他一次机会吧。但仅此一次，矮人。你得交出成品，不然就把自己交代在这儿！
LevelMachineWarBrinWorkshop04.location.name=布林的工坊 (Brin's Workshop)
LevelMachineWarBrinWorkshop05.text=<html><body>因杜尔夫与莱克莎回到布林临时搭起的工坊，发现这位矮人工程师正弓着身子伏在简易工作台前，敲打一片弯曲的金属，想把它砸回原样。<br><br>布林转身看向两位英雄，一见他们怀里抱着的满满收获，顿时笑得满面生辉。<br><br>矮人示意他们将东西放下，以便逐一清点。布林仔仔细细地检查，边看边在手写清单上划掉一项又一项。<br><br>对这番收获十分满意，他拍了拍手，清了清嗓子……</body></html>
LevelMachineWarBrinWorkshop05.location.name=布林的工坊 (Brin's Workshop)
LevelMachineWarBrinWorkshop05.conversations.0.name=布林
LevelMachineWarBrinWorkshop05.conversations.0.text=太棒了！全齐了。依我老布林看，你们两个绝对是冒险者里最顶尖的！
LevelMachineWarBrinWorkshop05.conversations.1.name=因杜尔夫
LevelMachineWarBrinWorkshop05.conversations.1.text=布林，替你凑齐这些可真不容易！那你什么时候能开始造那台了不起的机器？
LevelMachineWarBrinWorkshop05.conversations.2.name=布林
LevelMachineWarBrinWorkshop05.conversations.2.text=马上，朋友！这些年我早就在脑子里盘算妥了，给我一天，应该就能拼得漂漂亮亮！
LevelMachineWarPureIron01.location.name=纯铁 (Pure Iron)
LevelMachineWarPureIron01.conversations.0.name=因杜尔夫
LevelMachineWarPureIron01.conversations.0.text=这些元素生物看着像是从山里矿藏特别丰富的地方生出来的，瞧它们在太阳下闪得多亮！
LevelMachineWarPureIron01.conversations.1.name=莱克莎
LevelMachineWarPureIron01.conversations.1.text=要是像平时对付敌人那样，把它们砸得稀碎，我们还能捡到铁吗？
LevelMachineWarPureIron01.conversations.2.name=因杜尔夫
LevelMachineWarPureIron01.conversations.2.text=也许可以稍微手下留情……
LevelMachineWarPureIron01.conversations.3.name=土元素
LevelMachineWarPureIron01.conversations.3.text=吼——！！
LevelMachineWarPureIron01.conversations.4.name=因杜尔夫
LevelMachineWarPureIron01.conversations.4.text=……但也别太留情了！
LevelMachineWarPureIron01.triggers.on-battle-task-1.text=混沌护符：消灭烈焰多头蛇
LevelMachineWarPureIron01.triggers.on-battle-task-2.text=红宝石：在第6回合结束前消灭所有元素生物
LevelMachineWarAncientCoal01.location.name=远古煤炭 (Ancient Coal)
LevelMachineWarAncientCoal01.conversations.0.name=巨型蜘蛛
LevelMachineWarAncientCoal01.conversations.0.text=……
LevelMachineWarAncientCoal01.conversations.1.name=巨型蜘蛛
LevelMachineWarAncientCoal01.conversations.1.text=……
LevelMachineWarAncientCoal01.conversations.2.name=因杜尔夫
LevelMachineWarAncientCoal01.conversations.2.text=（毫无疑问，这群毛骨悚然的爬虫守着一大堆煤。正是我们需要的！）
LevelMachineWarAncientCoal01.conversations.3.name=莱克莎
LevelMachineWarAncientCoal01.conversations.3.text=（呃。因杜尔夫，你明知道我讨厌蜘蛛！）
LevelMachineWarAncientCoal01.conversations.4.name=因杜尔夫
LevelMachineWarAncientCoal01.conversations.4.text=（莱克莎，我还以为你讨厌的是下水道和老鼠呢？）
LevelMachineWarAncientCoal01.conversations.5.name=莱克莎
LevelMachineWarAncientCoal01.conversations.5.text=（两样都讨厌！）
LevelMachineWarAncientCoal01.conversations.6.name=因杜尔夫
LevelMachineWarAncientCoal01.conversations.6.text=（那就庆幸吧，现在我们只需要对付其中一样。）
LevelMachineWarAncientCoal01.conversations.7.name=巨型蜘蛛
LevelMachineWarAncientCoal01.conversations.7.text=嘶啊——！！
LevelMachineWarAncientCoal01.conversations.8.name=莱克莎
LevelMachineWarAncientCoal01.conversations.8.text=啊！去死！
LevelMachineWarAncientCoal01.conversations.9.name=因杜尔夫
LevelMachineWarAncientCoal01.conversations.9.text=这才对嘛，亲爱的莱克莎！
LevelMachineWarAncientCoal01.triggers.on-battle-task-1.text=高效解毒剂×2：在第5回合结束前消灭腐化蜘蛛
LevelMachineWarAncientCoal01.triggers.on-battle-task-2.text=金锭×2：肃清煤矿
LevelMachineWarDragonSkull01.text=<html><body>浓雾笼罩着暗影沼泽 (Shadowmarsh)，仿佛铺在蛋糕上的糖霜。陈年腐烂的浓重霉臭，一阵阵从泥沼水中翻涌上来，像是沼泽刚饱餐一顿，正在打嗝。<br><br>莱克莎捏着鼻子，跪下查看一副死去已久的生物留下的肋骨。因杜尔夫踢向一根倒木侧面，将它踢得滚开，露出一大团活跃的蠕虫和甲虫。还没有发现任何龙的遗骸……暂时没有。<br><br>两位英雄注意到，疯长的藤蔓几乎遮住了一大圈石碑，圈内中央聚着几座坟冢。因杜尔夫从一棵仍立着的枯树上扯下树枝，掰成两段，将一段递给莱克莎。<br><br>两人开始刨去表土……</body></html>
LevelMachineWarDragonSkull01.location.name=龙之颅骨 (Dragon Skull)
LevelMachineWarDragonSkull01.conversations.0.name=因杜尔夫
LevelMachineWarDragonSkull01.conversations.0.text=哦，看看我们发现了什么？
LevelMachineWarDragonSkull01.conversations.1.name=莱克莎
LevelMachineWarDragonSkull01.conversations.1.text=我好像碰到下面有东西，不是树根。继续挖！
LevelMachineWarDragonSkull01.conversations.2.name=因杜尔夫
LevelMachineWarDragonSkull01.conversations.2.text=对，快了……那儿，我看见东西了！
LevelMachineWarDragonSkull01.conversations.3.name=莱克莎
LevelMachineWarDragonSkull01.conversations.3.text=骨头！可是不是我们要找的那种？
LevelMachineWarDragonSkull01.conversations.4.name=因杜尔夫
LevelMachineWarDragonSkull01.conversations.4.text=也许在地上拼一拼，就能看出来。
LevelMachineWarDragonSkull01.conversations.5.name=因杜尔夫
LevelMachineWarDragonSkull01.conversations.5.text=所以这块放那儿，这块放这儿，然后——
LevelMachineWarDragonSkull01.conversations.6.name=幽灵龙
LevelMachineWarDragonSkull01.conversations.6.text=吼——！！
LevelMachineWarDragonSkull01.conversations.7.name=因杜尔夫
LevelMachineWarDragonSkull01.conversations.7.text=老天！这下你的问题有答案了吧，莱克莎？！
LevelMachineWarDragonSkull01.conversations.8.name=莱克莎
LevelMachineWarDragonSkull01.conversations.8.text=我还指望不用把这该死的东西复活，就能弄清楚呢！
LevelMachineWarDragonSkull01.conversations.9.name=因杜尔夫
LevelMachineWarDragonSkull01.conversations.9.text=就当学点新知识吧，亲爱的莱克莎——现在我们知道了，龙不喜欢别人乱动它们的遗骸。
LevelMachineWarDragonSkull01.conversations.10.name=莱克莎
LevelMachineWarDragonSkull01.conversations.10.text=要是布林跟着来了就好，这场面够给他所有想要的灵感了……
LevelMachineWarDragonSkull02.triggers.on-battle-task-1.text=猎魔人护符：击败龙巫妖
LevelMachineWarDragonSkull02.triggers.on-battle-task-2.text=抗魔戒指：捉鬼高手们，肃清沼泽！
LevelMachineWarMechanicalDragon01.text=<html><body>焦急地等过一段时间，两位英雄踏进布林的工坊 (Brin's workshop)，看见矮人工程师正骄傲地站在杰作前。发条巨龙打磨光亮的金属外壳映着晨光，鼻孔飘出缕缕轻烟，模样令人望而生畏！<br><br>布林兴奋得几乎按捺不住，快步跑到发条巨龙脚边的煤堆旁。他打开机器腹部的炉栅，一铲接一铲地添煤，倒在里面已经烧得通红的余烬上。<br><br>炉膛添满燃料后，布林砰地关上舱盖，扳动发条巨龙侧面的一根操纵杆。巨龙发出一声古怪而痛苦的呻吟，令人窒息的黑烟开始从每条缝隙里往外冒。<br><br>布林惊得往后一跳，忧心忡忡地望着自己的造物。</body></html>
LevelMachineWarMechanicalDragon01.location.name=发条巨龙 (Clockwork Dragon)
LevelMachineWarMechanicalDragon01.conversations.0.name=布林
LevelMachineWarMechanicalDragon01.conversations.0.text=<html><body>亲爱的朋友们，你们好！<br>来得正是时候。</body></html>
LevelMachineWarMechanicalDragon01.conversations.1.name=布林
LevelMachineWarMechanicalDragon01.conversations.1.text=我正要启动这台机器！
LevelMachineWarMechanicalDragon01.conversations.2.name=莱克莎
LevelMachineWarMechanicalDragon01.conversations.2.text=（因杜尔夫，我有种不好的预感……）
LevelMachineWarMechanicalDragon01.conversations.3.name=因杜尔夫
LevelMachineWarMechanicalDragon01.conversations.3.text=（能出什么岔子？我们终于要有自己的战争机器了。）
LevelMachineWarMechanicalDragon01.conversations.4.name=布林
LevelMachineWarMechanicalDragon01.conversations.4.text=……
LevelMachineWarMechanicalDragon01.conversations.5.name=布林
LevelMachineWarMechanicalDragon01.conversations.5.text=搞什么……？
LevelMachineWarMechanicalDragon01.conversations.6.name=莱克莎
LevelMachineWarMechanicalDragon01.conversations.6.text=我早就说过了！
LevelMachineWarMechanicalDragon01.conversations.7.name=因杜尔夫
LevelMachineWarMechanicalDragon01.conversations.7.text=有什么问题吗，布林？
LevelMachineWarMechanicalDragon01.conversations.8.name=莱克莎
LevelMachineWarMechanicalDragon01.conversations.8.text=我早就说过了！
LevelMachineWarMechanicalDragon01.conversations.9.name=因杜尔夫
LevelMachineWarMechanicalDragon01.conversations.9.text=（闭嘴，莱克莎。）
LevelMachineWarMechanicalDragon01.conversations.10.name=布林
LevelMachineWarMechanicalDragon01.conversations.10.text=<html><body>我不……我不知道。<br>也许试着换个挡……</body></html>
LevelMachineWarMechanicalDragon01.conversations.11.name=发条巨龙
LevelMachineWarMechanicalDragon01.conversations.11.text=呜——。
LevelMachineWarMechanicalDragon01.conversations.12.name=莱克莎
LevelMachineWarMechanicalDragon01.conversations.12.text=糟了，它不喜欢这样！
LevelMachineWarMechanicalDragon01.conversations.13.name=布林
LevelMachineWarMechanicalDragon01.conversations.13.text=它本来就不该“喜欢”什么，姑娘！有什么地方出了大乱子……
LevelMachineWarMechanicalDragon01.conversations.14.name=因杜尔夫
LevelMachineWarMechanicalDragon01.conversations.14.text=那就关掉它，你这蠢货！
LevelMachineWarMechanicalDragon01.conversations.15.name=布林
LevelMachineWarMechanicalDragon01.conversations.15.text=那得站到它正后面去，可它，呃……好像不想让我过去！
LevelMachineWarMechanicalDragon01.conversations.16.name=发条巨龙
LevelMachineWarMechanicalDragon01.conversations.16.text=呜——吼——！！！
LevelMachineWarMechanicalDragon01.conversations.17.name=布林
LevelMachineWarMechanicalDragon01.conversations.17.text=诸神在上！朋友们，它有自己的主意了，而且心情似乎不怎么好！
LevelMachineWarMechanicalDragon01.conversations.18.name=布林
LevelMachineWarMechanicalDragon01.conversations.18.text=不对劲，因杜尔夫。有什么东西在控制这台漂亮的机器……
LevelMachineWarMechanicalDragon01.conversations.19.name=布林
LevelMachineWarMechanicalDragon01.conversations.19.text=说出这话真让我心如刀绞，不过……没别的办法，只能跟我的杰作打一场了！
LevelMachineWarMechanicalDragon02.conversations.0.name=因杜尔夫
LevelMachineWarMechanicalDragon02.conversations.0.text=这到底是怎么回事，布林？这样的战争机器，你让我怎么驾驭？！
LevelMachineWarMechanicalDragon02.conversations.1.name=莱克莎
LevelMachineWarMechanicalDragon02.conversations.1.text=我早就说过了！
LevelMachineWarMechanicalDragon02.triggers.on-battle-task-1.text=元素防护药剂×2：击倒发条巨龙
LevelMachineWarMechanicalDragon02.triggers.on-battle-task-2.text=金锭与红宝石：无单位阵亡地赢得战斗
LevelMachineWarMechanicalDragon03.text=<html><body>发条巨龙看似牢不可破的护甲，在侧腹一处要害裂开，机器顿时失去平衡。<br><br>重心一偏，整块侧板都被扯了下来，巨型机器的半副引擎坠到布林的工坊 (Brin's workshop) 地板上，齿轮和金属碎片四散飞溅。<br><br>那仿佛被附身的凶狠目光落在因杜尔夫身上。他举起剑，准备挡住下一波地狱烈火，但巨龙眼中的光闪了几下，便彻底熄灭。<br><br>发条巨兽垂下头，仿佛又变回了布林点燃炉膛前那副毫无生气的样子。<br><br>布林拍掉胡子上的碎屑，走上前检查这台死寂的机器。这一次，他的谨慎远远盖过了兴奋。</body></html>
LevelMachineWarMechanicalDragon03.conversations.0.name=布林
LevelMachineWarMechanicalDragon03.conversations.0.text=等等！我有主意了。打开炉膛看看是什——
LevelMachineWarMechanicalDragon03.conversations.1.name=火元素
LevelMachineWarMechanicalDragon03.conversations.1.text=呼——轰！
LevelMachineWarMechanicalDragon03.conversations.2.name=莱克莎
LevelMachineWarMechanicalDragon03.conversations.2.text=哇！那东西一直在里头？！
LevelMachineWarMechanicalDragon03.conversations.3.name=布林
LevelMachineWarMechanicalDragon03.conversations.3.text=当然，当然！老天，我早该想到的。那堆煤里，肯定有一家子火元素在睡觉。
LevelMachineWarMechanicalDragon03.conversations.4.name=布林
LevelMachineWarMechanicalDragon03.conversations.4.text=我年轻时见过一次，可那会儿刚喝了一两桶酒，就说服自己那只是想象出来的。看来不是！
LevelMachineWarMechanicalDragon03.conversations.5.name=因杜尔夫
LevelMachineWarMechanicalDragon03.conversations.5.text=布林，这发现再重要，你也看看我的战争机器——全毁了！
LevelMachineWarMechanicalDragon03.conversations.6.name=布林
LevelMachineWarMechanicalDragon03.conversations.6.text=哦，没那么糟。我见过更惨的！说实话，你们带来的东西，我只用了一半……
LevelMachineWarMechanicalDragon03.conversations.7.name=布林
LevelMachineWarMechanicalDragon03.conversations.7.text=所以，把今天剩下的时间给我，我应该能把这都修好，弄个明白，朋友们。
LevelMachineWarMechanicalDragon04.text=<html><body>布林从下午一直忙到深夜，焊接、修整受损的发条巨龙，让它重新恢复运转。<br><br>太阳刚刚升起，在工坊外余火旁露营的因杜尔夫和莱克莎，就被布林报喜的喊声唤醒。<br><br>两位英雄匆匆钻出铺盖，冲进工坊，看见修好的机器神气十足地立在眼前！</body></html>
LevelMachineWarMechanicalDragon04.conversations.0.name=布林
LevelMachineWarMechanicalDragon04.conversations.0.text=说到做到，朋友们——你们自己的战争机器！
LevelMachineWarMechanicalDragon04.conversations.1.name=因杜尔夫
LevelMachineWarMechanicalDragon04.conversations.1.text=太棒了！布林，你真是个天才！
LevelMachineWarMechanicalDragon04.conversations.2.name=莱克莎
LevelMachineWarMechanicalDragon04.conversations.2.text=布林，这回能保证没有元素生物附身了吗？
LevelMachineWarMechanicalDragon04.conversations.3.name=布林
LevelMachineWarMechanicalDragon04.conversations.3.text=姑娘，自己看吧。那双眼睛里哪还有半点邪祟！
LevelMachineWarMechanicalDragon04.conversations.4.name=发条巨龙
LevelMachineWarMechanicalDragon04.conversations.4.text=……
LevelMachineWarMechanicalDragon04.conversations.5.name=莱克莎
LevelMachineWarMechanicalDragon04.conversations.5.text=……
LevelMachineWarMechanicalDragon04.conversations.6.name=莱克莎
LevelMachineWarMechanicalDragon04.conversations.6.text=（因杜尔夫，附没附身，这东西都让我发毛！）
LevelMachineWarMechanicalDragon04.conversations.7.name=因杜尔夫
LevelMachineWarMechanicalDragon04.conversations.7.text=（别这样，莱克莎。这么说会冒犯我们的机械巨兽朋友的。）
LevelMachineWarMechanicalDragon04.conversations.8.name=因杜尔夫
LevelMachineWarMechanicalDragon04.conversations.8.text=布林，你这回真是超越自己了。有了这台机器，谁还敢挡在黑心因杜尔夫的雄心之前！
LevelMachineWarMechanicalDragon04.conversations.9.name=布林
LevelMachineWarMechanicalDragon04.conversations.9.text=两位，去好好玩吧！不过别就此生分了，随时都可以来看我。
LevelMachineWarMechanicalDragon04.conversations.10.name=布林
LevelMachineWarMechanicalDragon04.conversations.10.text=……比如，要是想给这宝贝漆上一身乌黑的漆，拎桶对我胃口的麦酒，也许就能说动我！
LevelMachineWarMechanicalDragon04.conversations.11.name=莱克莎
LevelMachineWarMechanicalDragon04.conversations.11.text=别给他出主意！
LevelMachineWarMechanicalDragon04.conversations.12.name=因杜尔夫
LevelMachineWarMechanicalDragon04.conversations.12.text=布林，你能不能……给它画上一撇胡子？
LevelMachineWarDefeat.text=<html><body>最后一记致命打击撕开残存的防御，战场归于寂静，这场冒险就此戛然而止，落得悲惨收场。<br><br>布林伟大的发明，尽管前景诱人，终究未能成真。<br><br>因杜尔夫的战争机器之梦结束了，一同结束的，还有更多……</body></html>
