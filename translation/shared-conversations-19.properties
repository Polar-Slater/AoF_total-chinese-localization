SXX_DancerQuest_join.conversations.2.text=我跟你们一起走吧。马戏团里也没什么值得我留恋的。就算不能一直同行，至少在一起的时候，我们可以好好享受彼此的陪伴。
SXX_Sandworm_unlocked.conversations.1.name=提示
SXX_Sandworm_unlocked.conversations.1.text=你派往沙漠的斥候发现了一条神秘的沙虫。传闻这头巨兽多年来吞下了不少财宝。你愿意接受这场挑战吗？
