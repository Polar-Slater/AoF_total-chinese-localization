# 通用事件第29批：炼金术士支线的通用关卡文本
LevelAlchemist01.text=<html><body>英雄们来到岔路口，看见一名炼金术士独自站在高高的路牌下，路牌指向三条不同的道路。<br><br>他背对着走近的队伍，目光凝望远方的地平线。听到冒险者们踩过尘土的脚步声，他猛地转过身，欣喜地笑了起来。<br><br>炼金术士两眼放光，急匆匆地迎向英雄们，身后扬起一阵尘土。他险些一头撞进人群，才终于刹住脚步。<br><br>他整了整长袍，清清嗓子……</body></html>
LevelAlchemist01.location.name=永生之旅 (The Quest for Immortality)
LevelAlchemist02.text=<html><body>一片僻静的林地中央，庄严华美的许愿井 (Well of Wishes) 沐浴在阳光中。井身以雪花石膏精雕而成，镶嵌着各色璀璨的宝石。<br><br>这口井看似年代久远，却没有一丝青苔或常春藤。外壁上精美的贝壳与海洋生物雕饰，也全无风化的痕迹。<br><br>亲眼见到导师典籍中记载的古迹，塔尔尼斯兴奋不已。他走上前，目光在井身上来回扫视，搜寻线索。<br><br>炼金术士忽然注意到了什么。他跪下来，指着一道图纹，那图案似乎描绘着献上祭品的情景。</body></html>
LevelAlchemist02.selection-text=队伍该怎么做？
LevelAlchemist02.location.name=许愿井 (Well of Wishes)
LevelAlchemist02.triggers.on-select-1.text=离开水井，继续旅程。
LevelAlchemist02.triggers.on-select-1.description=返回世界地图。
LevelAlchemist02.triggers.on-select-2.text=把治疗药液投入井中。
LevelAlchemist02.triggers.on-select-3.text=把精制长剑投入井中。
LevelAlchemist02.triggers.on-select-4.text=把防护戒指投入井中。
LevelAlchemist02.triggers.on-select-5.text=把银锭投入井中。
LevelAlchemist02.triggers.on-select-6.text=把魔法颈环投入井中。
LevelAlchemist02.triggers.on-select-7.text=把健康护符投入井中。
LevelAlchemist02.triggers.on-select-20.text=把一枚金币投入井中。
LevelAlchemist02b.conversations.0.name=塔尔尼斯
LevelAlchemist02b.conversations.0.text=<html><body>哎呀，看来这泉水接受了我们的祭品！你们感觉到了吗，脚下在隆隆震动？<br>有什么事要发生了！</body></html>
LevelAlchemist02b.conversations.1.name=凶魔
LevelAlchemist02b.conversations.1.text=<html><body>吼——！！<br>是谁胆敢惊扰我的沉眠？！</body></html>
LevelAlchemist02b.conversations.2.name=凶魔
LevelAlchemist02b.conversations.2.text=什么，就一群凡人？开什么玩笑。好歹让我醒来后痛快打一场啊，杀你们只会让我又犯困！
LevelAlchemist02b.conversations.3.name=塔尔尼斯
LevelAlchemist02b.conversations.3.text=<html><body>阿布杜斯，阿维！埃塔，埃沃塔！<br>恶魔，听我号令，服从于我！</body></html>
LevelAlchemist02b.conversations.4.name=凶魔
LevelAlchemist02b.conversations.4.text=<html><body>什么？！那道咒语……渺小的凡人，你竟想束缚我？！<br>不许再念一个字！</body></html>
LevelAlchemist02b.conversations.5.name=塔尔尼斯
LevelAlchemist02b.conversations.5.text=埃塔，埃沃塔！！
LevelAlchemist02b.conversations.6.name=凶魔
LevelAlchemist02b.conversations.6.text=<html><body>哈哈哈！再使点劲，凡人！<br>我要让你尝尽苦痛！</body></html>
LevelAlchemist02b.conversations.7.name=塔尔尼斯
LevelAlchemist02b.conversations.7.text=……埃塔，埃瓦雷奥？不，等等……埃塔，埃沃托伊阿！埃维——该死！
LevelAlchemist02b.conversations.8.name=塔尔尼斯
LevelAlchemist02b.conversations.8.text=糟了，糟了，糟了！我就知道该把那段咒语的读法再核对一遍！
LevelAlchemist02b.conversations.9.name=凶魔
LevelAlchemist02b.conversations.9.text=哈哈哈！人类，你这打了结的舌头，扯起来一定更省事。
LevelAlchemist02b.conversations.10.name=凶魔
LevelAlchemist02b.conversations.10.text=我已沉睡了数千年……现在饿极了。你的念咒本事烂透了，拿来当早餐倒是绰绰有余！
LevelAlchemist02b.conversations.11.name=塔尔尼斯
LevelAlchemist02b.conversations.11.text=朋友们，麻烦大了，那恶魔在舔嘴唇！举起武器！好歹让我们看着没那么好下口。
LevelAlchemist04.text=<html><body>最后一击将恶魔打得跪倒在地。伴着一声令人胆寒的垂死低吼，它蜷缩着瘫倒，耀眼的红光开始在它周身聚集。<br><br>一阵令人目眩的闪动之后，凶魔消失了，躯体被送回了它来时的冥界 (Underworld)。<br><br>塔尔尼斯掸了掸袍子上并不存在的灰尘，试图掩饰刚才那场闹剧带来的尴尬。<br><br>他将导师的典籍翻到某一页，用手指划着文字扫读片刻，随后奔向水井，再次查看近侧井沿上的古老铭文。</body></html>
LevelAlchemist04.conversations.0.name=塔尔尼斯
LevelAlchemist04.conversations.0.text=啊！瞧我这糊涂劲儿，我，呃……好像漏了一步。
LevelAlchemist04.conversations.1.name=塔尔尼斯
LevelAlchemist04.conversations.1.text=<html><body>“未先行净化仪式，切莫献上祭品。”<br>（刻这些符文的人也真是的，字小得根本看不清……）</body></html>
LevelAlchemist04.conversations.2.name=塔尔尼斯
LevelAlchemist04.conversations.2.text=不管怎么说，我相信我们成功了！看，许愿井 (Well of Wishes) 给出了线索，你们看见井沿上那个发光的东西了吗？
LevelAlchemist04.conversations.3.name=塔尔尼斯
LevelAlchemist04.conversations.3.text=它似乎送了我们一块魔法封印的碎片，真有意思。让我拿这残缺的符号和笔记比对一下……
LevelAlchemist04.conversations.4.name=塔尔尼斯
LevelAlchemist04.conversations.4.text=导师的典籍里列出了接下来可能要去的几个地方，除了一个，其他全是致命的陷阱。
LevelAlchemist04.conversations.5.name=塔尔尼斯
LevelAlchemist04.conversations.5.text=现在，我们知道哪个地方安全了！
LevelAlchemist04.conversations.6.name=塔尔尼斯
LevelAlchemist04.conversations.6.text=如果我没理解错，附近有条老矿道，应该能通到那里的主厅。
LevelAlchemist05.text=<html><body>跋涉数小时后，队伍来到一座荒废矿井的入口，景象与塔尔尼斯的描述相符。<br><br>蛛网和碎石将入口堵得严严实实。英雄们费力清理一番，一条幽深漆黑、斜向地下的矿道显露出来。<br><br>不管下面的黑暗隧道里藏着什么，想必都已很久没有被人打扰过了。<br><br>塔尔尼斯侧耳倾听。矿井深处传来有节奏的滴水声，间或夹杂着微弱而不规则的闷响。</body></html>
LevelAlchemist05.selection-text=队伍要怎么做？
LevelAlchemist05.location.name=遗忘矿井 (Forgotten Mine)
LevelAlchemist05.triggers.on-select-1.text=我们可以以后再来。
LevelAlchemist05.triggers.on-select-1.description=返回世界地图。
LevelAlchemist05.triggers.on-select-2.text=进入矿井。
LevelAlchemist05.triggers.on-select-2.description=进入矿井。
LevelAlchemist05.triggers.on-select-3.text=继续探索矿井。
LevelAlchemist05.triggers.on-select-3.description=继续探索矿井。
LevelAlchemist05.triggers.on-select-4.text=返回巨龙雕像处。
LevelAlchemist05.triggers.on-select-4.description=返回巨龙雕像处。
LevelAlchemist07.text=<html><body>英雄们小心翼翼地走进矿道，开始向地下深入。<br><br>封住入口的那种厚重蛛网，每走十步就会再遇到一道。走在最前面的人只得不停挥砍开路，仿佛在茂密的丛林中穿行。<br><br>又一道蛛网被斩断后，队伍忽然停下脚步，一股强烈的危机感涌上心头。<br><br>突然，黑暗中响起一片杂乱的爬行声和嘶鸣，而且越来越响！</body></html>
LevelAlchemist07.conversations.0.name=巨型蜘蛛
LevelAlchemist07.conversations.0.text=嘶、嘶、嘶啊——！！
LevelAlchemist07.conversations.1.name=塔尔尼斯
LevelAlchemist07.conversations.1.text=小心！咱们刚才拆掉了那么多精美挂毯，我怀疑织出它们的工匠要来登门了。
LevelAlchemist08.conversations.0.name=塔尔尼斯
LevelAlchemist08.conversations.0.text=呃，什么东西长得异常巨大不好，偏偏是这种……
LevelAlchemist08.conversations.1.name=巨型蜘蛛
LevelAlchemist08.conversations.1.text=吱、吱、嘶——！！
LevelAlchemist08.conversations.2.name=塔尔尼斯
LevelAlchemist08.conversations.2.text=而眼前这个品种，恐怕还是我最不喜欢的那一种！
LevelAlchemist08.conversations.3.name=塔尔尼斯
LevelAlchemist08.conversations.3.text=小心这些黑色的家伙。它们咬人虽没有毒，可那么大的獠牙，轻易就能把人撕成碎片！
LevelAlchemist09.text=<html><body>摆脱了凶猛洞穴蜘蛛的威胁，英雄们继续向隧道深处前进。<br><br>随着队伍深入，头顶短小钟乳石上滴落的水声越来越密。前方的黑暗中，隐约传来了流水声。<br><br>岩壁上的蛛网渐渐少了，取而代之的是一片片霉斑和黏滑的附着物。<br><br>种种迹象表明，再往前走，地下的环境就要变样了。</body></html>
LevelAlchemist09.selection-text=队伍该怎么做？
LevelAlchemist09.triggers.on-select-1.text=继续探索。
LevelAlchemist09.triggers.on-select-1.description=继续探索。
LevelAlchemist09.triggers.on-select-2.text=离开矿井。
LevelAlchemist09.triggers.on-select-2.description=离开矿井。=BR=（之后可以再回来。）
LevelAlchemist10.text=<html><body>队伍沿着隧道继续前进，越来越深入矿井腹地。<br><br>狭窄的通道尽头豁然开朗，一座巨大的洞窟里藏着地下湖。湖面露出的几块大石头勉强连成一座桥，是通往对岸的唯一路径；一座长满青苔的小岛位于中途。<br><br>数道水流从穹顶般的洞壁各处喷涌而出，划出弧线，令地下湖的水不断流动。英雄们隐约看见，泛着泡沫的水面下有暗影游过。<br><br>塔尔尼斯大胆地踏上第一块石头，招手示意英雄们跟上。</body></html>
LevelAlchemist10.conversations.0.name=水元素
LevelAlchemist10.conversations.0.text=咕噜。咕噜。
LevelAlchemist10.conversations.1.name=塔尔尼斯
LevelAlchemist10.conversations.1.text=哎呀，那是什么声音？
LevelAlchemist10.conversations.2.name=水元素
LevelAlchemist10.conversations.2.text=咕噜！
LevelAlchemist10.conversations.3.name=塔尔尼斯
LevelAlchemist10.conversations.3.text=<html><body>这么深的地下也有元素生物？也许这阴冷潮湿的环境正合它们心意……<br>看着倒挺无害，你们说呢？</body></html>
LevelAlchemist11.conversations.0.name=水元素
LevelAlchemist11.conversations.0.text=<html><body>咕噜！<br>咕噜！</body></html>
LevelAlchemist11.conversations.1.name=塔尔尼斯
LevelAlchemist11.conversations.1.text=我说错了！真要说起来，它们比以往见过的还不合群。
LevelAlchemist11.conversations.2.name=塔尔尼斯
LevelAlchemist11.conversations.2.text=朋友们，现在可不是讲礼貌的时候。给这位水团先生上一课，教教它待客之道！
LevelAlchemist12.text=<html><body>元素生物化为了湿润的水汽，英雄们在炼金术士的带领下，平安抵达地下湖的另一岸。<br><br>洞窟的另一端有一条宽阔的隧道。塔尔尼斯停下来，刮去靴子上残留的元素物质，队伍在他身旁重新聚拢。<br><br>前方又是一道向下的斜坡，众人继续往地底深处走。越往下，四周就越干燥；没过多久，洞顶的滴水声便彻底消失了。<br><br>前方只剩一片死寂。</body></html>
LevelAlchemist12.selection-text=队伍该怎么做？
LevelAlchemist12.triggers.on-select-1.text=继续探索。
LevelAlchemist12.triggers.on-select-1.description=继续探索。
LevelAlchemist12.triggers.on-select-2.text=离开矿井。
LevelAlchemist12.triggers.on-select-2.description=离开矿井。=BR=（之后可以再回来。）
LevelAlchemist13.text=<html><body>矿道凹凸不平、满是霉斑的石壁渐渐变得规整起来。不久，青苔覆盖的砖墙和卵石路面取代了天然岩壁，英雄们发现自己已走进一座深埋地下的古老城堡。<br><br>塔尔尼斯兴奋地脱离队伍，冲进前方的主厅。没过一会儿，他就回头大喊，让英雄们过来帮忙查看。<br><br>众人跟上前，看见塔尔尼斯双手叉腰，得意地站在一扇巨大而华丽的双开门前。一根倒塌的大理石柱挡住了门。<br><br>队伍搬开碎石，塔尔尼斯使出全身力气拉住门把手，终于扯开一道勉强能让英雄们挤进去的缝隙。</body></html>
LevelAlchemist13.conversations.0.name=塔尔尼斯
LevelAlchemist13.conversations.0.text=就是这里，一定是这里！永生的秘密，就藏在这些墙壁之内……
LevelAlchemist13.conversations.1.name=塔尔尼斯
LevelAlchemist13.conversations.1.text=准备好，朋友们！从这一刻起，我们对生命的认知可能会永远改变。对了，谁还有根没用过的火把？
LevelAlchemist13.conversations.2.name=玛尔斯
LevelAlchemist13.conversations.2.text=啊，我就说听到了敲门声！欢迎，凡人。欢迎……来送死！
LevelAlchemist13.conversations.3.name=塔尔尼斯
LevelAlchemist13.conversations.3.text=<html><body>糟了，糟了，糟了！亡灵之王本人，居然就在这地下堡垒里！<br>我早该想到的！</body></html>
LevelAlchemist13.conversations.4.name=玛尔斯
LevelAlchemist13.conversations.4.text=<html><body>我等了几百年，终于又有一批客人登门，而且没让我失望！<br>站在最前面的那个，我已经想好该怎么处置你了……</body></html>
LevelAlchemist13.conversations.5.name=塔尔尼斯
LevelAlchemist13.conversations.5.text=啊，收回我刚才的话。虚惊一场——那不是什么亡灵之王，只是个拙劣的冒牌货。
LevelAlchemist13.conversations.6.name=玛尔斯
LevelAlchemist13.conversations.6.text=<html><body>拙劣的冒牌货？！就冲这句话，你那空洞的尸壳将永远为我效命！<br>准备好去死，再以你能想象的最凄惨的模样复生吧！</body></html>
LevelAlchemist15.text=<html><body>盘踞此地的巫妖化为尘埃后，大厅陷入一种异样的宁静。英雄们稍作整顿，望向前方。<br><br>大厅中央立着一尊巨大的黑龙雕像，身躯摆出战斗的姿态。那双眼睛透出令人不安的逼人气势，仿佛这死物随时都会扑来。<br><br>雕像细致逼真得近乎诡异，就像一具制作精良的动物标本。英雄们始终觉得，它正在等待着什么。<br><br>塔尔尼斯急切地翻阅导师的典籍，一边搜寻字句，一边低声嘟囔。苦读片刻却毫无收获，他只好放下书，耸耸肩，叹了口气。<br><br>这本书一路指引他们来到这里，可这间大厅的秘密，似乎恰好没有记载。</body></html>
LevelAlchemist15.selection-text=队伍要怎么做？
LevelAlchemist15.triggers.on-select-1.text=离开矿井。
LevelAlchemist15.triggers.on-select-1.description=返回世界地图。=BR=（之后可以再回来。）
LevelAlchemist15.triggers.on-select-2.text=开始活化仪式！
LevelAlchemist15.triggers.on-select-2.description=用巨龙雕像的完整封印启动活化仪式！
LevelAlchemist15.triggers.on-select-3.text=检查巨龙雕像的眼睛。
LevelAlchemist15.triggers.on-select-4.text=检查巨龙雕像的底座。
LevelAlchemist15.triggers.on-select-5.text=检查巨龙雕像的底座。
LevelAlchemist15.triggers.on-select-6.text=检查巨龙雕像的双翼。
LevelAlchemist15.triggers.on-select-7.text=调试：给予物品
LevelAlchemist16.text=<html><body>塔尔尼斯兴奋地叫了一声，从雕像后面探出身来，招呼队伍过来看看他的发现。<br><br>他指着雕像底座上凿出的圆形凹槽，随后从袍袋里掏出拼好的封印，跪下来，小心地将它放入槽中。<br><br>咔嗒一声，这件重新拼合的古物严丝合缝地嵌了进去。他用手指沿封印边缘划了一圈，刚收回手，地面便传来深沉的隆隆声。<br><br>巨龙雕像剧烈震颤片刻，一切又归于平静。<br><br>塔尔尼斯回头，自信地朝英雄们点点头，又将注意力转回雕像。他无声地念着晦涩的咒文，为即将开始的仪式作准备。</body></html>
LevelAlchemist16b.triggers.on-select-1.text=阻止这邪恶的仪式，救下塔尔尼斯！
LevelAlchemist16b.triggers.on-select-2.text=不插手。塔尔尼斯会被吞噬！
LevelAlchemist17.text=<html><body>塔尔尼斯在巨龙雕像前痛苦地哀嚎。一股无形的力量将他拉向已经活过来的巨兽。黑龙展开双翼，饥渴地张开大口，露出一排排骇人的利齿。<br><br>英雄们急忙上前营救，众人合力抵住雕像底座，齐心协力地推了起来。<br><br>黑龙惊愕地低头看着他们，难以置信地发现自己竟被推后了好几英尺。底座重重撞上后墙，将封印震了出来。<br><br>束缚塔尔尼斯的魔力随之消散，黑龙重新变回死物。他双膝一软跪倒在地，抱着头，大口喘息。</body></html>
LevelAlchemist17.conversations.0.name=塔尔尼斯
LevelAlchemist17.conversations.0.text=朋友们！太感谢你们了，那可怕的怪物差点把我活吞了。我欠你们一条命！
LevelAlchemist17.conversations.1.name=塔尔尼斯
LevelAlchemist17.conversations.1.text=这鬼地方果然是个陷阱。难道许愿井 (Well of Wishes) 真是故意让我们白忙一场？
LevelAlchemist17.conversations.2.name=塔尔尼斯
LevelAlchemist17.conversations.2.text=看来有些秘密就该深埋地下，永远别被发现。咱们离开这座被遗弃的堡垒吧。
LevelAlchemist17.conversations.3.name=塔尔尼斯
LevelAlchemist17.conversations.3.text=朋友们，这趟冒险让我学到了很多。如果你们允许，我很乐意加入你们，为共同的目标出力！
LevelAlchemist17.conversations.4.name=提示
LevelAlchemist17.conversations.4.text=<html><body>你已完成《Age of Fear》的“永生之旅”扩展剧情！<br>恭喜！</body></html>
LevelAlchemist17.conversations.5.name=提示
LevelAlchemist17.conversations.5.text=塔尔尼斯心怀感激，加入了你的队伍。他的药剂与调合物将在今后的战斗中大有帮助！
LevelAlchemist18.text=<html><body>塔尔尼斯在巨龙雕像前痛苦地哀嚎。一股无形的力量将他拉向已经活过来的巨兽。黑龙展开双翼，饥渴地张开大口，露出一排排骇人的利齿。<br><br>那股无形之力将炼金术士托到半空，黑龙一爪攥住了他。<br><br>黑龙张开巨口，将塔尔尼斯的头凑到齿间，准备一口咬下。灼热的吐息烫得炼金术士脸颊起泡，他发出惊恐至极的尖叫。<br><br>黑龙的双翼轻轻一振，致命的獠牙随即咬进塔尔尼斯的脖颈。它紧咬不放，猛地扭动巨颚，将炼金术士的头从肩上撕下，鲜血与碎肉四散飞溅。<br><br>队伍眼睁睁地看着塔尔尼斯毫无生气的躯体被一口口吞食，直到最后一块血肉也落入龙腹。</body></html>
LevelAlchemist18.conversations.0.name=提示
LevelAlchemist18.conversations.0.text=可怜的炼金术士塔尔尼斯成了这场古老仪式的祭品。巨龙雕像将他吞下后，又恢复了一动不动的模样。
LevelAlchemist18.conversations.1.name=提示
LevelAlchemist18.conversations.1.text=血淋淋的残骸中出现了一尊小雕像。队伍离开大厅前，一名英雄拾起了这件神秘的古物。
LevelAlchemist18.conversations.2.name=提示
LevelAlchemist18.conversations.2.text=经过一番研究，人们发现这尊雕像是一件强大的宝物，能让英雄化身为强悍的黑龙！
LevelAlchemist18.conversations.3.name=提示
LevelAlchemist18.conversations.3.text=可问题依然存在——为此赔上塔尔尼斯的性命，值得吗？
LevelAlchemist18.conversations.4.name=提示
LevelAlchemist18.conversations.4.text=<html><body>你已完成《Age of Fear》的“永生之旅”扩展剧情！<br>恭喜！</body></html>
LevelAlchemist20.text=<html><body>在塔尔尼斯的带领下，冒险者们来到典籍记载的海边。几座陡峭的岩峰直刺渐暗的天空，塔尔尼斯指向了其中一座。<br><br>从山脚抬头一看就知道，要爬到顶可不轻松。一番艰难的攀爬过后，队伍总算登上一处宽阔平坦的岩台，所幸只添了些擦伤。<br><br>塔尔尼斯喘得厉害，几乎站立不稳。可一看见前方窄桥尽头那团蓝色的魔法漩涡，他脸上立刻绽开了灿烂的笑容。<br><br>传送门在暮色中熠熠生辉，海鸥在头顶翱翔，浪花轻轻拍打着下方的岩岸。谁也不知道这道魔法之门通向何处，但眼前的壮丽景象仿佛预示着非凡的机遇。英雄们要走进去吗？</body></html>
LevelAlchemist20.selection-text=队伍要进入传送门吗？
LevelAlchemist20.location.name=海上传送门 (Sea Portal)
LevelAlchemist20.triggers.on-select-1.text=我们还没准备好。
LevelAlchemist20.triggers.on-select-1.description=返回世界地图。
LevelAlchemist20.triggers.on-select-2.text=进入传送门。
LevelAlchemist20.triggers.on-select-2.description=进入传送门。
LevelAlchemist21.text=<html><body>队伍沿着长桥排成一列，依次走入传送门荡漾的斑斓光幕。每有一人穿过，就迸出一片绚丽的光芒。<br><br>转眼之间，英雄们被传送到一座陌生而宽阔的洞窟。空气与传送门附近一样，带着浓浓的咸腥味，但这里不知位于何处，与外界完全隔绝。<br><br>满地鱼骨，足有一整群鱼那么多；洞壁四周还散落着更大型哺乳动物的骸骨。这里一定住着某个巨大而贪食的生物，而且它似乎很不挑食……<br><br>洞窟另一端的阴影里传来令人不安的咔哒声，引起了队伍的注意。<br><br>怪物现身了，体型大得惊人！厚重的甲壳、嘶鸣的口器，还有足以轻易将战士夹成两截的巨钳！这恐怖之物究竟是从哪片无人探知的深海里爬上来的？</body></html>
LevelAlchemist22.conversations.0.name=蟹神
LevelAlchemist22.conversations.0.text=（窸窣爬动）
LevelAlchemist22.conversations.1.name=塔尔尼斯
LevelAlchemist22.conversations.1.text=<html><body>嗯？什么声音？<br>诸神在上，看看那东西有多大！</body></html>
LevelAlchemist22.conversations.2.name=塔尔尼斯
LevelAlchemist22.conversations.2.text=导师的典籍里，压根没提过这里还有海怪守卫！
LevelAlchemist22.conversations.3.name=蟹神
LevelAlchemist22.conversations.3.text=咔锵！咔锵！
LevelAlchemist22.conversations.4.name=塔尔尼斯
LevelAlchemist22.conversations.4.text=该死的懒学者，漏掉这么大一个细节，够把他们逐出学界了！
LevelAlchemist22.conversations.5.name=蟹神
LevelAlchemist22.conversations.5.text=嘶——！！
LevelAlchemist22.conversations.6.name=塔尔尼斯
LevelAlchemist22.conversations.6.text=<html><body>糟了，它发现我们了！<br>都小心点，那对巨钳可不是摆设！</body></html>
LevelAlchemist23.text=<html><body>致命的一击让蟹神痛苦地蜷缩起来。它坚硬的腹甲上裂开一道骇人的长口，体液与斑斓的内脏倾泻而出，刺鼻的恶臭瞬间充斥了咸腥的空气。<br><br>最后一阵剧烈抽搐后，那对能将人碾碎的巨钳终于不再动弹，灼亮的双眼也暗了下去，失去了生机。<br><br>惨烈的战斗结束，队伍将目光转向洞窟远处的一角。种种迹象都表明，这头刚被杀死的怪物一直在守护着什么。<br><br>一束阳光从洞顶的裂隙照下，一口落满灰尘、上着锁的宝箱静静地躺在光中，周围环绕着碎骨。<br><br>塔尔尼斯低喝一声，用法杖尾端砸向锈锁。箱盖应声弹开，露出各色闪亮的财宝与珍贵的宝物。英雄们迅速收起苦战赢来的战利品，返回闪烁的传送门。</body></html>
LevelAlchemistDefeat.text=<html><body>英雄们接连倒下，直到再无一人站立。塔尔尼斯仰面躺着，艰难地喘息，鲜血不断流失。脸上的血色渐渐褪去，他笨拙地伸手抓向上方的空气，仿佛一件能赐予永生的宝物正悬在那里，却始终差一点够到。<br><br>这场曾经满怀希望的冒险，就此戛然而止。一切变得黑暗而冰冷，希望已然断绝。<br><br>看来，探寻永生秘密的使命，只能留给另一群英雄去完成了……</body></html>
