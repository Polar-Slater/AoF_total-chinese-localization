title=死灵法师的崛起
description=<html><body>第一章<br>这是一个死灵法师学徒的故事。<br>克里尔将穿越遥远的土地，<br>最终直面自己的命运。</body></html>
Level00.conversations.0.name=克里尔
Level00.conversations.0.text=别来烦我！

# Opening story batch: Level00 through Level03a.
Level00b.conversations.1.name=克里尔
Level00b.conversations.1.text=<html><body>不……不……<br>放过我！</body></html>
Level00b.conversations.2.name=克里尔
Level00b.conversations.2.text=我……
Level00b.conversations.3.name=克里尔
Level00b.conversations.3.text=<html><body>啊，原来又是幻象。头疼得厉害。<br>这几天，我已经看见过好几次幻象了。<br>难道是——？</body></html>
Level00b.conversations.4.name=克里尔
Level00b.conversations.4.text=<html><body>……<br>算了。</body></html>
Level00b.conversations.5.name=克里尔
Level00b.conversations.5.text=<html><body>那老头已经开始起疑了。<br>我必须今天动手。</body></html>
Level01a.text=<html><body>死灵法师的尸体躺在泥泞的地上，面容因临死前的痛苦而扭曲，狰狞可怖。他虽已年迈，却依然掌握着强大的力量。<br><br>克里尔低估了昔日师父的顽强。或许是长期接触黑暗魔法，让老人的身体也变得更加强韧。那死灵法师的力量强得可怕，身体却冰冷，冷得像个亡灵。<br><br>克里尔从沼泽女巫那里买来的毒药，终于让师父倒了下去，尽管他一度以为药力还不够。看着昔日的导师在痛苦中扭动，喘着粗气，吊着最后一口气不肯咽下，他曾咒骂那女巫卖给自己劣质毒药。幸好毒药最终奏效了，也省得他再去找那老巫婆算账。<br><br>“老蠢货终于断气了。现在，该上路了。”克里尔心想。他狠狠地踢着老人的尸体，直到它滚进恶臭的沼泽水中。<br><br>克里尔非杀师父不可。那人毫无野心。事实上，除了学识和黑暗魔法，他身上再没有任何有价值的东西。克里尔已经学会了他能教的一切，不再需要他了。克里尔需要的是力量，无穷的力量。<br><br>他松了松紧握匕首的手——若毒药没有奏效，这把刀随时可以派上用场。随后，他快步赶往暗影沼泽 (Shadowmarsh) 深处，师父曾经居住的小屋。<br><br>他把小屋翻了个遍，却没找到任何值得带走的东西。那老头连一点金币都没有。<br><br>克里尔收拾了些食物，便朝他所知道的最近的聚落——雾磨镇 (Mistmill) 走去。</body></html>
Level01a.selection-text=要跳过序章吗？
Level01a.conversations.0.name=提示
Level01a.conversations.0.text=<html><body>欢迎来到《Age of Fear：死灵法师的崛起》战役！<br>接下来的几个关卡将介绍基本玩法，并拉开故事的序幕。</body></html>
Level01a.triggers.on-select-1.text=游玩序章（30–60分钟）
Level01a.triggers.on-select-1.description=开始故事，学习基本玩法。
Level01a.triggers.on-select-2.text=跳过序章
Level01a.triggers.on-select-2.description=直接进入正式冒险。
Level01b.text=<html><body>克里尔胸有成竹地穿行在沼泽中，赶路十分顺利，却被一小群沼泽地精发现了。地精正朝他逼近，而它们对沼泽的熟悉程度远非克里尔可比，他根本无路可逃。<br><br>地精很快追上了克里尔。离他最近的那只开口道：“沼泽里，消息传得快，小子。我们等着你呢。”<br><br>“你想干什么，地精？”<br><br>“你杀了老头。那是你的事。可东西归我。”<br><br>“你什么也得不到。趁现在还能跑，赶紧滚！”<br><br>“不，我杀了你！”地精吼道，带着同伙步步逼近……</body></html>
Level01b.location.name=亡师 (Dead Master)
Level02.conversations.0.name=地精
Level02.conversations.0.text=老师父死了。东西给我。
Level02.conversations.1.name=克里尔
Level02.conversations.1.text=<html><body>滚开，臭地精！<br>你什么也得不到。</body></html>
Level02.conversations.2.name=地精
Level02.conversations.2.text=那你就去死！
Level02.conversations.3.name=提示
Level02.conversations.3.text=你的英雄克里尔能将新鲜尸体唤起为骷髅。对附近的尸体施放“唤起亡者”，击退那些烦人的地精！
Level02.triggers.on-battle-task-1.text=亡者之书：唤起三具骷髅
Level02.triggers.on-battle-task-2.text=魔力恢复剂：打开宝箱
Level03a.text=<html><body>这些可怜的家伙毫无胜算。它们以为克里尔不过是又一个过路人。可克里尔并非凡夫俗子——他是一名死灵法师。<br><br>最后一只地精试图逃离克里尔的黑暗魔法，却被他随手一挥，抽走了灵魂。那具绿皮躯壳失去生机，瘫倒在地。<br><br>虽然轻易击败了这群绿皮，克里尔却知道，下一批敌人可能更加危险。他从师父那里学到了不少本事，也知道该如何应对。他需要一支听命于自己的队伍。<br><br>暗影沼泽 (Shadowmarshes) 遍地死亡。许多村民和贵族走进沼泽后便杳无音信。他们不是溺水而亡，就是死在游荡于此的地精手中。<br><br>克里尔知道该去哪里寻找尸体。师父教过他如何找到死者，再将其唤起为亡灵仆从。一个小时后，他找到了几具溺水者的遗骸。他开始施展仪式，组建自己的亡灵队伍。</body></html>

# Bone River / Mistmill batch: Level05, Level06 and Level07.
Level05.text=<html><body>克里尔想不通，人类为何要住在暗影沼泽 (Shadowmarshes)。可雾磨镇 (Mistmill) 偏偏就是一座深藏在沼泽中的人类聚落。那里的人一年到头既要抵御地精的袭击，又要忍受恶劣得难以生存的环境。<br><br>雾磨镇 (Mistmill) 建在骨河 (Bone River) 附近，几座桥横跨浑浊的河水。要进城，就只能从这些桥上经过；而穿过雾磨镇 (Mistmill)，又是离开暗影沼泽 (Shadowmarshes) 最快的路。<br><br>克里尔知道，自己的亡灵队伍绝不可能获准入城。不过，他的力量还在不断增长，要再找一批仆从并不难。他打算走近其中一座桥，蒙混进城。黄昏时，他先将手下藏在暗处，以备不时之需。<br><br>克里尔刚一走近，一名守桥卫兵便朝他喊道：“站住！你是什么人？”<br><br>“向各位尊贵的卫兵问好！我只是个四处行商的小商人。”<br><br>“就站在那儿别动！一个商人为什么独自穿过这片该死的沼泽？你的仆人呢？”<br><br>“我的货车陷进了路上的泥坑，他们就丢下我走了。不过请相信我，我在雾磨镇 (Mistmill) 有朋友，他们一定很乐意帮忙。”<br><br>“我没见过你。你卖什么？”<br><br>“香料和衣服，长官。”<br><br>“哼，你浑身都是沼泽的臭味，还说自己有过一车衣服和香料？我看你在撒谎。”<br><br>“不敢，尊贵的卫兵。我说的句句属实。”<br><br>“那就得让你的朋友来证实了。卫兵，拿下他。”</body></html>
Level05.location.name=骨河 (Bone River)
Level06.conversations.0.name=步兵
Level06.conversations.0.text=站着别动，我们就不会伤害你。
Level06.conversations.1.name=克里尔
Level06.conversations.1.text=可我只是个不起眼的香料商人……
Level06.conversations.2.name=步兵
Level06.conversations.2.text=没错，我奶奶还是艾泽拉斯 (Azeroth) 的女王呢。
Level06.conversations.3.name=弓箭手
Level06.conversations.3.text=哦，你怎么从没说过！
Level06.conversations.4.name=克里尔
Level06.conversations.4.text=<html><body>……不，是贩卖死亡的商人！我要杀光你们！<br>哈哈哈！</body></html>
Level06.triggers.on-battle-task-1.text=魔法戒指：在第十回合结束前赢得战斗
Level07.text=<html><body>克里尔的亡灵从暗处涌出，迅速屠杀了守桥的卫兵。剩下的几个人苦苦求饶，可克里尔心中既没有怜悯，也没有宽恕。<br><br>雾磨镇 (Mistmill) 响起了战斗的号角，援军正在赶来。克里尔能听见士兵从桥的另一端逼近。<br><br>克里尔知道，自己无法与整座城为敌。他别无选择，只得退回沼泽。<br><br>他刚躲进树林，王国的军队便赶到了桥头。士兵们循着血迹和战斗留下的痕迹，散入沼泽搜寻。<br><br>凭着对沼泽的熟悉，克里尔熬过了接下来的几个小时。士兵四处搜查，可不知是命运使然，还是纯粹的侥幸，他们始终没能找到这名死灵法师的藏身之处。<br><br>克里尔一直等到黎明，才逃到安全的地方。他明白，如今已不可能穿过雾磨镇 (Mistmill)，必须另作打算了……</body></html>

# Haunted Church batch: Level11b and Level13; Level12 has no resource text.
Level11b.location.name=闹鬼教堂 (Haunted Church)
Level11b.conversations.0.name=克里尔
Level11b.conversations.0.text=这座教堂废墟……真有意思。
Level11b.conversations.1.name=克里尔
Level11b.conversations.1.text=不知道这里曾发生过什么。圣教会应该不会无缘无故就放弃自己的据点……
Level11b.conversations.2.name=克里尔
Level11b.conversations.2.text=……不过，那一定是很久以前的事了。如今，这里只能感受到幽灵的气息。
Level13.conversations.0.name=诺娅
Level13.conversations.0.text=我一直在等您，主人。
Level13.conversations.1.name=克里尔
Level13.conversations.1.text=谁……？你是谁？
Level13.conversations.2.name=诺娅
Level13.conversations.2.text=我……我……我想不起来了。
Level13.conversations.3.name=克里尔
Level13.conversations.3.text=你想从我这里得到什么，该死的幽灵？
Level13.conversations.4.name=诺娅
Level13.conversations.4.text=<html><body>为您效劳，主人！<br>加入您的队伍，追随您的脚步……</body></html>
Level13.conversations.5.name=克里尔
Level13.conversations.5.text=你似乎没有腿。
Level13.conversations.6.name=诺娅
Level13.conversations.6.text=……
Level13.conversations.7.name=克里尔
Level13.conversations.7.text=<html><body>那就加入我吧，幽灵。<br>跟着我，走向你的毁灭。</body></html>
Level13.conversations.8.name=提示
Level13.conversations.8.text=你的第二位英雄诺娅加入了队伍。诺娅是一名施法者，承受不了几次攻击。务必让她待在近战单位后方！
Level13.triggers.on-battle-task-1.text=混沌护符：在第十二回合结束前消灭所有报丧女妖
Level13.triggers.on-battle-task-2.text=寒霜胸针：在第二十回合结束前赢得战斗

# Night Assault batch: Level09, Level10 and Level11.
Level09.text=<html><body>接下来的几天，克里尔一直在沼泽中游荡。<br><br>他前往人类王国领地的计划失败了。雾磨镇 (Mistmill) 的卫兵此刻想必已严阵以待，加固了各个入口的哨所。穿城而过已经不可能了。<br><br>每到夜里，克里尔都会梦见力量与杀戮。他梦见自己统率着一支强大的大军，王国的军队在他骇人的力量面前纷纷倒下。他说不清缘由，却隐隐觉得，自己的未来就在北方。<br><br>沼泽中的日子艰难困苦，但克里尔总能找到食物和栖身之所。身边的亡灵替他挡住了沼泽中的大多数生物，可暗处仍潜伏着许多嗜血的敌人。<br><br>沼泽里时常传来古怪的声响，所以最初听见树枝断裂时，克里尔并没有放在心上。然而此刻，远处已隐约传来话语声，而且正迅速逼近他的营地。<br><br>克里尔刚来得及召集仆从，将自己围在中央，绿皮便从夜色中现身，从四面八方围了上来！</body></html>
Level09.location.name=夜袭 (Night Assault)
Level10.conversations.0.name=克里尔
Level10.conversations.0.text=又来了一群绿皮？很好，我正好用它们的臭尸体扩充军队。
Level10.conversations.1.name=兽人
Level10.conversations.1.text=老头，我要吃掉你的耳朵！
Level10.conversations.2.name=地精
Level10.conversations.2.text=对！对！眼珠子归我！
Level10.conversations.3.name=兽人
Level10.conversations.3.text=<html><body>闭嘴！<br>吵死了，臭地精。欠揍。</body></html>
Level10.conversations.4.name=地精
Level10.conversations.4.text=哎哟！对不起，对不起！
Level10.conversations.5.name=克里尔
Level10.conversations.5.text=得赶紧杀了它们，免得它们先自相残杀，让我连点乐子都捞不着。
Level10.triggers.on-battle-task-1.text=沼泽钉锤：在第十回合结束前消灭所有地精
Level10.triggers.on-battle-task-2.text=200金币：在第十六回合结束前赢得战斗
Level10.triggers.on-battle-task-3.text=学者戒指：找到隐藏的宝箱
Level11.text=<html><body>这场夜袭几乎刚开始便结束了。<br><br>克里尔的仆从拥有邪异的耐力，令绿皮们困惑不已。它们惊恐地发现，自己的攻击根本无法摧毁这些亡灵。无论怎样劈砍捶打，都无法给它们留下持久的伤害。每次有僵尸倒下，片刻后便又爬了起来。地精和兽人终于承受不住，纷纷逃窜。许多还没跑出多远，就被克里尔的法术截住，没能逃到安全之处。<br><br>克里尔虽然赢了，却也明白，自己需要一支更庞大的军队。仅凭这支小队，绝不可能获得他渴求的力量。<br><br>战斗过后几天，克里尔的亡灵抓住了一名地精猎人。那地精浑身发抖，因为它知道克里尔是谁，也知道他有多可怕。<br><br>克里尔喉间发出低沉的声音，拖长语调轻声说道：“告诉我点有用的东西，我就放你走。否则，我会让亡灵在你还活着的时候，开始啃食你的内脏。”<br><br>“教堂。那座老教堂，离这儿不远，但不在路边。不好找，可里面全是幽灵。好多幽灵。放我走……”<br><br>克里尔一把掐住地精的喉咙，截断了它的哀求。他猛一用力，便捏碎了它的喉咙，结束了它的性命。<br><br>几个小时后，克里尔找到了那座教堂。它偏离小路，藏在大片灌木丛后。他知道，凭借从旧日师父那里学来的知识，自己能够控制那些幽灵。<br><br>教堂废墟笼罩着一股气息，仿佛随着其中幽灵的力量一同脉动。即将到手的力量，克里尔几乎已能尝到它的滋味。</body></html>

# Kingdom Patrol batch: Level15, Level16, Level17 and the immediate defeat-route continuation.
Level15.text=<html><body>兵力得到补充后，克里尔继续向北，追寻梦中那股力量的指引。不久，脚下恶臭的烂泥渐渐变成了坚实的土地。他终于走出了暗影沼泽 (Shadowmarshes)。<br><br>又走了一天，队伍来到人类王国的一条大路上。克里尔精神振奋，满怀期待地继续前行，却不知道王国的巡逻队早已大举出动，四处搜捕他。<br><br>突然，克里尔一行撞上了其中一支巡逻队。他已经被发现，根本来不及躲藏或逃走。巡逻队迅速列阵，挡住了他北上的道路。<br><br>一名骑士上前，朝克里尔喊道：“看来，那个肮脏的死灵法师终于从该死的暗影沼泽 (Shadowmarshes) 里爬出来了。我们知道你是谁，也知道是你在雾磨镇 (Mistmill) 屠杀了我们的士兵！”<br><br>“那些蠢货是自找的。骑士，我也很乐意让你和你的手下落得同样的下场。”<br><br>“哈，亡灵的走狗还敢狂吠！你和你唤起的那些怪物没有两样。我们会消灭你！”<br><br>“那就试试看吧，愚蠢的骑士！你的灵魂将归我所有！”</body></html>
Level15.location.name=王国巡逻队 (Kingdom Patrol)
Level16.conversations.0.name=骑士
Level16.conversations.0.text=准备战斗！让这死灵法师尝尝我们的剑！
Level16.conversations.1.name=诺娅
Level16.conversations.1.text=那就先从我的尸体上踏过去！
Level16.conversations.2.name=克里尔
Level16.conversations.2.text=你根本没有身体，幽灵。
Level16.conversations.3.name=诺娅
Level16.conversations.3.text=我会保护您的，主人。
Level16.conversations.4.name=克里尔
Level16.conversations.4.text=好吧。你只管待在我的仆从后面。
Level16.triggers.on-battle-task-1.text=灵魂之铃：在第十二回合结束前消灭所有士兵
Level17.text=<html><body>战斗十分艰苦，士兵们也英勇奋战。但在蜂拥而至的亡灵压倒性的力量面前，他们仍一个接一个地倒下。<br><br>一名骑士坚持了出人意料的长时间，但最终也抵挡不住克里尔仆从接连不断的猛攻。<br><br>战斗结束后，克里尔命令手下将死者的尸体堆在一起，开始施展唤起亡者的仪式。仪式刚一开始，他便注意到尸堆中有一名僧侣还活着。<br><br>“祭司，你还没死？”<br><br>“现在就投降吧，我的兄弟！圣教会或许还会宽恕你——他们是仁慈的。”<br><br>“我领教过你们的仁慈。正是因为你们的圣教会，我才不得不住进那片沼泽。我憎恨它！”<br><br>“神知道我们都会犯错，但你若不悔改，祂就会毁灭你的灵魂！”<br><br>“这我也知道，所以我才想留在这个世界上。”<br><br>说罢，克里尔将匕首刺入祭司的心脏，继续完成仪式。新唤起的士兵再次壮大了他的队伍。<br><br>克里尔意识到，自己不能再沿着这条路走下去了。“这一路上，还会有更多像这些骑士一样的蛆虫。”他暗自思忖，“我必须完成我的使命。我要穿过兽人丘陵 (Orcs' Hills)。在那里，我才能迎来自己的命运！”</body></html>
LevelSecret01b.text=<html><body>克里尔勉强挡开了最初的几次攻击，但很快便招架不住，再也无力抵抗。他的亡灵很快就被王国士兵尽数消灭。他最后记得的，是一道剑光，以及胸口传来的剧痛。随后，一切归于寂静。<br><br>士兵们草草处理了克里尔的尸体。他们将亡灵的尸骸堆起来焚烧，却没有把克里尔扔进火里，而是用破布裹住这名死灵法师的尸体，丢进了附近的废墟。<br><br>克里尔死了，灵魂却始终没有离开人世。几周后，他化作一只致命的尸妖，再次站了起来。他的神志尚未完全消散，因为仇恨与痛苦将他永远束缚于此。<br><br>他知道自己失败了，再也无法成为真正的亡灵之主，但他从来就没有真正的选择。克里尔只能追随自己的命运，走向那苦涩的终点。<br><br>他召集了几个亡灵仆从，每夜在森林中寻觅温热的鲜血。一天夜里，他发现了一堆营火……</body></html>
