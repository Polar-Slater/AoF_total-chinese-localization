title=死灵法师的崛起
description=<html><body>第一章<br>这是一个死灵法师学徒的故事。<br>克里尔将穿越遥远的土地，<br>最终直面自己的命运。</body></html>
Level00.conversations.0.name=克里尔
Level00.conversations.0.text=别来烦我！

# Opening story batch: Level00 through Level03a.
Level00b.conversations.1.name=克里尔
Level00b.conversations.1.text=<html><body>不……不……<br>放过我！</body></html>
Level00b.conversations.2.name=克里尔
Level00b.conversations.2.text=我……
Level00b.conversations.3.name=克里尔
Level00b.conversations.3.text=<html><body>啊，原来又是幻象。头疼得厉害。<br>这几天，我已经看见过好几次幻象了。<br>难道是——？</body></html>
Level00b.conversations.4.name=克里尔
Level00b.conversations.4.text=<html><body>……<br>算了。</body></html>
Level00b.conversations.5.name=克里尔
Level00b.conversations.5.text=<html><body>那老头已经开始起疑了。<br>我必须今天动手。</body></html>
Level01a.text=<html><body>死灵法师的尸体躺在泥泞的地上，面容因临死前的痛苦而扭曲，狰狞可怖。他虽已年迈，却依然掌握着强大的力量。<br><br>克里尔低估了昔日师父的顽强。或许是长期接触黑暗魔法，让老人的身体也变得更加强韧。那死灵法师的力量强得可怕，身体却冰冷，冷得像个亡灵。<br><br>克里尔从沼泽女巫那里买来的毒药，终于让师父倒了下去，尽管他一度以为药力还不够。看着昔日的导师在痛苦中扭动，喘着粗气，吊着最后一口气不肯咽下，他曾咒骂那女巫卖给自己劣质毒药。幸好毒药最终奏效了，也省得他再去找那老巫婆算账。<br><br>“老蠢货终于断气了。现在，该上路了。”克里尔心想。他狠狠地踢着老人的尸体，直到它滚进恶臭的沼泽水中。<br><br>克里尔非杀师父不可。那人毫无野心。事实上，除了学识和黑暗魔法，他身上再没有任何有价值的东西。克里尔已经学会了他能教的一切，不再需要他了。克里尔需要的是力量，无穷的力量。<br><br>他松了松紧握匕首的手——若毒药没有奏效，这把刀随时可以派上用场。随后，他快步赶往暗影沼泽 (Shadowmarsh) 深处，师父曾经居住的小屋。<br><br>他把小屋翻了个遍，却没找到任何值得带走的东西。那老头连一点金币都没有。<br><br>克里尔收拾了些食物，便朝他所知道的最近的聚落——雾磨镇 (Mistmill) 走去。</body></html>
Level01a.selection-text=要跳过序章吗？
Level01a.conversations.0.name=提示
Level01a.conversations.0.text=<html><body>欢迎来到《Age of Fear：死灵法师的崛起》战役！<br>接下来的几个关卡将介绍基本玩法，并拉开故事的序幕。</body></html>
Level01a.triggers.on-select-1.text=游玩序章（30–60分钟）
Level01a.triggers.on-select-1.description=开始故事，学习基本玩法。
Level01a.triggers.on-select-2.text=跳过序章
Level01a.triggers.on-select-2.description=直接进入正式冒险。
Level01b.text=<html><body>克里尔胸有成竹地穿行在沼泽中，赶路十分顺利，却被一小群沼泽地精发现了。地精正朝他逼近，而它们对沼泽的熟悉程度远非克里尔可比，他根本无路可逃。<br><br>地精很快追上了克里尔。离他最近的那只开口道：“沼泽里，消息传得快，小子。我们等着你呢。”<br><br>“你想干什么，地精？”<br><br>“你杀了老头。那是你的事。可东西归我。”<br><br>“你什么也得不到。趁现在还能跑，赶紧滚！”<br><br>“不，我杀了你！”地精吼道，带着同伙步步逼近……</body></html>
Level01b.location.name=亡师 (Dead Master)
Level02.conversations.0.name=地精
Level02.conversations.0.text=老师父死了。东西给我。
Level02.conversations.1.name=克里尔
Level02.conversations.1.text=<html><body>滚开，臭地精！<br>你什么也得不到。</body></html>
Level02.conversations.2.name=地精
Level02.conversations.2.text=那你就去死！
Level02.conversations.3.name=提示
Level02.conversations.3.text=你的英雄克里尔能将新鲜尸体唤起为骷髅。对附近的尸体施放“唤起亡者”，击退那些烦人的地精！
Level02.triggers.on-battle-task-1.text=亡者之书：唤起三具骷髅
Level02.triggers.on-battle-task-2.text=魔力恢复剂：打开宝箱
Level03a.text=<html><body>这些可怜的家伙毫无胜算。它们以为克里尔不过是又一个过路人。可克里尔并非凡夫俗子——他是一名死灵法师。<br><br>最后一只地精试图逃离克里尔的黑暗魔法，却被他随手一挥，抽走了灵魂。那具绿皮躯壳失去生机，瘫倒在地。<br><br>虽然轻易击败了这群绿皮，克里尔却知道，下一批敌人可能更加危险。他从师父那里学到了不少本事，也知道该如何应对。他需要一支听命于自己的队伍。<br><br>暗影沼泽 (Shadowmarshes) 遍地死亡。许多村民和贵族走进沼泽后便杳无音信。他们不是溺水而亡，就是死在游荡于此的地精手中。<br><br>克里尔知道该去哪里寻找尸体。师父教过他如何找到死者，再将其唤起为亡灵仆从。一个小时后，他找到了几具溺水者的遗骸。他开始施展仪式，组建自己的亡灵队伍。</body></html>
