FIRST_RUN_MESSAGE=<html><body>欢迎首次运行 Age of Fear！<br><br>游戏默认以窗口模式启动，你可以<br>在选项中切换全屏模式及其他设置。<br><b>默认启用双缓冲，但某些设备可能因此出现黑屏。</b><br><i>此问题仅涉及全屏模式，必要时可在设置中关闭双缓冲。</i><br><br>性能较低的电脑可关闭背景动画，<br>并在窗口模式下使用较低分辨率来提升性能。<br><br><i>感谢你支持独立游戏开发者！</i><br><br><b>现在打开选项窗口吗？</b></body></html>
CONFIG_NEEDS_RESTART=<html><body>所选设置需要重新启动游戏才能生效。<br><br>请保存进度，然后退出并重新启动游戏。<br><br><b>默认设置适用于大多数电脑。</b><br><b>请确保所做更改不会影响游戏正常运行。</b><br><br><i>可在“{0}”选项卡中恢复默认设置。</i><br></body></html>
FORCE_HARDWARE_ACCELERATED_IMAGES_S=<html><body>游戏会将所有图像直接载入显存。<br><i>启用此选项可能加快载入速度，但也可能导致显示问题。</i>{0}</body></html>
GAME_WILL_ALWAYS_INITIALIZE_ACTION_SENSITIVE_MOUSE_CURSOR=<html><body>强制启用随当前操作变化的鼠标光标。<br><i>已安装的 Java 可能无法正确识别系统对彩色鼠标光标的支持。</i></body></html>
GAME_WILL_CONTINUOUSLY_GENERATE_NEW_LEVELS_ALONG_STORY_LEVELS=<html><body>游戏会在剧情关卡之外持续生成新关卡，<br>供玩家无限探索。<br><i>可从世界地图进入程序生成的关卡。</i><br>（此设置在 Age of Fear: Free World 中不生效。）</body></html>
GAME_WILL_DAILY_REFRESH_OPEN_WORLD_LEVELS=<html><body>游戏每天都会刷新程序生成的关卡与商店。<br><i>可从世界地图进入程序生成的关卡。</i><br>（此设置在 Age of Fear: Free World 中不生效。）</body></html>
ALLIES_UNITS_FROM_SAME_TEAM_WILL_BLOCK_MOVE_AREA=<html><body>友军（同一队伍的单位）会阻挡移动路线。<br>（此设置在 Age of Fear: Free World 中不生效。）</body></html>
UNITS_WILL_BE_AFFTECTED_BY_MORALE=<html><body>单位会受到士气影响。<br>（此设置在 Age of Fear: Free World 中不生效。）</body></html>
CERTAIN_SUMMONED_UNITS_WILL_HAVE_SMALL_CHANCE_TO_BREAK_FREE_FROM_ITS_SUMMONER_CONTROL=<html><body>部分召唤单位有小概率脱离召唤者的控制。<br>（此设置在 Age of Fear: Free World 中不生效。）</body></html>
ALL_UNITS_WILL_BE_REMOVED_IF_THEY_ARE_KILLED_IN_BATTLE=<html><body>所有在战斗中阵亡的单位都会被移除。<br>无尸、吞噬尸体、解离等特殊技能始终会永久移除单位。<br>关闭永久死亡时，阵亡单位会损失 {0} 点经验。<br><i>“寻死者”难度始终启用永久死亡。</i><br>（此设置在 Age of Fear: Free World 中不生效。）</body></html>
ALL_UNITS_WILL_RECEIVE_PERMANENT_WOUNDS_WHEN_TAKING_DAMAGE=<html><body>所有单位受到伤害时都可能留下重伤。<br>（此设置在 Age of Fear: Free World 中不生效。）</body></html>
CERTAIN_SPELLS_AND_SKILLS_WILL_HAVE_COOLDOWN_PERIOD_BETWEEN_TWO_TO_FOUR_TURNS=<html><body>部分法术与技能会有两到四回合的冷却时间。<br>（此设置在 Age of Fear: Free World 中不生效。）</body></html>
UNITS_ARE_ABLE_TO_BECOME_INVISIBLE_FOR_ALL_OTHER_PLAYERS=<html><body>单位可以进入隐身状态，对其他所有玩家不可见。<br>（此设置在 Age of Fear: Free World 中不生效。）</body></html>
UNITS_WILL_BE_PUSHED=<html><body>部分法术与技能可以推移单位。<br>（此设置在 Age of Fear: Free World 中不生效。）</body></html>
UNINVISIBLED_TRAPS_WILL_BE_DELETED=<html><body>已暴露的陷阱会在其所属玩家的回合结束时移除。<br>（此设置在 Age of Fear: Free World 中不生效。）</body></html>
TEAM_SIZE_WILL_BE_LIMITED=<html><body>部分特性（如补给有限、孤胆英雄）会限制队伍人数。<br>（此设置在 Age of Fear: Free World 中不生效。）</body></html>
DISEASED_UNITS_WILL_INFECT_OTHER_NEARBY_UNITS=<html><body>患病单位会感染附近的其他单位。<br>（此设置在 Age of Fear: Free World 中不生效。）</body></html>
COMBAT_CALCULATIONS_ARE_RESOLVED_BASED_ON_COMBAT_DICE=<html><body>战斗判定依据战斗骰的结果进行。<br>（此设置在 Age of Fear: Free World 中不生效。）</body></html>
BASE_TEAM_SIZE_IS_UNMODIFIED_ARMY_SIZE=<html><body>基础队伍人数是战斗中尚未受到修正的部队人数上限。<br>（此设置在 Age of Fear: Free World 中不生效。）</body></html>
REGRETFUL_UNITS_WILL_DESERT_DESCRIPTION=<html><body>心生悔意的单位偶尔会逃离队伍。<br>（此设置在 Age of Fear: Free World 中不生效。）</body></html>
ALL_UNITS_WILL_BE_ABLE_TO_EQUIP_ITEMS_IT_MAY_DE_BALANCE_GAME_DIFFICULTY=<html><body>所有单位均可装备物品（可能影响游戏难度平衡）。<br>单位也将能够使用某些物品附带的技能。<br>（此设置在 Age of Fear: Free World 中不生效。）</body></html>
ENEMY_UNITS_WILL_CARRY_ITEMS_IT_MAY_DE_BALANCE_GAME_DIFFICULTY=<html><body>敌方单位会携带物品（可能影响游戏难度平衡）。<br><u>物品偷窃功能将被禁用。</u><br>（此设置在 Age of Fear: Free World 中不生效。）</body></html>
RESOURCES_DICE_DECIDES_HOW_MANY_ITEM_RESOURCES_ARE_GATHERED=<html><body>材料骰决定每场战斗结束后获得的制作材料数量。<br>（此设置在 Age of Fear: Free World 中不生效。）</body></html>
AFTER_WON_BATTLE_YOU_WILL_AUTOMATICALLY_RECEIVE_ALL_ITEMS=<html><body>战斗获胜后，自动收集所有宝箱、木箱等<br>容器中的全部物品。</body></html>
AI_IS_ALLOWED_TO_ACTIVATE_PASSIVE_UNITS_DURING_COMBAT=<html><body>允许 AI 在战斗中激活被动单位。<br><i>被动单位一旦激活，就会攻击附近的所有人。</i></body></html>
TO_PREVENT_ACCIDENTAL_POTION_USAGE_GAME_WILL=<html><body>为防止误用药水，游戏会在使用前<br>额外弹出确认窗口。</body></html>
ANIMATIONS_WILL_SKIP_FRAMES_IF_APPLICATION_IS_BOGGED_DOWN_AND_DOES_NOT_RESPOND=<html><body>游戏运行缓慢、无法及时响应时，允许动画跳帧。<br><i>启用此选项可能减少低性能电脑上的无响应现象。</i></body></html>
SELECTING_INVISIBLE_UNITS_SHOWS_DETECTORS_RANGE=<html><body>选中隐身单位时，显示所有敌方侦测者的侦测范围。<br></body></html>
SELECTING_BURROWED_UNIT_HIDES_SPRITES=<html><body>选中潜地单位时，隐藏其他所有单位的图像，<br>并显示侦测范围。<br></body></html>
SELECTING_UNIT_SHOWS_REPEATS_RANGE=<html><body>选中单位时，显示持续或延迟生效的效果，<br>例如毒云、冰冻龙卷、黑色漩涡等。<br></body></html>
# Tooltip follows source text; the English label and tooltip disagree about AI timing.
AI_CALCULATIONS_WILL_BE_PAUSED_DURING_ANIMATIONS=<html><body>播放动画期间暂停 AI 计算。<br><i>启用此选项可能减少部分电脑上的动画卡顿。</i></body></html>
COMPUTER_PLAYERS_TURNS_WILL_BE_PROCESSED_PARALLELY_OVER_AVAILABLE_CP_US_BR_ENABLE_THIS_SETTING_IF_YOU_WANT_TO_TAKE_ADVANTAGE_OF_MORE_CPU_CORES=<html><body>利用可用的处理器并行处理电脑玩家的回合。<br>启用此设置可利用更多 CPU 核心。</body></html>
ALL_CACHED_OBJECTS_WILL_BE_PERIODICALY_CLEARED=<html><body>定期清理所有缓存对象。<br>启用此设置以改善内存管理。</body></html>
GAME_WILL_DISPLAY_DETAILED_RESULTS_OF_ALL_DICE_ROLLS=<html><body>显示所有掷骰判定的详细结果。<br>示例：1d10 > 5-3 : 7 > 2 : 命中<br></body></html>
GAME_WILL_DISPLAY_WARNING_WHEN_CURRENT_CAMPAIGN_HAS_BEEN_MODDED_CAMPAIGN_MODIFICATIONS_ARE_POSSIBLE_VIA_WORKSHOP_ITEMS=<html><body>当前战役被模组修改时显示提示。<br><i>创意工坊项目可以修改战役内容。</i></body></html>
GAME_WILL_DISPLAY_EXPERIENCE_GAINS_IN_TURN_LOG=<html><body>在回合日志中显示获得的经验。<br></body></html>
GAME_WILL_OCCASIONALLY_DISPLAY_VARIOUS_CLUES_AND_HINTS_NEW_PLAYERS_SHOULD_LEAVE_THIS_OPTION_ENABLED=<html><body>游戏会不时显示各类提示。<br><i>建议新玩家保持启用。</i></body></html>
UNIT_WILL_BE_MOVED_TO_BACK_OF_TEAM_AFTER_STARTING_RECOVERY_BR_E_G_CURE_PERMANENT_WOUND_CURE_COWARD_ETC=<html><body>单位开始休养后，将被移至队伍末尾。<br></body></html>
GAME_WILL_DISPLAY_NOTIFICATION_DIALOG_WHENEVER_BATTLE_TASK_STATUS_CHANGES=<html><body>战斗任务状态发生变化时，弹出通知窗口。<br></body></html>
WHEN_BATTLE_BOARD_IS_DRAGGED_SMART_CAMERA_WILL_STOP_WORKING_UNTIL_YOUR_TURN_IF_CONTROLLER_IS_IDLE_NO_MOVEMENT_NO_PRESS_FOR_S_SECONDS_BR_SMART_CAMERA_WILL_BE_AUTO_RESTORED=<html><body>拖动战场后，智能镜头会暂停，直到你的回合。<br>如果连续 {0} 秒没有输入（点击或移动），<br>智能镜头将自动恢复。</body></html>
GAME_WILL_DISPLAY_ICONISED_STATUS_INDICATORS_BELOW_UNIT_S_HIT_POINTS_AND_MAGIC_POINTS_BARSL=在单位的生命值与魔法值条下方显示状态图标。
DURING_BATTLE_GAME_WILL_ANIMATE_TARGET_MARKERS=在战斗中为目标标记播放动画
INCOMPATIBLE_DISPLAY_MODES_WILL_BE_FILTERED_OUT_OTHER_DISPLAY_MODES_MIGHT_WORK_BUT_CREATE_UNDESIRED_EFFECTS=<html><body>过滤掉不兼容的显示模式。<br><i>其他模式可能仍可运行，但会出现异常显示效果。</i></body></html>
UPON_START_GAME_WILL_VERIFY_CHECKSUM_FOR_ALL_GAME_FILES_VERIFICATION_CAN_TAKE_SEVERAL_SECONDS_UPON_GAME_START_HOWEVER_IT_WILL_DETECT_ANY_GAME_FILE_CORRUPTIONS_IT_IS_ADVICED_TO_LEAVE_THIS_OPTION_ENABLED=<html><body>启动时验证所有游戏文件的校验和。<br>（仅在检测到新版本时执行。）<br><i>验证可能使启动时间延长几秒，<br>但可以检测游戏文件损坏。<br>建议保持启用。</i></body></html>
GAME_WILL_REPAIR_SAVE_FILENAME=<html><body>自动修正存档文件名，以保持跨平台兼容。<br>（可能造成问题的字符会被替换。）</body></html>
DEFAULT_SETTING_TUNED_FOR_STABLE_S=<html><body>默认设置已针对你的系统调整，<br>以保证稳定运行。<br><br><i>许多问题只需恢复默认设置</i><br><i>即可解决。</i><br>{0}</body></html>
ERROR_RETRIEVING_ACTIVE_WORKSHOP_ITEMS_HTML_TAG=<br><font color='red'>无法获取已启用的创意工坊项目。</font><br><font color='red'>请先卸载所有已启用的创意工坊项目，</font><br><font color='red'>再重置设置。</font><br>
YOU_HAVE_S_ACTIVE_WORKSHOP_ITEMS_HTML_TAG=<br>当前有 {0} 个已启用的创意工坊项目。<br>请先卸载所有已启用的创意工坊项目，<br>再重置设置。<br>
BACKGROUND_ANIMATIONS_ARE_STOPPED_DURING_SCROLLING_CONTINUOUS_REDRAWING_OF_BATTLE_BOARD_IS_GIVING_CHOPPY_EFFECT=<html><body>滚动视角时暂停背景动画。<br><i>连续重绘战场可能导致画面卡顿。</i></body></html>
DURING_BATTLE_GAME_WILL_AUTOMATICALLY_FOCUS_VIEW_ON_ACTIONS_ATTACKS_SPELLS_MOVEMENT_SCROLLING_MANUALLY_BATTLE_BOARD_DURING_ENEMY_TURN_STOPS_SMART_CAMERA_UNTIL_YOUR_TURN_PRESS_F_KEY_TO_RESTORE_SMART_CAMERA_DURING_ENEMY_TURN=<html><body>战斗中，镜头会自动跟随正在进行的行动。<br><i>敌方回合中手动滚动战场会暂停智能镜头，<br>直到你的回合。</i><br></body></html>
GAME_WILL_PROCESS_INPUT_FROM_CONNECTED_STEAM_COMPATIBLE_CONTROLLERS=<html><body>接收已连接的 Steam 兼容控制器的输入与指令。<br></body></html>
GAME_WILL_DISPLAY_ALL_NON_ACTIONED_CHARACTERS_AT_BOTTOM_OF_COMBAT_SCREEN_GAME_WILL_DISPLAY_AVAILABLE_ACTION_ICONS_ON_LEFT_SIDE_OF_COMBAT_SCREEN=<html><body>在战斗画面底部显示所有尚未行动的单位。<br>在战斗画面左侧显示可用行动的图标。</body></html>
PLAYER_WILL_BE_ABLE_TO_MOVE_BATTLE_BOARD_WITH_DRAG_AND_DROP_GESTURES=<html><body>允许通过拖动操作移动战场视角。<br></body></html>
PLAYER_WILL_BE_ABLE_TO_SCROLL_LISTS_WITH_DRAG_GESTURES=<html><body>允许通过拖动滚动游戏中的列表，<br>例如属性列表、队伍单位列表、剧情文本等。<br></body></html>
GAME_WILL_DISPLAY_POINTER_DEBUG_ONLY=<html><body>显示指针。<br>（仅用于排查触摸屏问题。）</body></html>
GAME_WILL_TOLERATE_AMOUNT_OF_PRESS_MOVEMENT=<html><body>按下鼠标后，指针移动一定距离才会<br>进入拖动模式。<br><i>（如果点击经常未被识别，请提高此值。）</i></body></html>
GAME_WILL_TOLERATE_AMOUNT_OF_PRESS_MOVEMENT_FOR_STEAM_DECK=<html><body>按下屏幕后，手指移动一定距离才会<br>进入拖动模式。<br><i>（如果触按经常未被识别，请提高此值。）</i></body></html>
GAME_WILL_SNAP_NEAREST_SELECTABLE=<html><body>选择单位、移动区域或其他效果区域时，如果点击位置<br>位于可选区域之外，游戏会吸附至最近的有效位置。<br><i>（如果经常点不中单位或区域，请提高此值。）</i></body></html>
SETS_LONG_PRESS_DELAY_FOR_SECONDARY_ACTIONS=<html><body>设置触发辅助操作所需的长按时间，例如：<br>单位选择、提示、招募界面中的单位换位、技能菜单。<br></body></html>
GAME_WILL_DISPLAY_FPS_MEMORY_AND_OTHER_STATISTICS=<html><body>显示帧率、内存等统计信息。<br><i>（每分钟将使用量与缓存统计写入 aof.log。）</i></body></html>
RENDERING_WITHOUT_WAITING=<html><body>渲染时不等待其他进程。<br><i>仅在游戏动画不流畅时启用。</i><br><i>（可能导致录制的视频出现画面异常。）</i></body></html>
GAME_WILL_SET_DISPLAY_PROCESS_PRIORITY_TO_MAXIMUM_AT_STARTUP=<html><body>启动时将显示进程的优先级设为最高。<br><i>部分电脑在优先处理显示进程时可能获得更好的性能。</i></body></html>
GAME_WILL_SPLIT_TERRAIN_IMAGE_IN_SMALL_TILES=<html><body>将地形图像分成小块，分别绘制。<br><i>部分电脑启用此选项后可能获得更好的性能。</i></body></html>
HARDWARE_ACCELERRATED=<html><body>直接在显存中绘制所有内容。<br><i>启用此选项可能加快绘制速度。</i>{0}</body></html>
GAME_WILL_USE_PREDEFINED_QUALITY_LEVEL_FOR_ALL_RENDERING_PROCESSES=<html><body>所有渲染过程使用预设的质量等级。<br>较低等级性能更好，较高等级画面效果更佳。<br><i>渲染质量在启动时设置。</i></body></html>
GAME_WILL_USE_DOUBLE_BUFFERING=<html><body>使用双缓冲以加快画面显示。<br><i>部分电脑可能无法正确使用双缓冲，</i><br><i>启用后可能出现黑屏。</i><br></body></html>
GAME_WILL_SWITCH_TO_FULL_SCREEN_AT_STARTUP=<html><body>启动时切换到全屏模式。<br></body></html>
GAME_WILL_RENDER_ALL_TEXT_HIGH_CONTRAST=<html><body>禁用菜单及其他窗口的纹理背景，<br>并以高对比度显示所有文字。<br></body></html>
FLOATING_UTILITY_BUTTONS_WERE_DESIGNED=<html><body>悬浮按钮用于支持纯触屏操作。<br>启用后，战斗画面左侧会显示<br>额外的功能按钮。<br></body></html>
THIS_SETTING_WILL_BE_USED_ONLY_WHEN_GAME_IS_IN_WINDOWED_MODE=<html><body>此设置仅在窗口模式下生效。<br></body></html>
SELECTED_RESOLUTION_IS_TOO_HIGH=<html><body>所选分辨率很高，游戏在此显示模式下<br>可能运行不佳。<br>游戏界面不会随之缩放，文字可能难以辨认。<br><br>建议降低分辨率，或使用自动选择。<br></body></html>
FULLSCREEN_MODE_TEXT=<html><body><i>此设置仅在全屏模式下生效。<br>自动选择模式会根据桌面设置选择最佳分辨率。<br>默认模式使用当前桌面设置。<br>游戏在不超过 1280x960 的分辨率下显示效果最佳，<br>更高分辨率可能降低画面的可读性。</i><br><i>（高于 2160x1600（Oculus Rift）的分辨率已禁用。）</i></body></html>
GAME_WILL_ENABLE_SELECTED_RENDERING_USING_MODE_AT_STARTUP_HARDWARE_ACCELERATED_RENDERING=<html><body>启动时使用所选的渲染模式。<br><i>硬件加速渲染可能导致显示问题。<br>如果出现画面异常，请选择 Java。</i></body></html>
SELECT_YOUR_LANGUAGE_HERE_AVAILABLE_LANGUAGES_ARE_CONTINUOUSLY_BEING_ADDED=<html><body>在此选择语言（可用语言会持续增加）。<br><i>选择自动时，游戏会在启动时尝试匹配适合的语言。</i><br></body></html>
SOUND_CLIPS_PLAYED_ON_SEPARATE_PROCESS=<html><body>使用独立进程播放音频。<br><i>如果声音出现延迟，请关闭此选项。</i></body></html>
GAME_WILL_ENABLE_SELECTED_SOUND_ENGINE_AT_STARTUP_IT_IS_ADVICED_TO_USE_OPEN_AL_ENGINE_JAVA_SOUND_ENGINE=<html><body>启动时使用所选的音频引擎。<br><i>建议使用 OpenAL 引擎。<br>Java Sound 引擎可能需要直接访问声卡驱动，<br>使用时应关闭其他播放声音的程序。</i></body></html>
AUTOSAVE_FILES_LIMIT_TOOLTIP=<html><body>保留的自动存档数量不会超过设定的上限。<br><i>设为 0 时，不会自动删除任何自动存档。</i></body></html>
