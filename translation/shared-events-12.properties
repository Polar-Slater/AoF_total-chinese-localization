LevelTransmuterLab01.triggers.on-select-2.description=转化实验室 (Transmuter's Laboratory) 可将金属转化为更稀有的金属。
LevelTransmuterLab02.text=<html><body>转化实验室 (Transmuter's Lab) 的烟囱里涌出五颜六色的烟雾。<br><br>显然，里面正进行着令人兴奋的新研究！<br><br>转化师看见冒险者们走近，赶忙跑到门口迎接。<br><br>他手里捧着一只大号球形烧瓶，里面的液体嘶嘶作响。他笑容满面，示意英雄们进屋。<br><br>“我的研究很顺利，顺利极了！好心的诸位，有什么需要我效劳的吗？”</body></html>
