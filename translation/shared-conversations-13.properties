# 通用对话第13批：月亮井与魔力方尖碑。
SXX_ManaObelisks_gain.conversations.0.name=提示
SXX_ManaObelisks_gain.conversations.0.text=英雄们在方尖碑旁堆起许多魔力碎片。这些魔法造物的光芒越来越亮，发出令人心惊的尖啸。
SXX_ManaObelisks_gain.conversations.1.name=提示
SXX_ManaObelisks_gain.conversations.1.text=英雄们赶紧找地方躲避，随后方尖碑轰然炸裂，响声震耳欲聋！碎石之中，只剩下一枚水晶护符。
SXX_MoonWell_offering.conversations.0.name=提示
SXX_MoonWell_offering.conversations.0.text=<html><body>月亮井 (Moon Well) 的水面微光一闪，所有人都感到一股全新的知识涌入脑海！<br>（你的全体单位各获得了${shared-moonwell-experience-gain}点经验值。）</body></html>
SXX_MoonWell_open.conversations.0.name=提示
SXX_MoonWell_open.conversations.0.text=<html><body>月之钥打开了古老神殿的大门！<br>队伍缓步走了进去……</body></html>
