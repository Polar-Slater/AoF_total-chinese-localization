# Main-text batch 4: shared gameplay descriptions, recruitment and effect rules.
TEAM_TREASURE_HINT=<html><body>金币由英雄携带，可在战役过程中获得。<br><i>金币可用于购买物品和服务。</i></body></html>
ITEMS_CRAFTING_NOT_AVAILABLE_IN_FREE_DESCRIPTION=Age of Fear: The Free World 不提供物品制作功能。
ITEMS_CRAFTING_NOT_IMPLEMENTED_DESCRIPTION=此版本尚未实装物品制作功能。
CAN_USE_POTION_ANYTIME_DESCRIPTION=可在攻击或施法前使用药剂，且不会消耗该单位本回合的行动机会。<br>
CAN_EQUIP_POTION_DURING_BATTLE_DESCRIPTION=<b>战斗开始前仍可装备药剂，因此建议随身携带多种药剂，</b><br><b>以便按需为单位装备。</b><br>
UPGRADE_HEROES_FOR_BETTER_ITEMS_DESCRIPTION=<i>在战役前期尽早升级英雄，可获得更好的战利品。</i><br>
MINOR_HEROES_DONT_INCREASE_TEAM_SIZE_DESCRIPTION=<i>次要英雄可以装备物品，但不会提高队伍人数上限。</i><br>
RANDOMITEMS_AND_HERO_LEVEL_HINT=<html><body>在战役前期尽早升级英雄，可获得更好的战利品。<br>大部分财宝在战役开始时随机生成，<br>因此每次游玩获得的战利品可能不同。<br></body></html>
LIMITED_USES_ARE_RESET_AFTER_BATTLE_DESCRIPTION=<i>有使用次数限制的能力会在战斗结束后重置次数。</i><br>
RESOURCES_ARE_GATHERED_AFTER_BATTLES=<i>材料在战斗结束时收集。</i><br>
COUNTER_MELEE_DESCRIPTION=<i>每次此单位受到近战攻击后，此技能会自动触发。</i><br>
CURSED_ITEM_DESCRIPTION=<i>诅咒物品无法卸下或替换。</i><br>
COLD_DESCRIPTION=<i>极度严寒会削弱火焰攻击的效果。</i><br>
DARKNESS_DESCRIPTION=<i>光线昏暗，远程攻击更容易落空。</i><br>
DEMONS_REALM_DESCRIPTION=<i>恶魔领域充斥着混沌能量。</i><br>
MANA_FIELD_DESCRIPTION=<i>此地充满魔法能量。</i><br>
EARTHQUAKE_DESCRIPTION=<i>大地震怒，地面剧烈摇晃。即使最强壮的战士，也可能被震得眩晕。</i><br>
VOLCANO_DESCRIPTION=<i>喷发的火山危机四伏。快逃，否则就会化为灰烬！</i><br>
SLEEP_DESCRIPTION=<i>先用完其他攻击，再在回合结束前让所有敌人入睡。</i><br><i>只要有一名敌人醒着，就可能唤醒整支军队！</i><br>
SNOW_DESCRIPTION=<i>积雪深厚，举步维艰。</i><br>
SLIPPERY_DESCRIPTION=<i>冰面湿滑！请勿奔跑或突然移动。</i><br>
DESERT_SUN_DESCRIPTION=<i>沙漠的酷热无情地炙烤着沙地上的所有人。</i><br>
STRONG_WIND_DESCRIPTION=<i>强风使准确瞄准变得十分困难。</i><br>
FOG_DESCRIPTION=<i>浓雾遮蔽视线，是弓箭手的噩梦。</i><br>
BLOOD_MOON_DESCRIPTION=<i>血月高悬，眷顾一切邪恶生物！</i><br>
RAIN_STORM_DESCRIPTION=<i>潮湿天气会让闪电与寒冷更加危险。</i><br>
NO_AMBUSH_DESCRIPTION=<i>敌人已察觉你的存在，守卫正严阵以待。</i><br>
INCENDIARY_CLOUD_DESCRIPTION=<i>可怕的燃烧气体将此地化作人间地狱！</i><br>
ACID_RAIN_DESCRIPTION=<i>酸雨会伤害植物及其他活物。</i><br>
BLIZZARD_DESCRIPTION=<i>巨大的冰块正从天而降！</i><br>
SEA_BATTLE_DESCRIPTION=<i>海战需要出色的平衡能力，还得有个不会晕船的铁胃。</i><br>
RELIC_DESCRIPTION=<i>随机战斗中有机会获得独一无二的圣物。</i><br>
ONLY_ONE_RELIC_IN_AOFFREE_RELIC_DESCRIPTION=<i>（在 Age of Fear: Free World 中只能装备一件圣物。）</i><br>
CONTINUOUS_SELECTIONS_WILL_SUMMON_MORE_UNITS_DESCRIPTION=<i>（连续选择会召唤更多单位。）</i><br>
DETECTION_RANGE_DESCRIPTION=<i>（有效侦测范围以蓝色虚线圆圈标示。）</i><br>
UNSLEEP_RANGE_DESCRIPTION=<i>（警戒范围以蓝色虚线圆圈标示。）</i><br>
LIMITED_AMMUNITION_DESCRIPTION=<i>此技能的弹药有限，请珍惜每一次射击！</i><br>
TWOHAND_WEAPON_CANNOT_HAVE_SHIELD_DESCRIPTION=<i>双手武器不能与盾牌同时使用。</i><br>
STAFF_CANNOT_HAVE_SHIELD_DESCRIPTION=<i>法杖不能与盾牌同时使用。</i><br>
UNIT_IS_NOT_FULLY_CONTROLLABLE_DESCRIPTION=<i>此单位攻击敌人时无法完全受控。</i><br><i>失控行为可能导致其死亡！</i><br>
SPELLS_BECOME_MORE_POWERFUL_ON_UPGRADE_LEVEL_DESCRIPTION=<i>单位进阶后，某些技能和法术</i><br><i>会变得更强。</i><br>
EQUIPPED_ITEMS_CHANGE_AFFINITY_WITH_PRIORITY=<i>（改变单位阵营倾向时，已装备物品的效果优先。）</i><br>
PERMANENT_WOUND_CAN_ONLY_BE_CURED_OUTSIDE_BATTLE=重伤只能在战斗之外治疗
PERMANENT_WOUND_DESCRIPTION=<i>重伤只能在战斗之外的招募界面治疗。</i><br><i>生命值较低的单位更容易受到重伤。</i><br>
POISON_DAMAGE_DOES_NOT_STACK_DESCRIPTION=<i>毒伤不会叠加。</i><br>
MAGIC_REGENERATION_DOES_NOT_STACK_DESCRIPTION=<i>魔法再生效果不会叠加。</i><br>
UNDEAD_CONSTRUCT_DOES_NOT_GENERATE_SOUL_DESCRIPTION=<i>植物、恶魔、亡灵、构装体、元素生物</i><br><i>以及召唤单位死亡时不会产生灵魂。</i><br>
PROTECT_VS_PHYSICAL_ATTACKS_DESCRIPTION=<i>抵御物理近战和远程攻击。</i><br>
DOES_NOT_PROTECT_VS_ELEMENTAL_ATTACKS_DESCRIPTION=<i>无法抵御火焰、寒冷、闪电、魔法攻击及法术。</i><br>
BLOOD_MOON_ACTIVATED_DEPLOY_TURN=<i><u>血月</u>需在部署回合手动激活。</i><br>
STONE_FORM_RESTORED_AFTER_BATTLE_DESCRIPTION=<i>战斗结束后，处于<u>岩石形态</u>的单位会恢复，并保留至后续关卡。</i><br>
OVERFLOWING_HP_GIVES_BLOOD_MAGIC_DESCRIPTION=<i>此单位可临时储存超出基础生命值的1点额外生命值。</i><br>
DEFENCE_REDUCTION_IS_APPLIED_BEFORE_BONUSES_DESCRIPTION=<i>防御削减先于所有其他修正生效。</i><br>
TEMPORARY_ATTRIBUTES_HP_ARE_CARRIED_TO_AND_FROM_POLYMORPHED_UNIT_DESCRIPTION=<i>变形及恢复原形时，生命值会按比例转换。</i><br><i>临时属性也会在条件允许时转移至新形态。</i><br><i>（若新形态免疫某项属性，该属性会消失。）</i><br>
TEMPORARY_ATTRIBUTES_ARE_CARRIED_FROM_TARGET_UNIT_DESCRIPTION=<i>目标单位的临时属性也会在条件允许时一并转移。</i><br><i>（若接收单位免疫某项属性，该属性会消失。）</i><br>
UNAFFECTED_BY_RACIAL_ANIMOSITY_DESCRIPTION=<i>不受种族敌意造成的士气惩罚影响。</i><br>
DESERTION_CHECK_ALREADY_DONE=已说服此单位留下！
CAMOUFLAGE_MISSILE_DESCRIPTION=<i>（为隐藏攻击者的位置，弹道动画会随机偏移。）</i><br>
INVISIVILITY_DETECTION_DESCRIPTION=<i>此单位若停留在敌人附近，就会被发现。</i><br><i>自动触发的能力会解除隐形。</i><br>
TRAPS_CANNOT_BE_INVISIBLE_AGAIN=<i>（陷阱一旦暴露，就无法再次隐藏。）</i><br>
ACTIVE_MAGIC_SHIELD_PREVENTS=<i>生效中的<u>魔法护盾</u>可阻止此效果。</i><br>
GLOBALATTRIBUTE_TRIGGER_ONCE_BATTLEBOARD_DESCRIPTION=<i>（此战场状态触发一次后即会移除。）</i><br>
UNIT_WILL_CARRY_OVER_DESCRIPTION=<i>此单位会保留至后续关卡（无法移动的单位和<u>被动</u>单位除外）。</i><br>
SKELETONS_AND_GHOSTS_DONT_LEAVE_BODY=<i>（骷髅和幽灵不会留下尸体，因此无法被复活。）</i><br>
NEW_AURAS_ARE_ACTIVATED_IMMEDIATELY=<i>（新获得的光环会立即生效。）</i><br>
ENSALVED_AND_TAMED_REMOVED_FROM_PLAYER_FACTION_DESCRIPTION=<i>战斗结束后，与玩家同阵营的单位会移除“被奴役”和“已驯服”状态。</i><br>
NEW_CAPTURED_UNIT_EXPERIENCE_BALANCED_DESCRIPTION=<i>战斗结束后，新俘获单位的技能会折算为经验值。</i><br>
DEMONS_AND_UNDEAD_CANNOT_BE_TAMED_DESCRIPTION=<i>（亡灵野兽和恶魔野兽无法被驯服。）</i><br>
EVOLVE_DESCRIPTION=<i>进阶只能在招募界面进行。单位必须积累足够的经验值，</i><br><i>而且你必须先发现该兵种的进阶形态</i><br><i>（即该形态已在生物图鉴中显示）。</i>
EXPERIENCE_POINTS_AND_EVOLVE_DESCRIPTION=成功攻击、施法及参与战斗中的其他行动均可获得经验值。<br>部分单位积累足够的经验值后便可进阶。<br>首次遇到某种单位后，就会解锁对应的进阶形态。<br>
HAPPY_DESCRIPTION=<i>某些单位不愿与其他种族并肩作战，因此会降低士气。</i><br>
EQUIP_ITEM_DESCRIPTION=<i>每个单位可携带两瓶药剂。</i><br><i>每个单位可装备一件武器或一根法杖。</i><br><i>每个单位可装备盾牌、护甲、一双鞋靴和一件头部装备。</i><br><i>盾牌不能与双手武器同时装备。</i><br><i>远程单位无法装备武器、盾牌或法杖。</i><br><i>每个单位可佩戴一枚护符和两枚不同的戒指。</i><br><i>每个单位可携带最多四件宝物或战利品。</i><br><i>部分物品仅限特定种族使用。</i><br><i>未使用的物品存放在物品仓库中。</i><br><i>诅咒物品无法卸下或替换。</i><br>
CONSTRUCT_WITH_EVOLVEABLE_ATTRIBUTE_WITH_GOLD_PRICE_HINT=<html><body>构装体升级消耗金币，而非经验值。<br>（亡灵构装体升级需要同时消耗金币和经验值。）<br><br>升级构装体前，请先确保有足够的金币<br>满足其他单位的需要。<br></body></html>
MERCENARIES_HINT=<html><body>此商店可雇用<u>雇佣兵</u>。<br>（单位以 * 标记。）<br><br><i>雇佣兵经验更丰富，但雇用费用也更高。</i><br><i>此外，队伍中的某些单位可能不喜欢他们。</i></body></html>
CRAFTING_ITEM_HINT=<html><body>大多数物品都可以制作（点击物品可查看配方）。<br>制作只能在商店中进行，且必须满足以下条件：<br><br>- 已知该物品的配方。首次制作某件物品时，<br>可学会同一主题套装中其他物品的配方。<br><br>- 队伍中的单位具备所需的属性、技能和特性。<br>例如，“铁匠”特性可以用于制作武器和护甲。<br><br>- 物品仓库中有足够的所需材料。<br>每场战斗结束后都会自动收集材料。<br><br>- 材料说明会提示其产地，或哪些生物死亡后会掉落该材料。<br>例如，月光草可在森林和沼泽采集，<br>也可在与独角兽的战斗结束后获得。<br></body></html>
CRAFTING_ITEM_HINT_UNLOCKS=<html><body>制作物品时，有概率解锁同一套装中其他物品的配方。<br></body></html>
GATHERING_RESOURCES_HINT=<html><body>每场战斗结束后，部队都会搜寻可用的物品和材料。<br>获得的材料种类取决于地形和敌人类型。<br><br>- 蘑菇、根茎等植物材料可在洞穴、沼泽和森林中找到。<br>森林生物总会携带一些此类材料。<br><br>- 矮人的背包中通常装有金属锭和宝石。<br>被摧毁的构装体也能提供金属。<br><br>- 想获得优质刀剑及其他武器，可以向人类部队下手。<br>击败骑士后，还能从其身上取下护甲。<br><br>- 亡灵遗骸可提供多种独特材料，例如吸血鬼灰烬、骨粉，<br>以及极为珍贵的巫妖颅骨。<br><br>- 熔岩湖等炎热地区蕴藏着火山水晶之类的火属性矿物，<br>寒冷地区则可提供黑冰等冰属性矿物。<br><br>- 被击败的法师，深深的口袋里往往装着药剂和其他魔法物品。<br></body></html>
GATHERING_RESOURCES_BATTLE_MESSAGE=你的部队收集到了材料！
MUTATING_POTION_HINT=<html><body>你的某个单位携带着<u>诱变剂</u>。<br><br>装备<u>诱变剂</u>后，单位获得新特性的速度会受到显著影响，<br>但它偶尔也会移除已有特性。<br><br><u>诱变剂</u>也可在招募界面中使用，<br>强制移除一个已获得但不想保留的特性。<br><br><i>装备诱变剂期间，单位的特性会频繁变化。</i><br><i>当你对单位的特性组合满意后，</i><br><i>应当卸下诱变剂。</i><br></body></html>
MUTATING_POTION_DESCRIPTION=<i>也可在招募界面使用<u>诱变剂</u>，</i><br><i>移除一个已获得但不想保留的特性。</i><br>
SOUL_TROPHY_HINT=<html><body>你的死灵法师英雄捕获了<u>灵魂</u>战利品！<br><br>灵魂战利品可提供各种效果和加成。<br>它们必须在战斗前装备，并会在战斗结束后消失。<br><br>击杀敌方单位时，偶尔能够捕获灵魂。<br>战利品的类型取决于被击杀的敌人。<br><br><i>捕获的灵魂列于物品栏的“其他”选项卡中。</i></body></html>
HERO_ITEMS_HINT=<html><body>Age of Fear 的世界中有许多强大的宝物，只有英雄才能使用。<br><br>宝物可提升单位的属性，也可能赋予新的技能和能力。<br><br>游戏中的大部分物品为随机掉落，因此每次战役的收获都会大不相同。<br><br>{0}<br>最强大的物品被称为圣物，往往能赋予独一无二的法术和能力。<br>{1}<br><i>要装备物品，请点击右侧的“装备”按钮。</i></body></html>
POTIONS_TUTORIAL_HINT=<html><body>英雄可以使用任何物品或宝物，普通单位则只能使用药剂。<br>（可在“其他”选项中更改此设置。）<br><br>{0}<br>药剂价格不菲，但在战斗中能发挥很大的作用。<br><br>{1}<br><br>每个单位最多可携带两瓶药剂。<br></body></html>
PERMENENT_WOUNDS_TUTORIAL_HINT=<html><body>单位可能在战斗中受伤。有些伤势难以痊愈，需要经验丰富的治疗者或修理师协助。重伤会降低单位的属性，直到治愈为止。<br><br>{0}<br>治疗重伤需要花费少量金币，且该单位无法参加下一场战斗。<br>（拥有“坚毅”属性的单位无需休养。）<br><br>某些技能和物品可降低受到重伤的概率。<br><br>要治疗重伤，请打开该单位的“技能”选项。<br><br></body></html>
SHOP_TUTORIAL_RECRUITMENT_HINT=<html><body>这里是招募界面，所有军队管理操作都可在此进行。<br><br>招募界面分为三个区域：<br><br>- <b>招募面板</b>（左上方）：可招募或查看部队。<br>顶部显示可用资源（财宝）和当前队伍人数上限。<br>招募单位需要金币，而游戏中的金币数量有限，<br>因此请合理规划开支。<br><br>- <b>单位面板</b>（右上方）：显示单位详情。<br>点击属性可查看更多提示。<br><br>- <b>玩家军队面板</b>（下方）：点击单位图标以选中，<br>再次点击可取消选择。<br><br>选中的单位可以解散（“解散”按钮）或升级（“技能”按钮）。<br>请注意：解散的单位会永久离开，其战斗经验与招募花费<br>也无法收回。<br></body></html>
SHOP_TUTORIAL_EXPERIENCE_AND_UPGRADES_TEXT=可升级单位的头像上会出现书本标记。<br><br>- 如果单位可以进阶为其他兵种，相应选项会出现在菜单顶部。<br>请注意：进阶为其他兵种后无法还原。<br><br>- 也可在此菜单中提升单位的资历（正规／老兵／精英）。升级可能解锁额外技能，并增强部分现有技能的效果。<br><br>- 若金币充足，也可在此菜单中治疗单位的重伤。<br><br>- 此菜单会列出所有可用的技能和属性。单位只有在经验值充足时才能购买技能。<br><br>- 较高级的技能需要达到特定资历等级后才能学习。<br>例如，只有老兵骑士才能购买“健康”属性（基础生命值上限+1）。
SHOP_TUTORIAL_TRAITS_TEXT=战役过程中，某些单位可能获得特性，其效果有好有坏。特性让单位更有个性，通常不会带来很大的影响。<br><br>- 特性源于单位的某些行为或参加过的战斗。例如，经常与蜘蛛作战的单位可能获得“蜘蛛恐惧症”。<br><br>- 获得特性的条件各不相同，有些要求达到一定击杀数，另一些则无需特定条件。单位每提升一个等级，可额外获得一个特性（最多三个）。<br><br>- 装备稀有药剂<u>诱变剂</u>后，单位获得新特性的速度会受到显著影响，但偶尔也会失去已有特性。<br><br>- 也可在“技能”菜单中使用<u>诱变剂</u>，强制移除一个已获得但不想保留的特性。
UNIT_AFFINITY_DESCRIPTION_TEXT=单位的阵营倾向（邪恶或神圣）标注在种族名称之后。某些强大的宝物可临时改变单位的阵营倾向。<br><br>计算种族敌意时，会考虑整个队伍的组成，包括超编和休养中的单位。<br><br>队伍士气为负的单位会陷入懊悔，并有可能逃离队伍！
UNIT_HAVE_THEIR_OWN_RACIAL_ANIMOSITIES_AND_WILL_GET_MORALE_BONUSES_AND_PENALTIES_DEPENDING_ON_YOUR_TEAM_COMPOSITION=单位各有其种族敌意，会根据队伍组成及自身的阵营倾向获得士气加成或惩罚。<br><br>队伍士气是这些修正的合计结果，也会受少数特殊物品和属性影响。队伍士气修正会加在单位的基础士气上。<br><br>陷入懊悔的单位（队伍士气为负）会试图逃离队伍。发生逃亡检定时，你有一次机会阻止其离开。<br><br>根据队伍组成，你可以采用不同的“劝说”方式。例如，祭司或圣骑士可与非邪恶单位一同祈祷，说服其留下；术士则可以催眠试图逃跑的单位。
TEAM_MORALE_MODIFIERS_ARE_ADDED_TO_UNIT_MORALE=<i>（队伍士气修正会加在单位的基础士气上。）</i>
TEAM_MORALE_DEPENDS_ON_TEAM_COMPOSITION=队伍组成会影响队伍士气：
