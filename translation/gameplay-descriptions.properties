HEROLEVELEVOLVED_HINT=<html><body>你的英雄已升级！<br><br>主要英雄升级会提高队伍人数上限。<br></body></html>
EXCHANGEUNITS_HINT=<html><body>要调整队伍中的单位顺序，请先选中一个单位，<br>再右键点击另一个单位，即可交换两者的位置。<br>注意：英雄的位置无法调整。<br></body></html>
EXCHANGEUNITS_HINT_FOR_STEAM_DECK=<html><body>要调整队伍中的单位顺序，请先选中一个单位，<br>再长按另一个单位，即可交换两者的位置。<br>注意：英雄的位置无法调整。<br></body></html>
LONGPRESS_HINT_FOR_STEAM_DECK=<html><body>长按（按住不放）按钮或其他界面元素可查看提示，<br>例如单位属性标签、技能图标和物品图标等。<br>长按等待时间可在设置选项中调整。<br></body></html>
MORALEUNHAPPY_HINT=<html><body>你的单位陷入了懊悔（队伍士气为负），有可能逃离队伍！<br>（可通过队伍的特殊技能或支付金币来阻止逃亡。）<br><br>单位各有其种族敌意，会根据队伍组成及自身的阵营倾向，<br>获得士气加成或惩罚。<br></body></html>
OVERLIMIT_HINT=<html><body>队伍人数已达上限，无法再增加参战单位！<br><br><i>超编单位不会参加战斗，但仍会保留</i><br><i>至下一关。</i><br><br><i>（超编单位仍会获得少量经验值。）</i><br></body></html>
RENAMEUNIT_HINT=<html><body>某些单位可以重命名！<br><br><i>点击属性面板中带下划线的单位名称即可重命名。</i><br><i>（点击单位说明可将其收起。）</i><br></body></html>
