# 通用事件第26批：血与月开场、困境中的狼及关联失败文本
LevelWerewolf01.text=<html><body>寂静森林 (Silent Forest) 中栖息着许多生灵，但没有什么比狼群更加凶猛。<br><br>不知是因为无云的夜空中高悬着一轮满月，还是有别的超自然力量在作祟，即将到来的这一夜，笼罩着不祥、恐惧与神秘的气息。<br><br>你敢冒险踏入寂静森林 (Silent Forest)，并有幸全身而退吗？<br><br>还是会像先前无数人那样，命丧于此？</body></html>
LevelWerewolf01.location.name=血与月 (Blood and Moon)
LevelWerewolf02.text=<html><body>一头巨狼在林间狂奔，浓密的皮毛在月光下泛着光泽。一队猎手举着火把、手持兵刃，在它身后紧追不舍。<br><br>巨狼闪过一支箭，跃过倒下的树干，翻滚着落入一片宽阔的空地。它急切地寻找藏身之处，却一无所获。转身四顾，四面八方都是追兵摇曳的火光。<br><br>士兵们从黑暗中现身，迅速逼近。巨狼浑身毛发竖起，用后腿直立起来，龇出利齿，准备为活命拼死一搏。<br><br>这可不是一头普通的狼……<br><br>这些可怜的猎手很快就会明白，黑夜里的森林，并不站在他们这一边。</body></html>
LevelWerewolf03.conversations.0.name=骑士
LevelWerewolf03.conversations.0.text=<html><body>都小心点！我们已经包围了这头邪恶的怪物。<br>它无路可逃了！</body></html>
LevelWerewolf03.conversations.1.name=步兵
LevelWerewolf03.conversations.1.text=杀死野兽！胜利属于国王！
LevelWerewolf03.conversations.2.name=冈瑟
LevelWerewolf03.conversations.2.text=<html><body>你们休想得胜，蠢货。<br>我警告你们，离开这里，否则就死在这里！</body></html>
LevelWerewolf03.conversations.3.name=骑士
LevelWerewolf03.conversations.3.text=啊，它居然会说话！畜生，该死的是你！我们要像宰疯狗一样宰了你！
LevelWerewolf03.conversations.4.name=冈瑟
LevelWerewolf03.conversations.4.text=吼——！
LevelWerewolf03.conversations.5.name=提示
LevelWerewolf03.conversations.5.text=冈瑟是一名强大的狼人战士，拥有再生能力。他还有较低概率将杀死的敌人转化为狼人！
LevelWerewolf04.text=<html><body>队伍在附近的树林里扎营，正准备就寝，却被人们激动的喊叫声和兵刃碰撞声惊动了。<br><br>英雄们起身拿上装备，朝骚动传来的方向走进漆黑的森林。<br><br>不管发生了什么，动静离营地这么近，总得去看个究竟。<br><br>勇敢的英雄们冲进了森林……</body></html>
LevelWerewolf05.text=<html><body>英雄们赶到空地，看见一头孤狼被一群士兵团团围住，双方数量悬殊。<br><br>一名士兵胡乱挥剑冲了上去，巨狼猛地扑起，灵巧地避开剑锋，凶狠地一口咬断了他的喉咙。<br><br>那人毫无生气地倒在地上，巨狼又跃起扑向下一个目标，可士兵实在太多了。<br><br>冒险者们看得分明：这头野兽绝无可能独自击退整队围攻者！</body></html>
LevelWerewolf05.location.name=困境中的狼 (Wolf in Distress)
LevelWerewolf06.conversations.0.name=冈瑟
LevelWerewolf06.conversations.0.text=吼——！
LevelWerewolf06.conversations.1.name=皇家卫士
LevelWerewolf06.conversations.1.text=<html><body>警报，警报！<br>那头野兽逃出笼子了！</body></html>
LevelWerewolf06.conversations.2.name=游侠
LevelWerewolf06.conversations.2.text=<html><body>该死！所有人，把它围起来！<br>别让它跑了！</body></html>
LevelWerewolf06.conversations.3.name=冈瑟
LevelWerewolf06.conversations.3.text=<html><body>该死的蠢人类。<br>这下可不妙了。</body></html>
LevelWerewolf06.conversations.4.name=冈瑟
LevelWerewolf06.conversations.4.text=<html><body>喂，陌生人。<br>我这儿可真需要帮把手！</body></html>
LevelWerewolf06.triggers.on-battle-task-1.text=治疗药液×3：在第八回合结束前赢得战斗
LevelWerewolf06.triggers.on-battle-task-2.text=300金币：不损失任何单位
LevelWerewolf07.text=<html><body>猎手们的尸体横七竖八地倒在血泊中，队长更是被撕成了两半。<br><br>浑身浴血的巨狼站在这圈尸体中央，喘着粗气。<br><br>它仍在低吼，猛地将目光转向冒险者们，却随即平静下来。<br><br>狼人甩掉嘴边的血，直起高大的身躯，越过长长的口鼻俯视众人，朝救命恩人缓缓点头致意。</body></html>
LevelWerewolf07.conversations.0.name=冈瑟
LevelWerewolf07.conversations.0.text=谢谢你们，谢谢各位。那些人设下了圈套，我好不容易才逃出来。
LevelWerewolf07.conversations.1.name=冈瑟
LevelWerewolf07.conversations.1.text=<html><body>容我自我介绍一下。<br>我叫冈瑟，是个护林人，或者说……以前是。</body></html>
LevelWerewolf07.conversations.2.name=冈瑟
LevelWerewolf07.conversations.2.text=上一个满月之夜，我巡林时遭到了一头恐狼的袭击。至少当时，我以为那是恐狼。
LevelWerewolf07.conversations.3.name=冈瑟
LevelWerewolf07.conversations.3.text=我撑着回到了家中的小木屋。妻子替我包扎好伤口，哄女儿上床睡下，就去请村里的医生了。
LevelWerewolf07.conversations.4.name=冈瑟
LevelWerewolf07.conversations.4.text=之后的事，我就记不清了。
LevelWerewolf07.conversations.5.name=冈瑟
LevelWerewolf07.conversations.5.text=天亮时，我清醒过来，却发现自己不在家里，而是走在通往镇子的小路上。衣服破破烂烂，浸透了鲜血。
LevelWerewolf07.conversations.6.name=冈瑟
LevelWerewolf07.conversations.6.text=<html><body>我发现妻子脸朝下倒在泥地里，被什么凶残的东西撕咬致死。<br>难道真是我杀了自己的爱人？</body></html>
LevelWerewolf07.conversations.7.name=冈瑟
LevelWerewolf07.conversations.7.text=女儿也不见了。我不知该怎么办，就逃进了森林。
LevelWerewolf07.conversations.8.name=冈瑟
LevelWerewolf07.conversations.8.text=从那以后，村里的人就一直想要我的脑袋。也许我该让他们如愿……
LevelWerewolf07.conversations.9.name=冈瑟
LevelWerewolf07.conversations.9.text=你们救了我的命，这份恩情我记下了。可要是跟你们同行，会给你们带来太大的危险。在这片林子里，多加小心。
LevelWerewolf07.conversations.10.name=提示
LevelWerewolf07.conversations.10.text=冈瑟和他的狼人只会参加这段冒险中的战斗。下一场战斗前，请确保你的队伍已做好充分准备！
LevelWerewolfDefeat.text=<html><body>致命的一击正中要害，冈瑟猛地睁大了双眼。<br><br>他喉中挤出一声短促的哀嚎，随即侧身倒下，鲜血流入泥土，生命也随之消逝。<br><br>妻子和女儿的身影在他眼前闪过。片刻之后，一切归于黑暗。</body></html>
