S_HAS_BEEN_INFECTED_HINT=<html><body><b>{0}</b>感染了疾病！<br><br>疾病每回合都有小概率传染给附近的单位，包括友军和敌军。<br><br>患病单位的能力和基础生命值都会降低。请隔离患病单位，<br>以免疾病继续传播。<br></body></html>
S_HAS_BACKSTAB_HINT=<html><body>你的刺客<b>{0}</b>已准备好从暗影中出击！<br><br>（刺客的背刺攻击能造成更高伤害。）<br></body></html>
MORALE_POINTS_HINT_TAG=士气反映单位的心理状态。<br>士气高于基础值时会提升战斗能力，<br>士气低落则意味着单位濒临恐慌。<br><i>士气降至零时，单位会陷入恐慌并试图逃跑。</i><br><i>士气高于基础值时，每回合降低1点。</i><br>
ATTACK_DESCRIPTION=<i>命中率取决于攻击值与防御值的差距。</i><br><i>双方数值相等时，命中率为50%。</i><br><i>攻击值每比目标防御值高1点，命中率增加10个百分点；</i><br><i>每低1点，命中率降低10个百分点。</i>
