# Shared events batch 4: party interactions and short travel encounters.
SGE_BlademasterHero_accept.conversations.0.name=提示
SGE_BlademasterHero_accept.conversations.0.text=你谦逊地婉拒了老者的提议，称赞他技艺高超，却表示自己不配受教。他温和地笑了笑，向你道谢。
SGE_BlademasterHero_accept.conversations.1.name=提示
SGE_BlademasterHero_accept.conversations.1.text=你的谦逊打动了他。他邀请你麾下的几名士兵免费参加当天的训练，与他的弟子一同练习。
SGE_BlademasterHero_accept.conversations.2.name=提示
SGE_BlademasterHero_accept.conversations.2.text=（你的皇家卫士进阶为剑术大师，步兵进阶为皇家卫士！）
SGE_BlademasterHero_select.conversations.0.selection-text=<html><body>前往下一个目的地时，一名身披铠甲、<br>神情严厉的男子从灌木丛中走出，叫住队伍。<br>他自称剑术大师，弟子遍布各地。<br><br>“勇敢的冒险者！随我学习，你们的武艺<br>便能在战场上无人能敌。我可不会随便<br>传授技艺。让我来指点你们吧。”<br><br>要跟随这位剑术大师训练吗？</body></html>
SGE_CemeterySunset.conversations.1.name=提示
SGE_CemeterySunset.conversations.1.text=队伍发现了一片早已被遗忘的墓地。英雄们简短祈祷，向逝者致意，随后继续上路。
SGE_Comet.conversations.1.name=提示
SGE_Comet.conversations.1.text=<html><body>昨夜，一颗明亮的彗星划过天空，留下一道灿烂的蓝色光迹。这究竟是吉兆，还是危险的预兆？<br>（随机地点将重置。）</body></html>
SGE_Crates_gain.conversations.1.name=提示
SGE_Crates_gain.conversations.1.text=你的单位发现了一批被遗弃的货物！这些保存完好的箱子，想必是某位药剂商人留下的。
SGE_Dragon_kill.conversations.1.name=提示
SGE_Dragon_kill.conversations.1.text=行军途中，你麾下的一头龙踩到了另一头龙的尾巴，双方随即厮打起来。不幸的是，落败的那头被胜者吞掉了。
SGE_DwarfGod_gain.conversations.1.name=提示
SGE_DwarfGod_gain.conversations.1.text=你的矮人发现了一尊早已被遗忘的矮人神祇雕像，还找到了藏在附近的一批矮人武器！
SGE_DwarfMutant_join.conversations.1.name=提示
SGE_DwarfMutant_join.conversations.1.text=一名四处流浪的变异矮人来到营地。你的士兵正准备砍掉他的两颗脑袋，却发现他是来请求加入队伍的！
SGE_DwarfRouge_gain.conversations.0.name=矮人游荡者
SGE_DwarfRouge_gain.conversations.0.text=嘘！老大，过来一下，有东西给你。
SGE_DwarfRouge_gain.conversations.1.name=矮人游荡者
SGE_DwarfRouge_gain.conversations.1.text=我们忙了一整夜，结识了不少和气又有钱的朋友。嘿，今晚可真是收获颇丰！
SGE_DwarfRouge_gain.conversations.2.name=矮人游荡者
SGE_DwarfRouge_gain.conversations.2.text=老大，我这人说话算话。这是你的那份。
SGE_DwarfRouge_gain.conversations.3.name=提示
SGE_DwarfRouge_gain.conversations.3.text=<html><body>矮人把一小袋金币交给你，随后消失在阴影中。<br>（你获得200金币！）</body></html>
SGE_Eclipse.conversations.1.name=提示
SGE_Eclipse.conversations.1.text=正值白昼，天空却诡异地暗了下来——是日食！小心，德鲁伊教团将会四处搜寻血祭的祭品！
SGE_Hangman.conversations.1.name=提示
SGE_Hangman.conversations.1.text=英雄们看见路旁吊着一具男尸。这骇人的景象提醒着过往行人：国王的裁决来得迅速而残酷。队伍从尸体旁经过，继续前行。
SGE_HeroBones_gain.conversations.1.name=提示
SGE_HeroBones_gain.conversations.1.text=队伍偶然发现了一位遇害英雄的遗骸。尸体早已被搜刮一空，英雄们却在附近的草丛里找到了一枚魔法戒指！
SGE_HungryGhoul_attack.conversations.1.name=提示
SGE_HungryGhoul_attack.conversations.1.text=漆黑的夜里，一只饥饿的食尸鬼突然袭击了队伍！士兵们杀死了怪物，但也有几人受了伤。
SGE_NecromancerAndMonk_fight.conversations.0.name=僧侣
SGE_NecromancerAndMonk_fight.conversations.0.text=我信全能的天父，天地的创造者……
SGE_NecromancerAndMonk_fight.conversations.1.name=死灵法师
SGE_NecromancerAndMonk_fight.conversations.1.text=行了，闭嘴吧。你这没完没了的吟唱，听得我浑身难受！
SGE_NecromancerAndMonk_fight.conversations.2.name=死灵法师
SGE_NecromancerAndMonk_fight.conversations.2.text=该让这个虔诚的蠢货安静下来，再找个真正的吟游诗人了！
SGE_NecromancerAndMonk_fight.conversations.3.name=提示
SGE_NecromancerAndMonk_fight.conversations.3.text=你的死灵法师突然动手，把僧侣打成了重伤！
SGE_NecromancerZombies_raises.conversations.1.name=提示
SGE_NecromancerZombies_raises.conversations.1.text=你的死灵法师发现了一片墓地，忍不住施展起黑暗法术。（几只僵尸加入了队伍。）
SGE_OrcsAndGoblins_gain.conversations.0.name=提示
SGE_OrcsAndGoblins_gain.conversations.0.text=烤地精肉十分美味！
SGE_OrcsAndGoblins_select.conversations.0.selection-text=<html><body>饥饿的兽人抓住了一只野生地精，<br>把他烤熟了！<br><br>你的队伍打算怎么做？</body></html>
SGE_OrcsBattle_handsoff.conversations.0.name=提示
SGE_OrcsBattle_handsoff.conversations.0.text=两名决斗的兽人继续互相攻击，但其中一方显然更强。
SGE_OrcsBattle_handsoff.conversations.1.name=提示
SGE_OrcsBattle_handsoff.conversations.1.text=狂怒之中，一斧挥下，败者的头颅飞起，直落进篝火里。（你失去一名兽人，胜者获得200点经验值。）
SGE_OrcsBattle_intervene.conversations.0.name=提示
SGE_OrcsBattle_intervene.conversations.0.text=你冲上前去阻止决斗，在利斧砍下败者的脑袋之前，及时将它拦住。
SGE_OrcsBattle_intervene.conversations.1.name=提示
SGE_OrcsBattle_intervene.conversations.1.text=虽然没有人丧命，地上却已血迹斑斑。（一名兽人受到了永久创伤。）
SGE_OrcsBattle_select.conversations.0.selection-text=<html><body>两名兽人闲得无聊，开始互相打闹。<br>这场“切磋”很快失控，眼看再打下去，<br>就算不闹出人命，也要有人重伤了！<br><br>要出手制止这场斗殴吗？</body></html>
SGE_OrcsCamp_gain.conversations.0.name=提示
SGE_OrcsCamp_gain.conversations.0.text=队伍走近兽人营地，招呼他们，并与他们交谈起来。
SGE_OrcsCamp_gain.conversations.1.name=提示
SGE_OrcsCamp_gain.conversations.1.text=这些兽人是他们部落最后的幸存者，十分愿意加入你的军队。（几名兽人加入了队伍！）
SGE_OrcsCamp_select.conversations.0.selection-text=<html><body>一名地精斥候回来报告，说附近的树林里<br>驻扎着一群强壮的兽人。他们可能是朋友，<br>也可能是敌人，或许值得前去探查。<br><br>你打算怎么做？</body></html>
SGE_OrcsWarehouse_battle.conversations.0.name=提示
SGE_OrcsWarehouse_battle.conversations.0.text=你的食人魔开始清理仓库入口的瓦砾，却发现这里是个陷阱！
SGE_OrcsWarehouse_battle.conversations.1.name=提示
SGE_OrcsWarehouse_battle.conversations.1.text=大群亡灵从地下涌出，向你的队伍发起进攻！
SGE_OrcsWarehouse_gain.conversations.0.name=提示
SGE_OrcsWarehouse_gain.conversations.0.text=食人魔清出一条通往残破仓库的道路，随后进去搜寻可用的装备。
SGE_OrcsWarehouse_gain.conversations.1.name=提示
SGE_OrcsWarehouse_gain.conversations.1.text=仓库里所剩无几，但食人魔还是找到了几件合身的实用装备！（你的食人魔进阶为战争食人魔。）
SGE_OrcsWarehouse_select.conversations.0.selection-text=<html><body>一名地精斥候回来报告，附近有一座<br>废弃的军用仓库。仓库在最近的袭击中<br>损毁严重，驻守的人不是逃走了，<br>就是已经丧命。<br><br>要前去调查吗？</body></html>
SGE_PaladinAndBlackKnight_fight.conversations.0.name=圣骑士
SGE_PaladinAndBlackKnight_fight.conversations.0.text=走路看着点，你这穿黑甲的蠢货！再踩我的披风，我向神起誓，一定砍断你的腿。
SGE_PaladinAndBlackKnight_fight.conversations.1.name=黑骑士
SGE_PaladinAndBlackKnight_fight.conversations.1.text=难道我会怕一个神圣议会的蠢信徒，拿着剑乱挥几下？你是哪个骑士团的？你披风上的纹章，我怎么认不出来，嗯……
SGE_PaladinAndBlackKnight_fight.conversations.2.name=黑骑士
SGE_PaladinAndBlackKnight_fight.conversations.2.text=哦，当然了！原来是泥脚印骑士团！哈哈哈！
SGE_PaladinAndBlackKnight_fight.conversations.3.name=圣骑士
SGE_PaladinAndBlackKnight_fight.conversations.3.text=竟敢如此出言不逊！你也配自称骑士？拔剑吧，恶徒，我们就在这里做个了断！
SGE_PaladinAndBlackKnight_fight.conversations.4.name=提示
SGE_PaladinAndBlackKnight_fight.conversations.4.text=两名骑士冲向对方，厮打起来！英雄们及时出手制止，但双方都已受伤。
SGE_PaladinAndBlackKnight_kill.conversations.1.name=提示
SGE_PaladinAndBlackKnight_kill.conversations.1.text=圣骑士和黑骑士决定彻底解决彼此的恩怨。不幸的是，这场决斗闹出了人命。
SGE_RazorEdge.conversations.1.name=提示
SGE_RazorEdge.conversations.1.text=你的英雄举起剃刀之锋，剑刃似乎正微微颤动。这把可怕的武器，究竟夺走过多少性命？
SGE_Ruby_gain.conversations.1.name=提示
SGE_Ruby_gain.conversations.1.text=英雄们注意到树干上刻着一些奇怪的符号。在附近的泥土中挖掘片刻后，他们发现了一件宝物——一颗闪亮的宝石！
SGE_Skeletons_joins.conversations.1.name=提示
SGE_Skeletons_joins.conversations.1.text=穿行荒野时，几具骷髅加入了队伍。英雄们想必经过了一处没有标记的埋骨之地。
SGE_Swords_gain.conversations.1.name=提示
SGE_Swords_gain.conversations.1.text=队伍发现了一批无人看守的武器，是几个粗心的骑士巡逻时留下的。你们拿了几件装备，便赶紧离开了！
SGE_TrainPeasant.conversations.1.name=提示
SGE_TrainPeasant.conversations.1.text=扎好营地后，你趁着闲暇，决定让麾下的农民练练本领。
SGE_TrainPeasant.conversations.2.name=提示
SGE_TrainPeasant.conversations.2.text=大多数人难以承受训练的强度，但也有几人展现出过人的天赋！（两名步兵加入了你的军队。）
SGE_Traveller_gain.conversations.1.name=提示
SGE_Traveller_gain.conversations.1.text=一位疲惫的旅人请求在营地里安全地过夜。英雄们答应了，心怀感激的旅人便给队伍留下了一份礼物！
SGE_Treasure.conversations.1.name=提示
SGE_Treasure.conversations.1.text=自冒险开始以来，你的财富已大幅增长！如今，就连最出色的雇佣兵也愿意为你效力。
SGE_UndeadVillage_gain.conversations.0.name=提示
SGE_UndeadVillage_gain.conversations.0.text=你迅速搜查了村庄，却没找到任何能派上用场的东西。
SGE_UndeadVillage_gain.conversations.1.name=提示
SGE_UndeadVillage_gain.conversations.1.text=……除了那些刚死去的村民。他们的尸体正适合唤起亡灵！（几具骷髅加入了你的军队。）
SGE_UndeadVillage_select.conversations.0.selection-text=<html><body>月光下，队伍看清了远处一座人类村庄<br>的轮廓。从破碎的窗户和遍地的尸体来看，<br>村庄刚遭到洗劫，不知是否还有幸存者。<br><br>你打算怎么做？</body></html>
SGE_VampireAndWerewolf.conversations.0.name=吸血鬼
SGE_VampireAndWerewolf.conversations.0.text=我如此深爱黑夜。若没有这深沉的黑暗，我们又怎能看见繁星……
SGE_VampireAndWerewolf.conversations.1.name=狼人
SGE_VampireAndWerewolf.conversations.1.text=<html><body>得了，怎么又来了！<br>你那没完没了的浪漫絮叨。这回又爱上黑夜了？</body></html>
SGE_VampireAndWerewolf.conversations.2.name=狼人
SGE_VampireAndWerewolf.conversations.2.text=上次你念叨那个叫艾尔莎的姑娘，就已经够烦了……还是叫伊莎贝尔？算了，叫什么都一样。
SGE_VampireAndWerewolf.conversations.3.name=吸血鬼
SGE_VampireAndWerewolf.conversations.3.text=<html><body>我毛茸茸的朋友，你真是野蛮到了骨子里。我们热情的灵魂，应当自由地感受世间的一切！<br>告诉我，这个世界若没有……爱，会是什么模样？</body></html>
SGE_VampireAndWerewolf.conversations.4.name=狼人
SGE_VampireAndWerewolf.conversations.4.text=啊！你这甜得发腻的大道理，听得我都快喘不过气了。我活着就是为了鲜血和杀戮，每时每刻都是如此。
SGE_VampireAndWerewolf.conversations.5.name=狼人
SGE_VampireAndWerewolf.conversations.5.text=哦，对了，多情的百香果伯爵，你得知道，伊莎贝尔盯着我的六块腹肌，眼睛都挪不开！
SGE_Vulcano.conversations.1.name=提示
SGE_Vulcano.conversations.1.text=南方“三魔峰 (Three Devils)”中的一座轰鸣着喷发，将滚烫的岩浆喷向高空！火山灰遮蔽了天空，一直飘到了遥远的冰原 (Iceland)。
SGE_Winter.conversations.1.name=提示
SGE_Winter.conversations.1.text=冬天降临了这片大地！
SGE_Witch_gain.conversations.1.name=提示
SGE_Witch_gain.conversations.1.text=一位友善的女巫与队伍分享了几瓶色彩鲜艳的药剂！
