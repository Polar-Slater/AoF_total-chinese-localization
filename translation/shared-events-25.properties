# 通用事件第25批：元素使与炼金工匠商店
LevelElementalist01.text=<html><body>灰顶山 (Grey Top Mountain)，只有最勇敢的冒险者才敢踏足的地方。蜿蜒的山道、滚落的巨石和险峻的悬崖，让这段令人目眩的攀登绝非闲庭信步。不过，值得冒的险，总伴随着丰厚回报的诱惑……<br><br>倘若有冒险者登上灰顶山 (Grey Top Mountain) 的山巅，便会来到一座废弃已久的法师塔前，面对那扇施有魔法的双开大门。传说塔中藏着一件传奇宝物，那是昔日以此塔为家的元素使最珍视的收藏。<br><br>许多寻宝者都来碰过运气，却没有一个人活着下山，更别说带走那件凶名在外的宝物了。<br><br>你愿意接受挑战，成为第一批取回元素使秘宝的英雄吗？</body></html>
LevelElementalist01.location.name=元素使 (Elementalist)
LevelElementalist02.text=<html><body>队伍来到山脚下，头顶阴沉的天空怎么看都不是好兆头。他们发现了一顶补丁摞补丁的帐篷，旁边一名满脸皱纹的夏尔巴老人独自坐在将熄的火堆边。他胡须凌乱，衣衫褴褛，看上去倒像是个牧羊人，不像是招待旅客的。<br><br>英雄们走近时，老人站起身，指了指一条通往山上的崎岖小径。见他们开始攀登，他叹了口气，退回帐篷。队伍觉得，他们恐怕不是老人见过的第一批执意登上灰顶山 (Grey Top Mountain) 的人。<br><br>每向上一步，呼啸的风就更猛烈一分。不久，英雄们翻上一段陡坡，看见一排石像鬼挡住了去路。<br><br>他们还盼着这些只是装饰，最近的那只却猛地张开双翼，发出低吼，彻底打碎了这点侥幸！</body></html>
LevelElementalist03.location.name=石像鬼守卫 (Gargoyle Guardians)
LevelElementalist03.conversations.0.name=折翼
LevelElementalist03.conversations.0.text=站住，旅人！敢走上这条路，你们胆子不小，但也只能到此为止了。
LevelElementalist03.conversations.1.name=折翼
LevelElementalist03.conversations.1.text=主人有令，任何人不得通过。回去！
LevelElementalist03.conversations.2.name=闪电球
LevelElementalist03.conversations.2.text=滋滋……滋滋……
LevelElementalist03.triggers.on-battle-task-1.text=金锭×2：在第十回合结束前消灭所有石像鬼
LevelElementalist03.triggers.on-battle-task-2.text=闪电匕首：在第十二回合结束前赢得战斗
LevelElementalist04.text=<html><body>英雄们踏过石像鬼破碎的残骸，继续沿蜿蜒的山路前行。它们的主人将它们安置在此，究竟是为了阻挡闯入者，还是为了困住山中某种危险的东西？<br><br>不久，队伍走到了路的尽头，一座雕饰精美的魔法传送门高高矗立在那里。<br><br>传送门噼啪作响，骤然启动，喷出缕缕紫色能量，汇成旋转的漩涡。透过那混沌的表面，隐约能看见一座高塔的轮廓。<br><br>英雄们依次跃入，从另一端出来时，已置身山上高处。最后一名旅人刚穿过，传送门便啪地一声关闭了。他们只得望向前方的法师塔：高塔直刺愈发昏暗的天空，塔尖几乎触及云层。</body></html>
LevelElementalist05.text=<html><body>一群钢铁魔像一动不动地立在高塔巨门两侧，双臂抱在胸前，威严肃穆。<br><br>入口的石砌拱门完好如新，几乎看不出风化的痕迹，全然不像一座历经漫长岁月、饱受山顶狂风摧折的建筑。<br><br>英雄们小心翼翼地走近大门。魔像的头部吱嘎作响，转向队伍，其中一具用洪亮的金属嗓音开了口。</body></html>
LevelElementalist05.selection-text=<html><body>我虽没有双手，却能紧攥不放。<br>我偏爱黑暗，与光明势不两立。<br>无论权贵还是卑微之人，都对我熟悉无比，<br>因为我就住在人们心里！</body></html>
LevelElementalist05.location.name=魔像谜题 (Golems Riddle)
