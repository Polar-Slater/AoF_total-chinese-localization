LevelElementalist06b.triggers.on-battle-task-2.text=200金币：不损失任何单位
LevelElementalist07.text=<html><body>英雄们过了魔像这一关，高塔的大门随之敞开，仿佛在招呼队伍入内。昏暗的塔内隐约可见螺旋楼梯最底下的几级台阶。<br><br>不知爬了多久，英雄们终于来到塔顶。他们走上宽阔的露台，狂风扑面而来，势头猛烈得仿佛连身披最厚重铠甲的冒险者都能掀翻。<br><br>英雄们稍作停留，饱览这云端的景致。脚下的世界渺小得如同一座缩尺模型。<br><br>远处，曾令人望而生畏的红堡 (Red Castle)，如今也不过是玩具景观里的一件摆设。</body></html>
LevelElementalist08.text=<html><body>一路奋战，登上灰顶山 (Grey Top Mountain)，又爬到法师塔的高处，疲惫不堪的英雄们不禁觉得，元素使的秘宝一定就在附近。<br><br>狂风的尖啸中夹杂着微弱的能量爆响。队伍循声绕过露台，发现了一间地牢密室的入口。刚踏进去，英雄们便与一群守着另一座传送门的机械巨兽打了个照面。<br><br>发条多头蛇的金属颚咔哒作响，身后的魔法门闪动着狂乱的蓝光。<br><br>无论传送门的另一端通往何方，都得先解决这些机械守卫！</body></html>
LevelElementalist08.location.name=机械守卫 (Mechanical Wardens)
LevelElementalist09b.triggers.on-battle-task-1.text=闪电战锤：在第三回合结束前赢得战斗
LevelElementalist09b.triggers.on-battle-task-2.text=英勇药剂×2：不损失任何单位
LevelElementalist10.text=<html><body>走出传送门，英雄们发现自己身处一座岩洞，脚下正是一座石桥的桥头。<br><br>桥下的水池泛着幽幽蓝光，而桥的另一端竟放着一口宝箱！难道终于找到元素使的宝藏了？<br><br>队伍刚要前进，浓雾便从发光的池水中涌出，升腾而起，聚集在桥的另一端。伴着一道刺眼的闪光和一声回荡的轰鸣，浓雾凝成了一群元素生物战士。<br><br>它们嘶嘶作响，怒气腾腾，显然并不欢迎来客！</body></html>
LevelElementalist10.location.name=外域 (Outer Realm)
LevelElementalist11b.triggers.on-battle-task-1.text=敏捷戒指：在第七回合结束前赢得战斗
LevelElementalist11b.triggers.on-battle-task-2.text=500金币：不损失任何单位
LevelElementalist12.text=<html><body>最后一个元素生物化为烟雾，宝箱也被打开，英雄们发出了胜利的欢呼。<br><br>元素使的秘宝终于到手了：这是一柄魔法法杖，持有者能够借它召唤并指挥一支元素生物大军！<br><br>英雄们收拾停当，准备循着元素使法杖照亮的道路，返回传送门。</body></html>
LevelElementalist13.text=<html><body>元素使法杖的光芒照亮了一袭翻飞的斗篷。英雄们这才发现，一个气势逼人的身影早已在桥上等着他们。<br><br>更远处，传送门突然亮起。一支亡灵大军从中鱼贯而出，腐朽的战士围绕着那位显然是它们主人的身影摆开阵势。<br><br>披斗篷的敌人挥起一柄磨得光亮的骨剑，向队伍发出喀喀的威吓声！</body></html>
LevelElementalist13.conversations.0.name=达卡尔
LevelElementalist13.conversations.0.text=好大的胆子，那根法杖是我的！
LevelElementalist13.conversations.1.name=达卡尔
LevelElementalist13.conversations.1.text=愚蠢的冒险者！
LevelElementalist13.conversations.2.name=达卡尔
LevelElementalist13.conversations.2.text=<html><body>擅闯我的领地，你们要付出惨痛的代价。<br>仆从们，杀了他们！</body></html>
LevelElementalist15.conversations.0.name=达卡尔
LevelElementalist15.conversations.0.text=你们的生命即将终结，而你们的尸体将在我的军中永世效命！
LevelElementalist15.triggers.on-battle-task-1.text=迅捷头盔：在第五回合结束前杀死达卡尔
LevelElementalist15.triggers.on-battle-task-2.text=红宝石×2：不损失任何单位
LevelElementalist16.text=<html><body>四周尽是败兵留下的碎骨与腐尸。巫妖发出最后一声嘶吼，终于瘫倒在地。<br><br>他究竟是谁？那根法杖真如他所说，原本属于他吗？若是如此，元素使和这座废弃法师塔的背后，是否还藏着不为人知的往事？<br><br>英雄们或许永远无从知晓，但至少，他们这趟灰顶山 (Grey Top Mountain) 之行绝不会空手而归！</body></html>
LevelElementalist16.conversations.0.name=提示
LevelElementalist16.conversations.0.text=<html><body>你已完成《Age of Fear 3》的“元素使”扩展剧情！<br>恭喜！</body></html>
LevelElementalist16.conversations.1.name=提示
LevelElementalist16.conversations.1.text=元素使法杖可以召唤永久存在的元素生物，让它们伴你继续征战！
LevelArtificerShop01.text=<html><body>远离常走的道路，有一处僻静的地方，坐落着一家炼金工匠商店。<br><br>店主是一位退隐的法师，曾游历许多国度与异界。这家店并不刻意隐瞒自己的存在，却也只有寥寥几个冒险者知道它在哪儿。<br><br>队伍鱼贯而入时，目光敏锐的老贤者睁大了眼睛，却什么也没说。他想必见过比这还古怪的队伍。<br><br>他小心地合上皮面大书，问道：“敢问诸位，为何光临小店？”</body></html>
LevelArtificerShop01.location.name=炼金工匠商店 (Artificer's Shop)
LevelArtificerShop02.location.name=炼金工匠商店 (Artificer's Shop)
