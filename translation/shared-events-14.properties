# 通用事件第14批：三处魔力源泉与世界树。
LevelWorldTree01.text=<html><body>这棵古树历经无数代人的岁月，始终未受侵扰。它巍然矗立在冒险者们面前，宛如一座天然城堡，令人叹为观止。<br><br>英雄们跨过树下凹凸不平的地面和露出地表的树根，想要仔细看看那闪着微光的树皮。<br><br>走近之后，他们发现树皮上布满了繁复的纹样和古老的符文，仿佛是风雨经年累月雕琢而成。<br><br>置身树荫之下，冒险者们强烈地感到自己正被注视、被审视着，却不知那目光来自古树本身，还是栖居其中的无形树灵。<br><br>他们沿着树干向上望去，茂密的枝叶很快便遮住了视线，只能隐约看见高处的枝头闪着金光。<br><br>英雄们不禁思索，该怎样证明自己值得树灵认可，又该如何赢得古树的眷顾？</body></html>
LevelWorldTree01.location.name=世界树 (World Tree)
LevelManaSource01.text=<html><body>冒险者们眼前，一簇巨大的晶体破土而出，闪闪发光。浓烈的魔法气息从中散发出来，一股能量令周围的空气嗡嗡震响。他们知道，那正是纯粹的魔力。<br><br>这样暴露在外的魔力源泉极为危险，凝聚在璀璨晶石中的力量随时可能爆发，夺人性命。<br><br>即便冒险者们鼓起勇气靠近，也会感到一道无法穿越的电光屏障将他们推开，仿佛魔力源泉本身在竭力告诫他们不要接近。<br><br>不过，低头望去，他们发现地上散落着一些晶体碎片，想必是上次能量爆发时崩落的。碎片似乎触手可及，也许英雄们能赶在魔力源泉再次发作、把他们活活烧焦之前，取走一些？</body></html>
LevelManaSource01.location.name=魔力源泉 (Magic Source)
