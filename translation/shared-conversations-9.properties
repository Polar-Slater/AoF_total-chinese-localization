# 通用对话第9批：黑龙与吟游诗人达里乌斯的招募、情书及救援。
SXX_BardQuest_join.conversations.0.name=达里乌斯
SXX_BardQuest_join.conversations.0.text=啊，诸位愿意接纳我这样的人才？太好了，善良的诸位，太好了！我真是喜不自胜。
SXX_BardQuest_join.conversations.1.name=达里乌斯
SXX_BardQuest_join.conversations.1.text=你我携手，必将成就梦幻般的传奇；我们的乐曲，将令整个王国为之倾倒！
SXX_BardQuest_join.conversations.2.name=达里乌斯
SXX_BardQuest_join.conversations.2.text=向荣耀进发！前所未有的英雄壮举，正等待着我们！
SXX_BardQuest_love.conversations.0.name=达里乌斯
SXX_BardQuest_love.conversations.0.text=<html><body>哦！一封信……给我的？一定是仰慕者来信！<br>上面写了什么？我得赶紧看看！</body></html>
SXX_BardQuest_love.conversations.1.name=达里乌斯
SXX_BardQuest_love.conversations.1.text=“亲爱的英雄，我在囚室中给你写下这封信。我是一个被囚禁的年轻姑娘，心中的希望正一点点消逝。”
SXX_BardQuest_love.conversations.2.name=达里乌斯
SXX_BardQuest_love.conversations.2.text=“一伙可怕的恶徒绑架了我，将我关押起来。在最高的塔楼顶端，我的心正声声呼救。”
SXX_BardQuest_love.conversations.3.name=达里乌斯
SXX_BardQuest_love.conversations.3.text=“被囚于此，我终日惶恐不安。我不知道这些暴徒打算做什么，但恐怕用不了多久，他们就会玷污我。”
SXX_BardQuest_love.conversations.4.name=达里乌斯
SXX_BardQuest_love.conversations.4.text=“我以温柔的一吻封缄此信。求你救我脱离这可怕的命运，我爱情的甘露将永远属于你！”
SXX_BardQuest_love.conversations.5.name=达里乌斯
SXX_BardQuest_love.conversations.5.text=那些卑鄙的恶棍，竟将这朵娇花锁在牢中！我们别无选择——必须立刻动身，前去营救！
SXX_BardQuest_love.conversations.6.name=达里乌斯
SXX_BardQuest_love.conversations.6.text=出发吧，英雄们。跟我来，我知道那位美丽的姑娘被关在哪里！
SXX_BardQuest_select.conversations.0.name=达里乌斯
SXX_BardQuest_select.conversations.0.text=啊，诸位，幸会！你们带着的那件英勇壮举的见证，实在令人无法移开目光。想必你们刚立下了非凡功绩——巨龙可不会轻易交出自己的脑袋！
SXX_BardQuest_select.conversations.1.name=达里乌斯
SXX_BardQuest_select.conversations.1.text=能与如此英勇的一行人相遇，真是我的荣幸。诸位无疑是王国最勇敢的英雄，这一点，我可是很有眼光的！
SXX_BardQuest_select.conversations.2.name=达里乌斯
SXX_BardQuest_select.conversations.2.text=容我自我介绍，我是吟游诗人达里乌斯。十余年来，我曾与无数队伍同行，参与过形形色色的精彩冒险。
SXX_BardQuest_select.conversations.3.name=达里乌斯
SXX_BardQuest_select.conversations.3.text=亲眼见证他们的史诗壮举，总能带给我神赐的灵感。我的传世之作，几乎不用动笔便能自行成篇！
SXX_BardQuest_select.conversations.4.name=达里乌斯
SXX_BardQuest_select.conversations.4.text=哦，莫非是……？你们行囊中传来的那阵弦音，错不了，那是一把举世闻名的鲁特琴！
SXX_BardQuest_select.conversations.5.name=达里乌斯
SXX_BardQuest_select.conversations.5.text=既是勇武的战士，又是才华横溢的乐师，天哪。我实在想不出，还有谁能比诸位与我更加投契。
SXX_BardQuest_select.conversations.6.selection-text=<html><body>不过，要让这部乐章继续谱写，我还需要新的灵感。<br>亲历英雄壮举，可是什么都替代不了的！<br><br>若能让你我各展所长，一同踏上诸位的冒险之路，<br>你们的英雄之名，必将在我的《剑之歌》中流传不朽！<br><br>……当然，前提是诸位愿意让一位漂泊的吟游诗人同行。<br><br>英雄们，意下如何？</body></html>
SXX_BardQuest_shop.conversations.1.name=达里乌斯
SXX_BardQuest_shop.conversations.1.text=我无畏的同伴们，我们已来到命运之门前。看，这座堡垒中央，那座恶名昭彰的高塔正巍然耸立！
SXX_BardQuest_shop.conversations.2.name=达里乌斯
SXX_BardQuest_shop.conversations.2.text=抬头看！窗边那条飘动的手帕，你们看见了吗？挥动它的那只纤纤玉手，必定属于一位身陷困境的淑女！
SXX_BardQuest_shop.conversations.3.name=达里乌斯
SXX_BardQuest_shop.conversations.3.text=刻不容缓，快把这些恶徒解决掉吧。哪怕只耽搁片刻，那可人儿的芳心也会枯萎凋零！
SXX_BlackDragon_unlocked.conversations.1.name=提示
SXX_BlackDragon_unlocked.conversations.1.text=王国中出现了一条可怕的黑龙！传说这头巨兽守护着一件拥有独特力量的宝物。你愿意接受挑战吗？
