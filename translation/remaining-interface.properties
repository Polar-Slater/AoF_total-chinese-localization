MULTIPLAYERBATTLE_HINT=<html><body>这里是自定义战斗界面。设置玩家、创建或加入战斗等所有多人游戏操作都可在此进行。<br><br>多人游戏界面分为三个选项卡：<br><br>- <b>玩家设置</b>：设置玩家名称和默认队伍。玩家名称默认使用计算机的主机名。队伍下拉列表用于选择参加多人战斗的队伍，下方按钮可创建、编辑或删除队伍。<br><br><i>每支队伍都有总费用。创建多人战斗时，房主会设置队伍费用上限。加入战斗的玩家不能使用总费用超出上限的队伍。</i><br><br>- <b>创建战斗</b>：创建本地或多人战斗，供其他玩家以客户端模式加入。指定端口；若使用多个网络，也可指定网络地址。点击“启动服务器”即可开启服务器。其他选项可用于选择战场（从自定义战场文件载入）、设置总费用上限及队伍。<br><br>- <b>加入战斗</b>：连接到另一台计算机上的战斗。在此输入服务器的网络地址和端口号，也可为客户端连接设置代理服务器（见下文）。<br><br><i>注意：Age of Fear 使用 XML-RPC 调用进行多人游戏通信。虽然这会影响性能，但其流量被视为 HTTP，能通过大多数防火墙。在封闭的内网环境中，可使用 HTTP 或 SOCKS v4/5 代理。</i><br><br></body></html>
