# Main text batch 1: 27 common Human, Undead and Goblin units (name + description).
game.object.goblinarcher.name=地精弓箭手
game.object.goblinarcher.description=地精弓箭手是出了名的麻烦制造者。他们的箭术远称不上出色，但手中的短弓让兽人大军也能从远处猎杀敌人。
game.object.lich.name=巫妖
game.object.lich.description=巫妖是死灵法师梦寐以求的终极形态。这种近乎不朽的存在自私自利，一心只为进行骇人的实验而活。
game.object.wight.name=尸妖
game.object.wight.description=尸妖是未能成功转化为真正亡灵的死灵法师。这些可悲而饱受折磨的灵魂受诅咒所困，注定永远徘徊在人间。
game.object.zombieplague.name=瘟疫僵尸
game.object.zombieplague.description=这些面目骇人的僵尸生前死于瘟疫，又被死灵魔法唤起。如今，它们存在的唯一目的，就是传播那场夺走自己性命的致命瘟疫。
game.object.bowman.name=弓箭手
game.object.bowman.description=弓箭手是国王麾下技艺精湛的射手。他们往往自幼接受训练，齐射而出的箭雨足以令身经百战的敌人也为之胆寒。
game.object.goblinassassin.name=地精刺客
game.object.goblinassassin.description=地精的社会充斥着欺骗与背叛，地精刺客正是这些怯懦生物顺理成章的发展方向。在他们看来，从背后射杀敌人是值得鼓励的行径。
game.object.mage.name=法师
game.object.mage.description=法师运用奥术力量，以各种魔法效果支援己方部队，并驱散敌人的魔法。然而，随着魔力日益精进，他们的身体也愈发衰弱。
game.object.skeletonwarrior.name=骷髅战士
game.object.skeletonwarrior.description=骷髅战士是被唤起、再次投入战斗的阵亡士兵。这些亡灵保留着生前的战斗记忆，又不知疼痛为何物，因而成为了娴熟的战士。
game.object.archmage.name=大法师
game.object.archmage.description=最杰出的法师会晋升为大法师，获准研习最为深奥的咒术。大法师精通操纵时间与空间的魔法。
game.object.necromancer.name=死灵法师
game.object.necromancer.description=死灵术是一种扭曲的魔法，施术者试图唤起死者，将其变成供自己驱使的亡灵仆从。死灵法师已被逐出王国领土。
game.object.skeletonmage.name=骷髅法师
game.object.skeletonmage.description=法师的遗骸被重新唤起后，便成了骷髅法师。这些毫无心智的骷髅仍保留着生前的一小部分魔力。
game.object.footman.name=步兵
game.object.footman.description=步兵是国王军队的中坚力量。他们佩剑作战，剑术训练有素。和平时期，步兵也担任王国的民兵。
game.object.knight.name=骑士
game.object.knight.description=骑士出身贵族，身披全身板甲，骑乘战马。他们无所畏惧的英姿是士兵们勇气的源泉。
game.object.skeletonrider.name=骷髅骑兵
game.object.skeletonrider.description=骷髅骑兵常随死灵法师驰骋战场，充当骑兵部队。他们行动迅捷，生前积累的战斗经验使他们成为危险的敌人。
game.object.skeletonarcher.name=骷髅弓箭手
game.object.skeletonarcher.description=这些骷髅重拾了部分生前的作战经验，使用短弓进行远程攻击。一旦被迫卷入近战，他们便会很快被击碎。
game.object.vampirelord.name=吸血鬼领主
game.object.vampirelord.description=这种古老的生物曾是强大的黑暗祭司，后来遭到黑暗魔法腐化。强盛的黑暗力量盘踞在吸血鬼领主体内，既滋长了他对鲜血的渴望，也赋予了他魔法力量。
game.object.zombie.name=僵尸
game.object.zombie.description=僵尸是被死灵术重新唤起的人类尸体。它们感觉不到疼痛，又被迫服从主人的意志，因此是难以对付的敌人。
game.object.goblin.name=地精
game.object.goblin.description=地精的社会四分五裂，冷酷无情。然而，只要觉得数量优势能带来轻易的胜利，即使彼此敌对的地精也会联手作战。
game.object.paladin.name=圣骑士
game.object.paladin.description=圣骑士信奉圣光，誓死保卫国王，足迹遍布整个王国。这些神圣的战士在战场上担任指挥官，总是身先士卒，率领部下冲锋。
game.object.ghoul.name=食尸鬼
game.object.ghoul.description=死去的血肉长期受到邪恶黑魔法侵蚀，便会化为食尸鬼那扭曲残破的躯体。无论活物还是死物，食尸鬼都会吞食；它们也是众所周知的疾病传播者。
game.object.royalguard.name=皇家卫士
game.object.royalguard.description=皇家卫士是由老兵组成的精锐部队，负责保护王室。他们通常侍卫在君主身旁，也可能奉命前往前线作战。
game.object.skeleton.name=骷髅
game.object.skeleton.description=死灵法师能够唤起骷髅，让它们与敌人交战。这些骸骨战士虽然不够坚固，却不知疼痛，在近战中表现出惊人的顽强。
game.object.banshee.name=报丧女妖
game.object.banshee.description=报丧女妖是一种邪恶的女性幽灵，常被视为死亡的预兆与冥界的信使。她必须依靠自身魔力才能维持实体形态。
game.object.pikeman.name=长枪兵
game.object.pikeman.description=长枪兵是民兵中最基础的兵种。他们在进攻中作用有限，却擅长防守，手中的长枪能有效阻止敌人逼近。
game.object.vampire.name=吸血鬼
game.object.vampire.description=吸血鬼的历史与人类一样悠久，活了数百年的吸血鬼并不罕见。他们必须汲取生命精华，才能延续这种违背自然的存在。
game.object.alchemist.name=炼金术士
game.object.alchemist.description=炼金术士是放弃魔法、转而钻研炼金术的学者。他们最广为人知的追求，就是将普通金属转化为黄金。
game.object.artificer.name=炼金工匠
game.object.artificer.description=炼金工匠是地位崇高的炼金术阶层，也是每位炼金术士梦寐以求的晋升目标。他们精通各种魔法宝物。
