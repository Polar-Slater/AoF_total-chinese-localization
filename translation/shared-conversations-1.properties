# Shared events batch 1: all branches of thirteen selected event families.
SGE_AcidRain_select.conversations.0.selection-text=<html><body>一场滚烫的酸雨袭击了你的队伍，<br>那是某个疯狂法师召来的！<br>一些单位受了重伤，战士们怒不可遏，<br>决心报仇。施法者一定就在附近。<br><br>要追查那个疯狂法师吗？</body></html>
SGE_Alchemist_gain.conversations.1.name=提示
SGE_Alchemist_gain.conversations.1.text=一位炼金术士成功调制出了几瓶高品质药水！
SGE_AncientTemple_enter.conversations.0.name=提示
SGE_AncientTemple_enter.conversations.0.text=你们走进神殿，队伍中的一名骑士领着大家祈祷。
SGE_AncientTemple_enter.conversations.1.name=提示
SGE_AncientTemple_enter.conversations.1.text=最后一句祷词落下，耀眼的阳光从神殿穹顶的裂隙间洒落。（你的骑士已进阶为圣骑士！）
SGE_AncientTemple_select.conversations.0.selection-text=<html><body>你的队伍发现了一座古老的神殿。<br>尽管饱经岁月侵蚀，你仍能看出，<br>这里曾是备受尊崇的礼拜之所。<br>神殿大门敞开，仿佛在邀请你们进入。<br><br>你们要怎么做？</body></html>
SGE_AnimatedArmourUpgrade.conversations.1.name=提示
SGE_AnimatedArmourUpgrade.conversations.1.text=昨晚，你的工程师闲得发慌，便自作主张地升级了你的活化铠甲！
SGE_ArchersTournament.conversations.1.name=提示
SGE_ArchersTournament.conversations.1.text=<html><body>你的弓箭手们自行组织了一场射术比赛！<br>（所有弓箭手都获得了额外经验值。）</body></html>
SGE_Bear_attack.conversations.1.name=提示
SGE_Bear_attack.conversations.1.text=一头狂暴的野熊从附近的洞穴中冲了出来！英雄们奋力击退了它，但队伍中仍有人受了伤。
SGE_BeastmasterAndBard.conversations.0.name=达里乌斯
SGE_BeastmasterAndBard.conversations.0.text=泰娅……有些话，我一定要说给你听。
SGE_BeastmasterAndBard.conversations.1.name=泰娅
SGE_BeastmasterAndBard.conversations.1.text=哦？什么事，吟游诗人？
SGE_BeastmasterAndBard.conversations.2.name=达里乌斯
SGE_BeastmasterAndBard.conversations.2.text=是这样，我……从见到你的第一眼起，我就深深地爱上了你。
SGE_BeastmasterAndBard.conversations.3.name=达里乌斯
SGE_BeastmasterAndBard.conversations.3.text=我的爱意再也无法封存在瓶中！这沸腾的激情，简直要把我烧成灰烬！
SGE_BeastmasterAndBard.conversations.4.name=泰娅
SGE_BeastmasterAndBard.conversations.4.text=哈！那你最好把瓶塞塞回去。你配不上我，吟游诗人。
SGE_BeastmasterAndBard.conversations.5.name=达里乌斯
SGE_BeastmasterAndBard.conversations.5.text=<html><body>什……？！为什么，泰娅？<br>我的美人，为了赢得你的爱，我什么都愿意做！</body></html>
SGE_BeastmasterAndBard.conversations.6.name=达里乌斯
SGE_BeastmasterAndBard.conversations.6.text=握住我的手吧，你难道感觉不到我们之间涌动的热情吗？
SGE_BeastmasterAndBard.conversations.7.name=泰娅
SGE_BeastmasterAndBard.conversations.7.text=把你的汗手收回去，吟游诗人。不然断的可就不只是琴弦了。我警告你。
SGE_BeastmasterAndBard.conversations.8.name=达里乌斯
SGE_BeastmasterAndBard.conversations.8.text=可、可是……泰娅，我们就像和声，只有在一起才完整。来吧，听从你的心，和我跳支舞！
SGE_BeastmasterAndBard.conversations.9.name=泰娅
SGE_BeastmasterAndBard.conversations.9.text=给！我！放！手！
SGE_BeastmasterAndBard.conversations.10.name=达里乌斯
SGE_BeastmasterAndBard.conversations.10.text=啊——！！！
SGE_BeerContest_fail.conversations.0.name=提示
SGE_BeerContest_fail.conversations.0.text=你的矮人一慌神，第一品脱麦酒就呛进了肺里。他差点被呛死，另一位参赛者趁机遥遥领先，再也追不上了。
SGE_BeerContest_fail.conversations.1.name=提示
SGE_BeerContest_fail.conversations.1.text=看来，想夺得威风的“麦酒之王”称号，只能改日再战了。
SGE_BeerContest_select.conversations.0.selection-text=<html><body>队伍馋起了麦酒，于是来到附近的酒馆。<br>来得正巧，这里正在举办喝酒比赛！<br>只需付一小笔报名费，<br>就有机会争夺“麦酒之王”的称号。<br><br>要派你最能喝的矮人参赛吗？<br>（你拥有 ${gold} 金币）</body></html>
SGE_BeerContest_success.conversations.0.name=提示
SGE_BeerContest_success.conversations.0.text=你的矮人把对手全比了下去，还创下了当地的新纪录！酒馆老板从没见过有人能这么快喝光一桶酒。
SGE_BeerContest_success.conversations.1.name=提示
SGE_BeerContest_success.conversations.1.text=<html><body>“麦酒之王”的称号归你了！<br>（你获得了200金币奖金。）</body></html>
SGE_BlademasterAndOrc.conversations.0.name=剑术大师
SGE_BlademasterAndOrc.conversations.0.text=为什么要把这些绿皮蛮子留在队里？他们毫无纪律，根本不懂战术，更别提那股臭味了。
SGE_BlademasterAndOrc.conversations.1.name=剑术大师
SGE_BlademasterAndOrc.conversations.1.text=我们不是巡回马戏团！我们是战团！
SGE_BlademasterAndOrc.conversations.2.name=兽人
SGE_BlademasterAndOrc.conversations.2.text=那帮人类都是软蛋，又慢又懒！等他们唠叨完、盘算完，架早就打完啦！
SGE_BlademasterAndOrc.conversations.3.name=兽人
SGE_BlademasterAndOrc.conversations.3.text=这儿不是读书会！咱们是威风凛凛的帮派！
SGE_BloodMoon.conversations.1.name=提示
SGE_BloodMoon.conversations.1.text=昨夜晴空无云，血月泛着不祥的猩红光芒。英雄们整夜守望，所幸没有邪恶生物靠近营地。
SGE_Crossroads.conversations.1.name=提示
SGE_Crossroads.conversations.1.text=英雄们来到一块饱经风雨的木路牌前，路牌指向岔路口的不同方向。接下来的冒险，又会把他们带往何处？
SGE_KnightsTournament.conversations.1.name=提示
SGE_KnightsTournament.conversations.1.text=你的骑士们自行组织了一场剑术比试！（骑士们在比试中受了伤，也都获得了额外经验值。）
SGE_Sunset.conversations.1.name=提示
SGE_Sunset.conversations.1.text=今天的落日美得令人屏息！夕阳缓缓沉入群山之后，英雄们凝望着大自然的壮丽景色，久久沉醉其中。
