# 通用事件第16批：珍珠美人鱼与萨满小屋。
LevelPearlMermaid01.text=<html><body>一位光彩照人的年轻美人鱼慵懒地倚在岸边，尾巴浸在浅水中，漫不经心地望着大海。<br><br>冒险者们走近时，美人鱼转过目光，朝他们露齿一笑。<br><br>她调皮地用尾巴拍了拍水面，随后翻身趴下，双手托着下巴。英雄们越走越近，她的笑意也越来越浓。<br><br>她开口说道：“你们好，旅行者！哎呀，你们这群人可真有意思。这样吧，要是谁有一颗珍珠，愿意割爱，我就拿深海里的东西来交换。成交吗？”</body></html>
LevelPearlMermaid01.selection-text=你打算怎么回答？
LevelPearlMermaid01.location.name=珍珠美人鱼 (Pearl Mermaid)
LevelPearlMermaid01.triggers.on-select-1.text=暂时不了，我们回去吧。
LevelPearlMermaid01.triggers.on-select-1.description=返回世界地图。
LevelPearlMermaid01.triggers.on-select-2.text=给美人鱼一颗珍珠（每天一次）
LevelPearlMermaid01.triggers.on-select-2.description=用一颗珍珠换取一件随机物品，每天一次。
LevelPearlMermaid01.triggers.on-select-3.text=给美人鱼一颗黑珍珠
LevelPearlMermaid01.triggers.on-select-3.description=给美人鱼一颗黑珍珠。
LevelPearlMermaid01.triggers.on-select-20.text=调试：添加物品并重置。
LevelShamanHut01.text=<html><body>在遥远的平原上，一位睿智的萨满独居于破旧的小屋中。虽已年迈，他仍不断研习自己的法术。<br><br>小屋外表饱经风霜，任谁也难以想到，其中竟会举行如此精妙的仪式。<br><br>这位萨满是远近闻名的部落巫术大师。据说，他能与灵体沟通，借此驱除诅咒。<br><br>冒险者们走近时，他打开屋门，挥了挥木杖，示意他们进去。<br><br>（萨满可以卸下英雄装备的诅咒物品，但任务物品除外。）</body></html>
LevelShamanHut01.selection-text=<html><body>要请萨满施展净化仪式吗？<br>（每名英雄收费200金币。你有${gold}金币。）</body></html>
