LevelWindmill01.text=<html><body>即使是一头狂怒的巨魔，也不可能把这座风车磨坊 (Windmill) 毁得更彻底。它已经完全坍塌，周围散落着砖块、倒下的篱笆桩和高高的杂草。<br><br>重建需要费一番工夫，但只要投入足够资金，磨坊的风叶就能重新转动。<br><br>冒险者们愿意拿出一些财富，让这座支撑当地生计的磨坊重获新生吗？</body></html>
LevelWindmill01.selection-text=<html><body>要重建风车磨坊 (Windmill) 吗？<br>（磨坊主每天支付500金币。你拥有 ${gold} 金币。）</body></html>
LevelWindmill01.location.name=风车磨坊 (Windmill)
LevelWindmill01.triggers.on-select-1.text=暂时不了，回去吧。
LevelWindmill01.triggers.on-select-1.description=返回世界地图。
LevelWindmill01.triggers.on-select-2.text=重建风车磨坊 (Windmill)（1,500金币）。
LevelWindmill01.triggers.on-select-2.description=修复需要1,500金币。=BR=风车磨坊 (Windmill) 每天为你带来500金币。
LevelWindmill02.text=<html><body>风车磨坊 (Windmill) 高高耸立，堪称砖石工艺与工程技艺的杰作。风叶转个不停，仿佛在向走近的英雄们挥手致意。<br><br>心怀感激的磨坊主笑容满面地走出来，迎接冒险者，邀请你们进屋分享他的劳动成果。<br><br>他做的黄油堪称王国一绝，难怪几乎每天都能卖个精光！<br><br>（磨坊主每日缴纳税金。）</body></html>
LevelWindmill02.location.name=风车磨坊 (Windmill)
