# 通用事件第27批：染血的信与绑匪的踪迹
LevelWerewolf08.text=<html><body>一名倒下的猎手胸前口袋里露出一封皱巴巴的信，引起了冒险者们的注意。<br><br>他们仔细查看这张染血的羊皮纸，发现上面的字写得歪歪扭扭，几乎无法辨认。内容似乎是：<br><br>“把那野兽带到巨魔尖峰 (troll spire)。我认识个好人，他肯定想见。”<br><br>英雄们放下信，商量了片刻。这封信是谁写的？冈瑟的女儿会不会就被那人关着？<br><br>尽管冈瑟已经告诫过他们其中的危险，冒险者们还是决定帮他查清这场阴谋，动身前往巨魔尖峰 (Trollspire)。</body></html>
LevelWerewolf08.location.name=染血的信 (Bloody Letter)
LevelWerewolf09.text=<html><body>透过寂静森林 (Silent Forest) 高大的树木，可以看见巨魔尖峰 (Trollspire) 直插云霄的峰顶，在月光下闪耀。<br><br>化作狼人的冈瑟在前方飞奔，队伍紧随其后，冲出树林，直奔下一个目的地。<br><br>巨魔尖峰 (Trollspire) 的山脚渐渐映入眼帘，冒险者们发现一群身形巨大的类人生物早已在那里严阵以待。<br><br>其中一名强壮的独眼巨人走上前，朝赶来的英雄们比画着什么。他的同伙则爆发出一阵令人胆寒的大笑。</body></html>
LevelWerewolf09.conversations.0.name=阿尔戈斯
LevelWerewolf09.conversations.0.text=哦嚯！新鲜肉，跟加茨老大说的一样。
LevelWerewolf09.conversations.1.name=布隆忒斯
LevelWerewolf09.conversations.1.text=好吃，好吃！咱们把他们吞了！
LevelWerewolf09.conversations.2.name=斯忒洛佩斯
LevelWerewolf09.conversations.2.text=不！咱们该抢他们。
LevelWerewolf09.conversations.3.name=加茨
LevelWerewolf09.conversations.3.text=<html><body>大蠢货们，闭嘴！吃也吃，抢也抢！<br>小子们，上去砸！</body></html>
LevelWerewolf09.conversations.4.name=布隆忒斯
LevelWerewolf09.conversations.4.text=等等，那现在吃他们，还是……不吃？我糊涂了。
LevelWerewolf09.conversations.5.name=斯忒洛佩斯
LevelWerewolf09.conversations.5.text=要是没抢就整个吞了，肚子得等到明天才把金币还回来……
LevelWerewolf09.conversations.6.name=加茨
LevelWerewolf09.conversations.6.text=<html><body>啊！先用棍子打死，待会儿再吃！<br>（一群白痴！）</body></html>
LevelWerewolf09.conversations.7.name=加茨
LevelWerewolf09.conversations.7.text=（早知道就该答应泽兰，加入他的帮派。我现在早发财了。）
LevelWerewolf11a.conversations.0.name=加茨
LevelWerewolf11a.conversations.0.text=杀光他们！
LevelWerewolf11a.conversations.1.name=吉尔洛克
LevelWerewolf11a.conversations.1.text=我喜欢这帮家伙的作风，上来就打，不说废话。
LevelWerewolf11a.conversations.2.name=布隆忒斯
LevelWerewolf11a.conversations.2.text=串烤小矮子……
LevelWerewolf11a.conversations.3.name=斯忒洛佩斯
LevelWerewolf11a.conversations.3.text=法师蘑菇汤……
LevelWerewolf11a.conversations.4.name=芬
LevelWerewolf11a.conversations.4.text=听着还是些颇有创意的大厨呢。
LevelWerewolf11a.conversations.5.name=吉尔洛克
LevelWerewolf11a.conversations.5.text=可不是嘛，你送他们一颗火球烧菜，他们准喜欢！
LevelWerewolf11a.triggers.on-battle-task-1.text=抗魔滴剂×2：在第三回合结束前杀死加茨
LevelWerewolf11a.triggers.on-battle-task-2.text=300金币：在第五回合结束前赢得战斗
LevelWerewolf11b.conversations.0.name=加茨
LevelWerewolf11b.conversations.0.text=杀光他们！
LevelWerewolf11b.conversations.1.name=巴尔瓦
LevelWerewolf11b.conversations.1.text=<html><body>饶了我吧，胖子，天都还没亮呢。<br>就不能吃过早饭再打吗？</body></html>
LevelWerewolf11b.conversations.2.name=布隆忒斯
LevelWerewolf11b.conversations.2.text=老大，我同意！好饿啊……
LevelWerewolf11b.conversations.3.name=加茨
LevelWerewolf11b.conversations.3.text=啊！砸死他们，不然我就砸死你！！
LevelWerewolf11b.conversations.4.name=巴尔瓦
LevelWerewolf11b.conversations.4.text=唉，真是一群野蛮人。少吃一顿又饿不死。
LevelWerewolf11b.triggers.on-battle-task-1.text=抗魔滴剂×2：在第三回合结束前杀死加茨
LevelWerewolf11b.triggers.on-battle-task-2.text=300金币：在第五回合结束前赢得战斗
LevelWerewolf12.conversations.0.name=加茨
LevelWerewolf12.conversations.0.text=啊！肚子……开了……
LevelWerewolf12.conversations.1.name=冈瑟
LevelWerewolf12.conversations.1.text=<html><body>独眼巨人，这封信是谁寄的？<br>你知道些什么？</body></html>
LevelWerewolf12.conversations.2.name=加茨
LevelWerewolf12.conversations.2.text=我，我……呃，你这狼崽子真会惹麻烦……
LevelWerewolf12.conversations.3.name=冈瑟
LevelWerewolf12.conversations.3.text=回答我！
LevelWerewolf12.conversations.4.name=加茨
LevelWerewolf12.conversations.4.text=在冰原 (Iceland) 的旧废墟，碰见个男人，给的钱可多了。我们去你家等那女人，谁知道你一身毛跑出来，闹个没完。我一棍子打在那女的身上……
LevelWerewolf12.conversations.5.name=冈瑟
LevelWerewolf12.conversations.5.text=<html><body>什……什么？<br>是你杀了我妻子？！</body></html>
LevelWerewolf12.conversations.6.name=加茨
LevelWerewolf12.conversations.6.text=本来只想绑人，可你把我惹火了，呃……
LevelWerewolf12.conversations.7.name=冈瑟
LevelWerewolf12.conversations.7.text=<html><body>我女儿在哪儿？！<br>是不是你抓走了她？！</body></html>
LevelWerewolf12.conversations.8.name=加茨
LevelWerewolf12.conversations.8.text=呃……抓了那小孩。那男人吩咐的。让我们在神庙废墟等。
LevelWerewolf12.conversations.9.name=加茨
LevelWerewolf12.conversations.9.text=放了我吧，狼崽子。我全说了，我就是拿钱办事，呃……
LevelWerewolf12.conversations.10.name=冈瑟
LevelWerewolf12.conversations.10.text=<html><body>拿钱办事？！<br>你这种怪物，死有余辜。<br>吼——！</body></html>
LevelWerewolf12.conversations.11.name=加茨
LevelWerewolf12.conversations.11.text=<html><body>不——！<br>啊啊啊……</body></html>
LevelWerewolf13.text=<html><body>告别巨魔尖峰 (Trollspire)，队伍继续寻找神庙废墟。<br><br>冒险者们惊讶地发现，这里竟然有住客。<br><br>他们在安全的距离外听见了诡异的吟唱，看见一道道阴影在荒废的神庙中蜿蜒游动。这里曾有魔法生灵栖居，如今仍是如此。<br><br>他们小心地靠近，想看个究竟……</body></html>
LevelWerewolf13.location.name=绑匪的踪迹 (Kidnappers Trail)
LevelWerewolf15.conversations.0.name=娜迦战士
LevelWerewolf15.conversations.0.text=嘶……怎么回事？谁敢打断我们的神圣仪式？！
LevelWerewolf15.conversations.1.name=冈瑟
LevelWerewolf15.conversations.1.text=你们对我的家人做了那些事，都得偿命，邪恶的魔鬼！
LevelWerewolf15.conversations.2.name=娜迦战士
LevelWerewolf15.conversations.2.text=嘶……满口亵渎之言！这头疯兽是谁？！
LevelWerewolf15.conversations.3.name=冈瑟
LevelWerewolf15.conversations.3.text=吼——！吼——！
LevelWerewolf15.conversations.4.name=娜迦战士
LevelWerewolf15.conversations.4.text=<html><body>嘶……连来历都不肯说？<br>姐妹们，准备战斗！</body></html>
LevelWerewolf15.conversations.5.name=娜迦战士
LevelWerewolf15.conversations.5.text=嘶……消灭异端！
LevelWerewolf15.conversations.6.name=提示
LevelWerewolf15.conversations.6.text=娜迦战士是极为强大的对手。每个娜迦都能多次攻击或射击，迅速消耗你麾下单位的战力。
LevelWerewolf16.text=<html><body>面对成群的娜迦，冈瑟的怒火彻底化为狂暴，他完全失去了理智，陷入疯狂之中。<br><br>持剑的蛇女源源不断地从废墟中涌出。每倒下一名姐妹，就有三名补上她的位置。<br><br>被愤怒冲昏头脑的冈瑟没有意识到，自己已被团团围住。娜迦的包围圈越收越紧……<br><br>突然，一名娜迦发出令人毛骨悚然的尖啸，战斗随之一滞！</body></html>
LevelWerewolf16.conversations.0.name=娜迦战士
LevelWerewolf16.conversations.0.text=嘶……这头怪兽究竟想干什么？！
LevelWerewolf16.conversations.1.name=冈瑟
LevelWerewolf16.conversations.1.text=<html><body>我的妻子，我的女儿，你们把她们都从我身边夺走了！<br>吼——！</body></html>
LevelWerewolf16.conversations.2.name=娜迦战士
LevelWerewolf16.conversations.2.text=<html><body>姐妹们，抓住他！<br>嘶……这头野兽恨的不是我们。</body></html>
LevelWerewolf16.conversations.3.name=冈瑟
LevelWerewolf16.conversations.3.text=<html><body>你们还想说自己无辜？不可能！<br>那个独眼巨人说了，你们就在这里！</body></html>
LevelWerewolf16.conversations.4.name=娜迦战士
LevelWerewolf16.conversations.4.text=你说的是加茨那个大块头？嘶……他可不是我们姐妹的朋友！
LevelWerewolf16.conversations.5.name=冈瑟
LevelWerewolf16.conversations.5.text=他再也当不了谁的朋友了！放开我，你们这群蛇！
LevelWerewolf16.conversations.6.name=娜迦战士
LevelWerewolf16.conversations.6.text=嘶……姐妹们，让他闭嘴！
LevelWerewolf17.text=<html><body>娜迦凭着人数优势，将冈瑟死死按在地上，任他龇牙乱咬，直到他明白挣扎也是徒劳。英雄们放下武器，娜迦战士也收起兵刃，示意愿意交谈。<br><br>她解释说，姐妹们几天前才开始修复这片神庙废墟，净化此地曾经举行死灵仪式留下的污秽。<br><br>无论冈瑟要找的那个阴险男人是谁，他都早已另觅他处了。<br><br>娜迦战士刚说完，冈瑟便猛烈挣动，从层层压在身上的蛇躯间挣脱出来。<br><br>英雄们退开，娜迦们则站在原地注视着他们，等着他们离去。</body></html>
