# 维克多的实验独立对白第1批：27组、238条内容。
CONVERSATIONS=zombiefrankydlc
LOCALE=zh
Z01_Franky_damage.conversations.0.name=弗兰基
Z01_Franky_damage.conversations.0.text=呜噜噜……
Z01_Franky_damage.conversations.1.name=弗兰基
Z01_Franky_damage.conversations.1.text=……！
Z01_Franky_damage.conversations.2.name=弗兰基
Z01_Franky_damage.conversations.2.text=朋友们，是我！疼痛似乎能唤醒这混乱的意识。别停——
Z01_Franky_damage.conversations.3.name=弗兰基
Z01_Franky_damage.conversations.3.text=吼——！！！
ZXX_BrainInJar_angela_init_select.conversations.0.name=安吉拉
ZXX_BrainInJar_angela_init_select.conversations.0.text=……有人吗？谁藏在这里？
ZXX_BrainInJar_angela_init_select.conversations.1.name=罐中大脑
ZXX_BrainInJar_angela_init_select.conversations.1.text=嗯？哦，哎呀！当然是我啦！
ZXX_BrainInJar_angela_init_select.conversations.2.name=安吉拉
ZXX_BrainInJar_angela_init_select.conversations.2.text=……？
ZXX_BrainInJar_angela_init_select.conversations.3.name=罐中大脑
ZXX_BrainInJar_angela_init_select.conversations.3.text=<html><body>别害怕，年轻的女士！是我。<br>……或者说，是我剩下的这部分。</body></html>
ZXX_BrainInJar_angela_init_select.conversations.4.name=安吉拉
ZXX_BrainInJar_angela_init_select.conversations.4.text=<html><body>这是什么……？！等等，你……你只是……一个大脑！<br>一个脱离身体、泡在一罐盐水里的大脑！</body></html>
ZXX_BrainInJar_angela_init_select.conversations.5.name=罐中大脑
ZXX_BrainInJar_angela_init_select.conversations.5.text=观察敏锐！没错，这正是我目前生活状态的准确写照。当然，我以前也有身体……
ZXX_BrainInJar_angela_init_select.conversations.6.name=安吉拉
ZXX_BrainInJar_angela_init_select.conversations.6.text=让我猜猜，你把它妥善保存在这间阴森实验室的某个角落了。需要帮你把两部分凑回去吗？
ZXX_BrainInJar_angela_init_select.conversations.7.name=罐中大脑
ZXX_BrainInJar_angela_init_select.conversations.7.text=<html><body>天哪，不是的，恐怕我原来的身躯早就没了。很多年前，一场可怕的事故。<br>一声巨响，烈火熊熊……血淋淋的细节就先不说了。</body></html>
ZXX_BrainInJar_angela_init_select.conversations.8.name=罐中大脑
ZXX_BrainInJar_angela_init_select.conversations.8.text=如你所见，我逃过一劫，最重要的部分完好无损！不过，你刚才说愿意帮忙，这倒很有意思……
ZXX_BrainInJar_angela_init_select.conversations.9.name=安吉拉
ZXX_BrainInJar_angela_init_select.conversations.9.text=啊。大脑先生，我有种强烈的预感，自己马上就要后悔这么说了。
ZXX_BrainInJar_angela_init_select.conversations.10.name=罐中大脑
ZXX_BrainInJar_angela_init_select.conversations.10.text=哪有的事！还有，请叫我维克多。
ZXX_BrainInJar_angela_init_select.conversations.11.name=维克多的大脑
ZXX_BrainInJar_angela_init_select.conversations.11.text=不知你随身的物品里，有没有什么……解剖标本？
ZXX_BrainInJar_angela_init_select.conversations.12.name=安吉拉
ZXX_BrainInJar_angela_init_select.conversations.12.text=抱歉，维克，我把装框的蝴蝶标本集留在家里了。
ZXX_BrainInJar_angela_init_select.conversations.13.name=维克多的大脑
ZXX_BrainInJar_angela_init_select.conversations.13.text=哦呵呵！不，我想要的可得结实得多。
ZXX_BrainInJar_angela_init_select.conversations.14.name=维克多的大脑
ZXX_BrainInJar_angela_init_select.conversations.14.text=只要有你的慷慨相助，我相信凭这间实验室的技术，就能重建我的身体！
ZXX_BrainInJar_angela_init_select.conversations.15.name=维克多的大脑
ZXX_BrainInJar_angela_init_select.conversations.15.text=你能相信吗？那场，呃……那场事故发生时，我们眼看就要完成有史以来第一次意识转移了。
ZXX_BrainInJar_angela_init_select.conversations.16.name=安吉拉
ZXX_BrainInJar_angela_init_select.conversations.16.text=就是一声巨响、烈火熊熊的那次？
ZXX_BrainInJar_angela_init_select.conversations.17.name=维克多的大脑
ZXX_BrainInJar_angela_init_select.conversations.17.text=哦，不，不是那次！走廊那头的档案管理员，那个该死的瓦尔德曼博士，发现一批旧手稿里闹了象鼻虫……
ZXX_BrainInJar_angela_init_select.conversations.18.name=维克多的大脑
ZXX_BrainInJar_angela_init_select.conversations.18.text=……便决定临时来一次熏蒸除虫……那蠢货弄出了气体泄漏，随后发生爆炸，致命的蒸气充满了整座设施。
ZXX_BrainInJar_angela_init_select.conversations.19.name=维克多的大脑
ZXX_BrainInJar_angela_init_select.conversations.19.text=所有人都得立刻撤离。慌乱之中，我和我的罐子被落下了……
ZXX_BrainInJar_angela_init_select.conversations.20.name=安吉拉
ZXX_BrainInJar_angela_init_select.conversations.20.text=等等，我一直在吸毒气？！
ZXX_BrainInJar_angela_init_select.conversations.21.name=维克多的大脑
ZXX_BrainInJar_angela_init_select.conversations.21.text=哦！呃，这个……要是你没看出重影，也没咳血，应该就没事。
ZXX_BrainInJar_angela_init_select.conversations.22.name=维克多的大脑
ZXX_BrainInJar_angela_init_select.conversations.22.text=我估计辐射消退、空气彻底换新，需要几十年。现在也差不多过去这么久了，所以……
ZXX_BrainInJar_angela_init_select.conversations.23.name=安吉拉
ZXX_BrainInJar_angela_init_select.conversations.23.text=天哪！你明明只剩个脑子了，维克，我还以为你至少能多长点心呢。
ZXX_BrainInJar_angela_init_select.conversations.24.name=维克多的大脑
ZXX_BrainInJar_angela_init_select.conversations.24.text=抱歉！科学是场危险的游戏，可也正是这无处不在的灾难威胁，让它妙趣横生。
ZXX_BrainInJar_angela_init_select.conversations.25.name=维克多的大脑
ZXX_BrainInJar_angela_init_select.conversations.25.text=<html><body>哦，不说这些废话了！我实在太久没找人聊天，但也不该这么失礼。<br>拜托，你愿意帮我吗？</body></html>
ZXX_BrainInJar_angela_init_select.conversations.26.selection-text=<html><body>维克多的大脑急切地等着你的答复，<br>兴奋地在罐子里上下浮动。谁也不知道，<br>他接下来会提出什么要求。<br><br>你愿意帮助维克多吗？</body></html>
ZXX_BrainInJar_quest1_select.conversations.0.name=维克多的大脑
ZXX_BrainInJar_quest1_select.conversations.0.text=希望接下来的请求不会让你太不安，不过，看起来你并不是胆小怕血的人。
ZXX_BrainInJar_quest1_select.conversations.1.name=维克多的大脑
ZXX_BrainInJar_quest1_select.conversations.1.text=我想也没必要拐弯抹角了。长话短说，首先得请你收集几样……东西。
ZXX_BrainInJar_quest1_select.conversations.2.name=维克多的大脑
ZXX_BrainInJar_quest1_select.conversations.2.text=<html><body>……我说的东西，当然是，呃……<br>零件。身体零件。没什么稀罕的，都是你能想到的那些部位。</body></html>
ZXX_BrainInJar_quest1_select.conversations.3.name=维克多的大脑
ZXX_BrainInJar_quest1_select.conversations.3.text=有一条腿、一条胳膊、一颗心脏、一些肉，还有最重要的——一个新大脑，我们就能开始了！
ZXX_BrainInJar_quest1_select.conversations.4.name=维克多的大脑
ZXX_BrainInJar_quest1_select.conversations.4.text=只要部位保存完好，几乎什么样的捐献者都行。我一点也不挑。
ZXX_BrainInJar_quest1_select.conversations.5.name=维克多的大脑
ZXX_BrainInJar_quest1_select.conversations.5.text=在实验阶段，我们通常会派个实习生去当地墓地，咳，“采集”材料。
ZXX_BrainInJar_quest1_select.conversations.6.name=维克多的大脑
ZXX_BrainInJar_quest1_select.conversations.6.text=死者完全能胜任，所以留意那些夜里蹒跚游荡的东西吧！
ZXX_BrainInJar_quest1_select.conversations.7.name=维克多的大脑
ZXX_BrainInJar_quest1_select.conversations.7.text=你问为什么要新大脑？唉，我现在寄居的这个就快到使用年限了。该死的盐水！
ZXX_BrainInJar_quest1_select.conversations.8.name=维克多的大脑
ZXX_BrainInJar_quest1_select.conversations.8.text=你要花点时间考虑也没关系，独处的这些年让我变得极有耐心。
ZXX_BrainInJar_quest1_select.conversations.9.name=维克多的大脑
ZXX_BrainInJar_quest1_select.conversations.9.text=<html><body>再说，我哪儿也去不了。你知道上哪儿找我！<br>好好考虑吧，我等你的答复！</body></html>
ZXX_BrainInJar_quest1_select.conversations.10.selection-text=<html><body>说完这个令人毛骨悚然的请求，<br>维克多的大脑在罐子里转着圈，<br>等待你的答复。<br><br>你愿意收集身体部位吗？<br><br>（身体部位从被击败的亡灵身上收集，<br>共需五个部位。）</body></html>
ZXX_BrainInJar_quest2_select.conversations.0.name=维克多的大脑
ZXX_BrainInJar_quest2_select.conversations.0.text=欢迎回来！见你回来真让人高兴，真希望罐子里装的是香槟，好庆祝一番。
ZXX_BrainInJar_quest2_select.conversations.1.name=罐中大脑
ZXX_BrainInJar_quest2_select.conversations.1.text=这趟收集之旅如何？咱们说的那些部位，找得顺利吗？
ZXX_BrainInJar_quest2_select.conversations.2.selection-text=<html><body>你收集到足够的身体部位了吗？<br><br>（身体部位从被击败的亡灵身上收集，<br>共需五个部位。）</body></html>
ZXX_BrainInJar_quest_accept.conversations.0.name=维克多的大脑
ZXX_BrainInJar_quest_accept.conversations.0.text=真的，你愿意帮忙？太好了，简直太好了！
ZXX_BrainInJar_quest_accept.conversations.1.name=维克多的大脑
ZXX_BrainInJar_quest_accept.conversations.1.text=看见黑板上的示意图了吗？只要照图把各个部位摆整齐，这儿接上电线，那儿缝上几针……
ZXX_BrainInJar_quest_accept.conversations.2.name=维克多的大脑
ZXX_BrainInJar_quest_accept.conversations.2.text=<html><body>你问去哪儿找部位？见鬼，我可有阵子没见过外面的世界了……<br>能到附近找找游荡的亡灵吗？</body></html>
ZXX_BrainInJar_quest_accept.conversations.3.name=提示
ZXX_BrainInJar_quest_accept.conversations.3.text=（身体部位从被击败的亡灵身上收集，共需五个部位。）
ZXX_BrainInJar_quest_decline.conversations.0.name=维克多的大脑
ZXX_BrainInJar_quest_decline.conversations.0.text=真遗憾！不过也能理解，这可不是到街角小店随手买几样东西那么简单。
ZXX_BrainInJar_quest_progress.conversations.0.name=维克多的大脑
ZXX_BrainInJar_quest_progress.conversations.0.text=哦，还没收集齐吗？
ZXX_BrainInJar_quest_progress.conversations.1.name=维克多的大脑
ZXX_BrainInJar_quest_progress.conversations.1.text=好吧，我想也不用着急……虽然我正慢慢溶解在这盐水里。
ZXX_BrainInJar_quest_progress.conversations.2.name=维克多的大脑
ZXX_BrainInJar_quest_progress.conversations.2.text=（其实还是请你尽量快一点吧！）
ZXX_BrainInJar_search_gain.conversations.0.name=提示
ZXX_BrainInJar_search_gain.conversations.0.text=你迅速搜查工坊，寻找线索。在科学仪器和难以理解的研究资料之间，发现了一件构造复杂的装置！
ZXX_BrainInJar_zellan_init_select.conversations.0.name=罐中大脑
ZXX_BrainInJar_zellan_init_select.conversations.0.text=哦，那滴水比别的水滴长得更快！
ZXX_BrainInJar_zellan_init_select.conversations.1.name=罐中大脑
ZXX_BrainInJar_zellan_init_select.conversations.1.text=凝结的速度正在加快。我得在脑子里记上一笔。
ZXX_BrainInJar_zellan_init_select.conversations.2.name=泽兰
ZXX_BrainInJar_zellan_init_select.conversations.2.text=这可真是非同寻常。
ZXX_BrainInJar_zellan_init_select.conversations.3.name=罐中大脑
ZXX_BrainInJar_zellan_init_select.conversations.3.text=嗯？天哪，有客人！你好，法师！
ZXX_BrainInJar_zellan_init_select.conversations.4.name=泽兰
ZXX_BrainInJar_zellan_init_select.conversations.4.text=你好。请问，你知道自己只剩下一个脱离身体的大脑吗？
ZXX_BrainInJar_zellan_init_select.conversations.5.name=罐中大脑
ZXX_BrainInJar_zellan_init_select.conversations.5.text=当然知道！不过，我并不是一直这样。我可真想念自己的身体……
ZXX_BrainInJar_zellan_init_select.conversations.6.name=泽兰
ZXX_BrainInJar_zellan_init_select.conversations.6.text=是吗？那么请问，你的身体究竟到哪儿去了？
ZXX_BrainInJar_zellan_init_select.conversations.7.name=罐中大脑
ZXX_BrainInJar_zellan_init_select.conversations.7.text=哦，说来话长，那些血淋淋的细节我就不拿来烦你了。其实也算因祸得福，帮我转向了一个新的研究领域！
ZXX_BrainInJar_zellan_init_select.conversations.8.name=罐中大脑
ZXX_BrainInJar_zellan_init_select.conversations.8.text=另外，我也喜欢告诉自己，这是我有意识地选择少占点地方、过得简单些。
ZXX_BrainInJar_zellan_init_select.conversations.9.name=泽兰
ZXX_BrainInJar_zellan_init_select.conversations.9.text=原来如此……
ZXX_BrainInJar_zellan_init_select.conversations.10.name=泽兰
ZXX_BrainInJar_zellan_init_select.conversations.10.text=恕我失陪，大脑，我还有些事要——
ZXX_BrainInJar_zellan_init_select.conversations.11.name=罐中大脑
ZXX_BrainInJar_zellan_init_select.conversations.11.text=哦，别走，拜托！我保证不浪费你的时间。听我说完。还有，不介意的话，请叫我维克多。“大脑”这称呼也太不把我当人了。
ZXX_BrainInJar_zellan_init_select.conversations.12.name=维克多的大脑
ZXX_BrainInJar_zellan_init_select.conversations.12.text=我看你带了不少有趣的物品和宝物！不知这些东西里，恰好有没有，呃……解剖标本？
ZXX_BrainInJar_zellan_init_select.conversations.13.name=泽兰
ZXX_BrainInJar_zellan_init_select.conversations.13.text=……
ZXX_BrainInJar_zellan_init_select.conversations.14.name=维克多的大脑
ZXX_BrainInJar_zellan_init_select.conversations.14.text=如果你肯伸出援手——毕竟我现在确实缺手——我们应该就能用实验室里的设备，给我造一副新身体！
ZXX_BrainInJar_zellan_init_select.conversations.15.name=泽兰
ZXX_BrainInJar_zellan_init_select.conversations.15.text=你考虑过机械方案吗？比如说，钢铁魔像。对一个既想四处走走、又想碾碎敌人的大脑来说，那可是副强大的躯壳。
ZXX_BrainInJar_zellan_init_select.conversations.16.name=维克多的大脑
ZXX_BrainInJar_zellan_init_select.conversations.16.text=很诱人的设想！不过不行，恐怕还得是血肉之躯。冰冷的金属贴着我的小脑，呃！光想想就让我发抖。
ZXX_BrainInJar_zellan_init_select.conversations.17.name=维克多的大脑
ZXX_BrainInJar_zellan_init_select.conversations.17.text=我以前的研究正好派得上用场。那场，呃……那场事故发生时，我们眼看就要完成有史以来第一次意识转移了。
ZXX_BrainInJar_zellan_init_select.conversations.18.name=泽兰
ZXX_BrainInJar_zellan_init_select.conversations.18.text=你说“事故”？磕坏茶杯、撞痛脚趾才叫小事故。只剩一个罐子里的大脑，用这个词可不太恰当。
ZXX_BrainInJar_zellan_init_select.conversations.19.name=维克多的大脑
ZXX_BrainInJar_zellan_init_select.conversations.19.text=哦，抱歉让你误会了，这是完全不同的另一件事！走廊那头，我那个笨手笨脚的档案管理员瓦尔德曼博士，发现闹了象鼻虫。
ZXX_BrainInJar_zellan_init_select.conversations.20.name=维克多的大脑
ZXX_BrainInJar_zellan_init_select.conversations.20.text=就在一批旧手稿里。那个粗心的笨蛋决定临时来一次熏蒸除虫……
ZXX_BrainInJar_zellan_init_select.conversations.21.name=维克多的大脑
ZXX_BrainInJar_zellan_init_select.conversations.21.text=那该死的蠢货弄出了气体泄漏，随后一场爆炸席卷了整座设施，释放出了一定量的放射性蒸气。
ZXX_BrainInJar_zellan_init_select.conversations.22.name=维克多的大脑
ZXX_BrainInJar_zellan_init_select.conversations.22.text=我的团队立刻冲向出口。可悲的是，混乱之中，我和我的罐子被落下了……
ZXX_BrainInJar_zellan_init_select.conversations.23.name=泽兰
ZXX_BrainInJar_zellan_init_select.conversations.23.text=真遗憾。可靠的助手有多难找，我很清楚。这也是如今我选择使用构装体的原因之一。
ZXX_BrainInJar_zellan_init_select.conversations.24.name=泽兰
ZXX_BrainInJar_zellan_init_select.conversations.24.text=绝对忠诚，而且不大可能把我的实验室炸上天。
ZXX_BrainInJar_zellan_init_select.conversations.25.name=泽兰
ZXX_BrainInJar_zellan_init_select.conversations.25.text=另外，这一切应该发生在很久以前了。现在的空气里，我只能闻到一丝极淡的化学品气味。
ZXX_BrainInJar_zellan_init_select.conversations.26.name=维克多的大脑
ZXX_BrainInJar_zellan_init_select.conversations.26.text=<html><body>啊，你的观察力再次令人赞叹！<br>我估计这里的空气要过上几十年，才能重新供人呼吸。</body></html>
ZXX_BrainInJar_zellan_init_select.conversations.27.name=泽兰
ZXX_BrainInJar_zellan_init_select.conversations.27.text=所以，你一个人关在罐子里，大概待了三十年？维克多的大脑，我怎么知道你还没彻底疯掉？
ZXX_BrainInJar_zellan_init_select.conversations.28.name=维克多的大脑
ZXX_BrainInJar_zellan_init_select.conversations.28.text=<html><body>放心，我的理智可比身体的大部分零件耐用多了！<br>那么，你愿意帮我吗？请答应吧！</body></html>
ZXX_BrainInJar_zellan_init_select.conversations.29.selection-text=<html><body>维克多的大脑急切地等着你的答复，<br>兴奋地在罐子里上下浮动。谁也不知道，<br>他接下来会提出什么要求。<br><br>你愿意帮助维克多吗？</body></html>
ZXX_Congratulations.conversations.0.name=提示
ZXX_Congratulations.conversations.0.text=<html><body>你已完成 Age of Fear 4 的《维克多的实验》（The Victor's Experiment）扩展！<br>恭喜！请继续你的战役。</body></html>
ZXX_Intro_angela.conversations.0.name=安吉拉
ZXX_Intro_angela.conversations.0.text=真不知道该怎么看待这鬼地方……
ZXX_Intro_angela.conversations.1.name=安吉拉
ZXX_Intro_angela.conversations.1.text=直觉告诉我得小心。空气里有股怪味，但肯定不是亡灵的气息。
ZXX_Intro_angela.conversations.2.name=安吉拉
ZXX_Intro_angela.conversations.2.text=……不过，既然大门已经打开了，我赌五枚金币，不出一周，就会有个走投无路的吸血鬼把这里当坟墓住下。
ZXX_Intro_angela.conversations.3.name=安吉拉
ZXX_Intro_angela.conversations.3.text=这里是破了点，但稍微收拾一下，倒也能成为舒服的落脚处。话说回来，这地方究竟是干什么的？
ZXX_Intro_zellan.conversations.0.name=泽兰
ZXX_Intro_zellan.conversations.0.text=真是栋奇特的建筑。
ZXX_Intro_zellan.conversations.1.name=泽兰
ZXX_Intro_zellan.conversations.1.text=作为实验室，这种布局相当不寻常。天花板还这么高，冬天取暖肯定贵得吓人。
ZXX_Intro_zellan.conversations.2.name=泽兰
ZXX_Intro_zellan.conversations.2.text=不过，这地方很有意思。竟然荒废了这么久，实在奇怪，让人忍不住想知道这里发生过什么。
ZXX_Intro_zellan.conversations.3.name=泽兰
ZXX_Intro_zellan.conversations.3.text=也许值得四处看看，找点材料。
ZXX_Library_book_ICT.conversations.0.name=提示
ZXX_Library_book_ICT.conversations.0.text=你拿起《内省对谈话题》（Introspective Conversation Topics），随手翻开一页。
ZXX_Library_book_ICT.conversations.1.name=提示
ZXX_Library_book_ICT.conversations.1.text=“……当一个人同时置身于哲学家与倾听者的角色时，对话所能带来的精神激荡，便有望达到无限的高度……”
ZXX_Library_book_ICT.conversations.2.name=提示
ZXX_Library_book_ICT.conversations.2.text=这堆学术辞藻搅得你有些头疼，你合上书，把它放回桌上。
ZXX_Library_book_MA.conversations.0.name=提示
ZXX_Library_book_MA.conversations.0.text=你拿起《微生物分析》（Microbial Analysis），随手翻开一页。
ZXX_Library_book_MA.conversations.1.name=提示
ZXX_Library_book_MA.conversations.1.text=“……在接下来的几天里进一步观察，培养皿中应出现若干游动的单细胞生物，而光谱分析将揭示……”
ZXX_Library_book_MA.conversations.2.name=提示
ZXX_Library_book_MA.conversations.2.text=你合上书，将它塞回书架，完全想不出这点知识在日常生活中能有什么用。
ZXX_Library_book_OR.conversations.0.name=提示
ZXX_Library_book_OR.conversations.0.text=你拿起《骨科关节复位》（Orthopaedic Rearticulations），随手翻开一页。
ZXX_Library_book_OR.conversations.1.name=提示
ZXX_Library_book_OR.conversations.1.text=“……施以适当力度后，原先僵住的关节应恢复活动，并伴随一声响亮而令人满意的空化爆响……”
ZXX_Library_book_OR.conversations.2.name=提示
ZXX_Library_book_OR.conversations.2.text=你不确定这算不算靠谱的医术，便把书放回桌上。
ZXX_Library_book_R.conversations.0.name=提示
ZXX_Library_book_R.conversations.0.text=你拿起《罗克雷玛学》（Rhochrematics），随手翻开一页。
ZXX_Library_book_R.conversations.1.name=提示
ZXX_Library_book_R.conversations.1.text=“……与许多转化过程一样，将植物化学浓缩物从一种状态转变为另一种状态时，不可能保留所有理想的特性……”
ZXX_Library_book_R.conversations.2.name=提示
ZXX_Library_book_R.conversations.2.text=刚才那一通炼金术行话让你有些发懵，你把书放回书架原处。
ZXX_Library_book_STE.conversations.0.name=提示
ZXX_Library_book_STE.conversations.0.text=你拿起《构造圈领域研究》（Studies of Tectosphere Empire），随手翻开一页。
ZXX_Library_book_STE.conversations.1.name=提示
ZXX_Library_book_STE.conversations.1.text=“……土壤成分样本或可证实构造翻动的存在，理论认为，这正是地表运动与大陆汇聚的驱动力……”
ZXX_Library_book_STE.conversations.2.name=提示
ZXX_Library_book_STE.conversations.2.text=宇宙万物的奥妙让你有些迷糊，你合上书，塞回书架。
ZXX_Library_book_V.conversations.0.name=提示
ZXX_Library_book_V.conversations.0.text=你拿起《我来，我见，我征服》（Veni, Vidi, Vici），随手翻开一页。
ZXX_Library_book_V.conversations.1.name=提示
ZXX_Library_book_V.conversations.1.text=“……这些辉煌战役流传于神话与传说中，成为不屈精神与英勇气概最杰出、最成功的典范之一，仅次于……”
ZXX_Library_book_V.conversations.2.name=提示
ZXX_Library_book_V.conversations.2.text=你怀疑其中的历史是否属实，便合上书，放回书堆。
ZXX_Library_desk_select.conversations.0.selection-text=<html><body>桌上高高堆着一摞奇特的书。<br>有些封皮磨损严重，<br>页边空白处写满了批注，<br>还有些可能从未被翻开。<br><br>要仔细看看其中哪本书吗？</body></html>
ZXX_Library_shelf_select.conversations.0.selection-text=<html><body>图书室的书架上塞满了厚重的典籍。<br>积尘厚厚，看来很久没人读过，<br>不过，其中一些书的磨损痕迹<br>明显比另一些更重。<br>      <br>要从书架上抽一本下来吗？</body></html>
ZXX_Search_failure.conversations.0.name=提示
ZXX_Search_failure.conversations.0.text=杂物里没有发现任何值钱或有趣的东西。
ZXX_Search_success.conversations.0.name=提示
ZXX_Search_success.conversations.0.text=你推开几箱破碎的试管，惊喜地发现，一个没上锁的柜子里竟然藏着一批掩得严严实实的贵重物品！
ZXX_Welcome.conversations.0.name=提示
ZXX_Welcome.conversations.0.text=<html><body>欢迎体验《维克多的实验》（The Victor's Experiment）扩展！<br>这些关卡均为可选内容，可在战役期间随时游玩。</body></html>
ZXX_Welcome.conversations.1.name=提示
ZXX_Welcome.conversations.1.text=建议队伍中的所有单位都达到老兵资历后，再开始《弗兰肯斯坦》（Frankenstein）扩展。感谢你支持独立游戏！
ZXX_Workshop_puzzlelock_fail.conversations.0.name=提示
ZXX_Workshop_puzzlelock_fail.conversations.0.text=按键板发出一声懊恼而尖锐的蜂鸣，发光的字母串随即重置。
ZXX_Workshop_puzzlelock_fail.conversations.1.name=提示
ZXX_Workshop_puzzlelock_fail.conversations.1.text=可恶，不对！得试试别的组合。
ZXX_Workshop_puzzlelock_init_select.conversations.0.selection-text=<html><body>门上的密码锁似乎坚不可摧，<br>而且仍有强力魔法保护，<br>连最厉害的盗贼也无法撬开。<br><br>你得老老实实解开它。<br>要按哪个按钮？</body></html>
ZXX_Workshop_puzzlelock_select.conversations.0.selection-text=<html><body>旁边闪烁着一串字母：<br><br>${puzzle-lock-chars-label}<br><br>接下来要按哪个按钮？</body></html>
ZXX_Workshop_puzzlelock_success.conversations.0.name=提示
ZXX_Workshop_puzzlelock_success.conversations.0.text=一连串满意的咔哒声和嗡鸣过后，按键板响起欢快的提示音。密码被接受了吗？
ZXX_Workshop_puzzlelock_success.conversations.1.name=提示
ZXX_Workshop_puzzlelock_success.conversations.1.text=工坊门锁“咣当”一声打开。可以进去了！
