# 通用对话第10批：黑暗城堡的晚宴委托。
SXX_DarkCastle_Hint2.conversations.0.name=提示
SXX_DarkCastle_Hint2.conversations.0.text=弗拉达米尔领主想来一道酥脆的地精开胃菜。
SXX_DarkCastle_Hint3.conversations.0.name=提示
SXX_DarkCastle_Hint3.conversations.0.text=弗拉达米尔领主想喝一碗滚烫的矮人清汤。
SXX_DarkCastle_Hint4.conversations.0.name=提示
SXX_DarkCastle_Hint4.conversations.0.text=弗拉达米尔领主想吃一道鲜嫩多汁的烤骑士。
SXX_DarkCastle_Quest0.conversations.0.name=威尔萨玛夫人
SXX_DarkCastle_Quest0.conversations.0.text=<html><body>哦！太好了，有客人来了！<br>欢迎，欢迎。我是威尔萨玛夫人。</body></html>
SXX_DarkCastle_Quest0.conversations.1.name=威尔萨玛夫人
SXX_DarkCastle_Quest0.conversations.1.text=<html><body>诸位是来拜见弗拉达米尔领主的吗？<br>我这就去通报。</body></html>
SXX_DarkCastle_Quest0.conversations.2.name=弗拉达米尔
SXX_DarkCastle_Quest0.conversations.2.text=威尔萨玛，是谁来了？
SXX_DarkCastle_Quest0.conversations.3.name=威尔萨玛夫人
SXX_DarkCastle_Quest0.conversations.3.text=是几位新客人，大人。
SXX_DarkCastle_Quest0.conversations.4.name=弗拉达米尔
SXX_DarkCastle_Quest0.conversations.4.text=啊，原来如此！看他们的样子……是来赴晚宴的吗？
SXX_DarkCastle_Quest0.conversations.5.name=威尔萨玛夫人
SXX_DarkCastle_Quest0.conversations.5.text=天哪，当然不是，大人！他们可不是我们平日里为晚宴接待的那种客人！
SXX_DarkCastle_Quest0.conversations.6.name=威尔萨玛夫人
SXX_DarkCastle_Quest0.conversations.6.text=不过，也许他们愿意替我们取些……外卖。
SXX_DarkCastle_Quest0.conversations.7.name=威尔萨玛夫人
SXX_DarkCastle_Quest0.conversations.7.text=（您也知道，那些酒馆如今都不肯送到这么远的山里来了。可他们从前派来的送餐人，一个个多结实，四肢多健壮呀……）
SXX_DarkCastle_Quest0.conversations.8.name=弗拉达米尔
SXX_DarkCastle_Quest0.conversations.8.text=那他们可就帮了大忙了，威尔萨玛。菜单的细节由你安排吧，我爱吃什么，你都知道。
SXX_DarkCastle_Quest0.conversations.9.name=弗拉达米尔
SXX_DarkCastle_Quest0.conversations.9.text=别忘了告诉这几位新客人，我们定会重重酬谢。我的肚子都饿得咕咕叫了。
SXX_DarkCastle_Quest0.conversations.10.name=威尔萨玛夫人
SXX_DarkCastle_Quest0.conversations.10.text=<html><body>那是当然，大人！<br>亲爱的冒险者们，请随我来。</body></html>
SXX_DarkCastle_Quest1.conversations.0.name=威尔萨玛夫人
SXX_DarkCastle_Quest1.conversations.0.text=亲爱的诸位，欢迎来到弗拉达米尔领主的领地！
SXX_DarkCastle_Quest1.conversations.1.name=威尔萨玛夫人
SXX_DarkCastle_Quest1.conversations.1.text=想必诸位已经看出来了，我们领主是一位品味高雅的绅士。他对美食的鉴赏力，更是无人能及！
SXX_DarkCastle_Quest1.conversations.2.name=威尔萨玛夫人
SXX_DarkCastle_Quest1.conversations.2.text=……这可让仆人们颇费心思，毕竟每一道菜都得恰合他当时的心意，差一点都不行。
SXX_DarkCastle_Quest1.conversations.3.name=威尔萨玛夫人
SXX_DarkCastle_Quest1.conversations.3.text=所以，我想请诸位英雄帮个忙——我们得为他准备一道最合心意的开胃菜，作为今晚的头盘。
SXX_DarkCastle_Quest1.conversations.4.name=威尔萨玛夫人
SXX_DarkCastle_Quest1.conversations.4.text=来一只绿油油的地精吧，越瘦骨嶙峋、筋头软骨越多越好。拿来为今晚的盛宴开场，再合适不过了！
SXX_DarkCastle_Quest2.conversations.0.name=威尔萨玛夫人
SXX_DarkCastle_Quest2.conversations.0.text=啊！多精瘦的一只地精。正好给我们领主当点心！
SXX_DarkCastle_Quest2.conversations.1.name=地精
SXX_DarkCastle_Quest2.conversations.1.text=什、什么，主人？她、她刚才是不是说……点心？！主人，不要啊——！
SXX_DarkCastle_Quest2.conversations.2.name=威尔萨玛夫人
SXX_DarkCastle_Quest2.conversations.2.text=<html><body>诸位如约送来了我要的东西，真是感激不尽！<br>冒险者们，这是你们应得的报酬。</body></html>
SXX_DarkCastle_Quest2.conversations.3.name=威尔萨玛夫人
SXX_DarkCastle_Quest2.conversations.3.text=接下来这一道，还要更加鲜美。弗拉达米尔领主想喝一碗热气腾腾的矮人汤。
SXX_DarkCastle_Quest2.conversations.4.name=威尔萨玛夫人
SXX_DarkCastle_Quest2.conversations.4.text=我们的厨师可会拿这些小矮个熬清汤了。请给我带个壮实的来，必有厚赏。
SXX_DarkCastle_Quest3.conversations.0.name=威尔萨玛夫人
SXX_DarkCastle_Quest3.conversations.0.text=<html><body>哎呀，好一个健壮的矮人！<br>多谢诸位冒险者。厨师已经烧上水了，我这就叫他来。</body></html>
SXX_DarkCastle_Quest3.conversations.1.name=威尔萨玛夫人
SXX_DarkCastle_Quest3.conversations.1.text=伊——戈——尔！
SXX_DarkCastle_Quest3.conversations.2.name=伊戈尔
SXX_DarkCastle_Quest3.conversations.2.text=夫——人。水——开了。我剁矮人。
SXX_DarkCastle_Quest3.conversations.3.name=矮人
SXX_DarkCastle_Quest3.conversations.3.text=<html><body>喂！我没听错吧？锅、水，还要剁？！<br>我可不愿把命丢在一锅破汤里，绝对不干！</body></html>
SXX_DarkCastle_Quest3.conversations.4.name=伊戈尔
SXX_DarkCastle_Quest3.conversations.4.text=矮人，安——静。矮人配胡萝卜，好吃。
SXX_DarkCastle_Quest3.conversations.5.name=矮人
SXX_DarkCastle_Quest3.conversations.5.text=胡萝卜？！我不干！
SXX_DarkCastle_Quest3.conversations.6.name=威尔萨玛夫人
SXX_DarkCastle_Quest3.conversations.6.text=<html><body>好了！接下来该准备主菜了。<br>弗拉达米尔领主想吃一道丰盛的烤肉。</body></html>
SXX_DarkCastle_Quest3.conversations.7.name=威尔萨玛夫人
SXX_DarkCastle_Quest3.conversations.7.text=用葡萄酒焖一位人类骑士，作压轴主菜再完美不过。请给我带一位仪表堂堂的来，自有酬谢！
SXX_DarkCastle_Quest4.conversations.0.name=威尔萨玛夫人
SXX_DarkCastle_Quest4.conversations.0.text=终于来了！一位英勇的骑士，让我们免去了今晚无主菜可吃的厄运！
SXX_DarkCastle_Quest4.conversations.1.name=骑士
SXX_DarkCastle_Quest4.conversations.1.text=天哪！我简直不敢相——
SXX_DarkCastle_Quest4.conversations.2.name=伊戈尔
SXX_DarkCastle_Quest4.conversations.2.text=头先进。烤——炉，热了。进去！
SXX_DarkCastle_Quest4.conversations.3.name=威尔萨玛夫人
SXX_DarkCastle_Quest4.conversations.3.text=这样一来，晚宴的准备就全部结束了，亲爱的冒险者们。我送诸位到门口。
SXX_DarkCastle_Quest4.conversations.4.name=威尔萨玛夫人
SXX_DarkCastle_Quest4.conversations.4.text=哦，诸位真是帮了大忙！收下这个吧，不过是我们的一点心意。
SXX_DarkCastle_Quest4.conversations.5.name=威尔萨玛夫人
SXX_DarkCastle_Quest4.conversations.5.text=招待诸位十分愉快，不过还请就此告辞。我们领主餐后要小憩，不能受打扰。
