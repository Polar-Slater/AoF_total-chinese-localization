# War Machine — 简体中文
CONVERSATIONS=machinewardlc
LOCALE=zh
MXX_Brin_conversation_intro.conversations.0.name=莱克莎
MXX_Brin_conversation_intro.conversations.0.text=这一天简直没完没了……
MXX_Brin_conversation_intro.conversations.1.name=布林
MXX_Brin_conversation_intro.conversations.1.text=哇哦，刚才可真是刺激得过头了！
MXX_Brin_conversation_intro.conversations.2.name=因杜尔夫
MXX_Brin_conversation_intro.conversations.2.text=等我们有了自己的战争机器替我们分担，你就有的是时间休息恢复了，莱克莎！
MXX_Brin_conversation_intro.conversations.3.name=布林
MXX_Brin_conversation_intro.conversations.3.text=哦，对——让我接着把事情说完！
MXX_Brin_conversation_intro.conversations.4.name=布林
MXX_Brin_conversation_intro.conversations.4.text=嗯，你们大概也不意外，要把它造出来，我还缺那么一点必需的东西。
MXX_Brin_conversation_intro.conversations.5.name=因杜尔夫
MXX_Brin_conversation_intro.conversations.5.text=明白，接下来你就该请我们帮忙了……
MXX_Brin_conversation_intro.conversations.6.name=莱克莎
MXX_Brin_conversation_intro.conversations.6.text=是再帮一次！我们刚才已经救下了他那把泡透麦酒的胡子，才没让人给砍了！
MXX_Brin_conversation_intro.conversations.7.name=布林
MXX_Brin_conversation_intro.conversations.7.text=姑娘，别以为我不领情！唉，没了胡子我可怎么活，从奶娃娃时就开始留了……
MXX_Brin_conversation_intro.conversations.8.name=布林
MXX_Brin_conversation_intro.conversations.8.text=不过，还是说回战争机器吧……听着，我打算造的那个大家伙，自己其实用不上。
MXX_Brin_conversation_intro.conversations.9.name=布林
MXX_Brin_conversation_intro.conversations.9.text=我只想过一把瘾，亲手把脑子里的构想做出来。你们帮我，它就归你们，想怎么大闹一场都行！
MXX_Brin_conversation_intro.conversations.10.name=因杜尔夫
MXX_Brin_conversation_intro.conversations.10.text=布林，这才叫公平买卖！那么，造这台机器需要些什么？
MXX_Brin_conversation_intro.conversations.11.name=布林
MXX_Brin_conversation_intro.conversations.11.text=哦，你懂的……这里一点，那里一点。来，我给你们一一说清楚。
MXX_Brin_conversation_materials_a.conversations.0.name=布林
MXX_Brin_conversation_materials_a.conversations.0.text=跟你们说，这台机器会是个大家伙。
MXX_Brin_conversation_materials_a.conversations.1.name=布林
MXX_Brin_conversation_materials_a.conversations.1.text=一层又一层的金属，再靠一个塞满煤炭、烧得滚烫的大炉子来驱动！
MXX_Brin_conversation_materials_a.conversations.2.name=布林
MXX_Brin_conversation_materials_a.conversations.2.text=……所以嘛，这两样我都要不少。你们要是能带些纯铁矿石和煤来，就是深矿里的那种远古煤炭，事情就能往前迈一大步！
MXX_Brin_conversation_materials_b.conversations.0.name=布林
MXX_Brin_conversation_materials_b.conversations.0.text=我不想提前把惊喜全说穿，不过，我需要点……特别的东西。
MXX_Brin_conversation_materials_b.conversations.1.name=布林
MXX_Brin_conversation_materials_b.conversations.1.text=要把这台机器的造型做好，得从大自然借点灵感。也就是骨头。
MXX_Brin_conversation_materials_b.conversations.2.name=布林
MXX_Brin_conversation_materials_b.conversations.2.text=当然，不是随便什么骨头，而是龙骨！你们知道暗影沼泽 (Shadowmarsh) 吧？那里从前是龙的繁衍之地，各种龙都有。它们在那里生活，也在那里死去。
MXX_Brin_conversation_materials_b.conversations.3.name=布林
MXX_Brin_conversation_materials_b.conversations.3.text=我想，挖出一具遗骨供我研究，对你们应该不难。祝好运！
MXX_Brin_conversation_tools.conversations.0.name=布林
MXX_Brin_conversation_tools.conversations.0.text=干我这行的，少不了一套专门的工具！可惜，我那套老家伙什儿落在以前住的堡垒里了……
MXX_Brin_conversation_tools.conversations.1.name=布林
MXX_Brin_conversation_tools.conversations.1.text=当时我是被赶出来的，跑得太急，差点绊在自己的胡子上！
MXX_Brin_conversation_tools.conversations.2.name=布林
MXX_Brin_conversation_tools.conversations.2.text=来，我告诉你们怎么去那个该死的山中老家。闯进去，把我的工具包带出来。
MXX_Brin_conversation_tools.conversations.3.name=布林
MXX_Brin_conversation_tools.conversations.3.text=不过提醒一句，我那些老……咳，老伙计，可都暴躁得很！当然，你们也许能悄悄溜过去……那地方进出的路不少，守卫不是每条都看着。
MXX_Congratulations.conversations.0.name=提示
MXX_Congratulations.conversations.0.text=<html><body>你已完成 Age of Fear 5: The Day of the Rat 的《战争机器》（War Machine）扩展！<br>恭喜！请继续你的战役。</body></html>
MXX_Welcome.conversations.0.name=提示
MXX_Welcome.conversations.0.text=<html><body>欢迎游玩《战争机器》（War Machine）扩展！<br>这些关卡为可选内容，可以在战役期间随时游玩。</body></html>
MXX_Welcome.conversations.1.name=提示
MXX_Welcome.conversations.1.text=建议在开始《战争机器》扩展前，组建一支满员且所有单位均达到老兵资历的队伍。感谢你支持独立游戏！
