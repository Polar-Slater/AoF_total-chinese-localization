# The Quick and The Dead — 简体中文
CAMPAIGN=ratmencampaign
LOCALE=zh
LevelQuickFemaleAssassin01.text=<html><body>索罗顿 (Sorodon) 的夜市让城中最美好与最丑恶的一面都显露出来。莱克莎正仔细挑选药剂摊上的货品，因杜尔夫便将她留在那里，独自走向最喜欢的理发师，打算稍作修整。忽然，眼角的一点动静引起了他的注意——有人在跟踪他。<br><br>一个披着斗篷的敏捷身影穿过人群，擦着因杜尔夫身侧而过，仿佛只是借道。他将计就计，装作毫无察觉，任由扒手摸索的手指在自己身上一件看似值钱的物品上停住。<br><br>赃物到手，那贼猛地抽身，转向一条侧巷。因杜尔夫一把掀掉对方的兜帽，露出尖长的吻部、歪斜的胡须，以及挂满耳环、带着缺口的耳朵。<br><br>行迹败露，那贼又惊又怒地低吼一声，窜入黑暗。</body></html>
LevelQuickFemaleAssassin01.location.name=生者与死者 (The Quick and The Dead)
LevelQuickFemaleAssassin01.conversations.0.name=因杜尔夫
LevelQuickFemaleAssassin01.conversations.0.text=鼠人窃贼？莱克莎，难道我还没赢得他们永不背弃的忠诚吗？！
LevelQuickFemaleAssassin01.conversations.1.name=莱克莎
LevelQuickFemaleAssassin01.conversations.1.text=因杜尔夫，我一直跟你说，他们就是害鼠！你还指望什么？
LevelQuickFemaleAssassin01.conversations.2.name=莱克莎
LevelQuickFemaleAssassin01.conversations.2.text=他们宁可把自己撑死，也不肯分给别人！
LevelQuickFemaleAssassin01.conversations.3.name=因杜尔夫
LevelQuickFemaleAssassin01.conversations.3.text=不过，这位长尾巴的家伙，似乎跟其他鼠辈有些不同……
LevelQuickFemaleAssassin01.conversations.4.name=因杜尔夫
LevelQuickFemaleAssassin01.conversations.4.text=追上去吧。逛街结束！
LevelQuickFemaleAssassin01.conversations.5.name=莱克莎
LevelQuickFemaleAssassin01.conversations.5.text=什么！我盼了一整周才来逛这个夜市，你答应过的！
LevelQuickFemaleAssassin01.conversations.6.name=因杜尔夫
LevelQuickFemaleAssassin01.conversations.6.text=亲爱的莱克莎，我向你保证——你挑来挑去的那些瓶陈尿，再放上一周只会更臭。
LevelQuickFemaleAssassin01.conversations.7.name=莱克莎
LevelQuickFemaleAssassin01.conversations.7.text=<html><body>……<br>（混蛋！）</body></html>
LevelQuickFemaleAssassin01.conversations.8.name=因杜尔夫
LevelQuickFemaleAssassin01.conversations.8.text=为了让这出戏更有意思，我故意让这位扒手偷走了一袋我最心爱的扑克筹码。我们得把它们拿回来！
LevelQuickFemaleAssassin02.text=<html><body>因杜尔夫与莱克莎紧追着窃贼冲进黑暗的巷道，灵巧地避开索罗顿 (Sorodon) 后巷里随处可见的浑浊水洼和垃圾堆。眼看距离越来越近，逃跑的扒手却突然停了下来。<br><br>这是一条死巷，破桶与脏布堆得到处都是，唯一的出路，是污秽砖墙低处的一扇小门。窃贼拼命扭动门把手，门却从另一侧锁得死死的。<br><br>鼠人扒手愤怒地嘶叫着，转身面对两位英雄，亮出一把锯齿状的利刃，弓低身子，准备出手。<br><br>就在这时，沉重的开锁声在巷中回荡。小门打开，一群脚步明显不稳的矮人踉踉跄跄地走了出来。</body></html>
LevelQuickFemaleAssassin02.location.name=暗巷 (Dark Alley)
LevelQuickFemaleAssassin02.conversations.0.name=矮人店主
LevelQuickFemaleAssassin02.conversations.0.text=喂！伙计们，又是那只贼老鼠！
LevelQuickFemaleAssassin02.conversations.1.name=矮人店主
LevelQuickFemaleAssassin02.conversations.1.text=偷老子辛辛苦苦挣来的东西，别想再有下次！喝干你们的麦酒，该算账了。
LevelQuickFemaleAssassin02.conversations.2.name=矮人守卫
LevelQuickFemaleAssassin02.conversations.2.text=<html><body>咕嘟。<br>随时能动手，老板。</body></html>
LevelQuickFemaleAssassin02.conversations.3.name=鼠人窃贼
LevelQuickFemaleAssassin02.conversations.3.text=贪心的矮家伙！瞧瞧你们这群矮个子的肚皮，东西早就多得吃不完了！
LevelQuickFemaleAssassin02.conversations.4.name=矮人店主
LevelQuickFemaleAssassin02.conversations.4.text=这可轮不到你说了算，母老鼠！偷就是偷，该让你付代价了。
LevelQuickFemaleAssassin02.conversations.5.name=鼠人窃贼
LevelQuickFemaleAssassin02.conversations.5.text=呜……偏偏选了这条巷子，真倒霉……
LevelQuickFemaleAssassin02.conversations.6.name=因杜尔夫
LevelQuickFemaleAssassin02.conversations.6.text=果然不出我所料，莱克莎！又一个为了活下去四处谋食的可怜人。
LevelQuickFemaleAssassin02.conversations.7.name=莱克莎
LevelQuickFemaleAssassin02.conversations.7.text=这有什么稀奇！她怎么不跟地下鼠巢里的其他家伙待着？那儿好不容易才过上丰衣足食的日子。
LevelQuickFemaleAssassin02.conversations.8.name=因杜尔夫
LevelQuickFemaleAssassin02.conversations.8.text=问得好！或许我们帮她收拾掉这几个醉醺醺的矮冬瓜，就能弄清楚……
LevelQuickFemaleAssassin02.conversations.9.name=因杜尔夫
LevelQuickFemaleAssassin02.conversations.9.text=……顺便拿回我的扑克筹码！
LevelQuickFemaleAssassin03.conversations.0.name=提示
LevelQuickFemaleAssassin03.conversations.0.text=莉扎只会在她的这段冒险中暂时加入。想永久招募莉扎，玩家必须完成她的支线剧情。
LevelQuickFemaleAssassin03.conversations.1.name=提示
LevelQuickFemaleAssassin03.conversations.1.text=莉扎是一名受过训练的鼠人刺客，还会几招魔法。她的拿手好戏是闪现：传送到敌人身后，背刺毫无防备的目标！
LevelQuickFemaleAssassin03.triggers.on-battle-task-1.text=游荡者戒指：在第4回合结束前击败变异矮人
LevelQuickFemaleAssassin03.triggers.on-battle-task-2.text=蓝宝石×3：在第8回合结束前击败矮人
LevelQuickFemaleAssassin04.text=<html><body>死去矮人的尸体躺在死巷遍地的垃圾中，倒显得十分和谐。用不了多久，索罗顿 (Sorodon) 那些更加落魄的拾荒者就会来搜刮尸体。<br><br>鼠人窃贼保持着距离，顺着长长的鼻吻望向两位英雄，先把因杜尔夫从头打量到脚，又看了看莱克莎。<br><br>离得这么近，两位英雄才发现，这鼠人窃贼原来是个雌性。她朝空气中飞快地嗅了几下。<br><br>她似乎多少相信了两位英雄没有恶意，便收起刀刃，谨慎地走上前来。</body></html>
LevelQuickFemaleAssassin04.location.name=莉扎 (Rizza)
LevelQuickFemaleAssassin04.conversations.0.name=鼠人窃贼
LevelQuickFemaleAssassin04.conversations.0.text=人类家伙……你们为什么帮我？
LevelQuickFemaleAssassin04.conversations.1.name=因杜尔夫
LevelQuickFemaleAssassin04.conversations.1.text=靠我的第六感啊！就像能猜中下一把骰子的点数一样，有志趣相投的人在身边，我也能感觉到。
LevelQuickFemaleAssassin04.conversations.2.name=莱克莎
LevelQuickFemaleAssassin04.conversations.2.text=（所以，跟你后兜里那颗灌了铅的骰子一点关系都没有？）
LevelQuickFemaleAssassin04.conversations.3.name=因杜尔夫
LevelQuickFemaleAssassin04.conversations.3.text=（嘘，莱克莎！）
LevelQuickFemaleAssassin04.conversations.4.name=鼠人窃贼
LevelQuickFemaleAssassin04.conversations.4.text=志趣相投？鼠人和人类家伙？
LevelQuickFemaleAssassin04.conversations.5.name=莱克莎
LevelQuickFemaleAssassin04.conversations.5.text=哦，别又来了……
LevelQuickFemaleAssassin04.conversations.6.name=因杜尔夫
LevelQuickFemaleAssassin04.conversations.6.text=朋友，为了跟住在这些街道深处的你的族人建立交情，我们可是费了不少力气。
LevelQuickFemaleAssassin04.conversations.7.name=因杜尔夫
LevelQuickFemaleAssassin04.conversations.7.text=你竟然还没听过鼠巢英雄、黑心因杜尔夫的伟大事迹，真让我惊讶！
LevelQuickFemaleAssassin04.conversations.8.name=鼠人窃贼
LevelQuickFemaleAssassin04.conversations.8.text=哦？我不知道。下面那些家伙……他们不欢迎我。
LevelQuickFemaleAssassin04.conversations.9.name=莱克莎
LevelQuickFemaleAssassin04.conversations.9.text=为什么？你把奶酪都吃光了？
LevelQuickFemaleAssassin04.conversations.10.name=因杜尔夫
LevelQuickFemaleAssassin04.conversations.10.text=拜托，莱克莎！我们知道，鼠人的社会可不只是对奶制品的无尽渴望。
LevelQuickFemaleAssassin04.conversations.11.name=鼠人窃贼
LevelQuickFemaleAssassin04.conversations.11.text=不是奶酪，不是……
LevelQuickFemaleAssassin04.conversations.12.name=因杜尔夫
LevelQuickFemaleAssassin04.conversations.12.text=<html><body>看吧？<br>……等等，是别的东西？</body></html>
LevelQuickFemaleAssassin04.conversations.13.name=鼠人窃贼
LevelQuickFemaleAssassin04.conversations.13.text=……对。一个冬天，又一个冬天，再一个冬天以前，鼠巢里的熏小鱼。我全吃了，停不下来！
LevelQuickFemaleAssassin04.conversations.14.name=因杜尔夫
LevelQuickFemaleAssassin04.conversations.14.text=哦，别这样。我想不出世上有哪只老鼠会为这种事怪你！肯定还有别的原因。
LevelQuickFemaleAssassin04.conversations.15.name=鼠人窃贼
LevelQuickFemaleAssassin04.conversations.15.text=……还有偷学秘密。
LevelQuickFemaleAssassin04.conversations.16.name=因杜尔夫
LevelQuickFemaleAssassin04.conversations.16.text=看见了吗，莱克莎？我就知道，这是个值得结交的人物，跟我们是一路人！
LevelQuickFemaleAssassin04.conversations.17.name=莱克莎
LevelQuickFemaleAssassin04.conversations.17.text=我们可真走运，碰上了老鼠里最鼠辈的一个。
LevelQuickFemaleAssassin04.conversations.18.name=因杜尔夫
LevelQuickFemaleAssassin04.conversations.18.text=怎么称呼你，朋友？
LevelQuickFemaleAssassin04.conversations.19.name=莉扎
LevelQuickFemaleAssassin04.conversations.19.text=……我叫莉扎。
LevelQuickFemaleAssassin04.conversations.20.name=因杜尔夫
LevelQuickFemaleAssassin04.conversations.20.text=很高兴认识你，莉扎。我想我也能替莱克莎表个态，我们都很想听听后面的故事。
LevelQuickFemaleAssassin05.conversations.0.name=莱克莎
LevelQuickFemaleAssassin05.conversations.0.text=所以，在那个被你们叫作鼠巢的地下垃圾堆里，到底有什么值得你偷探的？
LevelQuickFemaleAssassin05.conversations.1.name=莉扎
LevelQuickFemaleAssassin05.conversations.1.text=你们人类家伙什么也不懂。我们鼠人有很多秘密！秘密，还有禁忌知识，对对。
LevelQuickFemaleAssassin05.conversations.2.name=莉扎
LevelQuickFemaleAssassin05.conversations.2.text=……不过那些不是我该知道的。可这拦不住我去试！
LevelQuickFemaleAssassin05.conversations.3.name=因杜尔夫
LevelQuickFemaleAssassin05.conversations.3.text=是吗，莉扎？你学到了什么？
LevelQuickFemaleAssassin05.conversations.4.name=莉扎
LevelQuickFemaleAssassin05.conversations.4.text=大贤者们藏得最深的秘密！不过，像我这样的刺客，绝对不许知道……
LevelQuickFemaleAssassin05.conversations.5.name=莉扎
LevelQuickFemaleAssassin05.conversations.5.text=……可忍不住不去啊。把我们训练得这么会潜行，却不许偷偷摸摸？！哪有这种道理！所以我去偷看，去偷学，然后我……
LevelQuickFemaleAssassin05.conversations.6.name=莉扎
LevelQuickFemaleAssassin05.conversations.6.text=我被抓了。他们找到我，惩罚我，把我赶了出来。再也不能回家了！
LevelQuickFemaleAssassin05.conversations.7.name=因杜尔夫
LevelQuickFemaleAssassin05.conversations.7.text=太糟了，莉扎！难道就没什么办法，能让鼠巢重新接纳你？
LevelQuickFemaleAssassin05.conversations.8.name=莉扎
LevelQuickFemaleAssassin05.conversations.8.text=嗯……也许有一个办法。
LevelQuickFemaleAssassin05.conversations.9.name=莱克莎
LevelQuickFemaleAssassin05.conversations.9.text=（我赌50金币，肯定是拿吃的去行贿。）
LevelQuickFemaleAssassin05.conversations.10.name=莉扎
LevelQuickFemaleAssassin05.conversations.10.text=学会的秘密没法再忘掉，但小鱼可以赔回去。我有计划！
LevelQuickFemaleAssassin05.conversations.11.name=莱克莎
LevelQuickFemaleAssassin05.conversations.11.text=<html><body>哈！我就知道！<br>（付钱吧，因杜尔夫！）</body></html>
LevelQuickFemaleAssassin05.conversations.12.name=因杜尔夫
LevelQuickFemaleAssassin05.conversations.12.text=<html><body>安静点，莱克莎！<br>（……顺便说一句，我可没答应跟你赌。）</body></html>
LevelQuickFemaleAssassin05.conversations.13.name=莉扎
LevelQuickFemaleAssassin05.conversations.13.text=我一直盯着一艘渔船，那些人类家伙抓的小鱼多得根本吃不完。我偷偷上过船，这双鼠眼亲眼看见的！
LevelQuickFemaleAssassin05.conversations.14.name=因杜尔夫
LevelQuickFemaleAssassin05.conversations.14.text=哦，所以你想把那些渔民抢个精光，是吗？
LevelQuickFemaleAssassin05.conversations.15.name=莉扎
LevelQuickFemaleAssassin05.conversations.15.text=对对，不过……我可能需要你们帮忙。
LevelQuickFemaleAssassin05.conversations.16.name=莱克莎
LevelQuickFemaleAssassin05.conversations.16.text=我们凭什么要帮你这个被赶出来的小偷？
LevelQuickFemaleAssassin05.conversations.17.name=莉扎
LevelQuickFemaleAssassin05.conversations.17.text=嘿嘿……我有样东西，你可能想要回来。认得这个袋子吗？
LevelQuickFemaleAssassin05.conversations.18.name=因杜尔夫
LevelQuickFemaleAssassin05.conversations.18.text=我的扑克筹码！竟然要拿赎金去换，真不敢相信。天哪，莉扎，你还真是只老鼠！
LevelQuickFemaleAssassin05.conversations.19.name=莉扎
LevelQuickFemaleAssassin05.conversations.19.text=你们帮我，我就还你。成交？
LevelQuickFemaleAssassin05.conversations.20.name=因杜尔夫
LevelQuickFemaleAssassin05.conversations.20.text=我的原则向来是不跟绑匪谈判，不过……
LevelQuickFemaleAssassin05.conversations.21.name=因杜尔夫
LevelQuickFemaleAssassin05.conversations.21.text=你说呢，莱克莎？准备好再去地下犯罪世界冒一回险了吗？
LevelQuickFemaleAssassin05.conversations.22.name=莱克莎
LevelQuickFemaleAssassin05.conversations.22.text=（叹气。）
LevelQuickFemaleAssassin05.conversations.23.name=因杜尔夫
LevelQuickFemaleAssassin05.conversations.23.text=她简直兴奋极了，莉扎。我们马上去码头吧！
LevelQuickFemaleAssassin06.text=<html><body>两位英雄迅速赶到海边，找了一处合适的高处观察周围。几艘船停泊在摇摇欲坠的码头旁，莉扎兴奋地指着其中一艘，让因杜尔夫和莱克莎看。<br><br>巨大的渔船随波轻摇，牵扯着系泊缆绳，发出阵阵嘎吱与呻吟般的响声。奇怪的是，一个船员都看不见。这实在是溜上船的绝佳机会……同样难以忽视的，还有众人刚开始下到船腹时，那股直冲鼻子的鱼腥味。<br><br>根本不需要鼠人敏锐的感官，也知道该往哪走，但莉扎还是一马当先，冲向越来越浓的咸腥气。两位英雄随后来到一间冷藏室门前。<br><br>莉扎推开门，猎物就在眼前——满满一屋都是当天的渔获，有些鱼还在铺着冰的地板上徒劳地扑腾！</body></html>
LevelQuickFemaleAssassin06.location.name=咸狗酒馆 (Salty Dog)
LevelQuickFemaleAssassin06.conversations.0.name=莉扎
LevelQuickFemaleAssassin06.conversations.0.text=小鱼！我就知道它们在这里！
LevelQuickFemaleAssassin06.conversations.1.name=因杜尔夫
LevelQuickFemaleAssassin06.conversations.1.text=老天，莱克莎！大海还真是慷慨，不是吗？
LevelQuickFemaleAssassin06.conversations.2.name=莱克莎
LevelQuickFemaleAssassin06.conversations.2.text=这也太容易了，因杜尔夫……船员呢？别说看门狗了，连只船上的鹦鹉都没有！
LevelQuickFemaleAssassin06.conversations.3.name=水手
LevelQuickFemaleAssassin06.conversations.3.text=什么人？！
LevelQuickFemaleAssassin06.conversations.4.name=莉扎
LevelQuickFemaleAssassin06.conversations.4.text=女巫女士，你话说早了！
LevelQuickFemaleAssassin07.triggers.on-battle-task-1.text=海盗头巾：无单位阵亡地赢得战斗
LevelQuickFemaleAssassin07.triggers.on-battle-task-2.text=海盗小刀：在第8回合结束前击败所有劫掠海盗
LevelQuickFemaleAssassin08.conversations.0.name=因杜尔夫
LevelQuickFemaleAssassin08.conversations.0.text=几条疯狗可算不上什么像样的守卫。船员们一定都跑去酒馆喝酒了！
LevelQuickFemaleAssassin08.conversations.1.name=莉扎
LevelQuickFemaleAssassin08.conversations.1.text=别浪费时间。快点，快点，把小鱼装起来！
LevelQuickFemaleAssassin08.conversations.2.name=莱克莎
LevelQuickFemaleAssassin08.conversations.2.text=等等，那些声音是从……上面传来的吗？因杜尔夫，你听见没有？
LevelQuickFemaleAssassin08.conversations.3.name=因杜尔夫
LevelQuickFemaleAssassin08.conversations.3.text=什么，那些嘎吱声？不过是木船上生活的日常配乐罢了，亲爱的莱克莎。来，把这条大鲤鱼塞进你的手袋！
LevelQuickFemaleAssassin08.conversations.4.name=莱克莎
LevelQuickFemaleAssassin08.conversations.4.text=呕！
LevelQuickFemaleAssassin08.conversations.5.name=莉扎
LevelQuickFemaleAssassin08.conversations.5.text=不，等等！女巫女士说得对。那声音，不是好声音。打鱼的人回来了！
LevelQuickFemaleAssassin08.conversations.6.name=莱克莎
LevelQuickFemaleAssassin08.conversations.6.text=……而且还不止如此，我们又出海了！
LevelQuickFemaleAssassin08.conversations.7.name=因杜尔夫
LevelQuickFemaleAssassin08.conversations.7.text=该死！这些水手没脑子吗？吃喝完要等半个小时才能下水，他们不知道？！
LevelQuickFemaleAssassin09.text=<html><body>船员们不知从哪儿赶着喝完酒回来了，渔船竟然开了航。两位英雄被困在海上了！<br><br>巨浪拍上船身，冰冷的海水从头顶一大片格栅中灌进储藏室。因杜尔夫与莱克莎赶忙凑到舷窗前向外张望，只见一场巨大的风暴正滚滚逼近。<br><br>两人冲出储藏室，爬上通往甲板的梯子。随着风势渐强，那群海盗船员正手忙脚乱地护住船帆，免得被风撕走。<br><br>船上所有人都不知道，波涛下还潜藏着更大的威胁……</body></html>
LevelQuickFemaleAssassin09.location.name=出海！ (Voyage!)
LevelQuickFemaleAssassin09.conversations.0.name=莱克莎
LevelQuickFemaleAssassin09.conversations.0.text=<html><body>我没看错吧？海盗扮成渔民……<br>现在连盗亦有道这回事都没了？</body></html>
LevelQuickFemaleAssassin09.conversations.1.name=因杜尔夫
LevelQuickFemaleAssassin09.conversations.1.text=看他们捞了多少，这群老海狗还真把大海抢了个精光！
LevelQuickFemaleAssassin09.conversations.2.name=莉扎
LevelQuickFemaleAssassin09.conversations.2.text=跟我计划的不一样！怎么才能回岸上？
LevelQuickFemaleAssassin09.conversations.3.name=莱克莎
LevelQuickFemaleAssassin09.conversations.3.text=等等……这回我一定是看错了！有什么东西——不对，是一群东西——正沿着船舷往上爬！
LevelQuickFemaleAssassin09.conversations.4.name=海盗
LevelQuickFemaleAssassin09.conversations.4.text=老天！弟兄们，又是那群该死的海族！
LevelQuickFemaleAssassin09.conversations.5.name=娜迦战士
LevelQuickFemaleAssassin09.conversations.5.text=<html><body>你们这些水手还没长记性……<br>嘶……我们来解救兄弟姐妹了！</body></html>
LevelQuickFemaleAssassin09.conversations.6.name=莱克莎
LevelQuickFemaleAssassin09.conversations.6.text=因杜尔夫，真不敢相信——这是一支解放鱼儿的大军！
LevelQuickFemaleAssassin09.conversations.7.name=因杜尔夫
LevelQuickFemaleAssassin09.conversations.7.text=运气好的话，他们不会把我们当船员。我们的打扮可不像！
LevelQuickFemaleAssassin09.conversations.8.name=莱克莎
LevelQuickFemaleAssassin09.conversations.8.text=可是，呃……我们正背着一袋袋的鱼……
LevelQuickFemaleAssassin09.conversations.9.name=娜迦战士
LevelQuickFemaleAssassin09.conversations.9.text=黑骑士！立刻把那条金枪鱼放回海里！
LevelQuickFemaleAssassin10.triggers.on-battle-task-1.text=海盗帽：在第5回合结束前消灭克拉肯
LevelQuickFemaleAssassin10.triggers.on-battle-task-2.text=海盗鹦鹉：无单位阵亡地赢得战斗
LevelQuickFemaleAssassin11.text=<html><body>战斗打到最后，渔船上的船员显然已被屠戮殆尽。解救任务完成，海族大军最后的幸存者带着整船的渔获，从船舷翻回海中。<br><br>巨浪拍打，狂风怒号，船只失去控制，剧烈摇晃。<br><br>起伏的海面上露出了可怕的航海险障：珊瑚礁尖锐的顶端！风暴正将船推向礁石。<br><br>因杜尔夫攥紧莱克莎的手，拼尽全力抓住一根垂落的绳索；莉扎则紧抱着折断桅杆的底部。众人绷紧身子，准备迎接撞击！</body></html>
LevelQuickFemaleAssassin11.conversations.0.name=因杜尔夫
LevelQuickFemaleAssassin11.conversations.0.text=莱克莎，你学过操控天气吗？
LevelQuickFemaleAssassin11.conversations.1.name=莱克莎
LevelQuickFemaleAssassin11.conversations.1.text=没有魔法能扭转这样的风暴！没船员掌舵，我们死定了！
LevelQuickFemaleAssassin11.conversations.2.name=莉扎
LevelQuickFemaleAssassin11.conversations.2.text=别算上我！我游泳几乎比走路还利索……
LevelQuickFemaleAssassin12.text=<html><body>狂风巨浪混作一团，渔船船底擦过礁石，船壳被撕开，整艘船猛烈地向右舷翻覆。<br><br>众人被凌乱地抛入汹涌海水，溅起巨大的水花，总算飞出了残骸与礁石的范围。<br><br>幸运的潮水将他们全都冲上了一座未知岛屿的沙滩。<br><br>晨曦在地平线上绽开，风暴的乌云渐渐退向远方。</body></html>
LevelQuickFemaleAssassin12.location.name=向岸风 (Onshore Winds)
LevelQuickFemaleAssassin12.conversations.0.name=莉扎
LevelQuickFemaleAssassin12.conversations.0.text=小鱼，我宝贝的小鱼……全没了！
LevelQuickFemaleAssassin12.conversations.1.name=因杜尔夫
LevelQuickFemaleAssassin12.conversations.1.text=莉扎，比起那堆腥臭的战利品，我们还有更大的麻烦。你没看出来吗？我们被困在这里了！
LevelQuickFemaleAssassin12.conversations.2.name=莱克莎
LevelQuickFemaleAssassin12.conversations.2.text=那要不要四处找找？也许有救生筏被冲上岸……
LevelQuickFemaleAssassin13.text=<html><body>受困孤岛，别无选择，两位英雄分头探索起来。平心而论，晨光中的沙滩风景确实不错，但这里可远远算不上海滨度假胜地……<br><br>因杜尔夫一回头，看见远处的莉扎正又蹦又跳，兴奋地挥舞双臂。<br><br>她发现了一艘陷在沙里的失事船只，大小虽然与他们之前乘坐的那艘渔船差不多，却完全是另一艘船。<br><br>奇怪的是，这艘搁浅的船大体完好，只有船壳上一排巨大的咬痕格外惹眼。</body></html>
LevelQuickFemaleAssassin13.conversations.0.name=因杜尔夫
LevelQuickFemaleAssassin13.conversations.0.text=真奇怪。这可不是礁石撞出来的……
LevelQuickFemaleAssassin13.conversations.1.name=莱克莎
LevelQuickFemaleAssassin13.conversations.1.text=那它是怎么翻的？
LevelQuickFemaleAssassin13.conversations.2.name=莉扎
LevelQuickFemaleAssassin13.conversations.2.text=嗯……也许它也被那些愤怒的鱼人袭击了？
LevelQuickFemaleAssassin13.conversations.3.name=因杜尔夫
LevelQuickFemaleAssassin13.conversations.3.text=依我看，这船是被拖上岸，再在沙滩上撕开的！除非海族的队伍里有头海怪，不然我可想不通。
LevelQuickFemaleAssassin13.conversations.4.name=莱克莎
LevelQuickFemaleAssassin13.conversations.4.text=因杜尔夫……他们的队伍里会不会真有海怪？
LevelQuickFemaleAssassin13.conversations.5.name=因杜尔夫
LevelQuickFemaleAssassin13.conversations.5.text=别傻了，莱克莎。那样的怪物根本驯不服！它们饿极了，凡是吞得下的东西，都别指望能跟它们好好相处。
LevelQuickFemaleAssassin13.conversations.6.name=莱克莎
LevelQuickFemaleAssassin13.conversations.6.text=我开始觉得这座岛不对劲了，因杜尔夫……
LevelQuickFemaleAssassin13.conversations.7.name=因杜尔夫
LevelQuickFemaleAssassin13.conversations.7.text=能有多糟呢，莱克莎？最坏也就是我们宰掉海怪，让莉扎带回最大的一份渔获。
LevelQuickFemaleAssassin13.conversations.8.name=莉扎
LevelQuickFemaleAssassin13.conversations.8.text=对，对！这主意我喜欢，人类家伙！
LevelQuickFemaleAssassin13.conversations.9.name=莱克莎
LevelQuickFemaleAssassin13.conversations.9.text=呃哦……因杜尔夫，我想你可能要如愿了。看，有东西从水里出来了！
LevelQuickFemaleAssassin13.conversations.10.name=蟹人
LevelQuickFemaleAssassin13.conversations.10.text=（咔哒，咔哒，咔哒！）
LevelQuickFemaleAssassin14.triggers.on-battle-task-1.text=魔法罗盘：在第5回合结束前消灭所有远洋水母
LevelQuickFemaleAssassin14.triggers.on-battle-task-2.text=魔法宝珠：在第8回合结束前击败海中巨兽
LevelQuickFemaleAssassin15.text=<html><body>最后一头巨型海兽发出一声嘶哑的咆哮，没了生气的身躯轰然倒进浅水，震得沙滩也微微颤动。<br><br>莉扎立刻行动，抽出最锋利的刀，冲向最近的尸体。她的匕首轻易划开死去怪物坚韧如胶的表皮，将巨兽切成方便搬运的肉块。<br><br>海怪的黏液把因杜尔夫的头发抹得紧贴脑后。他擦掉眼前的黏浆，望向附近的失事船只。留下莉扎继续切肉，他与莱克莎朝翻覆的船走去。</body></html>
LevelQuickFemaleAssassin16.text=<html><body>莱克莎踩着因杜尔夫的肩膀，爬上失事船只倾斜的甲板。令人惊喜的是，船尾附近竟还牢牢绑着两艘能够下水的救生艇。<br><br>因杜尔夫抬一头，莱克莎抬另一头，两人使出浑身力气，将救生艇搬到水边。<br><br>莉扎抱着怪物肉来回搬了许多趟，把其中一艘艇塞得满满当当，又找来一段绳子将战利品捆牢。<br><br>众人不想再冒险遇上一群海兽，匆匆向大陆出发了。</body></html>
LevelQuickFemaleAssassin16.conversations.0.name=因杜尔夫
LevelQuickFemaleAssassin16.conversations.0.text=至少接下来路上的口粮有着落了！
LevelQuickFemaleAssassin16.conversations.1.name=莱克莎
LevelQuickFemaleAssassin16.conversations.1.text=呕！生海兽肉？因杜尔夫，你开玩笑吧！
LevelQuickFemaleAssassin16.conversations.2.name=因杜尔夫
LevelQuickFemaleAssassin16.conversations.2.text=亲爱的莱克莎，既然这么挑剔，就赏它一颗火球吧。
LevelQuickFemaleAssassin16.conversations.3.name=莉扎
LevelQuickFemaleAssassin16.conversations.3.text=你们两个真怪。生小鱼可是美味！
LevelQuickFemaleAssassin17.text=<html><body>满身海腥味、急需洗个澡的众人，再次来到再熟悉不过的地方：索罗顿 (Sorodon)。城墙脏兮兮的，此刻看着却莫名亲切。<br><br>他们一上岸就租了头驮骡。来到鼠巢的主入口时，莉扎那堆海怪肉才刚开始招苍蝇。盖在货物上的粗麻布已经被肉块渗出的血水浸湿。<br><br>众人快走到大门前时，一伙绿皮从拱门的阴影里现身，领头的摇着手指，示意队伍立刻停下。</body></html>
LevelQuickFemaleAssassin17.selection-text=<html><body>你的英雄要缴纳关税吗？<br>（你有${gold}金币）</body></html>
LevelQuickFemaleAssassin17.location.name=陆地！ (Land!)
LevelQuickFemaleAssassin17.conversations.0.name=布佐斯
LevelQuickFemaleAssassin17.conversations.0.text=站住。我们得检查那辆车。
LevelQuickFemaleAssassin17.conversations.1.name=因杜尔夫
LevelQuickFemaleAssassin17.conversations.1.text=朋友，真有这个必要吗？
LevelQuickFemaleAssassin17.conversations.2.name=布佐斯
LevelQuickFemaleAssassin17.conversations.2.text=嘿，因杜尔夫！没认出是你。
LevelQuickFemaleAssassin17.conversations.3.name=布佐斯
LevelQuickFemaleAssassin17.conversations.3.text=你这模样……有点狼狈啊。
LevelQuickFemaleAssassin17.conversations.4.name=莱克莎
LevelQuickFemaleAssassin17.conversations.4.text=都怪海风，把他的胡子吹得乱七八糟。
LevelQuickFemaleAssassin17.conversations.5.name=因杜尔夫
LevelQuickFemaleAssassin17.conversations.5.text=听着，我们有急事要进去。这批珍贵货物可耽搁不起，没空闲聊。
LevelQuickFemaleAssassin17.conversations.6.name=布佐斯
LevelQuickFemaleAssassin17.conversations.6.text=闲聊？才不是。今天大门归我们管。意思就是，你得交钱。
LevelQuickFemaleAssassin17.conversations.7.name=莱克莎
LevelQuickFemaleAssassin17.conversations.7.text=哦，饶了我吧。又是保护费？
LevelQuickFemaleAssassin17.conversations.8.name=布佐斯
LevelQuickFemaleAssassin17.conversations.8.text=不是，那是我们以前的买卖。现在所有运进来的东西，我们都收关税。
LevelQuickFemaleAssassin17.conversations.9.name=莱克莎
LevelQuickFemaleAssassin17.conversations.9.text=关税？就凭你们？你们还执起法来了？！
LevelQuickFemaleAssassin17.conversations.10.name=布佐斯
LevelQuickFemaleAssassin17.conversations.10.text=<html><body>对对。为当族长打来打去，我腻了。<br>现在，我是总稽查官。</body></html>
LevelQuickFemaleAssassin17.conversations.11.name=布佐斯
LevelQuickFemaleAssassin17.conversations.11.text=那篷布底下都是什么？
LevelQuickFemaleAssassin17.conversations.12.name=莉扎
LevelQuickFemaleAssassin17.conversations.12.text=嘿！别动，巨魔，谁也不许碰我的肉！
LevelQuickFemaleAssassin17.conversations.13.name=哥布林
LevelQuickFemaleAssassin17.conversations.13.text=鱼肉鱼肉，闻着真香。我想尝尝！给我给我。
LevelQuickFemaleAssassin17.conversations.14.name=莉扎
LevelQuickFemaleAssassin17.conversations.14.text=你敢动，我就戳瞎你的眼！
LevelQuickFemaleAssassin17.conversations.15.name=因杜尔夫
LevelQuickFemaleAssassin17.conversations.15.text=真不想让各位错过这份海中珍馐，不过……
LevelQuickFemaleAssassin17.conversations.16.name=因杜尔夫
LevelQuickFemaleAssassin17.conversations.16.text=我绝不交什么进口费，尤其不会交给一伙绿皮税吏！
LevelQuickFemaleAssassin17.conversations.17.name=布佐斯
LevelQuickFemaleAssassin17.conversations.17.text=<html><body>骑士得交两百。<br>不交，我们就动手。</body></html>
LevelQuickFemaleAssassin17.triggers.on-select-1.text=缴纳关税（200金币）。
LevelQuickFemaleAssassin17.triggers.on-select-1.description=缴纳关税。
LevelQuickFemaleAssassin17.triggers.on-select-2.text=绝不！
LevelQuickFemaleAssassin17.triggers.on-select-2.description=拒绝缴税。=BR=（与兽人战斗！）
LevelQuickFemaleAssassin18.triggers.on-battle-task-1.text=战斗符文斧：在第3回合结束前击倒布佐斯
LevelQuickFemaleAssassin18.triggers.on-battle-task-2.text=金锭×2：在第4回合结束前消灭所有食人魔
LevelQuickFemaleAssassin19.text=<html><body>莉扎跳到倒下的绿皮总稽查官身旁，狠狠踢了他的脑袋一脚。<br><br>她嘴里骂着各式鼠人脏话，回到货车边，小心地重新盖好肉堆上的布。<br><br>这场意外的冒险结束，眼看就要分别，鼠人刺客先向因杜尔夫伸出手，再向莱克莎伸手，热情地与两人握了握。</body></html>
LevelQuickFemaleAssassinRizzaJoin.triggers.on-select-1.text=当然！我们非常欢迎莉扎加入。
LevelQuickFemaleAssassinRizzaJoin.triggers.on-select-2.text=不，我们的队伍已经满员。
LevelQuickFemaleAssassinDefeat.text=<html><body>致命的一击冷酷而精准地命中要害，骨裂声令人作呕，那一击的力量仿佛让时间骤然停滞。<br><br>回头看来，鼠人们开始依赖因杜尔夫与莱克莎，实在是愚蠢；这位新朋友也不例外。<br><br>再也没有谁能回到鼠巢了……</body></html>
