# Main text completion; editable UTF-8 translations.
game.object.dwarfrunemaster.description=矮人天生免疫魔法，因此通常对魔法抱持怀疑态度。不过，矮人图书馆里收藏着古老的符文典籍，仍有少数矮人专心钻研其中的奥秘。
game.object.darkacolyte.description=黑魔法是获得许多黑暗力量与恩赐的前提。这些心灵扭曲的学徒已经掌握了从受害者身上汲取生命能量的技艺。
game.object.king.description=国王统治着广袤的人类王国。他不仅领导有方，还以高超的剑术、过人的勇气和讨女士欢心的本领闻名。他剑刃上的寒光，往往是敌人生前看到的最后景象。
game.object.chaosspawn.description=恐魔是从冥界召唤到人类世界的低阶恶魔。它们行动迟缓笨拙，骇人的外貌却足以令敌人胆寒。
game.object.torchunlit.description=固定在墙上的木制火把。这支还未点燃，随时可以把这里烧个精光。
game.object.crystalball.description=一颗闪闪发光的水晶球。如果它呈现的是未来景象，那么值得期待的是：你的未来将是一片漂亮的蓝色。
game.object.unicorn.description=独角兽是神秘的生物，自古便被视为一切善良与神圣生命的守护者。传说只有纯洁的少女才能驯服独角兽。
game.object.ratmanpackmaster.description=既忠心不二又深谙残暴之道的鼠人，会获授令人垂涎的副官职位。这些爪牙既招人憎恨，也令人畏惧。
game.object.insectoid.description=虫人是生活在地下的巨型昆虫。它们的族群挖掘出庞大的隧道网络，借助这些地下通道避免与其他物种接触。
game.object.jug.description=一种实用的盛水容器。不过这个气味难闻，最近似乎被人拿来当了临时便器。
game.object.dwarfflamethrower.description=矮人工程师大部分时间都泡在工坊里，摆弄机械、磨炼技艺。他们设计的火焰喷射器能喷出一股燃烧的液体。
game.object.turtle.description=这种性情平和、身披天然护甲的爬行动物很有耐心。它在无边沙丘中漫游，寻找难得一见的绿洲，好下水游一游。它天性并不好斗，但谁要耽误了它当天的泡澡时间，准会惹得它大发脾气！
game.object.trainingdummy.description=这是人类特有的玩意儿。世上其他种族都对拿它训练嗤之以鼻，只有人类觉得揍一个大娃娃能练出本事。真搞不懂。
game.object.gargoylemechanical.description=这些危险机械由工程师与胆敢研究石像鬼的人合作制造。它们比石制同类更加坚固，经常被用来填补石像鬼阵亡后的空缺。
game.object.cavebear.description=年轻的洞熊常待在洞穴中。它们体型庞大，力大而行动缓慢，却也足够敏捷，能用致命利爪袭击毫无戒心的冒险者。
game.object.pirate.description=这些海上强盗选择了无法无天的生活，欺凌弱者，掠夺一切值钱之物。他们手持短枪与弯刀，无论海战还是陆战都能站稳脚跟。
game.object.cauldron.description=与大众的想象相反，女巫的大锅通常只是用来做饭。不过，女巫一旦被激怒，大锅就会化为致命武器，施放危险的法术。
game.object.animatedbeddouble.description=这张结实的双人床很经得起折腾。可悲的是，正因为做工扎实，它才不得不承受床垫上发生的种种难以启齿之事。
game.object.giantmauler.description=巨人战士擅长造成溅射伤害，是震慑群敌的高手。他们只需挥动硕大的武器猛砸一次，就能同时将多个单位碾平。
game.object.ballista.description=威力惊人的弩炮是王国军队的新装备。这种战争机器行动缓慢，却力道十足，能将沉重的标枪射向远方。
game.object.mageelementalist.description=元素使是较少为人所知的一类施法者。他们肉体力量不足，却能引导元素之力，驱使火、风、土、水为自己效劳。
game.object.highpriest.description=经过多年严苛的修行与祈祷，这些圣职者达到了神圣的境界，蒙赐强大的魔力。大祭司甚至能唤回逝者的灵魂。
game.object.ratmanalchemist.description=鼠人的科学研究造就了一批专门害人的奇异药水与酊剂。谁也说不准，那些瓶子里晃荡的究竟是什么恶毒化学品！
game.object.irongolem.description=钢铁魔像由钢铁铸成，是最强大的魔像种类之一。它们无法摆脱创造者的控制，常被巫师用作贴身护卫。
game.object.harpy.description=鹰身女妖是半人半鸟的凶猛掠食生物。它们通常栖居在高山洞穴中，并在那里筑巢。
game.object.trollthrower.description=巨魔年纪越大，力气就越大，脑子却未必会长进。久而久之，一些百无聊赖的巨魔发现，隔着老远扔石头也能砸碎别人的脑袋。
game.object.torchlitblue.description=固定在墙上的木制火把。当地独有的特殊易燃混合物，让它燃起了神奇的蓝色火焰。吸入这些蓝色烟雾，后果自负。
game.object.giantstone.description=岩石巨人行动迟缓，头脑简单，却有摧枯拉朽的力量。如今仍活着的岩石巨人，实质上是诸神早期试验留下的原型。
game.object.berserker.description=狂战士是深受混沌影响的人类，作战时会陷入无法控制的狂怒。一旦投身战斗，就只有死亡才能让他们停下。
game.object.totemdisease.description=绿皮制作图腾，并不总是为了帮助友军。有时，邪恶的萨满会造出同样邪恶的图腾，伤害和妨碍敌人。
game.object.statuedragon.description=一座后肢蹲坐的巨龙石像。即使再想骑到它背上，那也有失冒险者的体面。
game.object.warg.description=座狼投身战场，只为满足嗜血的欲望。它们迅捷而致命，远比普通狼危险。
game.object.heater.description=一座沉重的铸铁暖炉，最适合为寒冷的房间取暖；必要时，甚至还能烤几块哥布林肉排。
game.object.revenant.description=数千年前，恶魔势力与死灵法师缔结邪恶契约，将复生亡灵召唤到人类世界。这些巨型骷髅战士积累了数不清的战斗岁月，是极其危险的敌人。
game.object.firestand.description=火架常被用来照亮昏暗的房间与走廊。挂在墙上的叫壁灯，放在地上的叫火盆。不过这些叫法实在太讲究、太矫情了。我们就管它叫火架。
game.object.peasant.description=农民构成了王国农业劳动力的大多数。他们通常一辈子都在耕作一小块土地，而这块地往往还是从当地贵族手里租来的。
game.object.impaledskeleton.description=一位昔日冒险者的骨骸挂在致命陷阱的尖刺之间。想要保证长命百岁？那冒险者可不是合适的职业！
game.object.samuraiarmored.description=这些身经多次委托的佣兵磨炼出了娴熟的战技，也积攒下足够的财富，终于买得起像样的护甲。
game.object.undeadaltar.description=邪灵附在这座祭坛上，使其能唤起死者，组成一支仆从军。这个早被遗忘的圣所用恐惧侵染周围，并驱使亡者照料自身，因此永远不会荒废。
game.object.octopodelectric.description=这些海怪是章鱼的远亲，演化出了类似闪电的能力。虽然仍然迟缓笨拙，它们却能产生强大的电流，连大型哺乳动物也会被电倒！
game.object.chairwooden.description=一把朴素的木椅。看着它，你几乎能听见木匠一边赶制又一把椅子，一边发出无聊的叹息。
game.object.dwarfdeathseeker.description=寻死者早已忘了惜命为何物。这些矮人立下了复仇誓言，为了杀死仇敌，不惜付出任何代价。
game.object.crate.description=木箱常用来运输各种货物。货物送达后，箱子就会被丢弃，或收起来等待下次使用。
game.object.ghostdragon.description=龙族的起源笼罩在迷雾之中，人们对它们最初如何诞生知之甚少。据说，有些龙即使躯体化为灰烬，也依然存世。
game.object.insectoidhunter.description=虫人猎手是虫人世界中的冒险者与佣兵。它们远离巢穴，追寻荣耀和猎物，并能向敌人喷吐致命的酸液。
game.object.treasurechest.description=装有装备和财物的宝箱常见于地牢与洞穴。用力敲上几下，就能打开宝箱，露出里面闪闪发光的东西。
game.object.ogre.description=食人魔是一种体型庞大、残忍丑陋的人形怪物。它们以惊人的力量著称，能在战场上一路碾压践踏敌人，杀出一条宽阔血路。
game.object.pirateupgraded.description=这些恶棍令商人与其他水手闻风丧胆，是公海上的顶级掠食者，所到之处无不遭到劫掠与焚毁。
game.object.nagawarrior.description=娜迦战士以凶残闻名。许多英雄挺身而出，想从它们的怒火中救下无辜者，却在交战中轻易丢掉了性命。
game.object.carnivorousivymutated.description=这些变异沼泽藤蔓是所有植物生物中最神秘的一类。它们锋利如剃刀的牙齿，切开受害者的血肉就像切黄油一样轻松。
game.object.laserbarrelrobot.description=没人知道是哪个疯狂的矮人工匠设计了这些漂浮机械，也没人知道他之前喝了什么。守护者时刻准备着轰飞不受欢迎的访客。
game.object.dancerfemale.description=想象一下，优雅与俏皮融合得如此迷人，连最不听话的舞鞋也会自行踏起舞步。她的腰肢随着醉人的节拍摇曳，仿佛与韵律本身签下了契约。
game.object.knightgriffin.description=只有最勇敢、最出色的骑士，才有机会将战马换成飞行坐骑。狮鹫骑士飞行速度惊人，能轻松越过友军。
game.object.inquisitor.description=并非所有牧师都选择仁慈之道。审判官终身磨炼武艺，与最邪恶的生物作战。他们深厚的信仰能抵御一切已知魔法。
game.object.telescope.description=一架置于四脚支架上的精密望远镜。为他人着想，用完后记得擦擦目镜。
game.object.giantwasp.description=一只长得过大的胡蜂。它们的习性与普通的小型同类相似，只是庞大的体型让它们发怒时更为凶险。通常，只要不受威胁，它们就不会伤人。真惹恼了，跑就对了。
game.object.undeadking.description=亡灵之王是一切生者的终极宿敌。关于这位古老的骷髅君主，人们几乎一无所知，但有一点很清楚：只要他尚未被击败，就会不断派出亡灵战士，毁灭所有生命。
game.object.insectoidlarva.description=虫人的幼体柔软而毫无防御能力，令人作呕的模样足以让未经磨炼的冒险者反胃。幼虫最终会长成工虫或战士，但在成熟之前，需要虫母和族群其他成员时刻保护。
game.object.dwarfmine.description=矮人工匠设计了这种危险陷阱，让闯入者再也走不动。装置内装有大量炸药，静静等待着敌人的靴子落下。
game.object.minotaur.description=牛头人半人半牛，庞大而野蛮，是传说中的劲敌。它们挥舞双刃巨斧，凭借蛮力，连身披重甲的敌人也能劈开。
game.object.orc.description=兽人是凶悍的战士种族，皮肤比人类坚韧，力气也更大。他们嗜血的部落屠戮人类军队，已有漫长的历史。
game.object.weaponrack.description=一座结实的木架，用来存放和展示近战武器。把你最引以为傲的兵器摆在正中间，一定很气派！
game.object.skeletonbeast.description=这是由各种骨骸拼凑而成的造物。它体内没有任何一种生物的骨头多到足以辨明原貌，但这头亡灵混合体既有狼的速度，也有龙的凶猛。
game.object.claygolem.description=黏土魔像是最基础的魔像，也是初学魔法者通常最先学会制造的一种。它完全由普通黏土制成，行动缓慢。
game.object.beartrap.description=这种凶残的机关会狠狠夹住任何不慎踏入利齿间的人，使其无法动弹。
game.object.ratmanassassinmaster.description=只有最残忍、最冷酷无情的刺客，才能熬过血腥杀戮的考验。这些精通暗影与毒药的杀手，早已不再畏惧死亡。
game.object.harpyfury.description=这只鹰身女妖给自己套上了各式偷来的破烂。这身拼凑的护甲丝毫没压住它的狂野怒火。可悲的是，也一样没能遮住它的臭味。
game.object.lavaspire.description=在炎热而遭到腐化的地区，岩浆冲破地表，喷成高耸的熔岩柱。这些可怕的熔岩喷泉将火雨洒向四周，焚尽附近的一切。
game.object.dryadbladedancer.description=剑舞者疾如风、灵如松鼠，是森林近战技艺的巅峰。这些持刃少女以狂风骤雨般的迅捷斩击，逼得敌人片刻不敢松懈。
game.object.dwarflord.description=矮人领主是同族敬重的领袖，通常出身富裕家族或地主之家。他们率领军队，效忠国王或投身神圣事业，也并不罕见。
game.object.driderbloodmage.description=多数蛛人都会使用恶魔魔法，但只有灵魂邪恶者才有潜力成为真正的血法师。蛛人常会反噬那些企图控制它们的人。
game.object.dwarfsentrygun.description=这位哨兵的性格有点古怪，不喜欢不请自来的访客。它习惯朝任何会动的东西开火，不管是头顶飞过的巨龙，还是从树上掉下来的哥布林。
game.object.elementalearth.description=土元素是大自然塑成的岩石丰碑。它们通常温和，但受到惊扰时，也会爆发出极强的攻击性。
game.object.samurai.description=浪人将自己的刀卖给出价最高的人。他们无钱购买护甲或其他防具，只能凭剑术求生。最好的防御就是进攻！
game.object.laserbarrelrobotupgraded.description=装甲守护者比基础型号更先进、防护更好，是不可小觑的强敌。这些构装体不仅守卫指定区域，还会主动追击所有闯入者。
game.object.blackknightindulf.description=黑骑士只为最强大的邪恶统帅效力。他们曾是王国正直的守护者，如今却踏上了黑暗之路。虽然仍保有人类之身，扭曲的灵魂却永远与邪恶相缚。
game.object.troll.description=巨魔是来自山区的强壮生物。它们更喜欢住在偏僻的洞穴里，因此战场上很少能见到巨魔。它们的再生能力堪称传奇。
game.object.giantspider.description=普通蜘蛛通常无害，遍布已知世界的各个角落。但地下辐射会使它们不受控制地生长，变成骇人的怪物。
game.object.vaseflowers.description=一只装饰花瓶。也许有位路人觉得它太冷清，顺手插进了一小束花。
game.object.evileyes.description=邪眼诞生于最纯粹的混沌。只需一瞥，它的魔法凝视就能麻痹任何生物。这些漂浮的肉球有厚实皮肤保护，很难杀死。
game.object.dryadsorceress.description=自然女巫是更睿智、更成熟的林妖，能够驾驭可怕的自然魔法。由于美貌出众，她们常被误认作森林仙女。
game.object.cactustall.description=又一位浑身带刺的思想家，在烈日晒白的荒漠中独居。早年的一阵猛长，使它在仙人掌同族中格外高挑。也许，这株高耸的仙人掌梦想着有一天能长到够着星星……
game.object.goblinrider.description=时至今日，文明世界仍弄不明白哥布林部落究竟如何驯服恐狼。学者们争论不休：到底是哥布林在控制狼，还是狼在控制哥布林？
game.object.direbear.description=恐熊是洞熊更粗壮、更顽强的形态。它们背上长出骨质鳞片，如同护甲一般抵挡冒险者的攻击。
game.object.ratmanabomination.description=鼠族巫术的恐怖试验催生了这些步履沉重的巨鼠。造就这些野兽混合体的腐化能量，至今仍在它们体内涌动。
game.object.turtlebeast.description=一次出人意料的畸形演化，让这种重甲怪物出现在世间。大自然可真擅长制造可怕的怪兽！
game.object.djin.description=灯神被束缚在自己的灯中，既无法离开牢笼，也不能拒绝有幸找到它的冒险者许下的愿望。“替邪恶与神圣之人实现愿望，让我明白双方其实都受同一种东西驱使：对力量的渴望。”
game.object.chaosspawngreater.description=低阶恶魔吞食足够多的凡人血肉后，就会进化成高等恐魔。邪恶的抗性使它们能承受多次打击。
game.object.shade.description=这些无声的杀手潜伏在黑暗中，渴求着生命力。暗影幽魂会伏击毫无戒心的受害者，尤其偏爱独行或看起来虚弱的人。
game.object.blackknight.description=黑骑士只为最强大的邪恶统帅效力。他们曾是王国正直的守护者，如今却踏上了黑暗之路。虽然仍保有人类之身，扭曲的灵魂却永远与邪恶相缚。
game.object.ratmansage.description=魔法天赋在鼠族中极为罕见，但只要幼鼠展现出资质，就会被送上一条格外邪恶的精英之路。这些施法者掌握着黑魔法的力量。
game.object.marineswat.description=凭借全面的战斗训练和极其先进的战术装备，这些久经考验的干员成为无所畏惧的作战专家。
game.object.animatedvasebig.description=装满葡萄酒时，这只花瓶每晚都是众人的焦点，也因此萌生了更大的梦想。可惜，人气只持续到梅洛酒喝光为止。厌倦了被冷落的它如今有了新目标：用敌人的鲜血将自己装满！
game.object.dwarfforgemaster.description=矮人工程师终生与熔炉为伴，不断钻研新技术。年老之后，他们常用机械替换身体上衰弱的部分。
game.object.ranger.description=这些勇敢的斥候由国王麾下最优秀的护林者传授隐蔽技巧。他们闪电般的伏击和出神入化的射术早已成为传奇。
game.object.beastmaster.description=这位蛮族公主坚韧无比，怀着自己的目的与你同行。她自己也只有一半被驯服，却能说多种兽语，说服野兽加入你的队伍。
game.object.chicken.description=下蛋的日子可不好过。冒险者和怪物每天都在大吃它们未出世的孩子。混战开始时，鸡还得提防贴地飞来的火球，免得自己变成晚餐。咯咯咯。
game.object.mimic.description=拟态怪会化作引人注意的无生命物体，以吸引人类猎物，其中最常见的就是宝箱。许多冒险者都曾落入这样的陷阱！
game.object.mummy.description=木乃伊的身体经过特殊物质处理，不会腐烂。它们对多数伤害都有很强的抵抗力，但制作木乃伊的过程也让躯体变得极易燃烧。
game.object.oracle.description=这些少女天生失明，在封闭的姐妹会中长大，是纯洁与信仰的典范。敏锐的感官与对一切恶习的远离，赋予了她们魔法般的视野。
game.object.runetrapfire.description=魔法符文陷阱正等待不知情的闯入者将其触发。随后而来的，将是灾难性的后果。
game.object.dwarfteslagunner.description=矮人找到了驾驭闪电之力的方法。特斯拉炮尚处于试验设计阶段，年轻矮人却已争先恐后地报名，要上战场测试这项发明。
game.object.sandworm.description=沙虫是栖息在沙漠中的巨型蠕虫状生物。它们在沙丘间钻行，所经之处留下一路毁灭的痕迹。
game.object.ent.description=树人诞生于古老森林，是永不疲倦的自然守护者。这些行走的树木披着厚如护甲的树皮，既能抵御敌人攻击，也能抵挡野林中的其他危险。
game.object.barrelempty.description=不过是一个结实的空木桶。原本大概还剩些酒，直到某个口渴的矮人把最后一滴也喝光了。
game.object.couch.description=忙碌一天后，优秀的英雄都值得好好休息。沙发存在的唯一目的，就是为疲惫英雄的屁股提供柔软支撑。而且它也可能很贵，所以请把火球收一收。
game.object.goblincatcher.description=地精捕手常在部落中充当民兵。他们配备投网，能在短距离内网住毫无戒心的敌人。
game.object.wyvern.description=双足飞龙有时会被误认作幼龙，但它们的毒性攻击构成了独特的威胁。这些生物极其好斗，领地意识强烈，见到入侵者便会攻击。
game.object.octopodkraken.description=海洋深处充满神秘怪物。克拉肯虽然不是海底最大的生物，却无疑是深海野兽中最凶残的。
game.object.ratmanhunter.description=这些瘦小猎手只带一把弩，没有其他武器，因此常被敌人轻视。然而，它们的潜踪追猎技巧无人能及。
game.object.chaoshydra.description=烈焰多头蛇是混沌诸神的造物，冥界恶魔很容易将它们腐化。它们仍保留再生能力，变异的血液却极不稳定。
game.object.oracleevil.description=更深的堕落促成了这位邪恶神谕者的蜕变。新掌握的剑术，加上从天界窃来的天使双翼所赋予的机动性，让堕落天使成为真正的威胁。
game.object.corruptedgiantspider.description=长期接触混沌魔法会使蜘蛛产生可怕的变异，形成这些怪物。这些半恶魔、半蛛形的生物，能轻易把成年男子撕成血淋淋的碎块。
game.object.runetraplighting.description=魔法符文陷阱正等待不知情的闯入者将其触发。随后而来的，将是灾难性的后果。
game.object.cactus.description=很少有植物比仙人掌更孤独。炎热沙漠中罕见的雨水限制了它们的数量，满身尖刺又让它们更加孤立。不过，仙人掌也有崇拜者——那些羡慕并向往它宁静独居生活的哲学家。
game.object.slime.description=史莱姆是没有心智的生物，在地底深处组成庞大的群落。它们很容易被砍成碎块，但哪怕只剩一丁点残渣，也会很快长回原来的大小。
game.object.demonmistress.description=只有最出色、最受宠的魅魔，才有资格晋升为恶魔女主人。她们妖娆而危险，拥有极为高深的魔法造诣。
game.object.skullcatapult.description=见过这种邪恶机械还能活着讲述的人寥寥无几。亡灵用它将燃烧的颅骨投向敌阵。
game.object.vasebig.description=一个空空的椭圆形花瓶。它让整间屋子的摆设看起来协调多了。
game.object.torchlit.description=火把是一端裹有可燃材料的木棍，点燃后可用来照明。有了这项发明，怪物们再也不用摸黑等英雄上门了。
game.object.ratmanheadhunter.description=鼠人猎头者以残酷闻名，敌人和同族都对它们心怀恐惧。谁在战场上遇见这种生物，动手前都得再三思量。
game.object.mandragora.description=这些恶毒的植物藏在地下，等待毫无戒心的冒险者靠近。现身时，它们会猛然破土而出，将酸液喷洒到受害者身上。
game.object.hydramechanical.description=只有最富有、技艺最精湛的工程师才能造出这些庞大机械。它们仿照多头蛇设计，能同时与多个敌人交战，天真的士兵和冒险者常会把它们当成真家伙。
game.object.demonologist.description=恶魔术士诞生于混沌，对各种卑劣邪恶之事了如指掌。他们运用这些知识侍奉恶魔，确保主人的一切需求都得到满足。
game.object.tablefancy.description=一张做工精良的桌子，有华丽饰边和金属桌脚。看样子，它曾承托过不少大杯麦酒。
game.object.cow.description=白天，这些会移动的牛奶工厂在青草地上悠闲漫步；夜里，则被安全地关进谷仓。尽管体型庞大、食量惊人，唯一需要害怕它们牙口的东西，也不过是草叶。
game.object.fairy.description=这些娇小的魔法生物乐于帮助善良的英雄完成任务。别被可爱的外貌骗了，妖精一旦发怒，就会迅速以闪电之力发动攻击。
game.object.driderwarrior.description=擅长近战的蛛人。它们的变形往往伴随着疯狂与嗜血。这些专精战斗的蛛人以顽强和残酷著称。
game.object.vampirelady.description=侍奉吸血鬼领主的黑暗女伴。据传，许多女吸血鬼曾是贵族淑女，后来落入吸血鬼领主邪恶魅力的圈套。
game.object.witchyoung.description=最有天赋的年轻女术士会在顶尖魔法学院磨炼技艺。虽然经验尚浅，她们天生的才能已让强大法术信手拈来。
game.object.explosivebarrel.description=火药桶被点燃或遭到枪击时就会爆炸。猛烈的爆炸能有效消灭成群的脆弱生物，不论它们是活物还是亡灵。
game.object.swampflower.description=在沼泽中偏离常走道路的旅人，很容易遇到暴躁的沼泽花。它们领地意识强烈，会立刻发出愤怒的嘶声并喷吐毒液。可以绕开的话，最好别去打扰。
game.object.dwarfmutant.description=地下洞穴中的辐射可能使毫无防备的矮人发生变异。变异矮人早已丧失理智，沦为残暴的杀戮机器。
game.object.valkyrie.description=这些传说中的女战士是光明的勇猛捍卫者，在局势不利时，她们的出现足以振奋人心。女武神身手敏捷、精通长矛，常成为战场上的救星。
game.object.blackdragon.description=黑龙是所有龙中最强大的一种。它们灼热的吐息能轻易熔毁整支军队，随后往往会吞食所有幸存者。黑龙的撕咬几乎总是致命的。
game.object.dwarfghost.description=矮人的先祖注视着如今的后辈。这些古代英雄，至少对后人的成就——或者说毫无成就——感到十分失望。
game.object.fungusoidelder.description=菌人长老凭借高龄积累的经验，比大多数菌人更聪明。它们懂得在攻击中巧妙运用毒素。
game.object.goblinsapper.description=哥布林掌握着制造爆炸性黑火药的秘密。摧毁敌人、在荣耀的爆炸中结束生命——这样的许诺常让哥布林心潮澎湃，下一个工兵便会自告奋勇地站出来！
game.object.trashsewer.description=一堆被下水道清洁工拢起来的肮脏废弃物。如今的城里人真是什么都往外扔……
game.object.vampirefog.description=迷雾形态是吸血鬼领主的诸多能力之一。眨眼之间，吸血鬼便能化为雾气，自由穿过门窗，甚至渗过多孔的墙壁。
game.object.imp.description=这个来自冥界的恶魔仆从虽然法力不强，却不容小觑。小恶魔恶毒而记仇，以不屈不挠的韧性弥补身体上的孱弱。
game.object.grainbags.description=这些被遗忘的粮袋遭老鼠啃得千疮百孔，早已腐臭，堆在旧屋和地窖的角落里积灰。许多主人连挪都不敢挪，唯恐惊动藏在其中的暴躁老鼠。
game.object.giantspiderblack.description=黑蜘蛛是适应了深洞与地下隧道生活的稀有品种。它们极其凶猛，常把猎物撕成一团面目全非的碎肉。
game.object.treasurechestmagic.description=这些强化宝箱常装着传奇英雄、甚至诸神本人的圣物与装备！有本事的冒险队总会留意这些散发光芒的箱子。
game.object.corruptedent.description=这棵树人已被混沌附身，受驱使以重击碾碎一切生命。只有死亡才能让这位腐化的森林守护者停下。
game.object.witch.description=圣教会虽已禁止巫术，女巫们仍在修习黑魔法、钻研诅咒。她们的力量依赖狂野的魔力，而非学识。
game.object.werewolf.description=兽化症会使受害者变成半人半兽的怪物。大多数狼人曾经只是普通人，如今却怀着永远无法满足的嗜血渴望。
game.object.bonegolem.description=这些亡灵构装体由骨头制成，以魔法维系。单凭现身，它们就足以令敌人胆寒。
game.object.knightevil.description=贵族的次子往往分不到多少家产，只好自行积攒财富。胸中的怨恨可能让他们从内到外彻底腐化。
game.object.shitgolem.description=地下城的魔法总以神秘的方式运作。不知是疯狂法师的恶趣味，还是健忘的炼金学徒把失败的试验品倒进了水槽，这个构装体其实就是一堆活过来的……呃，粪便。不论冒险者还是怪物，都想离它远远的。
game.object.sirenwitch.description=一切诱人的外表都已被抛弃，露出了底下丑陋的真相。这些满怀憎恨的老巫婆是水手的克星，以召唤强大风暴而闻名。
game.object.shaman.description=萨满信仰在绿皮社会中占有重要地位。萨满既提供精神指引，也在战场上积极支援同族战士。
game.object.dungeondoor.description=门与闸门常被用来把好奇的冒险者和贵重物品、隐秘宝藏隔开。有时，它们也是为了让冒险者与那些急切等待下一顿饭的东西保持安全距离。
game.object.samuraiundead.description=对高贵的武士而言，死后被粗暴地唤起是最大的耻辱。他们对被迫复生心怀愤恨，却仍保有精湛剑术。亡灵武士满怀复仇之意，绝不罢休。
game.object.seadiver.description=潜海者沿岸结成部落，过着和平的生活。别被它们肥胖的身躯和鱼类般的外貌误导——这些生物可结实得很。
game.object.barricade.description=这些用各式物品仓促搭起的工事，能阻挡士兵推进。围城战和巷战中，也常以路障为持远程武器的士兵提供掩护。
game.object.giantrat.description=无底的饥饿与凶恶的本性驱使巨鼠成群发动攻击。它们足以淹没落单的农民或家畜，但对训练有素的战士几乎构不成威胁。
game.object.sporestrap.description=这些看似无害的球状物会产生毒素，伤害人类及其他生物。接触过量毒素可能损害健康，有时甚至会致命。
game.object.totemheal.description=没有绿皮愿意承认，但再强悍的生物偶尔也需要关爱。这些图腾散发滋养光环，愈合附近战士在战斗中受到的创伤。
game.object.lightningball.description=闪电球是矮人防御系统的一部分，能积蓄能量，向入侵者释放强力电击。它们通常接入同一套电网。
game.object.animatedchairwooden.description=这件被附身的家具格外暴躁。一辈子被奴役在屋里，让无数屁股粗鲁地坐在身上，还得忍受令人窒息的臭屁。如今，这把椅子准备拿敌人来翻新自己的坐垫了！
game.object.swampbeast.description=沼泽中怪物众多，但这团纠缠着藤蔓触须与尖牙的恐怖造物，仍是其中最出色的畸变怪物之一。它的许多张嘴，都急切地等着吞食倒霉的旅人。
game.object.ratmansagegrand.description=鼠族大贤者诡计多端，对扭曲法术的运用经验深厚，是世间最危险的黑魔法施法者。
game.object.wolf.description=狼依靠耐力和速度狩猎，通常会远离人类聚居地。不过，近几年的冬天格外严酷。
game.object.dwarfwarrior.description=矮人是古老而骄傲的战士种族。他们为荣誉而活，以坚韧和力量著称，通常居住在山中的要塞里。
game.object.lady.description=这位人类贵族接受的是宫廷礼仪训练，而非战斗训练。贵妇需要护卫随行，才能活着赶赴下一场社交活动。
game.object.fungusoidvampiric.description=寄生菌人偏爱地底深处的黑暗洞穴，并为适应这种环境发生了变化。这种隐居的菌人变种吞食猎物时毫不留情。
game.object.werewolfalpha.description=狼人首领是狼群中最凶残的成员。庞大的体型与力量使其成为群兽无可争议的领袖。与狼人首领交手后还能活下来的生物寥寥无几。
game.object.icegolem.description=寒冰魔像由坚如钢铁的冰构成，被称作冬天的使者，所到之处万物冻结。每年，它们从遥远的东方迁往矮人领地，将愈发凛冽的寒意一同带来。
game.object.ratmanguardian.description=这些经验丰富的士兵在鼠族军队中至关重要。相比其他部队，鼠人卫士的战技与装备都更出色，因此常被倚为贴身护卫。
game.object.animatedtrainingdummy.description=这是人类特有的玩意儿。世上其他种族都对拿它训练嗤之以鼻，只有人类觉得揍一个大娃娃能练出本事。真搞不懂。
game.object.monk.description=僧侣引领着王国各地的诸多信仰，深受信众敬重。所有圣职者都能随心引导神圣能量。
game.object.leverfloor.description=往任一方向扳动它，就会操纵深处某个神秘机关。若不知道它连着什么，最好先想清楚：出现秘密宝藏和喷火巨龙的可能性，可是一样大的。
game.object.willowisp.description=许多战士曾被鬼火的小巧外形蒙骗。这些受诅咒的灵魂同时遭天界与冥界驱逐，拥有附身受害者的力量。
game.object.totemfear.description=绿皮用败亡敌人的遗骸标记领地。冒险者一旦走近这样的战利品，就该提高警惕——嗜血的绿皮就在附近……
game.object.mechanicaldragon.description=这种机械巨兽以世间的巨龙为蓝本设计。虽然机械之躯比不上真龙的力量，它却十分坚固，打起人来也绝不含糊。
game.object.cyclopswar.description=披甲独眼巨人战士的蛮力，在近身搏斗中不容小觑。他们磨炼了战斗技巧，也会受雇充当佣兵。
game.object.harpywitch.description=这只有羽毛的恶兽天生聪慧，能够掌握闪电魔法，是同类中极为罕见的存在。不仅如此，它完全不懂低调，尖叫声几里外都听得见，而浓烈的臭气还能飘得更远！
game.object.elementalwater.description=水元素是行动迟缓的液体团块，多见于淡水湖附近。它们会将敌人活活淹死。
game.object.hydra.description=多头蛇是拥有多个头颅的古老巨兽，再生能力惊人。与它交战的战士，会发现自己同时受到四面八方的攻击。
game.object.ratmanplaguecannon.description=这门可怕的火炮从远处发射浓缩毒液。每次射击释放的疫病毒云，都能让战场笼罩在毒雾之中。
game.object.animatedarmor.description=活化铠甲由人类炼金术士创造，常被贵族和巨富用作护卫，永远忠于保护主人。
game.object.chaosmage.description=混沌法师所属的团体，是所有法师公会中最隐秘的。虽然外界对他们的仪式所知甚少，但可以确定，他们的力量源自冥界。
game.object.ratmancrossbow.description=这些鼠人已赢得鼠族信任，成为可靠的射手。它们以致命弩术著称，射出的弩矢连最厚的护甲也能穿透。
game.object.animatedarmorupgraded.description=这副活化铠甲经过特别加固和强化，化为致命的战争机器。它对主人忠心不二，会为主人战斗至死。
game.object.giantice.description=冰霜巨人在冰封苔原上游荡，寻找可冻成冰块的敌人。不幸与冰霜巨人对峙的家伙，最好穿得暖和一点！
game.object.marine.description=海军陆战队员配备速射步枪，能轻易消灭远处的目标。全面的战斗训练和团队协作能力，让他们成为十分高效的战士。
game.object.bull.description=这头庞大的公牛，脾气和巨角一样大。它以王者的力量与气度巡视田野。沉重的蹄步令大地震颤，深沉的咆哮随风传遍四方。
game.object.tablewooden.description=一张沉重的木桌。想必已有不少笨手笨脚的冒险者被它尖锐的桌角撞伤。
game.object.tavernkeeper.description=这位酒馆老板以容不得店里胡闹而闻名。据传他有部分兽人血统，因此力大无穷、毫不畏缩，足以收拾任何从荒野闯进来的暴躁兽人。
game.object.bard.description=吟游诗人是以音乐讲述故事的行家，游历王国寻找灵感。不管是否身处战场，这些机敏之人都曾从重重险境与无数危机中幸存。
game.object.magmagolem.description=熔岩魔像的力量远胜人类，对物理伤害也有极强的抵抗力。最古老的熔岩魔像还能积蓄热量，将其化作武器。
game.object.djinifrit.description=伊弗利特是驾驭火焰的沙漠恶魔。鲜有生物能在烈日炙烤的沙丘间繁盛生存，这片恶劣之地却正是它汲取魔力的源泉。它燃起的炽烈火海，可不只是晒伤那么简单！
game.object.anvil.description=铁匠用来打造刀剑及其他实用物品的工具。它不会还手，不过你能在一个回合里把它毁掉吗？
game.object.samuraidemon.description=邪灵侵入了这名战士的躯体，抹去全部记忆，以无法满足的嗜血欲望取而代之。这个半人半魔的存在，如今成了施展可怕暴力的杀戮工具。
game.object.cannon.description=矮人是出色的工程师，他们造出的战场机械令人胆寒。加农炮是一种远程火炮，能将高爆榴弹射入敌阵深处。
game.object.ninja.description=忍者是专精破坏、渗透和暗杀的秘密行动者。这些暗影战士拥有惊人的隐蔽技巧，即使正面交战也能消失无踪。虽能顷刻隐身脱离，忍者在几乎任何情况下都敢坚守阵地。
game.object.totembattle.description=兽人奉行简单的蛮力法则。很少有什么比回忆起战场上最辉煌的胜利，更能激发他们的斗志。
game.object.chimera.description=奇美拉诞生于邪恶巫师和炼金术士的污秽试验。人们对培育这种怪物的过程知之甚少。它们极其危险，见到就该立即除掉。
game.object.cyclops.description=这些步履沉重的独眼蛮兽作战凶猛，挥动棍棒的力量足以把对手砸成肉泥。它们脑子不够好，力气却绰绰有余。
game.object.naga.description=娜迦是生有多臂的蛇人，因恐吓水手和侵袭近水聚落而闻名。这种可怕生物以雌性居多。
game.object.zombiesuper.description=这个亡灵怪物由各种互不相容的身体零件缝合而成，杂乱骇人。然而，其中的大脑似乎很喜欢这具怪异的新身体。
game.object.octopod.description=章鱼被强大的水术师召唤到地表。凭借惊人的力量与耐力，这些适应力强的生物成了难缠的对手。
game.object.firearcher.description=弓箭手可通过专门训练成为烈焰弓箭手。他们在中距离上能造成毁灭性的打击，但箭上的火焰在抵达远处目标前就会熄灭。
game.object.vasedecorative.description=一只由三尊石像鬼托起的装饰花瓶。出于礼貌，往里面看之前，最好先问问石像鬼。
game.object.barrelgrain.description=一桶陈粮。算上里面窜来窜去的那只老鼠，这桶粮食倒能磨成高蛋白面粉。
game.object.fiend.description=凶魔被从地狱最黑暗的深层召唤而来，在人类世界游荡，对混沌、死亡与力量怀着永不满足的渴望。
game.object.dwarfgunner.description=矮人火枪手天生沉着有序，不易惊慌。即使敌人已逼到眼前，他们仍能冷静地装填并开火。
game.object.barricadegate.description=一扇坚固的金属门，可迅速部署在战场上。虽然略有破损，它依然结实得足以抵挡食人魔的冲撞。
game.object.bonedragon.description=龙尸极为罕见，却又备受追捧。死灵法师会唤起巨龙的骨架，令其为黑暗军团而战。
game.object.stoveiron.description=一座烧得通红的重型铁炉。若有女巫把火坑换成它，熬药的效率肯定能突飞猛进。
game.object.jellyfishdeep.description=这些胆小的水生生物栖息在最深的海域，极少现身水面。远洋水母独特的生理构造，使其能抵抗所有魔法。
game.object.snailartillery.description=海洋深处孕育着许多奇异怪物。这些行动缓慢的肉食螺类，为了远距离猎食，演化出了发射有毒投射物的能力。
game.object.tablewoodenlong.description=一张长木桌。又是一件家具。
game.object.fungusoid.description=这些人形生物多见于沼泽和林地。虽然头脑相当简单，它们仍聪明到足以制作弓箭。
game.object.runetrapfreeze.description=魔法符文陷阱正等待不知情的闯入者将其触发。随后而来的，将是灾难性的后果。
game.object.redcrystal.description=熔岩经过结晶和高度压缩，形成了熔岩水晶。它们常见于炽热火山的底部，极不稳定，随时可能爆炸。
game.object.wyverneggs.description=传说有些倒霉的冒险者，居然觉得偷双足飞龙的蛋是个好主意。护崽的父母可一直潜伏在附近。
game.object.jellyfish.description=这种淡蓝色生物原生于寒冷的深海，身体部分由带电的冰构成，会不断吸走周围的热量。
game.object.grainbag.description=这些被遗忘的粮袋遭老鼠啃得千疮百孔，早已腐臭，堆在旧屋和地窖的角落里积灰。许多主人连挪都不敢挪，唯恐惊动藏在其中的暴躁老鼠。
game.object.abomination.description=僵尸吞食足够多的人肉后，就会变成憎恶。它们以蛮力弥补速度的不足。
game.object.ratmanthrull.description=施加在这些奴隶鼠身上的试验摧毁了它们的心智。它们半是机械、半是血肉骨骼，谁也不知道其中受尽折磨的灵魂是否还完整。
game.object.swampwillow.description=这些模样诡异的枝条在世界南部相当常见。它们栖居于沼泽的偏僻角落，静伏不动、悄无声息；一旦被惊扰，就会向四面八方抽打带刺的枝干。
game.object.ratmanbrute.description=这些凶暴蛮兵是鼠族巫师的试验产物。鼠人蛮兵被剥夺了求生本能，会毫不犹豫地投入任何混战。
game.object.barrelwater.description=一大桶死水。谁知道浑浊的深处藏着什么，说不定桶底还游着一两只克拉肯呢。
game.object.hellbat.description=地狱蝠原生于冥界的火山地带，藏身于地狱烈火之中。火焰为它们提供伪装，等猎物察觉，往往为时已晚。
game.object.channeler.description=引魔者是天生的施法者，能够迅速召来混沌的本质。这些黑暗灵媒常受冥界恶魔操控，充当混沌魔法的容器。
game.object.vampirehunter.description=吸血鬼猎人是一位勇敢、技艺高超的少女，对吸血鬼及其他邪恶造物怀有无可比拟的憎恨。
game.object.crabman.description=海中无休止的残酷争斗，造就了这种高度演化的甲壳生物。厚实的外壳与巨钳，让蟹人在陆地战斗中同样强悍。
game.object.vampirebat.description=这些巨型蝙蝠常见于废弃建筑附近，也可能预示着附近就有吸血鬼的巢穴。
game.object.succubus.description=魅魔是来自冥界的女性恶魔，生来便为诱惑愚蠢的凡人，将他们引入混沌的怀抱。
game.object.blackorc.description=黑兽人的名字，既源于肤色，也源于它们阴沉无情的性情。在所有兽人中，黑兽人最为难缠，对手即使获胜，也必将付出惨重代价。
game.object.ratmanscout.description=鼠人斥候处于鼠族阶层的最底层。没人指望它们能活着返回巢穴，数量压倒质量才是这里的法则。
game.object.snowman.description=雪人是生活在王国极北地区的古老物种。它们偶尔也会在冬季南下，不过这种情况很少见。别想拿走它的胡萝卜！
game.object.evileyeselder.description=这只长寿的漂浮怪物在侍奉混沌的过程中证明了自身价值。邪眼长老老练狡诈，拥有比年轻同类更强大的魔法能力。
game.object.warlock.description=术士通过进入灵界或其他维度获取知识与力量。多年的神秘修行，为他们带来了渊博的学识与强大的法力。
game.object.seadiverfisher.description=渔夫负责为部落提供食物，每日的渔获确保所有潜海者都有饭吃。然而，冲突来临时，渔夫也会挺身而出。
game.object.blademaster.description=军中最出色的士兵有机会参加国王的比武大会，胜者将跻身精英战士之列。
game.object.animatedtablefancy.description=这张雕工精美的桌子虽有满腹抱负，却始终只能托着无穷无尽的滚烫餐具和沉重餐盘。如今怒火灌满了每一条桌腿，它准备掀桌了——掀它自己！
game.object.dryadhuntress.description=这些冷酷的林妖疾如风、静如夜，精通狩猎之道。面对入侵者时，她们也会毫不犹豫地挺身保卫森林。
game.object.gargoyleelder.description=这些最古老的石像鬼早已与自然融为一体。它们免疫多种元素魔法，是战场上极难对付的敌人。
game.object.matureslime.description=过度生长的史莱姆成熟后，会在深邃炎热的洞穴中定居。在这样的环境里成长，它们的体表逐渐长满毒腺。
game.object.entsaproling.description=幼树人是林妖最亲密的伙伴，也是森林族群中数量最多的成员。这些森林的牧者，无论何时都会捍卫自然。
game.object.warogre.description=兽人将食人魔训练成军中战士，造就了几乎无法阻挡的杀戮机器。战争食人魔一踏上战场，只有最勇敢的战士还敢留下迎战。
game.object.couchcorner.description=一张柔软的红色沙发，很适合摆在房间角落。对那些不愿为了舒适而牺牲视野、疑神疑鬼的客人来说，再合适不过。
game.object.magiccrystal.description=这些水晶的起源大多不为人知，但其存在已有充分记载。人们发现，魔法水晶会从周围环境汲取力量，储存原始魔力。
game.object.nobleyoung.description=光听头衔，你会以为这位贵族该披着华丽斗篷，出入盛大宴会。可实际上，他就是个行走的矛盾体，连自己摆出的优雅架子都能把自己绊倒。
game.object.statuelampman.description=一尊跪姿男子雕像，手中托着祭祀用的供盘。上次的供品一定很合诸神胃口，因为盘子已经空了。
game.object.ratmangrenadierarmored.description=这些老练鼠人穿着厚重防具，可抵御箭矢及其他投射物。不过，护甲也大幅妨碍了它们的行动灵活性。
game.object.mortar.description=沉重的炮管与精巧的设计，让这门炮成为理想的远程火炮。华丽的龙形装饰，似乎也在暗示它猛烈的爆炸火力！
game.object.elementalfire.description=火元素常被误认作没有知觉的火焰，实际上却是活生生的篝火，以倒木及其他易燃物为食。它们能发射爆裂火球，将敌人烧成灰烬。
game.object.seadiverwarrior.description=这些生物担任部落的守卫。短腿虽无法赋予它们迅捷的机动性，粗壮结实的体格却格外适合防守。
game.object.reddragon.description=红龙是寿命长达数千年的传奇生物。它们顽强而强大，通常无法施展魔法，但厚重的鳞甲能抵抗一切已知魔法。
game.object.gianteelpoisonous.description=这种海蛇的撕咬格外危险，鲜艳的体色就是明白的警告。不过，猎物若能活到毒液发作，已经算走运了！
game.object.chieftain.description=兽人酋长通常是部落中战技最高、最为凶猛的战士。他们既有蛮力也懂谋略，是战场上狡猾而无情的对手。
game.object.elementalair.description=风元素宛如微型风暴，是凝成实体的冰冷狂风，被激怒时会发出诡异的呼啸。它们向附近敌人释放刺骨寒风。
game.object.statuelizard.description=一座瞪大眼睛的蜥蜴装饰雕像。为了得到这种表情，雕刻师一定踩了那只可怜模特的尾巴。
game.object.vampirehydra.description=在死灵法师邪恶魔法的影响下，多头蛇的身体发生变异，化为可怕的亡灵巨兽。吸血多头蛇失去了天然再生能力，却能通过饮用凡人鲜血补充力量。
game.object.ratmanassassinfemale.description=这位身手敏捷的雌性鼠人刺客轻盈而致命，灵巧无人能及。她行动优雅无声，出手迅速精准，学来的魔法把戏更添几分杀伤力。
game.object.giantredcrab.description=这只诞生于海洋的巨型甲壳生物经常登上陆地，肆意横行破坏。没有护甲能承受巨钳的碾压，而它厚重的甲壳足以抵挡最猛烈的打击。
game.object.sarcophagusmummy.description=“石棺”一词在古语中意为“食肉之石”。这是因为石棺通常由石灰岩雕成，而人们曾相信这种材料能分解封存在其中的尸体。
game.object.toxicspores.description=自然界有各式各样的有毒植物，剧毒孢子便是其中之一。这些绿色囊泡受到惊扰时会炸开，释放一阵毒雾。
game.object.pig.description=这是一头猪。通常很臭，但总的来说，是种快乐又可爱的动物。既能当友善的伙伴，也能变成可口的点心。
game.object.waspnest.description=通常最好绕开胡蜂巢。野外这些难看的蜂巢里，住着的可比聚落附近那些小虫子致命得多。
game.object.barbarian.description=王国偏远地区生活着许多未开化的部落。这些野蛮战士很容易受混沌邪教徒蒙骗，因此常能在邪教军队中见到他们。
game.object.dwarfrouge.description=这些神出鬼没的矮人受过潜行与欺瞒方面的精细训练。虽然通常负责收集情报和追踪敌人，他们在战场上也同样能干。
game.object.beddouble.description=一张铺得整整齐齐的双人床。床单表面没有神秘污渍，所以大概不是从妓院收来的二手货。
game.object.ratmanbrawler.description=这些鼠族成员懂得保全自己，因而赢得了几分尊重，也得到一些基础装备，好让自己活得更久。
game.object.summoner.description=召唤师是以法力侍奉混沌与邪恶的黑暗施法者。他们召来混沌生物，期望自己也能获得恶魔之力。
game.object.hellblazer.description=地狱雷炮半是机械、半是恶魔，是冥界的终极远程武器。它们能向敌群释放一轮致命的闪电齐射。
game.object.nucleargoblinsapper.description=这个一心求死的哥布林拿到了核物理博士学位，可惜最终还是爆炸成性……小心核爆地精工兵（TM）！
game.object.bonetrap.description=死灵法师布置的骇人陷阱。毫不知情的行人一旦踩上这堆骨头，邪恶魔法便会使它们活化，化为致命机关。
game.object.sarcophagusbroken.description=这具石棺的前任主人似乎被赶走了。可能是一群吵闹的冒险者，也可能是负担不起的房租涨幅，逼得原住户搬了家。你永远无法确定，但如果这样能让你好受些，倒也可以把石棺砸个粉碎。
game.object.blackirongolem.description=毁灭魔像是犯罪头目打造的终极战争机器。任何侥幸逃过它灼热目光的对手，都会被强大的利爪无情碾碎！
game.object.giantscorpion.description=身为巨大的蛛形动物，又有剃刀般锋利的双钳和带毒的尾巴，沙漠蝎实在很难交到朋友。见到访客时，它们通常会发火。大发雷霆。
game.object.barrel.description=不过是一个旧木桶。既然无人看守，多半已经空了。不过，砸起来倒挺痛快。
game.object.executioner.description=这个冷血杀手精通夺命之道，在这残忍行当里干得好，意味着一击毙命。那把可怕的斧头，究竟砍掉过多少颗脑袋？
game.object.ratmanassassin.description=鼠族中最狡猾、最善潜行的成员会成为鼠人刺客。它们受过严格的隐匿训练，避开侦测的本领堪称传奇。
game.object.drider.description=蜘蛛与世间某种人形种族结合而成的可怕混合体。没人能确定它们是自然诞生的，还是完全出自邪恶的变形术。
game.object.dryad.description=这些栖居森林、亲近自然的少女，据说曾经是人类，但真正的起源无人知晓。对自然的深厚亲和力，让她们成为强大的盟友。
game.object.nagaarcher.description=人们普遍认为，这些丑陋生物使用了某种魔法来辅助射箭。娜迦弓箭手放箭的频率与速度，无人能及。
game.object.giantwaspkiller.description=这种蜂比普通工蜂凶猛得多。人们都知道，过分热心的农夫和冒险者可能被它们巨大的毒针刺穿，直接带走。
game.object.insectoidbrute.description=虫人蛮兵是虫族中专门负责作战的士兵。虽然倾向于避免冲突，但在战斗中，它们完全有能力守住阵脚。
game.object.siren.description=这些海中少女以魅力闻名。美人鱼通常待人友善，即使没有报酬，也常会帮助采珠人返回水面。
game.object.bansheeancient.description=这些幽灵来自久被遗忘的过去，历经千年不死岁月而陷入疯狂，力量也随之增强。它们不再只依赖魔法，还能以直接的手段伤害活物！
game.object.gargoyle.description=由早已失传的魔法赋予生命的石雕。石像鬼常被用于保护圣地，防范恶魔侵扰。白天，它们耐心地待在守护的建筑顶端，只有入夜才会活动。
game.object.samuraigunner.description=这名浪人用武士刀换来了一杆步枪，彻底抛弃武士的荣誉准则，更愿意从安全的远处逐个射杀对手。
game.object.snake.description=这种无肢爬行动物几乎遍布已知世界的各个角落。蛇带有毒液，会先用致命毒素麻痹或杀死猎物，再将其吞下。
game.object.mancubus.description=这个怪物是男人与魅魔禁忌之爱的产物。它们在人类世界极为罕见，外形怪诞，力量却十分惊人。
game.object.mancubusbrute.description=这是曼库魔中更具攻击性的变种，经常试图确立自己的统治地位。人类世界中，鲜有生物挨过它们巨槌的一击还能活下来。
game.object.stonegolem.description=这些行动缓慢的生物由坚石雕成，再以早已失传的古老魔法赋予生命。岩石魔像对一切物理伤害都有很强的抵抗力。
game.object.plaguerat.description=疫鼠常栖居在城市下水道深处，很少出现在地表。它们的咬伤携带侵蚀全身的疾病，很容易传染给粗心的冒险者。
game.object.carnivorousivy.description=这些食肉植物多见于沼泽，通常藏在树木和灌丛附近。沼泽藤蔓会缠住路过的冒险者，吞食他们的血肉。
game.object.gianteel.description=这种蛇形生物张开的巨口中长满利刃般的牙齿，模样令人胆寒。它擅长猎杀大型猎物，一口就能轻易咬穿重甲。
game.object.unicornwar.description=这些独角兽的战斗潜能已被激发，迫不及待地要踏碎一切邪恶。它们无所畏惧，面对挡路的污秽生物，会毫不犹豫地发起冲锋。
game.object.cerberus.description=这头可怕的火焰恶魔化作三头犬，三张燃烧着烈焰的凶恶巨口，可不只会咬人。
game.object.animatedpumpkin.description=蔬菜残骸落入不对的人手中，也能变得致命。AoF 团队敬赠，祝你万圣节快乐！
game.object.ratmangrenadier.description=鼠人掷弹兵携带的毒气手雷，彰显了鼠族扭曲的创造力。这些投掷爆炸物炸开时，会释放腐臭的有毒蒸气。
