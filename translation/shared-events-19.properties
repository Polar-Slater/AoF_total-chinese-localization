# 通用事件第19批：马戏团舞者与沙虫遭遇
LevelSandworm02.location.name=沙虫 (Sandworm)
LevelCircusShow01.selection-text=<html><body>要观看演出吗？<br>（你有${gold}金币）</body></html>
LevelCircusShow01.location.name=马戏团 (Circus)
LevelCircusShow01.conversations.0.name=报幕员
LevelCircusShow01.conversations.0.text=欢迎！欢迎！
LevelCircusShow01.conversations.1.name=报幕员
LevelCircusShow01.conversations.1.text=各位尊贵的英雄肯赏光前来，真让我们倍感荣幸。
LevelCircusShow01.conversations.2.name=报幕员
LevelCircusShow01.conversations.2.text=<html><body>快请进，演出马上就要开始了！<br>要我为各位准备入场券吗？</body></html>
LevelCircusShow01.triggers.on-select-1.text=暂时不了，回去吧。
LevelCircusShow01.triggers.on-select-1.description=返回世界地图。
LevelCircusShow01.triggers.on-select-2.text=请给我们留座（200金币）。
LevelCircusShow01.triggers.on-select-2.description=观看演出。
LevelCircusShow02.text=<html><body>你们赶在开演前抵达，立刻感受到马戏棚里热闹而兴奋的气氛。观众满怀期待，交谈声此起彼伏；热心的报幕员熟门熟路地领着你们入座。<br><br>演出以精彩的动物杂技开场。威风凛凛的狮子跃过燃烧的火圈，身手敏捷的猴子在吊架之间来回腾跃。大胆惊险的表演，以及演员与动物之间的默契，令观众赞叹不已。<br><br>压轴登场的是一队技艺非凡的杂技舞者。她们仿佛挣脱了重力的束缚，动作优美得令人屏息。你们看得入了迷，直到舞者们最后鞠躬谢幕，仍在热烈鼓掌。<br><br>然而，欢呼与掌声中，人群挤得水泄不通，你们想再看一眼那些令人惊艳的美丽舞者也难以如愿。不过，即使马戏棚早已远去，这场精彩演出的回忆仍会长久留在心间。</body></html>
LevelCircusShow03.selection-text=<html><body>这姑娘是个小偷，但你们的实力远胜于她。<br>如果你们决定拿回钻石，她根本无力反抗。<br><br>队伍该怎么做？</body></html>
LevelCircusShow03.conversations.0.name=提示
LevelCircusShow03.conversations.0.text=演出结束后，英雄们前去向领舞的姑娘道贺，却惊讶地发现她正端详着一颗硕大的钻石。那正是你们的钻石，被她用灵巧的手指从钱袋里顺走了！
LevelCircusShow03.conversations.1.name=扎拉
LevelCircusShow03.conversations.1.text=<html><body>啊，我可没想拿它！<br>是它自己掉进我口袋里的……</body></html>
LevelCircusShow03.conversations.2.name=扎拉
LevelCircusShow03.conversations.2.text=求你们别告发我，我已经无处可去了。
LevelCircusShow03.triggers.on-select-1.text=从扎拉手中拿回钻石，然后离开。
LevelCircusShow03.triggers.on-select-2.text=让扎拉留下钻石。
