# 通用事件第30批：海盗支线的通用关卡文本
LevelPirates01.text=<html><body>太阳才刚落山，冒险者们来到咸狗酒馆 (Salty Dog) 时，里面早已挤满了来喝酒的客人。<br><br>这家海边酒馆热闹非凡。<br><br>喧闹的笑声、酒杯碰撞声，与浪花拍打岩岸的声音交织在一起。这处水手聚集地的无数夜晚，都是在这样的喧嚣中度过的。<br><br>海盗！这群闹腾的老海狗，走到哪儿都少不了麻烦。这里又会有怎样的传奇冒险在等待着众人？</body></html>
LevelPirates01.location.name=咸狗酒馆 (Salty Dog)
LevelPirates02.text=<html><body>队伍鱼贯走进咸狗酒馆 (Salty Dog)，只见里面挤满了饱经风霜的水手，个个都喝了不少，有些更是醉得不省人事。<br><br>冒险者们几次想招呼酒保，却始终没人搭理。他们清楚地感觉到，这里并不欢迎自己。<br><br>正要离开时，一个乐呵呵的醉汉晃晃悠悠地挡住了去路。<br><br>他嘴里说不出一句听得懂的话，只好手舞足蹈地比画，兴奋地招呼英雄们到他那桌坐下。</body></html>
LevelPirates02.selection-text=英雄们要怎么做？=BR=（你有${gold}金币）
LevelPirates02.location.name=咸狗酒馆 (Salty Dog)
LevelPirates02.triggers.on-select-1.text=继续赶路吧
LevelPirates02.triggers.on-select-2.text=与酒保交易
LevelPirates02.triggers.on-select-3.text=与醉酒水手交谈
LevelPirates02.triggers.on-select-4.text=请所有人喝一轮！（100金币）
LevelPirates03.text=<html><body>冒险者们来到码头，找到了一艘饱经风浪、正准备启航的海盗船。<br><br>那醉汉的提议虽难以置信，海上冒险却有着不可否认的吸引力，哪怕其中仍有太多事情说不清楚。<br><br>一群邋遢的海盗正沿跳板往船上滚一桶麦酒，英雄们跟在后面，登上主甲板。海盗船长背对众人，将望远镜举到眼前，扫视着地平线。<br><br>他似乎对海况颇为满意，收起望远镜，吹起了轻快的小调。<br><br>一名海盗拍了拍船长的肩膀，指向刚到的英雄们。<br><br>船长一见队伍，眼睛便睁大了，绯红的胡须间咧开笑容，露出一口黄牙。</body></html>
LevelPirates03.location.name=喂，船上的！ (Ahoy!)
LevelPirates03.conversations.0.name=红胡子船长
LevelPirates03.conversations.0.text=<html><body>嘿，欢迎上船！这艘气派的船可是我的心肝宝贝。都别客气，当自己家就行！<br>……不过关门别太使劲，听见没？</body></html>
LevelPirates03.conversations.1.name=红胡子船长
LevelPirates03.conversations.1.text=对了，咸狗酒馆 (Salty Dog) 那个老酒鬼都跟你们说了吧？好极了！
LevelPirates03.conversations.2.name=红胡子船长
LevelPirates03.conversations.2.text=咱们这就去冒险，我对这一趟可是信心十足。
LevelPirates03.conversations.3.name=红胡子船长
LevelPirates03.conversations.3.text=虽说咱们是海盗，可也讲个规矩：人人有份，公平分账。
LevelPirates03.conversations.4.name=海盗
LevelPirates03.conversations.4.text=骗人！红胡子船长是个卑鄙的骗子，他会坑你——
LevelPirates03.conversations.5.name=红胡子船长
LevelPirates03.conversations.5.text=呸！别听他胡扯。这种烂泥鱼，连发财的好买卖和脑袋上开个洞都分不清。
LevelPirates03.conversations.6.name=红胡子船长
LevelPirates03.conversations.6.text=（再敢胡说八道煽动叛变，我就在你脑袋上开个洞！回去擦甲板，你这舱底耗子！）
LevelPirates03.conversations.7.name=海盗
LevelPirates03.conversations.7.text=……
LevelPirates03.conversations.8.name=红胡子船长
LevelPirates03.conversations.8.text=<html><body>刚才说到哪儿了？<br>啊，对！公平分账。不管找到什么，咱们都分。成交？成交。</body></html>
LevelPirates03.conversations.9.name=红胡子船长
LevelPirates03.conversations.9.text=那咱们是不是该扬帆了？小伙子，准备好了就说一声。
LevelPirates03.conversations.10.name=红胡子船长
LevelPirates03.conversations.10.text=大海最好做好准备，咱们可要掀起一番风浪！
LevelPirates03.conversations.11.name=海盗
LevelPirates03.conversations.11.text=哟嗬嗬！这话值得喝一杯。干了！
LevelPirates03.conversations.12.name=红胡子船长
LevelPirates03.conversations.12.text=喂！我让你停下拖把了吗？！
LevelPirates03.conversations.13.name=红胡子船长
LevelPirates03.conversations.13.text=（真想来个迷人的海妖，把这群蠢货都勾走……偏偏需要的时候一个也没有。）
LevelPirates04.text=<html><body>天空晴朗，航行顺利，出海的第一天平安无事地过去了。<br><br>船员们对这趟旅程充满期待，也乐得为英雄们腾出地方。除了例行的活计，他们大半时间都在灌酒、打牌。<br><br>突然，桅顶瞭望台上的船员大声咒骂起来，打破了海上的宁静。<br><br>红胡子船长朝他吼了一声，叫他镇静，随后冲到船舷边，将望远镜举到眼前。他看见地平线上的什么东西，倒吸了一口气。<br><br>红胡子船长惊慌地从船头跑到船尾，拼命向船员下令。看来，有个意料之外的威胁正迅速逼近！</body></html>
LevelPirates04.conversations.0.name=海盗
LevelPirates04.conversations.0.text=船长，怎么了？
LevelPirates04.conversations.1.name=红胡子船长
LevelPirates04.conversations.1.text=<html><body>该死！<br>那帮讨厌的黑卫士，就不能离我的胡子远点吗！</body></html>
LevelPirates04.conversations.2.name=红胡子船长
LevelPirates04.conversations.2.text=咱们离他们那座泡水的破城堡还远着呢。他们准是闲得发慌，出来找碴！
LevelPirates04.conversations.3.name=红胡子船长
LevelPirates04.conversations.3.text=他们顺风，那艘战舰来得快得吓人。现在不打退这帮混蛋，咱们就得去喂鱼！
LevelPirates04.conversations.4.name=红胡子船长
LevelPirates04.conversations.4.text=<html><body>让海里的魔鬼收了他们！<br>装上最重的炮弹！</body></html>
LevelPirates04.conversations.5.name=红胡子船长
LevelPirates04.conversations.5.text=开炮！！
LevelPirates04.conversations.6.name=海盗
LevelPirates04.conversations.6.text=可，可是……船长！照您的吩咐，炮弹都留在岸上了。您说要多腾点地方装酒桶！
LevelPirates04.conversations.7.name=红胡子船长
LevelPirates04.conversations.7.text=什么？什么？！
LevelPirates04.conversations.8.name=红胡子船长
LevelPirates04.conversations.8.text=一群蠢货，我是开玩笑的！真该把你们的脑袋全砍下来，起码那样咱们还有东西往炮里塞！
LevelPirates04.conversations.9.name=红胡子船长
LevelPirates04.conversations.9.text=呸，现在说什么都晚了。他们贴上来了！拿起武器，小子们，准备迎击登船的敌人！
LevelPirates05.conversations.0.name=提示
LevelPirates05.conversations.0.text=这是一场无法取胜的战斗，战败后剧情仍会继续。不过，你也尽可以试着打赢！（战斗结束后，你的军队会恢复。）
LevelPirates06.text=<html><body>黑卫士战舰飞快驶来，贴上红胡子船长的船身，连一发阻拦的炮弹都没遇到。战舰和蜂拥登船的敌人势不可挡。<br><br>黑卫士劫掠者给英雄们和幸存海盗戴上镣铐，将所有人塞进战舰阴湿的禁闭舱。<br><br>驶往黑卫士城堡 (Black Guard Castle) 的海路风浪颠簸，晃得人胃里翻腾。<br><br>战舰吱嘎作响，靠上城堡的码头。一队手持长枪的守卫猛地打开舱门，将俘虏押出船腹，带进岛上堡垒幽深漆黑的地下。<br><br>牢房沉重的铁门在他们身后轰然关上。<br><br>隔着铁栏，冒险者们看见悬挂的锁链和各式骇人的器具——那显然是一间刑讯室。一个戴着兜帽的高大身影从阴影中走了出来……</body></html>
LevelPirates07.conversations.0.name=赛拉斯
LevelPirates07.conversations.0.text=真是批寒酸的猎物。以为能悄悄溜过黑卫士城堡 (Black Guard Castle)，不被发现？
LevelPirates07.conversations.1.name=红胡子船长
LevelPirates07.conversations.1.text=放了我们，你这肥魔头！我们可没想惹事，是你们这群疯子先动的手！
LevelPirates07.conversations.2.name=赛拉斯
LevelPirates07.conversations.2.text=没错，是我们先动的手！这片海属于黑卫士。像你们这种滑溜溜的鳗鱼游过来，我们哪能不好好招待？
LevelPirates07.conversations.3.name=赛拉斯
LevelPirates07.conversations.3.text=看看你们这群干瘪的甲板工，脖子细得跟笔杆一样。等到最精彩的环节——处决你们——我连斧头都不用磨。
LevelPirates07.conversations.4.name=红胡子船长
LevelPirates07.conversations.4.text=你这滥杀无辜的混账，坏透了！
LevelPirates07.conversations.5.name=赛拉斯
LevelPirates07.conversations.5.text=<html><body>一群无法无天的海盗，突然讲起道德来了。真好笑。<br>那么，船长大人，告诉我……</body></html>
LevelPirates07.conversations.6.name=赛拉斯
LevelPirates07.conversations.6.text=你管那条摇摇欲坠的木筏叫船？那东西勉强才浮得住，你们一定急着去什么地方。说吧，到底要去哪儿？
LevelPirates07.conversations.7.name=红胡子船长
LevelPirates07.conversations.7.text=去哪儿？哦，也没什么特别的去处，就是出来悠闲地兜兜风……
LevelPirates07.conversations.8.name=赛拉斯
LevelPirates07.conversations.8.text=开着游船，享受阳光和大海，是吧？真可悲。你这么老练的无赖，就编得出这种瞎话？
LevelPirates07.conversations.9.name=红胡子船长
LevelPirates07.conversations.9.text=我们的事用不着你管！你这肥蛤蟆，放了我们！
LevelPirates07.conversations.10.name=赛拉斯
LevelPirates07.conversations.10.text=转念一想，我还是得去磨石上花点工夫。你们会喜欢我的宝贝姑娘们的，整套家伙，个个亮闪闪。
LevelPirates07.conversations.11.name=赛拉斯
LevelPirates07.conversations.11.text=见过我的这些美人，嘴巴再紧的人也会开口。
LevelPirates07.conversations.12.name=红胡子船长
LevelPirates07.conversations.12.text=……
LevelPirates07.conversations.13.name=赛拉斯
LevelPirates07.conversations.13.text=用不了多久，你们藏得最深的秘密就会全倒出来，流出来的可还不止这些。
LevelPirates07.conversations.14.name=赛拉斯
LevelPirates07.conversations.14.text=<html><body>好了，一群老海狗，都给我乖乖趴着，别动！<br>哈哈哈……</body></html>
LevelPirates08.conversations.0.name=红胡子船长
LevelPirates08.conversations.0.text=伙计们，情势不妙啊。眼下这浪头翻得这么凶，谁知道该念什么祷词？
LevelPirates08.conversations.1.name=海盗
LevelPirates08.conversations.1.text=我妈总说，我早晚得死在刽子手的斧头底下……
LevelPirates08.conversations.2.name=海盗
LevelPirates08.conversations.2.text=<html><body>我不想死！！<br>妈妈！</body></html>
LevelPirates08.conversations.3.name=红胡子船长
LevelPirates08.conversations.3.text=（一群软蛋……还海盗呢，分明是一窝拿白尿布举旗投降的奶娃娃……）
LevelPirates08.conversations.4.name=红胡子船长
LevelPirates08.conversations.4.text=等等，那把锈锁看着一撞就能开！来，小子们，打起精神，使出吃奶的劲！
LevelPirates08.conversations.5.name=红胡子船长
LevelPirates08.conversations.5.text=听我号子……一、二，嘿哟！
LevelPirates08.conversations.7.name=提示
LevelPirates08.conversations.7.text=<html><body>一声巨响，牢门的锁崩开了！<br>（咔嚓！）</body></html>
LevelPirates08.conversations.8.name=红胡子船长
LevelPirates08.conversations.8.text=哈！这才像条船上的好伙计！趁着运气好，没准咱们还能偷偷溜——
LevelPirates08.conversations.9.name=守卫
LevelPirates08.conversations.9.text=喂！你们想去哪儿？
LevelPirates08.conversations.10.name=守卫
LevelPirates08.conversations.10.text=想越狱，是吧？你们这些烂海盗，真是不见棺材不落泪。
LevelPirates08.conversations.11.name=守卫
LevelPirates08.conversations.11.text=警报！囚犯越狱了！警报！
LevelPirates08.conversations.12.name=红胡子船长
LevelPirates08.conversations.12.text=该死！看来我当海盗没当赌徒，倒是选对了。快，趁这帮混蛋还没惊动整座城堡，让他们闭嘴！
LevelPirates09.triggers.on-battle-task-1.text=治疗药液×2：在第四回合结束前杀死法师
LevelPirates09.triggers.on-battle-task-2.text=200金币：在第六回合结束前赢得战斗
LevelPirates10a.text=<html><body>越狱成功后，队伍悄悄爬出城堡地下，潜向港口，险险避开一队赶去查看地牢警报的长枪兵。<br><br>先前的晴天已被狂风暴雨取代，黑卫士哨兵全躲进了屋内，通往码头的路上空无一人。<br><br>红胡子船长的船不见踪影，岸边倒是泊着一艘黑卫士快船，正随浪起伏。<br><br>队伍爬上船，驶向大海。</body></html>
LevelPirates10b.text=<html><body>返航的时间漫长得仿佛没有尽头，但熟悉的巴特港 (Butterport) 终于出现在地平线上。<br><br>黑卫士城堡 (Black Guard Castle) 的恐怖经历已被远远甩在身后，英雄们和海盗船员都松了口气。<br><br>队伍走下夺来的黑卫士快船。红胡子船长默默哀悼着自己失去的船，随后走到幸存船员面前，逐个用力握手，点头致意。<br><br>红胡子船长恼火到了极点，非要讨个说法：究竟为什么，他的船员竟被直接送进了虎口……</body></html>
LevelPirates11.text=<html><body>黑卫士城堡 (Black Guard Castle) 气势慑人。这座海上堡垒显然是为抵御各种进攻而建。<br><br>一队队哨兵守在城垛上，扫视海面，提防威胁。想不被发现是不可能的。<br><br>想起上次到访的惊险经历，队伍不敢再往这座防守严密的岛上要塞靠近。<br><br>……不过，若有朝一日风波平息，黑卫士城堡 (Black Guard Castle) 倒会成为远海航行中宝贵的补给港。<br><br>在那之前，住在地牢里的刽子手准还在磨着斧头，翘首以待呢！</body></html>
LevelPirates11.location.name=黑卫士 (Black Guard)
LevelPirates12.text=<html><body>如今已知晓秘宝的正确位置，队伍再度扬帆。<br><br>夺来的黑卫士快船让探索未知海域的旅程舒适了许多。天气晴好，又有强劲顺风相助，一行人很快便接近了目的地。<br><br>在国王海 (King's Sea) 南部浩瀚的蔚蓝中，葱郁的小岛宛如一处孤悬海上的乐土。<br><br>队伍登上小艇，划向岸边。越过沙滩，两条明显的道路出现在眼前，一条通往神庙废墟，另一条深入丛林腹地。<br><br>众人准备继续探索，红胡子船长挥起弯刀，随时准备一马当先。<br><br>若这里真有宝藏，只有亲自寻找才能知道。英雄们要探索这座岛吗？</body></html>
LevelPirates12.selection-text=队伍要怎么做？
LevelPirates12.location.name=寻宝之旅 (Treasure Hunt)
LevelPirates12.triggers.on-select-1.text=搜索丛林。
LevelPirates12.triggers.on-select-1.description=探索丛林。
LevelPirates12.triggers.on-select-2.text=搜索废墟。
LevelPirates12.triggers.on-select-2.description=探索神庙废墟。
LevelPirates12.triggers.on-select-3.text=扬帆离开。
LevelPirates12.triggers.on-select-3.description=返回世界地图。
LevelPirates13.text=<html><body>队伍沿着通往神庙废墟的小路深入。<br><br>不管这座岛上曾经生活着怎样的文明，如今看来，他们早已销声匿迹了许久。<br><br>英雄们来到一座破败的门廊前，门后似乎通往一间不知用途的厅室。<br><br>各式雕像肃立两旁，雕刻细致，栩栩如生，令人惊叹。<br><br>与周围的废墟不同，这些石像依旧完好无损。<br><br>队伍刚要走向残破的入口，四周便响起令人不安的石头摩擦声。</body></html>
LevelPirates13.conversations.0.name=石像鬼长老
LevelPirates13.conversations.0.text=……
LevelPirates13.conversations.1.name=红胡子船长
LevelPirates13.conversations.1.text=<html><body>啧，雕出这些丑东西的人，准是拿鱼饵当的样板。<br>不管怎么说，离宝藏该不远了。</body></html>
LevelPirates13.conversations.2.name=石像鬼长老
LevelPirates13.conversations.2.text=……
LevelPirates13.conversations.3.name=红胡子船长
LevelPirates13.conversations.3.text=想靠几尊吓人的石像，就赶走一条久经风浪的老海狗？还差得远呢！
LevelPirates13.conversations.4.name=石像鬼长老
LevelPirates13.conversations.4.text=……
LevelPirates13.conversations.5.name=石像鬼长老
LevelPirates13.conversations.5.text=……
