LevelPirates14.triggers.on-battle-task-2.text=蓝宝石×2：在第十回合结束前赢得战斗
LevelPirates15.text=<html><body>最后一尊活化石像轰然倒下，碎成一地石块，残破的门廊前再无阻碍。<br><br>尘埃渐渐落定，队伍踏过新添的碎石，走进敞开的通道。<br><br>才走几步，廊道便豁然开朗，显露出一座古老神庙摇摇欲坠的内部。<br><br>若不是无数藤蔓穿过墙壁和穹顶的裂缝，将结构勉强牵住，这座建筑恐怕早已坍塌。<br><br>缕缕阳光从上方洒进大厅，众人的目光立刻被中央一口气派的宝箱吸引——它正闪耀着灿灿金光！</body></html>
LevelPirates15.conversations.1.name=提示
LevelPirates15.conversations.1.text=<html><body>咔嗒一声，宝箱顺利打开了。<br>里面装满了金币和财宝！</body></html>
LevelPirates16.text=<html><body>红胡子船长驾驶着夺来的船，朝最近的港口驶去，那座传说中的岛屿渐渐消失在远方。<br><br>寻宝之旅大获成功，欢欣鼓舞的船员们坐拥一堆闪亮的战利品，开怀畅饮，尽情庆祝。<br><br>狂欢持续着，海盗们一个接一个地倒下，带着疲惫与醉意沉沉睡去，最后只剩桅顶瞭望台上的守夜人还站着。没过多久，就连他也抵挡不住困意，闭上了眼睛。<br><br>月光照耀的波浪间，几个迟来的宾客蜿蜒游近，打算来凑凑热闹……</body></html>
LevelPirates16.location.name=夜幕降临 (Eve of Night)
LevelPirates17.conversations.0.name=娜迦战士
LevelPirates17.conversations.0.text=嘶……慢慢来，悄悄地。别吵醒那些陆地行者……
LevelPirates17.conversations.1.name=娜迦战士
LevelPirates17.conversations.1.text=<html><body>嘶……大海属于我们。<br>这里不欢迎这些傲慢的外来者！</body></html>
LevelPirates17.triggers.on-battle-task-1.text=金锭：在第八回合结束前消灭所有潜海者
LevelPirates17.triggers.on-battle-task-2.text=蛇之法杖：在第十二回合结束前赢得战斗
LevelPirates17a.text=<html><body>最后一个深夜入侵者毫无生气地跌出船舷，这场突袭终于结束。船员们的凶猛出乎敌人意料，仍游弋在船边的援兵收拢死者，退回了来时的漆黑海水。<br><br>红胡子船长带着船员们欢呼。伏击虽让大家措手不及，可谁敢碰海盗辛苦得来的财宝，就别想活着回去吹嘘！<br><br>英雄们不禁猜想，那些海怪究竟是什么来头，今后是否还会再遇上。<br><br>地平线上透出一线曙光。清晨让众人如释重负，陆地已在不远处了。</body></html>
