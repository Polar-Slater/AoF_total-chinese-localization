# The Quick and The Dead — 简体中文
CONVERSATIONS=quickfemaleassassindlc
LOCALE=zh
QXX_Congratulations.conversations.0.name=提示
QXX_Congratulations.conversations.0.text=<html><body>你已完成 Age of Fear 5: The Day of the Rat 的《生者与死者》（The Quick and The Dead）扩展！<br>恭喜！请继续你的战役。</body></html>
QXX_Rizza_join_select.conversations.0.name=莉扎
QXX_Rizza_join_select.conversations.0.text=这趟……跟我想的不一样！
QXX_Rizza_join_select.conversations.1.name=因杜尔夫
QXX_Rizza_join_select.conversations.1.text=可不是嘛，莉扎！经历了这么一趟，我都觉得我们认识好几年了。
QXX_Rizza_join_select.conversations.2.name=莉扎
QXX_Rizza_join_select.conversations.2.text=我可是说话算话的鼠人。给，这是你的。
QXX_Rizza_join_select.conversations.3.name=因杜尔夫
QXX_Rizza_join_select.conversations.3.text=我的扑克筹码！自从你这只坏老鼠把它们偷走，我的口袋就一直不自在。
QXX_Rizza_join_select.conversations.4.name=莉扎
QXX_Rizza_join_select.conversations.4.text=我知道鼠巢为什么喜欢你，还有你了。你们很强！
QXX_Rizza_join_select.conversations.5.name=莱克莎
QXX_Rizza_join_select.conversations.5.text=又成了老鼠们的英雄……呃。
QXX_Rizza_join_select.conversations.6.name=莉扎
QXX_Rizza_join_select.conversations.6.text=我得先去办点事，不过……你们队伍里，还有我这样的鼠人的位置吗？
QXX_Rizza_join_select.conversations.7.name=因杜尔夫
QXX_Rizza_join_select.conversations.7.text=人越多越热闹，莉扎！身边有个像你这样神出鬼没的施法者，正合我意。
QXX_Rizza_join_select.conversations.8.name=莱克莎
QXX_Rizza_join_select.conversations.8.text=因杜尔夫！你就是忍不住，对吧？又要招法师？
QXX_Rizza_join_select.conversations.9.name=因杜尔夫
QXX_Rizza_join_select.conversations.9.text=莱克莎，莱克莎……你在吃一只老鼠的醋？
QXX_Rizza_join_select.conversations.10.name=莱克莎
QXX_Rizza_join_select.conversations.10.text=啊！那群该死的老鼠就是全被怪物肉噎死，我也懒得管！
QXX_Rizza_join_select.conversations.11.name=因杜尔夫
QXX_Rizza_join_select.conversations.11.text=哈哈哈！
QXX_Rizza_join_select.conversations.12.selection-text=你愿意让莉扎加入吗？
QXX_Rizza_rose.conversations.0.name=莉扎
QXX_Rizza_rose.conversations.0.text=这是什么？
QXX_Rizza_rose.conversations.1.name=莉扎
QXX_Rizza_rose.conversations.1.text=<html><body>我不吃花草，因杜尔夫。<br>只吃鱼，吧唧吧唧。</body></html>
QXX_Rizza_rose.conversations.2.name=因杜尔夫
QXX_Rizza_rose.conversations.2.text=按照人类的习俗，今天要给姑……雌性送玫瑰。
QXX_Rizza_rose.conversations.3.name=莉扎
QXX_Rizza_rose.conversations.3.text=……
QXX_Rizza_rose.conversations.4.name=莱克莎
QXX_Rizza_rose.conversations.4.text=<html><body>哈哈哈哈！<br>还不如给她抓点鱼呢，万人迷因杜尔夫。</body></html>
QXX_Welcome.conversations.0.name=提示
QXX_Welcome.conversations.0.text=<html><body>欢迎游玩《生者与死者》（The Quick and The Dead）扩展！<br>这些关卡为可选内容，可以在战役期间随时游玩。</body></html>
QXX_Welcome.conversations.1.name=提示
QXX_Welcome.conversations.1.text=建议在开始《生者与死者》扩展前，组建一支满员且所有单位均达到老兵资历的队伍。感谢你支持独立游戏！
