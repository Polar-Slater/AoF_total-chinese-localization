SXX_GameDice_init_select.conversations.0.selection-text=<html><body>赌徒邀请你玩掷骰子。<br><br>双方分别掷骰，总点数较大的一方获胜。<br>想玩一局吗？<br><br>每次掷骰需付250金币，一局共掷两次。<br>第一次掷骰后可以弃权，<br>但入局时至少需要500金币。<br><br>（你拥有 ${gold} 金币）</body></html>
SXX_GameDice_lose_select.conversations.0.selection-text=<html><body>你掷出${game-dice-player-B}点，总点数为${game-dice-player-total}（${game-dice-player-A}与${game-dice-player-B}）。<br>对手掷出${game-dice-cpu-B}点，总点数为${game-dice-cpu-total}（${game-dice-cpu-A}与${game-dice-cpu-B}）。<br><br>你输掉了赌注！要再玩吗？<br><br>每次掷骰需付250金币，一局共掷两次。<br>第一次掷骰后可以弃权，<br>但入局时至少需要500金币。<br><br>（你拥有 ${gold} 金币）</body></html>
