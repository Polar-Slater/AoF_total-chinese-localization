# Shared systems batch 7: desertion, games, invocations and common conversations.
SPL_Invoke_AcidRain.conversations.1.name=提示
SPL_Invoke_AcidRain.conversations.1.text=召唤成功，雨滴开始落下。等等……这些雨滴为什么嘶嘶作响？糟了，你的法术让酸雨乌云布满天空——快逃命！
SPL_Invoke_Blizzard.conversations.1.name=提示
SPL_Invoke_Blizzard.conversations.1.text=召唤成功，一场猛烈的暴风雪随之降临。除了刺骨的寒冷，所有生物还得小心被冻成冰块！
SPL_Invoke_BloodMoon.conversations.1.name=提示
SPL_Invoke_BloodMoon.conversations.1.text=你的英雄高举鲜血之灯，天空染上一层阴森的红色。邪恶势力占据了优势！
SPL_Invoke_Earthquake.conversations.1.name=提示
SPL_Invoke_Earthquake.conversations.1.text=召唤成功，脚下的大地开始轰鸣。目前还只是轻微震动，但用不了多久，强烈的地震就会撼动整个战场！
SPL_Invoke_Fog.conversations.1.name=提示
SPL_Invoke_Fog.conversations.1.text=召唤成功，浓密的雾气缓缓从地面升起。不一会儿，整个战场便笼罩在无法看透的迷雾中！
SPL_Invoke_IncendiaryCloud.conversations.1.name=提示
SPL_Invoke_IncendiaryCloud.conversations.1.text=该死！那些炼金术士到底在想什么？！药剂炸开了，整个战场都充满了燃烧的气体。你们能活下来吗？
SPL_Invoke_Rain.conversations.1.name=提示
SPL_Invoke_Rain.conversations.1.text=召唤成功，天空下起了雨。潮湿的天气让闪电与寒冷变得更加危险。
SPL_Invoke_Storm.conversations.1.name=提示
SPL_Invoke_Storm.conversations.1.text=召唤失去了控制，一场强烈的风暴骤然降临！闪电将随机劈中战场上的单位！
SPL_Invoke_StrongWind.conversations.1.name=提示
SPL_Invoke_StrongWind.conversations.1.text=召唤成功，北风越来越猛烈。这可不是和风细雨，而是一场真正的狂风暴！在这样的风里，箭矢根本无法笔直飞行！
SPL_Invoke_Volcano.conversations.1.name=提示
SPL_Invoke_Volcano.conversations.1.text=大地裂开，炽热的熔岩涌上地表！如今你别无选择——不断移动，否则军队就会被烧成焦炭！
SXX_AnyBase_enter.conversations.0.name=提示
SXX_AnyBase_enter.conversations.0.text=<html><body>这里是你的阵营据点，你随时都能从世界地图进入。<br>（在世界地图上点击“基地”按钮，即可快速前往据点。）</body></html>
SXX_AnyBase_enter.conversations.1.name=提示
SXX_AnyBase_enter.conversations.1.text=升级据点可以提高新兵的实力，并解锁新的兵种与功能。
SXX_AnyShop_enter.conversations.0.name=提示
SXX_AnyShop_enter.conversations.0.text=随着游戏推进，各种地点将陆续解锁。商店在世界地图上以金币图标标记，可以买卖物品，但并非每件物品都适合你的英雄。
SXX_AnyShop_enter.conversations.1.name=提示
SXX_AnyShop_enter.conversations.1.text=王国的商贸十分活跃。有些商店只会暂时出现，拜访数次后便会离开。
SXX_Battle_retreat.conversations.0.name=提示
SXX_Battle_retreat.conversations.0.text=<html><body>队伍成功撤离了该地点。<br>（只有部分战斗允许撤退。）</body></html>
SXX_Cow_death.conversations.0.name=奶牛
SXX_Cow_death.conversations.0.text=哞……
SXX_Cow_death.conversations.1.name=塔兹
SXX_Cow_death.conversations.1.text=不——！
SXX_Cow_death.conversations.2.name=塔兹
SXX_Cow_death.conversations.2.text=<html><body>为什么？<br>她还那么年轻……</body></html>
SXX_Defeat_difficulty.conversations.1.name=提示
SXX_Defeat_difficulty.conversations.1.text=（你可以在“选项／难度”中暂时降低游戏难度，无须中断战役。）
SXX_Desertion_bard.conversations.1.name=达里乌斯
SXX_Desertion_bard.conversations.1.text=你！快到我这里来。我一直在寻找灵感，好谱写一首新的歌谣。现在你来了！多么出色的英雄，值得用诗歌传颂！
SXX_Desertion_bard.conversations.2.name=达里乌斯
SXX_Desertion_bard.conversations.2.text=你可不像其他人。这些家伙胆小又迷茫，活像雨中的小牛犊。他们连英雄气概是什么都不懂，更别说身体力行了。而你，没错，你懂！
SXX_Desertion_bard.conversations.3.name=达里乌斯
SXX_Desertion_bard.conversations.3.text=啊，这个姿态，简直是在向苍天宣告胜利！对，对，我已经听见旋律了。让我拿上笛子，你千万别动！
SXX_Desertion_bard.conversations.4.name=达里乌斯
SXX_Desertion_bard.conversations.4.text=（哈哈！只要把他夸得飘飘然，他就舍不得走了。屡试不爽。）
SXX_Desertion_bard.conversations.5.name=提示
SXX_Desertion_bard.conversations.5.text=达里乌斯整晚为这名想要离队的士兵唱赞歌，让他自豪不已，相信自己正是一段伟大传奇中的主角。
SXX_Desertion_bard.conversations.6.name=提示
SXX_Desertion_bard.conversations.6.text=<html><body>${selected-unit-name}暂时会留在队伍里！不过，这只是权宜之计……<br>（每个单位每天会进行一次逃兵判定。）</body></html>
SXX_Desertion_brainwash.conversations.1.name=死灵法师
SXX_Desertion_brainwash.conversations.1.text=怎么，想趁半夜溜走？我本该杀了你，再唤起你的骸骨。不过……我有个更好的主意。
SXX_Desertion_brainwash.conversations.2.name=死灵法师
SXX_Desertion_brainwash.conversations.2.text=<html><body>Dis artis, dan oute. Grotta, de feruam infera!<br>……这样就行了，乖得像条狗！哈哈哈！</body></html>
SXX_Desertion_brainwash.conversations.3.name=提示
SXX_Desertion_brainwash.conversations.3.text=死灵法师的魔法抹去了逃兵脑中的反抗念头，取而代之的是忠诚与服从。
SXX_Desertion_brainwash.conversations.4.name=提示
SXX_Desertion_brainwash.conversations.4.text=<html><body>${selected-unit-name}暂时会留在队伍里！不过，这只是权宜之计……<br>（每个单位每天会进行一次逃兵判定。）</body></html>
SXX_Desertion_bribe.conversations.1.name=提示
SXX_Desertion_bribe.conversations.1.text=你的英雄私下找到想要离队的士兵。面对质问，对方装作不知情，不肯承认自己的打算。
SXX_Desertion_bribe.conversations.2.name=提示
SXX_Desertion_bribe.conversations.2.text=不过，英雄一伸出装满金币的钱袋，对方便立刻接了过去。
SXX_Desertion_bribe.conversations.3.name=提示
SXX_Desertion_bribe.conversations.3.text=<html><body>${selected-unit-name}暂时会留在队伍里！不过，这只是权宜之计……<br>（每个单位每天会进行一次逃兵判定。）</body></html>
SXX_Desertion_drugs.conversations.1.name=炼金术士
SXX_Desertion_drugs.conversations.1.text=我在这杯茶里加了一点特制的“镇静剂”。晚饭时让他喝下去！
SXX_Desertion_drugs.conversations.2.name=炼金术士
SXX_Desertion_drugs.conversations.2.text=他会立刻睡着。等他醒来，什么烦恼都会忘得一干二净。
SXX_Desertion_drugs.conversations.3.name=提示
SXX_Desertion_drugs.conversations.3.text=这名士兵毫无戒心地喝下了加药的茶。到了早晨，他已经想不起自己原本在烦恼什么。
SXX_Desertion_drugs.conversations.4.name=提示
SXX_Desertion_drugs.conversations.4.text=<html><body>${selected-unit-name}暂时会留在队伍里！不过，这只是权宜之计……<br>（每个单位每天会进行一次逃兵判定。）</body></html>
SXX_Desertion_drunkard.conversations.1.name=矮人
SXX_Desertion_drunkard.conversations.1.text=来，坐下陪我喝一杯，伙计！这桶酒太沉了，拖累队伍，咱们只好把它喝光。
SXX_Desertion_drunkard.conversations.2.name=矮人
SXX_Desertion_drunkard.conversations.2.text=你听说过矮人喝得太多的故事吗？我也没听过！哈哈哈！
SXX_Desertion_drunkard.conversations.3.name=提示
SXX_Desertion_drunkard.conversations.3.text=两人一直喝到深夜。最后，这名想要离队的士兵又感受到了与伙伴们的情谊。
SXX_Desertion_drunkard.conversations.4.name=提示
SXX_Desertion_drunkard.conversations.4.text=<html><body>${selected-unit-name}暂时会留在队伍里！不过，这只是权宜之计……<br>（每个单位每天会进行一次逃兵判定。）</body></html>
SXX_Desertion_fail.conversations.0.name=提示
SXX_Desertion_fail.conversations.0.text=众人入睡后不久，${selected-unit-name}悄悄走出帐篷，逃入黑暗，从此再也没有出现。
SXX_Desertion_fail.conversations.1.name=提示
SXX_Desertion_fail.conversations.1.text=<html><body>请确保队伍中没有其他单位处于“懊悔”状态，以免继续出现逃兵！<br>（每个单位每天会进行一次逃兵判定。）</body></html>
SXX_Desertion_hypnotize.conversations.1.name=术士
SXX_Desertion_hypnotize.conversations.1.text=哦，这家伙想溜走？哈，他哪儿也去不了。老大，你说呢，要不要来点魔法？
SXX_Desertion_hypnotize.conversations.2.name=术士
SXX_Desertion_hypnotize.conversations.2.text=<html><body>喂，你，往这儿看！睁大眼睛，对，对。催眠，催眠，催眠。<br>现在你就是我的乖宠物，像个地精奴隶一样。这样多好。</body></html>
SXX_Desertion_hypnotize.conversations.3.name=提示
SXX_Desertion_hypnotize.conversations.3.text=术士对逃兵施展了强大的催眠法术。魔法抹去了他的自由意志，让他服从你的控制。
SXX_Desertion_hypnotize.conversations.4.name=提示
SXX_Desertion_hypnotize.conversations.4.text=<html><body>${selected-unit-name}暂时会留在队伍里！不过，这只是权宜之计……<br>（每个单位每天会进行一次逃兵判定。）</body></html>
SXX_Desertion_idolofhappiness.conversations.1.name=提示
SXX_Desertion_idolofhappiness.conversations.1.text=幸福神像散发着平和安宁的气息。温暖的光环将逃兵笼罩，他立刻放弃了离队的念头。
SXX_Desertion_idolofhappiness.conversations.2.name=提示
SXX_Desertion_idolofhappiness.conversations.2.text=<html><body>${selected-unit-name}暂时会留在队伍里！不过，这只是权宜之计……<br>（每个单位每天会进行一次逃兵判定。）</body></html>
SXX_Desertion_init_select.conversations.0.selection-text=<html><body>${selected-unit-name} (${selected-unit-original-name})<br>满心懊悔，正打算离开队伍。<br>根据队伍成员的不同，你可以采用多种劝留手段。<br><br>这是阻止该单位永远离队的唯一机会！<br>你打算如何处理？<br><br>（你拥有 ${gold} 金币）</body></html>
SXX_Desertion_intimidate.conversations.1.name=兽人
SXX_Desertion_intimidate.conversations.1.text=喂！我听说你想走？没门！有我盯着，谁都别想跑。
SXX_Desertion_intimidate.conversations.2.name=兽人
SXX_Desertion_intimidate.conversations.2.text=你尽管试试，然后……哎呀！这个笨手笨脚的逃兵撞上我的斧头，少了一条腿。听明白了吗？！
SXX_Desertion_intimidate.conversations.3.name=提示
SXX_Desertion_intimidate.conversations.3.text=兽人的威胁把逃兵吓得魂不附体。他的士气没有好转，却重新考虑了逃跑的计划。
SXX_Desertion_intimidate.conversations.4.name=提示
SXX_Desertion_intimidate.conversations.4.text=<html><body>${selected-unit-name}暂时会留在队伍里！不过，这只是权宜之计……<br>（每个单位每天会进行一次逃兵判定。）</body></html>
SXX_Desertion_moralepotion.conversations.1.name=提示
SXX_Desertion_moralepotion.conversations.1.text=你的英雄叫住想要离队的士兵，将海盗朗姆酒递给他。对方怀疑地打量着酒瓶，最后还是拧开了瓶盖。
SXX_Desertion_moralepotion.conversations.2.name=提示
SXX_Desertion_moralepotion.conversations.2.text=醉人的香气占据了他的感官，他兴致勃勃地大口喝起海盗朗姆酒。每喝一口，他的心情就更愉快几分。
SXX_Desertion_moralepotion.conversations.3.name=提示
SXX_Desertion_moralepotion.conversations.3.text=<html><body>${selected-unit-name}暂时会留在队伍里！不过，这只是权宜之计……<br>（每个单位每天会进行一次逃兵判定。）</body></html>
SXX_Desertion_prayer.conversations.1.name=提示
SXX_Desertion_prayer.conversations.1.text=部下邀请想要离队的士兵加入祈祷。他跪了下来，与大家一同唱起圣歌。
SXX_Desertion_prayer.conversations.2.name=提示
SXX_Desertion_prayer.conversations.2.text=神圣的祷词与天籁般的旋律温暖了他的灵魂。他的焦虑消散了，取而代之的是深厚的同袍之情与归属感。
SXX_Desertion_prayer.conversations.3.name=提示
SXX_Desertion_prayer.conversations.3.text=<html><body>${selected-unit-name}暂时会留在队伍里！不过，这只是权宜之计……<br>（每个单位每天会进行一次逃兵判定。）</body></html>
SXX_Desertion_seduction.conversations.1.name=魅魔
SXX_Desertion_seduction.conversations.1.text=这么快就要走了？真可惜，我们明明相处得那么好。多么勇敢的战士啊，还有这身肌肉！
SXX_Desertion_seduction.conversations.2.name=魅魔
SXX_Desertion_seduction.conversations.2.text=<html><body>坐下吧，让我好好照顾你。不如，我们找个清静的地方？<br>我有样东西想给你看，可它不知落在帐篷哪里了……</body></html>
SXX_Desertion_seduction.conversations.3.name=提示
SXX_Desertion_seduction.conversations.3.text=这名士兵无法抵挡魅魔的挑逗，将逃跑的计划忘得一干二净。
SXX_Desertion_seduction.conversations.4.name=提示
SXX_Desertion_seduction.conversations.4.text=<html><body>${selected-unit-name}暂时会留在队伍里！不过，这只是权宜之计……<br>（每个单位每天会进行一次逃兵判定。）</body></html>
SXX_Desertion_slavemaster.conversations.1.name=群鼠统领
SXX_Desertion_slavemaster.conversations.1.text=<html><body>你想逃离自己的主人？<br>哈哈哈！</body></html>
SXX_Desertion_slavemaster.conversations.2.name=群鼠统领
SXX_Desertion_slavemaster.conversations.2.text=奴隶，我这儿正好有一条适合你的鞭子！
SXX_Desertion_slavemaster.conversations.3.name=提示
SXX_Desertion_slavemaster.conversations.3.text=<html><body>群鼠统领鞭打逃兵，并给他戴上锁链！<br>这是给所有人的教训。</body></html>
SXX_Desertion_slavemaster.conversations.4.name=提示
SXX_Desertion_slavemaster.conversations.4.text=<html><body>${selected-unit-name}暂时会留在队伍里！不过，这只是权宜之计……<br>（每个单位每天会进行一次逃兵判定。）</body></html>
SXX_Desertion_songofsiren.conversations.1.name=美人鱼
SXX_Desertion_songofsiren.conversations.1.text=<html><body>哦，这个可怜的生灵想离开我们？<br>那可不行！</body></html>
SXX_Desertion_songofsiren.conversations.2.name=美人鱼
SXX_Desertion_songofsiren.conversations.2.text=我要为他歌唱，用歌声洗去他心中的烦恼……
SXX_Desertion_songofsiren.conversations.3.name=提示
SXX_Desertion_songofsiren.conversations.3.text=海妖带有魔力的摇篮曲传入逃兵耳中。才听了几个音符，他压抑已久的情绪便开始释放，几乎忍不住落泪。
SXX_Desertion_songofsiren.conversations.4.name=提示
SXX_Desertion_songofsiren.conversations.4.text=<html><body>${selected-unit-name}暂时会留在队伍里！不过，这只是权宜之计……<br>（每个单位每天会进行一次逃兵判定。）</body></html>
SXX_Desertion_tranquility.conversations.1.name=林妖
SXX_Desertion_tranquility.conversations.1.text=<html><body>你好，营地里都在说，你想离开我们。是真的吗？<br>来，陪我坐一会儿吧。</body></html>
SXX_Desertion_tranquility.conversations.2.name=林妖
SXX_Desertion_tranquility.conversations.2.text=<html><body>听见了吗？鸟鸣，树叶的沙沙声。大自然的声音多美啊，不是吗？<br>现在，告诉我你心里在想什么……</body></html>
SXX_Desertion_tranquility.conversations.3.name=提示
SXX_Desertion_tranquility.conversations.3.text=这名士兵向林妖敞开心扉，两人在树荫下安静地坐了几个小时。等他起身时，看起来已经轻松了许多。
SXX_Desertion_tranquility.conversations.4.name=提示
SXX_Desertion_tranquility.conversations.4.text=<html><body>${selected-unit-name}暂时会留在队伍里！不过，这只是权宜之计……<br>（每个单位每天会进行一次逃兵判定。）</body></html>
SXX_EndlessPurse_gold.conversations.1.name=提示
SXX_EndlessPurse_gold.conversations.1.text=<html><body>无尽钱袋突然鼓了起来，装满金币！你获得250金币。<br>（这件宝物每天都会产生金币。）</body></html>
SXX_GameCards_draw_select.conversations.0.selection-text=<html><body>对手换牌情况：${game-cards-cpu-exchanges-count-label}。<br><br>你的最佳牌型是${game-cards-player-hand-rank-label}。<br>对手的最佳牌型是${game-cards-cpu-hand-rank-label}。<br><br>平局。双方各自收回赌注。<br><br>要再玩一局吗？<br><br>（你拥有 ${gold} 金币）</body></html>
SXX_GameCards_gain_select.conversations.0.selection-text=<html><body>对手换牌情况：${game-cards-cpu-exchanges-count-label}。<br><br>你的最佳牌型是${game-cards-player-hand-rank-label}。<br>对手的最佳牌型是${game-cards-cpu-hand-rank-label}。<br><br>你赢得了奖池中的全部金币（${game-cards-bet-value}金币）！<br><br>要再玩一局吗？<br><br>（你拥有 ${gold} 金币）</body></html>
