SXX_GameFishing_fail_select.conversations.0.selection-text=<html><body>糟了！那条滑溜溜的鱼叼走了鱼饵。<br>旁边的渔民努力忍着笑。<br><br>要再抛一次竿吗？<br><br>每次鱼饵需花20金币，不保证能钓到鱼。<br>钓到的鱼可以兑换奖品。<br><br>（你拥有 ${gold} 金币）</body></html>
SXX_GameFishing_gain_select.conversations.0.selection-text=<html><body>钓到了！你手腕一抖，一条银光闪闪的鱼<br>跃出水面，落在脚边。干得好！<br><br>要再抛一次竿吗？钓得越久，<br>越有机会遇到稀有的鱼。<br><br>每次鱼饵需花20金币，不保证能钓到鱼。<br>钓到的鱼可以兑换奖品。<br><br>（你拥有 ${gold} 金币）</body></html>
SXX_GameFishing_init_select.conversations.0.selection-text=<html><body>渔民们在拥挤的码头上为你腾出位置。<br>其中一人递来一根挂着鱼钩的钓竿。<br><br>要抛竿试试运气吗？<br><br>每次鱼饵需花20金币，不保证能钓到鱼。<br>钓到的鱼可以兑换奖品。<br><br>（你拥有 ${gold} 金币）</body></html>
SXX_GameFishing_play_minus_select.conversations.0.selection-text=<html><body>鱼线开始松弛，鱼渐渐疲惫了。<br><br>${game-fishing-status}<br><br>（拉紧鱼线可以让鱼钩挂得更牢，<br>放松鱼线可以让鱼更快疲惫。<br>两种方式都能创造收线时机，但别过头！）<br><br>快，你要怎么做？</body></html>
SXX_GameFishing_play_plus_select.conversations.0.selection-text=<html><body>鱼奋力挣扎，鱼线绷紧了。<br><br>${game-fishing-status}<br><br>（拉紧鱼线可以让鱼钩挂得更牢，<br>放松鱼线可以让鱼更快疲惫。<br>两种方式都能创造收线时机，但别过头！）<br><br>快，你要怎么做？</body></html>
SXX_GameFishing_play_start_select.conversations.0.selection-text=<html><body>稍等片刻后，你感觉鱼线轻轻一动。<br><br>${game-fishing-status}<br><br>（拉紧鱼线可以让鱼钩挂得更牢，<br>放松鱼线可以让鱼更快疲惫。<br>两种方式都能创造收线时机，但别过头！）<br><br>快，你要怎么做？</body></html>
SXX_GameFishing_shop_select.conversations.0.selection-text=<html><body>你把钓到的鱼放进篮子，来到当地鱼市。<br>潜海者不需要金币，却很愿意用各种<br>实用物品交换你的鱼。<br><br>想用鱼换什么？钓得越久，<br>越有机会遇到稀有的鱼。<br><br>（拥有足够的鱼后，会显示更多选项。）</body></html>
