LevelGlobalEvents40.triggers.on-select-48.description=靠近巫妖的祭坛。
LevelGlobalEvents40.triggers.on-select-49.text=太危险了，我们回去吧。
LevelGlobalEvents40.triggers.on-select-49.description=返回世界地图。
LevelGlobalEvents50.triggers.on-select-1.text=攻击虫人！
LevelGlobalEvents50.triggers.on-select-1.description=向这群虫人发起进攻。
LevelGlobalEvents50.triggers.on-select-2.text=派林妖前去交易。
LevelGlobalEvents50.triggers.on-select-2.description=看看虫人有什么货物。
LevelGlobalEvents50.triggers.on-select-3.text=慢慢退走。
LevelGlobalEvents50.triggers.on-select-3.description=返回世界地图。
LevelGlobalEvents60.triggers.on-select-5.text=让她加入队伍。
LevelGlobalEvents60.triggers.on-select-5.description=允许魅魔加入你的队伍。
LevelGlobalEvents60.triggers.on-select-6.text=不了，她的事与我们无关。
LevelGlobalEvents60.triggers.on-select-6.description=返回世界地图。
LevelGlobalEvents60.triggers.on-select-22.text=大概没什么，继续赶路吧。
LevelGlobalEvents60.triggers.on-select-22.description=返回世界地图。
LevelGlobalEvents60.triggers.on-select-23.text=追上那个神秘的家伙！
LevelGlobalEvents60.triggers.on-select-23.description=追赶那个没看清的身影。
LevelGlobalEvents60.triggers.on-select-24.text=放狼去追！
LevelGlobalEvents60.triggers.on-select-24.description=狼群能追上逃跑者吗？
LevelGlobalEvents60.triggers.on-select-34.text=一定得弄清外面是什么！
LevelGlobalEvents60.triggers.on-select-34.description=循着嚎叫声寻找那头生物。
LevelGlobalEvents60.triggers.on-select-35.text=别理它，接着睡。
