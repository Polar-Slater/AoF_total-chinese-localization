# Shared events batch 3: forty choices and two follow-up battle introductions.
LevelGlobalEvents00.triggers.on-select-23.text=这个乞丐在浪费我们的时间，我们走吧。
LevelGlobalEvents00.triggers.on-select-23.description=返回世界地图。
LevelGlobalEvents00.triggers.on-select-24.text=来都来了，看看他有什么吧。（5金币）
LevelGlobalEvents00.triggers.on-select-24.description=付钱参观“珍宝展”。（5金币）
LevelGlobalEvents00.triggers.on-select-27.text=让地精自己商量吧。
LevelGlobalEvents00.triggers.on-select-27.description=让地精自行达成共识。
LevelGlobalEvents00.triggers.on-select-28.text=把财宝从他们手里抢过来！
LevelGlobalEvents00.triggers.on-select-28.description=将亮闪闪的小饰物据为己有。
LevelGlobalEvents00.triggers.on-select-29.text=不过是个耍把戏的，别浪费时间了。
LevelGlobalEvents00.triggers.on-select-29.description=返回世界地图。
LevelGlobalEvents00.triggers.on-select-30.text=留下来看表演吧。（200金币）
LevelGlobalEvents00.triggers.on-select-30.description=支付200金币，观看魔术表演。
LevelGlobalEvents00.triggers.on-select-31.text=逼魔术师交出金币！
LevelGlobalEvents00.triggers.on-select-31.description=夺走魔术师的金币！=BR=（你的兽人会恐吓魔术师。）
LevelGlobalEvents00.triggers.on-select-32.text=说服魔术师加入！
LevelGlobalEvents00.triggers.on-select-32.description=魔术师将加入你的队伍！=BR=（你的魅魔会色诱魔术师。）
LevelGlobalEvents10.triggers.on-select-13.text=探索一下修道院废墟。
LevelGlobalEvents10.triggers.on-select-13.description=进入修道院。=BR=（可能发生战斗！）
LevelGlobalEvents10.triggers.on-select-14.text=这地方都成废墟了，继续赶路吧。
LevelGlobalEvents10.triggers.on-select-14.description=返回世界地图。
LevelGlobalEvents10.triggers.on-select-22.text=让强壮的矮人战士试试这条捷径！
LevelGlobalEvents10.triggers.on-select-22.description=派一名矮人战士进入洞穴。
LevelGlobalEvents10.triggers.on-select-23.text=不了，还是别冒险了。
LevelGlobalEvents10.triggers.on-select-23.description=返回世界地图。
LevelGlobalEvents10.triggers.on-select-28.text=传说难道是真的？过去问问吧。
LevelGlobalEvents10.triggers.on-select-28.description=走近老人。
LevelGlobalEvents10.triggers.on-select-29.text=不过是荒唐的童话。别理他，继续走。
LevelGlobalEvents10.triggers.on-select-29.description=返回世界地图。
LevelGlobalEvents10.triggers.on-select-30.text=揍他一顿，把法杖抢过来！
LevelGlobalEvents10.triggers.on-select-30.description=抢走老人的东西！=BR=（你的兽人会恐吓老人。）
LevelGlobalEvents20.triggers.on-select-24.text=不了，继续赶路。
LevelGlobalEvents20.triggers.on-select-24.description=返回世界地图。
LevelGlobalEvents20.triggers.on-select-25.text=加大赌注！（200金币）
LevelGlobalEvents20.triggers.on-select-25.description=与射手赌200金币。
LevelGlobalEvents20.triggers.on-select-26.text=好，就全力比一场！
LevelGlobalEvents20.triggers.on-select-26.description=与射手赌100金币。
LevelGlobalEvents40.triggers.on-select-2.text=算了，就当破财，继续赶路吧。
LevelGlobalEvents40.triggers.on-select-2.description=返回世界地图。
LevelGlobalEvents40.triggers.on-select-3.text=那帮可恶的窃贼肯定还没跑远！
LevelGlobalEvents40.triggers.on-select-3.description=追赶窃贼！=BR=（将开始一场战斗！）
LevelGlobalEvents40.triggers.on-select-4.text=派我们自己的窃贼去追！
LevelGlobalEvents40.triggers.on-select-4.description=让行家追踪这伙窃贼！
