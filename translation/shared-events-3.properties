LevelGlobalEvents40.triggers.on-select-22.description=返回世界地图。
LevelGlobalEvents40.triggers.on-select-23.text=看看它们想干什么！
LevelGlobalEvents40.triggers.on-select-23.description=跟随鬼火！
LevelGlobalEvents40.triggers.on-select-46.text=进去四处看看。
LevelGlobalEvents40.triggers.on-select-46.description=探索哨所废墟。
