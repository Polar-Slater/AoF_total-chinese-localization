# 通用对话第16批：珍珠美人鱼与萨满小屋。
SXX_PearlMermaid_gain.conversations.0.name=提示
SXX_PearlMermaid_gain.conversations.0.text=美人鱼咯咯笑着，一把接过珍珠，转身潜入海中。一分钟后，她破水而出，将一件东西高高举过头顶。
SXX_PearlMermaid_join.conversations.0.name=提示
SXX_PearlMermaid_join.conversations.0.text=美人鱼饶有兴致地打量着你，从你手中接过黑珍珠。随后，她用尖细的嗓音吟诵起古老的咒语……
SXX_PearlMermaid_join.conversations.1.name=提示
SXX_PearlMermaid_join.conversations.1.text=过了一会儿，海水向两侧分开，一头巨大的怪物从水中爬了出来！
SXX_PearlMermaid_join.conversations.2.name=蟹神
SXX_PearlMermaid_join.conversations.2.text=咔嗒！咔嗒！
SXX_PearlMermaid_join.conversations.3.name=蟹神
SXX_PearlMermaid_join.conversations.3.text=咔嗒！咔嗒！
SXX_PearlMermaid_join.conversations.4.name=蟹神
SXX_PearlMermaid_join.conversations.4.text=（这生物平静地望着你。）
SXX_PearlMermaid_join.conversations.5.name=提示
SXX_PearlMermaid_join.conversations.5.text=太好了！看来这生物愿意跟随你！
SXX_ShamanHut_cleanse.conversations.0.name=提示
SXX_ShamanHut_cleanse.conversations.0.text=睿智的老萨满施展净化仪式，你的英雄顿时感到一阵前所未有的轻松！（英雄身上的诅咒物品已全部卸下，任务物品除外。）
SXX_ShamanHut_enter.conversations.0.name=提示
SXX_ShamanHut_enter.conversations.0.text=<html><body>老萨满能够帮你的英雄卸下诅咒物品。<br>不过要注意，他的服务可不便宜！</body></html>
