# 通用事件第11批：恶魔城地点及契约选择。
LevelDemonCity01.text=<html><body>沿着火山内部蜿蜒的通道深入，一座恶魔的城市隐匿其中，远离地表的凡人世界。<br><br>这座城市深藏地下，又有一道强大的心智屏障遮蔽，附近的人类聚落对脚下繁盛的恶魔社会毫不知情。<br><br>然而，你携带的恶魔之心似乎能够抵消这道心智屏障！<br><br>英雄们走近火山脚下时，一处刻有恶魔符文的入口渐渐显现。<br><br>冒险者们踏入通道，开始向下深入恶魔城 (Demon City)……</body></html>
