# 通用事件第22批：蛮王陵墓与幸福之泉
LevelBarbarianKingTomb01.text=<html><body>在山腹幽暗的深处，冒险者们沿着蜿蜒的隧道，发现了尽头藏着的一座巨大洞穴。洞穴中央的巨石阵散发着诡异的绿光。<br><br>幽光照亮了岩壁上古朴的壁画，画中似乎全是一个野蛮人部落及其常胜君王征战凯旋的场景。<br><br>巨石阵底部围放着各式古老的祭品，想必有一位地位显赫的酋长长眠于此。<br><br>仔细端详其中一幅壁画时，冒险者们发现了一串符文，认出那是一段祷词！<br><br>英雄们能否破译这种古老的语言，向埋葬于此的野蛮人领主致敬？</body></html>
