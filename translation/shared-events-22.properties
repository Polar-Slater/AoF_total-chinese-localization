LevelFountainOfHappiness01.text=<html><body>冒险者们走近时，眼前的景象令人惋惜：昔日美丽的幸福之泉 (Fountain of Happiness) 如今已彻底荒废。<br><br>底座杂草丛生，水池积满泥土，水罐半埋在地下，曾经气派的石雕也碎成了残骸。整座喷泉破败不堪。<br><br>无论这是随手破坏、蓄意亵渎，还是单纯疏于照料所致，都只会让目睹此景的人黯然神伤。<br><br>不过，只要悉心修缮，这座神圣的建筑仍能恢复昔日的荣光。<br><br>你们愿意让幸福之泉 (Fountain of Happiness) 重拾荣耀与尊严，让受祝福的泉水再次流淌吗？</body></html>
LevelFountainOfHappiness01.selection-text=<html><body>要重建喷泉吗？<br>（你有${gold}金币）</body></html>
LevelFountainOfHappiness01.location.name=被毁的喷泉 (Destroyed Fountain)
LevelFountainOfHappiness01.triggers.on-select-1.text=暂时不了，回去吧。
LevelFountainOfHappiness01.triggers.on-select-1.description=返回世界地图。
LevelFountainOfHappiness01.triggers.on-select-2.text=重建喷泉（1000金币）。
LevelFountainOfHappiness01.triggers.on-select-2.description=重建幸福之泉 (Fountain of Happiness)。
LevelFountainOfHappiness02.text=<html><body>泉口重新汩汩涌水，粼粼的水流沿着层层石台落入池中。清澈凉爽的泉水，让整座喷泉焕发了生机。<br><br>轻柔的流水声与欢快的水花声，在冒险者们耳中宛如乐曲。他们从未喝过如此清冽洁净的水。<br><br>若不是从这神圣的喷泉取水贩卖太过失礼，灌满一皮囊带去集市，准能卖个好价钱！<br><br>他们做到了！幸福之泉 (Fountain of Happiness) 再次成为王国中希望与善意的象征，恢复了它本该有的模样。<br><br>不知是清泉令人神清气爽，还是行善让人心情舒畅，冒险者们只觉得脚步都轻快了，已经准备好迎接接下来的冒险。</body></html>
LevelFountainOfHappiness02.location.name=幸福之泉 (Fountain of Happiness)
