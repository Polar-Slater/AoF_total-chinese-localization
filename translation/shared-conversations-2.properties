# Shared events batch 2: thirteen travel encounters and all their conversation branches.
SGE_Candles_fail_select.conversations.0.selection-text=<html><body>糟了，选错了，蜡烛又自行燃了起来。<br>这里显然有某种神秘的魔法在起作用！<br><br>英雄们要再试一次吗？</body></html>
SGE_Candles_gain.conversations.1.name=提示
SGE_Candles_gain.conversations.1.text=顺序正确！最后仍在燃烧的那根蜡烛，似乎是一件珍贵的骨烛，拥有控制亡灵的力量！
SGE_Candles_init_select.conversations.0.selection-text=<html><body>你的队伍发现地上燃着几根蜡烛，<br>排列成神秘的图案。英雄们四处寻找<br>与这场仪式有关的线索，却一无所获。<br><br>英雄们要试着熄灭这些蜡烛吗？</body></html>
SGE_Candles_success_select.conversations.0.selection-text=<html><body>这根蜡烛熄灭了！<br>接下来选哪一根？</body></html>
SGE_Caravan_fail.conversations.1.name=提示
SGE_Caravan_fail.conversations.1.text=“你这个小偷！”商人大叫起来，护卫们迅速在他身边摆开防御阵形。
SGE_Caravan_fail.conversations.2.name=提示
SGE_Caravan_fail.conversations.2.text=<html><body>已经没什么好谈的了，英雄们只得离开。<br>（这支旅行商队再也不会为你停留。）</body></html>
SGE_Caravan_select.conversations.0.selection-text=<html><body>行路途中，你的队伍遇到了一位行商。<br>他邀请你们看看货物，<br>武装护卫则站在一旁。<br><br>要看看商人出售的货物吗？</body></html>
SGE_Crows_battle.conversations.1.name=提示
SGE_Crows_battle.conversations.1.text=乌鸦把你们引到了一场激战之中！一群矮人正遭到兽人的攻击。双方都会视你们为敌，你们必须把他们全部击败！
SGE_Crows_gain.conversations.1.name=提示
SGE_Crows_gain.conversations.1.text=乌鸦把你们引到了一处战斗刚刚结束的地方。一群矮人惨遭绿皮屠戮。
SGE_Crows_gain.conversations.2.name=提示
SGE_Crows_gain.conversations.2.text=尸体上的东西已被搜刮一空，只剩下一面盾牌。
SGE_Crows_select.conversations.0.selection-text=<html><body>几个小时以来，一群乌鸦始终在队伍<br>上方盘旋。附近一定发生了什么大事，<br>才会吸引它们聚集于此。<br><br>要跟随这群乌鸦吗？</body></html>
SGE_DeadHydra_gain.conversations.0.name=提示
SGE_DeadHydra_gain.conversations.0.text=吸血鬼在死去的多头蛇身旁跪下，低声念起复生咒语。随着违背自然的生命被强行注入，多头蛇的躯体开始抽搐。
SGE_DeadHydra_gain.conversations.1.name=提示
SGE_DeadHydra_gain.conversations.1.text=复苏的怪物发出低沉的闷吼，重新站了起来。（一头吸血多头蛇加入了你的军队！）
SGE_DeadHydra_select.conversations.0.selection-text=<html><body>探索途中，你的队伍发现了一头强大<br>多头蛇的尸体，死去似乎还没多久。<br>食腐动物尚未来得及饱餐一顿。<br>这头曾令人胆寒的巨兽，未必就此长眠……<br><br>要让这头多头蛇复生吗？</body></html>
SGE_DemonWriting_fail.conversations.1.name=提示
SGE_DemonWriting_fail.conversations.1.text=你的英雄花了几个小时尝试解读这些文字，试遍了数种恶魔语言，却毫无进展。
SGE_DemonWriting_gain.conversations.1.name=提示
SGE_DemonWriting_gain.conversations.1.text=恶魔符号被成功破译了！将译出的刻文高声念出后，一枚神秘护符凭空出现在眼前！
SGE_DemonWriting_select.conversations.0.selection-text=<html><body>你的队伍在石壁上发现了一些古老文字。<br>一位英雄认出，那些发光的刻痕<br>是恶魔的语言。<br><br>要让英雄尝试破译这些符号吗？</body></html>
SGE_DemonicAltar_gain.conversations.0.name=提示
SGE_DemonicAltar_gain.conversations.0.text=被当作祭品的地精拼命挣扎，利刃一闪，挣扎便戛然而止。一件小饰物凭空出现在你沾满鲜血的手中。
SGE_DemonicAltar_select.conversations.0.selection-text=<html><body>探索一处神秘洞穴时，你的队伍发现<br>一座恶魔祭坛。萨满认出，这是举行<br>献祭仪式的地方。混沌之力将依据<br>所献的鲜血赐予回报。<br><br>要献上祭品，取悦恶魔吗？</body></html>
SGE_DwarvenRunes_fail.conversations.0.name=提示
SGE_DwarvenRunes_fail.conversations.0.text=你的英雄花了整个下午苦苦解读符文，最终除了头痛欲裂，一无所获。队伍只好继续上路。
SGE_DwarvenRunes_select.conversations.0.selection-text=<html><body>探索群山时，你的队伍发现了一座<br>废弃的矮人堡垒。堡内墙壁从上到下<br>刻满了符文。这里究竟记载着多少<br>古老智慧，实在令人遐想！<br><br>要尝试解读这些符文吗？</body></html>
SGE_DwarvenRunes_success.conversations.0.name=提示
SGE_DwarvenRunes_success.conversations.0.text=你的符文锻造师一眼就认出了许多符文，随即着手拼凑它们的含义。
SGE_DwarvenRunes_success.conversations.1.name=提示
SGE_DwarvenRunes_success.conversations.1.text=译出的符文并未记载多少古老知识，但这番尝试仍让符文锻造师受益匪浅。（你的符文锻造师获得200点经验值。）
SGE_LostGhost_fail.conversations.0.name=提示
SGE_LostGhost_fail.conversations.0.text=你的英雄决定试着与报丧女妖交谈，但你们刚迈步靠近，她便消失了。
SGE_LostGhost_gain.conversations.0.name=提示
SGE_LostGhost_gain.conversations.0.text=死灵法师成功与报丧女妖沟通，说服她加入了你们！
SGE_LostGhost_lost.conversations.0.name=提示
SGE_LostGhost_lost.conversations.0.text=牧师开始举行驱魔仪式，几乎刚一开始，仪式便结束了。
SGE_LostGhost_lost.conversations.1.name=提示
SGE_LostGhost_lost.conversations.1.text=报丧女妖发出痛苦的尖叫，随一道闪光消失无踪！（你的单位获得100点经验值。）
SGE_LostGhost_select.conversations.0.selection-text=<html><body>一个孤独的幽灵出现在队伍面前！<br>英雄们稍作交谈，想起了一段悲伤往事：<br>一位士兵失踪后，他的妻子一直苦苦等候，<br>直到去世也没盼到丈夫归来。<br>眼前的幽灵，想必就是她留下的魂魄。<br><br>英雄们要靠近这位可怜的幽灵吗？</body></html>
SGE_LovePotion_gain.conversations.0.name=莱克莎
SGE_LovePotion_gain.conversations.0.text=哦，多么浪漫的决定，亲爱的！来，这瓶爱情药剂归你了。
SGE_LovePotion_gain.conversations.1.name=莱克莎
SGE_LovePotion_gain.conversations.1.text=那么，恕我先告辞了。我还得去远方，为其他有情人点燃爱火呢。
SGE_LovePotion_refund.conversations.0.name=莱克莎
SGE_LovePotion_refund.conversations.0.text=哎呀！把你的脏手拿开！
SGE_LovePotion_refund.conversations.1.name=莱克莎
SGE_LovePotion_refund.conversations.1.text=什么，退钱？！哦，你们这些野蛮人！好吧，我退，我退！
SGE_LovePotion_refund.conversations.2.name=提示
SGE_LovePotion_refund.conversations.2.text=女巫想要逃走，却被英雄们及时抓住。她从袋中掏出500金币退还给你们，随后骂骂咧咧地离开了。
SGE_LovePotion_select.conversations.0.name=莱克莎
SGE_LovePotion_select.conversations.0.text=<html><body>你好，英勇的英雄！<br>这么好的日子，你过得可好？</body></html>
SGE_LovePotion_select.conversations.1.name=莱克莎
SGE_LovePotion_select.conversations.1.text=我是大名鼎鼎的爱情女巫，肩负着将爱与幸福传遍这个世界的使命。
SGE_LovePotion_select.conversations.2.name=莱克莎
SGE_LovePotion_select.conversations.2.text=我特意为你准备了限时优惠！只需区区500金币，就能买到满满一瓶爱情药剂（TM），独家秘方哦。
SGE_LovePotion_select.conversations.3.name=莱克莎
SGE_LovePotion_select.conversations.3.text=只要抿上一小口，你和心上人就能共度难忘的美好时光！
SGE_LovePotion_select.conversations.4.selection-text=<html><body>要购买爱情药剂吗？<br>（你拥有 ${gold} 金币）</body></html>
SGE_MysteriousPotion_gain.conversations.0.name=提示
SGE_MysteriousPotion_gain.conversations.0.text=你的英雄鼓起勇气，咕咚几口喝光了整瓶药剂。最后一滴刚下肚，英雄便觉得信心大增！（你的英雄获得“顽强不屈”特性。）
SGE_MysteriousPotion_select.conversations.0.selection-text=<html><body>你的队伍找到了一瓶神秘药剂。<br>药效似乎十分强劲，作用却不得而知，<br>只有最勇敢的人才敢尝上一口。<br><br>要让一位英雄喝下这瓶药剂吗？</body></html>
SGE_TrollBridge_lose.conversations.0.name=提示
SGE_TrollBridge_lose.conversations.0.text=你的英雄与巨魔摔跤摔了一个小时，长久的角力却依然没能分出胜负。
SGE_TrollBridge_lose.conversations.1.name=提示
SGE_TrollBridge_lose.conversations.1.text=“软蛋！”巨魔吼道，再次挡住了桥。你的队伍只好另寻他路。
SGE_TrollBridge_select.conversations.0.selection-text=<html><body>队伍来到一座石桥前，一头巨大的<br>巨魔挡住了去路。英雄们刚一靠近，<br>它便举起攥紧的拳头。这显然是在挑战，<br>不过，获胜似乎还能得到奖赏！<br><br>要让一位英雄与巨魔较量吗？</body></html>
SGE_TrollBridge_win.conversations.0.name=提示
SGE_TrollBridge_win.conversations.0.text=<html><body>几声闷哼、几番扭打之后，巨魔被制服了，英雄赢得毫无争议。<br>“你真壮。俺跟你混！”巨魔咧嘴笑道。</body></html>
SGE_TrollCook_fail.conversations.0.name=提示
SGE_TrollCook_fail.conversations.0.text=尝试巨魔的手艺可不是什么明智之举。巨魔的肠胃能把这锅瘟疫般的炖汤当饭吃，你们的可不行。（你的几个单位需要休养。）
SGE_TrollCook_select.conversations.0.selection-text=<html><body>真走运——队伍遇见了一位有名的巨魔厨师！<br>他从大锅里舀出几碗浑浊的棕色黏糊。<br>把这东西吃下去，恐怕不是什么好主意。<br><br>要尝尝巨魔的炖汤吗？</body></html>
SGE_TrollCook_success.conversations.0.name=提示
SGE_TrollCook_success.conversations.0.text=巨魔的炖汤竟然十分美味！队伍饱餐一顿，对厨师赞不绝口。（你的所有单位都获得100点经验值！）
SGE_WoundedOgre_heal.conversations.0.name=提示
SGE_WoundedOgre_heal.conversations.0.text=你把一瓶疗伤药剂交给一只地精，让他送给受伤的食人魔。地精刚一靠近，食人魔就来了精神。
SGE_WoundedOgre_heal.conversations.1.name=提示
SGE_WoundedOgre_heal.conversations.1.text=地精还没来得及反应，就被食人魔一把抓住，整个吞了下去！
SGE_WoundedOgre_heal.conversations.2.name=食人魔
SGE_WoundedOgre_heal.conversations.2.text=头儿，谢谢你送来好吃的！俺伤得不重，就是饿坏了。现在好多啦！俺跟你走，成不？
SGE_WoundedOgre_kill.conversations.0.name=提示
SGE_WoundedOgre_kill.conversations.0.text=你认定食人魔已无药可救。能亲手帮他结束痛苦，队员们都兴奋不已！
SGE_WoundedOgre_kill.conversations.1.name=提示
SGE_WoundedOgre_kill.conversations.1.text=队伍一拥而上，很快便将受伤的食人魔打死。（你的每个单位都获得100点经验值。）
SGE_WoundedOgre_select.conversations.0.selection-text=<html><body>巡逻途中，你的队伍发现一头受伤的食人魔，<br>瘫坐在树旁。他喘着粗气，紧捂着腹部<br>渗血的伤口，痛苦不堪，<br>几乎没有察觉你们的到来。<br><br>要帮助这头食人魔吗？</body></html>
