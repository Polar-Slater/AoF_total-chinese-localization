# The Storm Mountain — 简体中文
CAMPAIGN=vampirehuntercampaign
LOCALE=zh
LevelNewSeaPeople01.text=<html><body>风暴山 (Storm Mountain) 盘踞着混乱的力量，这一点并不令人意外。北峰 (Northern Peak) 上空密布的乌黑雷云，清楚地预示着祸事正在酝酿。<br><br>从风暴肆虐的山顶，到烈日炙烤的沙丘，再到波涛汹涌的大海，一切似乎都汇向了一个不起眼的海滨村落。那里的居民正需要一位英雄。<br><br>无论困扰这座聚落的究竟是魔法还是自然异象，只有最勇敢的冒险者才有本事查明真相……</body></html>
LevelNewSeaPeople01.location.name=风暴山 (Storm Mountain)
LevelNewSeaPeople02.text=<html><body>安吉拉和信使抵达了这个陷入困境的海滨村庄。午后阳光明媚，微风轻拂，四处走动的海族村民却明显心神不宁。<br><br>信使指了指沙滩上一群挤在一起的潜海者。<br><br>安吉拉眼角瞥见一只有翼生物从栖身的岩崖上腾空飞去。<br><br>她朝捕鱼的人吹了声口哨，挥手招呼。一位满脸皱纹的海巫蹒跚着走出小屋，加入了前来迎接客人的海族村民。</body></html>
LevelNewSeaPeople02.location.name=传讯！ (Message!)
LevelNewSeaPeople02.conversations.0.name=潜海者
LevelNewSeaPeople02.conversations.0.text=大家快来！安吉拉女士来了！
LevelNewSeaPeople02.conversations.1.name=安吉拉
LevelNewSeaPeople02.conversations.1.text=嗨，海里的朋友们！
LevelNewSeaPeople02.conversations.2.name=长老
LevelNewSeaPeople02.conversations.2.text=谢谢你应邀前来！这下我们可放心了，你总是靠得住。
LevelNewSeaPeople02.conversations.3.name=安吉拉
LevelNewSeaPeople02.conversations.3.text=哎呀，夸得我都脸红了。
LevelNewSeaPeople02.conversations.4.name=安吉拉
LevelNewSeaPeople02.conversations.4.text=那么，到底出什么事了？我看着一切都挺正常啊。急事在哪儿？
LevelNewSeaPeople02.conversations.5.name=潜海者
LevelNewSeaPeople02.conversations.5.text=一头可怕的海兽！在给我们捣乱！
LevelNewSeaPeople02.conversations.6.name=安吉拉
LevelNewSeaPeople02.conversations.6.text=真没礼貌！这条大鱼干了什么坏事？偷吃你们鱼钩上的饵？
LevelNewSeaPeople02.conversations.7.name=潜海者
LevelNewSeaPeople02.conversations.7.text=我们几乎每天一出海捕鱼，那头巨兽就冒出来。不让我们下水！
LevelNewSeaPeople02.conversations.8.name=娜迦战士
LevelNewSeaPeople02.conversations.8.text=嘶……我们的孩子快饿死了，储粮也快耗尽。这样下去，我们活不成的……
LevelNewSeaPeople02.conversations.9.name=安吉拉
LevelNewSeaPeople02.conversations.9.text=哎哟，真是头自私的海怪。个头那么大，胃口大点我能理解，可那也不能成为独占食物的理由吧！
LevelNewSeaPeople02.conversations.10.name=安吉拉
LevelNewSeaPeople02.conversations.10.text=所以，只有你们带着渔具划出去，它才会闹腾？
LevelNewSeaPeople02.conversations.11.name=潜海者
LevelNewSeaPeople02.conversations.11.text=是的！每次都这样！
LevelNewSeaPeople02.conversations.12.name=长老
LevelNewSeaPeople02.conversations.12.text=<html><body>我见过许多从深海中冒出来的怪物，个个都足以写进神话传说。<br>可这一头……我们从没见过，而且它比所有那些怪物都可怕！</body></html>
LevelNewSeaPeople02.conversations.13.name=章鱼
LevelNewSeaPeople02.conversations.13.text=咕噜！咕噜！
LevelNewSeaPeople02.conversations.14.name=安吉拉
LevelNewSeaPeople02.conversations.14.text=有意思。海底那些神秘生物啊，总有办法给人惊喜。
LevelNewSeaPeople02.conversations.15.name=安吉拉
LevelNewSeaPeople02.conversations.15.text=好吧，挖蛤蜊的各位，照常去干你们的活吧。如果你们说的没错……
LevelNewSeaPeople02.conversations.16.name=安吉拉
LevelNewSeaPeople02.conversations.16.text=……只要你们下水扑腾一番，那位深海小可爱就会赏脸出来亮相。
LevelNewSeaPeople02.conversations.17.name=安吉拉
LevelNewSeaPeople02.conversations.17.text=我会在沙滩上盯着。别担心，有我撑腰呢。
LevelNewSeaPeople02.conversations.18.name=潜海者
LevelNewSeaPeople02.conversations.18.text=好吧，安吉拉女士！我们再鼓起勇气试一次……
LevelNewSeaPeople03.text=<html><body>听完这桩怪事的来龙去脉，安吉拉在沙地上坐下，望向大海。一小队潜海者唱起部族的歌谣，为接下来要做的事壮胆。<br><br>风很轻，海浪轻柔地拍着岸，水面上没有丝毫危险的迹象。眼见四下平静，潜海者们将空渔网披在肩头，迟疑着涉入蔚蓝的海水。<br><br>就在那一瞬间，一头庞然怪物在离岸不远处破水而出。它张开骇人的巨口，猛拍尾巴，将一堵水墙掀向沙滩。<br><br>潜海者惊慌失措地往后退去，海怪却仍在张牙舞爪地恐吓他们！</body></html>
LevelNewSeaPeople03.location.name=海怪 (Sea Monster)
LevelNewSeaPeople03.conversations.0.name=潜海者
LevelNewSeaPeople03.conversations.0.text=啊啊啊！那头野兽又来了！
LevelNewSeaPeople03.conversations.1.name=安吉拉
LevelNewSeaPeople03.conversations.1.text=还真是。瞧瞧那家伙！
LevelNewSeaPeople03.conversations.2.name=长老
LevelNewSeaPeople03.conversations.2.text=正如我所说，我们不认识这种生物。我们的传说里从来没有提到过它！
LevelNewSeaPeople03.conversations.3.name=安吉拉
LevelNewSeaPeople03.conversations.3.text=那这位远道而来的海上陌生客连个自我介绍都不做，岂不是更没礼貌！
LevelNewSeaPeople03.conversations.4.name=安吉拉
LevelNewSeaPeople03.conversations.4.text=不管它是不是从未被发现的深海怪物，这回它都欺负错人了。我们过去教教它规矩。
LevelNewSeaPeople03.conversations.5.name=安吉拉
LevelNewSeaPeople03.conversations.5.text=想办法绕到它身后，小心尾巴！说不定能把这头满身藤壶的庞然大物赶进浅水区。
LevelNewSeaPeople03.conversations.6.name=娜迦战士
LevelNewSeaPeople03.conversations.6.text=安吉拉，又有客人来了！嘶……有什么东西把一大群水元素召到了水面！
LevelNewSeaPeople03.conversations.7.name=水元素
LevelNewSeaPeople03.conversations.7.text=（咕噜）（咕噜）
LevelNewSeaPeople03.conversations.8.name=安吉拉
LevelNewSeaPeople03.conversations.8.text=这群湿漉漉的家伙，倒挺会趁火打劫。好吧，先对付元素生物，再收拾那头海兽！
LevelNewSeaPeople04.conversations.0.name=水元素
LevelNewSeaPeople04.conversations.0.text=（咕噜）（咕噜）
LevelNewSeaPeople04.conversations.1.name=水元素
LevelNewSeaPeople04.conversations.1.text=（咕噜）（咕噜）
LevelNewSeaPeople04.triggers.on-battle-task-1.text=纯净魔力×2：在第10回合结束前赢得战斗
LevelNewSeaPeople05.text=<html><body>海怪似乎根本没注意到那些水元素，也没注意到刚才的战斗，仍旧疯狂地翻腾着。<br><br>潜海者勇敢地迎着汹涌海浪游去，成功绕到了巨兽身后。他们用三叉戟不断戳刺，终于将怪物逼进了一片浅水区。<br><br>一队娜迦战士逼近怪物侧翼，一队娜迦弓箭手在岸边列阵，准备齐射。<br><br>安吉拉已将这头海中巨兽纳入准星。</body></html>
LevelNewSeaPeople05.conversations.0.name=安吉拉
LevelNewSeaPeople05.conversations.0.text=干得漂亮！它被逼到我们想要的位置了，别手软！
LevelNewSeaPeople05.conversations.1.name=潜海者
LevelNewSeaPeople05.conversations.1.text=喝啊！去死，去死！
LevelNewSeaPeople05.conversations.2.name=潜海者
LevelNewSeaPeople05.conversations.2.text=……什么？！我的刀……直接穿过去了！
LevelNewSeaPeople05.conversations.3.name=娜迦战士
LevelNewSeaPeople05.conversations.3.text=我的也是！嘶……怎么回事？！
LevelNewSeaPeople05.conversations.4.name=安吉拉
LevelNewSeaPeople05.conversations.4.text=这下可好，这东西好像不完全是……呃……真的。
LevelNewSeaPeople05.conversations.5.name=潜海者
LevelNewSeaPeople05.conversations.5.text=啊？我们杀不死它？！
LevelNewSeaPeople05.conversations.6.name=安吉拉
LevelNewSeaPeople05.conversations.6.text=<html><body>这是幻象！根本没东西可杀。<br>瞧，就像拿刀去砍一束阳光。</body></html>
LevelNewSeaPeople05.conversations.7.name=安吉拉
LevelNewSeaPeople05.conversations.7.text=哇，快看！那头海兽，它的样子晃起来了！
LevelNewSeaPeople05.conversations.8.name=安吉拉
LevelNewSeaPeople05.conversations.8.text=什么？怪物就这么……消失了！
LevelNewSeaPeople05.conversations.9.name=潜海者
LevelNewSeaPeople05.conversations.9.text=哇！邪门的魔法。搞不懂！
LevelNewSeaPeople05.conversations.10.name=娜迦战士
LevelNewSeaPeople05.conversations.10.text=嘶……太奇怪了！也许长老知道我们遇上的是什么……
LevelNewSeaPeople05.conversations.11.name=安吉拉
LevelNewSeaPeople05.conversations.11.text=对，去问问她吧。难道这一切都只是光影把戏？
LevelNewSeaPeople06.text=<html><body>被这场与幻象的交锋弄得一头雾水，安吉拉和队伍回到了沙滩。水元素无疑是真的，可那头“海兽”似乎只是障眼法。不弄清事情的根源，海族村民就还不能安心。<br><br>不管怎样，安吉拉还是赞扬了海族的勇气。他们一同欢呼高唱，庆祝了一番，随后散坐在沙地上晾干身子。<br><br>安吉拉拧去帽子里的海水，又甩了甩受潮的手枪。除了有些狼狈，她并无大碍，于是径直朝海巫的小屋走去。</body></html>
LevelNewSeaPeople06.location.name=长老 (Elders)
LevelNewSeaPeople06.conversations.0.name=安吉拉
LevelNewSeaPeople06.conversations.0.text=嘿，巫婆奶奶！我带来了些……有意思的消息。
LevelNewSeaPeople06.conversations.1.name=长老
LevelNewSeaPeople06.conversations.1.text=哦？快说，你杀掉那头可怕的怪物了吗？！
LevelNewSeaPeople06.conversations.2.name=安吉拉
LevelNewSeaPeople06.conversations.2.text=呃，不完全算。说出来你可能不信……那头“野兽”只是个幻影。
LevelNewSeaPeople06.conversations.3.name=长老
LevelNewSeaPeople06.conversations.3.text=什么？幻影？！
LevelNewSeaPeople06.conversations.4.name=长老
LevelNewSeaPeople06.conversations.4.text=这是什么诡计？是谁干的？！
LevelNewSeaPeople06.conversations.5.name=安吉拉
LevelNewSeaPeople06.conversations.5.text=我也一头雾水！说实话，我还指望你能告诉我点线索呢。
LevelNewSeaPeople06.conversations.6.name=长老
LevelNewSeaPeople06.conversations.6.text=这可太反常了……
LevelNewSeaPeople06.conversations.7.name=长老
LevelNewSeaPeople06.conversations.7.text=恐怕我也没法给你更多解释，不过请去找娜迦们谈谈吧。
LevelNewSeaPeople06.conversations.8.name=长老
LevelNewSeaPeople06.conversations.8.text=自从这头怪物第一次出现，她们就频频看见异象。
LevelNewSeaPeople06.conversations.9.name=长老
LevelNewSeaPeople06.conversations.9.text=她们下午的通灵仪式这会儿应该快结束了，去洞穴里找她们吧。
LevelNewSeaPeople07.text=<html><body>安吉拉离开长老的小屋，沿海滩走向娜迦们的洞穴。几个好奇的潜海者跟着她，来到嵌在崖壁中的嶙峋洞口。<br><br>才踏进洞穴，一股浓烈刺鼻的香气就呛得她连连咳嗽。燃香冒出的浓烟弥漫在空气中，安吉拉花了好一会儿才适应过来。<br><br>再往里走几步，她看见几位蛇身女术士，围坐在精心摆放的摇曳烛火和神秘器物旁。娜迦们似乎正处于恍惚出神的状态，看上去像睡着了，双手却在火焰上方的空气中画着图案。<br><br>安吉拉刚一走近，娜迦们便猛地睁开了眼睛。</body></html>
LevelNewSeaPeople07.conversations.0.name=娜迦战士
LevelNewSeaPeople07.conversations.0.text=欢迎，安吉拉。我们知道你会来。嘶……请坐。
LevelNewSeaPeople07.conversations.1.name=安吉拉
LevelNewSeaPeople07.conversations.1.text=抱歉打扰你们吞云吐雾了，姑娘们。长老让我来聊聊，她觉得你们也许知道我们碰上的是什么。
LevelNewSeaPeople07.conversations.2.name=安吉拉
LevelNewSeaPeople07.conversations.2.text=外面到底是怎么回事，你们能告诉我点什么吗？难道那怪物是我们一起想象出来的？
LevelNewSeaPeople07.conversations.3.name=娜迦战士
LevelNewSeaPeople07.conversations.3.text=不，你们看见的确实存在，只不过……嘶……就像镜中的倒影。
LevelNewSeaPeople07.conversations.4.name=娜迦战士
LevelNewSeaPeople07.conversations.4.text=每当海兽出现，我们都会感觉到一股可疑的力量……
LevelNewSeaPeople07.conversations.5.name=安吉拉
LevelNewSeaPeople07.conversations.5.text=是吗？你们觉得这意味着什么？
LevelNewSeaPeople07.conversations.6.name=娜迦战士
LevelNewSeaPeople07.conversations.6.text=我们还不能确定，但也许……嘶……是施法留下的迹象。
LevelNewSeaPeople07.conversations.7.name=安吉拉
LevelNewSeaPeople07.conversations.7.text=魔法把戏，听着有道理。谁，或者什么东西，会搞这种骗局？
LevelNewSeaPeople07.conversations.8.name=娜迦战士
LevelNewSeaPeople07.conversations.8.text=许多魔法生物都拥有这样的力量。
LevelNewSeaPeople07.conversations.9.name=娜迦战士
LevelNewSeaPeople07.conversations.9.text=容我和姐妹们再次前往星界……
LevelNewSeaPeople07.conversations.10.name=娜迦战士
LevelNewSeaPeople07.conversations.10.text=……
LevelNewSeaPeople07.conversations.11.name=娜迦战士
LevelNewSeaPeople07.conversations.11.text=……
LevelNewSeaPeople07.conversations.12.name=娜迦战士
LevelNewSeaPeople07.conversations.12.text=我看见……一个心怀恶意的半神……
LevelNewSeaPeople07.conversations.13.name=娜迦战士
LevelNewSeaPeople07.conversations.13.text=在一片沙海中……嘶……西边……
LevelNewSeaPeople07.conversations.14.name=娜迦战士
LevelNewSeaPeople07.conversations.14.text=啊！我知道这个地方。
LevelNewSeaPeople07.conversations.15.name=娜迦战士
LevelNewSeaPeople07.conversations.15.text=死亡湖 (Death Lake) 附近有片绿洲，那家伙就住在那里。在这次异象中，我感到了他阴影中的寒意。
LevelNewSeaPeople07.conversations.16.name=娜迦战士
LevelNewSeaPeople07.conversations.16.text=答案就在那位沙漠住客身上，安吉拉。他也许会矢口否认，但你不要怀疑自己。
LevelNewSeaPeople07.conversations.17.name=安吉拉
LevelNewSeaPeople07.conversations.17.text=哎呀，你们这双无所不见的蛇眼可真神。
LevelNewSeaPeople07.conversations.18.name=安吉拉
LevelNewSeaPeople07.conversations.18.text=嘿，后面那群硬壳朋友，要不要去查个究竟？
LevelNewSeaPeople07.conversations.19.name=潜海者
LevelNewSeaPeople07.conversations.19.text=哦不，别去沙漠！太热了！
LevelNewSeaPeople07.conversations.20.name=安吉拉
LevelNewSeaPeople07.conversations.20.text=来嘛，晒点太阳对你们有好处。
LevelNewSeaPeople07.conversations.21.name=潜海者
LevelNewSeaPeople07.conversations.21.text=（嘟囔）
LevelNewSeaPeople07.conversations.22.name=安吉拉
LevelNewSeaPeople07.conversations.22.text=带上帽子，多涂点防晒霜，没事的！
LevelNewSeaPeople08.text=<html><body>安吉拉带着一队不情不愿的海族，走进死亡湖 (Death Lake) 附近被太阳晒得发白的沙丘。烈日之下，每一步陷进松软沙地都成了煎熬，海族在酷热中艰难地跟着她。<br><br>沙漠辽阔无边，走在其中，连时间都失去了意义。按照娜迦星界之旅给出的大致方位，安吉拉领着队伍继续向西寻找绿洲。<br><br>走到一处沙丘斜坡的半腰时，安吉拉脚下的沙地开始颤动。<br><br>嘶嘶声骤然响起，一群火元素破土而出，发起了突袭！</body></html>
LevelNewSeaPeople08.location.name=死亡湖 (Death Lake)
LevelNewSeaPeople09.triggers.on-battle-task-1.text=钻石：在第7回合结束前消灭所有元素生物
LevelNewSeaPeople10.conversations.0.name=安吉拉
LevelNewSeaPeople10.conversations.0.text=又有一群元素生物凭空冒出来，总不会纯粹是巧合吧？这里头有股腥味。
LevelNewSeaPeople10.conversations.1.name=潜海者
LevelNewSeaPeople10.conversations.1.text=不是我！我今早洗过澡了……
LevelNewSeaPeople10.conversations.2.name=安吉拉
LevelNewSeaPeople10.conversations.2.text=傻瓜，没说你。我觉得有人在耍我们。
LevelNewSeaPeople10.conversations.3.name=安吉拉
LevelNewSeaPeople10.conversations.3.text=好吧，倒掉靴子里的沙子，继续走。在这火炉里待久了，我也许都快糊涂了，不过前面那座沙丘看着有点希望。
LevelNewSeaPeople11.text=<html><body>远处，一株孤零零的棕榈树在天际的热霭中显现，叶子轻轻摇摆。终于找到绿洲了！<br><br>烈日当头，安吉拉一行抵达了这片令人意外的乐土。宁静的水潭与高大的棕榈树，和周围干旱无情的沙漠形成鲜明对照。清凉的水和树荫实在让人无法抗拒。<br><br>安吉拉刚跪下准备灌满水囊，绿洲便骤然暗了下来，狂风卷起一道黑沙旋风。转瞬间，夹着沙砾的旋风散去，一个威严的魔法生灵悬浮在半空中。</body></html>
LevelNewSeaPeople11.location.name=棕榈绿洲 (Palm Oasis)
LevelNewSeaPeople11.conversations.0.name=伊弗利特
LevelNewSeaPeople11.conversations.0.text=闯入者！滚出这里！
LevelNewSeaPeople11.conversations.1.name=安吉拉
LevelNewSeaPeople11.conversations.1.text=哟，这不是沙丘里头号幻术大师吗？朋友，我们正找你呢。
LevelNewSeaPeople11.conversations.2.name=安吉拉
LevelNewSeaPeople11.conversations.2.text=不回答一个问题，我们哪儿也不去。你跟海族有什么过节？
LevelNewSeaPeople11.conversations.3.name=安吉拉
LevelNewSeaPeople11.conversations.3.text=他们有漂亮的海滩，你却只有这么个勉强算景观水池的地方，所以嫉妒了？
LevelNewSeaPeople11.conversations.4.name=伊弗利特
LevelNewSeaPeople11.conversations.4.text=海族？嫉妒？胡说八道，我根本不知道你在说什么。离开这里，马上！
LevelNewSeaPeople11.conversations.5.name=安吉拉
LevelNewSeaPeople11.conversations.5.text=少来。那头吓得他们全村不得安宁、明显是幻象的海兽，你敢说自己一无所知？
LevelNewSeaPeople11.conversations.6.name=伊弗利特
LevelNewSeaPeople11.conversations.6.text=你一定把我和别的全能神灵搞混了。居然以为我会浪费时间去逗弄一群用鳃呼吸的家伙，可笑！
LevelNewSeaPeople11.conversations.7.name=安吉拉
LevelNewSeaPeople11.conversations.7.text=真可惜。我还想祝贺一下，究竟是谁想出了如此富有想象力、又骇人至极的生物。
LevelNewSeaPeople11.conversations.8.name=安吉拉
LevelNewSeaPeople11.conversations.8.text=真是了不起的杰作，可惜不是你造的……
LevelNewSeaPeople11.conversations.9.name=伊弗利特
LevelNewSeaPeople11.conversations.9.text=呃？这个，嗯……
LevelNewSeaPeople11.conversations.10.name=安吉拉
LevelNewSeaPeople11.conversations.10.text=……既然不是你干的，那你的本事一定比我想的差远了，差得远得多。唉。
LevelNewSeaPeople11.conversations.11.name=伊弗利特
LevelNewSeaPeople11.conversations.11.text=等等！正是我，这位法力胜过所有同类的召唤者。你找到我了！
LevelNewSeaPeople11.conversations.12.name=伊弗利特
LevelNewSeaPeople11.conversations.12.text=所以，我的幻象让你印象深刻？我从最喜欢的几个传说里各借鉴了一点，然后——
LevelNewSeaPeople11.conversations.13.name=安吉拉
LevelNewSeaPeople11.conversations.13.text=我就知道！别再躲躲闪闪地耍花招了，你这骗子。
LevelNewSeaPeople11.conversations.14.name=伊弗利特
LevelNewSeaPeople11.conversations.14.text=哈哈哈！像我这样强大的存在，什么时候都有空找乐子。
LevelNewSeaPeople11.conversations.15.name=伊弗利特
LevelNewSeaPeople11.conversations.15.text=看看你们，一个个都快晒焦了。竟然顶着酷暑找上门来……要么是意志坚定得不可动摇，要么就是蠢得嫌命长。
LevelNewSeaPeople11.conversations.16.name=潜海者
LevelNewSeaPeople11.conversations.16.text=好干，好渴！灯神的水池真不错，让我游一会儿！
LevelNewSeaPeople11.conversations.17.name=伊弗利特
LevelNewSeaPeople11.conversations.17.text=喂！离绿洲远点，你会把一身汗和黏液都弄进我干净的水里！
LevelNewSeaPeople11.conversations.18.name=安吉拉
LevelNewSeaPeople11.conversations.18.text=我再问一遍，你到底想怎样，朋友？为什么找我这些海里朋友的麻烦，他们哪里得罪你了？
LevelNewSeaPeople11.conversations.19.name=伊弗利特
LevelNewSeaPeople11.conversations.19.text=无关私怨。主要是无聊。
LevelNewSeaPeople11.conversations.20.name=伊弗利特
LevelNewSeaPeople11.conversations.20.text=这些海中居民一见到我特制的海兽，那反应可太逗了！对于我这样闲得发慌的灯神来说，拿他们找乐子易如反掌。
LevelNewSeaPeople11.conversations.21.name=潜海者
LevelNewSeaPeople11.conversations.21.text=拿我们取笑？嘲弄我们？！我们连家人都喂不饱了！
LevelNewSeaPeople11.conversations.22.name=娜迦战士
LevelNewSeaPeople11.conversations.22.text=这灯神的羞辱……嘶……比太阳还让人火大！
LevelNewSeaPeople11.conversations.23.name=安吉拉
LevelNewSeaPeople11.conversations.23.text=闲着没事就胡乱害人……我的老天，灯神，找副牌玩玩，用棕榈叶编个篮子，随便干点什么不行吗！
LevelNewSeaPeople11.conversations.24.name=安吉拉
LevelNewSeaPeople11.conversations.24.text=你到底要怎样才肯罢手？
LevelNewSeaPeople11.conversations.25.name=伊弗利特
LevelNewSeaPeople11.conversations.25.text=先打一场给我解解闷吧。有什么本事尽管使出来，我正想找点乐子呢！
LevelNewSeaPeople12.triggers.on-battle-task-1.text=炼狱权杖：在第10回合结束前击杀伊弗利特
LevelNewSeaPeople13.text=<html><body>绿洲中的决斗以伊弗利特被打倒在地告终。这阴险的精灵喘着粗气，脸上却挂着笑。<br><br>那株孤零零的棕榈树显然也在混战中挨了几下，水潭周围原本耙得平整的沙地，被杂乱的脚步踩得坑洼不平。<br><br>灯神打了个响指，眼前的景象一阵旋转，转瞬便恢复得整整齐齐，仿佛战斗从未发生。<br><br>伊弗利特环视绿洲，对自己的魔法修复满意地点点头。他拍掉衣服上的沙子，转向众人，脸上仍咧着笑。</body></html>
LevelNewSeaPeople13.conversations.0.name=伊弗利特
LevelNewSeaPeople13.conversations.0.text=这一架可真够激烈，不过不得不说，痛快极了！
LevelNewSeaPeople13.conversations.1.name=安吉拉
LevelNewSeaPeople13.conversations.1.text=很享受是吧？不用就这么停下，我很乐意再给你一枪！
LevelNewSeaPeople13.conversations.2.name=安吉拉
LevelNewSeaPeople13.conversations.2.text=听着，你能不能就此收手？这些人跟我们其他人一样，只是想在这世上谋条生路。
LevelNewSeaPeople13.conversations.3.name=伊弗利特
LevelNewSeaPeople13.conversations.3.text=你想让我放弃新近最喜欢的消遣？我可不答应，更不会白白答应。
LevelNewSeaPeople13.conversations.4.name=安吉拉
LevelNewSeaPeople13.conversations.4.text=拜托。何必搞得这么麻烦，难道现在还得谈条件？
LevelNewSeaPeople13.conversations.5.name=伊弗利特
LevelNewSeaPeople13.conversations.5.text=太容易可就没乐趣了！而且说实话，我需要你帮个忙……
LevelNewSeaPeople13.conversations.6.name=伊弗利特
LevelNewSeaPeople13.conversations.6.text=你看，我的灯……被偷了。在找回它之前，我无法完全施展自己的力量。
LevelNewSeaPeople13.conversations.7.name=伊弗利特
LevelNewSeaPeople13.conversations.7.text=我最多只能变出个海怪幻影。要是能用真的海怪吓唬那一村咸腥腥的傻瓜，该有多开心！
LevelNewSeaPeople13.conversations.8.name=安吉拉
LevelNewSeaPeople13.conversations.8.text=所以你被偷了啊？还有谁比你这混蛋更活该呢！
LevelNewSeaPeople13.conversations.9.name=安吉拉
LevelNewSeaPeople13.conversations.9.text=到底是谁偷了你的灯？
LevelNewSeaPeople13.conversations.10.name=伊弗利特
LevelNewSeaPeople13.conversations.10.text=那群该死的鹰身女妖！你知道，就是风暴山 (Storm Mountains) 上那群。
LevelNewSeaPeople13.conversations.11.name=安吉拉
LevelNewSeaPeople13.conversations.11.text=被鹰身女妖耍了？那些长毛的害虫许过什么愿吗？
LevelNewSeaPeople13.conversations.12.name=伊弗利特
LevelNewSeaPeople13.conversations.12.text=没有，一个愿都没许！趁我出去活动腿脚，她们直接抢走了我漂亮的灯。
LevelNewSeaPeople13.conversations.13.name=安吉拉
LevelNewSeaPeople13.conversations.13.text=散个心还真跑得够远。
LevelNewSeaPeople13.conversations.14.name=伊弗利特
LevelNewSeaPeople13.conversations.14.text=<html><body>我喜欢登山。<br>有助于活血。</body></html>
LevelNewSeaPeople13.conversations.15.name=安吉拉
LevelNewSeaPeople13.conversations.15.text=亮闪闪的东西，鹰身女妖最招架不住这个。偷东西不为别的，只为把主人气个半死，确实是她们的作风。
LevelNewSeaPeople13.conversations.16.name=伊弗利特
LevelNewSeaPeople13.conversations.16.text=要说热衷制造混乱，她们跟我不相上下，这一点我倒是承认。
LevelNewSeaPeople13.conversations.17.name=安吉拉
LevelNewSeaPeople13.conversations.17.text=如果我们帮你找回宝贝灯，你能保证放我朋友们一马吗？
LevelNewSeaPeople13.conversations.18.name=伊弗利特
LevelNewSeaPeople13.conversations.18.text=嗯……我会考虑。
LevelNewSeaPeople13.conversations.19.name=安吉拉
LevelNewSeaPeople13.conversations.19.text=听着，我可不一定非得客客气气。等找回你那只当家的酱汁壶，我大可以许个愿，逼你乖乖听话！
LevelNewSeaPeople13.conversations.20.name=伊弗利特
LevelNewSeaPeople13.conversations.20.text=哼！多么粗俗的提议！
LevelNewSeaPeople13.conversations.21.name=安吉拉
LevelNewSeaPeople13.conversations.21.text=<html><body>所以那群鹰身女妖把巢筑在高处，是吧？<br>能不能再说具体一点？</body></html>
LevelNewSeaPeople13.conversations.22.name=伊弗利特
LevelNewSeaPeople13.conversations.22.text=当然是风暴山 (Storm Mountain)，还能是哪儿！北峰 (Northern Peak)，这么明显！
LevelNewSeaPeople13.conversations.23.name=安吉拉
LevelNewSeaPeople13.conversations.23.text=得了，饶了我吧。不是谁都像你一样无所不知，朋友，我们这儿有些人生来就是凡人。
LevelNewSeaPeople13.conversations.24.name=安吉拉
LevelNewSeaPeople13.conversations.24.text=我们去替你把灯找回来，行了吧？作为交换，别再骚扰这些人！
LevelNewSeaPeople13.conversations.25.name=伊弗利特
LevelNewSeaPeople13.conversations.25.text=<html><body>我可以答应，但有个条件：找回我的灯之后，不许许愿！<br>做到这点，我们就成交。暂时如此。</body></html>
LevelNewSeaPeople13.conversations.26.name=伊弗利特
LevelNewSeaPeople13.conversations.26.text=……不过，要是你们慢慢悠悠，谁知道我又会放出什么阴险的造物，去拜访你那么喜欢的海边村子呢。干等着，我也会无聊的！
LevelNewSeaPeople13.conversations.27.name=安吉拉
LevelNewSeaPeople13.conversations.27.text=是吗？你尽管试试。只要我把你那金浇水壶从鹰身女妖贼手里抢回来，就许愿让你两条胳膊都从手腕处断掉！
LevelNewSeaPeople13.conversations.28.name=伊弗利特
LevelNewSeaPeople13.conversations.28.text=什么？！不，求你，千万别！
LevelNewSeaPeople13.conversations.29.name=安吉拉
LevelNewSeaPeople13.conversations.29.text=好了，我觉得太阳晒得够多了。回村子去，把情况告诉大家吧。
LevelNewSeaPeople14.text=<html><body>安吉拉一行离开荒沙遍地的沙漠，踏上返回海岸的路。既然已经见到了制造海兽幻象的魔法生灵，这桩恐吓村民的谜案似乎离解决不远了。<br><br>离村子只剩一小段路时，安吉拉看见沙滩上空盘旋着黑压压的鸟群，心里顿时不安起来。<br><br>那些看上去不像这一带常见的海鸥。队伍加快了脚步。<br><br>眼前的景象让安吉拉倒吸一口气：一大群凶残贪食的鹰身女妖正在袭击村庄！</body></html>
LevelNewSeaPeople14.location.name=鹰身女妖来袭！ (Harpies!)
LevelNewSeaPeople15.conversations.0.name=鹰身女妖
LevelNewSeaPeople15.conversations.0.text=唳——！唳——！
LevelNewSeaPeople15.conversations.1.name=安吉拉
LevelNewSeaPeople15.conversations.1.text=还真巧！那个诡计多端的灯神才好好“夸”过你们这群臭家伙，你们就送上门来了！
LevelNewSeaPeople15.triggers.on-battle-task-1.text=500金币：在第10回合结束前赢得战斗
LevelNewSeaPeople15.triggers.on-battle-task-2.text=红宝石：在第6回合结束前赢得战斗
LevelNewSeaPeople16.text=<html><body>海族村落一片狼藉。安吉拉一行在沙漠跋涉时，鹰身女妖趁虚而入，劫掠袭击，将这里毁得面目全非。<br><br>海族无力挡住蜂拥而至的敌人，许多村民横躺在水边，有的受伤，有的已死。鹰身女妖带来的恐怖，远非伊弗利特的幻象可比。<br><br>幸存的娜迦因失去族人的卵而哭泣，安吉拉尽力安慰她们。没过多久，海族的悲痛便化为了愤怒。</body></html>
LevelNewSeaPeople16.conversations.0.name=娜迦战士
LevelNewSeaPeople16.conversations.0.text=最糟糕的事……嘶……还是发生了！
LevelNewSeaPeople16.conversations.1.name=潜海者
LevelNewSeaPeople16.conversations.1.text=我们不在的时候，鹰身女妖来了！
LevelNewSeaPeople16.conversations.2.name=安吉拉
LevelNewSeaPeople16.conversations.2.text=看样子，跟偷走那个沙漠混蛋神灯的是同一群。
LevelNewSeaPeople16.conversations.3.name=娜迦战士
LevelNewSeaPeople16.conversations.3.text=这些邪恶的东西，她们……她们偷走了我们的卵！
LevelNewSeaPeople16.conversations.4.name=潜海者
LevelNewSeaPeople16.conversations.4.text=怪物！全都是怪物！
LevelNewSeaPeople16.conversations.5.name=娜迦战士
LevelNewSeaPeople16.conversations.5.text=我们绝不能就这么算了。
LevelNewSeaPeople16.conversations.6.name=安吉拉
LevelNewSeaPeople16.conversations.6.text=可不是，这事真是烂透了。论糟践东西，那群尖叫的恶鬼还真没谁比得上。
LevelNewSeaPeople16.conversations.7.name=安吉拉
LevelNewSeaPeople16.conversations.7.text=如果说有什么比闪亮的宝物更让鹰身女妖着迷，那就是娜迦的卵。我总觉得这一切是个精心布置的局。
LevelNewSeaPeople16.conversations.8.name=娜迦战士
LevelNewSeaPeople16.conversations.8.text=我们必须救回还没孵化的孩子。必须报仇！
LevelNewSeaPeople16.conversations.9.name=安吉拉
LevelNewSeaPeople16.conversations.9.text=当然。咱们去风暴山 (Storm Mountain) 的老巢拜访她们，让她们尝尝别的滋味！
LevelNewSeaPeople17.text=<html><body>鹰身女妖给村子带来的惨状还历历在目，安吉拉与海族以从未有过的速度赶到了风暴山 (Storm Mountain)。<br><br>如果伊弗利特的话可信，鹰身女妖的巢群就在高高的北峰 (Northern Peak) 上。<br><br>安吉拉注意到碎石路旁有一处小聚落。<br><br>不论那是战士们的村子，还是登山者的补给站，都是山脚下一带唯一能找到的文明聚居之所。<br><br>安吉拉带队走进聚落，打算四下看看。</body></html>
LevelNewSeaPeople17.location.name=风暴山 (Storm Mountain)
LevelNewSeaPeople17.conversations.0.name=安吉拉
LevelNewSeaPeople17.conversations.0.text=嘿，咱们抽空跟当地人聊聊吧。怎么爬上这座山又不把命搭进去，听点建议总没坏处。
LevelNewSeaPeople17.conversations.1.name=希德拉
LevelNewSeaPeople17.conversations.1.text=欢迎，旅人们！
LevelNewSeaPeople17.conversations.2.name=赫尔娜
LevelNewSeaPeople17.conversations.2.text=姑娘，什么风把你吹到我们这座山来了？
LevelNewSeaPeople17.conversations.3.name=安吉拉
LevelNewSeaPeople17.conversations.3.text=哎呀，你们两位可真是我见过最彪悍的女人！我觉得自己在这儿一定很自在。
LevelNewSeaPeople17.conversations.4.name=安吉拉
LevelNewSeaPeople17.conversations.4.text=我们想找条最快通往山顶的路。你们有什么建议？
LevelNewSeaPeople17.conversations.5.name=希德拉
LevelNewSeaPeople17.conversations.5.text=你会飞吗？
LevelNewSeaPeople17.conversations.6.name=赫尔娜
LevelNewSeaPeople17.conversations.6.text=哈哈哈！
LevelNewSeaPeople17.conversations.7.name=安吉拉
LevelNewSeaPeople17.conversations.7.text=笑话不错。如你所见，我这些旅伴在水里可比在天上有底气。
LevelNewSeaPeople17.conversations.8.name=赫尔娜
LevelNewSeaPeople17.conversations.8.text=没错，看着就像游泳冠军。等冬天冰雪消融时再来吧，顺着融雪水往上游，说不定更有希望。
LevelNewSeaPeople17.conversations.9.name=安吉拉
LevelNewSeaPeople17.conversations.9.text=<html><body>好主意，一点挖苦的意思都没有！<br>可惜这事等不了。还有别的办法吗？</body></html>
LevelNewSeaPeople17.conversations.10.name=希德拉
LevelNewSeaPeople17.conversations.10.text=嗯……价钱合适的话，我们也许可以带你们上山。
LevelNewSeaPeople17.conversations.11.name=露萝拉
LevelNewSeaPeople17.conversations.11.text=喂！等等。我们不是说好了吗？当向导的活要靠掷骰子来分！
LevelNewSeaPeople17b.conversations.0.name=露萝拉
LevelNewSeaPeople17b.conversations.0.text=你不能一飞过来，就把每个旅人都揽到自己翅膀底下！
LevelNewSeaPeople17b.conversations.1.name=赫尔娜
LevelNewSeaPeople17b.conversations.1.text=<html><body>哼！早起的鸟儿有虫吃。我们祖祖辈辈都是这么干的。<br>当然，露萝拉，你又懂什么女武神的传统呢！</body></html>
LevelNewSeaPeople17b.conversations.2.name=露萝拉
LevelNewSeaPeople17b.conversations.2.text=你还真是一有机会就拿这个挖苦我。我是收养来的，不像你一出生就在族里，那又怎样！
LevelNewSeaPeople17b.conversations.3.name=露萝拉
LevelNewSeaPeople17b.conversations.3.text=凭我经历的那些事，我对这座山的了解，你们两个鸟脑袋这辈子都比不上！
LevelNewSeaPeople17b.conversations.4.name=赫尔娜
LevelNewSeaPeople17b.conversations.4.text=消停点！我们先看到她的，露萝拉，就这么简单。你要不是整天一头扎在酒杯里，也许早就抢在我们前头了！
LevelNewSeaPeople17b.conversations.5.name=露萝拉
LevelNewSeaPeople17b.conversations.5.text=你还有脸说！要是你也被鹰身女妖绑走，养在她们窝里，你也会有一大堆得靠酒来忘掉的伤心事！
LevelNewSeaPeople17b.conversations.6.name=安吉拉
LevelNewSeaPeople17b.conversations.6.text=冷静点，我可没想挑起什么——
LevelNewSeaPeople17b.conversations.7.name=赫尔娜
LevelNewSeaPeople17b.conversations.7.text=该翻篇了，露萝拉！没人在乎！再这么下去，你永远都别想融入女武神！
LevelNewSeaPeople17b.conversations.8.name=露萝拉
LevelNewSeaPeople17b.conversations.8.text=<html><body>我受够了！<br>约定作废。</body></html>
LevelNewSeaPeople17b.conversations.9.name=露萝拉
LevelNewSeaPeople17b.conversations.9.text=<html><body>既然你那么喜欢传统……<br>那就用老办法解决吧，你这没脑子的！</body></html>
LevelNewSeaPeople17b.conversations.10.name=赫尔娜
LevelNewSeaPeople17b.conversations.10.text=奉陪，鹰身女妖养的杂种！
LevelNewSeaPeople17b.conversations.11.name=希德拉
LevelNewSeaPeople17b.conversations.11.text=<html><body>等等我！<br>哈哈哈！</body></html>
LevelNewSeaPeople18.conversations.0.name=安吉拉
LevelNewSeaPeople18.conversations.0.text=<html><body>哎哟，这群女人真够疯的……<br>我们可以现在加入，也可以等她们先打累了再上。</body></html>
LevelNewSeaPeople18.triggers.on-battle-task-1.text=碎晶之刃：在第8回合结束前赢得战斗
LevelNewSeaPeople19.text=<html><body>山间聚落中的混战终于结束，所有人都弯着腰伏在泥地上，大口喘气。从交战女武神翅膀上扯下的白色羽毛，被微风一撮撮地吹走。<br><br>有翼的女战士们站起身，整理铠甲，同时还在互相狠狠瞪视。空气中剑拔弩张，仿佛马上又要打起来。<br><br>安吉拉试着劝这群内讧的山民讲点道理。</body></html>
LevelNewSeaPeople19.conversations.0.name=安吉拉
LevelNewSeaPeople19.conversations.0.text=老天，希望这一架多少让你们学会了点礼貌！
LevelNewSeaPeople19.conversations.1.name=安吉拉
LevelNewSeaPeople19.conversations.1.text=能不能回到正题？为了让大家不用继续互相啄来啄去，把你们全都雇来当向导，要多少钱？
LevelNewSeaPeople19.conversations.2.name=安吉拉
LevelNewSeaPeople19.conversations.2.text=先说清楚，这趟多半会闹得很难看——我们是来找北峰 (Northern Peak) 那群鹰身女妖打架的。
LevelNewSeaPeople19.conversations.3.name=希德拉
LevelNewSeaPeople19.conversations.3.text=等等！你们是来找……鹰身女妖的？把她们全杀了！
LevelNewSeaPeople19.conversations.4.name=赫尔娜
LevelNewSeaPeople19.conversations.4.text=长毛的魔鬼！尖叫的恶魔！
LevelNewSeaPeople19.conversations.5.name=安吉拉
LevelNewSeaPeople19.conversations.5.text=哇！看来她们惹到的还不止我们。
LevelNewSeaPeople19.conversations.6.name=赫尔娜
LevelNewSeaPeople19.conversations.6.text=天天没完没了，我们想睡觉时，她们就尖叫！
LevelNewSeaPeople19.conversations.7.name=希德拉
LevelNewSeaPeople19.conversations.7.text=把垃圾扔得我们屋顶到处都是，还往我们头上丢骨头！
LevelNewSeaPeople19.conversations.8.name=露萝拉
LevelNewSeaPeople19.conversations.8.text=凡是爪子够得着的，她们什么都偷，连没人看着的孩子也不放过。这事我最清楚！
LevelNewSeaPeople19.conversations.9.name=赫尔娜
LevelNewSeaPeople19.conversations.9.text=肮脏的东西，尤其是她们的女族长拉梅菲森特。这片山里从来没出过比她们更大的祸害。
LevelNewSeaPeople19.conversations.10.name=希德拉
LevelNewSeaPeople19.conversations.10.text=连矮人都算上也是！
LevelNewSeaPeople19.conversations.11.name=安吉拉
LevelNewSeaPeople19.conversations.11.text=那我想问问，要不要帮我们一把，一起办这件事？她们偷走了很重要的东西，我们得拿回来。
LevelNewSeaPeople19.conversations.12.name=希德拉
LevelNewSeaPeople19.conversations.12.text=乐意之至！
LevelNewSeaPeople19.conversations.13.name=露萝拉
LevelNewSeaPeople19.conversations.13.text=把那个该死的巢群灭了，我也许终于能了结这段心结。
LevelNewSeaPeople19.conversations.14.name=露萝拉
LevelNewSeaPeople19.conversations.14.text=……村里这些混蛋也许终于肯放过我了！
LevelNewSeaPeople19.conversations.15.name=赫尔娜
LevelNewSeaPeople19.conversations.15.text=对我们来说，鹰身女妖的血比黄金更值钱。只要能带回一袋拔下来的羽毛和砍断的爪子，平时的向导费就免了！
LevelNewSeaPeople19.conversations.16.name=安吉拉
LevelNewSeaPeople19.conversations.16.text=哇，这可不是一般的凶残，不过这价钱我没意见。
LevelNewSeaPeople19.conversations.17.name=安吉拉
LevelNewSeaPeople19.conversations.17.text=那么，各位女士，请带路！
LevelNewSeaPeople20.location.name=女武神聚落 (Valkyries' Settlement)
LevelNewSeaPeople21.text=<html><body>队伍从女武神聚落出发。有了大开杀戒、剿灭鹰身女妖的承诺，有翼的向导们心满意足地走在前头，领大家来到山脚下，那里有一条险峻崎岖的小路。<br><br>众人沿蜿蜒山道艰难攀登，好几次因松滑的砂砾和滚落的石块险些出事，终于来到一处狭窄的平台。在山间这片平地上，安吉拉发现了一个漆黑的洞口。<br><br>洞口似乎曾被人刻意用沉重的巨石封住，但最近的一次震动移开了堵路的石头。黑暗中没有传来任何声音，无论是鹰身女妖的尖叫，还是别的什么。</body></html>
LevelNewSeaPeople21.selection-text=你要走哪条路？
LevelNewSeaPeople21.location.name=幽灵洞窟 (Ghost Cave)
LevelNewSeaPeople21.triggers.on-select-1.text=去那个洞穴里探探吧！
LevelNewSeaPeople21.triggers.on-select-1.description=探索漆黑的洞穴。
LevelNewSeaPeople21.triggers.on-select-2.text=我们还是继续赶路吧。
LevelNewSeaPeople21.triggers.on-select-2.description=继续上山。
LevelNewSeaPeople21a.text=<html><body>安吉拉点起火把，走入洞穴。洞壁上挂着各种锈迹斑斑的斧头、铠甲和其他按矮人体型打造的装备，狭窄压抑的洞窟中央，地上摆着几个上锁的宝箱。<br><br>最里面的洞壁刻着一组繁复的符文，下方还有一枚家族纹章。看来这里是一位矮人领主的长眠之地，多年来无人惊扰。<br><br>安吉拉按捺不住好奇，想看看箱中藏着什么，便在一个宝箱前跪下，用手枪握柄敲打锁头。<br><br>突然，一道幽灵的身影在她面前浮现。</body></html>
LevelNewSeaPeople21a.conversations.0.name=矮人幽灵
LevelNewSeaPeople21a.conversations.0.text=喂！丫头，你以为自己在干什么？
LevelNewSeaPeople21a.conversations.1.name=安吉拉
LevelNewSeaPeople21a.conversations.1.text=老天，是个穿短裤的闹鬼精！好吧，这下我彻底确定这里是矮人墓了。
LevelNewSeaPeople21a.conversations.2.name=矮人幽灵
LevelNewSeaPeople21a.conversations.2.text=两样你都说对了，丫头。老子虽说过了巅峰有些年头，但你还是得让这把斧头教教规矩。
LevelNewSeaPeople21a.conversations.3.name=矮人幽灵
LevelNewSeaPeople21a.conversations.3.text=<html><body>老子至少还有一两记杀招使得出来！<br>永远别对死者不敬！</body></html>
LevelNewSeaPeople21a.conversations.4.name=安吉拉
LevelNewSeaPeople21a.conversations.4.text=消消气，幽灵大胡子！我很尊重你，只是想瞧瞧你那些漂亮的陪葬品，仅此而已！
LevelNewSeaPeople21a.conversations.5.name=矮人幽灵
LevelNewSeaPeople21a.conversations.5.text=……也包括死者埋下的财宝！
LevelNewSeaPeople21a.conversations.6.name=安吉拉
LevelNewSeaPeople21a.conversations.6.text=<html><body>哦……那就另当别论了。<br>各位，揍这矮个子！</body></html>
LevelNewSeaPeople23.text=<html><body>队伍继续上山，直到小路彻底无法通行。女武神带着安吉拉和同伴们飞过最险峻的一段，众人在一道宽阔裂谷边，落到一片坚实平坦的岩石上重新集结。<br><br>对岸的鹰身女妖巢群一览无余。腐肉与粪便的恶臭从那边飘来，阴云下的天空中，到处都是这些长羽毛的罪魁祸首。<br><br>安吉拉很清楚，直接飞进巢群深处实在太危险。<br><br>最好还是另找一条路绕过去！</body></html>
LevelNewSeaPeople23.conversations.0.name=安吉拉
LevelNewSeaPeople23.conversations.0.text=呕。老天，这股臭味……我从没闻过这么臭的东西！
LevelNewSeaPeople23.conversations.1.name=希德拉
LevelNewSeaPeople23.conversations.1.text=几千只这种祸害挤在一起，就是这个结果……
LevelNewSeaPeople23.conversations.2.name=赫尔娜
LevelNewSeaPeople23.conversations.2.text=这座山头怕是永远都洗不干净了！
LevelNewSeaPeople23.conversations.3.name=安吉拉
LevelNewSeaPeople23.conversations.3.text=早知道如此，跟伊弗利特谈条件时，就该让他变出最强、最神奇的拖把，给这里来次彻底大扫除。
LevelNewSeaPeople23.conversations.4.name=露萝拉
LevelNewSeaPeople23.conversations.4.text=<html><body>呼哟，这地方的味道可真让我想起从前……<br>要是童年能重来，让我付出什么都行！</body></html>
LevelNewSeaPeople23.conversations.5.name=赫尔娜
LevelNewSeaPeople23.conversations.5.text=……
LevelNewSeaPeople23.conversations.6.name=希德拉
LevelNewSeaPeople23.conversations.6.text=……
LevelNewSeaPeople23.conversations.7.name=安吉拉
LevelNewSeaPeople23.conversations.7.text=……
LevelNewSeaPeople23.conversations.8.name=露萝拉
LevelNewSeaPeople23.conversations.8.text=干吗？！
LevelNewSeaPeople23.conversations.9.name=安吉拉
LevelNewSeaPeople23.conversations.9.text=没什么。那么，朋友们，我们该怎么过去？
LevelNewSeaPeople23.conversations.10.name=娜迦战士
LevelNewSeaPeople23.conversations.10.text=嘶……后面似乎有条路能进去……
LevelNewSeaPeople23.conversations.11.name=潜海者
LevelNewSeaPeople23.conversations.11.text=对！我们找到一条隧道，直通那里！
LevelNewSeaPeople23.conversations.12.name=安吉拉
LevelNewSeaPeople23.conversations.12.text=太好了！但愿能打她们个措手不及。各位准备捂好耳朵，她们受惊时的尖叫能把我们全震聋。
LevelNewSeaPeople23.conversations.13.name=安吉拉
LevelNewSeaPeople23.conversations.13.text=好了，进去吧。保持安静，脚步放轻。
LevelNewSeaPeople24.conversations.0.name=希德拉
LevelNewSeaPeople24.conversations.0.text=（看，前面！鹰身女妖，正懒洋洋地待着呢。）
LevelNewSeaPeople24.conversations.1.name=鹰身女妖
LevelNewSeaPeople24.conversations.1.text=嘎嘎，啾啾啾。
LevelNewSeaPeople24.conversations.2.name=鹰身女妖
LevelNewSeaPeople24.conversations.2.text=啾啾啾？嘎，嘎，嘎。
LevelNewSeaPeople24.conversations.3.name=赫尔娜
LevelNewSeaPeople24.conversations.3.text=（我们能打她们个措手不及。动手！）
LevelNewSeaPeople24.triggers.on-battle-task-1.text=高效解毒剂：在第8回合结束前赢得战斗
LevelNewSeaPeople24.triggers.on-battle-task-2.text=英勇药剂：在第5回合结束前赢得战斗
LevelNewSeaPeople25.text=<html><body>安吉拉和同伴们穿出鹰身女妖的洞窟，重见天光。山顶的巢群就在眼前，肮脏杂乱地铺开，到处都是活动着的鹰身女妖。<br><br>许多巢中挤满了刚孵出的幼雏。再往前，一堆娜迦卵放在干草里，被一只显然是巢群首领的鹰身女妖牢牢看着。<br><br>那位气势逼人的鹰身女妖女王拉梅菲森特挥舞着翅膀，把长羽毛的手下指使得团团转。<br><br>随行的一位女武神看见这头领，忍不住大声咒骂起来。行踪暴露了！</body></html>
LevelNewSeaPeople25.location.name=风暴女巫 (Storm Witch)
LevelNewSeaPeople26.conversations.0.name=拉梅菲森特
LevelNewSeaPeople26.conversations.0.text=唳——！！
LevelNewSeaPeople26.conversations.1.name=安吉拉
LevelNewSeaPeople26.conversations.1.text=啊！我的耳朵！
LevelNewSeaPeople26.conversations.2.name=希德拉
LevelNewSeaPeople26.conversations.2.text=什么？
LevelNewSeaPeople26.conversations.3.name=赫尔娜
LevelNewSeaPeople26.conversations.3.text=吵成这样，我什么都听不见！
LevelNewSeaPeople26.conversations.4.name=拉梅菲森特
LevelNewSeaPeople26.conversations.4.text=嘎——！！嘎嘎，唳——！！
LevelNewSeaPeople26.conversations.5.name=安吉拉
LevelNewSeaPeople26.conversations.5.text=那只大个子正扯着嗓子发号施令，显然就是她们的头领！
LevelNewSeaPeople26.conversations.6.name=露萝拉
LevelNewSeaPeople26.conversations.6.text=<html><body>没错，肯定是老妈。<br>永远都是个爱指手画脚的贱人！</body></html>
LevelNewSeaPeople26.conversations.7.name=拉梅菲森特
LevelNewSeaPeople26.conversations.7.text=嘎？嘎、嘎……嘎？嘎？！
LevelNewSeaPeople26.conversations.8.name=露萝拉
LevelNewSeaPeople26.conversations.8.text=好久不见啊，妈！
LevelNewSeaPeople26.conversations.9.name=露萝拉
LevelNewSeaPeople26.conversations.9.text=你的小女儿顺道来看看你，给你个惊喜。
LevelNewSeaPeople26.triggers.on-battle-task-1.text=钻石：在第12回合结束前赢得战斗
LevelNewSeaPeople26.triggers.on-battle-task-2.text=陨铁护甲与陨铁头盔：在第6回合结束前击杀拉梅菲森特
LevelNewSeaPeople27.text=<html><body>山顶满是羽毛与血污，拉梅菲森特和她的族群已被安吉拉与这支出人意料的登山队彻底击溃。整片巢群被扫荡一空，一只鹰身女妖也没留下。<br><br>娜迦们冲向被偷走的卵，逐一清点。点清之后，她们相互点头——谢天谢地，这窝卵还没有一枚被窃贼吃掉。<br><br>安吉拉小心地跨过散落的鹰身女妖尸体，在一片狼藉的巢群中搜寻伊弗利特的灯。</body></html>
LevelNewSeaPeople27.conversations.0.name=安吉拉
LevelNewSeaPeople27.conversations.0.text=谁看到那个沙漠家伙亮闪闪的小玩意儿了？
LevelNewSeaPeople27.conversations.1.name=娜迦战士
LevelNewSeaPeople27.conversations.1.text=这里！嘶……应该就是这个，不过……有点脏。
LevelNewSeaPeople27.conversations.2.name=安吉拉
LevelNewSeaPeople27.conversations.2.text=那个狡猾的魔法师想搬回去住，得先用火把这东西好好净化一遍。我听见里头有什么液体晃来晃去……
LevelNewSeaPeople27.conversations.3.name=潜海者
LevelNewSeaPeople27.conversations.3.text=不如擦一擦，看看会怎样？
LevelNewSeaPeople27.conversations.4.name=安吉拉
LevelNewSeaPeople27.conversations.4.text=哈哈！这倒是个主意。也许能搭伊弗利特的飞毯下山？
LevelNewSeaPeople27.conversations.5.name=安吉拉
LevelNewSeaPeople27.conversations.5.text=来，给这只装模作样的汤盆擦擦亮。
LevelNewSeaPeople27.conversations.6.name=伊弗利特
LevelNewSeaPeople27.conversations.6.text=我应召而来。你的愿望就是我的命——
LevelNewSeaPeople27.conversations.7.name=伊弗利特
LevelNewSeaPeople27.conversations.7.text=喂！是你！
LevelNewSeaPeople27.conversations.8.name=安吉拉
LevelNewSeaPeople27.conversations.8.text=没错，就是我们！虽然上面可能沾了点说不清是什么的鹰身女妖黏液，不过看看我们找到了什么。眼熟吗？
LevelNewSeaPeople27.conversations.9.name=伊弗利特
LevelNewSeaPeople27.conversations.9.text=我漂亮的灯，你们找回来了！还给我，快还给我！
LevelNewSeaPeople27.conversations.10.name=安吉拉
LevelNewSeaPeople27.conversations.10.text=等等！我们有过约定，记得吗？
LevelNewSeaPeople27.conversations.11.name=伊弗利特
LevelNewSeaPeople27.conversations.11.text=……
LevelNewSeaPeople27.conversations.12.name=安吉拉
LevelNewSeaPeople27.conversations.12.text=别再恶作剧了。另外……今天实在累坏了，我还有个小小的请求。对你那会施法的手指来说，应该只需要打个响指。
LevelNewSeaPeople27.conversations.13.name=伊弗利特
LevelNewSeaPeople27.conversations.13.text=哦？最好别是在许愿……
LevelNewSeaPeople27.conversations.14.name=安吉拉
LevelNewSeaPeople27.conversations.14.text=哪算得上。能不能省去我们自己下山的麻烦？
LevelNewSeaPeople27.conversations.15.name=伊弗利特
LevelNewSeaPeople27.conversations.15.text=乐意效劳。我一秒钟都不想在这恶心地方多待，你们也一起走吧。
LevelNewSeaPeople27.conversations.16.name=伊弗利特
LevelNewSeaPeople27.conversations.16.text=阿拉卡赞！
LevelNewSeaPeople28.text=<html><body>伊弗利特双手一拍，一团炫目的闪光云雾笼罩了众人。随着一声幽幽的呼啸，魔法雾气散去，眼前已是北峰 (Northern Peak) 山脚下的女武神聚落。<br><br>比起山顶留下的狼藉，这里真是让人看着舒心！<br><br>女武神们挥拳欢呼。糟践她们山野的鹰身女妖祸患终于被铲除，值得好好庆祝。<br><br>海族村庄终于重获安宁！娜迦的育卵之地恢复了平静，爱恶作剧的伊弗利特今后也会换些不那么吓人的法子找乐子了。</body></html>
LevelNewSeaPeople28.conversations.0.name=长老
LevelNewSeaPeople28.conversations.0.text=安吉拉，你为我们做了一件大好事！我们永远感激你。
LevelNewSeaPeople28.conversations.1.name=安吉拉
LevelNewSeaPeople28.conversations.1.text=小事一桩！下次再有邪恶灯神或者一群吃肉的鸟怪来找麻烦，你们知道该找谁。
LevelNewSeaPeople28.conversations.2.name=提示
LevelNewSeaPeople28.conversations.2.text=<html><body>你已完成 Age of Fear 4 的《风暴山》（The Storm Mountain）扩展！<br>恭喜！请继续你的战役。</body></html>
LevelNewSeaPeopleDefeat.text=<html><body>安吉拉倒在地上，骇人的伤口让她无法呼吸。无论她多么努力，支撑下去的力气仍在一点点流逝。<br><br>海族一直指望着一位英雄，如今她却已不在人世。肆虐村庄的那些力量依然猖獗。<br><br>这些无辜的生灵，也许再也见不到安宁的一天……</body></html>
