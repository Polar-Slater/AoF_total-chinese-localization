# 通用事件第18批：丛林金字塔与法师集市
LevelMagesBazaar01.location.name=法师集市 (Mages Bazaar)
LevelJunglePyramid01.text=<html><body>在一片远离人烟的泥泞沼泽深处，英雄们发现了一座爬满藤蔓的古老阶梯金字塔，透着神秘的气息。<br><br>金字塔的石壁已经开裂剥落，但阶梯顶端那片阴暗入口中的大门依然完好无损，封得严严实实，无法通行。<br><br>仔细查看金字塔底部后，英雄们发现泥地上留有干涸的脚印。这些奇怪的足迹不属于队伍中的任何人。<br><br>看来有人经常通过一处秘密入口来访。冒险者们能解开丛林金字塔 (Jungle Pyramid) 的谜团吗？</body></html>
LevelJunglePyramid01.selection-text=队伍该怎么做？
LevelJunglePyramid01.location.name=金字塔 (Pyramid)
LevelJunglePyramid01.triggers.on-select-1.text=回去吧。
LevelJunglePyramid01.triggers.on-select-1.description=返回世界地图。
LevelJunglePyramid01.triggers.on-select-2.text=搜查四周。
LevelJunglePyramid01.triggers.on-select-2.description=搜查附近区域，寻找线索。
LevelJunglePyramid01.triggers.on-select-3.text=派出木乃伊。
LevelJunglePyramid01.triggers.on-select-3.description=派一具木乃伊走向金字塔。
LevelJunglePyramid01.triggers.on-select-20.text=调试：获得木乃伊。
LevelJunglePyramid02.conversations.0.name=提示
LevelJunglePyramid02.conversations.0.text=英雄们派出一具木乃伊上前。它面前的金字塔石壁顿时轰隆作响，震颤着向两侧分开，露出一道足以通行的入口！
LevelJunglePyramid02.conversations.1.name=提示
LevelJunglePyramid02.conversations.1.text=秘密入口上的魔法只允许古老的守卫进入。你们解开了金字塔的谜题！
LevelJunglePyramid02.conversations.2.name=提示
LevelJunglePyramid02.conversations.2.text=队伍刚踏入昏暗的墓室，几个潜藏其中的黑影便猛然扑出，发起了攻击！
LevelJunglePyramid04.conversations.0.name=博恩皮克尔
LevelJunglePyramid04.conversations.0.text=<html><body>入侵者……终于来了！<br>守住主人的陵墓。</body></html>
LevelJunglePyramid05.text=<html><body>这场战斗漫长而艰苦，那些亡灵仿佛几乎不惧队伍的攻击，但最终还是一个接一个倒下了。<br><br>英雄们撬开沿墙排列、尚未开启的石棺，搜刮到的财宝足以让这番苦战有所回报。<br><br>当他们走出散发着霉味的墓室，重新沐浴在阳光下时，金字塔的石壁开始轰隆作响，隐藏的入口再次封闭。</body></html>
