# 通用事件第9批：黑龙战斗、吟游诗人招募及高塔救援结局。
LevelBlackDragonTreasure02.location.name=黑龙 (Black Dragon)
LevelBlackDragonTreasure02.conversations.0.name=黑龙
LevelBlackDragonTreasure02.conversations.0.text=吼——！！！
LevelBardQuest01.triggers.on-select-1.text=欢迎同道中人加入！
LevelBardQuest01.triggers.on-select-2.text=离我远点，你这怪人！
LevelBardQuest02.text=<html><body>英雄们来到一座阴森堡垒的大门前。堡垒中央的高塔直插天际，群鸦在塔顶盘旋，沉沉乌云笼罩四周。<br><br>这里看不出由谁统治。尽管没有旗帜、纹章或军旗，那股挥之不去的阴森气息，仍让人确信此地已被邪恶势力掌控。<br><br>达里乌斯站在队伍最前方，将那位被囚姑娘的信紧贴胸口，满怀英雄气概地指向高塔。<br><br>“我们是为爱而战的勇士。高尚的英雄们，让我们携手，将这位无辜的佳人救出牢笼！”</body></html>
LevelBardQuest02.location.name=达里乌斯的爱情 (Darius' Love)
LevelBardQuest05.conversations.0.name=姑娘
LevelBardQuest05.conversations.0.text=我的英雄！
LevelBardQuest05.conversations.1.name=达里乌斯
LevelBardQuest05.conversations.1.text=什、什么……？！
LevelBardQuest05.conversations.2.name=姑娘
LevelBardQuest05.conversations.2.text=你打败了囚禁我的恶徒！正如信中所许诺的，我的心就是给你的奖赏。啊，一见到你，我就激动得胸口起伏不已！我们要不要……好好缠绵一番，成全这份炽热的爱？
LevelBardQuest05.conversations.3.name=达里乌斯
LevelBardQuest05.conversations.3.text=（朋友们，这……这简直是虚假宣传！我都开始怀疑，这位“姑娘”的绑架案是她自己安排的。）
LevelBardQuest05.conversations.4.name=达里乌斯
LevelBardQuest05.conversations.4.text=嗯，呃……我一定是漏看了信里的那一段。真的，不必给我们任何报酬！
LevelBardQuest05.conversations.5.name=达里乌斯
LevelBardQuest05.conversations.5.text=营救落难的姑娘，是每一位英雄应尽的义务。我们只是恪尽本分！
LevelBardQuest05.conversations.6.name=达里乌斯
LevelBardQuest05.conversations.6.text=那么，女士，既然您已重获自由，我们就此告辞。没错，下一场冒险想必精彩非凡，我们必须立刻动身！
LevelBardQuest05.conversations.7.name=姑娘
LevelBardQuest05.conversations.7.text=可、可是……你们才刚到，怎么能这就走呢！你那炽热的激情呢？难道你就不渴望一个姑娘的吻吗？
LevelBardQuest05.conversations.8.name=达里乌斯
LevelBardQuest05.conversations.8.text=哦，真的不用了，请相信我。您能平安无事，我们就心满意足了。告辞！
LevelBardQuest05.conversations.9.name=达里乌斯
LevelBardQuest05.conversations.9.text=（快走，朋友们。趁她还没追上来献吻，赶紧离开这里！）
LevelBardQuest05.conversations.10.name=姑娘
LevelBardQuest05.conversations.10.text=……
LevelBardQuest05.conversations.11.name=姑娘
LevelBardQuest05.conversations.11.text=哼！我还以为这回肯定能把他留住，结果呢，又是空欢喜一场。唉……
LevelBardQuest05.conversations.12.name=姑娘
LevelBardQuest05.conversations.12.text=<html><body>算了，只好再雇一批恶徒，把高塔再修一遍。<br>真爱可真费钱！</body></html>
