LevelForestPlayerBase02.text=<html><body>巨石阵 (Stonehenge) 傲然矗立在空地上，修复一新的符文雕刻在阳光下闪闪发亮。四周草木生机盎然，林缘重新茂盛起来，人类王国 (Human Kingdom) 砍伐造成的创伤已得到修复。<br><br>各种森林生物在石阵附近徘徊，其中还有古老的树人。这里正逐渐成为一处庇护所。<br><br>你的慷慨让森林族群深受感动，他们在队伍面前也放松了戒备。你在他们社会中的影响日益扩大，当你提出王位诉求时，他们也开始认真倾听。</body></html>
