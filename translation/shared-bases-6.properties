LevelGreenskinsPlayerBase03.text=<html><body>成片的小屋一直延伸到山谷深处，坚固的木栅栏将整个聚落围了起来。成堆的头骨和兽角点缀其间，这里已是一座威势十足的兽人堡垒！<br><br>新加入酋长军队的士兵在围墙内四处走动，其中还有战争食人魔。据点里遍布的火堆烧得正旺，总算能更好地盖住他们的臭味了！<br><br>英雄们走近堡垒入口，绿皮们顿时欢呼起来。</body></html>
