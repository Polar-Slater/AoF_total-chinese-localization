LevelDwarvesPlayerBase02.text=<html><body>雇来的侏儒清洁工做事一丝不苟，让堡垒重新变得适宜居住。<br><br>矮人们放下扫帚和拖把，拿起锤子与凿子，开始在山体上雕刻一座气势不凡、遍布符文的大门。<br><br>锤打铁砧的声响与满溢泡沫的酒杯碰撞声在大厅中回荡，炖汤的浓郁香气几乎完全取代了陈腐气味。机械构装体来回搬运柴火和酒桶，表明工坊已经恢复运转。<br><br>矮人的生活气息，正重新回到这座山中家园。</body></html>
