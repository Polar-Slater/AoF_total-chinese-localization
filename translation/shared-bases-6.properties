LevelHumanPlayerBase01.text=<html><body>为了嘉奖你对人类王国 (Human Kingdom) 的忠诚与卓越贡献，威廉国王赐给你一小块土地，让你有机会在故土开创新生活。<br><br>村民虽然不多，但来访者都看得出，他们吃穿不愁，生活安乐。<br><br>领地仍然简陋，前方还有许多艰苦工作，不过，对一个小领主来说，这已是不错的开端。<br><br>一个推着满车草皮的农工发现队伍到来，深深鞠了一躬。只要投资得当，你的领民便能拥有远不止耕田种地的未来！</body></html>
LevelHumanPlayerBase01.selection-text=<html><body>你的队伍打算怎么做？<br>（你拥有 ${gold} 金币）</body></html>
LevelHumanPlayerBase01.location.name=骑士领地 (Knight's Estate)
LevelHumanPlayerBase01.triggers.on-select-1.text=这里没别的事了。
LevelHumanPlayerBase01.triggers.on-select-1.description=返回世界地图。
LevelHumanPlayerBase01.triggers.on-select-2.text=招募或升级部队。
LevelHumanPlayerBase01.triggers.on-select-2.description=招募新兵或升级现有部队。=BR=（升级据点可提高新兵的经验等级。）
LevelHumanPlayerBase01.triggers.on-select-3.text=升级骑士领地 (Knight's Estate)（2根金条、2,000金币）。
LevelHumanPlayerBase01.triggers.on-select-3.description=升级人类据点（2根金条、2,000金币）。=BR=* 农民每日缴纳土地税。=BR=* 修道院 (Abbey) 可为你的部队赐福。=BR=* 解锁铁匠铺 (Blacksmith)。=BR=* 解锁赌室 (Gambling Room)。=BR=* 招募的单位为老兵。
LevelHumanPlayerBase01.triggers.on-select-20.text=调试：给予物品。
LevelHumanPlayerBase02.text=<html><body>一座朴素的城堡拔地而起，周围的农民正辛勤耕种肥沃的田地。<br><br>村民虽不多，这片新兴的封地却发展顺利。<br><br>周围的树林已经清理，木材被制成坚固的栅栏，围住村落。村庄正飞速发展！<br><br>各种待雇的士兵走在街上，铁匠开了铺子，围墙内还有许多其他生意在经营。<br><br>昔日茂密的荒林，如今已成为井然有序的繁荣聚落。</body></html>
