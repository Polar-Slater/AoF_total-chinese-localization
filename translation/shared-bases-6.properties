LevelForestPlayerBase03.text=<html><body>巨石阵 (Stonehenge) 的宏伟如今已充分展现，成为森林族群王国中心的奇观。就连银色森林 (Silver Forest) 中那些平日胆小、畏惧陌生人的神秘生灵，也被它的壮丽吸引而来。<br><br>石阵的神奇力量让周围草木加速生长，一棵参天巨树拔地而起，为王国所有居民撑起荫蔽。<br><br>森林族群由衷感谢你所做的一切！</body></html>
