LevelForestPlayerBase01.text=<html><body>银色森林 (Silver Forest) 深处，森林族群的王国与外界隔绝。他们与自然和谐共生，守护银色森林 (Silver Forest)，让森林和自己的社会一同繁盛。<br><br>森林族群通常不会把冒险者当朋友迎接。人类王国 (Human Kingdom) 不断侵占森林，粗暴地砍伐树木，也摧毁了他们的信任。一旦遭到挑衅，他们便会以惊人的决心驱逐一切入侵者。<br><br>林妖负责最先接触旅人，决定谁能进来一探究竟，谁又会被弓箭瞄准后背。<br><br>英雄们穿过灌木丛，来到一片宽阔空地，中央立着一座摇摇欲坠的石制建筑。身后传来弓弦松开的轻响——藏在暗处的林妖，已准许你们安全进入。</body></html>
