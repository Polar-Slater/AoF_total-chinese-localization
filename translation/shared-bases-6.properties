LevelUndeadPlayerBase02.text=<html><body>废墟中央建起了一座祭坛。祭坛散发的黑暗能量，开始吸引沼泽中徘徊的邪恶生物。<br><br>除了上次来访时见到的僵尸与骷髅，如今还有更多种类的亡灵在废墟中游荡。<br><br>这里已逐渐成为亡灵聚集的巢穴。<br><br>若能继续汇聚足够强大的黑暗力量，终有一天，最强大的复生之物也会栖居于此。</body></html>
