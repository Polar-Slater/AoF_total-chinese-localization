LevelChaosPlayerBase02.text=<html><body>传送门扩大了，从中闪烁的魔光也愈发强烈。<br><br>阶梯两侧，雕刻过的石柱上燃起熊熊烈火，让这里越来越像真正的地狱。<br><br>传送门仍不足以让最强大的混沌军势通过，不过，还有继续扩建的余地。</body></html>
