LevelSeaPeoplePlayerBase03.text=<html><body>海族聚落又向前迈出了一大步。如今，海滩上遍布渔民的小屋，远方驶来的商船也常年停泊在码头旁。<br><br>这里已经成为热门商路上不可或缺的一站。多亏那些嗅觉敏锐、志向远大的商人，海族独有的货物正销往王国各地。<br><br>它或许还称不上“都城”，但曾经的小村庄经过升级扩建，已变成商贸中心和游览胜地。<br><br>（推进游戏进度，可解锁更多兵种。）</body></html>
