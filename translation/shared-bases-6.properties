LevelDwarvesPlayerBase01.text=<html><body>一群流离失所的矮人翻遍了整条山脉，终于找到一座废弃已久的堡垒，准备在此安家。清除堵在入口的碎石和头骨后，他们走进其中，探寻这里的往事。<br><br>走廊上散落着各种骨骸和腐烂遗体，都是最后一场大战留下的惨景，昔日居民也在那场战斗中尽数覆灭。空气滞涩，陈年的腐臭浓得化不开，想清理干净，恐怕要费不少工夫。<br><br>队伍抵达时，矮人们正陆续走回阳光下，趁清扫新家园的间隙休息一下，掸去胡须上的灰尘。<br><br>“喂，你们几个！还站着干什么？愿意过来搭把手的话，我们可不会拒绝！”</body></html>
