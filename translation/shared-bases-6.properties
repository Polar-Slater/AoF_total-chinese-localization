LevelHumanPlayerBase03.text=<html><body>昔日的小村庄已发展成一座规模不大却繁荣的城市。<br><br>各路商人纷纷前来售卖货物，这里成了商路上一处令人期待的新站点。<br><br>高耸的石墙取代了木栅栏，随着季节更替，城中的军队兵种愈加丰富，技艺也更加娴熟。<br><br>威廉国王将这片土地交给你这位领主，实在是明智之举。这里正成为人类王国 (Human Kingdom) 的骄傲！<br><br>干得好，领主大人！</body></html>
