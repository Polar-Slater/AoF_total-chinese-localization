# Shared locations batch 6: eight faction bases and their local text.
LevelChaosPlayerBase01.text=<html><body>远远望去，火山侧面的裂缝似乎只是毫不起眼的自然景观。<br><br>若有冒险者胆敢靠近查看，就会发现裂缝中藏着一道直通冥界 (Underworld) 的传送门。<br><br>……当然，前提是这位好奇的探险者足够幸运，没被守在附近的恶魔抓住，卖作奴隶！<br><br>英雄们刚踏进火山，就被那些在浓烟中振翅飞舞的凶恶魔物发现了。</body></html>
LevelChaosPlayerBase01.selection-text=<html><body>你的队伍打算怎么做？<br>（你拥有 ${gold} 金币）</body></html>
