LevelGreenskinsPlayerBase01.text=<html><body>一位强大的兽人酋长带着新兴的氏族，在这片山谷中定居。如今这里还只是几间简陋的小屋，但这些雄心勃勃的绿皮，显然打算将它建成一座庞大的堡垒。<br><br>酋长小屋旁的小火堆冒着浓烟，飘向阴沉的天空。队伍刚走近，一声尖锐的口哨便响了起来——氏族发现你们了！<br><br>一只年轻地精从火堆旁跑来迎接。他上下打量英雄们，随后朝身后的聚落做了个手势。</body></html>
