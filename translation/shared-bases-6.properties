LevelSeaPeoplePlayerBase01.text=<html><body>奉威廉国王之命，这片小小的海滩被赐给了海族。虽然普通人尚未完全接纳这些来自深海的盟友，但他们寄人篱下的日子似乎即将结束。<br><br>为了照顾王国上下的情绪，国王特意选了这处僻静的沙滩，让海族能够安稳地开始新生活。<br><br>这些勤劳的定居者已经建起一些简朴的房屋，足以供少数居民栖身，不过，仍有许多工作要做。<br><br>（升级据点并推进游戏进度，可解锁更多兵种。）</body></html>
