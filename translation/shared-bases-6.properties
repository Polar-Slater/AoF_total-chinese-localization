LevelRatmenPlayerBase02.text=<html><body>地下到处都是忙碌的身影和新建的建筑。高脚屋如今已伸向主洞穴的高高穹顶，当地的产业也开始成形。<br><br>许多人的生意似乎已十分兴隆，各有犯罪专长的鼠人来来往往，忙得不亦乐乎。地上人类的口袋，想必一天比一天轻了！<br><br>扩建用地已经清理出来，氏族的许多成员正忙着收集建材。<br><br>巢穴已准备好迎接更大的发展！</body></html>
