LevelDwarvesPlayerBase03.text=<html><body>堡垒入口两侧如今立着巨大的花岗岩雕像。这些精雕细琢的矮人巨像双眼镶着闪耀的红宝石，向来访者宣告：一位强大的矮人领主居住于此。<br><br>无论装饰还是守备，都不惜重金。激光炮管构装体与手持金斧的战士守在入口阶梯旁，随时准备砸碎不速之客的脑袋。<br><br>主厅已完全恢复到矮人的标准，麦酒源源不断。工坊全力运转，炉火的轰鸣和锻打金属的声音，汇成一曲永不停歇的矮人颂歌。<br><br>矮人的财富与力量展露无遗：这里再次成为了英雄的家园！</body></html>
