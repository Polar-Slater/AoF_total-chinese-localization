LevelChaosPlayerBase03.text=<html><body>传送门已扩大到最初的两倍。如今，即使远在天边，也不可能忽视火山裂缝中迸出的邪恶电光。<br><br>一道炼狱般的拱门环绕着旋转的能量，将其力量汇聚起来，为从冥界 (Underworld) 召来更强大的恶魔铺平道路。<br><br>混沌领域中最凶恶的存在已经准备就绪，等待侍奉新的主人！</body></html>
