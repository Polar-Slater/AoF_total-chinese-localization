LevelUndeadPlayerBase01.text=<html><body>沼泽的浓雾让这些残破的废墟更显阴森。再没有比这里更适合建立一座恐怖的亡灵巢穴了。<br><br>瓦砾几乎还未清理，召集邪恶势力的呼唤却已经传开。<br><br>幽魂在雾中飘荡，带疫的乌鸦在天空盘旋，喉间发出的嘶哑叫声，警告胆小的冒险者切勿靠近。<br><br>队伍穿过残垣断壁，一队骷髅巡逻兵蹒跚着出现，空洞的眼窝猛然转向你们。下颌骨兴奋地咔嗒作响，宣告你们的到来。</body></html>
