LevelRatmenPlayerBase03.text=<html><body>如今，地穴中高楼林立，街道热闹非凡。这座巢穴已逐渐成为一座不逊于地表的城市。<br><br>鼠人执法者和鼠人卫士四处巡逻，氏族的毒药师正加紧打造一批酸液炮。<br><br>地下的鼠人技术与技艺从未如此先进。如果人类王国 (Human Kingdom) 从前就觉得鼠人可怕，如今恐怕更不知道该如何应对他们了。<br><br>地表能提供的东西，如今巢穴里几乎都能找到！</body></html>
