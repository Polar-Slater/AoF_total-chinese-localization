LevelGreenskinsPlayerBase02.text=<html><body>兽人聚落比以往更加热闹。木制瞭望台四处可见，氏族旗帜迎风飘扬，数十座新建的小屋上挂满了战利品。<br><br>旺盛的篝火升起一道烟柱，旁边的烤肉架不停转动。然而，一群前来投效酋长的巨魔身上散发的臭味，竟盖过了烤野猪的诱人香气。<br><br>照这样的速度发展下去，这里一定会成为这一带最强大的绿皮要塞！</body></html>
