LevelUndeadPlayerBase03.text=<html><body>这座亡灵之城已变得真正令人胆寒。黑暗能量浓郁到足以让有此意愿的死灵法师超越人类之身，化为巫妖。<br><br>一名黑骑士守在祭坛旁。祭坛上举行的仪式，让上方的旗帜溅满了血污。<br><br>呻吟声与骨头摩擦声从四面八方传来，像隐隐作痛的伤口，挥之不去。这里的邪恶已达到顶峰。<br><br>甚至有人见到一头骨龙在外围徘徊！</body></html>
