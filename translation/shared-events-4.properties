# Shared events batch 4: linked choices and the Blademaster duel introduction.
LevelGlobalEvents10.triggers.on-select-15.text=上前制止这场斗殴！
LevelGlobalEvents10.triggers.on-select-15.description=阻止决斗。
LevelGlobalEvents10.triggers.on-select-16.text=别插手，让他们玩个痛快。
LevelGlobalEvents10.triggers.on-select-16.description=任由决斗继续。
LevelGlobalEvents10.triggers.on-select-17.text=过去跟他们谈谈！
LevelGlobalEvents10.triggers.on-select-17.description=走近兽人营地。=BR=（可能发生战斗！）
LevelGlobalEvents10.triggers.on-select-18.text=管他们呢，别理会。
LevelGlobalEvents10.triggers.on-select-18.description=返回世界地图。
LevelGlobalEvents40.triggers.on-select-13.text=到此为止！不准再烤地精了。
LevelGlobalEvents40.triggers.on-select-13.description=只吃掉那只野生地精。
LevelGlobalEvents40.triggers.on-select-14.text=让他们再烤一只地精。
LevelGlobalEvents40.triggers.on-select-14.description=你队伍中的一只地精也将被吃掉！=BR=（每名兽人获得100点经验值。）
LevelGlobalEvents40.triggers.on-select-15.text=开宴吧！把所有地精都吃了！
LevelGlobalEvents40.triggers.on-select-15.description=所有地精都将被吃掉！=BR=（每名兽人获得250点经验值。）
LevelGlobalEvents40.triggers.on-select-26.text=他恐怕教不了我们什么，走吧。
LevelGlobalEvents40.triggers.on-select-26.description=返回世界地图。
LevelGlobalEvents40.triggers.on-select-27.text=他哪里像个大师？分明是个骗子！
LevelGlobalEvents40.triggers.on-select-27.description=当面指责他是骗子。=BR=（将开始一场战斗！）
LevelGlobalEvents40.triggers.on-select-28.text=我们不配接受这位老前辈的教诲。
LevelGlobalEvents40.triggers.on-select-28.description=礼貌地婉拒训练的提议。
LevelGlobalEvents40.triggers.on-select-44.text=让食人魔去看看。
LevelGlobalEvents40.triggers.on-select-44.description=派一名食人魔调查仓库。=BR=（可能发生战斗！）
LevelGlobalEvents40.triggers.on-select-45.text=不了，纯粹浪费时间。
LevelGlobalEvents40.triggers.on-select-45.description=返回世界地图。
LevelGlobalEvents40.triggers.on-select-50.text=搜刮村庄，拿走所有值钱的东西！
LevelGlobalEvents40.triggers.on-select-50.description=在遭洗劫的村庄中寻找财宝。=BR=（小心，可能发生战斗！）
LevelGlobalEvents40.triggers.on-select-51.text=这破村子没什么值得我们停留的。
LevelGlobalEvents40.triggers.on-select-51.description=返回世界地图。
LevelGlobalEvents40.triggers.on-select-52.text=恐吓幸存者，抢走他们的金币！
LevelGlobalEvents40.triggers.on-select-52.description=拿走所有金币！=BR=（你的兽人会恐吓幸存者。）
LevelGlobalEvents40.triggers.on-select-53.text=派死灵法师唤起尸体！
LevelGlobalEvents40.triggers.on-select-53.description=你的死灵法师会唤起几具骷髅。
LevelGlobalEventBlademasterHero01.conversations.0.name=提示
LevelGlobalEventBlademasterHero01.conversations.0.text=你指责老者想骗走你的金币。他拔出剑，向你发起挑战——来一场生死决斗！
