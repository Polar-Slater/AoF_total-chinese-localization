# 通用事件第13批：月之神殿、月亮井及方尖碑。
LevelMoonWell01.text=<html><body>在一片被遗忘的沼泽深处，英雄们发现了一座精巧的神殿。经年累月肆意生长的草木，早已将它重重掩盖。<br><br>墙上雕刻着优美而别致的符文，似乎描绘了种种陌生的星座。<br><br>冒险者们小心踩过泥泞，绕着神殿探寻，终于找到了正门。<br><br>高大的石门巍然矗立，精细的雕纹横贯门面，展现着月相的盈亏变化。<br><br>英雄们使尽全力推门，石门却纹丝不动。他们发现了一个很大的钥匙孔，可往里看去，似乎并没有连着任何机关。</body></html>
LevelMoonWell01.selection-text=要打开神殿的大门吗？
LevelMoonWell01.location.name=月之神殿 (Temple of The Moon)
LevelMoonWell01.triggers.on-select-1.text=暂时不了，我们回去吧。
LevelMoonWell01.triggers.on-select-1.description=返回世界地图。
LevelMoonWell01.triggers.on-select-2.text=打开神殿大门。
LevelMoonWell01.triggers.on-select-2.description=用月之钥打开神殿大门。
LevelMoonWell01.triggers.on-select-20.text=调试：获得月之钥。
LevelMoonWell02.text=<html><body>大门缓缓敞开，英雄们走进寂静的神殿，四下洒满月光。<br><br>一汪秀美的天然水池散发着迷人的光芒。他们越走越近，井水也愈发明亮，绚丽的蓝光汇聚在井边的木柱周围。<br><br>英雄们透过水面上的弯月倒影，望见池底散落着一些金币。<br><br>这里弥漫着一种深邃莫测的气息，仿佛井水本身就蕴藏着无穷智慧。<br><br>看着前人留下的供品，冒险者们不禁猜想：若也献上些贵重之物，能否从中获得几分知识？</body></html>
LevelMoonWell02.selection-text=要献上供品吗？
LevelMoonWell02.location.name=月亮井 (Moon Well)
LevelMoonWell02.triggers.on-select-1.text=暂时不了，我们回去吧。
LevelMoonWell02.triggers.on-select-1.description=返回世界地图。
LevelMoonWell02.triggers.on-select-2.text=献上贝壳。
LevelMoonWell02.triggers.on-select-2.description=献上1枚贝壳，全体单位各获得10点经验值。
LevelMoonWell02.triggers.on-select-3.text=献上银锭。
LevelMoonWell02.triggers.on-select-3.description=献上1块银锭，全体单位各获得40点经验值。
LevelMoonWell02.triggers.on-select-4.text=献上蓝宝石。
LevelMoonWell02.triggers.on-select-4.description=献上1颗蓝宝石，全体单位各获得60点经验值。
LevelMoonWell02.triggers.on-select-5.text=献上珍珠。
LevelMoonWell02.triggers.on-select-5.description=献上1颗珍珠，全体单位各获得70点经验值。
LevelMoonWell02.triggers.on-select-6.text=献上红宝石。
LevelMoonWell02.triggers.on-select-6.description=献上1颗红宝石，全体单位各获得80点经验值。
LevelMoonWell02.triggers.on-select-7.text=献上金锭。
LevelMoonWell02.triggers.on-select-7.description=献上1块金锭，全体单位各获得100点经验值。
LevelMoonWell02.triggers.on-select-8.text=献上钻石。
LevelMoonWell02.triggers.on-select-8.description=献上1颗钻石，全体单位各获得200点经验值。
LevelMoonWell02.triggers.on-select-20.text=调试：添加物品。
LevelManaObelisks01.text=<html><body>冒险者们面前，漆黑岩石雕成的魔法方尖碑如利刃般刺出冰川，在呼啸的暴风雪中高高耸立。<br><br>英雄们走近时，感到脚下积雪传来的震动越来越强。这些方尖碑想必深深扎入地下，其中显然还蕴藏着尚未释放的力量。<br><br>队伍越靠近方尖碑，身上的魔法物品就越是嗡嗡作响。看来，富含魔力的物品或许正是解开此地秘密的关键。<br><br>冒险者们能揭开这些奇异方尖碑的谜团吗？</body></html>
LevelManaObelisks01.selection-text=队伍该怎么做？
LevelManaObelisks01.location.name=四座方尖碑 (Four Obelisks)
LevelManaObelisks01.triggers.on-select-1.text=我们回去吧。
LevelManaObelisks01.triggers.on-select-1.description=返回世界地图。
LevelManaObelisks01.triggers.on-select-2.text=堆放魔力碎片。
LevelManaObelisks01.triggers.on-select-2.description=在方尖碑旁堆放魔力碎片（至少需持有7枚；将消耗持有的魔力碎片，最多999枚）。
LevelManaObelisks01.triggers.on-select-20.text=调试：添加物品。
LevelManaObelisks02.text=<html><body>四座方尖碑 (Four Obelisks) 仍立在原处，与冒险者们离开时一模一样，但这里似乎已有所不同。先前从积雪中传来的震动消失了。<br><br>英雄们试遍各种咒语与仪式，又在石碑表面挥动各式魔法物品，石碑却毫无反应。<br><br>曾经涌动在这片冰川上的魔力，似乎已经散去。<br><br>突然，风雪愈发猛烈，刺骨的寒风比先前呼啸得更加凶狠。冒险者们最好也尽快离开。</body></html>
