# 通用事件第28批：死亡中的重逢与狼人支线结局
LevelWerewolf18.text=<html><body>不久，英雄们便抵达了暗影沼泽 (Shadow Marshes)。空气中弥漫着各种腐物散发的污浊恶臭，这一季沼泽正迅速扩张，气味也愈发浓烈。<br><br>传闻有个死灵法师正在王国的这一带建立新的据点，如今看来，恐怕确有其事。<br><br>队伍找到一条通往沼泽深处的清晰小径，循路而入，来到一座仓促建起的陵墓前。<br><br>恰在冒险者们到达时，一个身披黑袍的身影从陵墓泛着光的入口走了出来。<br><br>队伍严阵以待，一场战斗已不可避免。</body></html>
LevelWerewolf18.location.name=死亡中的重逢 (Reunion in Death)
LevelWerewolf20a.conversations.0.name=芬
LevelWerewolf20a.conversations.0.text=你好啊，死灵法师先生！
LevelWerewolf20a.conversations.1.name=古尔卡尔
LevelWerewolf20a.conversations.1.text=啊！不，怎么又是你们！
LevelWerewolf20a.conversations.2.name=吉尔洛克
LevelWerewolf20a.conversations.2.text=芬，你认得这阴森森的家伙？
LevelWerewolf20a.conversations.3.name=芬
LevelWerewolf20a.conversations.3.text=这张脸有点眼熟……不过，咱们搅黄过好几场死灵法师的聚会，都快分不清谁是谁了。
LevelWerewolf20a.conversations.4.name=吉尔洛克
LevelWerewolf20a.conversations.4.text=可不是嘛，都差不多。
LevelWerewolf20a.conversations.5.name=谢拉
LevelWerewolf20a.conversations.5.text=冈瑟！
LevelWerewolf20a.conversations.6.name=冈瑟
LevelWerewolf20a.conversations.6.text=谢拉？谢拉！！你怎么变成这样了？！
LevelWerewolf20a.conversations.7.name=谢拉
LevelWerewolf20a.conversations.7.text=我们的女儿，把她从这个恶魔手里救出来！求你了，冈瑟！
LevelWerewolf20a.conversations.8.name=芬
LevelWerewolf20a.conversations.8.text=死灵法师先生，咱们这位狗狗朋友和他那看着像幽灵的妻子，有个人类女儿。我们要护送她离开你的沼泽。
LevelWerewolf20a.conversations.9.name=古尔卡尔
LevelWerewolf20a.conversations.9.text=你们很快就会加入我的亡灵军团！
LevelWerewolf20a.conversations.10.name=吉尔洛克
LevelWerewolf20a.conversations.10.text=<html><body>啊，非得动粗是吧？<br>正合我意。</body></html>
LevelWerewolf20a.conversations.11.name=芬
LevelWerewolf20a.conversations.11.text=顺便告诉你，我看这位狗狗绅士也想跟你聊两句。
LevelWerewolf20a.conversations.12.name=冈瑟
LevelWerewolf20a.conversations.12.text=<html><body>吼——！<br>我现在就把你撕成碎片！</body></html>
LevelWerewolf20a.triggers.on-battle-task-1.text=纯净魔力×2：在第十回合结束前杀死古尔卡尔
LevelWerewolf20a.triggers.on-battle-task-2.text=酸蚀之剑：在第十二回合结束前赢得战斗
LevelWerewolf20b.conversations.0.name=巴尔瓦
LevelWerewolf20b.conversations.0.text=喂，那边那个！临死前有什么想说的，还是咱们直接动手？
LevelWerewolf20b.conversations.1.name=古尔卡尔
LevelWerewolf20b.conversations.1.text=什么……？你们到底是谁？
LevelWerewolf20b.conversations.2.name=奈丽
LevelWerewolf20b.conversations.2.text=巴尔瓦，别这么没礼貌。想杀一个陌生人，总该先向人家解释原因。
LevelWerewolf20b.conversations.3.name=巴尔瓦
LevelWerewolf20b.conversations.3.text=……
LevelWerewolf20b.conversations.4.name=古尔卡尔
LevelWerewolf20b.conversations.4.text=……
LevelWerewolf20b.conversations.5.name=奈丽
LevelWerewolf20b.conversations.5.text=说呀，巴尔瓦？
LevelWerewolf20b.conversations.6.name=巴尔瓦
LevelWerewolf20b.conversations.6.text=好吧。我们是来找冈瑟的女儿的。看见没，浑身毛的那个就是冈瑟，然后……
LevelWerewolf20b.conversations.7.name=谢拉
LevelWerewolf20b.conversations.7.text=冈瑟！
LevelWerewolf20b.conversations.8.name=冈瑟
LevelWerewolf20b.conversations.8.text=谢拉？谢拉！！你怎么变成这样了？！
LevelWerewolf20b.conversations.9.name=谢拉
LevelWerewolf20b.conversations.9.text=我们的女儿，把她从这个恶魔手里救出来！求你了，冈瑟！
LevelWerewolf20b.conversations.10.name=冈瑟
LevelWerewolf20b.conversations.10.text=<html><body>我现在就把你撕成碎片！<br>吼——！</body></html>
LevelWerewolf20b.conversations.11.name=巴尔瓦
LevelWerewolf20b.conversations.11.text=<html><body>看见了吧，奈丽？<br>几句话就能解决这么多事。</body></html>
LevelWerewolf20b.triggers.on-battle-task-1.text=纯净魔力×2：在第十回合结束前杀死古尔卡尔
LevelWerewolf20b.triggers.on-battle-task-2.text=酸蚀之剑：在第十二回合结束前赢得战斗
LevelWerewolf21.text=<html><body>战斗结束了。死灵法师和他的亡灵仆从全被打倒，再也不动了。<br><br>冒险者们搜遍四周，在陵墓后部发现了一间密室。他们撞开门，找到一个被捆住的女孩。她昏迷不醒，但还活着。<br><br>无论死灵法师原本打算拿这个被绑来的姑娘举行何种骇人的仪式，她都已逃过这一劫，可以继续活下去了。<br><br>冈瑟心情沉重地作出决定：最好将女儿安置在圣教会的庇护下，让她远离这份邪恶。</body></html>
LevelWerewolf21.conversations.0.name=安吉拉
LevelWerewolf21.conversations.0.text=不，爸爸，不要。
LevelWerewolf21.conversations.1.name=冈瑟
LevelWerewolf21.conversations.1.text=我亲爱的安吉拉，我也心如刀绞，可我必须离开。我是头野兽，猎人们永远不会放过我。
LevelWerewolf21.conversations.2.name=安吉拉
LevelWerewolf21.conversations.2.text=<html><body>在我心里，你才不是野兽！<br>别走，别走……</body></html>
LevelWerewolf21.conversations.3.name=冈瑟
LevelWerewolf21.conversations.3.text=孩子，这是最好的办法。圣教会会保护你，给你我再也无法给你的生活。
LevelWerewolf21.conversations.4.name=安吉拉
LevelWerewolf21.conversations.4.text=爸爸，我跟你一起住在森林里！我会学着战斗，我能帮你抵挡那些猎人！
LevelWerewolf21.conversations.5.name=冈瑟
LevelWerewolf21.conversations.5.text=跟着我，你就会一直身处险境。承认这一点让我痛不欲生，可背负着这可怕的诅咒，我已经没法做你的父亲了。
LevelWerewolf21.conversations.6.name=安吉拉
LevelWerewolf21.conversations.6.text=<html><body>不，不，不，不要……爸爸，不要……<br>求你了，别丢下我！</body></html>
LevelWerewolf21.conversations.7.name=冈瑟
LevelWerewolf21.conversations.7.text=别无选择了，安吉拉。我不能再让你冒险。我会在树林里，远远守着你。
LevelWerewolf21.conversations.8.name=冈瑟
LevelWerewolf21.conversations.8.text=永远别忘了，我爱你！答应我，无所畏惧地活下去；答应我，永远不要向邪恶屈服。
LevelWerewolf21.conversations.9.name=安吉拉
LevelWerewolf21.conversations.9.text=爸爸……我答应你……
LevelWerewolf21.conversations.10.name=冈瑟
LevelWerewolf21.conversations.10.text=<html><body>我的好女儿，我会多么想念你。<br>有圣教会照顾你，你会平安的。</body></html>
LevelWerewolf22.selection-text=要让冈瑟加入队伍吗？
LevelWerewolf22.conversations.0.name=冈瑟
LevelWerewolf22.conversations.0.text=女儿终于安全了。我心爱的安吉拉……她下落不明，我就没有一天能安心。
LevelWerewolf22.conversations.1.name=冈瑟
LevelWerewolf22.conversations.1.text=把她托付给别人，让我心痛不已。可只有这样，才能让那些追逐她的邪恶远离她。
LevelWerewolf22.conversations.2.name=冈瑟
LevelWerewolf22.conversations.2.text=如今这副模样，我已无法重返人类社会。如果你们愿意，我可以与你们一同冒险。
LevelWerewolf22.conversations.3.name=冈瑟
LevelWerewolf22.conversations.3.text=朋友们，你们做了这么多，让我终于得以安心。至少让我这样报答你们吧。
LevelWerewolf22.conversations.4.name=提示
LevelWerewolf22.conversations.4.text=<html><body>你已完成《Age of Fear 3》的“血与月”扩展剧情！<br>恭喜！</body></html>
LevelWerewolf22.conversations.5.name=提示
LevelWerewolf22.conversations.5.text=<html><body>冈瑟可以永久加入队伍，陪你继续征战！<br>要让他加入吗？</body></html>
LevelWerewolf22.triggers.on-select-1.text=当然，欢迎他加入！
LevelWerewolf22.triggers.on-select-1.description=冈瑟加入你的队伍。
LevelWerewolf22.triggers.on-select-2.text=流的血已经够多了。
LevelWerewolf22.triggers.on-select-2.description=不带冈瑟，继续旅程。
