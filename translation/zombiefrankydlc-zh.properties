# 维克多的实验：按当前关卡XML完整覆盖114条内容。
CAMPAIGN=vampirehuntercampaign
LOCALE=zh
LevelZombieFranky01.text=<html><body>在仙灵森林 (Fairy Forest) 一片被遗忘的区域深处，一栋老旧建筑孤零零地矗立在尘土飞扬的荒地上。饱经风霜的外墙表明，这里已经荒废多年。<br><br>设施入口附近散落着各式破损工具，几十年的风沙将它们磨得坑坑洼洼、锈迹斑斑。也许工作人员撤离得太匆忙，沿途掉落了手里的东西；又或许，是内部的爆炸把它们抛散到了这里。<br><br>正门上挂着一把硕大的铁锁，但岁月早已侵蚀了这道夸张的防线。只消用肩膀猛顶一下，脆弱的锁梁便应声裂开，发出令人满意的脆响。<br><br>神秘建筑的大门吱嘎着打开，露出一道通往地下的漆黑楼梯……</body></html>
LevelZombieFranky01.location.name=废弃设施 (Abandoned Facility)
LevelZombieFranky02.text=<html><body>台阶上积着厚厚的灰烬。墙壁想必曾经洁白无瑕、保持无菌，如今却泛着病态的暗黄。前方台阶上没有任何脚印，看来从正门上锁以来，就再没人走下过这道楼梯。<br><br>楼梯尽头是一座拱顶大厅，四条较窄的走廊从这里分岔。每条走廊上方都钉着一块手绘标牌，想来写的是尽头房间的名称：“图书室 (Library)”“工坊 (Workshop)”“实验室 (Experiments)”和“档案室 (Archive)”。<br><br>通往档案室 (Archive) 的路口被一大堆无法穿越的碎石堵死，建筑的这一角似乎已经坍塌。不过，除了这条走不通的通道，设施其余部分看起来还算完好。</body></html>
LevelZombieFranky02.selection-text=英雄们要怎么做？
LevelZombieFranky02.location.name=废弃设施 (Abandoned Facility)
LevelZombieFranky02.triggers.on-select-1.text=进入通往图书室 (Library) 的通道。
LevelZombieFranky02.triggers.on-select-2.text=进入通往工坊 (Workshop) 的通道。
LevelZombieFranky02.triggers.on-select-3.text=进入通往实验室 (Experiments) 的通道。
LevelZombieFranky02.triggers.on-select-4.text=返回地面。
LevelZombieFranky03.text=<html><body>图书室 (Library) 没上锁的门轻易便被推开，露出数量惊人的典籍与珍奇物件。这里简直是一座令人肃然起敬的知识殿堂，一排排书架上堆满瓶装标本和学术著作。<br><br>霉味弥漫的空气中，还能感到一丝残留的黑暗魔法，但施法者肯定早已离开。奥术研究想必只是个次要项目，这里收藏的绝大多数物件都纯粹用于学术研究。<br><br>房间里塞了太多东西，令人不知该先查看什么。一张橡木书桌上摞着的几本书吸引了你的目光，旁边书架上的一排典籍也同样引人注意。</body></html>
LevelZombieFranky03.selection-text=要仔细查看图书室 (Library) 里的什么东西吗？
LevelZombieFranky03.triggers.on-select-1.text=查看桌上的书。
LevelZombieFranky03.triggers.on-select-2.text=查看书架上的书。
LevelZombieFranky03.triggers.on-select-3.text=搜索房间。
LevelZombieFranky03.triggers.on-select-4.text=返回主走廊。
LevelZombieFrankyLibraryBooks.triggers.on-select-1.text=查看《我来，我见，我征服》（Veni, Vidi, Vici）。
LevelZombieFrankyLibraryBooks.triggers.on-select-2.text=查看《内省对谈话题》（Introspective Conversation Topics）。
LevelZombieFrankyLibraryBooks.triggers.on-select-3.text=查看《骨科关节复位》（Orthopaedic Rearticulations）。
LevelZombieFrankyLibraryBooks.triggers.on-select-4.text=查看《微生物分析》（Microbial Analysis）。
LevelZombieFrankyLibraryBooks.triggers.on-select-5.text=查看《构造圈领域研究》（Studies of Tectosphere Empire）。
LevelZombieFrankyLibraryBooks.triggers.on-select-6.text=查看《罗克雷玛学》（Rhochrematics）。
LevelZombieFrankyLibraryBooks.triggers.on-select-10.text=离开书堆。
LevelZombieFranky04.text=<html><body>实验室 (Experiments) 的门轻易便被打开。台面和工作台上摆满了组装程度不一的科研设备，其中许多看起来都是独一无二的实验装置。这里肯定开展过各种大规模的科学实验！<br><br>除非这里的工作人员还有人在世，否则恐怕几乎没人能按原本的设计使用这些装置。这些研究究竟想达成什么目的，又是什么让它们戛然而止？<br><br>房间中央一座升起的平台吸引了你的注意。它足够长，能让人形实验对象平躺其上；两端的皮带想必是用来束缚实验对象的。</body></html>
LevelZombieFranky04.selection-text=英雄们要怎么做？
LevelZombieFranky04.triggers.on-select-1.text=搜索房间。
LevelZombieFranky04.triggers.on-select-2.text=返回走廊。
LevelZombieFranky05.text=<html><body>标着工坊 (Workshop) 的黑暗通道明显比其他通道更宽、更高，仿佛是为了运送超大件货物。这里当年究竟在研发什么？<br><br>通道尽头是一扇金库般的金属门，却看不到可用来打开它的把手或摇柄。稍加寻找，你便发现封闭入口旁的墙上嵌着一块奇怪的按键板。<br><br>如果这把密码锁仍能运作，看来唯一的进入方法，就是输入正确的密码。</body></html>
LevelZombieFranky05.selection-text=要试着开锁吗？
LevelZombieFranky05.triggers.on-select-1.text=查看密码锁。
LevelZombieFranky05.triggers.on-select-2.text=返回大厅。
LevelZombieFrankyPuzzleLock.triggers.on-select-1.text=按下 ${puzzle-lock-char-A} 按钮。
LevelZombieFrankyPuzzleLock.triggers.on-select-2.text=按下 ${puzzle-lock-char-B} 按钮。
LevelZombieFrankyPuzzleLock.triggers.on-select-3.text=按下 ${puzzle-lock-char-C} 按钮。
LevelZombieFrankyPuzzleLock.triggers.on-select-10.text=不试了！
LevelZombieFrankyPuzzleLock.triggers.on-select-10.description=重置密码锁并退出。
LevelZombieFranky06.text=<html><body>沿通道继续向里走，一间宽敞的圆形厅室映入眼帘，里面装满了奇特的科研设备。<br><br>粗大的电缆乱七八糟地铺了一地，将一台台古怪装置连接起来。一块带轮黑板后，半遮半掩地露出一架窄梯，通向天花板上的舱口，想必能登上实验室屋顶。<br><br>厅室中央摆着一座精巧的基座，上面放着一个硕大的玻璃罐。不论这沉重容器原本装的是什么，如今里面都只有一个人脑，漂浮在略显浑浊的溶液中。</body></html>
LevelZombieFranky06.selection-text=队伍要怎么做？
LevelZombieFranky06.triggers.on-select-1.text=走近罐中的大脑。
LevelZombieFranky06.triggers.on-select-2.text=搜索工坊 (Workshop)，寻找线索。
LevelZombieFranky06.triggers.on-select-3.text=返回走廊。
LevelZombieFrankyBrainInJar.triggers.on-select-1.text=答应帮忙。
LevelZombieFrankyBrainInJar.triggers.on-select-2.text=呃……我得考虑一下。
LevelZombieFrankyBrainInJar.triggers.on-select-4.text=来给你造副新身体吧！
LevelZombieFrankyBrainInJar.triggers.on-select-5.text=我们进展不错……
LevelZombieFrankyBrainInJar.triggers.on-select-20.text=调试：给予物品。
LevelZombieFranky07a.conversations.0.name=维克多的大脑
LevelZombieFranky07a.conversations.0.text=妙极了！我们拼出了个多么魁梧的家伙——我都等不及要“亲自驾驶”了。
LevelZombieFranky07a.conversations.1.name=维克多的大脑
LevelZombieFranky07a.conversations.1.text=配上这副重建的身躯，我似乎也该给自己换个新名字……
LevelZombieFranky07a.conversations.2.name=维克多的大脑
LevelZombieFranky07a.conversations.2.text=哦，不过现在，我们得转移到屋顶。还有一项关键因素不太受我们控制，那就是天气。
LevelZombieFranky07a.conversations.3.name=维克多的大脑
LevelZombieFranky07a.conversations.3.text=<html><body>扳下那个开关，我们脚下的平台就会穿过工坊升上去。<br>再扳下旁边那个，就能展开引雷阵列。</body></html>
LevelZombieFranky07a.conversations.4.name=维克多的大脑
LevelZombieFranky07a.conversations.4.text=如你所见，我们已经万事俱备，只等从苍穹中收集电力。哦，这阵凉风，是不是带着点雨意？
LevelZombieFranky07a.conversations.5.name=维克多的大脑
LevelZombieFranky07a.conversations.5.text=<html><body>运气好的话，天气就会转为暴风雨。用不了多久，咱们可就得重新自我介绍了！<br>说到这个，名字，名字……</body></html>
LevelZombieFranky07a.conversations.6.name=维克多的大脑
LevelZombieFranky07a.conversations.6.text=你觉得……弗朗西斯怎么样？嗯，仔细想想，太正式了。得轻松些，随意些……
LevelZombieFranky07a.conversations.7.name=维克多的大脑
LevelZombieFranky07a.conversations.7.text=哦，有了——弗兰基！对，太合适了。多亲切的名字，一点也不古板。
LevelZombieFranky07b.text=<html><body>拼缝而成的怪物仰躺在高台上，畸形的头部拖出一团电线，一直连接到维克多玻璃罐下方的基座。<br><br>天色恰好在此时暗了下来，厚重的雨云遮住了太阳。不久，远处传来低沉的滚滚雷声。<br><br>空气中弥漫着紧绷的气息，仿佛随时会有一道闪电从天而降，击中实验室屋顶的引雷阵列。<br><br>轰——！伴着嘶响、刺目的闪光与震耳欲聋的巨响，一股强大的电流被阵列捕获了！</body></html>
LevelZombieFranky07b.conversations.0.name=维克多的大脑
LevelZombieFranky07b.conversations.0.text=正面击中了！快，趁电力充足，扳下开关！
LevelZombieFranky07b.conversations.1.name=维克多的大脑
LevelZombieFranky07b.conversations.1.text=啊——！！
LevelZombieFranky07b.conversations.2.name=维克多的大脑
LevelZombieFranky07b.conversations.2.text=……等等，我的意识没转移过去？我还在这该死的罐子里！
LevelZombieFranky07b.conversations.3.name=维克多的大脑
LevelZombieFranky07b.conversations.3.text=电力还够，再来一次！
LevelZombieFranky07b.conversations.4.name=维克多的大脑
LevelZombieFranky07b.conversations.4.text=啊——！！！……
LevelZombieFranky07b.conversations.5.name=？？？
LevelZombieFranky07b.conversations.5.text=……哈……哈哈……哈！成……成功了！我感觉到了……我的新身体。名字……我需要一个新名字。叫我弗兰基吧。
LevelZombieFranky07b.conversations.6.name=弗兰基
LevelZombieFranky07b.conversations.6.text=这双手里蕴藏的力量……我感觉到了……！
LevelZombieFranky07b.conversations.7.name=弗兰基
LevelZombieFranky07b.conversations.7.text=（呜噜噜……）
LevelZombieFranky07b.conversations.8.name=弗兰基
LevelZombieFranky07b.conversations.8.text=等等，不对劲。我没……我根本控制不了！
LevelZombieFranky07b.conversations.9.name=弗兰基
LevelZombieFranky07b.conversations.9.text=呜——……
LevelZombieFranky07b.conversations.10.name=弗兰基
LevelZombieFranky07b.conversations.10.text=哦……不！天哪，这里面不只有我。这个大脑原来的主人，它——
LevelZombieFranky07b.conversations.11.name=弗兰基
LevelZombieFranky07b.conversations.11.text=吼——！！！
LevelZombieFranky07b.conversations.12.name=弗兰基
LevelZombieFranky07b.conversations.12.text=——它还不肯放手！快离开这里，这里不安全！
LevelZombieFranky07b.conversations.13.name=弗兰基
LevelZombieFranky07b.conversations.13.text=<html><body>吼——！！！<br>饿……好饿……</body></html>
LevelZombieFranky08.triggers.on-battle-task-1.text=雷霆魔杖：在第5回合结束前赢得战斗
LevelZombieFranky09.text=<html><body>复生的怪物跪倒在地，摇着头，仿佛想驱散脑中的迷雾。眼下还看不出，究竟是哪一个人格掌控着这副庞大躯体。<br><br>头顶的风暴开始消散。不能再指望老天降下一道致命闪电了！<br><br>怪物神情木然地站起身，向前迈出充满威胁的一步。英雄们本能地向后退去。</body></html>
LevelZombieFranky09.selection-text=要让弗兰基加入吗？
LevelZombieFranky09.conversations.0.name=弗兰基
LevelZombieFranky09.conversations.0.text=（呜噜噜……）
LevelZombieFranky09.conversations.1.name=弗兰基
LevelZombieFranky09.conversations.1.text=……
LevelZombieFranky09.conversations.2.name=弗兰基
LevelZombieFranky09.conversations.2.text=哦……哎呀，哎呀……
LevelZombieFranky09.conversations.3.name=弗兰基
LevelZombieFranky09.conversations.3.text=看来这回给那个旧脑子上了一课！实在抱歉，刚才那场内部冲突多少有些出乎意料。
LevelZombieFranky09.conversations.4.name=弗兰基
LevelZombieFranky09.conversations.4.text=你们把我从玻璃牢笼里解放出来，这份感激真是难以言表！
LevelZombieFranky09.conversations.5.name=弗兰基
LevelZombieFranky09.conversations.5.text=哦，我多么盼望能再伸伸腿啊……
LevelZombieFranky09.conversations.6.name=弗兰基
LevelZombieFranky09.conversations.6.text=多亏了你们，我又有腿了！瞧这漂亮的双腿，你们对人体结构可真有眼光。
LevelZombieFranky09.conversations.7.name=弗兰基
LevelZombieFranky09.conversations.7.text=能否允许我加入你们的事业，报答这份慷慨？
LevelZombieFranky09.conversations.8.name=弗兰基
LevelZombieFranky09.conversations.8.text=跟你们同行，正好让我好好了解这副时髦的新身体究竟有多大本事！
LevelZombieFranky09.triggers.on-select-1.text=当然！非常欢迎弗兰基加入。
LevelZombieFranky09.triggers.on-select-2.text=不，我们的队伍已经满了。
LevelZombieFrankyDefeat.text=<html><body>一记足以粉碎全身骨骼的重拳落下，你支离破碎的身体在暴雨中瘫倒。意识消散前，你最后听见的是一声怪物般的低吼——复生的巨人跃下屋顶，奔向自由。<br><br>再无人能约束它无意识的狂怒，这头复生怪物开始肆虐毫无防备的乡野。就连无辜孩童在花丛间嬉戏的景象，也无法遏制它失控的嗜血欲望。<br><br>涉足尚未彻底理解的力量，务必小心！你的失败为这片国土释放出一种新的恐怖，夺走了无数性命，当然也包括你自己的。</body></html>
