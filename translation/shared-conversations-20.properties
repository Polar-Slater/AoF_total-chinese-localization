# 通用对话第20批：世界之结
SXX_WorldKnot_FailureReturn.conversations.0.name=提示
SXX_WorldKnot_FailureReturn.conversations.0.text=真遗憾！这场挑战确实艰难无比。世界之结 (World Knot) 已将你的英雄们毫发无损地送回原本的时间线。
SXX_WorldKnot_VictoryReturn.conversations.0.name=提示
SXX_WorldKnot_VictoryReturn.conversations.0.text=<html><body>你们在另一条时间线中挺过了险境，活着回来了！<br>恭喜！</body></html>
SXX_WorldKnot_VictoryReturn.conversations.1.name=提示
SXX_WorldKnot_VictoryReturn.conversations.1.text=你们的介入是否改变了历史？谁知道呢！这个问题，只有过去的英雄们才能回答……
SXX_WorldKnot_enter.conversations.0.name=提示
SXX_WorldKnot_enter.conversations.0.text=<html><body>只有你的英雄会进入世界之结 (World Knot)。<br>战斗结束后，你的军队会恢复。</body></html>
