LevelTranquilGrove01.triggers.on-select-4.description=消耗2株幼苗，一名菌人加入队伍。=BR=单位的经验取决于游戏进度。
LevelTranquilGrove01.triggers.on-select-5.text=培育沼泽藤蔓（2株幼苗）
LevelTranquilGrove01.triggers.on-select-5.description=消耗2株幼苗，一株沼泽藤蔓加入队伍。=BR=单位的经验取决于游戏进度。
