# 通用事件第15批：宁静林地与灵魂之井。
LevelSoulsWell01.text=<html><body>这座阴森的城堡曾是强大而可怖的亡灵之王的居所。昔日，它是邪恶的象征，令一切生灵胆寒。直到爱德华爵士率领正义之师深入巢穴腹地，亡灵之王残酷的统治才终于终结。<br><br>许多人相信，亡灵之王力量的奥秘，在于他能够汲取这座巢穴下方黑色土地中封存的黑暗能量。<br><br>通往冥界 (underworld) 的大门或许已经关闭，可无数无辜者曾在这座污秽的宫殿中惨遭杀害，他们饱受折磨的灵魂也许永远无法安息。<br><br>盘踞于此的邪恶生物早已被击溃，但挥之不去的恐惧仍笼罩着这座荒凉的堡垒。只有最勇敢的英雄才敢踏足其中。</body></html>
LevelSoulsWell01.selection-text=英雄们要进去吗？
LevelSoulsWell01.location.name=灵魂之井 (Well of Souls)
LevelSoulsWell01.triggers.on-select-1.text=暂时不了，离开这片受诅咒的地方吧。
LevelSoulsWell01.triggers.on-select-1.description=返回世界地图。
LevelSoulsWell01.triggers.on-select-2.text=好，我们进去。
LevelSoulsWell01.triggers.on-select-2.description=进入灵魂之井 (Souls Well)。
LevelSoulsWell02.text=<html><body>英雄们穿过幽暗的走廊，来到一间圆形厅室，中央有一口深井。<br><br>爱德华爵士那次改变命运的远征留下了满地骸骨。队伍小心绕过骨堆，走到井边，向下望去，只见漆黑如墨的井水翻涌不休。<br><br>很久以前，血祭便已污染了这里的井水。这片邪恶之地曾施加于人的无尽苦难，至今仍刻在墙上：砖石间交叠的划痕与抓痕，诉说着绝望的俘虏如何拼命挣扎，试图逃过献祭的匕首。<br><br>想必只要付出鲜血，就能换来黑暗的赏赐。英雄们愿意献上祭品吗？</body></html>
LevelSoulsWell02.selection-text=要进行献祭吗？
LevelSoulsWell02.location.name=灵魂之井 (Well of Souls)
LevelSoulsWell02.triggers.on-select-1.text=暂时不了，我们回去吧。
LevelSoulsWell02.triggers.on-select-1.description=返回世界地图。
LevelSoulsWell02.triggers.on-select-2.text=献祭地精。
LevelSoulsWell02.triggers.on-select-2.description=献祭一名地精，获得黑暗匕首。=BR=此类献祭仅限一次。
LevelSoulsWell02.triggers.on-select-3.text=献祭矮人。
LevelSoulsWell02.triggers.on-select-3.description=献祭一名矮人，获得死亡战士护甲。=BR=此类献祭仅限一次。
LevelSoulsWell02.triggers.on-select-4.text=献祭骑士。
LevelSoulsWell02.triggers.on-select-4.description=献祭一名骑士，获得幻影之盾。=BR=此类献祭仅限一次。
LevelSoulsWell02.triggers.on-select-5.text=献祭巨魔。
LevelSoulsWell02.triggers.on-select-5.description=献祭一名巨魔，获得死亡战士头盔。=BR=此类献祭仅限一次。
LevelSoulsWell02.triggers.on-select-6.text=献祭鹰身女妖。
LevelSoulsWell02.triggers.on-select-6.description=献祭一名鹰身女妖，获得全视之眼。=BR=此类献祭仅限一次。
LevelSoulsWell02.triggers.on-select-7.text=献祭兽人。
LevelSoulsWell02.triggers.on-select-7.description=献祭一名兽人，获得燃烧战斧。=BR=此类献祭仅限一次。
LevelSoulsWell02.triggers.on-select-8.text=献祭菌人。
LevelSoulsWell02.triggers.on-select-8.description=献祭一名菌人，获得荆棘手镯。=BR=此类献祭仅限一次。
LevelSoulsWell02.triggers.on-select-9.text=献祭祭司。
LevelSoulsWell02.triggers.on-select-9.description=献祭一名祭司，获得地狱之盾。=BR=此类献祭仅限一次。
LevelSoulsWell02.triggers.on-select-10.text=献祭死灵法师。
LevelSoulsWell02.triggers.on-select-10.description=献祭一名死灵法师，获得骨烛。=BR=此类献祭仅限一次。
LevelSoulsWell02.triggers.on-select-20.text=调试：添加单位。
LevelTranquilGrove01.text=<html><body>英雄们深入梦境森林 (Dream Forest)，来到一片葱郁的林地前。阳光穿过随风摇曳的树冠，照亮了满眼苍翠。<br><br>一只毛茸茸的小动物正在头顶的树间翻找东西，无意间碰落了一颗果实。果实直坠而下，险些砸中一位英雄的脑袋。<br><br>冒险者们脚下的大地忽然隆隆震动。他们刚向后一跃，一株树苗便从果实落地的地方破土而出。<br><br>英雄们惊叹地看着树苗越长越高，转眼间便与林中四周的大树一般无二。<br><br>看来，这片林地蕴藏着某种魔力，能让种下的植物飞速生长。或许英雄们也可以试着种下找到的幼苗？</body></html>
LevelTranquilGrove01.selection-text=<html><body>你想培育哪种植物？<br>（你有${item-SeedlingItem-count}株幼苗。）</body></html>
LevelTranquilGrove01.location.name=宁静林地 (Tranquil Grove)
LevelTranquilGrove01.triggers.on-select-1.text=暂时不了，我们回去吧。
LevelTranquilGrove01.triggers.on-select-1.description=返回世界地图。
LevelTranquilGrove01.triggers.on-select-2.text=培育幼树人（5株幼苗）
LevelTranquilGrove01.triggers.on-select-2.description=消耗5株幼苗，一名幼树人加入队伍。=BR=单位的经验取决于游戏进度。
