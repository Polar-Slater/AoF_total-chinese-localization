LevelGlobalEventSpiderCave01.conversations.0.name=提示
LevelGlobalEventSpiderCave01.conversations.0.text=队伍沿着隧道前进，最终来到一片庞大的洞穴群。然而，这里似乎到处都是蜘蛛！
LevelGlobalEventMushroomsCircle01.conversations.0.name=林妖
LevelGlobalEventMushroomsCircle01.conversations.0.text=喂！你们在干什么？
LevelGlobalEventMushroomsCircle01.conversations.1.name=树人
LevelGlobalEventMushroomsCircle01.conversations.1.text=<html><body>擅……闯……<br>偷……蘑……菇。</body></html>
LevelGlobalEventMushroomsCircle01.conversations.2.name=林妖
LevelGlobalEventMushroomsCircle01.conversations.2.text=真是傲慢！大自然可不是专为你们享用而存在的！
LevelGlobalEventIkeaWarehouse01.conversations.0.name=伊凯乌斯
LevelGlobalEventIkeaWarehouse01.conversations.0.text=你们进来干什么？还没开门营业呢。出去！
LevelGlobalEventIkeaWarehouse01.conversations.1.name=伊凯乌斯
LevelGlobalEventIkeaWarehouse01.conversations.1.text=……
LevelGlobalEventIkeaWarehouse01.conversations.2.name=伊凯乌斯
LevelGlobalEventIkeaWarehouse01.conversations.2.text=<html><body>没听见我说话吗？<br>现在不营业！</body></html>
LevelGlobalEventIkeaWarehouse01.conversations.3.name=伊凯乌斯
LevelGlobalEventIkeaWarehouse01.conversations.3.text=好吧，既然你们非要闯进来，就随你们的便。尽管看我的货物，后果自负！
