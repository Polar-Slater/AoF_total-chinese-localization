INVISIBLE_UNIT_HINT=<html><body>拥有<u>隐形</u>属性的单位无法被对手看见！<br>（无论对手是你还是电脑，都一样。）<br><br>如果对手靠得很近，或隐形单位发动攻击、使用技能或法术，<br>隐形单位就可能被发现。<br>（若隐形敌人挡在路上，正在移动的单位会停下！）<br><br><b>布设陷阱、饮用药剂等不会产生可见效果的行动，</b><br><b>不会解除隐形。</b><br><br>某些特殊技能也允许单位在攻击时保持隐藏，例如<u>伪装</u>。<br><br>波动攻击、爆炸等范围攻击也能发现隐形单位。<br>隐形单位对范围法术和攻击拥有额外防御。<br><br><i>电脑会尝试悄悄靠近，在你毫无防备时发动攻击！</i><br></body></html>
S_HAS_BEEN_BURROWED_HINT=<html><body><b>{0}</b>已潜入地下！<br><br>潜地是鼠人及其他特殊单位拥有的独特能力。<br>即使敌人从上方经过，也不会发现潜地单位。<br>这些单位还能在地下缓慢穿行，避开侦测。<br><br>但潜地单位无法无限期留在地下，<br>经过一定回合数后会自动钻出地面。<br><br>敏锐感官、探测者和光源等能力可暴露潜地单位。<br></body></html>
