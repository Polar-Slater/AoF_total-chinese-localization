# 通用事件第8批：驯兽师挑战、灯神愿望及全部关联结局。
LevelDjinLamp01.triggers.on-select-2.text=我想变得富有！
LevelDjinLamp01.triggers.on-select-3.text=我想变得坚不可摧！
LevelDjinLamp01.triggers.on-select-4.text=我想拥有健康的身体！
LevelDjinLamp01.triggers.on-select-5.text=我想来一场冒险！
LevelDjinLamp01.triggers.on-select-6.text=我想要一件你的东西！
LevelDjinLamp01.triggers.on-select-7.text=我想让灯神加入我的队伍！
LevelDjinLamp01.triggers.on-select-8.text=我想再许五个愿望！
LevelDjinLamp01.triggers.on-select-9.text=回你的灯里去，永远别再出来！
LevelDefeatDjin.text=<html><body>“你的愿望实现了！”灯神笑着说。他那狡黠的神情让冒险者们隐隐不安。他们觉得这个愿望似乎出了什么岔子，可现在已经无法反悔了。<br><br>灯神用早已被遗忘的语言低声念出几句咒语，一阵麻木感顿时席卷全队。英雄们的身体迅速僵硬，渐渐动弹不得。他们想惊呼、想逃走，身体却已不听使唤。<br><br>转眼间，整支队伍都化作了坚硬的岩石。更可怕的是，灯神让他们在石化之后仍然保持着清醒的意识。<br><br>如今，英雄们成了活生生的石像，坚不可摧，将屹立数千年！</body></html>
